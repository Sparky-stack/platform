# A pointer to the value in OpenBao (project mount kv-tenant-demo), never the value itself (README "Secrets").
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: hello-world-greeting
spec:
  template:
    type: Opaque
  data:
    - secretKey: greeting
      remoteRef:
        key: hello-world
        property: greeting
