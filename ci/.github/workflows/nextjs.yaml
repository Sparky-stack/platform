name: nextjs

# Next.js app: package-manager detection (npm/pnpm/yarn via lockfile), lint,
# typecheck, test, next build (cached), dependency audit + Trivy fs, CodeQL
# (javascript-typescript), then container.yaml. Expects `output: "standalone"`
# and a Dockerfile like templates/dockerfiles/nextjs.Dockerfile.
#
# Required caller permissions:
#   contents: read, actions: read, packages: write, id-token: write,
#   attestations: write, security-events: write

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory containing package.json'
        required: false
        type: string
        default: '.'
      node_version:
        description: 'Node.js version (overrides .nvmrc/.node-version/.tool-versions/package.json engines)'
        required: false
        type: string
        default: ''
      run_lint:
        description: 'Run the lint script'
        required: false
        type: boolean
        default: true
      run_typecheck:
        description: 'Run the typecheck script (or tsc --noEmit)'
        required: false
        type: boolean
        default: true
      run_test:
        description: 'Run the test script'
        required: false
        type: boolean
        default: true
      run_audit:
        description: 'Run npm/pnpm/yarn audit of production deps'
        required: false
        type: boolean
        default: true
      audit_level:
        description: 'Audit failure level: low, moderate, high, critical'
        required: false
        type: string
        default: 'critical'
      run_codeql:
        description: 'Run CodeQL (javascript-typescript)'
        required: false
        type: boolean
        default: true
      build_container:
        description: 'Build/scan/sign the container image after checks'
        required: false
        type: boolean
        default: true
      image_name:
        description: 'Image name (default: repository name)'
        required: false
        type: string
        default: ''
      registry:
        description: 'Registry prefix (default ghcr.io/<owner>)'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context (default working_directory)'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Dockerfile (default <working_directory>/Dockerfile)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated image platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      multiarch_strategy:
        description: 'native (per-arch runners) or qemu'
        required: false
        type: string
        default: 'native'
      build_args:
        description: 'Newline-separated extra build-args'
        required: false
        type: string
        default: ''
      push:
        description: 'Push, attest and sign on non-PR events'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Severities that fail the Trivy scans (image and lockfiles)'
        required: false
        type: string
        default: 'CRITICAL'
      trivy_ignore_unfixed:
        description: 'Ignore unfixed vulnerabilities'
        required: false
        type: boolean
        default: true
      trivy_ignore_file:
        description: 'Repo-relative .trivyignore(.yaml) with accepted risks'
        required: false
        type: string
        default: ''
      trivy_fail:
        description: 'Fail on Trivy findings at trivy_severity'
        required: false
        type: boolean
        default: true
    secrets:
      registry_username:
        description: 'Registry username (non-GHCR registries)'
        required: false
      registry_password:
        description: 'Registry password/token (non-GHCR registries)'
        required: false
    outputs:
      image:
        description: 'Image reference tagged with the short SHA'
        value: ${{ jobs.container.outputs.image }}
      image_ref:
        description: 'Alias of image'
        value: ${{ jobs.container.outputs.image_ref }}
      image_repo:
        description: 'Image repository without tag'
        value: ${{ jobs.container.outputs.image_repo }}
      digest:
        description: 'Manifest-list digest'
        value: ${{ jobs.container.outputs.digest }}
      image_digest_ref:
        description: 'Immutable <repo>@sha256:... reference'
        value: ${{ jobs.container.outputs.image_digest_ref }}
      short_sha:
        description: '7-character commit SHA'
        value: ${{ jobs.container.outputs.short_sha }}

permissions:
  contents: read

jobs:
  test:
    name: lint, typecheck, test, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: nextjs-test-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch koorikla/ci scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/ci}.git" "${CI_SHA:-v1}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Detect package manager
        id: detect
        env:
          WORKDIR: ${{ inputs.working_directory }}
        run: bash "$CI_SCRIPTS/nextjs/detect.sh"

      - name: Set up pnpm
        if: steps.detect.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working_directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          node-version-file: ${{ inputs.node_version == '' && steps.detect.outputs.node_version_file || '' }}
          cache: ${{ steps.detect.outputs.pm != 'yarn' && steps.detect.outputs.lockfile != '' && steps.detect.outputs.pm || '' }}
          cache-dependency-path: ${{ inputs.working_directory }}/${{ steps.detect.outputs.lockfile }}

      - name: Enable corepack (yarn)
        if: steps.detect.outputs.pm == 'yarn'
        run: corepack enable || npm install -g corepack && corepack enable

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ inputs.working_directory }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.working_directory, steps.detect.outputs.lockfile)) }}-${{ hashFiles(format('{0}/**/*.[jt]s', inputs.working_directory), format('{0}/**/*.[jt]sx', inputs.working_directory)) }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.working_directory, steps.detect.outputs.lockfile)) }}-

      - name: Install, lint, typecheck, test, build, audit
        env:
          WORKDIR: ${{ inputs.working_directory }}
          PM: ${{ steps.detect.outputs.pm }}
          RUN_LINT: ${{ inputs.run_lint }}
          RUN_TYPECHECK: ${{ inputs.run_typecheck }}
          RUN_TEST: ${{ inputs.run_test }}
          RUN_AUDIT: ${{ inputs.run_audit }}
          AUDIT_LEVEL: ${{ inputs.audit_level }}
        run: bash "$CI_SCRIPTS/nextjs/check.sh"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Trivy fs scan of lockfiles
        id: fsscan
        env:
          SCAN_PATH: ${{ inputs.working_directory }}
          FAIL_SEVERITIES: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          FAIL_ON_FINDINGS: ${{ inputs.trivy_fail }}
          IGNORE_FILE: ${{ inputs.trivy_ignore_file }}
          SKIP_DIRS: "**/.next,**/node_modules/.cache"
        run: bash "$CI_SCRIPTS/common/scan-fs.sh"

      - name: Upload Trivy fs SARIF
        if: always() && steps.fsscan.outputs.fs_sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.fsscan.outputs.fs_sarif }}
          category: trivy-fs-nextjs-${{ inputs.working_directory }}

  codeql:
    name: CodeQL (javascript-typescript)
    if: inputs.run_codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: nextjs-codeql-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          source-root: ${{ inputs.working_directory }}

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript/${{ inputs.working_directory }}

  container:
    name: image
    needs: [test, codeql]
    if: >-
      always() && inputs.build_container &&
      needs.test.result == 'success' && (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    uses: $/.github/workflows/container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ${{ inputs.image_name }}
      registry: ${{ inputs.registry }}
      context: ${{ inputs.context != '' && inputs.context || inputs.working_directory }}
      dockerfile: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.working_directory) }}
      platforms: ${{ inputs.platforms }}
      multiarch_strategy: ${{ inputs.multiarch_strategy }}
      build_args: ${{ inputs.build_args }}
      push: ${{ inputs.push }}
      trivy_severity: ${{ inputs.trivy_severity }}
      trivy_ignore_unfixed: ${{ inputs.trivy_ignore_unfixed }}
      trivy_fail: ${{ inputs.trivy_fail }}
      trivy_ignore_file: ${{ inputs.trivy_ignore_file }}
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}
