name: ruby

# Ruby / Rails app: ruby/setup-ruby with bundler-cache, rubocop (if bundled),
# tests (rspec / rails test / rake test, or test_command), brakeman (Rails),
# bundler-audit, Trivy fs on Gemfile.lock, CodeQL (ruby), then container.yaml.
#
# Required caller permissions:
#   contents: read, actions: read, packages: write, id-token: write,
#   attestations: write, security-events: write

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory containing Gemfile'
        required: false
        type: string
        default: '.'
      ruby_version:
        description: 'Ruby version (default: .ruby-version / .tool-versions)'
        required: false
        type: string
        default: ''
      test_command:
        description: "Test command; 'auto' = rspec | bin/rails test | rake test; 'none' skips"
        required: false
        type: string
        default: 'auto'
      run_rubocop:
        description: 'Run rubocop (only if bundled)'
        required: false
        type: boolean
        default: true
      run_brakeman:
        description: "Run brakeman: 'auto' (Rails apps), 'true' or 'false'"
        required: false
        type: string
        default: 'auto'
      postgres:
        description: 'Start a Postgres service for tests (DATABASE_URL, PG* env are set)'
        required: false
        type: boolean
        default: false
      postgres_image:
        description: 'Postgres service image'
        required: false
        type: string
        default: 'postgres:17'
      run_codeql:
        description: 'Run CodeQL (ruby)'
        required: false
        type: boolean
        default: true
      build_container:
        description: 'Build/scan/sign the container image after checks'
        required: false
        type: boolean
        default: true
      image_name:
        description: 'Image name (default: repository name)'
        required: false
        type: string
        default: ''
      registry:
        description: 'Registry prefix (default ghcr.io/<owner>)'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context (default working_directory)'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Dockerfile (default <working_directory>/Dockerfile)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated image platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      multiarch_strategy:
        description: 'native (per-arch runners) or qemu'
        required: false
        type: string
        default: 'native'
      build_args:
        description: 'Newline-separated extra build-args'
        required: false
        type: string
        default: ''
      push:
        description: 'Push, attest and sign on non-PR events'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Severities that fail the Trivy scans (image and lockfiles)'
        required: false
        type: string
        default: 'CRITICAL'
      trivy_ignore_unfixed:
        description: 'Ignore unfixed vulnerabilities'
        required: false
        type: boolean
        default: true
      trivy_ignore_file:
        description: 'Repo-relative .trivyignore(.yaml) with accepted risks'
        required: false
        type: string
        default: ''
      trivy_fail:
        description: 'Fail on Trivy findings at trivy_severity'
        required: false
        type: boolean
        default: true
    secrets:
      registry_username:
        description: 'Registry username (non-GHCR registries)'
        required: false
      registry_password:
        description: 'Registry password/token (non-GHCR registries)'
        required: false
    outputs:
      image:
        description: 'Image reference tagged with the short SHA'
        value: ${{ jobs.container.outputs.image }}
      image_ref:
        description: 'Alias of image'
        value: ${{ jobs.container.outputs.image_ref }}
      image_repo:
        description: 'Image repository without tag'
        value: ${{ jobs.container.outputs.image_repo }}
      digest:
        description: 'Manifest-list digest'
        value: ${{ jobs.container.outputs.digest }}
      image_digest_ref:
        description: 'Immutable <repo>@sha256:... reference'
        value: ${{ jobs.container.outputs.image_digest_ref }}
      short_sha:
        description: '7-character commit SHA'
        value: ${{ jobs.container.outputs.short_sha }}

permissions:
  contents: read

jobs:
  test:
    name: rubocop, test, brakeman, bundler-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ruby-test-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    services:
      postgres:
        # An empty image disables the service.
        image: ${{ inputs.postgres && inputs.postgres_image || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      RACK_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch koorikla/ci scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/ci}.git" "${CI_SHA:-v1}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Set up Ruby (bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version != '' && inputs.ruby_version || 'default' }}
          working-directory: ${{ inputs.working_directory }}
          bundler-cache: true

      - name: Rubocop, tests, brakeman, bundler-audit
        env:
          WORKDIR: ${{ inputs.working_directory }}
          RUN_RUBOCOP: ${{ inputs.run_rubocop }}
          TEST_COMMAND: ${{ inputs.test_command }}
          RUN_BRAKEMAN: ${{ inputs.run_brakeman }}
        run: bash "$CI_SCRIPTS/ruby/check.sh"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Trivy fs scan of lockfiles
        id: fsscan
        env:
          SCAN_PATH: ${{ inputs.working_directory }}
          FAIL_SEVERITIES: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          FAIL_ON_FINDINGS: ${{ inputs.trivy_fail }}
          IGNORE_FILE: ${{ inputs.trivy_ignore_file }}
          SKIP_DIRS: "**/vendor/bundle"
        run: bash "$CI_SCRIPTS/common/scan-fs.sh"

      - name: Upload Trivy fs SARIF
        if: always() && steps.fsscan.outputs.fs_sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.fsscan.outputs.fs_sarif }}
          category: trivy-fs-ruby-${{ inputs.working_directory }}

  codeql:
    name: CodeQL (ruby)
    if: inputs.run_codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ruby-codeql-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: ruby
          build-mode: none
          source-root: ${{ inputs.working_directory }}

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:ruby/${{ inputs.working_directory }}

  container:
    name: image
    needs: [test, codeql]
    if: >-
      always() && inputs.build_container &&
      needs.test.result == 'success' && (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    uses: $/.github/workflows/container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ${{ inputs.image_name }}
      registry: ${{ inputs.registry }}
      context: ${{ inputs.context != '' && inputs.context || inputs.working_directory }}
      dockerfile: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.working_directory) }}
      platforms: ${{ inputs.platforms }}
      multiarch_strategy: ${{ inputs.multiarch_strategy }}
      build_args: ${{ inputs.build_args }}
      push: ${{ inputs.push }}
      trivy_severity: ${{ inputs.trivy_severity }}
      trivy_ignore_unfixed: ${{ inputs.trivy_ignore_unfixed }}
      trivy_fail: ${{ inputs.trivy_fail }}
      trivy_ignore_file: ${{ inputs.trivy_ignore_file }}
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}
