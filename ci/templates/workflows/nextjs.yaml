# Copy to .github/workflows/ci.yaml. Docs: https://github.com/Sparky-stack/platform/tree/main/ci
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nextjs:
    uses: Sparky-stack/platform/.github/workflows/app-nextjs.yaml@<sha> # ci-v1.0.0
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    # with:
    #   audit_level: high
