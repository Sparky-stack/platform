# Copy to .github/workflows/ci.yaml. Docs: https://github.com/koorikla/ci
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  chart:
    uses: koorikla/ci/.github/workflows/helm-chart.yaml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      chart_path: charts/my-chart   # pushed to oci://ghcr.io/<owner>/charts/my-chart
