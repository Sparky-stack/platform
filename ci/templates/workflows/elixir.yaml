# Copy to .github/workflows/ci.yaml. Docs: https://github.com/Sparky-stack/platform/tree/main/ci
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  elixir:
    uses: Sparky-stack/platform/.github/workflows/app-elixir.yaml@<sha> # ci-v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      postgres: true            # Phoenix + Ecto: DATABASE_URL points at the service
      build_args: |
        APP_NAME=my_app
