# Copy to .github/workflows/ci.yaml. Docs: https://github.com/koorikla/platform/tree/main/ci
# Platform repos pin the koorikla/platform app-* workflows by commit SHA (`@<sha> # ci-vX.Y.Z`, tracked by Renovate);
# the platform's admission policy verifies signatures against that commit.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'deploy/**'   # the Workload bump below must not retrigger CI
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  java:
    uses: koorikla/platform/.github/workflows/app-java.yaml@<sha> # ci-v1.0.0
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    # with:
    #   native: true            # Quarkus native executable (Dockerfile.native, per-arch Mandrel build)
    #   build_tool: gradle      # default: auto (mvnw / gradlew)

  # GitOps hand-off: deploy/openchoreo/workload.yaml -> <image>:<sha>@sha256:<digest>.
  bump:
    needs: java
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: koorikla/platform/.github/workflows/app-workload-bump.yaml@<sha> # ci-v1.0.0
    permissions:
      contents: write
    with:
      image: ${{ needs.java.outputs.image }}
      digest: ${{ needs.java.outputs.digest }}
