# Cross-platform entrypoint (macOS, Linux, Windows). `task --list` shows every target; `make <target>` is a shim.
# Commands run in Task's built-in shell; repo scripts run under `bash` (Git Bash on Windows: docs/dev-environment.md).
# Variables: task up INST=aws-example | task set-repo REPO=https://github.com/<you>/platform.git | task kubeconfig CLUSTER=dev1
version: "3"

vars:
  INST: '{{.INST | default "local"}}'
  # Override when `bash` on PATH is not the one you want (e.g. PowerShell finding WSL's C:\Windows\System32\bash.exe):
  # BASH="C:\Program Files\Git\bin\bash.exe" task lint
  BASH: '{{.BASH | default "bash"}}'

env:
  INST: "{{.INST}}"

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  # ---- toolchain -------------------------------------------------------------------------------------------------
  setup:
    desc: Install the pinned toolchain (mise install), the helm-unittest plugin and the git hooks
    cmds:
      - mise install
      - task: tools:plugins
      - task: hooks:install

  doctor:
    desc: Check every tool from mise.toml is installed at the pinned version
    cmds:
      - '"{{.BASH}}" hack/tools.sh check'

  tools:plugins:
    desc: Install the pinned helm-unittest plugin (idempotent)
    cmds:
      - '"{{.BASH}}" hack/tools.sh plugins'

  tools:lock:
    desc: Refresh mise.lock (URLs + checksums) for all six developer platforms
    cmds:
      - mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64,windows-x64,windows-arm64

  hooks:install:
    desc: Install the git hooks from prek.toml (pre-commit + commit-msg; per clone, shared by its worktrees)
    cmds:
      - prek install --allow-missing-config

  hooks:run:
    desc: Run every git hook on every tracked file, as CI does (SKIP=charts,... skips hooks)
    cmds:
      - prek run --all-files --show-diff-on-failure

  # ---- local / cloud installation ---------------------------------------------------------------------------------
  up:
    desc: "Bootstrap INST (default local: k3d mgmt, seed secrets, Argo CD, root app)"
    cmds:
      - '"{{.BASH}}" bootstrap/bootstrap.sh --inst {{shellQuote .INST}} up'

  secrets:
    desc: Seed/refresh platform-secrets from GITHUB_APP_* / PLATFORM_GITHUB_TOKEN / GHCR_* env (gh CLI fallback; local backend only)
    cmds:
      - '"{{.BASH}}" bootstrap/bootstrap.sh --inst {{shellQuote .INST}} secrets'

  argocd:
    desc: Install/upgrade Argo CD and apply the root Application
    cmds:
      - '"{{.BASH}}" bootstrap/bootstrap.sh --inst {{shellQuote .INST}} argocd'

  status:
    desc: Show CAPI clusters, Argo CD apps, ClusterDataPlanes and how to read the Argo CD admin password (never the password)
    cmds:
      - '"{{.BASH}}" bootstrap/bootstrap.sh --inst {{shellQuote .INST}} status'

  demo:check:
    desc: "Read-only pre-flight of every demo step (docs/demo.md) on the live local stack: PASS/FAIL/PENDING table"
    cmds:
      - '"{{.BASH}}" hack/demo-check.sh'

  ui:
    desc: Port-forward the Argo CD UI to http://localhost:8081 and open it (NO_BROWSER=1 to skip)
    interactive: true
    cmds:
      - '"{{.BASH}}" bootstrap/bootstrap.sh --inst {{shellQuote .INST}} ui'

  down:
    desc: Freeze Argo CD, delete the CAPD workload clusters, then the k3d mgmt cluster (local only)
    cmds:
      - '"{{.BASH}}" bootstrap/bootstrap.sh --inst {{shellQuote .INST}} down'

  kubeconfig:
    desc: "Write <CLUSTER>.kubeconfig for a CAPD workload cluster, usable from this host (CLUSTER=dev1)"
    requires:
      vars: [CLUSTER]
    cmds:
      - '"{{.BASH}}" hack/kubeconfig.sh {{shellQuote .CLUSTER}}'

  set-repo:
    desc: "Point a fork at itself: repoURL, githubOrg, tenant app repos (REPO=https://github.com/<you>/platform.git [ORG=] [APPS_ORG=] [DOCS=1])"
    requires:
      vars: [REPO]
    cmds:
      - 'ORG={{shellQuote (.ORG | default "")}} APPS_ORG={{shellQuote (.APPS_ORG | default "")}} DOCS={{shellQuote (.DOCS | default "0")}} "{{.BASH}}" hack/set-repo.sh {{shellQuote .REPO}}'

  # ---- offline validation -----------------------------------------------------------------------------------------
  lint:
    desc: Build chart deps, helm lint all charts, check YAML, shellcheck scripts, actionlint workflows
    cmds:
      - '"{{.BASH}}" hack/lint.sh'
      - actionlint

  test:
    desc: "Full offline validation: helm template x installations, kubeconform, helm unittest, contract tests"
    cmds:
      - task: tools:plugins
      - '"{{.BASH}}" hack/test.sh'

  test:openbao:
    desc: "Opt-in integration test of the mesh CA: pinned OpenBao in docker, chart config, reconcile, member signing"
    cmds:
      - '"{{.BASH}}" hack/tests/openbao_integration.sh'

  schemas:
    desc: Generate kubeconform JSON schemas from upstream CRDs (cached)
    cmds:
      - '"{{.BASH}}" hack/schemas.sh'

  images:audit:
    desc: List every image the local installation renders and check linux/amd64 + linux/arm64 manifests (crane)
    cmds:
      - '"{{.BASH}}" hack/image-audit.sh {{.CLI_ARGS}}'

  clean:
    desc: Remove downloaded chart dependencies and packaged charts
    cmds:
      - rm -rf charts/*/charts addons/*/charts charts/*/*.tgz addons/*/*.tgz
