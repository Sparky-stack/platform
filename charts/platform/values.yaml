# Root Application values: installations/<inst>/installation.yaml is layered on top of this file.

# Defaults so standalone `helm template charts/platform` works; overridden by installation.yaml.
installation:
  name: local
  repoURL: https://github.com/koorikla/platform.git
  revision: HEAD
  githubOrg: https://github.com/koorikla

mgmt:
  name: mgmt
  provider: docker
  region: local
  environment: mgmt
  addons: {}

# Addon catalog. One ApplicationSet per entry, cluster generator selecting on:
#   platform.koorikla.io/role in roles  (and platform.koorikla.io/provider in providers, if set)
#   addons.platform.koorikla.io/<name>: default true -> NotIn ["false"] (opt-out); default false -> In ["true"] (opt-in)
# Optional helm parameters computed per cluster:
#   clusterNameParameters:   [<param>]                 -> the cluster name
#   clusterIdParameters:     [<param>]                 -> <installation.name>-<cluster name> (unique across installations)
#   installationParameters:  {<param>: <tpl>}          -> tpl over installation values, rendered once here
#   clusterServerParameters: {<param>: url|host|port}  -> part of the cluster secret's API server URL
# Optional extra value files, selected by installation facts rather than cluster labels:
#   installationValueFiles:  [<tpl>]                   -> tpl over installation values, rendered once here; layered after
#                                                         values/cni-*.yaml, before installations/<inst>/addons/<name>/*
# Chart path: addons/<name>. Values layering: docs/architecture.md "Addons".
# Standalone-render defaults; installation.yaml provides the real values.
openchoreo:
  orgNamespace: default
  controlPlane:
    host: openchoreo.localhost
    clusterGatewayURL: wss://cluster-gateway.openchoreo.localhost:8443/ws
  observability:
    enabled: false
  workflowPlane:
    enabled: false
registry:
  type: external
  host: ""
dns:
  provider: none              # none | route53 | cloudflare (docs/dns.md)
  domainFilters: []

addons:
  argo-cd:                  { namespace: argocd,                   roles: [mgmt],           default: true, releaseName: argocd }   # = bootstrap helm release (immutable selectors carry the instance label)
  cert-manager:             { namespace: cert-manager,             roles: [mgmt, workload], default: true }
  external-secrets:         { namespace: external-secrets,         roles: [mgmt, workload], default: true }
  secret-stores:            { namespace: external-secrets,         roles: [mgmt, workload], default: true }
  capi-operator:            { namespace: capi-operator-system,     roles: [mgmt],           default: true }
  capi-providers:           { namespace: capi-system,              roles: [mgmt],           default: true }
  clusterclasses:           { namespace: fleet,                    roles: [mgmt],           default: true, serverSideDiff: true }
  gateway-api-crds:         { namespace: kube-system,              roles: [mgmt, workload], default: true }
  kgateway:                 { namespace: kgateway-system,          roles: [mgmt, workload], default: true }
  thunder:                  { namespace: thunder,                  roles: [mgmt],           default: true }
  openchoreo-control-plane: { namespace: openchoreo-control-plane, roles: [mgmt], default: true, installationParameters: { openchoreo-control-plane.backstage.features.observability.enabled: '{{ .Values.openchoreo.observability.enabled }}', openchoreo-control-plane.backstage.features.workflows.enabled: '{{ .Values.openchoreo.workflowPlane.enabled }}' } }
  openchoreo-platform:      { namespace: default,                  roles: [mgmt],           default: true }   # OC platform CRs
  openchoreo-data-plane:    { namespace: openchoreo-data-plane,    roles: [workload],       default: true, clusterNameParameters: [openchoreo-data-plane.clusterAgent.planeID], installationParameters: { openchoreo-data-plane.clusterAgent.serverUrl: '{{ .Values.openchoreo.controlPlane.clusterGatewayURL }}' } }
  aws-ccm:                  { namespace: kube-system,              roles: [workload],       default: true, providers: [aws] }
  hcloud-ccm:               { namespace: kube-system,              roles: [workload],       default: true, providers: [hetzner] }
  coredns-local:            { namespace: kube-system,              roles: [mgmt, workload], default: true, providers: [docker] }
  # Public DNS for Gateway API routes (docs/dns.md), opt-in per cluster. The DNS provider is installation.yaml
  # dns.provider (not the infra provider): it picks values/dns-<provider>.yaml; dns.domainFilters and
  # <installation>-<cluster> (TXT owner) become helm parameters.
  external-dns:             { namespace: external-dns,             roles: [mgmt, workload], default: false, clusterIdParameters: [external-dns.txtOwnerId], installationParameters: { external-dns.domainFilters: '{{ printf "{%s}" (join "," .Values.dns.domainFilters) }}' }, installationValueFiles: ['values/dns-{{ .Values.dns.provider }}.yaml'] }
  openchoreo-observability-plane: { namespace: openchoreo-observability-plane, roles: [mgmt], default: true }
  # AI agents (docs/ai-agents.md), opt-in: the OpenCost FinOps module next to the observability plane, and agentgateway
  # (LLM gateway the RCA / FinOps agents call instead of holding provider keys).
  finops-opencost:          { namespace: openchoreo-observability-plane, roles: [mgmt], default: false }
  agentgateway:             { namespace: agentgateway-system,      roles: [mgmt],           default: false }
  telemetry:                { namespace: telemetry,                roles: [workload],       default: true }
  obi:                      { namespace: obi,                      roles: [workload],       default: false }   # opt-in: single L7 RED source when on
  falco:                    { namespace: falco,                    roles: [mgmt, workload], default: true }
  # Networking (docs/networking.md). cilium: opt-in by label, which charts/cluster derives from the fleet file's `cni`;
  # it reaches the API server without kube-proxy via the cluster secret's server (clusterServerParameters).
  cilium:                   { namespace: kube-system,              roles: [workload],       default: false, clusterServerParameters: { cilium.k8sServiceHost: host, cilium.k8sServicePort: port } }
  # istiod flips its validating webhooks to failurePolicy Fail and injects caBundle once ready (manager pilot-discovery).
  istio-ambient:            { namespace: istio-system,             roles: [workload],       default: true, ignoreDifferences: [{ group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration, managedFieldsManagers: [pilot-discovery] }] }
  # Admission policy (docs/networking.md "Kyverno"): engine first, policies retry until its CRDs exist.
  kyverno:                  { namespace: kyverno,                  roles: [mgmt, workload], default: true }
  kyverno-policies:         { namespace: kyverno,                  roles: [mgmt, workload], default: true }
  # Build plane (docs/build-plane.md): OpenChoreo workflow plane (in-cluster builds, primary path) and the Harbor
  # registry builds push to and nodes pull through. harbor is for installation.yaml registry.type harbor (examples set
  # mgmt.addons.harbor "false"); externalURL follows registry.host.
  openchoreo-workflow-plane: { namespace: openchoreo-workflow-plane, roles: [mgmt], default: true }
  harbor:                   { namespace: harbor,                   roles: [mgmt],           default: true, installationParameters: { harbor.externalURL: 'https://{{ .Values.registry.host }}' } }
