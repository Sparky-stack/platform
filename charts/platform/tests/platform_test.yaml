suite: platform root chart (projects, mgmt cluster secret, fleet & addon ApplicationSets)
templates:
  - projects.yaml
  - cluster-mgmt.yaml
  - appset-fleet.yaml
  - appset-addons.yaml
values:
  - ../../../installations/local/installation.yaml
tests:
  - it: renders AppProjects platform and fleet with required whitelists
    template: projects.yaml
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: AppProject
          apiVersion: argoproj.io/v1alpha1
          name: platform
          any: true
      - containsDocument:
          kind: AppProject
          apiVersion: argoproj.io/v1alpha1
          name: fleet
          any: true
      - contains:
          path: spec.clusterResourceWhitelist
          content:
            group: openchoreo.dev
            kind: ClusterDataPlane
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: cluster.x-k8s.io
            kind: Cluster
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: openchoreo.dev
            kind: Environment
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: external-secrets.io
            kind: ExternalSecret
        documentIndex: 1

  - it: renders mgmt cluster secret in-cluster with installation labels
    template: cluster-mgmt.yaml
    set:
      mgmt:
        addons:
          cert-manager: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: in-cluster
      - equal:
          path: metadata.namespace
          value: argocd
      - equal:
          path: metadata.labels["argocd.argoproj.io/secret-type"]
          value: cluster
      - equal:
          path: metadata.labels["platform.koorikla.io/role"]
          value: mgmt
      - equal:
          path: metadata.labels["platform.koorikla.io/provider"]
          value: docker
      - equal:
          path: metadata.labels["addons.platform.koorikla.io/cert-manager"]
          value: "false"
      - equal:
          path: stringData.server
          value: https://kubernetes.default.svc

  - it: renders fleet ApplicationSet with ServerSideApply and ServerSideDiff
    template: appset-fleet.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ApplicationSet
      - equal:
          path: metadata.name
          value: fleet
      - equal:
          path: spec.generators[0].git.files[0].path
          value: installations/local/clusters/*.yaml
      - equal:
          path: spec.template.spec.project
          value: fleet
      - equal:
          path: spec.template.spec.source.path
          value: charts/cluster
      - equal:
          path: spec.template.spec.destination.namespace
          value: fleet
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ServerSideDiff=true
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ServerSideApply=true

  - it: renders catalog ApplicationSets including clusterNameParameters and serverSideDiff
    template: appset-addons.yaml
    asserts:
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-thunder
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-aws-ccm
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-hcloud-ccm
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-openchoreo-data-plane
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-clusterclasses
          any: true

  - it: external-dns is opt-in and takes provider, zones and TXT owner from the installation
    template: appset-addons.yaml
    values: [../../../installations/hetzner-example/installation.yaml]
    documentSelector: { path: metadata.name, value: addon-external-dns }
    asserts:
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/external-dns, operator: In, values: ["true"] }
      - contains: { path: spec.template.spec.source.helm.valueFiles, content: values/dns-cloudflare.yaml }
      - notContains: { path: spec.template.spec.source.helm.valueFiles, content: values/dns-route53.yaml }
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: external-dns.domainFilters, value: "{hetzner.example.com}" }
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: external-dns.txtOwnerId, value: '{{ index .metadata.labels "platform.koorikla.io/name" }}' }

  - it: installationValueFiles sit after the cni overlay and before the installation overlays
    template: appset-addons.yaml
    set: { dns.provider: route53, dns.domainFilters: [a.example.com, b.example.com] }
    documentSelector: { path: metadata.name, value: addon-external-dns }
    asserts:
      - equal: { path: "spec.template.spec.source.helm.valueFiles[4]", value: values/dns-route53.yaml }
      - matchRegex: { path: "spec.template.spec.source.helm.valueFiles[3]", pattern: "^values/cni-" }
      - matchRegex: { path: "spec.template.spec.source.helm.valueFiles[5]", pattern: "^\\.\\./\\.\\./installations/local/addons/external-dns/values.yaml$" }
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: external-dns.domainFilters, value: "{a.example.com,b.example.com}" }

  - it: installationValueFiles must stay under the addon's values/
    template: appset-addons.yaml
    set:
      addons:
        evil: { namespace: evil, roles: [mgmt], installationValueFiles: ["../../installations/{{ .Values.installation.name }}/installation.yaml"] }
    asserts:
      - failedTemplate:
          errorMessage: 'addons.evil.installationValueFiles: "../../installations/local/installation.yaml" must be a file under addons/evil/values/'

  - it: AI agent addons are catalog entries switched off by default on mgmt
    template: appset-addons.yaml
    asserts:
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/agentgateway, operator: In, values: ["true"] }
        documentSelector: { path: metadata.name, value: addon-agentgateway }
      - equal: { path: spec.template.spec.destination.namespace, value: agentgateway-system }
        documentSelector: { path: metadata.name, value: addon-agentgateway }
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/finops-opencost, operator: In, values: ["true"] }
        documentSelector: { path: metadata.name, value: addon-finops-opencost }
      - equal: { path: spec.template.spec.destination.namespace, value: openchoreo-observability-plane }
        documentSelector: { path: metadata.name, value: addon-finops-opencost }
