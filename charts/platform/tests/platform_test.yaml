suite: platform root chart (projects, mgmt cluster secret, fleet & addon ApplicationSets)
templates:
  - projects.yaml
  - cluster-mgmt.yaml
  - appset-fleet.yaml
  - appset-addons.yaml
  - appset-examples.yaml
  - tenants.yaml
values:
  - ../../../installations/local/installation.yaml
tests:
  - it: renders AppProjects platform and fleet with required whitelists
    template: projects.yaml
    asserts:
      - hasDocuments:
          count: 4
      - containsDocument:
          kind: AppProject
          apiVersion: argoproj.io/v1alpha1
          name: platform
          any: true
      - containsDocument:
          kind: AppProject
          apiVersion: argoproj.io/v1alpha1
          name: fleet
          any: true
      - contains:
          path: spec.clusterResourceWhitelist
          content:
            group: openchoreo.dev
            kind: ClusterDataPlane
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: cluster.x-k8s.io
            kind: Cluster
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: openchoreo.dev
            kind: Environment
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: external-secrets.io
            kind: ExternalSecret
        documentIndex: 1

  - it: renders mgmt cluster secret in-cluster with installation labels
    template: cluster-mgmt.yaml
    set:
      mgmt:
        addons:
          cert-manager: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: in-cluster
      - equal:
          path: metadata.namespace
          value: argocd
      - equal:
          path: metadata.labels["argocd.argoproj.io/secret-type"]
          value: cluster
      - equal:
          path: metadata.labels["platform.koorikla.io/role"]
          value: mgmt
      - equal:
          path: metadata.labels["platform.koorikla.io/provider"]
          value: docker
      - equal:
          path: metadata.labels["addons.platform.koorikla.io/cert-manager"]
          value: "false"
      - equal:
          path: stringData.server
          value: https://kubernetes.default.svc

  - it: renders fleet ApplicationSet with ServerSideApply and ServerSideDiff
    template: appset-fleet.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ApplicationSet
      - equal:
          path: metadata.name
          value: fleet
      - equal:
          path: spec.generators[0].git.files[0].path
          value: installations/local/clusters/*.yaml
      - equal:
          path: spec.template.spec.project
          value: fleet
      - equal:
          path: spec.template.spec.source.path
          value: charts/cluster
      - equal:
          path: spec.template.spec.destination.namespace
          value: fleet
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ServerSideDiff=true
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ServerSideApply=true

  # Deleting a fleet file must let CAPI order the teardown: background cascade, never foreground (the GC would delete
  # the DockerCluster before the machines and CAPD would never finalize them)
  - it: deletes cluster Applications with a background cascade
    template: appset-fleet.yaml
    asserts:
      - equal:
          path: spec.template.metadata.finalizers
          value: [resources-finalizer.argocd.argoproj.io/background]

  # charts/cluster gates the Cluster on its registries ExternalSecret (sync wave -1): a cluster app must keep retrying
  # on the latest revision until that dependency exists, not give up after N attempts
  - it: retries fleet syncs without a limit on the latest revision
    template: appset-fleet.yaml
    asserts:
      - equal: { path: spec.template.spec.syncPolicy.retry.limit, value: -1 }
      - equal: { path: spec.template.spec.syncPolicy.retry.refresh, value: true }
      - equal: { path: spec.template.spec.syncPolicy.retry.backoff.maxDuration, value: 5m }

  - it: renders catalog ApplicationSets including clusterNameParameters and serverSideDiff
    template: appset-addons.yaml
    asserts:
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-thunder
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-aws-ccm
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-hcloud-ccm
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-openchoreo-data-plane
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-reloader
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-clusterclasses
          any: true

  # --- examples (templates/appset-examples.yaml, AppProject examples) ----------------------------------------------
  - it: renders ApplicationSet example-eastwest only when the installation enables it, in AppProject examples
    template: appset-examples.yaml
    set:
      examples.eastwest.enabled: true   # local: multicluster profile only (docs/dev-environment.md "Local profiles")
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: example-eastwest }
      - equal: { path: spec.template.spec.project, value: examples }
      - equal: { path: spec.template.spec.source.path, value: examples/eastwest }
      - equal: { path: spec.template.spec.destination.namespace, value: eastwest-demo }
      - equal:
          path: spec.generators[0].clusters.selector
          value: { matchLabels: { platform.koorikla.io/role: workload, addons.platform.koorikla.io/istio-eastwest: "true" } }
      - equal:
          path: spec.template.spec.source.helm.valueFiles
          value:
            - values.yaml
            - ../../installations/local/examples/eastwest/values.yaml
            - '../../installations/local/examples/eastwest/cluster-{{ index .metadata.labels "platform.koorikla.io/name" }}.yaml'
      - equal:
          path: spec.template.spec.source.targetRevision
          value: '{{ $r := index .metadata.annotations "platform.koorikla.io/addons-revision" }}{{ if and $r (ne $r "HEAD") }}{{ $r }}{{ else }}main{{ end }}'

  - it: "disabled example: no ApplicationSet, but the examples AppProject stays (its Applications must delete first)"
    set:
      examples.eastwest.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
        template: appset-examples.yaml
      - hasDocuments: { count: 4 }
        template: projects.yaml
      - equal: { path: spec.destinations, value: [{ server: "*", namespace: eastwest-demo }] }
        template: projects.yaml
        documentSelector: { path: metadata.name, value: examples }

  - it: "AppProject previews: only charts/preview's three OpenChoreo kinds, the org namespace, the platform repo"
    template: projects.yaml
    documentSelector: { path: metadata.name, value: previews }
    asserts:
      - equal: { path: spec.sourceRepos, value: [https://github.com/koorikla/platform.git] }
      - equal: { path: spec.destinations, value: [{ server: https://kubernetes.default.svc, namespace: default }] }
      - equal: { path: spec.clusterResourceWhitelist, value: [] }
      - equal:
          path: spec.namespaceResourceWhitelist
          value:
            - { group: openchoreo.dev, kind: Environment }
            - { group: openchoreo.dev, kind: ProjectReleaseBinding }
            - { group: openchoreo.dev, kind: ReleaseBinding }

  - it: "AppProjects are created one wave before, and pruned after, the ApplicationSets that use them"
    template: projects.yaml
    asserts:
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "-1" }

  - it: "no examples in the catalog: the examples AppProject admits no destination"
    template: projects.yaml
    documentSelector: { path: metadata.name, value: examples }
    set:
      examples: null
    asserts:
      - equal: { path: spec.destinations, value: [] }

  - it: requires a label selector for an enabled example
    template: appset-examples.yaml
    set:
      examples.eastwest.enabled: true
      examples.eastwest.selector: null
    asserts:
      - failedTemplate: { errorMessage: "examples.eastwest.selector is required" }

  - it: "AppProject examples: the example namespaces only, Namespace the only cluster-scoped kind"
    template: projects.yaml
    documentSelector: { path: metadata.name, value: examples }
    asserts:
      - equal: { path: spec.destinations, value: [{ server: "*", namespace: eastwest-demo }] }
      - equal: { path: spec.clusterResourceWhitelist, value: [{ group: "", kind: Namespace }] }
      - notContains: { path: spec.namespaceResourceWhitelist, content: { group: "*", kind: "*" } }
      - notContains: { path: spec.destinations, content: { server: "*", namespace: "*" } }
      - equal: { path: 'spec.sourceRepos', value: [https://github.com/koorikla/platform.git] }

  # --- catalog clusterLabelParameters (templates/appset-addons.yaml) ----------------------------------------------
  - it: "clusterLabelParameters: label value else default, always a string"
    template: appset-addons.yaml
    documentSelector: { path: metadata.name, value: addon-istio-ambient }
    asserts:
      - contains:
          path: spec.template.spec.source.helm.parameters
          content:
            name: istiod.env.AMBIENT_ENABLE_MULTI_NETWORK
            value: '{{ $v := index .metadata.labels "addons.platform.koorikla.io/istio-eastwest" }}{{ if $v }}{{ $v }}{{ else }}false{{ end }}'
            forceString: true
      - contains:
          path: spec.template.spec.source.helm.parameters
          content:
            name: global.network
            value: '{{ index .metadata.labels "mesh.platform.koorikla.io/network" }}'
            forceString: true
      - contains:
          path: spec.template.spec.source.helm.parameters
          content:
            name: global.multiCluster.clusterName
            value: '{{ index .metadata.labels "platform.koorikla.io/name" }}'
            forceString: true

  - it: "negative: rejects a clusterLabelParameters entry that is not {label, default}"
    template: appset-addons.yaml
    set:
      addons.broken: { namespace: x, roles: [workload], clusterLabelParameters: { a.b: some-label } }
    asserts:
      - failedTemplate: { errorMessage: "addons.broken.clusterLabelParameters.a.b: want {label: <key>, default: <value>}" }

  - it: "negative: rejects a non-string default (unquoted false would silently become empty)"
    template: appset-addons.yaml
    set:
      addons.broken: { namespace: x, roles: [workload], clusterLabelParameters: { a.b: { label: l, default: false } } }
    asserts:
      - failedTemplate: { errorMessage: "addons.broken.clusterLabelParameters.a.b: default must be a string (quote it: \"false\")" }

  - it: external-dns is opt-in and takes provider, zones and TXT owner from the installation
    template: appset-addons.yaml
    values: [../../../installations/hetzner-example/installation.yaml]
    documentSelector: { path: metadata.name, value: addon-external-dns }
    asserts:
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/external-dns, operator: In, values: ["true"] }
      - contains: { path: spec.template.spec.source.helm.valueFiles, content: values/dns-cloudflare.yaml }
      - notContains: { path: spec.template.spec.source.helm.valueFiles, content: values/dns-route53.yaml }
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: external-dns.domainFilters, value: "{hetzner.example.com}" }
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: external-dns.txtOwnerId, value: 'hetzner-example-{{ index .metadata.labels "platform.koorikla.io/name" }}', forceString: true }

  - it: clusterIdParameters are <installation>-<cluster> (unique across installations sharing a zone)
    template: appset-addons.yaml
    set:
      addons:
        idtest: { namespace: idtest, roles: [workload], clusterIdParameters: [x.owner], clusterNameParameters: [x.name] }
    documentSelector: { path: metadata.name, value: addon-idtest }
    asserts:
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: x.owner, value: 'local-{{ index .metadata.labels "platform.koorikla.io/name" }}', forceString: true }
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: x.name, value: '{{ index .metadata.labels "platform.koorikla.io/name" }}', forceString: true }

  - it: installationValueFiles sit after the cni and mesh overlays and before the installation overlays
    template: appset-addons.yaml
    set: { dns.provider: route53, dns.domainFilters: [a.example.com, b.example.com] }
    documentSelector: { path: metadata.name, value: addon-external-dns }
    asserts:
      - equal: { path: "spec.template.spec.source.helm.valueFiles[5]", value: values/dns-route53.yaml }
      - matchRegex: { path: "spec.template.spec.source.helm.valueFiles[3]", pattern: "^values/cni-" }
      - matchRegex: { path: "spec.template.spec.source.helm.valueFiles[4]", pattern: "^values/mesh-" }
      - matchRegex: { path: "spec.template.spec.source.helm.valueFiles[6]", pattern: "^\\.\\./\\.\\./installations/local/addons/external-dns/values.yaml$" }
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: external-dns.domainFilters, value: "{a.example.com,b.example.com}" }

  - it: installationValueFiles must stay under the addon's values/
    template: appset-addons.yaml
    set:
      addons:
        evil: { namespace: evil, roles: [mgmt], installationValueFiles: ["../../installations/{{ .Values.installation.name }}/installation.yaml"] }
    asserts:
      - failedTemplate:
          errorMessage: 'addons.evil.installationValueFiles: "../../installations/local/installation.yaml" must be a file under addons/evil/values/'

  - it: AI agent addons are catalog entries switched off by default on mgmt
    template: appset-addons.yaml
    asserts:
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/agentgateway, operator: In, values: ["true"] }
        documentSelector: { path: metadata.name, value: addon-agentgateway }
      - equal: { path: spec.template.spec.destination.namespace, value: agentgateway-system }
        documentSelector: { path: metadata.name, value: addon-agentgateway }
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/finops-opencost, operator: In, values: ["true"] }
        documentSelector: { path: metadata.name, value: addon-finops-opencost }
      - equal: { path: spec.template.spec.destination.namespace, value: openchoreo-observability-plane }
        documentSelector: { path: metadata.name, value: addon-finops-opencost }

  - it: addon-keda is opt-in by label on workload clusters only (nothing generated unless a cluster opts in)
    template: appset-addons.yaml
    documentSelector: { path: metadata.name, value: addon-keda }
    asserts:
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/keda, operator: In, values: ["true"] }
      - notContains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/keda, operator: NotIn, values: ["false"] }
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: platform.koorikla.io/role, operator: In, values: [workload] }
      - equal: { path: spec.template.spec.destination.namespace, value: keda }
      - equal: { path: spec.template.spec.source.path, value: addons/keda }
      - contains: { path: spec.template.spec.syncPolicy.syncOptions, content: ServerSideApply=true }
      - contains: { path: spec.template.spec.syncPolicy.syncOptions, content: ServerSideDiff=true }

  - it: addon-strimzi is opt-in by label on workload clusters only (nothing generated unless a cluster opts in)
    template: appset-addons.yaml
    documentSelector: { path: metadata.name, value: addon-strimzi }
    asserts:
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/strimzi, operator: In, values: ["true"] }
      - notContains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/strimzi, operator: NotIn, values: ["false"] }
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: platform.koorikla.io/role, operator: In, values: [workload] }
      - equal: { path: spec.template.spec.destination.namespace, value: strimzi }
      - equal: { path: spec.template.spec.source.path, value: addons/strimzi }
      - contains: { path: spec.template.spec.syncPolicy.syncOptions, content: ServerSideApply=true }
      - notContains: { path: spec.template.spec.syncPolicy.syncOptions, content: ServerSideDiff=true }

  - it: addon-cloudnative-pg is opt-in by label on workload clusters only (nothing generated unless a cluster opts in)
    template: appset-addons.yaml
    documentSelector: { path: metadata.name, value: addon-cloudnative-pg }
    asserts:
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/cloudnative-pg, operator: In, values: ["true"] }
      - notContains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: addons.platform.koorikla.io/cloudnative-pg, operator: NotIn, values: ["false"] }
      - contains:
          path: spec.generators[0].clusters.selector.matchExpressions
          content: { key: platform.koorikla.io/role, operator: In, values: [workload] }
      - equal: { path: spec.template.spec.destination.namespace, value: cnpg-system }
      - equal: { path: spec.template.spec.source.path, value: addons/cloudnative-pg }
      - contains: { path: spec.template.spec.syncPolicy.syncOptions, content: ServerSideApply=true }
      - contains: { path: spec.template.spec.syncPolicy.syncOptions, content: ServerSideDiff=true }

  # #192: bootstrap.sh sets secrets.githubGateApp.enabled on the root app from the seeded key; it must reach the addons
  # (valuesObject) and the tenants (parameter: they render installation.yaml directly), default false
  - it: passes secrets.githubGateApp.enabled (default false) to the tenants and the addons
    asserts:
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: secrets.githubGateApp.enabled, value: "false" }
        template: tenants.yaml
      - equal:
          path: spec.template.spec.source.helm.valuesObject.secrets.githubGateApp.enabled
          value: false
        template: appset-addons.yaml
        documentSelector: { path: metadata.name, value: addon-openchoreo-platform }

  - it: passes the bootstrap's root-app parameter through when the App is seeded
    set: { secrets.githubGateApp.enabled: true }
    asserts:
      - contains:
          path: spec.template.spec.source.helm.parameters
          content: { name: secrets.githubGateApp.enabled, value: "true" }
        template: tenants.yaml
      - equal:
          path: spec.template.spec.source.helm.valuesObject.secrets.githubGateApp.enabled
          value: true
        template: appset-addons.yaml
        documentSelector: { path: metadata.name, value: addon-secret-stores }
