suite: platform root chart (projects, mgmt cluster secret, fleet & addon ApplicationSets)
templates:
  - projects.yaml
  - cluster-mgmt.yaml
  - appset-fleet.yaml
  - appset-addons.yaml
  - appset-examples.yaml
values:
  - ../../../installations/local/installation.yaml
tests:
  - it: renders AppProjects platform and fleet with required whitelists
    template: projects.yaml
    asserts:
      - hasDocuments:
          count: 3
      - containsDocument:
          kind: AppProject
          apiVersion: argoproj.io/v1alpha1
          name: platform
          any: true
      - containsDocument:
          kind: AppProject
          apiVersion: argoproj.io/v1alpha1
          name: fleet
          any: true
      - contains:
          path: spec.clusterResourceWhitelist
          content:
            group: openchoreo.dev
            kind: ClusterDataPlane
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: cluster.x-k8s.io
            kind: Cluster
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: openchoreo.dev
            kind: Environment
        documentIndex: 1
      - contains:
          path: spec.namespaceResourceWhitelist
          content:
            group: external-secrets.io
            kind: ExternalSecret
        documentIndex: 1

  - it: renders mgmt cluster secret in-cluster with installation labels
    template: cluster-mgmt.yaml
    set:
      mgmt:
        addons:
          cert-manager: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: in-cluster
      - equal:
          path: metadata.namespace
          value: argocd
      - equal:
          path: metadata.labels["argocd.argoproj.io/secret-type"]
          value: cluster
      - equal:
          path: metadata.labels["platform.koorikla.io/role"]
          value: mgmt
      - equal:
          path: metadata.labels["platform.koorikla.io/provider"]
          value: docker
      - equal:
          path: metadata.labels["addons.platform.koorikla.io/cert-manager"]
          value: "false"
      - equal:
          path: stringData.server
          value: https://kubernetes.default.svc

  - it: renders fleet ApplicationSet with ServerSideApply and ServerSideDiff
    template: appset-fleet.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ApplicationSet
      - equal:
          path: metadata.name
          value: fleet
      - equal:
          path: spec.generators[0].git.files[0].path
          value: installations/local/clusters/*.yaml
      - equal:
          path: spec.template.spec.project
          value: fleet
      - equal:
          path: spec.template.spec.source.path
          value: charts/cluster
      - equal:
          path: spec.template.spec.destination.namespace
          value: fleet
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ServerSideDiff=true
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: ServerSideApply=true

  - it: renders catalog ApplicationSets including clusterNameParameters and serverSideDiff
    template: appset-addons.yaml
    asserts:
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-thunder
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-aws-ccm
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-hcloud-ccm
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-openchoreo-data-plane
          any: true
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: addon-clusterclasses
          any: true

  # --- examples (templates/appset-examples.yaml, AppProject examples) ----------------------------------------------
  - it: renders ApplicationSet example-eastwest only when the installation enables it, in AppProject examples
    template: appset-examples.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: example-eastwest }
      - equal: { path: spec.template.spec.project, value: examples }
      - equal: { path: spec.template.spec.source.path, value: examples/eastwest }
      - equal: { path: spec.template.spec.destination.namespace, value: eastwest-demo }
      - equal:
          path: spec.generators[0].clusters.selector
          value: { matchLabels: { platform.koorikla.io/role: workload, addons.platform.koorikla.io/istio-eastwest: "true" } }
      - equal:
          path: spec.template.spec.source.helm.valueFiles
          value:
            - values.yaml
            - ../../installations/local/examples/eastwest/values.yaml
            - '../../installations/local/examples/eastwest/cluster-{{ index .metadata.labels "platform.koorikla.io/name" }}.yaml'
      - equal:
          path: spec.template.spec.source.targetRevision
          value: '{{ $r := index .metadata.annotations "platform.koorikla.io/addons-revision" }}{{ if and $r (ne $r "HEAD") }}{{ $r }}{{ else }}main{{ end }}'

  - it: renders no example ApplicationSet and no examples AppProject when disabled
    set:
      examples.eastwest.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
        template: appset-examples.yaml
      - hasDocuments: { count: 2 }
        template: projects.yaml

  - it: requires a label selector for an enabled example
    template: appset-examples.yaml
    set:
      examples.eastwest.selector: null
    asserts:
      - failedTemplate: { errorMessage: "examples.eastwest.selector is required" }

  - it: "AppProject examples: the example namespaces only, Namespace the only cluster-scoped kind"
    template: projects.yaml
    documentSelector: { path: metadata.name, value: examples }
    asserts:
      - equal: { path: spec.destinations, value: [{ server: "*", namespace: eastwest-demo }] }
      - equal: { path: spec.clusterResourceWhitelist, value: [{ group: "", kind: Namespace }] }
      - notContains: { path: spec.namespaceResourceWhitelist, content: { group: "*", kind: "*" } }
      - notContains: { path: spec.destinations, content: { server: "*", namespace: "*" } }
      - equal: { path: 'spec.sourceRepos', value: [https://github.com/koorikla/platform.git] }

  # --- catalog clusterLabelParameters (templates/appset-addons.yaml) ----------------------------------------------
  - it: "clusterLabelParameters: label value else default, always a string"
    template: appset-addons.yaml
    documentSelector: { path: metadata.name, value: addon-istio-ambient }
    asserts:
      - contains:
          path: spec.template.spec.source.helm.parameters
          content:
            name: istiod.env.AMBIENT_ENABLE_MULTI_NETWORK
            value: '{{ $v := index .metadata.labels "addons.platform.koorikla.io/istio-eastwest" }}{{ if $v }}{{ $v }}{{ else }}false{{ end }}'
            forceString: true
      - contains:
          path: spec.template.spec.source.helm.parameters
          content:
            name: global.network
            value: '{{ index .metadata.labels "mesh.platform.koorikla.io/network" }}'
            forceString: true
      - contains:
          path: spec.template.spec.source.helm.parameters
          content:
            name: global.multiCluster.clusterName
            value: '{{ index .metadata.labels "platform.koorikla.io/name" }}'
            forceString: true

  - it: "negative: rejects a clusterLabelParameters entry that is not {label, default}"
    template: appset-addons.yaml
    set:
      addons.broken: { namespace: x, roles: [workload], clusterLabelParameters: { a.b: some-label } }
    asserts:
      - failedTemplate: { errorMessage: "addons.broken.clusterLabelParameters.a.b: want {label: <key>, default: <value>}" }

  - it: "negative: rejects a non-string default (unquoted false would silently become empty)"
    template: appset-addons.yaml
    set:
      addons.broken: { namespace: x, roles: [workload], clusterLabelParameters: { a.b: { label: l, default: false } } }
    asserts:
      - failedTemplate: { errorMessage: "addons.broken.clusterLabelParameters.a.b: default must be a string (quote it: \"false\")" }
