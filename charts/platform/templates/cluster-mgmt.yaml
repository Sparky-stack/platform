{{- $mgmt := .Values.mgmt | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    platform.koorikla.io/name: {{ $mgmt.name | default "mgmt" | quote }}
    platform.koorikla.io/role: mgmt
    platform.koorikla.io/provider: {{ $mgmt.provider | default "docker" | quote }}
    platform.koorikla.io/region: {{ $mgmt.region | default "local" | quote }}
    platform.koorikla.io/environment: {{ $mgmt.environment | default "mgmt" | quote }}
    platform.koorikla.io/installation: {{ .Values.installation.name | quote }}
    {{- range $k, $v := ($mgmt.addons | default dict) }}
    addons.platform.koorikla.io/{{ $k }}: {{ $v | quote }}
    {{- end }}
  annotations:
    platform.koorikla.io/addons-revision: {{ $mgmt.addonsRevision | default "HEAD" | quote }}
type: Opaque
stringData:
  name: {{ $mgmt.name | default "mgmt" | quote }}
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
