{{- $inst := .Values.installation -}}
{{- $instValues := omit .Values "addons" -}}
{{- $defaultRev := $inst.revision | default "HEAD" -}}
{{- /* clusterServerParameters: <helm param>: <part of the Argo cluster secret's `server`> - goTemplate expressions
evaluated by the ApplicationSet controller per cluster (sprig urlParse; VERIFY live). hack/test.sh mirrors them. */ -}}
{{- $serverExpr := dict
  "url"  "{{ .server }}"
  "host" "{{ (urlParse .server).hostname }}"
  "port" "{{ $h := (urlParse .server).host }}{{ if regexMatch \":[0-9]+$\" $h }}{{ regexFind \"[0-9]+$\" $h }}{{ else }}443{{ end }}"
-}}
{{- range $addon, $cfg := .Values.addons }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "addon-%s" $addon | quote }}
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: platform.koorikla.io/role
              operator: In
              values: {{ $cfg.roles | toJson }}
            {{- if $cfg.providers }}
            - key: platform.koorikla.io/provider
              operator: In
              values: {{ $cfg.providers | toJson }}
            {{- end }}
            {{- if hasKey $cfg "default" | ternary $cfg.default true }}
            - key: {{ printf "addons.platform.koorikla.io/%s" $addon | quote }}
              operator: NotIn
              values: ["false"]
            {{- else }}
            - key: {{ printf "addons.platform.koorikla.io/%s" $addon | quote }}
              operator: In
              values: ["true"]
            {{- end }}
  template:
    metadata:
      name: '{{ $addon }}-{{ "{{" }} .name {{ "}} " | trim }}'
      {{- if hasKey $cfg "syncWave" }}
      annotations:
        argocd.argoproj.io/sync-wave: {{ $cfg.syncWave | quote }}
      {{- end }}
    spec:
      project: platform
      source:
        repoURL: {{ $inst.repoURL | quote }}
        targetRevision: '{{ "{{" }} $r := index .metadata.annotations "platform.koorikla.io/addons-revision" {{ "}} " | trim }}{{ "{{" }} if and $r (ne $r "HEAD") {{ "}} " | trim }}{{ "{{" }} $r {{ "}} " | trim }}{{ "{{" }} else {{ "}} " | trim }}{{ $defaultRev }}{{ "{{" }} end {{ "}} " | trim }}'
        path: {{ printf "addons/%s" $addon | quote }}
        helm:
          releaseName: {{ $cfg.releaseName | default $addon | quote }}
          ignoreMissingValueFiles: true
          valueFiles:
            - values.yaml
            - 'values/role-{{ "{{" }} index .metadata.labels "platform.koorikla.io/role" {{ "}} " | trim }}.yaml'
            - 'values/provider-{{ "{{" }} index .metadata.labels "platform.koorikla.io/provider" {{ "}} " | trim }}.yaml'
            - 'values/cni-{{ "{{" }} index .metadata.labels "platform.koorikla.io/cni" {{ "}} " | trim }}.yaml'
            {{- /* mesh members (fleet file mesh.group -> label mesh.platform.koorikla.io/group): values/mesh-member.yaml */}}
            - 'values/mesh-{{ "{{" }} if index .metadata.labels "mesh.platform.koorikla.io/group" {{ "}}" }}member{{ "{{" }} else {{ "}}" }}none{{ "{{" }} end {{ "}}" }}.yaml'
            - {{ printf "../../installations/%s/addons/%s/values.yaml" $inst.name $addon | quote }}
            - '../../installations/{{ $inst.name }}/addons/{{ $addon }}/env-{{ "{{" }} index .metadata.labels "platform.koorikla.io/environment" {{ "}} " | trim }}.yaml'
            - '../../installations/{{ $inst.name }}/addons/{{ $addon }}/cluster-{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}} " | trim }}.yaml'
          {{- if or $cfg.clusterNameParameters $cfg.installationParameters $cfg.clusterServerParameters $cfg.clusterLabelParameters }}
          parameters:
            {{- range $p := $cfg.clusterNameParameters }}
            - name: {{ $p | quote }}
              value: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}} " | trim }}'
              forceString: true
            {{- end }}
            {{- /* installationParameters: <helm param>: <template over installation values>, rendered here once per
            installation, so subchart values that must equal installation.yaml facts are never restated by hand. */}}
            {{- range $p, $t := $cfg.installationParameters }}
            - name: {{ $p | quote }}
              value: {{ tpl $t $ | quote }}
            {{- end }}
            {{- range $p, $part := $cfg.clusterServerParameters }}
            {{- if not (hasKey $serverExpr $part) }}
            {{- fail (printf "addons.%s.clusterServerParameters.%s: %q is not one of url, host, port" $addon $p $part) }}
            {{- end }}
            - name: {{ $p | quote }}
              value: {{ index $serverExpr $part | squote }}
              {{- if ne $part "port" }}
              forceString: true
              {{- end }}
            {{- end }}
            {{- /* clusterLabelParameters: <helm param>: {label: <cluster secret label>, default: <string>} - the label's
            value on this cluster, else the default (empty if not given). Always a string (forceString). */}}
            {{- range $p, $l := $cfg.clusterLabelParameters }}
            {{- if not (and (kindIs "map" $l) $l.label) }}
            {{- fail (printf "addons.%s.clusterLabelParameters.%s: want {label: <key>, default: <value>}" $addon $p) }}
            {{- end }}
            {{- if and (hasKey $l "default") (not (kindIs "string" $l.default)) }}
            {{- fail (printf "addons.%s.clusterLabelParameters.%s: default must be a string (quote it: \"%v\")" $addon $p $l.default) }}
            {{- end }}
            - name: {{ $p | quote }}
              {{- if ne (get $l "default" | default "") "" }}
              value: '{{ "{{" }} $v := index .metadata.labels {{ $l.label | quote }} {{ "}}" }}{{ "{{" }} if $v {{ "}}" }}{{ "{{" }} $v {{ "}}" }}{{ "{{" }} else {{ "}}" }}{{ $l.default }}{{ "{{" }} end {{ "}}" }}'
              {{- else }}
              value: '{{ "{{" }} index .metadata.labels {{ $l.label | quote }} {{ "}}" }}'
              {{- end }}
              forceString: true
            {{- end }}
          {{- end }}
          valuesObject:
            cluster:
              name: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}} " | trim }}'
              role: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/role" {{ "}} " | trim }}'
              provider: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/provider" {{ "}} " | trim }}'
              region: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/region" {{ "}} " | trim }}'
              environment: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/environment" {{ "}} " | trim }}'
              cni: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/cni" {{ "}} " | trim }}'
            {{- toYaml $instValues | nindent 12 }}
      destination:
        server: '{{ "{{" }} .server {{ "}} " | trim }}'
        namespace: {{ $cfg.namespace | quote }}
      {{- if $cfg.ignoreDifferences }}
      ignoreDifferences:
        {{- toYaml $cfg.ignoreDifferences | nindent 8 }}
      {{- end }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          {{- if $cfg.ignoreDifferences }}
          - RespectIgnoreDifferences=true   # sync must not revert fields a controller owns (e.g. istiod's webhook policy)
          {{- end }}
          {{- if $cfg.serverSideDiff }}
          - ServerSideDiff=true
          {{- end }}
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
{{- end }}
