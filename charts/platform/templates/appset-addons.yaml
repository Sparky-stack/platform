{{- $inst := .Values.installation -}}
{{- $instValues := omit .Values "addons" -}}
{{- $defaultRev := $inst.revision | default "HEAD" -}}
{{- /* clusterServerParameters: <helm param>: <part of the Argo cluster secret's `server`> - goTemplate expressions
evaluated by the ApplicationSet controller per cluster (sprig urlParse; VERIFY live). hack/test.sh mirrors them. */ -}}
{{- $serverExpr := dict
  "url"  "{{ .server }}"
  "host" "{{ (urlParse .server).hostname }}"
  "port" "{{ $h := (urlParse .server).host }}{{ if regexMatch \":[0-9]+$\" $h }}{{ regexFind \"[0-9]+$\" $h }}{{ else }}443{{ end }}"
-}}
{{- range $addon, $cfg := .Values.addons }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "addon-%s" $addon | quote }}
  namespace: argocd
spec:
  goTemplate: true
  {{- /* fleetParameters: the cluster generator above, matrixed with a flat list of every platform cluster (Argo CD
  cluster secrets labelled platform.koorikla.io/name), so one Application can see the whole fleet (e.g. argo-events: one
  Falco endpoint per cluster). The flat list is a single element {clusters: [...]}: one Application per cluster still. */}}
  {{- $fleet := $cfg.fleetParameters | default list }}
  generators:
    {{- if $fleet }}
    - matrix:
        generators:
    {{- end }}
    {{- $in := ternary 10 4 (not (empty $fleet)) }}
    {{- $sel := dict "matchExpressions" (list (dict "key" "platform.koorikla.io/role" "operator" "In" "values" $cfg.roles)) }}
    {{- if $cfg.providers }}
    {{- $_ := set $sel "matchExpressions" (append $sel.matchExpressions (dict "key" "platform.koorikla.io/provider" "operator" "In" "values" $cfg.providers)) }}
    {{- end }}
    {{- if hasKey $cfg "default" | ternary $cfg.default true }}
    {{- $_ := set $sel "matchExpressions" (append $sel.matchExpressions (dict "key" (printf "addons.platform.koorikla.io/%s" $addon) "operator" "NotIn" "values" (list "false"))) }}
    {{- else }}
    {{- $_ := set $sel "matchExpressions" (append $sel.matchExpressions (dict "key" (printf "addons.platform.koorikla.io/%s" $addon) "operator" "In" "values" (list "true"))) }}
    {{- end }}
    {{- $gens := list (dict "clusters" (dict "selector" $sel)) }}
    {{- if $fleet }}
    {{- $gens = append $gens (dict "clusters" (dict "flatList" true "selector" (dict "matchExpressions" (list (dict "key" "platform.koorikla.io/name" "operator" "Exists"))))) }}
    {{- end }}
    {{- toYaml $gens | nindent $in }}
  template:
    metadata:
      name: '{{ $addon }}-{{ "{{" }} .name {{ "}} " | trim }}'
      {{- if hasKey $cfg "syncWave" }}
      annotations:
        argocd.argoproj.io/sync-wave: {{ $cfg.syncWave | quote }}
      {{- end }}
    spec:
      project: platform
      source:
        repoURL: {{ $inst.repoURL | quote }}
        targetRevision: '{{ "{{" }} $r := index .metadata.annotations "platform.koorikla.io/addons-revision" {{ "}} " | trim }}{{ "{{" }} if and $r (ne $r "HEAD") {{ "}} " | trim }}{{ "{{" }} $r {{ "}} " | trim }}{{ "{{" }} else {{ "}} " | trim }}{{ $defaultRev }}{{ "{{" }} end {{ "}} " | trim }}'
        path: {{ printf "addons/%s" $addon | quote }}
        helm:
          releaseName: {{ $cfg.releaseName | default $addon | quote }}
          ignoreMissingValueFiles: true
          valueFiles:
            - values.yaml
            - 'values/role-{{ "{{" }} index .metadata.labels "platform.koorikla.io/role" {{ "}} " | trim }}.yaml'
            - 'values/provider-{{ "{{" }} index .metadata.labels "platform.koorikla.io/provider" {{ "}} " | trim }}.yaml'
            - 'values/cni-{{ "{{" }} index .metadata.labels "platform.koorikla.io/cni" {{ "}} " | trim }}.yaml'
            {{- /* installationValueFiles: value files chosen by installation facts (e.g. external-dns'
            values/dns-<dns.provider>.yaml), rendered here once per installation; paths stay inside the addon. */}}
            {{- range $f := $cfg.installationValueFiles }}
            {{- $path := tpl $f $ }}
            {{- if or (hasPrefix "/" $path) (contains ".." $path) (contains "{{" $path) (not (hasPrefix "values/" $path)) }}
            {{- fail (printf "addons.%s.installationValueFiles: %q must be a file under addons/%s/values/" $addon $path $addon) }}
            {{- end }}
            - {{ $path | quote }}
            {{- end }}
            - {{ printf "../../installations/%s/addons/%s/values.yaml" $inst.name $addon | quote }}
            - '../../installations/{{ $inst.name }}/addons/{{ $addon }}/env-{{ "{{" }} index .metadata.labels "platform.koorikla.io/environment" {{ "}} " | trim }}.yaml'
            - '../../installations/{{ $inst.name }}/addons/{{ $addon }}/cluster-{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}} " | trim }}.yaml'
          {{- if or $cfg.clusterNameParameters $cfg.clusterNameFormats $cfg.clusterIdParameters $cfg.installationParameters $cfg.clusterServerParameters $fleet }}
          parameters:
            {{- range $p := $cfg.clusterNameParameters }}
            - name: {{ $p | quote }}
              value: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}} " | trim }}'
            {{- end }}
            {{- /* clusterNameFormats: <param>: <printf format with one %s> -> the cluster name inside a fixed text (e.g.
            falcosidekick customfields "cluster:%s"); a string, never a typed value. */}}
            {{- range $p, $f := $cfg.clusterNameFormats }}
            {{- $bare := replace "%%" "" $f }}
            {{- if or (ne (len (splitList "%" $bare)) 2) (not (contains "%s" $bare)) }}
            {{- fail (printf "addons.%s.clusterNameFormats.%s: %q must contain exactly one %%s" $addon $p $f) }}
            {{- end }}
            - name: {{ $p | quote }}
              value: {{ printf $f (printf "%s index .metadata.labels \"platform.koorikla.io/name\" %s" "{{" "}}") | squote }}
              forceString: true
            {{- end }}
            {{- /* fleetParameters: [<param>] -> {name1,name2,...} (helm list) of every platform cluster, sorted. */}}
            {{- range $p := $fleet }}
            - name: {{ $p | quote }}
              value: {{ `'{{ $n := list }}{{ range .clusters }}{{ $n = append $n (index .metadata.labels "platform.koorikla.io/name") }}{{ end }}{{ printf "{%s}" (join "," (sortAlpha $n)) }}'` }}
            {{- end }}
            {{- /* clusterIdParameters: <installation>-<cluster>, unique when several installations share something
            external (e.g. external-dns TXT owner in a shared zone). */}}
            {{- range $p := $cfg.clusterIdParameters }}
            - name: {{ $p | quote }}
              value: '{{ required "installation.name is required" $inst.name }}-{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}} " | trim }}'
              forceString: true
            {{- end }}
            {{- /* installationParameters: <helm param>: <template over installation values>, rendered here once per
            installation, so subchart values that must equal installation.yaml facts are never restated by hand. */}}
            {{- range $p, $t := $cfg.installationParameters }}
            - name: {{ $p | quote }}
              value: {{ tpl $t $ | quote }}
            {{- end }}
            {{- range $p, $part := $cfg.clusterServerParameters }}
            {{- if not (hasKey $serverExpr $part) }}
            {{- fail (printf "addons.%s.clusterServerParameters.%s: %q is not one of url, host, port" $addon $p $part) }}
            {{- end }}
            - name: {{ $p | quote }}
              value: {{ index $serverExpr $part | squote }}
              {{- if ne $part "port" }}
              forceString: true
              {{- end }}
            {{- end }}
          {{- end }}
          valuesObject:
            cluster:
              name: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}} " | trim }}'
              role: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/role" {{ "}} " | trim }}'
              provider: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/provider" {{ "}} " | trim }}'
              region: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/region" {{ "}} " | trim }}'
              environment: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/environment" {{ "}} " | trim }}'
              cni: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/cni" {{ "}} " | trim }}'
            {{- toYaml $instValues | nindent 12 }}
      destination:
        server: '{{ "{{" }} .server {{ "}} " | trim }}'
        namespace: {{ $cfg.namespace | quote }}
      {{- if $cfg.ignoreDifferences }}
      ignoreDifferences:
        {{- toYaml $cfg.ignoreDifferences | nindent 8 }}
      {{- end }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          {{- if $cfg.ignoreDifferences }}
          - RespectIgnoreDifferences=true   # sync must not revert fields a controller owns (e.g. istiod's webhook policy)
          {{- end }}
          {{- if $cfg.serverSideDiff }}
          - ServerSideDiff=true
          {{- end }}
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
{{- end }}
