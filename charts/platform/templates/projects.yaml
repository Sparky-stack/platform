apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform addons and management cluster components
{{- with .Values.sourceIntegrity }}{{ if .enabled }}
  # Git commit signature policy (Argo CD 3.5+ sourceIntegrity; replaces deprecated signatureKeys). docs/supply-chain.md
  sourceIntegrity:
    git:
      policies:
        - repos:
            {{- range .repos }}
            - url: {{ tpl . $ | quote }}
            {{- end }}
          gpg:
            mode: {{ .mode }}
            keys: {{ required "sourceIntegrity.keys must list GnuPG key IDs" .keys | toJson }}
{{- end }}{{ end }}
  sourceRepos:
    - '*'
  destinations:
    - server: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fleet
  namespace: argocd
spec:
  description: Workload cluster provisioning (CAPI, Argo registration, OpenChoreo identities)
{{- with .Values.sourceIntegrity }}{{ if .enabled }}
  # Git commit signature policy (Argo CD 3.5+ sourceIntegrity; replaces deprecated signatureKeys). docs/supply-chain.md
  sourceIntegrity:
    git:
      policies:
        - repos:
            {{- range .repos }}
            - url: {{ tpl . $ | quote }}
            {{- end }}
          gpg:
            mode: {{ .mode }}
            keys: {{ required "sourceIntegrity.keys must list GnuPG key IDs" .keys | toJson }}
{{- end }}{{ end }}
  sourceRepos:
    - {{ .Values.installation.repoURL | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: fleet
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: {{ ((.Values.openchoreo).orgNamespace) | default "default" | quote }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: openchoreo.dev
      kind: ClusterDataPlane
  namespaceResourceWhitelist:
    - group: ""
      kind: Secret
    - group: ""
      kind: ConfigMap
    - group: cluster.x-k8s.io
      kind: Cluster
    - group: addons.cluster.x-k8s.io
      kind: ClusterResourceSet
    - group: cert-manager.io
      kind: Issuer
    - group: cert-manager.io
      kind: Certificate
    - group: external-secrets.io
      kind: ExternalSecret
    - group: openchoreo.dev
      kind: Environment
{{- /* examples: the opt-in example charts (templates/appset-examples.yaml) on workload clusters. Only their own
namespaces, only Namespace as a cluster-scoped kind, only the namespaced kinds listed in examplesProject. */}}
{{- $exNs := list }}
{{- range $ex, $cfg := (.Values.examples | default dict) }}
{{- if $cfg.enabled }}{{ $exNs = append $exNs ($cfg.namespace | default $ex) }}{{ end }}
{{- end }}
{{- if $exNs }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: examples
  namespace: argocd
spec:
  description: Opt-in example charts (examples/<name>) - their namespaces only
  sourceRepos:
    - {{ .Values.installation.repoURL | quote }}
  destinations:
    {{- range $ns := $exNs | uniq }}
    - server: '*'
      namespace: {{ $ns | quote }}
    {{- end }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    {{- toYaml .Values.examplesProject.namespaceResources | nindent 4 }}
{{- end }}
