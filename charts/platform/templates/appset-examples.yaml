{{- /*
Examples (examples/<name>, Helm charts) - opt-in per installation (installation.yaml examples.<name>.enabled), applied
by Argo CD to the clusters matching examples.<name>.selector (labels only, never names). Values layering:
examples/<name>/values.yaml < installations/<inst>/examples/<name>/{values,cluster-<cluster>}.yaml < cluster.name.
*/ -}}
{{- $inst := .Values.installation -}}
{{- range $ex, $cfg := (.Values.examples | default dict) }}
{{- if $cfg.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "example-%s" $ex | quote }}
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          {{- required (printf "examples.%s.selector is required" $ex) $cfg.selector | toYaml | nindent 10 }}
  template:
    metadata:
      name: '{{ $ex }}-{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}}" }}'
    spec:
      project: examples              # templates/projects.yaml: the example namespaces only
      source:
        repoURL: {{ $inst.repoURL | quote }}
        targetRevision: {{ include "platform.addonsTargetRevision" $ }}
        path: {{ printf "examples/%s" $ex | quote }}
        helm:
          releaseName: {{ $ex | quote }}
          ignoreMissingValueFiles: true
          valueFiles:
            - values.yaml
            - {{ printf "../../installations/%s/examples/%s/values.yaml" $inst.name $ex | quote }}
            - '../../installations/{{ $inst.name }}/examples/{{ $ex }}/cluster-{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}}" }}.yaml'
          valuesObject:
            cluster:
              name: '{{ "{{" }} index .metadata.labels "platform.koorikla.io/name" {{ "}}" }}'
      destination:
        server: '{{ "{{" }} .server {{ "}}" }}'
        namespace: {{ $cfg.namespace | default $ex | quote }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:              # without limit, latest revision: as the addon ApplicationSets (#192)
          limit: -1
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
{{- end }}
{{- end }}
