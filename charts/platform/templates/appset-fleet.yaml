# Deleting (or disabling: *.yaml.disabled) a cluster file in installations/<inst>/clusters/*.yaml prunes the Application
# and deletes the CAPI Cluster.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: {{ .Values.installation.repoURL | quote }}
        revision: {{ .Values.installation.revision | default "HEAD" | quote }}
        files:
          - path: {{ printf "installations/%s/clusters/*.yaml" .Values.installation.name | quote }}
  template:
    metadata:
      name: 'cluster-{{ "{{" }} .name {{ "}} " | trim }}'
      # Background cascade: Argo CD deletes the CAPI Cluster like `kubectl delete` and CAPI tears it down in order
      # (control plane and machines, then infrastructure). The default (foreground) finalizer makes the garbage
      # collector delete the Cluster's dependents all at once: the DockerCluster went first and CAPD then never
      # finalizes the DockerMachine ("DockerCluster is not available yet"), leaving the Cluster Deleting (#115).
      finalizers:
        - resources-finalizer.argocd.argoproj.io/background
    spec:
      project: fleet
      source:
        repoURL: {{ .Values.installation.repoURL | quote }}
        targetRevision: {{ .Values.installation.revision | default "HEAD" | quote }}
        path: charts/cluster
        helm:
          releaseName: 'cluster-{{ "{{" }} .name {{ "}} " | trim }}'
          valueFiles:
            - {{ printf "../../installations/%s/installation.yaml" .Values.installation.name | quote }}
            - '../../{{ "{{" }} .path.path {{ "}} " | trim }}/{{ "{{" }} .path.filename {{ "}} " | trim }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: fleet
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ServerSideDiff=true
        # A cluster app waits on dependencies outside it: charts/cluster gates the Cluster on its registries
        # ExternalSecret (sync wave -1, needs e.g. the Harbor CA). Keep retrying (every 5m at most) on the latest
        # revision instead of giving up after a fixed count, which would leave the cluster unsynced until the next
        # commit.
        retry:
          limit: -1
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
