{{- /*
DEMO ONLY: seeds missing demoSecrets keys into kv-tenant-<project> via ESO Password + PushSecret IfNotExists (wave 10
so it never blocks sync before tenant-reconcile runs; docs/multicluster.md "Tenant secrets (OpenBao)").
*/ -}}
{{- if and .Values.secrets.tenantStores.enabled .Values.demoSecrets }}
{{- $p := include "tenant.project" . }}
{{- $d := .Values.tenantSecrets.demoSeed }}
{{- $ns := .Values.tenantSecrets.namespace }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $p }}-openbao-writer
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"    # final wave: not Ready before tenant-reconcile ran, never holds the sync
spec:
  provider:
    vault:
      server: {{ $d.addr | quote }}
      path: kv-tenant-{{ $p }}
      version: v2
      checkAndSet: { required: true }    # a new key is written with cas=0: fails rather than overwrite a concurrent write
      caProvider: { type: Secret, name: {{ $d.caSecret }}, key: ca.crt }
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $d.loginRole }}
          serviceAccountRef: { name: {{ $p }}-writer, audiences: [{{ $d.audience }}] }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $p }}-demo-value
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  length: 12             # 12 characters, hex-encoded: demo-only-<24 hex>
  encoding: hex
  prefix: demo-only-
  noUpper: false
  allowRepeat: false
{{- range $s := .Values.demoSecrets }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $p }}-seed-{{ $s.key }}
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: {{ $d.refreshInterval }}    # re-checks; a deleted value is seeded again
  updatePolicy: IfNotExists    # never overwrite: only a missing value is written
  deletionPolicy: None         # removing the entry or the tenant leaves the value in OpenBao
  secretStoreRefs:
    - { kind: SecretStore, name: {{ $p }}-openbao-writer }
  selector:
    generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: {{ $p }}-demo-value }
  data:
    - match:
        secretKey: password
        remoteRef: { remoteKey: {{ $s.key }}, property: {{ $s.property }} }
{{- end }}
{{- end }}
