{{- /*
DEMO ONLY (tenant file demoSecrets; docs/multicluster.md "Tenant secrets (OpenBao)", docs/demo.md step 8). A clean
bootstrap starts with an empty OpenBao, so the values a demo app's SecretReferences point to are seeded here instead of by
hand: CronJob <project>-demo-secrets runs files/seed-demo-secrets.sh as ServiceAccount <project>-writer (templates/
secrets.yaml; OpenBao role tenant-writer: kv-tenant-<project> of its own entity, nothing else; never root). Values are
generated in the pod (demo-only-<hex>), never in git; existing properties are never overwritten. A CronJob, not a sync
hook: it fails and retries until OpenBao and tenant-reconcile (mount + writer alias) are there, without holding any sync.
*/ -}}
{{- if and .Values.secrets.tenantStores.enabled .Values.demoSecrets }}
{{- $p := include "tenant.project" . }}
{{- $d := .Values.tenantSecrets.demoSeed }}
{{- $seeds := list }}
{{- range $s := .Values.demoSecrets }}
{{- $seeds = append $seeds (printf "%s/%s" $s.key $s.property) }}
{{- end }}
{{- $env := list
  (dict "name" "BAO_ADDR" "value" $d.addr)
  (dict "name" "BAO_CACERT" "value" "/openbao/tls/ca.crt")
  (dict "name" "HOME" "value" "/tmp")
  (dict "name" "TOKEN_FILE" "value" "/var/run/secrets/openbao/token")
  (dict "name" "LOGIN_ROLE" "value" $d.loginRole)
  (dict "name" "MOUNT" "value" (printf "kv-tenant-%s" $p))
  (dict "name" "SEEDS" "value" (join " " $seeds))
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $p }}-demo-secrets
  namespace: {{ .Values.tenantSecrets.namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
data:
  seed-demo-secrets.sh: |
    {{- .Files.Get "files/seed-demo-secrets.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $p }}-demo-secrets
  namespace: {{ .Values.tenantSecrets.namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"    # final wave: a failing run (OpenBao not ready yet) never fails the sync
spec:
  schedule: {{ $d.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: { app.kubernetes.io/name: demo-secrets }
          annotations:
            checksum/config: {{ printf "%s%s" (.Files.Get "files/seed-demo-secrets.sh") (toJson $env) | sha256sum | trunc 16 }}
        spec:
          serviceAccountName: {{ $p }}-writer
          automountServiceAccountToken: false    # no Kubernetes API access; the token below is for OpenBao only
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: seed
              image: {{ printf "%s/%s:%s" $d.image.registry $d.image.repository $d.image.tag | quote }}
              command: [/bin/sh, /scripts/seed-demo-secrets.sh]
              env:
                {{- toYaml $env | nindent 16 }}
              resources:
                {{- toYaml $d.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: token, mountPath: /var/run/secrets/openbao, readOnly: true }
                - { name: tls-ca, mountPath: /openbao/tls, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: scripts
              configMap: { name: {{ $p }}-demo-secrets }
            - name: token
              projected:
                sources:
                  - serviceAccountToken: { audience: {{ $d.audience | quote }}, expirationSeconds: 600, path: token }
            - name: tls-ca
              secret: { secretName: {{ $d.caSecret }}, items: [{ key: ca.crt, path: ca.crt }] }
            - name: tmp
              emptyDir: { sizeLimit: 16Mi }
{{- end }}
