{{- /*
ApplicationSet previews-<project> (mgmt, argocd; docs/preview-environments.md): per GitHub app repo, the matrix of
  git files    the one Component named like the app carrying the opt-in annotation (previewOptIn; the opt-in lives
               in the app repo only)
  pullRequest  the repo's open PRs (token of the platform GitHub App, minted by addon secret-stores)
-> Application preview-<component>-pr-<n> rendering charts/preview at the PR head SHA (AppProject previews). A closed or
merged PR drops out of the generator, so its Application and Environment are deleted. The Application renders
resources only once the PR carries grantedLabel, which only the auto-build pass sets, serially and within the tenant's
previews.maxPerTenant (#385); and never while the PR is expired (expiredLabel) or opened by a bot without botLabel
(skipBots). Creating the Application at once and capping at admission does not work: Kyverno's count cannot see
concurrent creates.
Only values that cannot inject anything reach the template: number, head_sha, labels and the Component name (pinned
to the app name by the selector). Branch names, titles and the author are never rendered (the author only feeds a
true/false test).
*/ -}}
{{- $pv := .Values.previews }}
{{- /* Only GitHub repositories have a pull request generator here; other apps of the tenant simply get no previews. */ -}}
{{- $gh := list }}
{{- range $app := include "tenant.apps" . | fromYamlArray }}
{{- $m := regexFind "^https://github\\.com/[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$" (trimSuffix ".git" (trimSuffix "/" $app.repoURL)) }}
{{- if $m }}{{ $gh = append $gh (merge (dict "slug" (trimPrefix "https://github.com/" $m)) $app) }}{{ end }}
{{- end }}
{{- /* The pull request generator authenticates with the platform GitHub App's token (addon secret-stores renders it
only with secrets.githubGateApp.enabled): without the App no ApplicationSet, which would only report errors (#192). */ -}}
{{- $gate := dig "githubGateApp" "enabled" false .Values.secrets }}
{{- if and $pv.enabled $gh $gate }}
{{- $p := include "tenant.project" . }}
{{- $label := $pv.expiredLabel | default "preview-expired" }}
{{- $granted := required "previews.grantedLabel is required" $pv.grantedLabel }}
{{- $botLabel := required "previews.botLabel is required" $pv.botLabel }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: previews-{{ $p }}
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    platform.koorikla.io/preview: "true"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    {{- range $app := $gh }}
    {{- $parts := splitList "/" $app.slug }}
    - matrix:
        generators:
          - git:
              repoURL: {{ $app.repoURL | quote }}
              revision: {{ $app.revision | quote }}
              files:
                - path: {{ printf "%s/*.yaml" (trimSuffix "/" $app.path) | quote }}
            selector:
              matchLabels:
                kind: Component
                metadata.name: {{ $app.name }}
              matchExpressions:
                - key: {{ printf "metadata.annotations.%s" $.Values.previewOptIn.annotation }}
                  operator: In
                  values: [{{ $.Values.previewOptIn.value | quote }}]
          - pullRequest:
              github:
                owner: {{ index $parts 0 | quote }}
                repo: {{ index $parts 1 | quote }}
                tokenRef:
                  secretName: {{ $.Values.previewToken.secretName }}
                  key: token
              requeueAfterSeconds: {{ $pv.requeueAfterSeconds | default 1800 }}
              values:
                repository: {{ printf "%s/%s" (index $parts 0) (index $parts 1) | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ `'preview-{{ .metadata.name }}-pr-{{ .number }}'` }}
      labels:
        {{- include "tenant.labels" . | nindent 8 }}
        platform.koorikla.io/preview: "true"
        platform.koorikla.io/component: {{ `'{{ .metadata.name }}'` }}
        platform.koorikla.io/pull-request: {{ `'{{ .number }}'` }}
      annotations:
        platform.koorikla.io/repository: {{ `'{{ .values.repository }}'` }}
        platform.koorikla.io/commit: {{ `'{{ .head_sha }}'` }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io   # PR closed -> Application deleted -> Environment deleted
    spec:
      project: {{ .Values.previewProject }}
      source:
        repoURL: {{ .Values.installation.repoURL | quote }}
        targetRevision: {{ .Values.installation.revision | default "HEAD" | quote }}
        path: charts/preview
        helm:
          valuesObject:
            project: {{ $p }}
            component: {{ `'{{ .metadata.name }}'` }}
            pullRequest: {{ `'{{ .number }}'` }}
            commit: {{ `'{{ .head_sha }}'` }}
            repository: {{ `'{{ .values.repository }}'` }}
            expired: {{ printf "'{{ has %q .labels }}'" $label }}
            granted: {{ printf "'{{ has %q .labels }}'" $granted }}
            {{- if $pv.skipBots }}
            bot: {{ printf "'{{ and (hasSuffix \"[bot]\" .author) (not (has %q .labels)) }}'" $botLabel }}
            {{- else }}
            bot: "false"
            {{- end }}
            openchoreo:
              orgNamespace: {{ .Values.openchoreo.orgNamespace }}
            previews:
              dataPlane: {{ $pv.dataPlane }}
      destination:
        server: {{ .Values.argocd.server }}
        namespace: {{ .Values.openchoreo.orgNamespace }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
        # Unlimited retries heal first-boot races. The tenant cap never makes a preview wait here: without a grant the
        # Application renders nothing (#385); Kyverno platform-preview-cap is only the backstop (e.g. a hand-set label).
        retry:
          limit: -1
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
{{- end }}
