{{- /* Checks values.schema.json cannot express (formats and required keys live there). Renders nothing. */ -}}
{{- $_ := required "project is required (tenant file)" .Values.project -}}
{{- $seen := dict -}}
{{- range $i, $a := .Values.apps -}}
{{- if hasKey $seen $a.name -}}{{- fail (printf "apps: duplicate name %q" $a.name) -}}{{- end -}}
{{- $_ := set $seen $a.name true -}}
{{- /* The VAP openchoreo-gated-bindings-from-git trusts only Applications named <project>-<app>-<gated env>: a main
Application <project>-<app> must never look like one. */ -}}
{{- range $env := $.Values.promotion.gatedEnvironments -}}
{{- if hasSuffix (printf "-%s" $env) $a.name -}}{{- fail (printf "apps[%d].name %q must not end in -%s (gated environment: reserved for the gated Application)" $i $a.name $env) -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- range $w := .Values.promotion.freezeWindows -}}
{{- if eq (include "tenant.minuteOfWeek" $w.start) (include "tenant.minuteOfWeek" $w.end) -}}
{{- fail (printf "promotion.freezeWindows %q: start == end" ($w.name | default $w.start)) -}}
{{- end -}}
{{- end -}}
{{- /* The restricted groups (developers) hold EVERY developer: as a tenant developer group they would give all of them
write access to this project, which is what per-project authz (templates/developer-authz.yaml, #335) prevents. */ -}}
{{- range $g := .Values.developerGroups -}}
{{- if has $g ($.Values.promotion.restrictedGroups | default list) -}}
{{- fail (printf "developerGroups: %q is an org-wide group (promotion.restrictedGroups); use a group of this project's developers" $g) -}}
{{- end -}}
{{- end -}}
