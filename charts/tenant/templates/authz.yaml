{{- /*
Deny component:delete on gated Components for restricted and developer groups so GC cannot drop gated ReleaseBindings;
offboarding stays a Git change in the tenant file (docs/promotion.md "Git is the only path").
*/ -}}
{{- $p := include "tenant.project" . }}
{{- $components := list }}
{{- range $app := include "tenant.apps" . | fromYamlArray }}
{{- if include "tenant.gatedEnvs" (list $app $) | fromYamlArray }}{{ $components = append $components $app.name }}{{ end }}
{{- end }}
{{- if $components }}
{{- $groups := concat (.Values.promotion.restrictedGroups | default list) (include "tenant.developerGroups" . | fromYamlArray) | uniq }}
{{- range $group := $groups }}
---
apiVersion: openchoreo.dev/v1alpha1
kind: AuthzRoleBinding
metadata:
  name: {{ printf "%s-promotion-deny-component-delete-%s" $p ($group | lower | replace "_" "-") | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Values.openchoreo.orgNamespace }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openchoreo.dev/description: {{ printf "%s may not delete the gated Components of project %s: offboarding is a reviewed change of the tenant file" $group $p | quote }}
spec:
  effect: deny
  entitlement:
    claim: groups
    value: {{ $group | quote }}
  roleMappings:
    {{- range $components }}
    - roleRef:
        kind: ClusterAuthzRole
        name: {{ $.Values.promotion.componentDeleterRole }}
      scope:
        project: {{ $p }}
        component: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
