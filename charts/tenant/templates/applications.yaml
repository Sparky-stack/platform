{{- /*
Applications <project>-<app> (mgmt, argocd): the app repo's plain manifests (<path>, recursive) -> the control plane's
org namespace; OpenChoreo delivers the workloads, Argo never touches a workload cluster for apps.
Each gated environment's binding file (docs/promotion.md) is excluded there and synced by its own Application
<project>-<app>-<env>, so the AppProject's freeze windows stop production without stopping development/staging.
*/ -}}
{{- $p := include "tenant.project" . }}
{{- range $app := include "tenant.apps" . | fromYamlArray }}
{{- $gated := include "tenant.gatedEnvs" (list $app $) | fromYamlArray }}
{{- $files := list }}
{{- range $gated }}{{ $files = append $files (replace "{environment}" . $.Values.promotion.bindingFile) }}{{ end }}
{{- /* Argo CD directory include/exclude take one glob; several files need the {a,b} form. */}}
{{- $units := list (dict "suffix" "" "env" "" "exclude" (ternary (printf "{%s}" (join "," $files)) (join "," $files) (gt (len $files) 1))) }}
{{- range $i, $env := $gated }}
{{- $units = append $units (dict "suffix" (printf "-%s" $env) "env" $env "include" (index $files $i)) }}
{{- end }}
{{- range $u := $units }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $p }}-{{ $app.name }}{{ $u.suffix }}
  namespace: {{ $.Values.argocd.namespace }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
    platform.koorikla.io/app: {{ $app.name }}
    {{- if $u.env }}
    platform.koorikla.io/environment: {{ $u.env }}
    platform.koorikla.io/promotion-gated: "true"
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # offboarding (app removed from the tenant file) deletes its resources
spec:
  project: tenant-{{ $p }}
  source:
    repoURL: {{ $app.repoURL | quote }}
    targetRevision: {{ $app.revision | quote }}
    path: {{ $app.path | quote }}
    directory:
      recurse: true
      {{- with $u.include }}
      include: {{ . | quote }}
      {{- end }}
      {{- with $u.exclude }}
      exclude: {{ . | quote }}
      {{- end }}
  destination:
    server: {{ $.Values.argocd.server }}
    namespace: {{ $.Values.openchoreo.orgNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 1m
{{- end }}
{{- end }}
