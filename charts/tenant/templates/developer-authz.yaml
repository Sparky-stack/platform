{{- /*
Per-project developer allow per group in developerGroups (default <project>-developers). Gated binding writes are
excluded on this allow directly because OpenChoreo resolves deny per entitlement value, not across groups (#335).
*/ -}}
{{- $p := include "tenant.project" . }}
{{- $ns := .Values.openchoreo.orgNamespace }}
{{- $gated := list }}
{{- range .Values.promotion.gatedEnvironments }}{{ $gated = append $gated (printf "%s/%s" $ns .) }}{{ end }}
{{- range $group := include "tenant.developerGroups" . | fromYamlArray }}
---
apiVersion: openchoreo.dev/v1alpha1
kind: AuthzRoleBinding
metadata:
  name: {{ printf "%s-developer-%s" $p ($group | lower | replace "_" "-") | trunc 63 | trimSuffix "-" }}
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openchoreo.dev/description: {{ printf "%s develop project %s only; bindings in %s change by reviewed pull request" $group $p (join ", " ($.Values.promotion.gatedEnvironments | default list)) | quote }}
spec:
  effect: allow
  entitlement:
    claim: groups
    value: {{ $group | quote }}
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: {{ $.Values.developerRole }}
      scope:
        project: {{ $p }}
      {{- if $gated }}
      conditions:
        - actions:
            {{- range $.Values.promotion.bindingWriteActions }}
            - {{ . }}
            {{- end }}
          expression: {{ printf "!(resource.environment in %s)" ($gated | toJson) | quote }}
      {{- end }}
{{- end }}
