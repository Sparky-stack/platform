{{- /*
Tenant OpenBao descriptor + writer ServiceAccount consumed by addon openbao tenant-reconcile (docs/multicluster.md).
*/ -}}
{{- if .Values.secrets.tenantStores.enabled }}
{{- $p := include "tenant.project" . }}
{{- $nss := list }}
{{- range $env := .Values.deploymentPipeline.environments }}
{{- $nss = append $nss (include "tenant.cellNamespace" (dict "org" $.Values.openchoreo.orgNamespace "project" $p "env" $env)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $p }}-openbao-tenant
  namespace: {{ .Values.tenantSecrets.namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    {{ .Values.tenantSecrets.label }}: "true"
type: Opaque
stringData:
  tenant: {{ $p | quote }}
  namespaces: {{ join " " $nss | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $p }}-writer
  namespace: {{ .Values.tenantSecrets.namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
