{{- /*
Per-tenant secrets (installation.yaml secrets.tenantStores.enabled; docs/multicluster.md "Tenant secrets (OpenBao)").
Rendered on mgmt into tenantSecrets.namespace (created by addon openbao), read by its CronJob tenant-reconcile:
  Secret <project>-openbao-tenant   label tenantSecrets.label; tenant = <project>, namespaces = the project's cell
                                    namespace on every pipeline environment (tenant.cellNamespace). OpenBao role
                                    tenants-<cluster>/<project> accepts the SecretStore ServiceAccount of exactly these
                                    namespaces, and entity tenant-<project> confines it to kv-tenant-<project>.
  ServiceAccount <project>-writer   OpenBao Kubernetes auth role tenant-writer: write kv-tenant-<project> (who may mint
                                    a token for it - RBAC in tenantSecrets.namespace - may write the tenant's secrets)
The SecretStore openbao-tenant in each cell namespace is rendered on the data planes (addon secret-stores).
*/ -}}
{{- if .Values.secrets.tenantStores.enabled }}
{{- $p := include "tenant.project" . }}
{{- $nss := list }}
{{- range $env := .Values.deploymentPipeline.environments }}
{{- $nss = append $nss (include "tenant.cellNamespace" (dict "org" $.Values.openchoreo.orgNamespace "project" $p "env" $env)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $p }}-openbao-tenant
  namespace: {{ .Values.tenantSecrets.namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    {{ .Values.tenantSecrets.label }}: "true"
type: Opaque
stringData:
  tenant: {{ $p | quote }}
  namespaces: {{ join " " $nss | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $p }}-writer
  namespace: {{ .Values.tenantSecrets.namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
