suite: tenant - demo secrets seeded by ESO (Password generator + PushSecret IfNotExists, never overwritten)
templates:
  - templates/validate.yaml
  - templates/demo-secrets.yaml
set:
  project: demo
  secrets: { tenantStores: { enabled: true } }
  demoSecrets:
    - { key: hello-world, property: greeting }
tests:
  - it: renders nothing without demoSecrets
    template: templates/demo-secrets.yaml
    set: { demoSecrets: [] }
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders nothing unless secrets.tenantStores.enabled
    template: templates/demo-secrets.yaml
    set: { secrets: { tenantStores: { enabled: false } } }
    asserts:
      - hasDocuments: { count: 0 }

  - it: store logs in as the tenant's own writer (role tenant-writer, audience openbao) on its own mount only
    template: templates/demo-secrets.yaml
    documentSelector: { path: kind, value: SecretStore }
    asserts:
      - containsDocument: { kind: SecretStore, apiVersion: external-secrets.io/v1, name: demo-openbao-writer, namespace: openbao-tenants }
      - equal:
          path: spec.provider.vault
          value:
            server: https://openbao-active.openbao.svc:8200
            path: kv-tenant-demo
            version: v2
            checkAndSet: { required: true }
            caProvider: { type: Secret, name: openbao-ca, key: ca.crt }
            auth:
              kubernetes:
                mountPath: kubernetes
                role: tenant-writer
                serviceAccountRef: { name: demo-writer, audiences: [openbao] }

  - it: generator yields demo-only-<24 hex> (12 characters, hex-encoded)
    template: templates/demo-secrets.yaml
    documentSelector: { path: kind, value: Password }
    asserts:
      - containsDocument: { kind: Password, apiVersion: generators.external-secrets.io/v1alpha1, name: demo-demo-value, namespace: openbao-tenants }
      - equal: { path: spec.prefix, value: demo-only- }
      - equal: { path: spec.encoding, value: hex }
      - equal: { path: spec.length, value: 12 }

  - it: one PushSecret per key; never overwrites (IfNotExists), never deletes (None), only through the writer store
    template: templates/demo-secrets.yaml
    set:
      demoSecrets:
        - { key: hello-world, property: greeting }
        - { key: db, property: password }
    documentSelector: { path: kind, value: PushSecret, matchMany: true }
    asserts:
      - matchRegex: { path: metadata.name, pattern: '^demo-seed-(hello-world|db)$' }
      - equal: { path: metadata.namespace, value: openbao-tenants }
      - equal: { path: spec.updatePolicy, value: IfNotExists }
      - equal: { path: spec.deletionPolicy, value: None }
      - equal: { path: spec.secretStoreRefs, value: [{ kind: SecretStore, name: demo-openbao-writer }] }
      - equal:
          path: spec.selector
          value: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: demo-demo-value } }

  - it: PushSecret maps the generated value to <key>/<property> and re-checks every refreshInterval
    template: templates/demo-secrets.yaml
    documentSelector: { path: kind, value: PushSecret }
    asserts:
      - equal: { path: metadata.name, value: demo-seed-hello-world }
      - equal: { path: spec.refreshInterval, value: 5m }
      - equal:
          path: spec.data
          value: [{ match: { secretKey: password, remoteRef: { remoteKey: hello-world, property: greeting } } }]

  - it: renders the store, the generator and one PushSecret per key, all in the final sync wave (not Ready before
      tenant-reconcile ran, never holds the sync)
    template: templates/demo-secrets.yaml
    set:
      demoSecrets:
        - { key: hello-world, property: greeting }
        - { key: db, property: password }
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "10" }

  - it: rejects a key listed twice (one PushSecret per key)
    template: templates/validate.yaml
    set:
      demoSecrets:
        - { key: hello-world, property: greeting }
        - { key: hello-world, property: other }
    asserts:
      - failedTemplate: { errorMessage: 'demoSecrets[1]: key "hello-world" is listed twice (one entry per key: PushSecret <project>-seed-<key>)' }

  - it: rejects a key that is no DNS label (it names the PushSecret)
    template: templates/demo-secrets.yaml
    set:
      demoSecrets:
        - { key: Db_Pass, property: password }
    asserts:
      - failedTemplate: { errorPattern: "at '/demoSecrets/0/key': 'Db_Pass' does not match pattern" }
