suite: tenant - PR preview ApplicationSet
templates:
  - templates/previews.yaml
set:
  project: demo
  apps:
    - name: hello-world
      repoURL: https://github.com/koorikla/hello-world.git
    - name: other
      repoURL: https://github.com/koorikla/other
      path: ops/oc/
      revision: v1.2.3
  previews:
    enabled: true
    dataPlane: dev1
    requeueAfterSeconds: 120
    expiredLabel: preview-expired
    grantedLabel: preview-granted
    skipBots: true
    botLabel: preview
  secrets.githubGateApp.enabled: true   # platform GitHub App seeded (charts/platform values.yaml, #192)
tests:
  - it: renders nothing while previews are off (the default)
    set:
      previews.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: one matrix per app repo - the Component opt-in from the app repo x its open pull requests
    asserts:
      - isKind: { of: ApplicationSet }
      - equal: { path: metadata.name, value: previews-demo }
      - equal: { path: metadata.namespace, value: argocd }
      - lengthEqual: { path: spec.generators, count: 2 }
      - equal:
          path: spec.generators[0].matrix.generators[0]
          value:
            git:
              repoURL: https://github.com/koorikla/hello-world.git
              revision: main
              files: [{ path: deploy/openchoreo/*.yaml }]
            selector:
              matchLabels: { kind: Component, metadata.name: hello-world }
              matchExpressions:
                - { key: metadata.annotations.platform.koorikla.io/preview-environments, operator: In, values: [enabled] }
      - equal:
          path: spec.generators[0].matrix.generators[1].pullRequest
          value:
            github:
              owner: koorikla
              repo: hello-world
              tokenRef: { secretName: preview-github-token, key: token }
            requeueAfterSeconds: 120
            values: { repository: koorikla/hello-world }
      - equal: { path: "spec.generators[1].matrix.generators[0].git.files[0].path", value: ops/oc/*.yaml }
      - equal: { path: "spec.generators[1].matrix.generators[0].git.revision", value: v1.2.3 }
      - equal: { path: "spec.generators[1].matrix.generators[0].selector.matchLabels", value: { kind: Component, metadata.name: other } }
      - equal: { path: "spec.generators[1].matrix.generators[1].pullRequest.github.repo", value: other }

  - it: generates preview Applications in AppProject previews from charts/preview of the platform repo
    asserts:
      - equal: { path: spec.template.metadata.name, value: "preview-{{ .metadata.name }}-pr-{{ .number }}" }
      - equal: { path: spec.template.spec.project, value: previews }
      - equal: { path: spec.template.spec.source.path, value: charts/preview }
      - equal: { path: spec.template.spec.source.repoURL, value: https://github.com/koorikla/platform.git }
      - equal: { path: spec.template.spec.destination, value: { server: https://kubernetes.default.svc, namespace: default } }
      - equal: { path: spec.template.metadata.finalizers, value: [resources-finalizer.argocd.argoproj.io] }
      - equal: { path: spec.template.spec.syncPolicy.automated, value: { prune: true, selfHeal: true } }
      - equal: { path: spec.template.spec.syncPolicy.retry.limit, value: -1 }
      - equal:
          path: spec.template.spec.source.helm.valuesObject
          value:
            project: demo
            component: "{{ .metadata.name }}"
            pullRequest: "{{ .number }}"
            commit: "{{ .head_sha }}"
            repository: "{{ .values.repository }}"
            expired: '{{ has "preview-expired" .labels }}'
            granted: '{{ has "preview-granted" .labels }}'
            bot: '{{ and (hasSuffix "[bot]" .author) (not (has "preview" .labels)) }}'
            openchoreo: { orgNamespace: default }
            previews: { dataPlane: dev1 }

  - it: never renders free-text pull request fields (branch, title, author) into the template
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value: { platform.koorikla.io/repository: "{{ .values.repository }}", platform.koorikla.io/commit: "{{ .head_sha }}" }
      - equal:
          path: spec.template.metadata.labels
          value:
            platform.koorikla.io/tenant: demo
            app.kubernetes.io/managed-by: Helm
            platform.koorikla.io/preview: "true"
            platform.koorikla.io/component: "{{ .metadata.name }}"
            platform.koorikla.io/pull-request: "{{ .number }}"

  - it: apps outside github.com get no previews (the rest of the tenant does)
    set:
      apps:
        - { name: x, repoURL: https://gitlab.com/acme/x.git }
        - { name: hello-world, repoURL: https://github.com/koorikla/hello-world.git }
    asserts:
      - lengthEqual: { path: spec.generators, count: 1 }
      - equal: { path: "spec.generators[0].matrix.generators[1].pullRequest.github.repo", value: hello-world }

  - it: no GitHub app at all - no ApplicationSet
    set:
      apps:
        - { name: x, repoURL: https://gitlab.com/acme/x.git }
    asserts:
      - hasDocuments: { count: 0 }

  - it: "skipBots false: bot pull requests render their preview like any other (#385)"
    set: { previews.skipBots: false }
    asserts:
      - equal: { path: spec.template.spec.source.helm.valuesObject.bot, value: "false" }

  - it: refuses a granted label that could break the template expression
    set:
      previews.grantedLabel: 'x" .labels }}{{ "'
    asserts:
      - failedTemplate: { errorPattern: "at '/previews/grantedLabel': .* does not match pattern" }

  - it: "no preview without the grant: the granted value tests the label only the auto-build pass sets (#385)"
    set: { previews.grantedLabel: slot ok }
    asserts:
      - equal: { path: spec.template.spec.source.helm.valuesObject.granted, value: "{{ has \"slot ok\" .labels }}" }

  - it: refuses a bot label that could break the template expression
    set:
      previews.botLabel: 'x" .labels }}{{ "'
    asserts:
      - failedTemplate: { errorPattern: "at '/previews/botLabel': .* does not match pattern" }

  - it: refuses an expiry label that could break the template expression
    set:
      previews.expiredLabel: 'x" .labels }}{{ "'
    asserts:
      - failedTemplate: { errorPattern: "at '/previews/expiredLabel': .* does not match pattern" }

  - it: "negative: no preview ApplicationSet without the platform GitHub App (its token comes from the App; #192)"
    set: { secrets.githubGateApp.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }
