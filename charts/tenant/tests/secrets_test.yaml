suite: tenant - per-tenant OpenBao secrets (descriptor + writer ServiceAccount)
templates:
  - templates/secrets.yaml
set:
  project: demo
tests:
  - it: renders nothing unless secrets.tenantStores.enabled (opt-in per installation)
    asserts:
      - hasDocuments: { count: 0 }

  - it: descriptor lists exactly the project's cell namespaces, named like OpenChoreo 1.3.3 names them (live names)
    set:
      secrets: { tenantStores: { enabled: true } }
    asserts:
      - hasDocuments: { count: 2 }
      - containsDocument: { kind: Secret, apiVersion: v1, name: demo-openbao-tenant, namespace: openbao-tenants }
        documentIndex: 0
      - equal: { path: 'metadata.labels["openbao.platform.koorikla.io/tenant"]', value: "true" }
        documentIndex: 0
      - equal: { path: stringData.tenant, value: demo }
        documentIndex: 0
      - equal:
          path: stringData.namespaces
          value: dp-default-demo-development-ad621210 dp-default-demo-staging-ba410b48 dp-default-demo-production-7cbe998d
        documentIndex: 0
      - containsDocument: { kind: ServiceAccount, apiVersion: v1, name: demo-writer, namespace: openbao-tenants }
        documentIndex: 1
      - equal: { path: automountServiceAccountToken, value: false }
        documentIndex: 1

  - it: long project names are truncated per part like OpenChoreo's GenerateK8sNameWithLengthLimit (hash of the full name)
    set:
      project: a-very-long-project-name
      secrets: { tenantStores: { enabled: true } }
    asserts:
      - equal:
          path: stringData.namespaces
          value: dp-default-a-very-long-p-development-3b32137b dp-default-a-very-long-p-staging-fd5cf818 dp-default-a-very-long-p-production-7f7f91aa
        documentIndex: 0

  - it: follows the org namespace and the pipeline environments
    set:
      secrets: { tenantStores: { enabled: true } }
      openchoreo: { orgNamespace: acme }
      deploymentPipeline: { environments: [dev] }
    asserts:
      - equal: { path: stringData.namespaces, value: dp-acme-demo-dev-cffb8767 }
        documentIndex: 0
