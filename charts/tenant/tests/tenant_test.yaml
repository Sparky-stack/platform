suite: tenant (AppProject + OpenChoreo Project + app Applications)
templates:
  - templates/validate.yaml
  - templates/appproject.yaml
  - templates/project.yaml
  - templates/applications.yaml
  - templates/authz.yaml
set:
  project: demo
  description: Demo project
  apps:
    - name: hello-world
      repoURL: https://github.com/koorikla/hello-world.git
    - name: other
      repoURL: https://github.com/koorikla/other.git
      path: ops/oc
      revision: v1.2.3
tests:
  - it: requires a project name
    template: templates/validate.yaml
    set:
      project: ""
    asserts:
      - failedTemplate: { errorMessage: "project is required (tenant file)" }

  - it: rejects non DNS-1123 project names
    template: templates/project.yaml
    set:
      project: Demo_1
    asserts:
      - failedTemplate: { errorPattern: "at '/project': 'Demo_1' does not match pattern" }

  - it: rejects duplicate app names (first template rendering the app list fails)
    template: templates/validate.yaml
    set:
      apps:
        - { name: a, repoURL: https://x/a.git }
        - { name: a, repoURL: https://x/b.git }
    asserts:
      - failedTemplate: { errorMessage: 'apps: duplicate name "a"' }

  - it: rejects app names ending in -<gated environment> (they would pass as the gated Application in the VAP)
    template: templates/validate.yaml
    set:
      apps:
        - { name: hotfix-production, repoURL: https://x/a.git }
    asserts:
      - failedTemplate: { errorMessage: 'apps[0].name "hotfix-production" must not end in -production (gated environment: reserved for the gated Application)' }

  - it: AppProject allows only the tenant's repos, the org namespace on mgmt and developer kinds
    template: templates/appproject.yaml
    asserts:
      - isKind: { of: AppProject }
      - equal: { path: metadata.name, value: tenant-demo }
      - equal: { path: metadata.namespace, value: argocd }
      - equal:
          path: spec.sourceRepos
          value: [https://github.com/koorikla/hello-world.git, https://github.com/koorikla/other.git]
      - equal:
          path: spec.destinations
          value: [{ server: "https://kubernetes.default.svc", namespace: default }]
      - equal: { path: spec.clusterResourceWhitelist, value: [] }
      - contains: { path: spec.namespaceResourceWhitelist, content: { group: openchoreo.dev, kind: Component } }
      - contains: { path: spec.namespaceResourceWhitelist, content: { group: openchoreo.dev, kind: ReleaseBinding } }
      - contains: { path: spec.namespaceResourceWhitelist, content: { group: openchoreo.dev, kind: Resource } }
      - contains: { path: spec.namespaceResourceWhitelist, content: { group: openchoreo.dev, kind: ResourceReleaseBinding } }
      - notContains: { path: spec.namespaceResourceWhitelist, content: { group: openchoreo.dev, kind: ResourceRelease } }
      - notContains: { path: spec.namespaceResourceWhitelist, content: { group: openchoreo.dev, kind: Project } }
      - notContains: { path: spec.namespaceResourceWhitelist, content: { group: openchoreo.dev, kind: Environment } }
      - notContains: { path: spec.namespaceResourceWhitelist, content: { group: "*", kind: "*" } }

  - it: AppProject with no apps has no source repos
    template: templates/appproject.yaml
    set:
      apps: []
    asserts:
      - equal: { path: spec.sourceRepos, value: [] }

  - it: OpenChoreo Project on the default pipeline and project type
    template: templates/project.yaml
    documentIndex: 0
    asserts:
      - isKind: { of: Project }
      - equal: { path: metadata.name, value: demo }
      - equal: { path: metadata.namespace, value: default }
      - equal: { path: spec.deploymentPipelineRef.name, value: default }
      - equal: { path: spec.type, value: { kind: ClusterProjectType, name: default } }

  - it: one ProjectReleaseBinding per pipeline environment
    template: templates/project.yaml
    asserts:
      - hasDocuments: { count: 4 }
      - isKind: { of: ProjectReleaseBinding }
        documentIndex: 3
      - equal: { path: metadata.name, value: demo-production }
        documentIndex: 3
      - equal: { path: spec, value: { owner: { projectName: demo }, environment: production } }
        documentIndex: 3

  - it: one Application per app (+ one per gated environment) with defaults applied, in the tenant AppProject
    template: templates/applications.yaml
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: metadata.name, value: demo-hello-world }
        documentIndex: 0
      - equal: { path: spec.project, value: tenant-demo }
        documentIndex: 0
      - equal:
          path: spec.source
          value:
            repoURL: "https://github.com/koorikla/hello-world.git"
            targetRevision: main
            path: deploy/openchoreo
            directory: { recurse: true, exclude: release-bindings/production.yaml }
        documentIndex: 0
      - equal: { path: metadata.name, value: demo-other }
        documentIndex: 2
      - equal:
          path: spec.source
          value:
            repoURL: "https://github.com/koorikla/other.git"
            targetRevision: v1.2.3
            path: ops/oc
            directory: { recurse: true, exclude: release-bindings/production.yaml }
        documentIndex: 2
      - equal:
          path: spec.destination
          value: { server: "https://kubernetes.default.svc", namespace: default }
        documentIndex: 2

  - it: the production binding file syncs through its own Application (gated environment)
    template: templates/applications.yaml
    documentIndex: 1
    asserts:
      - equal: { path: metadata.name, value: demo-hello-world-production }
      - equal: { path: 'metadata.labels["platform.koorikla.io/environment"]', value: production }
      - equal: { path: spec.source.directory, value: { recurse: true, include: release-bindings/production.yaml } }
      - equal: { path: spec.project, value: tenant-demo }

  - it: several gated environments are excluded with one brace glob
    template: templates/applications.yaml
    set:
      promotion.gatedEnvironments: [staging, production]
    documentIndex: 0
    asserts:
      - equal: { path: spec.source.directory.exclude, value: "{release-bindings/staging.yaml,release-bindings/production.yaml}" }

  - it: an app can opt out of promotion gates
    template: templates/applications.yaml
    set:
      apps:
        - { name: hello-world, repoURL: "https://github.com/koorikla/hello-world.git", promotionGates: false }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: spec.source.directory, value: { recurse: true } }

  - it: freeze windows become Argo CD deny sync windows on the gated Applications only
    template: templates/appproject.yaml
    asserts:
      - equal:
          path: spec.syncWindows
          value:
            - kind: deny
              schedule: "0 16 * * 5"
              duration: 64h
              timeZone: Europe/Tallinn
              applications: [demo-hello-world-production, demo-other-production]
              manualSync: false
              description: "freeze weekend: no promotions to production (Fri 16:00 - Mon 08:00 Europe/Tallinn)"

  - it: windows that do not wrap and partial hours
    template: templates/appproject.yaml
    set:
      promotion.freezeWindows:
        - { name: release-night, start: "Wed 18:30", end: "Thu 06:00", timeZone: UTC, environments: [production] }
    asserts:
      - equal: { path: "spec.syncWindows[0].schedule", value: "30 18 * * 3" }
      - equal: { path: "spec.syncWindows[0].duration", value: 11h30m }

  - it: no sync windows without gated Applications
    template: templates/appproject.yaml
    set:
      promotion.gatedEnvironments: []
    asserts:
      - notExists: { path: spec.syncWindows }

  - it: rejects malformed window bounds
    template: templates/appproject.yaml
    set:
      promotion.freezeWindows: [{ start: "Friday 16", end: "Mon 08:00" }]
    asserts:
      - failedTemplate: { errorPattern: "at '/promotion/freezeWindows/0/start': 'Friday 16' does not match pattern" }

  - it: rejects a window whose start equals its end
    template: templates/validate.yaml
    set:
      promotion.freezeWindows: [{ name: never, start: "Fri 16:00", end: "Fri 16:00" }]
    asserts:
      - failedTemplate: { errorMessage: 'promotion.freezeWindows "never": start == end' }

  - it: follows the installation's org namespace everywhere
    set:
      openchoreo.orgNamespace: acme
    asserts:
      - equal:
          path: spec.destinations[0].namespace
          value: acme
        template: templates/appproject.yaml
      - equal: { path: metadata.namespace, value: acme }
        template: templates/project.yaml
        documentIndex: 0
      - equal: { path: spec.destination.namespace, value: acme }
        template: templates/applications.yaml
        documentIndex: 0

  - it: git commit signature policy (sourceIntegrity) only when enabled
    template: templates/appproject.yaml
    asserts:
      - notExists: { path: spec.sourceIntegrity }

  - it: sourceIntegrity gpg policy over the GitHub org (replaces deprecated signatureKeys)
    template: templates/appproject.yaml
    set:
      sourceIntegrity.enabled: true
    asserts:
      - equal:
          path: spec.sourceIntegrity
          value:
            git:
              policies:
                - repos: [{ url: "https://github.com/koorikla/*" }]
                  gpg: { mode: head, keys: [B5690EEEBB952194] }
      - notExists: { path: spec.signatureKeys }

  - it: restricted groups may not delete gated Components (deny AuthzRoleBinding per group, one mapping per gated app)
    template: templates/authz.yaml
    set:
      promotion.restrictedGroups: [developers, Contractors_EU]
    asserts:
      - hasDocuments: { count: 2 }
      - isKind: { of: AuthzRoleBinding }
      - equal: { path: metadata.namespace, value: default }
      - equal: { path: spec.effect, value: deny }
      - equal: { path: metadata.name, value: demo-promotion-deny-component-delete-developers }
        documentIndex: 0
      - equal: { path: spec.entitlement, value: { claim: groups, value: developers } }
        documentIndex: 0
      - equal: { path: metadata.name, value: demo-promotion-deny-component-delete-contractors-eu }
        documentIndex: 1
      - equal:
          path: spec.roleMappings
          value:
            - { roleRef: { kind: ClusterAuthzRole, name: promotion-component-deleter }, scope: { project: demo, component: hello-world } }
            - { roleRef: { kind: ClusterAuthzRole, name: promotion-component-deleter }, scope: { project: demo, component: other } }

  - it: an app that opts out of promotion gates keeps component:delete
    template: templates/authz.yaml
    set:
      apps:
        - { name: hello-world, repoURL: https://github.com/koorikla/hello-world.git }
        - { name: other, repoURL: https://github.com/koorikla/other.git, promotionGates: false }
    asserts:
      - equal:
          path: spec.roleMappings
          value:
            - { roleRef: { kind: ClusterAuthzRole, name: promotion-component-deleter }, scope: { project: demo, component: hello-world } }

  - it: no component:delete deny without gated apps
    template: templates/authz.yaml
    set:
      promotion.gatedEnvironments: []
    asserts:
      - hasDocuments: { count: 0 }

  - it: no component:delete deny without restricted groups
    template: templates/authz.yaml
    set:
      promotion.restrictedGroups: []
    asserts:
      - hasDocuments: { count: 0 }
