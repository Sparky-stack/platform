# Rendered by Application tenant-<project> (charts/platform templates/tenants.yaml) with two value files, in order:
#   installations/<inst>/installation.yaml         -> installation, openchoreo.orgNamespace, ...
#   installations/<inst>/tenants/<project>.yaml    -> project, description, apps (schema below)

# --- the tenant file -------------------------------------------------------------------------------------------------
project: ""                 # required; OpenChoreo Project name, DNS-1123 label (AppProject tenant-<project>)
description: ""
apps: []                    # [{name, repoURL, path: deploy/openchoreo, revision: main, promotionGates: true}]; name unique

# --- from installation.yaml (defaults only so the chart renders standalone) ---------------------------------------
installation:
  name: local
openchoreo:
  orgNamespace: default

# --- chart settings (platform-wide; override in installation.yaml only if needed) ---------------------------------
argocd:
  namespace: argocd
  server: https://kubernetes.default.svc   # mgmt itself: OpenChoreo resources go to the control plane
defaults:
  path: deploy/openchoreo
  revision: main
# Must match addon openchoreo-platform deploymentPipeline: one ProjectReleaseBinding per environment provisions the
# project's namespace on that environment's data plane.
deploymentPipeline:
  name: default
  environments: [development, staging, production]
projectType:
  kind: ClusterProjectType
  name: default
# The only kinds an app repo may sync (namespaced, group openchoreo.dev, org namespace only). Project /
# ProjectReleaseBinding stay platform-owned (this chart); platform kinds (Environment, DeploymentPipeline,
# *ComponentType, *Trait, planes, authz) are never allowed.
developerKinds:
  - Component
  - Workload
  - ReleaseBinding
  - ComponentRelease
  - SecretReference
# Promotion gates (docs/promotion.md); installation.yaml `promotion` overrides (shared with addon openchoreo-platform).
promotion:
  # Each gated environment's binding file syncs through its own Application <project>-<app>-<env> (excluded from the
  # app's main Application), so the freeze windows below can stop exactly the production sync. Promotion there is a
  # reviewed pull request (CODEOWNERS + required status `openchoreo/promotion-gate`); an app opts out with
  # `promotionGates: false` in the tenant file.
  gatedEnvironments: [production]
  bindingFile: release-bindings/{environment}.yaml   # relative to the app path (app repo contract)
  # Weekly windows -> Argo CD deny sync windows on the gated Applications (manual sync blocked too; break glass =
  # change this list in git). PRs merged during a window sync when it ends.
  freezeWindows:
    - name: weekend
      start: "Fri 16:00"
      end: "Mon 08:00"
      timeZone: Europe/Tallinn
      environments: [production]
