# Rendered by Application tenant-<project> (charts/platform templates/tenants.yaml) with two value files, in order:
#   installations/<inst>/installation.yaml         -> installation, openchoreo.orgNamespace, ...
#   installations/<inst>/tenants/<project>.yaml    -> project, description, apps (schema below)

# --- the tenant file -------------------------------------------------------------------------------------------------
project: ""                 # required; OpenChoreo Project name, DNS-1123 label (AppProject tenant-<project>)
description: ""
apps: []                    # [{name, repoURL, path: deploy/openchoreo, revision: main, promotionGates: true}]; name unique
                            # name == the app repo's one Component name (gated bindings are admitted only from
                            # Application <project>-<component>-<env>, addon openchoreo-platform promotion-git-only.yaml)

# --- from installation.yaml (defaults only so the chart renders standalone) ---------------------------------------
installation:
  name: local
  githubOrg: https://github.com/koorikla
  repoURL: https://github.com/koorikla/platform.git   # charts/preview source of the preview Applications
  revision: main
openchoreo:
  orgNamespace: default
# PR preview environments (templates/previews.yaml, docs/preview-environments.md); installation.yaml overrides.
previews:
  enabled: false
  dataPlane: dev1
  requeueAfterSeconds: 1800
  expiredLabel: preview-expired

# --- chart settings (platform-wide; override in installation.yaml only if needed) ---------------------------------
argocd:
  namespace: argocd
  server: https://kubernetes.default.svc   # mgmt itself: OpenChoreo resources go to the control plane
defaults:
  path: deploy/openchoreo
  revision: main
# PR previews (templates/previews.yaml). The opt-in a Component carries in its app repo (same key and value in addon
# openchoreo-platform autoBuild.previews, which re-checks it before building PR code); the Secret with the GitHub token
# of the pull request generator (addon secret-stores previewToken, namespace argocd); the AppProject of the preview
# Applications (charts/platform templates/projects.yaml).
previewOptIn:
  annotation: platform.koorikla.io/preview-environments
  value: enabled
previewToken:
  secretName: preview-github-token
previewProject: previews
# Must match addon openchoreo-platform deploymentPipeline: one ProjectReleaseBinding per environment provisions the
# project's namespace on that environment's data plane.
deploymentPipeline:
  name: default
  environments: [development, staging, production]
projectType:
  kind: ClusterProjectType
  name: default
# The only kinds an app repo may sync (namespaced, group openchoreo.dev, org namespace only). Project /
# ProjectReleaseBinding stay platform-owned (this chart); platform kinds (Environment, DeploymentPipeline,
# *ComponentType, *Trait, planes, authz) are never allowed.
developerKinds:
  - Component
  - Workload
  - ReleaseBinding
  - ComponentRelease
  - SecretReference
# Promotion gates (docs/promotion.md); installation.yaml `promotion` overrides (shared with addon openchoreo-platform).
promotion:
  # Each gated environment's binding file syncs through its own Application <project>-<app>-<env> (excluded from the
  # app's main Application), so the freeze windows below can stop exactly the production sync. Promotion there is a
  # reviewed pull request (CODEOWNERS + required status `openchoreo/promotion-gate`); an app opts out with
  # `promotionGates: false` in the tenant file.
  gatedEnvironments: [production]
  # Groups (JWT claim `groups`) that may not delete a gated app's Component through console / openchoreo-api / occ /
  # MCP (the cascade would delete its gated bindings). Same list addon openchoreo-platform denies gated binding writes.
  restrictedGroups: [developers]
  componentDeleterRole: promotion-component-deleter   # ClusterAuthzRole of addon openchoreo-platform (component:delete)
  bindingFile: release-bindings/{environment}.yaml   # relative to the app path (app repo contract)
  # Weekly windows -> Argo CD deny sync windows on the gated Applications (manual sync blocked too; break glass =
  # change this list in git). PRs merged during a window sync when it ends.
  freezeWindows:
    - name: weekend
      start: "Fri 16:00"
      end: "Mon 08:00"
      timeZone: Europe/Tallinn
      environments: [production]

# Git commit signature verification for Argo CD sources (AppProject sourceIntegrity, Argo CD >= 3.5; the older
# `signatureKeys` is deprecated). Applies to the platform, fleet and tenant AppProjects. Off until every deployable
# HEAD is signed: GitHub signs commits it creates (PR merges in the UI, REST API commits such as the promotion gate's)
# with its web-flow key, so `head` mode with that key = only GitHub-made commits deploy. Public keys go into
# addons/argo-cd `argo-cd.configs.gpg.keys`. docs/supply-chain.md.
sourceIntegrity:
  enabled: false
  mode: head                         # none | head (HEAD commit/tag signed) | strict (every commit since the last signed tag)
  keys: [B5690EEEBB952194]           # GitHub web-flow commit signing key (since 2024-01; VERIFY); add maintainers' keys
  repos: ["{{ .Values.installation.githubOrg }}/*"]   # tpl over the installation values
