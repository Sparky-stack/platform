# Rendered by Application tenant-<project> (charts/platform templates/tenants.yaml) with two value files, in order:
#   installations/<inst>/installation.yaml         -> installation, openchoreo.orgNamespace, ...
#   installations/<inst>/tenants/<project>.yaml    -> project, description, apps (schema below)

# --- the tenant file -------------------------------------------------------------------------------------------------
# -- OpenChoreo `Project` name (DNS-1123 label) and `AppProject/tenant-<project>` (alongside `description`).
project: ""                 # required
description: ""
# name == Component name: gated bindings are admitted only from Application <project>-<component>-<env>.
# -- Tenant applications (`[{name, repoURL, path, revision, promotionGates}]`; `name` must equal the app repo's `Component` name).
apps: []
# -- DEMO ONLY: OpenBao values seeded into `kv-tenant-<project>` (`[{key, property}]`, the app's `SecretReference` `remoteRef`s) by `PushSecret/<project>-seed-<key>` (ESO `Password` generator, `updatePolicy: IfNotExists`) with the tenant's own writer identity; a missing property gets a generated `demo-only-<hex>` value, an existing one is never overwritten. One entry per key (a lowercase DNS label). Needs `secrets.tenantStores.enabled`; never list real secrets ([Tenant secrets](../../docs/multicluster.md#tenant-secrets-openbao)).
demoSecrets: []             # installations/local/tenants/demo.yaml only
# -- Groups (JWT claim `groups`) that develop this project: OpenChoreo role `developer` scoped to this project only, binding writes in `promotion.gatedEnvironments` excluded (`templates/developer-authz.yaml`). Empty = `[<project>-developers]`. Members also need group `developers` for the org-wide read-only views (component types, environments).
developerGroups: []

# --- from installation.yaml (defaults only so the chart renders standalone) ---------------------------------------
installation:
  name: local
  githubOrg: https://github.com/koorikla
  repoURL: https://github.com/koorikla/platform.git   # charts/preview source of the preview Applications
  revision: main
openchoreo:
  orgNamespace: default
# PR preview environments (templates/previews.yaml, docs/preview-environments.md); installation.yaml overrides.
previews:
  # -- Enables `ApplicationSet/previews-<project>` (`previews.*`, `previewOptIn`, `previewToken`: opted-in Components x open pull requests -> one `charts/preview` Application per PR; [preview environments](../../docs/preview-environments.md)).
  enabled: false
  dataPlane: dev1
  requeueAfterSeconds: 1800
  expiredLabel: preview-expired
  # Per-tenant cap (#385): a preview Application renders resources only for a PR with grantedLabel, which only the
  # auto-build pass sets, within previews.maxPerTenant (== addon openchoreo-platform previews).
  grantedLabel: preview-granted
  skipBots: true            # PRs whose author login ends in [bot] (Dependabot, Renovate) render nothing...
  botLabel: preview         # ...unless they carry this label

secrets:
  tenantStores:
    # -- Enables per-tenant OpenBao secrets (`tenantSecrets.{namespace,label}`: descriptor `Secret/<project>-openbao-tenant` and `ServiceAccount/<project>-writer` in `openbao-tenants`; [Tenant secrets](../../docs/multicluster.md#tenant-secrets-openbao)).
    enabled: false          # needs addon openbao on mgmt

# --- chart settings (platform-wide; override in installation.yaml only if needed) ---------------------------------
argocd:
  namespace: argocd
  server: https://kubernetes.default.svc   # mgmt itself: OpenChoreo resources go to the control plane
defaults:
  path: deploy/openchoreo
  revision: main
# PR previews (templates/previews.yaml):
#   previewOptIn    the annotation a Component carries in its app repo (== addon openchoreo-platform
#                   autoBuild.previews.optIn, which re-checks it before building PR code)
#   previewToken    Secret with the pull request generator's GitHub token (addon secret-stores, namespace argocd)
#   previewProject  AppProject of the preview Applications (charts/platform templates/projects.yaml)
previewOptIn:
  annotation: platform.koorikla.io/preview-environments
  value: enabled
previewToken:
  secretName: preview-github-token
previewProject: previews
# Must match addon openchoreo-platform deploymentPipeline: one ProjectReleaseBinding per environment provisions the
# project's namespace on that environment's data plane.
deploymentPipeline:
  name: default
  # -- Environments (`development`, `staging`, `production`) provisioned via `ProjectReleaseBinding`.
  environments: [development, staging, production]
projectType:
  kind: ClusterProjectType
  name: default
# ClusterAuthzRole the developerGroups get in their own project (upstream default role of the OpenChoreo control plane).
developerRole: developer
# -- The only kinds (group openchoreo.dev, org namespace) an app repo may sync; Project, ProjectReleaseBinding and platform kinds stay platform-owned.
developerKinds:
  - Component
  - Workload
  - ReleaseBinding
  - ComponentRelease
  - SecretReference
  - Resource                 # managed infrastructure from a platform (Cluster)ResourceType, e.g. postgresql (#70)
  - ResourceReleaseBinding   # binds a Resource to an environment; gated environments like ReleaseBindings
# Promotion gates (docs/promotion.md); installation.yaml `promotion` overrides (shared with addon openchoreo-platform).
promotion:
  # A gated environment's binding file syncs through its own Application <project>-<app>-<env>, so freeze windows
  # stop exactly that sync. Apps opt out with `promotionGates: false`.
  # -- Environments with separate gated `Application`s, ABAC component-delete deny (`restrictedGroups`), and `freezeWindows`.
  gatedEnvironments: [production]
  # Groups that may not delete a gated app's Component (the cascade would delete its gated bindings).
  restrictedGroups: [developers]
  componentDeleterRole: promotion-component-deleter   # ClusterAuthzRole of addon openchoreo-platform (component:delete)
  # Binding writes developerGroups may not do in gatedEnvironments (templates/developer-authz.yaml); == the actions of
  # ClusterAuthzRole promotion-release-binding-writer (addon openchoreo-platform; hack/tests/test_gitops_contracts.sh).
  bindingWriteActions: [releasebinding:create, releasebinding:update, releasebinding:delete,
    projectreleasebinding:create, projectreleasebinding:update, projectreleasebinding:delete,
    resourcereleasebinding:create, resourcereleasebinding:update, resourcereleasebinding:delete]
  bindingFile: release-bindings/{environment}.yaml   # relative to the app path (app repo contract)
  # Weekly Argo CD deny windows on the gated Applications (manual sync too; break glass = change this list in git).
  freezeWindows:
    - name: weekend
      start: "Fri 16:00"
      end: "Mon 08:00"
      timeZone: Europe/Tallinn
      environments: [production]

# AppProject tenant-<project> sourceIntegrity: same schema and installation.yaml key as charts/platform values.yaml
# (explained there; docs/supply-chain.md).
sourceIntegrity:
  enabled: false
  mode: head                         # none | head (HEAD commit/tag signed) | strict (every commit since the last signed tag)
  keys: [B5690EEEBB952194]           # GitHub web-flow commit signing key (since 2024-01; VERIFY); add maintainers' keys
  repos: ["{{ .Values.installation.githubOrg }}/*"]   # tpl over the installation values

# Per-tenant secrets (templates/secrets.yaml); == addon openbao tenantSecrets.inputsNamespace / .label.
tenantSecrets:
  namespace: openbao-tenants
  label: openbao.platform.koorikla.io/tenant
  # Demo seed (templates/demo-secrets.yaml, demoSecrets above); == addon openbao (test_tenant_demo_secrets.sh checks it).
  demoSeed:
    addr: https://openbao-active.openbao.svc:8200    # addon openbao reconcile BAO_ADDR
    caSecret: openbao-ca                             # addon openbao tenant-secrets.yaml: public CA only (ESO)
    audience: openbao                                # == addon openbao reconcile.audience (role tenant-writer)
    loginRole: tenant-writer
    refreshInterval: 5m                              # PushSecret re-check; failures retry with ESO's backoff
