{{- /*
One PR preview from stock OpenChoreo objects (docs/preview-environments.md):
  Environment            pr-<n>-<component>             on previews.dataPlane, never production, in no pipeline
  ProjectReleaseBinding  <project>-pr-<n>-<component>   the project's cell namespace, labelled preview for Kyverno
  ReleaseBinding         <component>-pr-<n>             pins the auto-build's ComponentRelease of the PR head
Closing the PR (or expired / waiting / bot: "true", see preview.on) removes the Environment; OpenChoreo's finalizers
take the bindings, cell namespace, ComponentRelease and the auto-build's ResourceReleaseBindings with it (the delete
waits for the bindings: blockOwnerDeletion).
*/ -}}
{{- if eq (include "preview.on" .) "true" }}
{{- $env := include "preview.environment" . }}
{{- $ns := .Values.openchoreo.orgNamespace }}
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: {{ $env }}
  namespace: {{ $ns }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    openchoreo.dev/name: {{ $env }}
  annotations:
    {{- include "preview.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "0"
    openchoreo.dev/display-name: {{ printf "PR #%v %s" .Values.pullRequest .Values.component | quote }}
    openchoreo.dev/description: {{ printf "Preview of pull request #%v of %s (removed when the PR closes or the TTL ends)" .Values.pullRequest (.Values.repository | default .Values.component) | quote }}
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: {{ .Values.previews.dataPlane }}
  isProduction: false
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: {{ .Values.project }}-{{ $env }}
  namespace: {{ $ns }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    openchoreo.dev/project: {{ .Values.project }}
    openchoreo.dev/environment: {{ $env }}
  annotations:
    {{- include "preview.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
spec:
  owner:
    projectName: {{ .Values.project }}
  environment: {{ $env }}
  environmentConfigs:
    # Cell namespace labels: Kyverno on the data plane matches them (quota, limits, isolation; addon kyverno-policies).
    namespaceLabels:
      platform.koorikla.io/preview: "true"
      platform.koorikla.io/tenant: {{ .Values.project }}
---
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: {{ .Values.component }}-pr-{{ .Values.pullRequest }}
  namespace: {{ $ns }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
  annotations:
    {{- include "preview.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
spec:
  owner:
    projectName: {{ .Values.project }}
    componentName: {{ .Values.component }}
  environment: {{ $env }}
  # Cut by the auto-build pass from the PR head build (one ComponentRelease per commit).
  releaseName: {{ .Values.component }}-pr-{{ .Values.pullRequest }}-{{ substr 0 12 (toString .Values.commit) }}
{{- end }}
