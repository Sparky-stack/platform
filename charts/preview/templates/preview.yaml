{{- /*
One PR preview (docs/preview-environments.md), shaped like the upstream ephemeral-environment proposal
(openchoreo/openchoreo discussion 4994): only stock OpenChoreo objects, so the upstream root resource can replace this
chart later without changing what runs.
  Environment            pr-<n>-<component>   on previews.dataPlane, never production, not in any DeploymentPipeline
                                              (nothing can be promoted from or to it). Kyverno on mgmt stamps
                                              platform.koorikla.io/expires-at at creation, caps previews per tenant and
                                              deletes expired ones (addon kyverno-policies templates/previews.yaml).
  ProjectReleaseBinding  <project>-pr-<n>-<component>   the project's cell namespace on that data plane, labelled
                                              platform.koorikla.io/preview so Kyverno there adds ResourceQuota,
                                              LimitRange and the isolating NetworkPolicy.
  ReleaseBinding         <component>-pr-<n>   pins ComponentRelease <component>-pr-<n>-<sha[:12]>, which the auto-build
                                              pass cuts from the in-cluster build of the PR head (addon
                                              openchoreo-platform files/auto-build/auto_build.py).
Closing the PR deletes the Application (ApplicationSet), whose resources finalizer deletes the Environment; OpenChoreo's
environment finalizer removes the bindings and the cell namespace. expired: "true" renders nothing (same cleanup).
*/ -}}
{{- if ne (toString .Values.expired) "true" }}
{{- $env := include "preview.environment" . }}
{{- $ns := .Values.openchoreo.orgNamespace }}
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: {{ $env }}
  namespace: {{ $ns }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    openchoreo.dev/name: {{ $env }}
  annotations:
    {{- include "preview.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "0"
    openchoreo.dev/display-name: {{ printf "PR #%v %s" .Values.pullRequest .Values.component | quote }}
    openchoreo.dev/description: {{ printf "Preview of pull request #%v of %s (removed when the PR closes or the TTL ends)" .Values.pullRequest (.Values.repository | default .Values.component) | quote }}
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: {{ required "previews.dataPlane is required (installation.yaml)" .Values.previews.dataPlane }}
  isProduction: false
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: {{ .Values.project }}-{{ $env }}
  namespace: {{ $ns }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    openchoreo.dev/project: {{ .Values.project }}
    openchoreo.dev/environment: {{ $env }}
  annotations:
    {{- include "preview.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
spec:
  owner:
    projectName: {{ .Values.project }}
  environment: {{ $env }}
  environmentConfigs:
    # Cell namespace labels: Kyverno on the data plane matches them (quota, limits, isolation; addon kyverno-policies).
    namespaceLabels:
      platform.koorikla.io/preview: "true"
      platform.koorikla.io/tenant: {{ .Values.project }}
---
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: {{ .Values.component }}-pr-{{ .Values.pullRequest }}
  namespace: {{ $ns }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
  annotations:
    {{- include "preview.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
spec:
  owner:
    projectName: {{ .Values.project }}
    componentName: {{ .Values.component }}
  environment: {{ $env }}
  # Cut by the auto-build pass from the PR head build (one ComponentRelease per commit).
  releaseName: {{ .Values.component }}-pr-{{ .Values.pullRequest }}-{{ substr 0 12 (toString .Values.commit) }}
{{- end }}
