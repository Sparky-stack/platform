suite: Argo CD cluster secret ExternalSecret
templates:
  - templates/common/capi-cluster.yaml
  - templates/common/argocd-cluster-secret.yaml
values:
  - ../../../installations/local/installation.yaml
  - ../../../installations/local/clusters/dev1.yaml
tests:
  - it: creates ExternalSecret in argocd targeting cluster secret with CAPI-aligned labels
    template: templates/common/argocd-cluster-secret.yaml
    set:
      addons:
        cert-manager: false
        coredns-local: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.namespace
          value: argocd
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.secretStoreRef.name
          value: mgmt-fleet
      - equal:
          path: spec.target.name
          value: dev1
      - equal:
          path: spec.data[0].secretKey
          value: kubeconfig
      - equal:
          path: spec.data[0].remoteRef.key
          value: dev1-kubeconfig
      - equal:
          path: spec.data[0].remoteRef.property
          value: value
      - equal:
          path: spec.target.template.metadata.labels["argocd.argoproj.io/secret-type"]
          value: cluster
      - equal:
          path: spec.target.template.metadata.labels["platform.koorikla.io/name"]
          value: dev1
      - equal:
          path: spec.target.template.metadata.labels["platform.koorikla.io/role"]
          value: workload
      - equal:
          path: spec.target.template.metadata.labels["platform.koorikla.io/provider"]
          value: docker
      - equal:
          path: spec.target.template.metadata.labels["platform.koorikla.io/region"]
          value: local
      - equal:
          path: spec.target.template.metadata.labels["platform.koorikla.io/environment"]
          value: development
      - equal:
          path: spec.target.template.metadata.labels["platform.koorikla.io/installation"]
          value: local
      - equal:
          path: spec.target.template.metadata.labels["addons.platform.koorikla.io/cert-manager"]
          value: "false"
      - equal:
          path: spec.target.template.metadata.labels["addons.platform.koorikla.io/coredns-local"]
          value: "true"
      - equal:
          path: spec.target.template.metadata.annotations["platform.koorikla.io/addons-revision"]
          value: HEAD
      - equal:
          path: spec.target.template.data.name
          value: dev1
      - matchRegex:
          path: spec.target.template.data.server
          pattern: 'fromYaml.*clusters 0.*server'
      - matchRegex:
          path: spec.target.template.data.config
          pattern: 'fromYaml'
      - matchRegex:
          path: spec.target.template.data.config
          pattern: 'certificate-authority-data'
      - matchRegex:
          path: spec.target.template.data.config
          pattern: 'client-certificate-data'
      - matchRegex:
          path: spec.target.template.data.config
          pattern: 'client-key-data'

  - it: passes through custom addonsRevision annotation
    template: templates/common/argocd-cluster-secret.yaml
    set:
      addonsRevision: v1.2.3
    asserts:
      - equal:
          path: spec.target.template.metadata.annotations["platform.koorikla.io/addons-revision"]
          value: v1.2.3

  - it: reads the CAPI kubeconfig one wave after the Cluster (#192)
    template: templates/common/argocd-cluster-secret.yaml
    asserts:
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "1" }
