suite: capi-registries - k3s registries.yaml for private GHCR, from ClusterSecretStore/platform
templates:
  - templates/capi-registries.yaml
  - templates/capi-cluster.yaml     # defines capi.validate
tests:
  - it: renders ExternalSecret <name>-registries in fleet from platform-ghcr
    template: templates/capi-registries.yaml
    values: [values/capi-docker.yaml]
    asserts:
      - isKind: { of: ExternalSecret }
      - isAPIVersion: { of: external-secrets.io/v1 }
      - equal: { path: metadata.name, value: dev1-registries }
      - equal: { path: metadata.namespace, value: fleet }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: platform } }
      - equal: { path: spec.target.name, value: dev1-registries }
      - equal:
          path: spec.data
          value:
            - { secretKey: username, remoteRef: { key: platform-ghcr, property: username } }
            - { secretKey: token, remoteRef: { key: platform-ghcr, property: token } }

  # key name must match the ClusterClass files[].contentFrom.secret.key
  - it: templates the k3s registries.yaml for ghcr.io (ESO template v2, values escaped as JSON)
    template: templates/capi-registries.yaml
    values: [values/capi-docker.yaml]
    asserts:
      - equal: { path: spec.target.template.engineVersion, value: v2 }
      - equal:
          path: spec.target.template.data["registries.yaml"]
          value: |
            configs:
              "ghcr.io":
                auth:
                  username: {{ .username | toJson }}
                  password: {{ .token | toJson }}

  - it: renders nothing when node registry auth is disabled
    template: templates/capi-registries.yaml
    values: [values/capi-docker.yaml]
    set: { secrets.nodeRegistryAuth.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  - it: fails on an unusable fleet file like the Cluster does
    template: templates/capi-registries.yaml
    values: [values/capi-docker.yaml]
    set: { kubernetesVersion: "" }
    asserts:
      - failedTemplate: { errorPattern: "`kubernetesVersion` is required" }

  # --- Harbor (installation.yaml registry.type harbor) ---------------------------------------------------------------
  - it: harbor adds mirrors with upstream rewrite, robot auth and the CA file for the registry host
    template: templates/capi-registries.yaml
    values: [values/capi-docker.yaml, values/registry-harbor.yaml]
    asserts:
      - equal:
          path: spec.target.template.data["registries.yaml"]
          value: |
            mirrors:
              "docker.io":
                endpoint: ["https://harbor.openchoreo.localhost:9443"]
                rewrite:
                  "^(.*)$": "dockerhub/$1"
            configs:
              "ghcr.io":
                auth:
                  username: {{ .username | toJson }}
                  password: {{ .token | toJson }}
              "harbor.openchoreo.localhost:9443":
                auth:
                  username: "robot$nodes"
                  password: {{ .nodesSecret | toJson }}
                tls:
                  ca_file: /etc/rancher/k3s/registry-ca.crt
      - equal: { path: 'spec.target.template.data["registry-ca.crt"]', value: "{{ .registryCA }}" }

  - it: harbor reads the robot secret from platform and only ca.crt of the CA bundle from mgmt-harbor
    template: templates/capi-registries.yaml
    values: [values/capi-docker.yaml, values/registry-harbor.yaml]
    asserts:
      - contains: { path: spec.data, content: { secretKey: nodesSecret, remoteRef: { key: harbor, property: nodes-secret } } }
      - contains:
          path: spec.data
          content:
            secretKey: registryCA
            remoteRef: { key: harbor-ca-bundle, property: ca.crt }
            sourceRef: { storeRef: { kind: ClusterSecretStore, name: mgmt-harbor } }

  - it: mirror.enabled false keeps registry trust and auth but no mirrors
    template: templates/capi-registries.yaml
    values: [values/capi-docker.yaml, values/registry-harbor.yaml]
    set: { registry.mirror.enabled: false }
    asserts:
      - notMatchRegex: { path: 'spec.target.template.data["registries.yaml"]', pattern: "mirrors:" }
      - matchRegex: { path: 'spec.target.template.data["registries.yaml"]', pattern: "ca_file: /etc/rancher/k3s/registry-ca.crt" }

  - it: harbor alone (no GHCR auth) still renders the Secret
    template: templates/capi-registries.yaml
    values: [values/capi-docker.yaml, values/registry-harbor.yaml]
    set: { secrets.nodeRegistryAuth.enabled: false }
    asserts:
      - hasDocuments: { count: 1 }
      - notMatchRegex: { path: 'spec.target.template.data["registries.yaml"]', pattern: '"ghcr.io":\n\s+auth' }
