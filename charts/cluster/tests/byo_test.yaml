suite: provider byo - an existing cluster registered without CAPI; PushSecrets replace the ClusterResourceSets
templates:
  - templates/capi-cluster.yaml
  - templates/openchoreo-helpers.yaml
  - templates/mesh-helpers.yaml
  - templates/capi-registries.yaml
  - templates/argocd-cluster-secret.yaml
  - templates/byo-access.yaml
  - templates/openchoreo-agent-crs.yaml
  - templates/openchoreo-agent-pki.yaml
  - templates/openchoreo-dataplane.yaml
  - templates/secrets-seed-crs.yaml
  - templates/falco-escalation-crs.yaml
  - templates/image-verification-crs.yaml
values: [values/byo.yaml]
tests:
  - it: renders no CAPI Cluster
    template: templates/capi-cluster.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders no node registry config even with node registry auth and Harbor (nodes belong to the cluster's owner)
    template: templates/capi-registries.yaml
    set: { secrets.nodeRegistryAuth.enabled: true }
    asserts:
      - hasDocuments: { count: 0 }

  - it: reads the kubeconfig from platform store key byo-<name> into fleet/<name>-kubeconfig (the Secret CAPI would write)
    template: templates/byo-access.yaml
    documentIndex: 0
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: metadata.name, value: byo1-kubeconfig }
      - equal: { path: metadata.namespace, value: fleet }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: platform } }
      - equal: { path: spec.target.name, value: byo1-kubeconfig }
      - equal: { path: spec.data, value: [{ secretKey: value, remoteRef: { key: byo-byo1, property: kubeconfig } }] }

  - it: pushes through a ClusterSecretStore on that kubeconfig, usable from fleet only
    template: templates/byo-access.yaml
    documentIndex: 1
    asserts:
      - isKind: { of: ClusterSecretStore }
      - equal: { path: metadata.name, value: byo-byo1 }
      - equal: { path: spec.conditions, value: [{ namespaces: [fleet] }] }
      - equal: { path: spec.provider.kubernetes.authRef, value: { name: byo1-kubeconfig, namespace: fleet, key: value } }
      - notExists: { path: spec.provider.kubernetes.auth }

  - it: registers with Argo CD from the same Secret, labelled provider byo, cilium off
    template: templates/argocd-cluster-secret.yaml
    asserts:
      - equal: { path: 'spec.data[0].remoteRef', value: { key: byo1-kubeconfig, property: value } }
      - equal: { path: 'spec.target.template.metadata.labels["platform.koorikla.io/provider"]', value: byo }
      - equal: { path: 'spec.target.template.metadata.labels["platform.koorikla.io/role"]', value: workload }
      - equal: { path: 'spec.target.template.metadata.labels["platform.koorikla.io/cni"]', value: flannel }
      - equal: { path: 'spec.target.template.metadata.labels["addons.platform.koorikla.io/cilium"]', value: "false" }
      - matchRegex: { path: spec.target.template.data.config, pattern: 'bearerToken' }
      # ESO executes templates with missingkey=error: a cert kubeconfig has no `token` key (seen live on byo1)
      - matchRegex: { path: spec.target.template.data.config, pattern: 'if hasKey \$u "token"' }
      - notMatchRegex: { path: spec.target.template.data.config, pattern: 'if \$u\.token' }
      - matchRegex: { path: spec.target.template.data.config, pattern: 'client-key-data' }

  - it: keeps the cilium addon off on byo even when the cluster runs Cilium (the platform installs a CNI only at birth)
    template: templates/argocd-cluster-secret.yaml
    set: { cni: cilium }
    asserts:
      - equal: { path: 'spec.target.template.metadata.labels["platform.koorikla.io/cni"]', value: cilium }
      - equal: { path: 'spec.target.template.metadata.labels["addons.platform.koorikla.io/cilium"]', value: "false" }

  - it: pushes the agent client cert into openchoreo-data-plane/cluster-agent-tls, not via a ClusterResourceSet
    template: templates/openchoreo-agent-crs.yaml
    asserts:
      - hasDocuments: { count: 3 }
      - isKind: { of: PushSecret }
        documentIndex: 0
      - equal: { path: spec.selector.secret.name, value: byo1-agent-tls }
        documentIndex: 0
      - equal: { path: spec.secretStoreRefs, value: [{ kind: ClusterSecretStore, name: byo-byo1 }] }
        documentIndex: 0
      - equal: { path: 'spec.data[0].match.remoteRef', value: { remoteKey: cluster-agent-tls } }
        documentIndex: 0
      - equal: { path: 'spec.data[0].metadata.spec.remoteNamespace', value: openchoreo-data-plane }
        documentIndex: 0
      - equal: { path: spec.deletionPolicy, value: Delete }
        documentIndex: 0
      # last wave: waits for namespaces on the cluster without holding back the ClusterDataPlane (waves 9, 10)
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "20" }
        documentIndex: 0

  - it: pushes the gateway CA public cert (read from store mgmt-openchoreo) into platform-delivery
    template: templates/openchoreo-agent-crs.yaml
    asserts:
      - isKind: { of: ExternalSecret }
        documentIndex: 1
      - equal: { path: spec.secretStoreRef.name, value: mgmt-openchoreo }
        documentIndex: 1
      - equal: { path: spec.data, value: [{ secretKey: ca.crt, remoteRef: { key: cluster-gateway-ca, property: ca.crt } }] }
        documentIndex: 1
      - equal: { path: spec.selector.secret.name, value: byo1-gateway-ca }
        documentIndex: 2
      - equal: { path: 'spec.data[0].match.remoteRef.remoteKey', value: cluster-gateway-ca }
        documentIndex: 2
      - equal: { path: 'spec.data[0].metadata.spec.remoteNamespace', value: platform-delivery }
        documentIndex: 2

  - it: keeps the agent CA and its key on mgmt (only the client cert Secret is pushed)
    template: templates/openchoreo-agent-pki.yaml
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: spec.commonName, value: byo1 }
        documentIndex: 3

  - it: registers the ClusterDataPlane with planeID == name like any cluster
    template: templates/openchoreo-dataplane.yaml
    documentSelector: { path: kind, value: ClusterDataPlane }
    asserts:
      - equal: { path: spec.planeID, value: byo1 }
      - equal: { path: spec.clusterAgent.clientCA.secretKeyRef.name, value: byo1-agent-ca }

  - it: seeds workload keys by PushSecret into openchoreo-secrets
    template: templates/secrets-seed-crs.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - isKind: { of: ExternalSecret }
        documentIndex: 0
      - notExists: { path: spec.target.template }
        documentIndex: 0
      - equal: { path: 'spec.data[0].metadata.spec.remoteNamespace', value: openchoreo-secrets }
        documentIndex: 1
      - equal: { path: 'spec.data[0].match.remoteRef.remoteKey', value: openchoreo-observability }
        documentIndex: 1

  - it: pushes the derived falco token Secret into falco/falcosidekick-escalation
    template: templates/falco-escalation-crs.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: spec.target.template.type, value: Opaque }
        documentIndex: 0
      - exists: { path: spec.target.template.data.WEBHOOK_ADDRESS }
        documentIndex: 0
      - exists: { path: spec.target.template.data.WEBHOOK_CUSTOMHEADERS }
        documentIndex: 0
      - equal: { path: 'spec.data[0].metadata.spec.remoteNamespace', value: falco }
        documentIndex: 1
      - equal: { path: 'spec.data[0].match.remoteRef.remoteKey', value: falcosidekick-escalation }
        documentIndex: 1

  - it: pushes image verification material (public keys to platform-delivery, pull secret to kyverno), never the private key
    template: templates/image-verification-crs.yaml
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: 'spec.data[0].remoteRef', value: { key: cosign-platform, property: cosign.pub } }
        documentIndex: 0
      - equal: { path: 'spec.data[0].metadata.spec.remoteNamespace', value: platform-delivery }
        documentIndex: 1
      - equal: { path: 'spec.data[0].match.remoteRef.remoteKey', value: platform-image-verification }
        documentIndex: 1
      - equal: { path: spec.target.template.type, value: kubernetes.io/dockerconfigjson }
        documentIndex: 2
      - equal: { path: 'spec.data[0].metadata.spec.remoteNamespace', value: kyverno }
        documentIndex: 3
      - equal: { path: 'spec.data[0].match.remoteRef.remoteKey', value: platform-registry }
        documentIndex: 3

  - it: renders no ClusterResourceSet anywhere
    templates:
      - templates/openchoreo-agent-crs.yaml
      - templates/secrets-seed-crs.yaml
      - templates/falco-escalation-crs.yaml
      - templates/image-verification-crs.yaml
    documentSelector: { path: kind, value: ClusterResourceSet, matchMany: true, skipEmptyTemplates: true }
    asserts:
      - hasDocuments: { count: 0 }

  - it: CAPI clusters keep their ClusterResourceSets and get no PushSecret or byo store
    values: [values/capi-docker.yaml]
    templates:
      - templates/byo-access.yaml
      - templates/openchoreo-agent-crs.yaml
    documentSelector: { path: kind, value: PushSecret, matchMany: true, skipEmptyTemplates: true }
    asserts:
      - hasDocuments: { count: 0 }
