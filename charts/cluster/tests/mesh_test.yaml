suite: mesh (opt-in Istio ambient multicluster) - OpenBao inputs, public trust payload and remote-secret delivery
templates:
  - templates/common/mesh-openbao.yaml
  - templates/common/mesh-trust.yaml
  - templates/common/mesh-remote-secret.yaml
  - templates/common/_mesh.tpl
values: [values/capi-docker.yaml]
set:
  mesh: { group: local, groups: [local, prod], ca: { host: openbao.example.test, port: 8200 } }
  mgmt: { addons: { openbao: true } }
tests:
  - it: renders nothing without mesh.group
    set:
      mesh: { group: "" }
    asserts:
      - hasDocuments: { count: 0 }
        template: templates/common/mesh-openbao.yaml
      - hasDocuments: { count: 0 }
        template: templates/common/mesh-trust.yaml
      - hasDocuments: { count: 0 }
        template: templates/common/mesh-remote-secret.yaml

  - it: publishes this member's PUBLIC auth inputs for OpenBao (API server + cluster CA from the CAPI kubeconfig)
    template: templates/common/mesh-openbao.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: ExternalSecret }
      - equal: { path: metadata.name, value: dev1-mesh-openbao }
      - equal: { path: metadata.namespace, value: fleet }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: mgmt-fleet } }
      - equal: { path: 'spec.target.template.metadata.labels["mesh.platform.koorikla.io/openbao-client"]', value: "true" }
      - equal: { path: spec.target.template.data.cluster, value: dev1 }
      - equal: { path: spec.target.template.data.group, value: local }
      - matchRegex: { path: spec.target.template.data.server, pattern: '\.cluster\.server' }
      - matchRegex: { path: spec.target.template.data.ca, pattern: 'certificate-authority-data" \| b64dec' }
      - equal: { path: spec.data, value: [{ secretKey: kubeconfig, remoteRef: { key: dev1-kubeconfig, property: value } }] }

  - it: "negative: never templates the kubeconfig's client credentials into the OpenBao inputs"
    template: templates/common/mesh-openbao.yaml
    asserts:
      - notMatchRegex: { path: spec.target.template.data.server, pattern: 'client-(key|certificate)-data' }
      - notMatchRegex: { path: spec.target.template.data.ca, pattern: 'client-(key|certificate)-data' }
      - notExists: { path: spec.target.template.data.kubeconfig }

  - it: delivers only public trust (OpenBao CA, group root) + the network label to exactly this cluster
    template: templates/common/mesh-trust.yaml
    asserts:
      - hasDocuments: { count: 3 }
      - isKind: { of: ExternalSecret }
        documentIndex: 0
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: mgmt-openbao } }
        documentIndex: 0
      - equal: { path: spec.target.template.type, value: addons.cluster.x-k8s.io/resource-set }
        documentIndex: 0
      - matchRegex: { path: 'spec.target.template.data["mesh-trust.yaml"]', pattern: 'topology.istio.io/network: dev1' }
        documentIndex: 0
      - matchRegex: { path: 'spec.target.template.data["mesh-trust.yaml"]', pattern: 'name: openbao-ca\n\s+namespace: istio-system' }
        documentIndex: 0
      - matchRegex: { path: 'spec.target.template.data["mesh-trust.yaml"]', pattern: 'name: mesh-root-ca\n\s+namespace: istio-system' }
        documentIndex: 0
      - notMatchRegex: { path: 'spec.target.template.data["mesh-trust.yaml"]', pattern: 'tls\.key|cacerts|kubernetes\.io/tls' }
        documentIndex: 0
      - equal:
          path: spec.data
          value:
            - { secretKey: openbaoca, remoteRef: { key: openbao-ca-bundle, property: ca.crt } }
            - { secretKey: root, remoteRef: { key: openbao-ca-bundle, property: mesh-root-local.pem } }
        documentIndex: 0
      - isKind: { of: ClusterResourceSet }
        documentIndex: 2
      - equal: { path: spec.strategy, value: Reconcile }
        documentIndex: 2
      - equal: { path: spec.clusterSelector.matchLabels, value: { platform.koorikla.io/name: dev1 } }
        documentIndex: 2
      - equal: { path: spec.resources, value: [{ kind: ConfigMap, name: dev1-mesh-oidc }, { kind: Secret, name: dev1-mesh-trust }] }
        documentIndex: 2

  - it: "publishes the member's issuer discovery (public JWKS) before the mesh reconcile: static CRS ConfigMap, no ESO"
    template: templates/common/mesh-trust.yaml
    documentIndex: 1
    asserts:
      - isKind: { of: ConfigMap }
      - equal: { path: metadata.name, value: dev1-mesh-oidc }
      - equal: { path: metadata.namespace, value: fleet }
      - equal:
          path: data["oidc-discovery.yaml"]
          value: |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: platform-oidc-discovery
              labels:
                app.kubernetes.io/part-of: istio-mesh
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: system:service-account-issuer-discovery
            subjects:
              - apiGroup: rbac.authorization.k8s.io
                kind: Group
                name: system:unauthenticated

  - it: "a group is a cryptographic boundary: another group's member pins another root"
    template: templates/common/mesh-trust.yaml
    documentIndex: 0
    set:
      mesh: { group: prod }
    asserts:
      - equal: { path: 'spec.data[1].remoteRef.property', value: mesh-root-prod.pem }

  - it: issues a short-lived reader client cert from the cluster's k3s client CA (CAPI secret <name>-cca)
    template: templates/common/mesh-remote-secret.yaml
    asserts:
      - isKind: { of: Issuer }
        documentIndex: 0
      - equal: { path: metadata.name, value: dev1-client-ca }
        documentIndex: 0
      - equal: { path: spec.ca.secretName, value: dev1-cca }
        documentIndex: 0
      - isKind: { of: Certificate }
        documentIndex: 1
      - equal: { path: spec.commonName, value: "platform:istio-reader" }
        documentIndex: 1
      - isNull: { path: spec.subject }
        documentIndex: 1
      - equal: { path: spec.usages, value: [client auth, digital signature] }
        documentIndex: 1
      - equal: { path: spec.duration, value: 168h }
        documentIndex: 1
      - equal: { path: spec.issuerRef, value: { kind: Issuer, name: dev1-client-ca } }
        documentIndex: 1

  - it: templates an Istio remote secret with the reader cert (not the admin cert, no token) from mgmt only
    template: templates/common/mesh-remote-secret.yaml
    documentIndex: 2
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: mgmt-fleet } }
      - equal: { path: spec.target.template.type, value: addons.cluster.x-k8s.io/resource-set }
      - matchRegex: { path: 'spec.target.template.data["remote-secret.yaml"]', pattern: 'istio/multiCluster: "true"' }
      - matchRegex: { path: 'spec.target.template.data["remote-secret.yaml"]', pattern: 'name: istio-remote-secret-dev1' }
      - matchRegex: { path: 'spec.target.template.data["remote-secret.yaml"]', pattern: '"client-key-data" \(\.tlskey \| b64enc\)' }
      - equal: { path: 'spec.data[0].remoteRef', value: { key: dev1-kubeconfig, property: value } }
      - equal: { path: 'spec.data[1].remoteRef', value: { key: dev1-mesh-reader, property: tls.crt } }
      - equal: { path: 'spec.data[2].remoteRef', value: { key: dev1-mesh-reader, property: tls.key } }

  - it: publishes the remote secret to every other member of the group, never to itself
    template: templates/common/mesh-remote-secret.yaml
    documentIndex: 3
    asserts:
      - isKind: { of: ClusterResourceSet }
      - equal: { path: spec.clusterSelector.matchLabels, value: { mesh.platform.koorikla.io/group: local } }
      - equal:
          path: spec.clusterSelector.matchExpressions
          value: [{ key: platform.koorikla.io/name, operator: NotIn, values: [dev1] }]
      - equal: { path: spec.resources, value: [{ kind: Secret, name: dev1-mesh-remote-secret }] }

  # #192: Issuer <name>-client-ca needs <name>-cca, which CAPI creates for the Cluster (wave 0). In the Cluster's wave a
  # failed Cluster apply (CAPI webhook down) left the Certificate Progressing and the Argo CD operation hung forever.
  - it: syncs the remote-secret chain after the Cluster, one wave per link; its CRS (peers only) in the final wave
    template: templates/common/mesh-remote-secret.yaml
    asserts:
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "1" }
        documentSelector: { path: kind, value: Issuer }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "2" }
        documentSelector: { path: kind, value: Certificate }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "3" }
        documentSelector: { path: kind, value: ExternalSecret }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "10" }
        documentSelector: { path: kind, value: ClusterResourceSet }

  - it: reads the CAPI kubeconfig for OpenBao one wave after the Cluster (#192)
    template: templates/common/mesh-openbao.yaml
    asserts:
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "1" }

  - it: applies the trust payload after it is templated (wave 0) and the Cluster is up (#192)
    template: templates/common/mesh-trust.yaml
    asserts:
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "1" }
        documentSelector: { path: kind, value: ClusterResourceSet }
      - notExists: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]' }
        documentSelector: { path: kind, value: ExternalSecret }
