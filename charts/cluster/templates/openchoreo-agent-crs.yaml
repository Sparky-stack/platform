{{- /*
Delivery of the agent identity into the workload cluster, without scripts and without hub->worker writes outside CAPI:
  ExternalSecret <name>-openchoreo-agent (store mgmt-fleet: read-only, in-cluster, namespace fleet) templates a
  ClusterResourceSet payload Secret from <name>-agent-tls: Namespace openchoreo-data-plane + Secret cluster-agent-tls.
  ClusterResourceSet <name>-openchoreo-agent applies it, plus the shared openchoreo-gateway-ca payload (addon
  openchoreo-control-plane: ConfigMap cluster-gateway-ca, public CA cert only), to exactly this Cluster.
Strategy Reconcile: CAPI re-applies a payload whenever its content changes (cert renewal, CA rotation).
*/ -}}
{{- if .Values.openchoreo.dataPlane.enabled }}
{{- $name := include "openchoreo.name" . }}
{{- $ns := include "openchoreo.fleetNamespace" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-openchoreo-agent
  namespace: {{ $ns }}
  labels:
    {{- include "openchoreo.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  target:
    name: {{ $name }}-openchoreo-agent
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      metadata:
        labels:
          {{- include "openchoreo.labels" . | nindent 10 }}
      data:   # gitleaks:allow: ESO template of the CRS payload Secret; values come from the store, none in git
        # One key, two documents in order: CAPI applies them top to bottom (Namespace first).
        openchoreo-agent.yaml: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openchoreo-data-plane
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: cluster-agent-tls
            namespace: openchoreo-data-plane
            labels:
              app.kubernetes.io/part-of: openchoreo
          type: kubernetes.io/tls
          data:
            tls.crt: {{`{{ .tlscrt | b64enc }}`}}
            tls.key: {{`{{ .tlskey | b64enc }}`}}
            ca.crt: {{`{{ .cacrt | b64enc }}`}}
  data:
    - secretKey: tlscrt
      remoteRef: { key: {{ $name }}-agent-tls, property: tls.crt }
    - secretKey: tlskey
      remoteRef: { key: {{ $name }}-agent-tls, property: tls.key }
    - secretKey: cacrt
      remoteRef: { key: {{ $name }}-agent-tls, property: ca.crt }
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-openchoreo-agent
  namespace: {{ $ns }}
  labels:
    {{- include "openchoreo.labels" . | nindent 4 }}
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      # On the CAPI Cluster by docs/conventions.md (capi-cluster template). CAPI does not label a Cluster with
      # cluster.x-k8s.io/cluster-name itself, so that label is not used here.
      platform.koorikla.io/name: {{ $name }}
  resources:
    - kind: Secret
      name: {{ $name }}-openchoreo-agent
    - kind: Secret
      name: openchoreo-gateway-ca      # shared; addon openchoreo-control-plane templates/gateway-ca-crs.yaml
{{- end }}
