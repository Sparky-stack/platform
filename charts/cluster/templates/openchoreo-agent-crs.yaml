{{- /*
Delivery of the agent identity into the workload cluster, without scripts and without hub->worker writes outside CAPI:
  ExternalSecret <name>-openchoreo-agent (store mgmt-fleet: read-only, in-cluster, namespace fleet) templates a
  ClusterResourceSet payload Secret from <name>-agent-tls: Namespace openchoreo-data-plane + Secret cluster-agent-tls.
  ClusterResourceSet <name>-openchoreo-agent applies it, plus the shared openchoreo-gateway-ca payload (addon
  openchoreo-control-plane: ConfigMap cluster-gateway-ca, public CA cert only), to exactly this Cluster.
Strategy Reconcile: CAPI re-applies a payload whenever its content changes (cert renewal, CA rotation).
provider byo (no CAPI Cluster, so no CRS): the same two objects by PushSecret (byo-access.yaml byo.pushSecret):
  PushSecret <name>-push-agent-tls   fleet/<name>-agent-tls (cert-manager: tls.crt, tls.key, ca.crt = this cluster's
                                     agent CA cert, public) -> openchoreo-data-plane/cluster-agent-tls
  ExternalSecret <name>-gateway-ca   ca.crt of the gateway CA (store mgmt-openchoreo, public cert only), pushed by
  PushSecret <name>-push-gateway-ca  -> platform-delivery/cluster-gateway-ca; addon openchoreo-data-plane
                                     (values/provider-byo.yaml) turns it into ConfigMap cluster-gateway-ca there, as
                                     PushSecret writes only Secrets.
*/ -}}
{{- if .Values.openchoreo.dataPlane.enabled }}
{{- $name := include "openchoreo.name" . }}
{{- $ns := include "openchoreo.fleetNamespace" . }}
{{- if eq (toString .Values.provider) "byo" }}
{{ include "byo.pushSecret" (dict "root" . "name" (printf "%s-push-agent-tls" $name) "source" (printf "%s-agent-tls" $name)
      "namespace" "openchoreo-data-plane" "remoteName" "cluster-agent-tls" "labels" (dict "app.kubernetes.io/part-of" "openchoreo")) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-gateway-ca
  namespace: {{ $ns }}
  labels:
    {{- include "openchoreo.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-openchoreo      # read-only, ca.crt of openchoreo-control-plane/cluster-gateway-ca (invariant 5 exception)
  target:
    name: {{ $name }}-gateway-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef: { key: cluster-gateway-ca, property: ca.crt }
---
{{ include "byo.pushSecret" (dict "root" . "name" (printf "%s-push-gateway-ca" $name) "source" (printf "%s-gateway-ca" $name)
      "namespace" "platform-delivery" "remoteName" "cluster-gateway-ca" "labels" (dict "app.kubernetes.io/part-of" "openchoreo")) }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-openchoreo-agent
  namespace: {{ $ns }}
  labels:
    {{- include "openchoreo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"   # reads Secret <name>-agent-tls (Certificate, wave 3)
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  target:
    name: {{ $name }}-openchoreo-agent
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      metadata:
        labels:
          {{- include "openchoreo.labels" . | nindent 10 }}
      data:   # gitleaks:allow: ESO template of the CRS payload Secret; values come from the store, none in git
        # One key, two documents in order: CAPI applies them top to bottom (Namespace first).
        openchoreo-agent.yaml: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openchoreo-data-plane
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: cluster-agent-tls
            namespace: openchoreo-data-plane
            labels:
              app.kubernetes.io/part-of: openchoreo
          type: kubernetes.io/tls
          data:
            tls.crt: {{`{{ .tlscrt | b64enc }}`}}
            tls.key: {{`{{ .tlskey | b64enc }}`}}
            ca.crt: {{`{{ .cacrt | b64enc }}`}}
  data:
    - secretKey: tlscrt
      remoteRef: { key: {{ $name }}-agent-tls, property: tls.crt }
    - secretKey: tlskey
      remoteRef: { key: {{ $name }}-agent-tls, property: tls.key }
    - secretKey: cacrt
      remoteRef: { key: {{ $name }}-agent-tls, property: ca.crt }
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-openchoreo-agent
  namespace: {{ $ns }}
  labels:
    {{- include "openchoreo.labels" . | nindent 4 }}
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      # On the CAPI Cluster by docs/conventions.md (capi-cluster template). CAPI does not label a Cluster with
      # cluster.x-k8s.io/cluster-name itself, so that label is not used here.
      platform.koorikla.io/name: {{ $name }}
  resources:
    - kind: Secret
      name: {{ $name }}-openchoreo-agent
    - kind: Secret
      name: openchoreo-gateway-ca      # shared; addon openchoreo-control-plane templates/gateway-ca-crs.yaml
{{- end }}
{{- end }}
