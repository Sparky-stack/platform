{{- /*
Delivery of this cluster's mesh CA into istio-system, same path as the OpenChoreo agent identity (openchoreo-agent-crs):
  ExternalSecret <name>-mesh-cacerts (store mgmt-fleet) templates a ClusterResourceSet payload from <name>-mesh-ca:
    Namespace istio-system, labelled topology.istio.io/network=<name>: ambient istiod reads its cluster's network from
      this label (and a peer's network from the peer's label, via the remote secret).
    Secret cacerts (kubernetes.io/tls: tls.crt = intermediate, tls.key, ca.crt = mesh root). istiod 1.32 reads this
      format as a plugged-in CA (cert chain = tls.crt + ca.crt).
  ClusterResourceSet <name>-mesh applies it to exactly this Cluster. Strategy Reconcile: re-applied on renewal.
istio-ambient runs istiod with PILOT_DISABLE_SELF_SIGNED_CA on mesh members, so istiod waits (restarts) until cacerts
exists instead of silently minting a private root.
*/ -}}
{{- if include "mesh.group" . }}
{{- $name := .Values.name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-mesh-cacerts
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  target:
    name: {{ $name }}-mesh-cacerts
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      metadata:
        labels:
          {{- include "mesh.labels" . | nindent 10 }}
      data:
        mesh-cacerts.yaml: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: istio-system
            labels:
              topology.istio.io/network: {{ $name }}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: cacerts
            namespace: istio-system
            labels:
              app.kubernetes.io/part-of: istio-mesh
              mesh.platform.koorikla.io/group: {{ include "mesh.group" . }}
          type: kubernetes.io/tls
          data:
            tls.crt: {{`{{ .tlscrt | b64enc }}`}}
            tls.key: {{`{{ .tlskey | b64enc }}`}}
            ca.crt: {{`{{ .cacrt | b64enc }}`}}
  data:
    - secretKey: tlscrt
      remoteRef: { key: {{ $name }}-mesh-ca, property: tls.crt }
    - secretKey: tlskey
      remoteRef: { key: {{ $name }}-mesh-ca, property: tls.key }
    - secretKey: cacrt
      remoteRef: { key: {{ $name }}-mesh-ca, property: ca.crt }
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-mesh
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      platform.koorikla.io/name: {{ $name }}
  resources:
    - kind: Secret
      name: {{ $name }}-mesh-cacerts
{{- end }}
