{{- /* Delivers public mesh trust material (root CA, OpenBao CA, OIDC discovery) into istio-system via ClusterResourceSet. */ -}}
{{- if include "mesh.group" . }}
{{- $name := .Values.name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-mesh-trust
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-openbao
  target:
    name: {{ $name }}-mesh-trust
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      metadata:
        labels:
          {{- include "mesh.labels" . | nindent 10 }}
      data:
        mesh-trust.yaml: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: istio-system
            labels:
              topology.istio.io/network: {{ $name }}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: openbao-ca
            namespace: istio-system
            labels:
              app.kubernetes.io/part-of: istio-mesh
          type: Opaque
          data:
            ca.crt: {{`{{ .openbaoca | b64enc }}`}}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: mesh-root-ca
            namespace: istio-system
            labels:
              app.kubernetes.io/part-of: istio-mesh
              mesh.platform.koorikla.io/group: {{ include "mesh.group" . }}
          type: Opaque
          data:
            root-cert.pem: {{`{{ .root | b64enc }}`}}
  data:
    - secretKey: openbaoca
      remoteRef: { key: openbao-ca-bundle, property: ca.crt }
    - secretKey: root
      remoteRef: { key: openbao-ca-bundle, property: {{ include "mesh.rootKey" . }} }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-mesh-oidc
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
data:
  oidc-discovery.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: platform-oidc-discovery
      labels:
        app.kubernetes.io/part-of: istio-mesh
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:service-account-issuer-discovery
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: system:unauthenticated
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-mesh-trust
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after its payload (wave 0) and the Cluster: docs/providers.md "Sync waves of a cluster app"
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      platform.koorikla.io/name: {{ $name }}
  resources:
    - kind: ConfigMap
      name: {{ $name }}-mesh-oidc
    - kind: Secret
      name: {{ $name }}-mesh-trust
{{- end }}
