{{- /*
Endpoint discovery: every member's istiod watches the other members' API servers through an Istio remote secret
(istio-system/istio-remote-secret-<peer>, label istio/multiCluster=true). This cluster's own chart publishes ITS remote
secret to all OTHER members of its group, so no file lists peers and a new member joins both ways by itself. All on
mgmt, nothing is read back from the workload cluster:
  Issuer <name>-client-ca            cert-manager CA issuer over fleet/<name>-cca: the k3s client CA that CAPI
                                     (cluster-api-k3s) generated and keeps on mgmt; <name>'s API server trusts it for
                                     client auth. cert-manager only reads that Secret.
  Certificate <name>-mesh-reader     client cert CN=platform:istio-reader (no groups), 7d, renewed by cert-manager.
                                     On <name>, addon istio-eastwest binds that user to ClusterRole
                                     platform-istio-reader (discovery reads, no Secrets). No ServiceAccount token.
                                     addon openbao's admission policies admit only this profile from *-client-ca.
  ExternalSecret <name>-mesh-remote-secret
                                     kubeconfig for <name>: API server + CA from the CAPI kubeconfig, user = the reader
                                     cert (store mgmt-fleet); templated as a ClusterResourceSet payload.
  ClusterResourceSet <name>-mesh-remote-secret
                                     applies it to every Cluster with mesh.platform.koorikla.io/group=<group> except <name>.
Peers must reach <name>'s API endpoint (CAPD LB container on network kind; AWS API ELB; Hetzner API LB).
Removing a member does not delete the remote secret already applied to peers (CRS never deletes); the cert expires
within 7d and then authenticates nothing. Decommissioning deletes it (docs/multicluster.md "Removing a member").
*/ -}}
{{- if include "mesh.group" . }}
{{- $name := .Values.name }}
{{- $group := include "mesh.group" . }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-client-ca
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    # <name>-cca comes from CAPI for the Cluster (wave 0): never in the Cluster's wave, see docs/providers.md
    # "Sync waves of a cluster app" (#192)
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    secretName: {{ $name }}-cca     # cluster-api-k3s client CA (tls.crt, tls.key; type cluster.x-k8s.io/secret)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-mesh-reader
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after Issuer <name>-client-ca: a Certificate waits (Progressing) for its issuer
spec:
  commonName: {{ include "mesh.readerUser" . }}
  secretName: {{ $name }}-mesh-reader
  duration: 168h            # 7d: Kubernetes cannot revoke client certs, so keep them short; ESO + CRS re-deliver
  renewBefore: 72h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - client auth
    - digital signature
  issuerRef:
    kind: Issuer
    name: {{ $name }}-client-ca
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-mesh-remote-secret
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # reads Secret <name>-mesh-reader (wave 2) and <name>-kubeconfig (CAPI)
spec:
  # 5m, not 1h: a re-created cluster (same name) has a new API endpoint (argocd-cluster-secret.yaml); renewals too.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  target:
    name: {{ $name }}-mesh-remote-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      metadata:
        labels:
          {{- include "mesh.labels" . | nindent 10 }}
      data:
        # The kubeconfig is built as JSON (valid kubeconfig syntax) so no YAML indentation is templated.
        remote-secret.yaml: |
          {{`{{- $kc := fromYaml .kubeconfig -}}`}}
          {{`{{- $c := (index $kc.clusters 0).cluster -}}`}}
          {{`{{- $n := "`}}{{ $name }}{{`" -}}`}}
          {{`{{- $user := dict "client-certificate-data" (.tlscrt | b64enc) "client-key-data" (.tlskey | b64enc) -}}`}}
          {{`{{- $cfg := dict "apiVersion" "v1" "kind" "Config" "current-context" $n "clusters" (list (dict "name" $n "cluster" (dict "server" $c.server "certificate-authority-data" (index $c "certificate-authority-data")))) "contexts" (list (dict "name" $n "context" (dict "cluster" $n "user" $n))) "users" (list (dict "name" $n "user" $user)) -}}`}}
          apiVersion: v1
          kind: Secret
          metadata:
            name: istio-remote-secret-{{ $name }}
            namespace: istio-system
            labels:
              istio/multiCluster: "true"
              mesh.platform.koorikla.io/group: {{ $group }}
            annotations:
              networking.istio.io/cluster: {{ $name }}
          type: Opaque
          data:
            {{ $name }}: {{`{{ $cfg | toJson | b64enc }}`}}
  data:
    - secretKey: kubeconfig
      remoteRef: { key: {{ $name }}-kubeconfig, property: value }
    - secretKey: tlscrt
      remoteRef: { key: {{ $name }}-mesh-reader, property: tls.crt }
    - secretKey: tlskey
      remoteRef: { key: {{ $name }}-mesh-reader, property: tls.key }
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-mesh-remote-secret
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      mesh.platform.koorikla.io/group: {{ $group }}
    matchExpressions:
      - key: platform.koorikla.io/name
        operator: NotIn
        values: [{{ $name }}]
  resources:
    - kind: Secret
      name: {{ $name }}-mesh-remote-secret
{{- end }}
