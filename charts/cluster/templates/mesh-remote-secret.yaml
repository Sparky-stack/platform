{{- /* Istio multicluster endpoint discovery: reader Certificate, ExternalSecret, and peer ClusterResourceSet. */ -}}
{{- if include "mesh.group" . }}
{{- $name := .Values.name }}
{{- $group := include "mesh.group" . }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-client-ca
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    secretName: {{ $name }}-cca     # cluster-api-k3s client CA (tls.crt, tls.key; type cluster.x-k8s.io/secret)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-mesh-reader
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after Issuer <name>-client-ca: a Certificate waits (Progressing) for its issuer
spec:
  commonName: {{ include "mesh.readerUser" . }}
  secretName: {{ $name }}-mesh-reader
  duration: 168h            # 7d: Kubernetes cannot revoke client certs, so keep them short; ESO + CRS re-deliver
  renewBefore: 72h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - client auth
    - digital signature
  issuerRef:
    kind: Issuer
    name: {{ $name }}-client-ca
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-mesh-remote-secret
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # reads Secret <name>-mesh-reader (wave 2) and <name>-kubeconfig (CAPI)
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  target:
    name: {{ $name }}-mesh-remote-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      metadata:
        labels:
          {{- include "mesh.labels" . | nindent 10 }}
      data:
        remote-secret.yaml: |
          {{`{{- $kc := fromYaml .kubeconfig -}}`}}
          {{`{{- $c := (index $kc.clusters 0).cluster -}}`}}
          {{`{{- $n := "`}}{{ $name }}{{`" -}}`}}
          {{`{{- $user := dict "client-certificate-data" (.tlscrt | b64enc) "client-key-data" (.tlskey | b64enc) -}}`}}
          {{`{{- $cfg := dict "apiVersion" "v1" "kind" "Config" "current-context" $n "clusters" (list (dict "name" $n "cluster" (dict "server" $c.server "certificate-authority-data" (index $c "certificate-authority-data")))) "contexts" (list (dict "name" $n "context" (dict "cluster" $n "user" $n))) "users" (list (dict "name" $n "user" $user)) -}}`}}
          apiVersion: v1
          kind: Secret
          metadata:
            name: istio-remote-secret-{{ $name }}
            namespace: istio-system
            labels:
              istio/multiCluster: "true"
              mesh.platform.koorikla.io/group: {{ $group }}
            annotations:
              networking.istio.io/cluster: {{ $name }}
          type: Opaque
          data:
            {{ $name }}: {{`{{ $cfg | toJson | b64enc }}`}}
  data:
    - secretKey: kubeconfig
      remoteRef: { key: {{ $name }}-kubeconfig, property: value }
    - secretKey: tlscrt
      remoteRef: { key: {{ $name }}-mesh-reader, property: tls.crt }
    - secretKey: tlskey
      remoteRef: { key: {{ $name }}-mesh-reader, property: tls.key }
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-mesh-remote-secret
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"   # final wave: applies to the PEERS, whose readiness is other apps' business
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      mesh.platform.koorikla.io/group: {{ $group }}
    matchExpressions:
      - key: platform.koorikla.io/name
        operator: NotIn
        values: [{{ $name }}]
  resources:
    - kind: Secret
      name: {{ $name }}-mesh-remote-secret
{{- end }}
