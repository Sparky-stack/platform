{{- /*
Endpoint discovery: every member's istiod watches the other members' API servers through an Istio remote secret
(istio-system/istio-remote-secret-<peer>, label istio/multiCluster=true). This cluster's own chart publishes ITS remote
secret to all OTHER members of its group, so no file lists peers and a new member joins both ways by itself:
  SecretStore <name>-mesh-reader     ESO kubernetes provider on mgmt, authenticated with the CAPI kubeconfig
                                     (authRef fleet/<name>-kubeconfig), scoped to this cluster's istio-system. Reads only
                                     the istio-reader token below; mgmt already holds that kubeconfig (CAPI, Argo CD).
  ExternalSecret <name>-mesh-remote-secret
                                     kubeconfig for <name>: API server + CA from the CAPI kubeconfig (store mgmt-fleet),
                                     user = the long-lived token of istio-system/istio-reader-service-account (Secret
                                     created by addon istio-eastwest on <name>; read-only RBAC from the istiod chart),
                                     never the admin client cert. Templated as a ClusterResourceSet payload.
  ClusterResourceSet <name>-mesh-remote-secret
                                     applies it to every Cluster with mesh.platform.koorikla.io/group=<group> except <name>.
Peers must reach <name>'s API endpoint (CAPD LB container on network kind; AWS API ELB; Hetzner API LB).
Removing a member does not delete the remote secret already applied to peers (CRS never deletes): docs/multicluster.md.
*/ -}}
{{- if include "mesh.group" . }}
{{- $name := .Values.name }}
{{- $group := include "mesh.group" . }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $name }}-mesh-reader
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: istio-system
      authRef:                  # kubeconfig (server, CA, client cert) written by CAPI; ESO >= 0.10 supports authRef
        name: {{ $name }}-kubeconfig
        key: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-mesh-remote-secret
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
spec:
  # 5m, not 1h: a re-created cluster (same name) has a new API endpoint and a new reader token (argocd-cluster-secret).
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  target:
    name: {{ $name }}-mesh-remote-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      metadata:
        labels:
          {{- include "mesh.labels" . | nindent 10 }}
      data:
        # The kubeconfig is built as JSON (valid kubeconfig syntax) so no YAML indentation is templated.
        remote-secret.yaml: |
          {{`{{- $kc := fromYaml .kubeconfig -}}`}}
          {{`{{- $c := (index $kc.clusters 0).cluster -}}`}}
          {{`{{- $n := "`}}{{ $name }}{{`" -}}`}}
          {{`{{- $cfg := dict "apiVersion" "v1" "kind" "Config" "current-context" $n "clusters" (list (dict "name" $n "cluster" (dict "server" $c.server "certificate-authority-data" (index $c "certificate-authority-data")))) "contexts" (list (dict "name" $n "context" (dict "cluster" $n "user" $n))) "users" (list (dict "name" $n "user" (dict "token" .token))) -}}`}}
          apiVersion: v1
          kind: Secret
          metadata:
            name: istio-remote-secret-{{ $name }}
            namespace: istio-system
            labels:
              istio/multiCluster: "true"
              mesh.platform.koorikla.io/group: {{ $group }}
            annotations:
              networking.istio.io/cluster: {{ $name }}
          type: Opaque
          data:
            {{ $name }}: {{`{{ $cfg | toJson | b64enc }}`}}
  data:
    - secretKey: kubeconfig
      remoteRef: { key: {{ $name }}-kubeconfig, property: value }
    - secretKey: token
      remoteRef: { key: {{ include "mesh.readerTokenSecret" . }}, property: token }
      sourceRef:
        storeRef:
          kind: SecretStore
          name: {{ $name }}-mesh-reader
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-mesh-remote-secret
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      mesh.platform.koorikla.io/group: {{ $group }}
    matchExpressions:
      - key: platform.koorikla.io/name
        operator: NotIn
        values: [{{ $name }}]
  resources:
    - kind: Secret
      name: {{ $name }}-mesh-remote-secret
{{- end }}
