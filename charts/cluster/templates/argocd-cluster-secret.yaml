apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-argocd-cluster" .Values.name | quote }}
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  data:
    - secretKey: kubeconfig
      remoteRef:
        key: {{ printf "%s-kubeconfig" .Values.name | quote }}
        property: value
  target:
    name: {{ .Values.name | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          {{- include "capi.labels" . | nindent 10 }}   {{- /* same labels as the CAPI Cluster (capi-cluster.yaml) */}}
        annotations:
          platform.koorikla.io/addons-revision: {{ .Values.addonsRevision | default "HEAD" | quote }}
      data:
        name: {{ .Values.name | quote }}
        server: '{{ "{{" }} $kc := fromYaml .kubeconfig {{ "}} " | trim }}{{ "{{" }} (index $kc.clusters 0).cluster.server {{ "}} " | trim }}'
        config: |-
          {{ "{{" }} $kc := fromYaml .kubeconfig {{ "-}}" }}
          {{ "{{" }} $c := (index $kc.clusters 0).cluster {{ "-}}" }}
          {{ "{{" }} $u := (index $kc.users 0).user {{ "-}}" }}
          {"tlsClientConfig":{"insecure":false,"caData":"{{ "{{" }} index $c "certificate-authority-data" {{ "}} " | trim }}","certData":"{{ "{{" }} index $u "client-certificate-data" {{ "}} " | trim }}","keyData":"{{ "{{" }} index $u "client-key-data" {{ "}} " | trim }}"}}
