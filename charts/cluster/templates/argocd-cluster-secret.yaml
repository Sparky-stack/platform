apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-argocd-cluster" .Values.name | quote }}
  namespace: argocd
spec:
  # 1m, not 1h: a re-created cluster (same name) gets a new API endpoint (CAPD LB IP, cloud LB DNS). A stale secret
  # points Argo CD at whatever now owns the old address - locally that was another cluster. Reads a local Secret: cheap.
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  data:
    - secretKey: kubeconfig
      remoteRef:
        key: {{ printf "%s-kubeconfig" .Values.name | quote }}
        property: value
  target:
    name: {{ .Values.name | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          {{- include "capi.labels" . | nindent 10 }}   {{- /* same labels as the CAPI Cluster (capi-cluster.yaml) */}}
        annotations:
          platform.koorikla.io/addons-revision: {{ .Values.addonsRevision | default "HEAD" | quote }}
      data:
        name: {{ .Values.name | quote }}
        server: {{`'{{ $kc := fromYaml .kubeconfig }}{{ (index $kc.clusters 0).cluster.server }}'`}}
        config: |-
          {{`{{ $kc := fromYaml .kubeconfig -}}`}}
          {{`{{ $c := (index $kc.clusters 0).cluster -}}`}}
          {{- if eq (include "capi.gke" .) "true" }}
          {{- /* gcp-gke: CAPG's kubeconfig carries a 1 h access token, not a client cert. Argo CD authenticates itself
          instead (argocd-k8s-auth gcp: Google ADC of the application controller / server, i.e. GKE Workload Identity
          or a WIF credential config; docs/providers.md "GKE"). Only server + CA come from the kubeconfig. */}}
          {{`{"execProviderConfig":{"command":"argocd-k8s-auth","args":["gcp"],"apiVersion":"client.authentication.k8s.io/v1beta1"},"tlsClientConfig":{"insecure":false,"caData":"{{ index $c "certificate-authority-data" }}"}}`}}
          {{- else }}
          {{`{{ $u := (index $kc.users 0).user -}}`}}
          {{`{"tlsClientConfig":{"insecure":false,"caData":"{{ index $c "certificate-authority-data" }}","certData":"{{ index $u "client-certificate-data" }}","keyData":"{{ index $u "client-key-data" }}"}}`}}
          {{- end }}
