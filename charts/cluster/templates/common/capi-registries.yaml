{{- if eq .Values.scope "cluster" }}
{{- /* k3s node registry config (ExternalSecret fleet/<name>-registries, wave -1); skipped on gcp-gke and byo. */ -}}
{{- include "capi.validate" . }}
{{- $auth := .Values.secrets.nodeRegistryAuth }}
{{- $harbor := eq (include "capi.registry.harbor" .) "true" }}
{{- $reg := .Values.registry }}
{{- $nr := .Values.nodeRegistry }}
{{- /* Host pull-through caches (docker provider only, hack/registry-cache.sh): containers platform-cache-<upstream
with dots as dashes> on docker network kind. They replace the Harbor mirror for the upstreams they cover (k3s applies
one rewrite to all endpoints of a mirror, so they cannot share one); containerd falls back to the upstream itself. */ -}}
{{- $cache := $reg.hostCache | default dict }}
{{- $cacheOn := and $cache.enabled (eq (toString .Values.provider) "docker") }}
{{- $cached := list }}
{{- if $cacheOn }}{{ range $cache.mirrors }}{{ $cached = append $cached .upstream }}{{ end }}{{ end }}
{{- if and (or $auth.enabled $harbor) (ne (include "capi.gke" .) "true") (ne (include "capi.byo" .) "true") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-registries
  namespace: fleet
  labels:
    platform.koorikla.io/name: {{ .Values.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # before the Cluster (wave 0): bootstrap reads this Secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ .Values.name }}-registries
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        registries.yaml: |
          {{- if or $cacheOn (and $harbor $reg.mirror.enabled) }}
          mirrors:
            {{- range (ternary $cache.mirrors list $cacheOn) }}
            {{ .upstream | quote }}:
              endpoint: [{{ printf "http://platform-cache-%s:5000" (.upstream | replace "." "-") | quote }}]
            {{- end }}
            {{- range (ternary $reg.proxyCache list (and $harbor $reg.mirror.enabled)) }}
            {{- if not (has .upstream $cached) }}
            {{ .upstream | quote }}:
              endpoint: [{{ printf "https://%s" $reg.host | quote }}]
              rewrite:
                "^(.*)$": {{ printf "%s/$1" .project | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          configs:
            {{- if $auth.enabled }}
            {{ $auth.registry | quote }}:
              auth:
                username: {{`{{ .username | toJson }}`}}
                password: {{`{{ .token | toJson }}`}}
            {{- end }}
            {{- if $harbor }}
            {{ $reg.host | quote }}:
              auth:
                username: {{ $nr.robot | quote }}
                password: {{`{{ .nodesSecret | toJson }}`}}
              tls:
                ca_file: {{ $nr.caFile }}
            {{- end }}
        {{- if $harbor }}
        registry-ca.crt: {{`'{{ .registryCA }}'`}}
        {{- end }}
  data:
    {{- if $auth.enabled }}
    - secretKey: username
      remoteRef:
        key: {{ $auth.key }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ $auth.key }}
        property: token
    {{- end }}
    {{- if $harbor }}
    - secretKey: nodesSecret
      remoteRef:
        key: {{ $nr.secretKey }}
        property: {{ $nr.secretProperty }}
    - secretKey: registryCA
      remoteRef:
        key: {{ $nr.caSecret }}
        property: ca.crt
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: {{ $nr.caStore }}
    {{- end }}
{{- end }}
{{- end }}
