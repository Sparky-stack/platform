{{- if eq .Values.scope "cluster" }}
{{- /* Delivers OpenChoreo agent TLS identity and gateway CA to the workload cluster via ClusterResourceSet or byo PushSecret. */ -}}
{{- if .Values.openchoreo.dataPlane.enabled }}
{{- $name := .Values.name }}
{{- if eq (toString .Values.provider) "byo" }}
{{ include "byo.pushSecret" (dict "root" . "name" (printf "%s-push-agent-tls" $name) "source" (printf "%s-agent-tls" $name)
      "namespace" "openchoreo-data-plane" "remoteName" "cluster-agent-tls" "labels" (dict "app.kubernetes.io/part-of" "openchoreo")) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-gateway-ca
  namespace: fleet
  labels:
    {{- include "openchoreo.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-openchoreo      # read-only, ca.crt of openchoreo-control-plane/cluster-gateway-ca (invariant 5 exception)
  target:
    name: {{ $name }}-gateway-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef: { key: cluster-gateway-ca, property: ca.crt }
---
{{ include "byo.pushSecret" (dict "root" . "name" (printf "%s-push-gateway-ca" $name) "source" (printf "%s-gateway-ca" $name)
      "namespace" "platform-delivery" "remoteName" "cluster-gateway-ca" "labels" (dict "app.kubernetes.io/part-of" "openchoreo")) }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-openchoreo-agent
  namespace: fleet
  labels:
    {{- include "openchoreo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"   # reads Secret <name>-agent-tls (Certificate, wave 3)
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mgmt-fleet
  target:
    name: {{ $name }}-openchoreo-agent
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      metadata:
        labels:
          {{- include "openchoreo.labels" . | nindent 10 }}
      data:   # gitleaks:allow: ESO template of the CRS payload Secret; values come from the store, none in git
        openchoreo-agent.yaml: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openchoreo-data-plane
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: cluster-agent-tls
            namespace: openchoreo-data-plane
            labels:
              app.kubernetes.io/part-of: openchoreo
          type: kubernetes.io/tls
          data:
            tls.crt: {{`{{ .tlscrt | b64enc }}`}}
            tls.key: {{`{{ .tlskey | b64enc }}`}}
            ca.crt: {{`{{ .cacrt | b64enc }}`}}
  data:
    - secretKey: tlscrt
      remoteRef: { key: {{ $name }}-agent-tls, property: tls.crt }
    - secretKey: tlskey
      remoteRef: { key: {{ $name }}-agent-tls, property: tls.key }
    - secretKey: cacrt
      remoteRef: { key: {{ $name }}-agent-tls, property: ca.crt }
---
{{/* wave 5: after payload ExternalSecret (wave 4); openchoreo-gateway-ca comes from addon openchoreo-control-plane. */}}
{{ include "capi.clusterResourceSet" (dict "cluster" $name "name" (printf "%s-openchoreo-agent" $name) "wave" "5" "labels" (include "openchoreo.labels" .) "resources" (list (dict "kind" "Secret" "name" (printf "%s-openchoreo-agent" $name)) (dict "kind" "Secret" "name" "openchoreo-gateway-ca"))) }}
{{- end }}
{{- end }}
{{- end }}
