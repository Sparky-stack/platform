{{- if eq .Values.scope "cluster" }}
{{- /*
Local secret backend only (secrets.backend: kubernetes): copies keys listed in secrets.workloadSeed.keys from mgmt
store `platform` into secrets.workloadKubernetes.namespace on the workload cluster via ClusterResourceSet (or
PushSecret on byo) so the workload ClusterSecretStore `default` can read them without an external vault.
*/ -}}
{{- if and (eq (.Values.secrets.backend | default "kubernetes") "kubernetes") .Values.secrets.workloadSeed.keys }}
{{- $name := .Values.name }}
{{- $wns := .Values.secrets.workloadKubernetes.namespace | default "openchoreo-secrets" }}
{{- $byo := eq (toString .Values.provider) "byo" }}
{{- range $key := .Values.secrets.workloadSeed.keys }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-seed-{{ $key }}
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ $name }}-seed-{{ $key }}
    creationPolicy: Owner
    {{- if not $byo }}
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      data:   # gitleaks:allow: ESO template of the CRS payload Secret; values come from the store, none in git
        seed.yaml: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ $wns }}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ $key }}
            namespace: {{ $wns }}
          data:
          {{`{{- range $k, $v := . }}`}}
            {{`{{ $k }}: {{ $v | b64enc }}`}}
          {{`{{- end }}`}}
    {{- end }}
  dataFrom:
    - extract:
        key: {{ $key }}
---
{{- if $byo }}
{{ include "byo.pushSecret" (dict "root" $ "name" (printf "%s-push-seed-%s" $name $key) "source" (printf "%s-seed-%s" $name $key)
      "namespace" $wns "remoteName" $key) }}
{{- else }}
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-seed-{{ $key }}
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      platform.koorikla.io/name: {{ $name }}
  resources:
    - kind: Secret
      name: {{ $name }}-seed-{{ $key }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
