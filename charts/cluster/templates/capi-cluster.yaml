{{- /*
CAPI topology Cluster for this fleet file, in namespace fleet, class k3s-<provider>.
Helpers are prefixed capi.* and live here (charts/cluster templates are split by concern and owner):
  capi.validate  - fails rendering on an unusable fleet file
  capi.labels    - platform.koorikla.io/* + addons.platform.koorikla.io/* (docs/conventions.md); the Argo CD cluster
                   secret must carry exactly these labels -> include "capi.labels" there too. The cilium addon label
                   is derived from `cni` (the CNI is a birth fact, the addon follows it).
*/ -}}
{{- define "capi.validate" -}}
{{- $v := .Values -}}
{{- if not $v.name -}}
{{- fail "cluster: `name` is required (installations/<inst>/clusters/<name>.yaml)" -}}
{{- end -}}
{{- if not (regexMatch "^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$" $v.name) -}}
{{- fail (printf "cluster: name %q must be a DNS label (lower-case alphanumerics and '-', max 32 chars)" $v.name) -}}
{{- end -}}
{{- if not $v.kubernetesVersion -}}
{{- fail (printf "cluster %s: `kubernetesVersion` is required (k3s release, e.g. v1.35.10+k3s1)" $v.name) -}}
{{- end -}}
{{- if not (regexMatch "^v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+$" $v.kubernetesVersion) -}}
{{- fail (printf "cluster %s: kubernetesVersion %q is not a k3s release (vX.Y.Z+k3sN)" $v.name $v.kubernetesVersion) -}}
{{- end -}}
{{- if not (has $v.provider (list "docker" "aws" "hetzner")) -}}
{{- fail (printf "cluster %s: provider %q must be one of docker, aws, hetzner" $v.name $v.provider) -}}
{{- end -}}
{{- $providers := (($v.capi | default dict).providers | default dict) -}}
{{- if and (hasKey $providers $v.provider) (not (index $providers $v.provider)) -}}
{{- fail (printf "cluster %s: provider %s is not enabled in installation.yaml capi.providers" $v.name $v.provider) -}}
{{- end -}}
{{- if and (ne $v.provider "docker") (not $v.region) -}}
{{- fail (printf "cluster %s: `region` is required for provider %s" $v.name $v.provider) -}}
{{- end -}}
{{- if not (has $v.cni (list "cilium" "flannel")) -}}
{{- fail (printf "cluster %s: cni %q must be cilium or flannel" $v.name $v.cni) -}}
{{- end -}}
{{- if and (hasKey ($v.addons | default dict) "cilium") (ne $v.addons.cilium (eq $v.cni "cilium")) -}}
{{- fail (printf "cluster %s: addons.cilium=%v contradicts cni=%s (the cilium addon follows `cni`; drop addons.cilium)" $v.name $v.addons.cilium $v.cni) -}}
{{- end -}}
{{- range $addon, $on := $v.addons -}}
{{- if not (kindIs "bool" $on) -}}
{{- fail (printf "cluster %s: addons.%s must be true or false" $v.name $addon) -}}
{{- end -}}
{{- end -}}
{{- /* Control plane size = embedded etcd voters (cluster-api-k3s v0.5.0 supports no other datastore). Odd only: an
even count adds a voter without adding failure tolerance, and 2 voters is the state a rollout must never shrink from.
Production on a cloud provider needs >= 3: every single-server rollout ends with a 2 -> 1 etcd member removal, which
etcd documents as unsafe and which lost quorum on dev1 (docs/providers.md "Control plane size and rollouts"). Local
CAPD clusters are disposable and may run 1 server whatever their environment label says. */ -}}
{{- $cp := $v.controlPlane | default dict -}}
{{- $replicas := hasKey $cp "replicas" | ternary $cp.replicas 1 -}}
{{- if not (regexMatch "^[0-9]+$" (toString $replicas)) -}}
{{- fail (printf "cluster %s: controlPlane.replicas %v must be a whole number (1, 3, 5)" $v.name $replicas) -}}
{{- end -}}
{{- if or (lt (int $replicas) 1) (eq (mod (int $replicas) 2) 0) -}}
{{- fail (printf "cluster %s: controlPlane.replicas %v must be odd (1, 3, 5): k3s servers are embedded etcd voters" $v.name $replicas) -}}
{{- end -}}
{{- if and (ne $v.provider "docker") (eq (toString $v.environment) "production") (lt (int $replicas) 3) -}}
{{- fail (printf "cluster %s: production on %s needs controlPlane.replicas >= 3 - a single-server rollout ends with an unsafe 2 -> 1 etcd member removal (docs/providers.md)" $v.name $v.provider) -}}
{{- end -}}
{{- range $i, $w := $v.workers -}}
{{- if not $w.name -}}
{{- fail (printf "cluster %s: workers[%d].name is required" $v.name $i) -}}
{{- end -}}
{{- end -}}
{{- end }}

{{- define "capi.labels" -}}
platform.koorikla.io/name: {{ .Values.name | quote }}
platform.koorikla.io/role: workload
platform.koorikla.io/provider: {{ .Values.provider | quote }}
platform.koorikla.io/region: {{ .Values.region | quote }}
platform.koorikla.io/environment: {{ .Values.environment | quote }}
platform.koorikla.io/installation: {{ .Values.installation.name | quote }}
platform.koorikla.io/cni: {{ .Values.cni | quote }}
{{- range $addon, $on := merge (dict "cilium" (eq .Values.cni "cilium")) (.Values.addons | default dict) }}
addons.platform.koorikla.io/{{ $addon }}: {{ $on | toString | quote }}
{{- end }}
{{- end }}

{{- /* "true" when nodes pull from the installation's Harbor (installation.yaml registry.type harbor + host). */ -}}
{{- define "capi.registry.harbor" -}}
{{- $r := .Values.registry | default dict -}}
{{- and (eq (toString $r.type) "harbor") (ne (toString ($r.host | default "")) "") | toString -}}
{{- end }}

{{- define "capi.annotations" -}}
platform.koorikla.io/addons-revision: {{ .Values.addonsRevision | default "HEAD" | quote }}
{{- end }}

{{- include "capi.validate" . }}
{{- /* ClusterClass variables: generated facts first, providerSpec (fleet file) last so it can override them */ -}}
{{- $harbor := eq (include "capi.registry.harbor" .) "true" }}
{{- $vars := dict "registryAuth" (or (.Values.secrets.nodeRegistryAuth.enabled | default false) $harbor) "cni" .Values.cni }}
{{- if $harbor }}
{{- $_ := set $vars "registryCA" true }}
{{- /* Harbor's token realm is its externalURL: nodes must resolve the registry name itself (no mirror hop). Local
CAPD nodes get an /etc/hosts alias to the container that publishes it (k3d serverlb); real installations use DNS. */ -}}
{{- if and (eq .Values.provider "docker") .Values.registry.nodeHostAlias }}
{{- $_ := set $vars "registryHostAlias" (regexReplaceAll ":[0-9]+$" .Values.registry.host "") }}
{{- $_ := set $vars "registryHostAliasTarget" .Values.registry.nodeHostAlias }}
{{- end }}
{{- end }}
{{- if ne .Values.provider "docker" }}
{{- $_ := set $vars "region" .Values.region }}
{{- with .Values.controlPlane.machineType }}
{{- $_ := set $vars "controlPlaneMachineType" . }}
{{- end }}
{{- end }}
{{- range $k, $val := .Values.providerSpec }}
{{- $_ := set $vars $k $val }}
{{- end }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: {{ .Values.name }}
  namespace: fleet
  labels:
    {{- include "capi.labels" . | nindent 4 }}
  annotations:
    {{- include "capi.annotations" . | nindent 4 }}
spec:
  clusterNetwork:             # k3s defaults (the k3s provider does not pass these on; kept for CAPI/tools)
    pods:
      cidrBlocks: [10.42.0.0/16]
    services:
      cidrBlocks: [10.43.0.0/16]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: k3s-{{ .Values.provider }}
      namespace: fleet
    version: {{ .Values.kubernetesVersion }}
    controlPlane:
      replicas: {{ .Values.controlPlane.replicas | default 1 }}
    {{- with .Values.workers }}
    workers:
      machineDeployments:
        {{- range . }}
        - class: default-worker
          name: {{ .name }}
          replicas: {{ hasKey . "replicas" | ternary .replicas 1 }}
          {{- with .failureDomain }}
          failureDomain: {{ . | quote }}
          {{- end }}
          {{- if and .machineType (ne $.Values.provider "docker") }}
          variables:
            overrides:
              - name: workerMachineType
                value: {{ .machineType | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
    variables:
      {{- range $k := keys $vars | sortAlpha }}
      - name: {{ $k }}
        value: {{ index $vars $k | toJson }}
      {{- end }}
