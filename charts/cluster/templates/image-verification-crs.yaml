{{- /* Kyverno Harbor image verification material (cosign.pub, ca.crt, pull robot) via ClusterResourceSet or byo PushSecret. */ -}}
{{- $iv := .Values.imageVerification }}
{{- $harbor := eq (include "capi.registry.harbor" .) "true" }}
{{- if and $iv.enabled $harbor (ne (toString (dig "kyverno" "" (.Values.addons | default dict))) "false") }}
{{- $name := .Values.name }}
{{- $nr := .Values.nodeRegistry }}
{{- $host := .Values.registry.host }}
{{- if eq (include "capi.byo" .) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-image-verification
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ $name }}-image-verification
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        cosign.pub: {{`'{{ .cosignPub }}'`}}
        ca.crt: {{`'{{ .registryCA }}'`}}
  data:
    - secretKey: cosignPub
      remoteRef: { key: {{ $iv.cosignKey }}, property: cosign.pub }
    - secretKey: registryCA
      remoteRef: { key: {{ $nr.caSecret }}, property: ca.crt }
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: {{ $nr.caStore }}
---
{{ include "byo.pushSecret" (dict "root" . "name" (printf "%s-push-image-verification" $name) "source" (printf "%s-image-verification" $name)
      "namespace" "platform-delivery" "remoteName" $iv.configMap) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-registry-pull
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ $name }}-registry-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:   # gitleaks:allow: ESO template; the pull-only robot secret comes from the store
        .dockerconfigjson: '{{ printf "{{ dict \"auths\" (dict %s (dict \"username\" %s \"password\" .nodesSecret \"auth\" (printf \"%%s:%%s\" %s .nodesSecret | b64enc))) | toJson }}" (quote $host) (quote $nr.robot) (quote $nr.robot) }}'
  data:
    - secretKey: nodesSecret
      remoteRef: { key: {{ $nr.secretKey }}, property: {{ $nr.secretProperty }} }
---
{{ include "byo.pushSecret" (dict "root" . "name" (printf "%s-push-registry-pull" $name) "source" (printf "%s-registry-pull" $name)
      "namespace" $iv.namespace "remoteName" $iv.pullSecret) }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-image-verification
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ $name }}-image-verification
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      data:   # gitleaks:allow: ESO template of the CRS payload Secret; values come from the store, none in git
        image-verification.yaml: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ $iv.namespace }}
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ $iv.configMap }}
            namespace: {{ $iv.namespace }}
          data:
            cosign.pub: {{`{{ .cosignPub | toJson }}`}}
            ca.crt: {{`{{ .registryCA | toJson }}`}}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ $iv.pullSecret }}
            namespace: {{ $iv.namespace }}
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: {{ printf "{{ dict \"auths\" (dict %s (dict \"username\" %s \"password\" .nodesSecret \"auth\" (printf \"%%s:%%s\" %s .nodesSecret | b64enc))) | toJson | b64enc }}" (quote $host) (quote $nr.robot) (quote $nr.robot) }}
  data:
    - secretKey: cosignPub
      remoteRef: { key: {{ $iv.cosignKey }}, property: cosign.pub }
    - secretKey: nodesSecret
      remoteRef: { key: {{ $nr.secretKey }}, property: {{ $nr.secretProperty }} }
    - secretKey: registryCA
      remoteRef: { key: {{ $nr.caSecret }}, property: ca.crt }
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: {{ $nr.caStore }}
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-image-verification
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"   # after its payload (wave 0) and the Cluster: docs/providers.md "Sync waves of a cluster app"
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      platform.koorikla.io/name: {{ $name }}
  resources:
    - kind: Secret
      name: {{ $name }}-image-verification
{{- end }}
{{- end }}
