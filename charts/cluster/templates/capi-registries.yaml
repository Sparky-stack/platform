{{- /*
k3s node registry config: Secret <name>-registries in ns fleet, written to every node by the ClusterClass
(KThreesConfig files[].contentFrom.secret, variables registryAuth / registryCA):
  registries.yaml   k3s' private registry config (/etc/rancher/k3s/registries.yaml):
                    - configs.<nodeRegistryAuth.registry>.auth        private GHCR (key platform-ghcr)
                    - configs.<registry.host>.{auth,tls.ca_file}      Harbor (robot `nodes`, CA below)
                    - mirrors.<upstream> -> https://<registry.host> with rewrite "^(.*)$" -> "<project>/$1"
                      (Harbor proxy-cache projects, registry.proxyCache); containerd falls back to the upstream
                      endpoint when Harbor fails, so a Harbor outage slows pulls instead of breaking them
  registry-ca.crt   the registry CA's PUBLIC cert (ca.crt of harbor/harbor-ca-bundle via ClusterSecretStore
                    mgmt-harbor, name-scoped read); the CA key never leaves mgmt (ns cert-manager)
Ordering: sync wave -1, before the Cluster (wave 0). cluster-api-k3s v0.5.0's bootstrap controller watches only
KThreesConfigs, not the Secrets their files[].contentFrom reference: a KThreesConfig reconciled before this Secret
exists fails with "secret not found" and is retried only on controller backoff or the 10 min resync. Argo applies the
Cluster - and any change to it, e.g. registryAuth/registryCA turning on - only once this ExternalSecret is Ready (Argo
CD's built-in ExternalSecret health check); until then (e.g. the Harbor CA is not issued yet) the sync fails and Argo
retries, so no Machine is created before its registry config exists.
Bootstrap data is rendered once per Machine: rotated tokens, robot secrets or mirror changes reach machines created
afterwards only (roll them: CAPI topology `rollout.after`). VERIFY rotation story.
*/ -}}
{{- include "capi.validate" . }}
{{- $auth := .Values.secrets.nodeRegistryAuth }}
{{- $harbor := eq (include "capi.registry.harbor" .) "true" }}
{{- $reg := .Values.registry }}
{{- $nr := .Values.nodeRegistry }}
{{- if or $auth.enabled $harbor }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-registries
  namespace: fleet
  labels:
    platform.koorikla.io/name: {{ .Values.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # before the Cluster (wave 0): bootstrap reads this Secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ .Values.name }}-registries
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        registries.yaml: |
          {{- if and $harbor $reg.mirror.enabled }}
          mirrors:
            {{- range $reg.proxyCache }}
            {{ .upstream | quote }}:
              endpoint: [{{ printf "https://%s" $reg.host | quote }}]
              rewrite:
                "^(.*)$": {{ printf "%s/$1" .project | quote }}
            {{- end }}
          {{- end }}
          configs:
            {{- if $auth.enabled }}
            {{ $auth.registry | quote }}:
              auth:
                username: {{`{{ .username | toJson }}`}}
                password: {{`{{ .token | toJson }}`}}
            {{- end }}
            {{- if $harbor }}
            {{ $reg.host | quote }}:
              auth:
                username: {{ $nr.robot | quote }}
                password: {{`{{ .nodesSecret | toJson }}`}}
              tls:
                ca_file: {{ $nr.caFile }}
            {{- end }}
        {{- if $harbor }}
        registry-ca.crt: {{`'{{ .registryCA }}'`}}
        {{- end }}
  data:
    {{- if $auth.enabled }}
    - secretKey: username
      remoteRef:
        key: {{ $auth.key }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ $auth.key }}
        property: token
    {{- end }}
    {{- if $harbor }}
    - secretKey: nodesSecret
      remoteRef:
        key: {{ $nr.secretKey }}
        property: {{ $nr.secretProperty }}
    - secretKey: registryCA
      remoteRef:
        key: {{ $nr.caSecret }}
        property: ca.crt
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: {{ $nr.caStore }}
    {{- end }}
{{- end }}
