{{- /*
Named templates for the mesh-*.yaml files (this file renders nothing): opt-in Istio ambient multicluster, fleet file
key `mesh.group` (docs/multicluster.md). Prefix `mesh.` avoids collisions with the capi/argocd/openchoreo helpers.
*/ -}}

{{- /* Mesh group of this cluster ("" = not a mesh member). meshID = group, network = cluster name. */ -}}
{{- define "mesh.group" -}}
{{- ((.Values.mesh | default dict).group | default "") -}}
{{- end }}

{{- /* Key of this group's root certificate in mgmt's openbao/openbao-ca-bundle (addon openbao templates/pki.yaml). */ -}}
{{- define "mesh.rootKey" -}}mesh-root-{{ include "mesh.group" . }}.pem{{- end }}

{{- /* Kubernetes user peers' istiods authenticate as (client cert CN); addon istio-eastwest binds it on every member
to ClusterRole platform-istio-reader (discovery reads only, no Secrets). Also addon openbao admission.readerUser. */ -}}
{{- define "mesh.readerUser" -}}platform:istio-reader{{- end }}

{{- define "mesh.labels" -}}
platform.koorikla.io/name: {{ required "name is required (cluster file)" .Values.name }}
mesh.platform.koorikla.io/group: {{ include "mesh.group" . }}
app.kubernetes.io/part-of: istio-mesh
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}
