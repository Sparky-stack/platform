{{- /*
Mesh PKI for this cluster on mgmt (cert-manager, namespace fleet), only when the fleet file sets mesh.group:
  Certificate <name>-mesh-ca   intermediate CA signed by ClusterIssuer mesh-root-<group> (addon mesh-root-ca: one root
                               per mesh group, private key never leaves mgmt's cert-manager namespace). Secret
                               <name>-mesh-ca -> this cluster's istiod as `cacerts` (mesh-crs.yaml). istiod signs this
                               cluster's workload certificates with it.
The intermediate's private key does reach the workload cluster: istiod-as-CA needs it (docs/multicluster.md "Trust" -
the proposed, narrow exception to invariant 4, pending approval; istio-csr is the tracked replacement). Istio checks
no CRL/OCSP, so lifetime is the only revocation: 14d, renewed after 7 (survives a week-long mgmt outage). mesh-root-ca's
admission policies admit exactly this shape (isCA, CA usages, <= 336h, fleet/<name>-mesh-ca, applied by Argo CD).
*/ -}}
{{- if include "mesh.group" . }}
{{- $name := .Values.name }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-mesh-ca
  namespace: fleet
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $name }}-mesh-ca
  subject:
    organizations: [{{ .Values.installation.name | quote }}]
    organizationalUnits: [{{ printf "mesh %s" (include "mesh.group" .) | quote }}]
  secretName: {{ $name }}-mesh-ca
  duration: 336h            # 14d; cert-manager renews, ESO + CRS re-deliver, istiod reloads cacerts on change. VERIFY
  renewBefore: 168h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  usages:
    - cert sign
    - crl sign
    - digital signature
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ include "mesh.rootIssuer" . }}
{{- end }}
