{{- /*
Local secret backend only (secrets.backend: kubernetes). Real backends (AWS SM, Vault) are read by each workload
cluster's own ESO (ClusterSecretStore `default`); the local stand-in has no network-reachable vault, so the keys a
workload cluster needs are copied from mgmt's `platform` store into its namespace secrets.workloadKubernetes.namespace,
which its `default` store reads. Same delivery path as the agent identity: ESO-templated ClusterResourceSet payload.
*/ -}}
{{- if and (eq (.Values.secrets.backend | default "kubernetes") "kubernetes") .Values.secrets.workloadSeed.keys }}
{{- $name := required "name is required" .Values.name }}
{{- $wns := .Values.secrets.workloadKubernetes.namespace | default "openchoreo-secrets" }}
{{- range $key := .Values.secrets.workloadSeed.keys }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-seed-{{ $key }}
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ $name }}-seed-{{ $key }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: addons.cluster.x-k8s.io/resource-set
      data:
        seed.yaml: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ $wns }}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ $key }}
            namespace: {{ $wns }}
          data:
          {{`{{- range $k, $v := . }}`}}
            {{`{{ $k }}: {{ $v | b64enc }}`}}
          {{`{{- end }}`}}
  dataFrom:
    - extract:
        key: {{ $key }}
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: {{ $name }}-seed-{{ $key }}
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      platform.koorikla.io/name: {{ $name }}
  resources:
    - kind: Secret
      name: {{ $name }}-seed-{{ $key }}
{{- end }}
{{- end }}
