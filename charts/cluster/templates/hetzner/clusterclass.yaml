{{- /*
UNTESTED EXAMPLE (rendered and schema-checked only; docs/portability.md, docs/providers.md).
k3s on CAPH (Hetzner Cloud), when capi.providers.hetzner. kubelet --cloud-provider=external: addons/hcloud-ccm
initialises nodes from kube-system/hcloud, which CAPH writes into every workload cluster.
Both CNIs encrypt node traffic themselves (Cilium WireGuard, flannel wireguard-native), so no hcloud routes or firewall.
*/ -}}

{{- define "k3s-hetzner.cluster" -}}
template:
  spec:
    controlPlaneRegions: [fsn1]       # replaced by variable region
    controlPlaneLoadBalancer:
      region: fsn1                    # replaced by variable region
      type: {{ .Values.hetzner.loadBalancerType }}
    hcloudNetwork:
      enabled: true
      networkZone: {{ .Values.hetzner.networkZone }}   # replaced by variable networkZone
    hcloudPlacementGroups:
      - name: control-plane
        type: spread
      - name: workers
        type: spread
    hetznerSecretRef:
      name: {{ .Values.hetzner.secretName }}
      key:
        hcloudToken: hcloud
    sshKeys: {}                       # hcloud keys added from variable sshKey
{{- end }}

{{- define "k3s-hetzner.machine" -}}
{{- $role := index . 0 }}{{ $root := index . 1 -}}
template:
  spec:
    type: {{ ternary $root.Values.hetzner.controlPlaneMachineType $root.Values.hetzner.workerMachineType (eq $role "control-plane") }}
    imageName: {{ $root.Values.hetzner.image }}   # replaced by variable image
    placementGroupName: {{ ternary "control-plane" "workers" (eq $role "control-plane") }}
{{- end }}

{{- define "k3s-hetzner.controlPlane" -}}
template:
  spec:
    kthreesConfigSpec:
      serverConfig:
        disableComponents: {{ toJson .Values.k3s.cloudDisableComponents }}
        cloudProviderName: external
        disableCloudController: true
      files:
        {{- include "clusterclass.cniFile" . | nindent 8 }}
{{- end }}

{{- define "k3s-hetzner.worker" -}}
template:
  spec: {}   # agents follow the servers' CNI settings; kubelet --cloud-provider=external is the provider default
{{- end }}

{{- if and (eq .Values.scope "fleet") (.Values.capi.providers.hetzner) }}
{{- $ns := "fleet" }}   {{- /* ClusterClasses live next to the Clusters (docs/conventions.md) */}}
{{- $v := .Values.hetzner }}
{{- $clusterName := include "clusterclass.templateName" (list "k3s-hetzner" (include "k3s-hetzner.cluster" .)) }}
{{- $cpMachineName := include "clusterclass.templateName" (list "k3s-hetzner-control-plane" (include "k3s-hetzner.machine" (list "control-plane" .))) }}
{{- $workerMachineName := include "clusterclass.templateName" (list "k3s-hetzner-worker" (include "k3s-hetzner.machine" (list "worker" .))) }}
{{- $cpName := include "clusterclass.templateName" (list "k3s-hetzner-control-plane" (include "k3s-hetzner.controlPlane" .)) }}
{{- $workerName := include "clusterclass.templateName" (list "k3s-hetzner-worker" (include "k3s-hetzner.worker" .)) }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: k3s-hetzner
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclass.annotations" . | nindent 4 }}
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HetznerClusterTemplate
      name: {{ $clusterName }}
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KThreesControlPlaneTemplate
      name: {{ $cpName }}
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: {{ $cpMachineName }}
  workers:
    machineDeployments:
      - class: default-worker
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KThreesConfigTemplate
            name: {{ $workerName }}
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            name: {{ $workerMachineName }}
        {{- include "clusterclass.workerHealthCheck" . | nindent 8 }}
  variables:
    - name: region
      required: true
      schema:
        openAPIV3Schema:
          type: string
          enum: [fsn1, hel1, nbg1, ash, hil, sin]
          description: Hetzner location for the control plane and its load balancer (fleet file `region`).
    - name: networkZone
      required: false
      schema:
        openAPIV3Schema:
          type: string
          enum: [eu-central, us-east, us-west, ap-southeast]
          default: {{ $v.networkZone }}
          description: Must contain `region` (eu-central = fsn1/nbg1/hel1).
    - name: sshKey
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: ""
          description: Name of an SSH key in the Hetzner project, put on every server ("" = none).
    - name: image
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: {{ $v.image }}
          description: Hetzner image name with cloud-init; k3s is installed at boot.
    - name: controlPlaneMachineType
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: {{ $v.controlPlaneMachineType }}
    - name: workerMachineType
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: {{ $v.workerMachineType }}
    {{- include "clusterclass.commonVariables" . | nindent 4 }}
  patches:
    - name: cluster
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HetznerClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/controlPlaneRegions
              valueFrom:
                template: {{`"[{{ .region | quote }}]"`}}
            - op: replace
              path: /spec/template/spec/controlPlaneLoadBalancer/region
              valueFrom:
                variable: region
            - op: replace
              path: /spec/template/spec/hcloudNetwork/networkZone
              valueFrom:
                variable: networkZone
    - name: sshKey
      enabledIf: {{`"{{ if .sshKey }}true{{ end }}"`}}
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HetznerClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/sshKeys/hcloud
              valueFrom:
                template: {{`"[{\"name\": {{ .sshKey | quote }}}]"`}}
    - name: machines
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/imageName
              valueFrom:
                variable: image
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/type
              valueFrom:
                variable: controlPlaneMachineType
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/type
              valueFrom:
                variable: workerMachineType
    # cni-flannel replaces the whole control-plane files list: it must run before every patch that appends files.
    {{- include "clusterclass.cniFlannelPatch" "flannel-backend: wireguard-native" | nindent 4 }}
    {{- include "clusterclass.registryAuthPatch" . | nindent 4 }}
    {{- include "clusterclass.registryCAPatch" . | nindent 4 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerClusterTemplate
metadata:
  name: {{ $clusterName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclass.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.cluster" . | nindent 2 }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KThreesControlPlaneTemplate
metadata:
  name: {{ $cpName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclass.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.controlPlane" . | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ $cpMachineName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclass.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.machine" (list "control-plane" .) | nindent 2 }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KThreesConfigTemplate
metadata:
  name: {{ $workerName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclass.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.worker" . | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ $workerMachineName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclass.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.machine" (list "worker" .) | nindent 2 }}
---
# CAPH token for every HetznerCluster (hetznerSecretRef). Never committed: platform store key capi-hetzner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.hetzner.secretName }}
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store }}
  target:
    name: {{ .Values.hetzner.secretName }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # CAPH sets it too; keeping it in the template stops ESO and CAPH from fighting over it (untested, #26)
          clusterctl.cluster.x-k8s.io/move: ""
  data:
    - secretKey: hcloud
      remoteRef:
        key: capi-hetzner
        property: hcloud
{{- end }}
