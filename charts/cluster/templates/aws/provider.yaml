{{- /* CAPA InfrastructureProvider (scope fleet, capi.providers.aws); credentials in credentials.yaml. */ -}}
{{- if and (eq .Values.scope "fleet") .Values.capi.providers.aws }}
{{ include "providers.namespace" "capa-system" }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: aws
  namespace: capa-system
  annotations:
    {{- include "providers.annotations" . | nindent 4 }}
spec:
  version: {{ .Values.aws.version }}
  configSecret:
    name: {{ .Values.aws.configSecret }}
    namespace: capa-system
  {{- include "providers.manager" (dict "p" .Values.aws "le" .Values.leaderElection) | nindent 2 }}
{{- end }}
