{{- /* CAPA credentials (scope fleet): ESO pulls AWS_B64ENCODED_CREDENTIALS from the platform store; the operator
substitutes them into CAPA's components (capa-manager-bootstrap-credentials). Never committed. */ -}}
{{- if and (eq .Values.scope "fleet") .Values.capi.providers.aws }}
{{- $aws := .Values.aws }}
{{- if $aws.credentialsFromStore }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $aws.configSecret }}
  namespace: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store }}
  target:
    name: {{ $aws.configSecret }}
    creationPolicy: Owner
  data:
    - secretKey: AWS_B64ENCODED_CREDENTIALS
      remoteRef:
        key: capi-aws
        property: AWS_B64ENCODED_CREDENTIALS
{{- else }}
# No static credentials: CAPA authenticates with its pod identity (IRSA / EKS Pod Identity). Untested (#26).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $aws.configSecret }}
  namespace: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  AWS_B64ENCODED_CREDENTIALS: ""
{{- end }}
{{- end }}
