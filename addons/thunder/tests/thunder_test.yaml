suite: thunder secrets and hooks under Argo CD
templates:
  - templates/bootstrap-secret.yaml
  - templates/validate.yaml
  - templates/ai-agent-clients.yaml
  - templates/github-login.yaml
  - templates/setup-inputs.yaml
  - templates/pvc-delete-protection.yaml
  - charts/thunderid/templates/pvc.yaml
  - charts/thunderid/templates/setup-job.yaml
  - charts/thunderid/templates/admin-secret.yaml
  - charts/thunderid/templates/setup-config-map.yaml
  - charts/thunderid/templates/bootstrap-configmap.yaml
  - charts/thunderid/templates/config-map.yaml
  - charts/thunderid/templates/thunderid-deployment.yaml
  - charts/thunderid/templates/secret.yaml
release:
  name: thunder
  namespace: thunder
tests:
  - it: bootstrap ExternalSecret is a PreSync hook before the setup Job and survives successful syncs
    template: templates/bootstrap-secret.yaml
    asserts:
      - equal: { path: metadata.name, value: thunder-bootstrap }
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "-20"
      - equal:
          path: 'metadata.annotations["helm.sh/hook-delete-policy"]'
          value: hook-failed
      - equal: { path: spec.secretStoreRef.name, value: platform }
  - it: PVCs are never deleted by a successful sync and are delete-protected
    template: charts/thunderid/templates/pvc.yaml
    asserts:
      - hasDocuments: { count: 3 }
      - equal:
          path: 'metadata.annotations["helm.sh/hook-delete-policy"]'
          value: hook-failed
      - equal:
          path: 'metadata.annotations["platform.koorikla.io/delete-protection"]'
          value: enabled
  - it: delete-protection policy denies DELETE of annotated PVCs in the release namespace, for everyone
    template: templates/pvc-delete-protection.yaml
    documentIndex: 0
    asserts:
      - isKind: { of: ValidatingAdmissionPolicy }
      - equal: { path: metadata.name, value: thunder-pvc-delete-protection }
      - equal: { path: spec.failurePolicy, value: Fail }
      - equal:
          path: spec.matchConstraints.resourceRules
          value: [{ apiGroups: [""], apiVersions: [v1], operations: [DELETE], resources: [persistentvolumeclaims] }]
      - equal:
          path: spec.matchConstraints.namespaceSelector.matchLabels
          value: { kubernetes.io/metadata.name: thunder }
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: "oldObject.metadata.annotations\\['platform.koorikla.io/delete-protection'\\] == 'enabled'"
      - equal: { path: 'spec.validations[0].expression', value: "false" }
      - notExists: { path: 'spec.matchConditions[1]' }   # no exemption (not even Argo CD's controller)
  - it: delete-protection survives a failed sync (PreSync hook before the PVCs, before-hook-creation only)
    template: templates/pvc-delete-protection.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: "pre-install,pre-upgrade" }
      - equal: { path: 'metadata.annotations["helm.sh/hook-weight"]', value: "-30" }
      - equal: { path: 'metadata.annotations["helm.sh/hook-delete-policy"]', value: before-hook-creation }
  - it: delete-protection binding denies
    template: templates/pvc-delete-protection.yaml
    documentIndex: 1
    asserts:
      - isKind: { of: ValidatingAdmissionPolicyBinding }
      - equal: { path: spec.policyName, value: thunder-pvc-delete-protection }
      - equal: { path: spec.validationActions, value: [Deny] }
  - it: no lookup()-generated admin Secret (Argo renders without cluster access)
    template: charts/thunderid/templates/admin-secret.yaml
    asserts:
      - hasDocuments: { count: 0 }
  - it: setup Job is replaced on every sync (Argo BeforeHookCreation), never left failed for a day
    template: charts/thunderid/templates/setup-job.yaml
    asserts:
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: pre-install }
      - notExists: { path: 'metadata.annotations["helm.sh/hook-delete-policy"]' }
      - notExists: { path: spec.ttlSecondsAfterFinished }
  - it: setup Job gets the generated values as env
    template: charts/thunderid/templates/setup-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKSTAGE_CLIENT_SECRET
            valueFrom: { secretKeyRef: { name: thunder-bootstrap, key: backstage-client-secret } }
  - it: bootstrap Secret carries the promotion gate's client secret from the promotion-gate store key
    template: templates/bootstrap-secret.yaml
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: promotion-gate-client-secret
            remoteRef: { key: promotion-gate, property: client-secret }
  - it: setup Job gets the promotion gate's client secret as env
    template: charts/thunderid/templates/setup-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROMOTION_GATE_CLIENT_SECRET
            valueFrom: { secretKeyRef: { name: thunder-bootstrap, key: promotion-gate-client-secret } }
  - it: bootstrap bundle registers the promotion gate as a client_credentials-only client with the secret from the store
    template: charts/thunderid/templates/bootstrap-configmap.yaml
    asserts:
      - matchRegex:
          path: data["70-openchoreo-promotion-gate-app.yaml"]
          pattern: 'clientId: openchoreo-promotion-gate\n'
      - matchRegex:
          path: data["70-openchoreo-promotion-gate-app.yaml"]
          pattern: 'clientSecret: "\{\{ \.PROMOTION_GATE_CLIENT_SECRET \}\}"'
      - matchRegex:
          path: data["70-openchoreo-promotion-gate-app.yaml"]
          pattern: 'grantTypes:\n\s+- client_credentials\n\s+tokenEndpointAuthMethod: client_secret_post'
      - matchRegex:
          path: data["70-openchoreo-promotion-gate-app.yaml"]
          pattern: 'publicClient: false'
  - it: fails when the Thunder host drifts from the installation
    template: templates/validate.yaml
    set:
      openchoreo.controlPlane.host: example.com
    asserts:
      - failedTemplate: {}
  - it: AI agent OAuth clients are off by default
    template: templates/bootstrap-secret.yaml
    asserts:
      - notContains: { path: spec.data, content: { secretKey: rca-agent-client-secret }, any: true }
      - notContains: { path: spec.data, content: { secretKey: finops-agent-client-secret }, any: true }
  - it: AI agent client secrets come from openchoreo-ai, the same properties the agents read
    template: templates/bootstrap-secret.yaml
    set:
      bootstrapSecret.aiAgentClients: [rca, finops]
    asserts:
      - contains:
          path: spec.data
          content: { secretKey: rca-agent-client-secret, remoteRef: { key: openchoreo-ai, property: rca-oauth-client-secret } }
      - contains:
          path: spec.data
          content: { secretKey: finops-agent-client-secret, remoteRef: { key: openchoreo-ai, property: finops-oauth-client-secret } }
  - it: rejects an unknown AI agent client
    template: templates/bootstrap-secret.yaml
    set:
      bootstrapSecret.aiAgentClients: [portal-assistant]
    asserts:
      - failedTemplate: { errorPattern: 'bootstrapSecret/aiAgentClients/0' }

  # Regression (thunder-setup outage after PR #5): an unlisted agent was a comment-only file, which Thunder's bootstrap
  # rejects ("document N root must be a YAML mapping"). Off must mean no key, hence no file.
  - it: no AI agent client file while no agent is listed (README only)
    template: templates/ai-agent-clients.yaml
    asserts:
      - equal: { path: 'metadata.annotations["helm.sh/hook-weight"]', value: "-10" }
      - exists: { path: data.README }
      - notExists: { path: 'data["53-rca-agent-client.yaml"]' }
      - notExists: { path: 'data["60-finops-agent-client.yaml"]' }

  - it: listing an agent switches on exactly its Thunder client, secret from the env (never inline)
    template: templates/ai-agent-clients.yaml
    set:
      bootstrapSecret.aiAgentClients: [finops]
    asserts:
      - matchRegex: { path: 'data["60-finops-agent-client.yaml"]', pattern: '(?m)^resource_type: application$' }
      - matchRegex: { path: 'data["60-finops-agent-client.yaml"]', pattern: 'clientId: openchoreo-finops-agent' }
      - matchRegex: { path: 'data["60-finops-agent-client.yaml"]', pattern: 'clientSecret: "\{\{ \.FINOPS_AGENT_CLIENT_SECRET \}\}"' }
      - notExists: { path: 'data["53-rca-agent-client.yaml"]' }

  - it: both agents listed render both clients
    template: templates/ai-agent-clients.yaml
    set:
      bootstrapSecret.aiAgentClients: [rca, finops]
    asserts:
      - matchRegex: { path: 'data["53-rca-agent-client.yaml"]', pattern: 'clientId: openchoreo-rca-agent' }
      - matchRegex: { path: 'data["60-finops-agent-client.yaml"]', pattern: 'clientId: openchoreo-finops-agent' }
      - matchRegex: { path: data.README, pattern: 'finops, rca' }

  - it: setup Job projects the agent clients into a bootstrap subdirectory, optional per key, and reads their secrets as optional env
    template: charts/thunderid/templates/setup-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ai-agent-clients
            configMap:
              name: thunder-ai-agent-clients
              optional: true
              items:
                - { key: README, path: ai-agent-clients/README }
                - { key: 53-rca-agent-client.yaml, path: ai-agent-clients/53-rca-agent-client.yaml }
                - { key: 60-finops-agent-client.yaml, path: ai-agent-clients/60-finops-agent-client.yaml }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: ai-agent-clients, mountPath: /opt/thunderid/bootstrap/ai-agent-clients, subPath: ai-agent-clients, readOnly: true }
      # never again a per-file subPath mount of a key that may be absent or a placeholder
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: ai-agent-clients, mountPath: /opt/thunderid/bootstrap/53-rca-agent-client.yaml, subPath: 53-rca-agent-client.yaml, readOnly: true }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: FINOPS_AGENT_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: thunder-bootstrap, key: finops-agent-client-secret, optional: true } } }

  - it: bootstrap defines only the four org-team groups (developers, qa, release-managers, platform-engineers)
    template: charts/thunderid/templates/bootstrap-configmap.yaml
    asserts:
      - matchRegex: { path: 'data["50-user-schema-and-users.yaml"]', pattern: 'name: developers' }
      - matchRegex: { path: 'data["50-user-schema-and-users.yaml"]', pattern: 'name: qa' }
      - matchRegex: { path: 'data["50-user-schema-and-users.yaml"]', pattern: 'name: release-managers' }
      - matchRegex: { path: 'data["50-user-schema-and-users.yaml"]', pattern: 'name: platform-engineers' }
      - notMatchRegex: { path: 'data["50-user-schema-and-users.yaml"]', pattern: 'name: (admins|demo-developers)\b' }

  - it: fails validation when a required org-team group is missing
    template: templates/validate.yaml
    set:
      thunderid:
        bootstrap:
          scripts:
            "50-user-schema-and-users.yaml": "empty"
    asserts: [ { failedTemplate: {} } ]

  - it: Sign in with GitHub stays off by default (README + default AUTH_FLOW_ID only, no dex-client-secret)
    templates: [templates/github-login.yaml, templates/bootstrap-secret.yaml]
    asserts:
      - template: templates/github-login.yaml
        equal: { path: 'metadata.annotations["helm.sh/hook-weight"]', value: "-10" }
      - template: templates/github-login.yaml
        equal: { path: 'metadata.annotations["helm.sh/hook-delete-policy"]', value: "hook-failed" }
      - template: templates/github-login.yaml
        equal: { path: data.AUTH_FLOW_ID, value: "01900000-0000-7000-8000-000000000061" }
      - template: templates/github-login.yaml
        notExists: { path: 'data["github-dex-connection.yaml"]' }
      - template: templates/github-login.yaml
        notExists: { path: 'data["52-github-flow.yaml"]' }
      - template: templates/bootstrap-secret.yaml
        notContains:
          path: spec.data
          content: { secretKey: dex-client-secret, remoteRef: { key: github-login, property: thunder-client-secret } }

  - it: Sign in with GitHub stays off when installation opts in but secrets.githubLogin.enabled is false
    templates: [templates/github-login.yaml, templates/bootstrap-secret.yaml]
    set:
      githubLogin.enabled: true
      secrets.githubLogin.enabled: false
    asserts:
      - template: templates/github-login.yaml
        equal: { path: data.AUTH_FLOW_ID, value: "01900000-0000-7000-8000-000000000061" }
      - template: templates/github-login.yaml
        notExists: { path: 'data["github-dex-connection.yaml"]' }
      - template: templates/github-login.yaml
        notExists: { path: 'data["52-github-flow.yaml"]' }
      - template: templates/bootstrap-secret.yaml
        notContains:
          path: spec.data
          content: { secretKey: dex-client-secret, remoteRef: { key: github-login, property: thunder-client-secret } }

  - it: Sign in with GitHub renders Dex OIDC connection, team authorizationMapping rules, override_all sync, and JIT auth flow when enabled
    templates: [templates/github-login.yaml, templates/bootstrap-secret.yaml, templates/setup-inputs.yaml]
    set:
      githubLogin.enabled: true
      secrets.githubLogin.enabled: true
    asserts:
      - template: templates/github-login.yaml
        equal: { path: data.AUTH_FLOW_ID, value: "01900000-0000-7000-8001-000000000071" }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: '(?m)^resource_type: connection$' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: 'clientSecret: "\{\{ \.DEX_CLIENT_SECRET \}\}"' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: 'redirectUri: "http://thunder\.openchoreo\.localhost:8080/gate/callback"' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: 'valueType: array' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: 'value: "Sparky-stack:platform-engineers"' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: 'value: "Sparky-stack:developers"' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: 'value: "Sparky-stack:qa"' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: 'value: "Sparky-stack:release-managers"' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["github-dex-connection.yaml"]', pattern: 'groupsAndRoles: override_all' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["52-github-flow.yaml"]', pattern: '(?m)^resource_type: flow$' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["52-github-flow.yaml"]', pattern: 'name: OIDCAuthExecutor' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["52-github-flow.yaml"]', pattern: 'allowAuthenticationWithoutLocalUser: true' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["52-github-flow.yaml"]', pattern: 'name: ProvisioningExecutor' }
      - template: templates/github-login.yaml
        matchRegex: { path: 'data["52-github-flow.yaml"]', pattern: 'label: Continue with GitHub' }
      - template: templates/bootstrap-secret.yaml
        contains:
          path: spec.data
          content: { secretKey: dex-client-secret, remoteRef: { key: github-login, property: thunder-client-secret } }
      - template: templates/setup-inputs.yaml
        exists: { path: 'data["configmap.thunder-github-login"]' }

  - it: Thunder server loads identity_provider declaratively (composite) while keeping all other stores mutable
    templates: [charts/thunderid/templates/config-map.yaml, charts/thunderid/templates/thunderid-deployment.yaml]
    asserts:
      - template: charts/thunderid/templates/config-map.yaml
        matchRegex: { path: 'data["deployment.yaml"]', pattern: 'identity_provider:\n  store: "composite"' }
      - template: charts/thunderid/templates/config-map.yaml
        matchRegex: { path: 'data["deployment.yaml"]', pattern: 'group:\n  store: "mutable"' }
      - template: charts/thunderid/templates/thunderid-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: { name: DEX_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: thunder-bootstrap, key: dex-client-secret, optional: true } } }
      - template: charts/thunderid/templates/thunderid-deployment.yaml
        contains:
          path: spec.template.spec.volumes
          content: { name: declarative-resources, configMap: { name: thunder-github-login } }

  - it: fails validation when githubLogin.issuer drifts from openchoreo.controlPlane.host
    template: templates/validate.yaml
    set:
      githubLogin.enabled: true
      githubLogin.issuer: https://dex.wrong.example.com
    asserts: [ { failedTemplate: {} } ]

  - it: fails validation when githubLogin.teams references a missing groupId
    template: templates/validate.yaml
    set:
      githubLogin.enabled: true
      githubLogin.teams:
        - { team: ghost, group: ghost, groupId: "01900000-0000-7000-8001-999999999999" }
    asserts: [ { failedTemplate: {} } ]
