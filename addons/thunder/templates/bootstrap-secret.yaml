{{- /*
Secret thunder-bootstrap for the setup Job (admin password + env for the bootstrap bundle), from the `platform` store.
A PreSync hook below the setup Job's weight (-5): Argo applies it first and waits until it is Healthy (ExternalSecret
Ready = target Secret written). Store/key missing = Degraded -> the sync fails and the Application retry runs it again.
hook-failed instead of Argo's default BeforeHookCreation: kept (with its Secret) across successful syncs.
It cannot be a normal resource ordered by a sync wave: the PreSync phase runs before every wave. Argo CD never diffs a
hook, so ConfigMap thunder-setup-inputs (templates/setup-inputs.yaml) carries this spec's checksum: a change makes the
app OutOfSync and the next sync re-applies it (#221).
*/ -}}
{{- $s := .Values.bootstrapSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "bootstrapSecret.name" $s.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: hook-failed
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "bootstrapSecret.store" $s.store }}
  target:
    name: {{ $s.name }}
  data:
    {{- range $key := list "thunder-admin-password" "admin-user-password" "developer-user-password" "backstage-client-secret" "service-mcp-client-secret" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required "bootstrapSecret.remoteKey" $s.remoteKey }}
        property: {{ $key }}
    {{- end }}
    {{- /* Observer OAuth client (script 59): shared with the observability plane (addon openchoreo-observability-plane). */}}
    - secretKey: observer-client-secret
      remoteRef:
        key: {{ $s.observabilityRemoteKey | default "openchoreo-observability" }}
        property: observer-client-secret
    {{- /* AI agent OAuth clients (scripts 53 / 60): shared with the agents' Secrets (addon openchoreo-observability-plane). */}}
    {{- range $agent := $s.aiAgentClients | default list }}
    {{- if not (has $agent (list "rca" "finops")) }}
    {{- fail (printf "bootstrapSecret.aiAgentClients: %q is not one of rca, finops" $agent) }}
    {{- end }}
    - secretKey: {{ printf "%s-agent-client-secret" $agent }}
      remoteRef:
        key: {{ $s.aiRemoteKey | default "openchoreo-ai" }}
        property: {{ printf "%s-oauth-client-secret" $agent }}
    {{- end }}
    {{- /* Promotion gate OAuth client (script 70): the same store key the gate's per-run ExternalSecret reads. */}}
    - secretKey: promotion-gate-client-secret
      remoteRef:
        key: {{ required "bootstrapSecret.promotionGate.remoteKey" $s.promotionGate.remoteKey }}
        property: {{ required "bootstrapSecret.promotionGate.property" $s.promotionGate.property }}
