# Upstream 60 (FinOps agent -> openchoreo-api / observer, client_credentials). Mounted into the Thunder setup Job only
# while bootstrapSecret.aiAgentClients lists `finops` (templates/ai-agent-clients.yaml); secret from store key openchoreo-ai.
resource_type: application
id: 01900000-0000-7000-8001-000000000069
ouId: 01900000-0000-7000-8000-000000000001
name: FinOps Agent
type: m2m
description: OpenChoreo FinOps Agent Client
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: openchoreo-finops-agent
      clientSecret: "{{ .FINOPS_AGENT_CLIENT_SECRET }}"
      grantTypes:
        - client_credentials
      tokenEndpointAuthMethod: client_secret_post
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
