{{- /*
Peers' istiods discover this cluster's endpoints as user platform:istio-reader: a 7-day client cert that mgmt's
cert-manager issues from this cluster's k3s client CA (charts/cluster mesh-remote-secret.yaml) and ships to the peers
as their istio-remote-secret-<this cluster>. This binds that user to the read-only ClusterRole the istiod chart ships
for exactly this purpose (services, endpointslices, pods, namespaces, nodes, Istio config, ...). No ServiceAccount
token is minted, so nothing long-lived exists to leak.
*/ -}}
{{- if .Values.reader.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-istio-reader
  labels:
    app.kubernetes.io/part-of: istio-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "istio-reader-clusterrole-%s" .Release.Namespace }}   # istiod chart (no revision)
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ .Values.reader.user }}    # = charts/cluster templates/mesh-helpers.yaml "mesh.readerUser" (contract test)
{{- end }}
