# Cluster-to-cluster connectivity for one mesh member (catalog: namespace istio-system, roles [workload], default false).
# Selected by addons.platform.koorikla.io/istio-eastwest, which charts/cluster derives from the fleet file's mesh.group.
# docs/multicluster.md. What lives where:
#   this addon       Gateway istio-eastwestgateway (GatewayClass istio-east-west, HBONE 15008, double-HBONE terminate)
#                    + RBAC for the reader identity peers use for endpoint discovery (remote secret from mgmt)
#   istio-ambient    istiod/ztunnel: clusterName, meshID, network, AMBIENT_ENABLE_MULTI_NETWORK (catalog parameters)
#   istio-csr        mesh certificates from OpenBao on mgmt (no CA key on the cluster)
#   charts/cluster   (on mgmt) trust payload (OpenBao CA, group root, network label) + remote secrets to peers (CRS)
# The GatewayClass istio-east-west exists only while istiod runs with AMBIENT_ENABLE_MULTI_NETWORK=true.

# Generated by the ApplicationSet (defaults so `helm template` works standalone).
cluster: { name: sample, role: workload, provider: docker, region: local, environment: development, cni: cilium }
installation: { name: local }

# From the cluster's labels (catalog clusterLabelParameters). network falls back to cluster.name, which is what
# charts/cluster puts on the label and on istio-system (topology.istio.io/network) - all three must agree.
mesh:
  group: ""
  network: ""

gateway:
  name: istio-eastwestgateway
  replicas: 1
  # istio-proxy of the generated Deployment (waypoint template). Locally ~30-60Mi idle. VERIFY under load.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Service type LoadBalancer (class default). Locally klipper servicelb = node IP on docker network `kind`.
  serviceAnnotations: {}         # values/provider-*.yaml (AWS NLB); hetzner location is added from cluster.region
  loadBalancerSourceRanges: []   # REQUIRED outside docker (render fails): the peers' egress CIDRs (docs/multicluster.md)

# Peers authenticate as this user (client cert issued on mgmt from this cluster's k3s client CA, 7d); bound here to
# ClusterRole platform-istio-reader (discovery reads only - no Secrets, no ConfigMaps but istio-system/istio, no writes;
# templates/reader-rbac.yaml), never to upstream's istio-reader-clusterrole-istio-system (reads all Secrets).
reader:
  enabled: true
  user: platform:istio-reader
  # istiod 1.32.0 serves a peer only after ALL its informers on that peer synced, including the remote credentials
  # controller's cluster-wide Secret informer. Without Secret list/watch the peer times out (30s) and is left out of the
  # mesh; the opt-out PILOT_ENABLE_REMOTE_CREDENTIALS_CONTROLLER=false SIGSEGVs istiod. There is no knob that gives
  # both. false (default): no Secret access, cross-cluster discovery does not work on 1.32.0. true: peers of the group
  # may list/watch every Secret of this cluster (ClusterRole platform-istio-reader-secrets). Decide per installation
  # (installations/<inst>/addons/istio-eastwest/values.yaml); docs/multicluster.md "Reader RBAC".
  remoteCredentialsSecrets: false
