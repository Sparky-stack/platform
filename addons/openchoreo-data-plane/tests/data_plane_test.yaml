suite: openchoreo-data-plane identity and guards
templates:
  - templates/validate.yaml
  - charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
  - charts/openchoreo-data-plane/templates/cluster-agent/certificate.yaml
  - charts/openchoreo-data-plane/templates/gateway/gateway.yaml
  - templates/cluster-agent-data-services.yaml
  - templates/capability-gate.yaml
  - templates/priority-classes.yaml
set:
  cluster.name: dev1
  openchoreo-data-plane.clusterAgent.planeID: dev1
tests:
  - it: agent dials the installation's gateway URL as plane dev1 with the CRS-delivered cert and CA
    template: charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
    asserts:
      - contains: { path: "spec.template.spec.containers[0].args", content: "--plane-id=dev1" }
      - contains:
          path: spec.template.spec.containers[0].args
          content: --server-url=wss://cluster-gateway.openchoreo.localhost:8443/ws
      - contains:
          path: spec.template.spec.volumes
          content: { name: client-certs, secret: { secretName: cluster-agent-tls } }
      - contains:
          path: spec.template.spec.volumes
          content: { name: server-ca, configMap: { name: cluster-gateway-ca } }

  - it: the chart's own self-signed cert never writes the delivered Secret
    template: charts/openchoreo-data-plane/templates/cluster-agent/certificate.yaml
    asserts:
      - equal: { path: spec.secretName, value: cluster-agent-selfsigned-unused }

  - it: app Gateway listens on HTTP 19080 only
    template: charts/openchoreo-data-plane/templates/gateway/gateway.yaml
    asserts:
      - equal:
          path: spec.listeners
          value: [{ name: http, protocol: HTTP, port: 19080, allowedRoutes: { namespaces: { from: All } } }]

  - it: "the gateway proxy pods join the ambient mesh (#53: STRICT cells need mTLS from ingress), platform labels kept"
    template: charts/openchoreo-data-plane/templates/gateway/gateway.yaml
    asserts:
      - equal: { path: 'spec.infrastructure.labels["istio.io/dataplane-mode"]', value: ambient }
      - equal: { path: 'spec.infrastructure.labels["openchoreo.dev/system-component"]', value: gateway }
      - equal: { path: 'spec.infrastructure.labels["openchoreo.dev/plane-id"]', value: dev1 }

  - it: fails when planeID differs from the cluster name
    template: templates/validate.yaml
    set:
      openchoreo-data-plane.clusterAgent.planeID: default
    asserts:
      - failedTemplate: {}

  - it: fails when serverUrl drifts from the installation
    template: templates/validate.yaml
    set:
      openchoreo.controlPlane.clusterGatewayURL: wss://elsewhere:443/ws
    asserts:
      - failedTemplate: {}

  - it: fails when a control-plane CA Secret would be required
    template: templates/validate.yaml
    set:
      openchoreo-data-plane.clusterAgent.tls.caSecretName: cluster-gateway-ca
    asserts:
      - failedTemplate: {}

  - it: annotates the cluster-agent pod template so Reloader rolls it on client cert or gateway CA renewal
    template: charts/openchoreo-data-plane/templates/cluster-agent/deployment.yaml
    asserts:
      - equal:
          path: 'spec.template.metadata.annotations["secret.reloader.stakater.com/reload"]'
          value: cluster-agent-tls
      - equal:
          path: 'spec.template.metadata.annotations["configmap.reloader.stakater.com/reload"]'
          value: cluster-gateway-ca

  - it: fails when the Reloader Secret annotation drifts from clientSecretName
    template: templates/validate.yaml
    set:
      openchoreo-data-plane:
        clusterAgent:
          podAnnotations:
            secret.reloader.stakater.com/reload: wrong-secret
    asserts:
      - failedTemplate: {}

  - it: fails when the Reloader ConfigMap annotation drifts from serverCAConfigMap
    template: templates/validate.yaml
    set:
      openchoreo-data-plane:
        clusterAgent:
          podAnnotations:
            configmap.reloader.stakater.com/reload: wrong-ca
    asserts:
      - failedTemplate: {}

  - it: the agent may apply and observe the kinds of the platform's data-service types (ScaledObject, PostgreSQL XR)
    template: templates/cluster-agent-data-services.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - contains:
          path: rules
          content: { apiGroups: [keda.sh], resources: [scaledobjects], verbs: [get, list, watch, create, update, patch, delete] }
        documentIndex: 0
      - contains:
          path: rules
          content: { apiGroups: [platform.koorikla.io], resources: [postgresqls], verbs: [get, list, watch, create, update, patch, delete] }
        documentIndex: 0
      - equal:
          path: subjects
          value: [{ kind: ServiceAccount, name: cluster-agent-dataplane, namespace: NAMESPACE }]
        documentIndex: 1

  - it: "capability gate (#246): a Sync hook in wave -1 holds the agent (wave 0) until KEDA's CRD is Established"
    template: templates/capability-gate.yaml
    set:
      capabilityGate.addons.keda.enabled: "true"
    documentSelector: { path: kind, value: Job }
    asserts:
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/hook"]', value: Sync }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "-1" }
      - equal: { path: 'spec.template.spec.initContainers[0].name', value: wait-for-keda-crds }
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [kubectl, wait, --for=create, --timeout=30m, crd/scaledobjects.keda.sh]
      - equal:
          path: spec.template.spec.containers[0].command
          value: [kubectl, wait, --for=condition=Established, --timeout=5m, crd/scaledobjects.keda.sh]

  - it: "capability gate (#255): one named wait per addon (the stuck one is visible), Established waits for all"
    template: templates/capability-gate.yaml
    set:
      capabilityGate.addons.keda.enabled: "true"
      capabilityGate.addons.crossplane.enabled: "true"
    documentSelector: { path: kind, value: Job }
    asserts:
      - equal: { path: 'spec.template.spec.initContainers[0].name', value: wait-for-crossplane-crds }
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [kubectl, wait, --for=create, --timeout=30m, crd/postgresqls.platform.koorikla.io]
      - equal: { path: 'spec.template.spec.initContainers[1].name', value: wait-for-keda-crds }
      - equal:
          path: spec.template.spec.containers[0].command
          value: [kubectl, wait, --for=condition=Established, --timeout=5m, crd/postgresqls.platform.koorikla.io, crd/scaledobjects.keda.sh]

  - it: "capability gate: nothing rendered on a cluster without keda (the agent starts at once)"
    template: templates/capability-gate.yaml
    asserts:
      - hasDocuments: { count: 0 }
  - it: fails without the cluster name (schema)
    template: templates/validate.yaml
    set: { cluster.name: null }
    asserts:
      - failedTemplate: { errorPattern: "at '/cluster': missing property 'name'" }
