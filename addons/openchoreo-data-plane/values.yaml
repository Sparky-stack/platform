# OpenChoreo 1.3.3 data plane on a workload cluster: cluster-agent (dials the control plane's cluster-gateway, applies
# releases) + Gateway gateway-default for app traffic. No controllers of its own. Values = upstream
# install/k3d/multi-cluster/values-dp.yaml @ v1.3.3 plus the lines marked "platform:".
# Needs (workload addons): gateway-api-crds, kgateway, cert-manager (the chart's unused self-signed agent cert),
# external-secrets + ClusterSecretStore `default` (ClusterDataPlane secretStoreRef, app secrets), coredns-local (docker),
# and from mgmt via CAPI ClusterResourceSet `<name>-openchoreo-agent` (charts/cluster):
#   Secret    openchoreo-data-plane/cluster-agent-tls   client cert CN=<cluster name> + key, signed by fleet/<name>-agent-ca
#   ConfigMap openchoreo-data-plane/cluster-gateway-ca  the control-plane gateway CA (public cert only)
# The agent pod waits in ContainerCreating until both exist.
#
# Identity: clusterAgent.planeID MUST equal the cluster name (== ClusterDataPlane planeID == client cert CN). Subchart
# values cannot be templated from `cluster.name`, so the addon ApplicationSet passes it as helm parameter
# `openchoreo-data-plane.clusterAgent.planeID=<cluster name>` (catalog). templates/validate.yaml fails the render
# otherwise. serverUrl is per installation (installations/<inst>/addons/openchoreo-data-plane/values.yaml) and must
# equal installation.yaml openchoreo.controlPlane.clusterGatewayURL (also validated).
#
# Cert rotation: the 1.3.3 agent loads its client cert and gateway CA once at start (internal/cluster-agent/agent.go).
# When cert-manager renews `<name>-agent-tls` (30d before its 1y expiry) or `cluster-gateway-ca` (10y) on mgmt, ESO and
# the CRS update `cluster-agent-tls` / `cluster-gateway-ca`, and addon `reloader` (VAP-fenced to this namespace and tenant cells) rolls
# `cluster-agent-dataplane` via `clusterAgent.podAnnotations`. docs/openchoreo.md "Trust model".

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster:
  name: default             # == openchoreo-data-plane.clusterAgent.planeID below (standalone render only)
openchoreo:
  controlPlane:
    clusterGatewayURL: wss://cluster-gateway.openchoreo.localhost:8443/ws

# provider byo (values/provider-byo.yaml): ConfigMap cluster-gateway-ca from the Secret mgmt pushes into
# platform-delivery, instead of the ClusterResourceSet (templates/byo-gateway-ca.yaml).
byoDelivery:
  # -- On byo clusters (`values/provider-byo.yaml`), agent TLS and CA arrive by `PushSecret`; `templates/byo-gateway-ca.yaml` rebuilds the `cluster-gateway-ca` ConfigMap ([byo](../../docs/providers.md#bring-your-own-cluster-byo)).
  enabled: false
  store: delivery             # ClusterSecretStore of addon secret-stores (delivery.*)

# Agent RBAC for the kinds the platform's data-service OpenChoreo types render (templates/cluster-agent-data-services.yaml,
# #70): ClusterTrait keda-scaler -> KEDA ScaledObject, ClusterResourceType postgresql -> PostgreSQL XR (addon crossplane),
# ClusterTrait metrics -> PodMonitor (addon telemetry, #252).
clusterAgentDataServices:
  # -- Extra agent RBAC (`clusterAgentDataServices.{enabled,serviceAccount,rules}`) for the kinds the platform's data-service types render (KEDA `ScaledObject`, PostgreSQL XR; [data services](../../docs/data-services.md#consuming-them-from-openchoreo)).
  enabled: true
  serviceAccount: cluster-agent-dataplane   # == the upstream agent Deployment's ServiceAccount (checked by the test)
  rules:
    - { apiGroup: keda.sh, resources: [scaledobjects] }
    - { apiGroup: platform.koorikla.io, resources: [postgresqls, mysqls] }   # mysqls: ClusterResourceType mysql (#256)
    - { apiGroup: monitoring.coreos.com, resources: [podmonitors] }   # ClusterTrait metrics (#252, addon telemetry)

# Capability gate (templates/capability-gate.yaml, #246): the cluster agent is the data plane's only door to OpenChoreo,
# so it starts only once the opt-in addons whose kinds platform ClusterTraits render are installed. Without it a first
# boot races: OpenChoreo applies hello-world's KEDA ScaledObject before addon keda exists, the apply fails and OpenChoreo
# 1.3.3 retries only on controller-runtime's exponential backoff (capped at 1000 s), so development served ~17 min late.
capabilityGate:
  # -- Agent start gate (`capabilityGate.{image,timeout,addons.<addon>.{enabled,crds}}`): an Argo CD sync hook in wave -1 waits until every CRD of each enabled addon is Established ([data services](../../docs/data-services.md#keda-and-openchoreo-workloads)).
  image: registry.k8s.io/kubectl:v1.36.0@sha256:63e5e76b746bb8b891a94968d380736c035e768dab0d56ddad1f50c750a4be39   # index: amd64, arm64, ...
  # Per addon: how long one init container waits before the hook fails loudly and Argo CD retries the sync. Covers a
  # Crossplane Configuration package pull (~20 min after the agent on a fresh local bootstrap, #255).
  timeout: 30m
  addons:
    keda:
      # "true" where the cluster runs addon keda: charts/platform clusterLabelParameters copies the cluster secret label
      # addons.platform.koorikla.io/keda (the fleet file's opt-in, the same fact the ClusterDataPlane annotation carries).
      enabled: "false"
      crds: [scaledobjects.keda.sh]   # ClusterTrait keda-scaler (checked by hack/tests/test_openchoreo_types.sh)
    crossplane:
      # Label addons.platform.koorikla.io/crossplane. The XRD comes from the Configuration package crossplane installs
      # after it is Healthy, so this wait also covers the package pull; a failed package keeps the agent waiting here.
      enabled: "false"
      crds: [postgresqls.platform.koorikla.io]   # ClusterResourceType postgresql
    moco:
      # Label addons.platform.koorikla.io/moco: addon moco (MySQLCluster CRD) and, with it, the MySQL API that addon
      # crossplane installs on the same label (XRD from the platform-mysql Configuration package, #256).
      enabled: "false"
      crds: [mysqlclusters.moco.cybozu.com, mysqls.platform.koorikla.io]   # ClusterResourceType mysql
    telemetry:
      # Default-on addon (label addons.platform.koorikla.io/telemetry is "false" only where a fleet file opts out). The
      # PodMonitor CRD comes from its kube-prometheus-stack, in a separate Argo CD Application that may sync after this
      # one; ClusterTrait metrics (#252) renders PodMonitors wherever telemetry runs.
      enabled: "true"
      crds: [podmonitors.monitoring.coreos.com]   # ClusterTrait metrics (platform.koorikla.io/uses-addons)

openchoreo-data-plane:
  # platform: Issuer + Certificate "webhook-server-cert" for a webhook this chart does not deploy
  security:
    enabled: false

  gateway:
    # App ingress: listener http :19080 (upstream k3d port range). kgateway's default Service type LoadBalancer ->
    # k3s klipper binds hostPort 19080 on every node (CAPD: node container IPs on docker network `kind`, reachable
    # from the Linux host). == cluster file openchoreo.dataPlane.gatewayPort (ClusterDataPlane gateway.ingress).
    # -- Workload data-plane Gateway ports (`19080` / `19443`).
    httpPort: 19080         # reachable from the host at <CAPD node IP>:19080 (klipper on CAPD k3s)
    httpsPort: 19443
    tls:
      enabled: false        # HTTPS needs a real wildcard cert for the gateway host; v1 serves HTTP only
    # platform: the proxy pod joins the Istio ambient mesh (#53, docs/networking.md "Strict mTLS in cell namespaces").
    # kgateway copies spec.infrastructure.labels onto the pods it renders; a pod label enrolls only the proxy, not the
    # cluster-agent next to it (namespace openchoreo-data-plane stays out of the mesh). ztunnel then carries the
    # proxy's upstream connections to component pods as HBONE mTLS, so cells can enforce STRICT; the proxy itself has
    # no PeerAuthentication (PERMISSIVE) and keeps accepting plaintext from klipper/the cloud LB and the Prometheus
    # agent. Upstream: kgateway "Ingress" for ambient (label the proxy's namespace or pod). Inert without Istio.
    infrastructure:
      labels:
        istio.io/dataplane-mode: ambient

  clusterAgent:
    image:   # fully qualified (chart default) and pinned by multi-arch index digest (docs/conventions.md invariant 9)
      tag: v1.3.3@sha256:de4907fcf4ffa6822dcbcaff876b02861bae0804c3aa86db6df64f918ef8451c   # index: amd64, arm64
    # -- Set from `openchoreo.controlPlane.clusterGatewayURL` (`installationParameters`) alongside per-cluster `planeID` (`clusterNameParameters`).
    serverUrl: wss://cluster-gateway.openchoreo.localhost:8443/ws
    planeID: default        # overridden per cluster by the addon ApplicationSet (see header)
    resources:              # platform: upstream requests 50m/128Mi; one websocket + applies from the control plane
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 100m, memory: 256Mi }
    podAnnotations:         # roll the agent when CAPI ClusterResourceSet updates its cert or gateway CA (addon reloader)
      secret.reloader.stakater.com/reload: cluster-agent-tls
      configmap.reloader.stakater.com/reload: cluster-gateway-ca
    tls:
      enabled: true
      # -- Mounts `cluster-agent-tls` and `serverCAConfigMap: cluster-gateway-ca` delivered by CAPI `ClusterResourceSet` (with Reloader annotations).
      clientSecretName: cluster-agent-tls     # mounted at /certs; delivered by the ClusterResourceSet
      serverCAConfigMap: cluster-gateway-ca   # mounted at /ca-certs; delivered by the ClusterResourceSet
      # With TLS on, the chart always renders a self-signed Issuer + Certificate (CN = planeID). It must not write into
      # clientSecretName (its default) or cert-manager and the ClusterResourceSet fight over the agent identity: park it.
      generateCerts: true
      secretName: cluster-agent-selfsigned-unused
      caSecretName: ""                        # never copy a control-plane CA (private key) into a workload cluster
