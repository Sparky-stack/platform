# OpenChoreo 1.3.3 data plane on a workload cluster: cluster-agent (dials the control plane's cluster-gateway, applies
# releases) + Gateway gateway-default for app traffic. No controllers of its own. Values = upstream
# install/k3d/multi-cluster/values-dp.yaml @ v1.3.3 plus the lines marked "platform:".
# Needs (workload addons): gateway-api-crds, kgateway, cert-manager (the chart's unused self-signed agent cert),
# external-secrets + ClusterSecretStore `default` (ClusterDataPlane secretStoreRef, app secrets), coredns-local (docker),
# and from mgmt via CAPI ClusterResourceSet `<name>-openchoreo-agent` (charts/cluster):
#   Secret    openchoreo-data-plane/cluster-agent-tls   client cert CN=<cluster name> + key, signed by fleet/<name>-agent-ca
#   ConfigMap openchoreo-data-plane/cluster-gateway-ca  the control-plane gateway CA (public cert only)
# The agent pod waits in ContainerCreating until both exist.
#
# Identity: clusterAgent.planeID MUST equal the cluster name (== ClusterDataPlane planeID == client cert CN). Subchart
# values cannot be templated from `cluster.name`, so the addon ApplicationSet passes it as helm parameter
# `openchoreo-data-plane.clusterAgent.planeID=<cluster name>` (catalog). templates/validate.yaml fails the render
# otherwise. serverUrl is per installation (installations/<inst>/addons/openchoreo-data-plane/values.yaml) and must
# equal installation.yaml openchoreo.controlPlane.clusterGatewayURL (also validated).
#
# Cert rotation: the agent loads its client cert once at start (internal/cluster-agent/agent.go). The cert lives 1y
# and is renewed 30d before expiry on mgmt; the CRS re-applies the Secret, then the agent must be restarted
# (`kubectl -n openchoreo-data-plane rollout restart deploy/cluster-agent-dataplane`). docs/openchoreo.md.

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster:
  name: default             # == openchoreo-data-plane.clusterAgent.planeID below (standalone render only)
openchoreo:
  controlPlane:
    clusterGatewayURL: wss://cluster-gateway.openchoreo.localhost:8443/ws

openchoreo-data-plane:
  # platform: Issuer + Certificate "webhook-server-cert" for a webhook this chart does not deploy
  security:
    enabled: false

  gateway:
    # App ingress: listener http :19080 (upstream k3d port range). kgateway's default Service type LoadBalancer ->
    # k3s klipper binds hostPort 19080 on every node (CAPD: node container IPs on docker network `kind`, reachable
    # from the Linux host). == cluster file openchoreo.dataPlane.gatewayPort (ClusterDataPlane gateway.ingress).
    httpPort: 19080         # VERIFY reachable from the host at <CAPD node IP>:19080 (klipper on CAPD k3s)
    httpsPort: 19443
    tls:
      enabled: false        # HTTPS needs a real wildcard cert for the gateway host; v1 serves HTTP only

  clusterAgent:
    image:   # fully qualified (chart default) and pinned by multi-arch index digest (docs/conventions.md invariant 9)
      tag: v1.3.3@sha256:de4907fcf4ffa6822dcbcaff876b02861bae0804c3aa86db6df64f918ef8451c   # index: amd64, arm64
    serverUrl: wss://cluster-gateway.openchoreo.localhost:8443/ws
    planeID: default        # overridden per cluster by the addon ApplicationSet (see header)
    resources:              # platform: upstream requests 50m/128Mi; one websocket + applies from the control plane
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 100m, memory: 256Mi }
    tls:
      enabled: true
      clientSecretName: cluster-agent-tls     # mounted at /certs; delivered by the ClusterResourceSet
      serverCAConfigMap: cluster-gateway-ca   # mounted at /ca-certs; delivered by the ClusterResourceSet
      # With TLS on, the chart always renders a self-signed Issuer + Certificate (CN = planeID). It must not write into
      # clientSecretName (its default) or cert-manager and the ClusterResourceSet fight over the agent identity: park it.
      generateCerts: true
      secretName: cluster-agent-selfsigned-unused
      caSecretName: ""                        # never copy a control-plane CA (private key) into a workload cluster
