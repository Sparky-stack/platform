{{- /* PriorityClasses for OpenChoreo components (#251, docs/openchoreo.md "Resilience defaults"). ClusterTrait resilience
(addon openchoreo-platform) sets app-production on production pods and app-standard everywhere else, so under node
pressure production pods preempt the others, never the other way round. Both stay far below system-cluster-critical:
platform controllers always win. A pod naming a missing class is rejected, hence they ship with the data plane. */ -}}
{{- range $name, $pc := .Values.priorityClasses }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $name }}
value: {{ $pc.value }}
preemptionPolicy: {{ $pc.preemptionPolicy }}
globalDefault: false
description: {{ $pc.description | quote }}
{{- end }}
