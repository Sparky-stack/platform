{{- /* Invariants: planeID == cluster name (== ClusterDataPlane planeID == client cert CN); serverUrl == installation's
clusterGatewayURL; the chart's own self-signed cert never overwrites the delivered client cert; Reloader annotations
match the delivered client cert Secret and gateway CA ConfigMap. */ -}}
{{- $ca := index .Values "openchoreo-data-plane" "clusterAgent" }}
{{- $name := required "cluster.name is required (generated by the addon ApplicationSet)" .Values.cluster.name }}
{{- if ne $ca.planeID $name }}
{{- fail (printf "openchoreo-data-plane.clusterAgent.planeID (%q) must equal cluster.name (%q): pass helm parameter openchoreo-data-plane.clusterAgent.planeID=<cluster name>" $ca.planeID $name) }}
{{- end }}
{{- if ne $ca.serverUrl .Values.openchoreo.controlPlane.clusterGatewayURL }}
{{- fail (printf "openchoreo-data-plane.clusterAgent.serverUrl (%s) must equal openchoreo.controlPlane.clusterGatewayURL (%s)" $ca.serverUrl .Values.openchoreo.controlPlane.clusterGatewayURL) }}
{{- end }}
{{- if or (not $ca.tls.enabled) (eq $ca.tls.secretName $ca.tls.clientSecretName) $ca.tls.caSecretName }}
{{- fail "openchoreo-data-plane.clusterAgent.tls: enabled, secretName != clientSecretName, caSecretName empty (identity comes from the ClusterResourceSet)" }}
{{- end }}
{{- $pa := $ca.podAnnotations | default dict }}
{{- if ne (index $pa "secret.reloader.stakater.com/reload" | default "") $ca.tls.clientSecretName }}
{{- fail (printf "openchoreo-data-plane.clusterAgent.podAnnotations[\"secret.reloader.stakater.com/reload\"] (%q) must equal clusterAgent.tls.clientSecretName (%q)" (index $pa "secret.reloader.stakater.com/reload" | default "") $ca.tls.clientSecretName) }}
{{- end }}
{{- if ne (index $pa "configmap.reloader.stakater.com/reload" | default "") $ca.tls.serverCAConfigMap }}
{{- fail (printf "openchoreo-data-plane.clusterAgent.podAnnotations[\"configmap.reloader.stakater.com/reload\"] (%q) must equal clusterAgent.tls.serverCAConfigMap (%q)" (index $pa "configmap.reloader.stakater.com/reload" | default "") $ca.tls.serverCAConfigMap) }}
{{- end }}
