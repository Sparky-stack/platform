{{- /*
provider byo only (values/provider-byo.yaml; docs/providers.md "Bring your own cluster (byo)"): ConfigMap
cluster-gateway-ca, which a ClusterResourceSet delivers on CAPI clusters. mgmt pushes the gateway CA's PUBLIC cert as
Secret platform-delivery/cluster-gateway-ca (charts/cluster PushSecret <cluster>-push-gateway-ca; PushSecret writes only
Secrets) and this ExternalSecret turns it into the ConfigMap the agent mounts (clusterAgent.tls.serverCAConfigMap),
through ClusterSecretStore `delivery` (addon secret-stores, name-scoped). Needs external-secrets' generic targets
(addon external-secrets values/provider-byo.yaml).
*/ -}}
{{- if .Values.byoDelivery.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-gateway-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.byoDelivery.store }}
  target:
    name: {{ index .Values "openchoreo-data-plane" "clusterAgent" "tls" "serverCAConfigMap" }}
    creationPolicy: Owner
    manifest:
      apiVersion: v1
      kind: ConfigMap
  data:
    - secretKey: ca.crt
      remoteRef:
        key: cluster-gateway-ca
        property: ca.crt
{{- end }}
