{{- /* RBAC for the platform's data-service types (#70, addon openchoreo-platform files/platform/): upstream's ClusterRole
cluster-agent-dataplane-<ns> knows neither KEDA nor the platform's PostgreSQL XR, so the agent could not apply
(server-side apply) or observe (list for RenderedRelease status) a keda-scaler ScaledObject or a postgresql
ResourceType's XR. One rule per kind a platform ClusterTrait / ClusterResourceType renders; the CRDs exist only where the
addon runs (keda, crossplane), a grant for a missing kind is inert. hack/tests/test_openchoreo_types.sh checks that every
kind the platform's OpenChoreo types render is granted here or upstream. */ -}}
{{- with .Values.clusterAgentDataServices }}
{{- if .enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-dataplane-data-services
  labels:
    app.kubernetes.io/component: cluster-agent
    app.kubernetes.io/part-of: openchoreo
rules:
  {{- range .rules }}
  - apiGroups: [{{ .apiGroup | quote }}]
    resources: {{ .resources | toJson }}
    verbs: [get, list, watch, create, update, patch, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-agent-dataplane-data-services
  labels:
    app.kubernetes.io/component: cluster-agent
    app.kubernetes.io/part-of: openchoreo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-agent-dataplane-data-services
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
