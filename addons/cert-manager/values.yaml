# Wrapper defaults for cert-manager.
cert-manager:
  crds:
    enabled: true
  config:
    enableGatewayAPI: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
  cainjector:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
