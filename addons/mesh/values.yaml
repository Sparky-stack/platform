# Istio 1.32.0 ambient mesh (catalog: namespace istio-system, roles [workload], default true). docs/networking.md.
# Sidecar-free mTLS via ztunnel + istio-cni; works on both cluster CNIs:
#   cni: cilium  (default) -> istio-cni uses the standard /etc/cni/net.d + /opt/cni/bin (k3s with flannel-backend=none)
#   cni: flannel           -> values/cni-flannel.yaml switches to k3s' own CNI dirs (global.platform: k3s)
# North-south Gateway API (GatewayClass kgateway) stays on kgateway; Istio adds only ambient + optional waypoints.
# Gateway API CRDs come from addons/gateway-api-crds; the Istio charts never install them.
# Namespaces join the mesh by label istio.io/dataplane-mode=ambient (OpenChoreo cell namespaces: kyverno-policies).
# Multicluster (docs/multicluster.md): the catalog sets global.multiCluster.clusterName = cluster name on every cluster,
# and on mesh members (labels from the fleet file's mesh.group) layers values/mesh-member.yaml: enables cert-manager
# istio-csr (mesh.csr.enabled) + Vault Issuer `openbao-mesh` + admission guards, enables the east-west Gateway + reader
# RBAC (mesh.eastwest.enabled), turns istiod's CA off, and points istiod/ztunnel at istio-csr -> OpenBao on mgmt.
# No CA key on any workload cluster (AGENTS.md invariant 4).

# Generated by the ApplicationSet (defaults so `helm template` works standalone).
cluster: { name: sample, provider: docker, region: local }
installation: { name: local }

mesh:
  # -- Mesh group and `network` labels (`clusterLabelParameters`), `mgmt` OpenBao endpoint (`mesh.ca.{host,port}`), and multicluster member toggles (`mesh.csr.enabled`, `mesh.eastwest.enabled`, enabled in `values/mesh-member.yaml`).
  group: ""
  network: ""
  ca:
    host: openbao.openchoreo.localhost
    port: 8200
  csr:
    enabled: false
  eastwest:
    enabled: false

global:
  # -- Istio namespace (`global.{multiCluster.clusterName,meshID,network}` are populated from cluster labels; `global.platform` is `k3s` in `values/cni-flannel.yaml` and `gke` in `values/provider-gcp-gke.yaml`).
  istioNamespace: istio-system
  proxy:
    # waypoint proxies istiod injects (optional in ambient; rendered into the injector config, not a pod spec)
    image: docker.io/istio/proxyv2:1.32.0-distroless@sha256:9cd1f1cc261f3fe250ab483543e7256c39d5871eae5f1817c0809eff09e365d4   # index: amd64, arm64

base: {}

istiod:
  # -- `ambient` profile (with `cni.profile` and `ztunnel.profile`, distroless `1.32.0` images pinned by multi-arch index digest; `istiod.env.ENABLE_CA_SERVER` is `"false"` in `values/mesh-member.yaml`).
  profile: ambient
  image: docker.io/istio/pilot:1.32.0-distroless@sha256:219ab7efcf1fd1f883086ad4a4a649c0e70bee3200423d6eef9f435103a79423   # index: amd64, arm64
  # PILOT_ENABLE_REMOTE_CREDENTIALS_CONTROLLER is deliberately NOT set: "false" crashes istiod 1.32.0 as soon as it
  # has a remote secret (nil *CredentialsController.HasSynced in multicluster.Cluster.Run, SIGSEGV seen live). Fixed
  # upstream on master by istio/istio#62295, not in any release yet: set it once on a 1.32 backport or 1.33.
  env:
    AMBIENT_ENABLE_MULTI_NETWORK: "false"
    AMBIENT_ENABLE_BAGGAGE: "false"
  pilot:
    autoscaleEnabled: false
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

cni:
  profile: ambient
  image: docker.io/istio/install-cni:1.32.0-distroless@sha256:bf8fa30fe56fc7209941af23999f1463071b9885c22ec81f5998645718698787   # index: amd64, arm64
  cni:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }

ztunnel:
  profile: ambient
  image: docker.io/istio/ztunnel:1.32.0-distroless@sha256:953a77fc17379301de4b7c6697b1668471c9c1f6ff912c9c5b78f454ab362180   # index: amd64, arm64
  # Roll ztunnel only after istiod is Healthy (Argo CD sync wave 1); group changes also roll ztunnel via podAnnotations.
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  podAnnotations: {}
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# --- istio-csr: mesh.csr.enabled (on in values/mesh-member.yaml) -------------------------------------------------------
# docs/multicluster.md "Mesh CA (OpenBao)". No CA private key exists on a member cluster:
#   templates/csr-issuer.yaml   cert-manager Vault Issuer `openbao-mesh` -> OpenBao on mgmt (mesh.ca), path
#                               pki-mesh-<group>-int/sign/<cluster>; login at auth/mesh-<cluster> with a 10-minute
#                               token of ServiceAccount istio-csr-openbao (audience vault://istio-system/openbao-mesh,
#                               added by cert-manager). No static token, no Secret holding a credential.
#   templates/csr-admission.yaml ValidatingAdmissionPolicy: only istio-csr / cert-manager may request from openbao-mesh
#                               (+ no other Issuer may use its ServiceAccount or the mesh audience)
#   cert-manager-istio-csr      gRPC CA endpoint for ztunnel/istiod (cert-manager-istio-csr.istio-system.svc:443);
#                               istiod serving cert (Secret istiod-tls); root CA ConfigMaps from the pinned group root
# From mgmt (charts/cluster mesh-trust.yaml, CRS): Secret istio-system/openbao-ca (OpenBao's CA, ca.crt), Secret
# istio-system/mesh-root-ca (root-cert.pem = this group's root, public) and ClusterRoleBinding platform-oidc-discovery
# (unauthenticated read of /openid/v1/jwks + /.well-known/openid-configuration: the public keys OpenBao verifies this
# cluster's tokens with; delivered by CRS so it exists before OpenBao configures auth/mesh-<cluster>). values/mesh-member.yaml
# also turns istiod's CA off and points istiod/ztunnel at istio-csr.

issuer:
  # -- Vault `Issuer` (`issuer.{name,serviceAccount,role,caSecret}`) authenticating with `istio-csr-openbao` and `openbao-ca`.
  name: openbao-mesh                 # == memberAuth.audience suffix in addon openbao (vault://istio-system/openbao-mesh)
  serviceAccount: istio-csr-openbao  # == addon openbao memberAuth.serviceAccount
  role: istio-csr                    # == addon openbao memberAuth.role
  caSecret: openbao-ca               # CRS payload from mgmt: OpenBao's CA certificate (key ca.crt)
  # cert-manager's controller requests the token (TokenRequest for the ServiceAccount above).
  certManagerServiceAccount: { name: cert-manager, namespace: cert-manager }

rootCA:
  # -- Pins `mesh-root-ca` (`root-cert.pem`) delivered from `mgmt` via CAPI `ClusterResourceSet`.
  secret: mesh-root-ca               # CRS payload from mgmt: this group's root certificate (public)
  key: root-cert.pem

admission:
  # -- ValidatingAdmissionPolicy (`admission.{enabled,requesters,certificates}`) restricting `openbao-mesh` `CertificateRequest`s.
  enabled: true
  # Who may create CertificateRequests for Issuer openbao-mesh: istio-csr (workload + its serving cert) and
  # cert-manager's controller (the istiod Certificate rendered by the chart).
  requesters:
    - system:serviceaccount:istio-system:cert-manager-istio-csr
    - system:serviceaccount:cert-manager:cert-manager
  certificates: [istiod]             # the only Certificate objects that may reference openbao-mesh

cert-manager-istio-csr:
  image:
    repository: quay.io/jetstack/cert-manager-istio-csr
    tag: v0.19.1
    digest: sha256:eb1b8beee32f7dd830c301b7d2e061f46f9250b0421457e78b1017de8ffb9d86   # multi-arch
  app:
    certmanager:
      namespace: istio-system
      issuer:
        name: openbao-mesh
        kind: Issuer
        group: cert-manager.io
    tls:
      trustDomain: cluster.local     # == addon openbao pki.trustDomain
      rootCAFile: /var/run/secrets/istio-csr/root/root-cert.pem   # pinned group root, never trust-on-first-use
      certificateDNSNames: [cert-manager-istio-csr.istio-system.svc]   # in addon openbao pki.allowedDomains
      certificateDuration: 24h
      istiodCertificateEnable: true
      istiodCertificateDuration: 48h   # <= addon openbao pki.workloadMaxTTL; istiod keeps serving 24h without OpenBao
      istiodCertificateRenewBefore: 24h
      istiodPrivateKeyAlgorithm: ECDSA
      istiodPrivateKeySize: 256
    server:
      clusterID: Kubernetes          # catalog clusterNameParameters: == istio global.multiCluster.clusterName
      maxCertificateDuration: 24h    # workload certs; ztunnel renews at half-life (outage budget >= 12h)
      caTrustedNodeAccounts: istio-system/ztunnel   # ambient: ztunnel requests certs for the pods on its node
      serving:
        signatureAlgorithm: ECDSA
        certificateKeySize: 256
    istio:
      namespace: istio-system
      revisions: [default]
    controller:
      leaderElectionNamespace: istio-system
  volumes:
    - name: root-ca
      secret:
        secretName: mesh-root-ca     # not optional: istio-csr waits for the pinned root
        items: [{ key: root-cert.pem, path: root-cert.pem }]
  volumeMounts:
    - { name: root-ca, mountPath: /var/run/secrets/istio-csr/root, readOnly: true }
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

# --- east-west: mesh.eastwest.enabled (on in values/mesh-member.yaml) --------------------------------------------------
# templates/eastwest-gateway.yaml: Gateway istio-eastwestgateway (GatewayClass istio-east-west, HBONE 15008,
# double-HBONE terminate); templates/eastwest-reader-rbac.yaml: RBAC for the reader identity peers use for endpoint
# discovery (remote secret from mgmt). istiod gets clusterName/meshID/network from catalog parameters and
# AMBIENT_ENABLE_MULTI_NETWORK from values/mesh-member.yaml; charts/cluster (on mgmt) ships the trust payload and the
# remote secrets to peers (CRS).
# The GatewayClass istio-east-west exists only while istiod runs with AMBIENT_ENABLE_MULTI_NETWORK=true.

gateway:
  # -- East-west Gateway sizing (`gateway.{name,replicas,serviceAnnotations,loadBalancerSourceRanges}`) and required peer egress CIDR allowlist outside Docker.
  name: istio-eastwestgateway
  replicas: 1
  # istio-proxy of the generated Deployment (waypoint template). Locally ~30-60Mi idle. VERIFY under load.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Service type LoadBalancer (class default). Locally klipper servicelb = node IP on docker network `kind`.
  serviceAnnotations: {}         # values/provider-*.yaml (AWS NLB); hetzner location is added from cluster.region
  loadBalancerSourceRanges: []   # REQUIRED outside docker (render fails): the peers' egress CIDRs (docs/multicluster.md)

# Peers authenticate as this user (client cert issued on mgmt from this cluster's k3s client CA, 7d); bound here to
# ClusterRole platform-istio-reader (discovery reads only - no Secrets, no ConfigMaps but istio-system/istio, no writes;
# templates/eastwest-reader-rbac.yaml), never to upstream's istio-reader-clusterrole-istio-system (reads all Secrets).
reader:
  # -- Scoped discovery RBAC (`reader.{enabled,user,remoteCredentialsSecrets}`) for `platform:istio-reader`.
  enabled: true
  user: platform:istio-reader
  # istiod 1.32.0 serves a peer only after ALL its informers on that peer synced, including the remote credentials
  # controller's cluster-wide Secret informer. Without Secret list/watch the peer times out (30s) and is left out of the
  # mesh; the opt-out PILOT_ENABLE_REMOTE_CREDENTIALS_CONTROLLER=false SIGSEGVs istiod. There is no knob that gives
  # both. false (default): no Secret access, cross-cluster discovery does not work on 1.32.0. true: peers of the group
  # may list/watch - i.e. read, LIST returns full .data - every Secret of this cluster (ClusterRole
  # platform-istio-reader-secrets). Only allowed with cluster.provider docker (the render fails elsewhere). Decide per
  # installation (installations/<inst>/addons/mesh/values.yaml); docs/multicluster.md "Reader RBAC".
  remoteCredentialsSecrets: false
