apiVersion: v2
name: mesh
description: Istio Ambient mesh (base + istiod + cni + ztunnel), with cert-manager istio-csr (mesh CA in OpenBao on mgmt) and east-west gateway on multicluster mesh members
type: application
version: 0.1.0
# Upstream's OCI charts (ghcr.io/istio/release/charts, published since 1.31; the GCS bucket and gcr.io stop at 1.30.x
# and go away on 2026-12-16) + cert-manager-istio-csr (enabled on mesh members via mesh.csr.enabled in
# values/mesh-member.yaml). Helm cannot pin a dependency by digest, so hack/deps.sh checks every vendored tarball
# against the sha256 below; bump them with the versions.
appVersion: "1.32.0"
dependencies:
  - name: base
    version: 1.32.0
    repository: oci://ghcr.io/istio/release/charts
  - name: istiod
    version: 1.32.0
    repository: oci://ghcr.io/istio/release/charts
  - name: cni
    version: 1.32.0
    repository: oci://ghcr.io/istio/release/charts
  - name: ztunnel
    version: 1.32.0
    repository: oci://ghcr.io/istio/release/charts
  - name: cert-manager-istio-csr
    version: v0.19.1
    repository: https://charts.jetstack.io
    condition: mesh.csr.enabled
annotations:
