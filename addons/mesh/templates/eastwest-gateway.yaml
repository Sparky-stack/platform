{{- /* Ambient east-west Gateway (double-HBONE on 15008, deployed by istiod from the waypoint template via parametersRef; docs/multicluster.md). */ -}}
{{- if .Values.mesh.eastwest.enabled }}
{{- $network := .Values.mesh.network | default .Values.cluster.name }}
{{- $g := .Values.gateway }}
{{- $annotations := deepCopy ($g.serviceAnnotations | default dict) }}
{{- if eq .Values.cluster.provider "hetzner" }}
{{- $_ := set $annotations "load-balancer.hetzner.cloud/location" .Values.cluster.region }}  {{- /* hcloud-ccm needs a location (or network zone) per LB. VERIFY */}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $g.name }}-params
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: istio-mesh
data:
  deployment: |
    spec:
      replicas: {{ $g.replicas }}
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml $g.resources | nindent 16 }}
  {{- with $g.loadBalancerSourceRanges }}
  service: |
    spec:
      loadBalancerSourceRanges:
        {{- toYaml . | nindent 8 }}
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    topology.istio.io/network: {{ $network | quote }}
    app.kubernetes.io/part-of: istio-mesh
spec:
  gatewayClassName: istio-east-west
  infrastructure:
    {{- with $annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $g.name }}-params
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      tls:
        mode: Terminate             # double HBONE: the gateway terminates the outer tunnel only
        options:
          gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
{{- end }}
