{{- /* Renders nothing: cross-field checks of the platform values (types, DNS labels and required keys: values.schema.json). */ -}}
{{- if .Values.mesh.eastwest.enabled }}
{{- /* reader.remoteCredentialsSecrets lets every peer of the group read every Secret of this cluster: docker only. */}}
{{- if and .Values.reader.enabled .Values.reader.remoteCredentialsSecrets (ne .Values.cluster.provider "docker") }}
{{- fail (printf "mesh (%s, provider %s): reader.remoteCredentialsSecrets is a local-only (docker) opt-in - it lets every peer of the group read every Secret of this cluster. Outside docker wait for istio/istio#62295 in a release (docs/multicluster.md \"Reader RBAC\")" .Values.cluster.name .Values.cluster.provider) }}
{{- end }}
{{- /* Outside docker (CAPD on one host) the east-west LoadBalancer is reachable from the internet: HBONE is mTLS-gated,
but 15008/15021 must still not be open to 0.0.0.0/0. Restrict to the peers' egress CIDRs (docs/multicluster.md). */}}
{{- if and (ne .Values.cluster.provider "docker") (empty .Values.gateway.loadBalancerSourceRanges) }}
{{- fail (printf "mesh (%s, provider %s): gateway.loadBalancerSourceRanges is required outside docker - the peers' egress CIDRs (installations/<inst>/addons/mesh/values.yaml)" .Values.cluster.name .Values.cluster.provider) }}
{{- end }}
{{- end }}
