{{- /* Vault Issuer pointing at this cluster's OpenBao PKI role on mgmt via projected SA JWT (no CA key on workload clusters; docs/multicluster.md "Mesh CA (OpenBao)").
Sync waves: -2 SA/RBAC/VAPs, -1 Issuer (Ready check logs in to OpenBao), 0 istio-csr/istiod/cni, 1 ztunnel. */ -}}
{{- if .Values.mesh.csr.enabled }}
{{- $i := .Values.issuer }}
{{- $c := .Values.cluster.name }}
{{- $g := .Values.mesh.group }}
{{- $ca := .Values.mesh.ca }}
{{- if $g }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $i.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"    # before Issuer openbao-mesh (-1): its readiness check logs in with this token
automountServiceAccountToken: false     # only cert-manager's TokenRequest uses it
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-tokenrequest" $i.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"    # before Issuer openbao-mesh (-1): its readiness check logs in with this token
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [{{ $i.serviceAccount }}]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-tokenrequest" $i.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"    # before Issuer openbao-mesh (-1): its readiness check logs in with this token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-tokenrequest" $i.serviceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ $i.certManagerServiceAccount.name }}
    namespace: {{ $i.certManagerServiceAccount.namespace }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $i.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"    # before istio-csr's Deployment and the istiod Certificate
spec:
  vault:
    server: {{ printf "https://%s:%v" $ca.host $ca.port | quote }}
    path: {{ printf "pki-mesh-%s-int/sign/%s" $g $c | quote }}
    caBundleSecretRef:
      name: {{ $i.caSecret }}
      key: ca.crt
    auth:
      kubernetes:
        mountPath: {{ printf "/v1/auth/mesh-%s" $c | quote }}
        role: {{ $i.role }}
        serviceAccountRef:
          name: {{ $i.serviceAccount }}
{{- end }}
{{- end }}
