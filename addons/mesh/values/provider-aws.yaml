# cloud-provider-aws (addon aws-ccm): NLB instead of the classic ELB default; internet-facing so peers in other VPCs or
# regions reach 15008, restricted by gateway.loadBalancerSourceRanges (required outside docker; the render fails without). Node SG: CAPA's default NodePort rule (30000-32767) admits the NLB health checks and traffic.
# VERIFY on the first AWS boot (NLB with aws-ccm, CAPA not reverting CCM-managed SG rules).
gateway:
  serviceAnnotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
