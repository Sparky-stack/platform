# Mesh members only: the addon ApplicationSet layers values/mesh-member.yaml on clusters labelled
# mesh.platform.koorikla.io/group (fleet file mesh.group; docs/multicluster.md "Mesh CA (OpenBao)").
# Enables cert-manager-istio-csr + Vault Issuer/admission (mesh.csr.enabled) and the east-west Gateway + reader RBAC
# (mesh.eastwest.enabled). istiod runs no CA here: istio-csr answers ztunnel's/gateways' CSRs and gets them signed by
# the mesh CA in OpenBao on mgmt. No CA key exists on this cluster (AGENTS.md invariant 4).
mesh:
  csr:
    enabled: true
  eastwest:
    enabled: true

istiod:
  env:
    ENABLE_CA_SERVER: "false"
    AMBIENT_ENABLE_MULTI_NETWORK: "true"
    AMBIENT_ENABLE_BAGGAGE: "true"
  global:
    caAddress: cert-manager-istio-csr.istio-system.svc:443   # proxies generated by istiod (east-west gateway, waypoints)
  # Fail closed: non-optional mounts hold istiod in ContainerCreating until istio-csr issues istiod-tls and istio-ca-root-cert
  # (the upstream chart's own /var/run/secrets/istiod/tls mount is optional and races startup; docs/multicluster.md).
  extraContainerArgs:
    - --tlsCertFile=/var/run/secrets/platform/istiod-tls-gate/tls.crt
    - --tlsKeyFile=/var/run/secrets/platform/istiod-tls-gate/tls.key
    - --caCertFile=/var/run/secrets/platform/istiod-tls-gate/ca.crt
  volumes:
    - name: istiod-tls-gate
      secret: { secretName: istiod-tls }
    - name: root-cert-gate
      configMap: { name: istio-ca-root-cert }
  volumeMounts:
    - { name: istiod-tls-gate, mountPath: /var/run/secrets/platform/istiod-tls-gate, readOnly: true }
    - { name: root-cert-gate, mountPath: /var/run/secrets/platform/root-cert-gate, readOnly: true }

ztunnel:
  caAddress: cert-manager-istio-csr.istio-system.svc:443
