{{- /*
Provider-level cloud credentials. Never committed: ESO pulls them from ClusterSecretStore/platform.
CAPA: the operator substitutes the configSecret's keys into CAPA's components (capa-manager-bootstrap-credentials).
*/ -}}
{{- $p := .Values.capi.providers | default dict }}
{{- if $p.aws }}
{{- $aws := .Values.infrastructure.aws }}
{{- if $aws.credentialsFromStore }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $aws.configSecret }}
  namespace: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store }}
  target:
    name: {{ $aws.configSecret }}
    creationPolicy: Owner
  data:
    - secretKey: AWS_B64ENCODED_CREDENTIALS
      remoteRef:
        key: capi-aws
        property: AWS_B64ENCODED_CREDENTIALS
{{- else }}
# No static credentials: CAPA authenticates with its pod identity (IRSA / EKS Pod Identity). VERIFY
apiVersion: v1
kind: Secret
metadata:
  name: {{ $aws.configSecret }}
  namespace: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  AWS_B64ENCODED_CREDENTIALS: ""
{{- end }}
{{- end }}
