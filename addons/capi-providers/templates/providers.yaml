{{- /*
One namespace per provider (clusterctl layout). Sync waves: namespaces, then credentials (credentials.yaml), then
providers. The operator orders the installs itself (core first) and retries until configSecrets exist.
*/ -}}
{{- define "capi-providers.namespace" -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
{{- end }}

{{- define "capi-providers.annotations" -}}
argocd.argoproj.io/sync-wave: "0"
# operator CRDs come from the capi-operator addon
argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
{{- end }}

{{- /* spec.manager of one provider: (dict "p" <provider values> "le" .Values.leaderElection). featureGates if set;
leaderElection only for managers with the lease flags (p.leaseFlags), which the operator turns into
--leader-elect-{lease-duration,renew-deadline,retry-period} (component_customizer.go leaderElectionArgs). */ -}}
{{- define "capi-providers.manager" -}}
{{- $p := .p -}}
{{- if or $p.featureGates $p.leaseFlags -}}
manager:
  {{- with $p.featureGates }}
  featureGates:
    {{- range $gate, $on := . }}
    {{ $gate }}: {{ $on }}
    {{- end }}
  {{- end }}
  {{- if $p.leaseFlags }}
  {{- $le := .le }}
  {{- if or $le.resourceName $le.resourceNamespace }}
  {{- fail "leaderElection.resourceName/resourceNamespace must stay empty: the operator would pass --leader-election-id, which the CAPI managers do not have" }}
  {{- end }}
  leaderElection:
    leaderElect: true
    leaseDuration: {{ required "leaderElection.leaseDuration is required" $le.leaseDuration | quote }}
    renewDeadline: {{ required "leaderElection.renewDeadline is required" $le.renewDeadline | quote }}
    retryPeriod: {{ required "leaderElection.retryPeriod is required" $le.retryPeriod | quote }}
    resourceLock: leases
    resourceName: ""        # required by the CRD; empty = the manager's default Lease
    resourceNamespace: ""
  {{- end }}
{{- end }}
{{- end }}

{{- $p := .Values.capi.providers | default dict }}
{{- if not (or $p.docker $p.aws $p.hetzner $p.gcp) }}
{{- fail "capi.providers: enable at least one infrastructure provider (docker, aws, hetzner, gcp)" }}
{{- end }}
{{- /* GKE node pools are MachinePools: core's MachinePool gate (default true in core 1.13) is stated explicitly while
CAPG is on, so a listed featureGates map never drops it. */ -}}
{{- $core := deepCopy .Values.core }}
{{- if $p.gcp }}
{{- $_ := set $core "featureGates" (merge (dict "MachinePool" true) ($core.featureGates | default dict)) }}
{{- end }}
{{ include "capi-providers.namespace" "capi-system" }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
  annotations:
    {{- include "capi-providers.annotations" . | nindent 4 }}
spec:
  version: {{ .Values.core.version }}
  {{- include "capi-providers.manager" (dict "p" $core "le" .Values.leaderElection) | nindent 2 }}
---
{{ include "capi-providers.namespace" "capi-k3s-bootstrap-system" }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: BootstrapProvider
metadata:
  name: k3s
  namespace: capi-k3s-bootstrap-system
  annotations:
    {{- include "capi-providers.annotations" . | nindent 4 }}
spec:
  version: {{ .Values.k3s.version }}
  fetchConfig:   # not in clusterctl's built-in provider list
    url: {{ printf "%s/%s/bootstrap-components.yaml" .Values.k3s.releaseURL .Values.k3s.version }}
---
{{ include "capi-providers.namespace" "capi-k3s-control-plane-system" }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: ControlPlaneProvider
metadata:
  name: k3s
  namespace: capi-k3s-control-plane-system
  annotations:
    {{- include "capi-providers.annotations" . | nindent 4 }}
spec:
  version: {{ .Values.k3s.version }}
  fetchConfig:
    url: {{ printf "%s/%s/control-plane-components.yaml" .Values.k3s.releaseURL .Values.k3s.version }}
{{- if $p.docker }}
---
{{ include "capi-providers.namespace" "capd-system" }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: docker
  namespace: capd-system
  annotations:
    {{- include "capi-providers.annotations" . | nindent 4 }}
spec:
  version: {{ .Values.infrastructure.docker.version }}
  {{- include "capi-providers.manager" (dict "p" .Values.infrastructure.docker "le" .Values.leaderElection) | nindent 2 }}
{{- end }}
{{- if $p.aws }}
---
{{ include "capi-providers.namespace" "capa-system" }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: aws
  namespace: capa-system
  annotations:
    {{- include "capi-providers.annotations" . | nindent 4 }}
spec:
  version: {{ .Values.infrastructure.aws.version }}
  configSecret:
    name: {{ .Values.infrastructure.aws.configSecret }}
    namespace: capa-system
  {{- include "capi-providers.manager" (dict "p" .Values.infrastructure.aws "le" .Values.leaderElection) | nindent 2 }}
{{- end }}
{{- if $p.hetzner }}
---
{{ include "capi-providers.namespace" "caph-system" }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: hetzner
  namespace: caph-system
  annotations:
    {{- include "capi-providers.annotations" . | nindent 4 }}
spec:
  version: {{ .Values.infrastructure.hetzner.version }}
{{- end }}

{{- if $p.gcp }}
{{- $gcp := .Values.infrastructure.gcp }}
{{- $wif := .Values.capi.gcp | default dict }}
---
{{ include "capi-providers.namespace" "capg-system" }}
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: gcp
  namespace: capg-system
  annotations:
    {{- include "capi-providers.annotations" . | nindent 4 }}
spec:
  version: {{ $gcp.version }}
  configSecret:
    name: {{ $gcp.configSecret }}
    namespace: capg-system
  {{- include "capi-providers.manager" (dict "p" $gcp "le" .Values.leaderElection) | nindent 2 }}
  deployment:
    containers:
      - name: manager
        imageUrl: {{ $gcp.image }}
  # Workload Identity Federation: the credential config (credentials.yaml) reads a projected token of the manager's
  # ServiceAccount, audience = the WIF provider (its default allowed audience). Kubernetes rotates the token.
  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
        name: capg-controller-manager
        namespace: capg-system
      patch: |
        spec:
          template:
            spec:
              containers:
                - name: manager
                  volumeMounts:
                    - name: gcp-wif-token
                      mountPath: {{ $gcp.tokenPath }}
                      readOnly: true
              volumes:
                - name: gcp-wif-token
                  projected:
                    sources:
                      - serviceAccountToken:
                          path: token
                          audience: {{ printf "https://iam.googleapis.com/%s" $wif.workloadIdentityProvider | quote }}
                          expirationSeconds: 3600
{{- end }}
