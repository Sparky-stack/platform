# Cluster API providers, installed by the cluster-api-operator (addons/capi-operator) from these CRs.
# Infrastructure providers are toggled by the installation: installation.yaml `capi.providers.{docker,aws,hetzner,gcp}`.
#
# Versions: everything is built on CAPI core 1.13 (go.mod sigs.k8s.io/cluster-api). Core 1.13 implements the v1beta2
# contract and still accepts v1beta1-contract providers (clusterctl GetCompatibleVersions): cluster-api-k3s v0.5.0 and
# CAPH v1.1.12 and CAPG v1.13.1 declare v1beta1 in metadata.yaml, CAPD/CAPA v1beta2.

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) ---------
capi:
  # -- Installation toggles (`capi.providers.{docker,aws,hetzner,gcp}`) selecting which `InfrastructureProvider` CRs render.
  providers:
    docker: true
    aws: false
    hetzner: false
    gcp: false
  # GCP (CAPG) installation facts, from installation.yaml `capi.gcp` (docs/providers.md "GKE"). Workload Identity
  # Federation only, no key file: the CAPG manager presents a projected token of its ServiceAccount (issuer = the mgmt
  # cluster's) to Google STS and impersonates serviceAccount.
  gcp:
    # -- WIF pool provider (`capi.gcp.{workloadIdentityProvider,serviceAccount}` from `installation.yaml`) that CAPG impersonates.
    workloadIdentityProvider: ""   # projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
    serviceAccount: ""             # <name>@<project>.iam.gserviceaccount.com

# --- leader election ----------------------------------------------------------------------------------------------
# Lease timings of the provider managers that have the flags (leaseFlags: true below; cluster-api-k3s v0.5.0 and CAPH
# v1.1.12 only have --enable-leader-election / --leader-elect). Upstream defaults 15s/10s/2s: under clean-bootstrap
# load the mgmt API server answered too slowly, capi-controller-manager lost its lease and exited, and its webhook was
# gone while Argo CD applied Cluster/dev1 (#192). Same headroom as mgmt's own k3s controllers (bootstrap/k3d-mgmt.yaml,
# #94). Cost: a crashed single-replica manager is replaced on a new lease after <= 60s instead of 15s.
leaderElection:
  leaseDuration: 60s
  renewDeadline: 40s
  retryPeriod: 10s

# --- providers ----------------------------------------------------------------------------------------------------
core:
  # -- `v1.13.8` with `core.featureGates.ClusterTopology: true` (`ClusterClass` managed topologies).
  version: v1.13.8
  # ClusterTopology (ClusterClass + managed topologies) is an alpha gate, default false in core 1.13: must be on.
  # ClusterResourceSet is NOT listed on purpose: it is GA in core 1.13, its controller always runs and the gate no
  # longer exists - an unknown gate in --feature-gates makes the manager exit at startup.
  featureGates:
    ClusterTopology: true
  leaseFlags: true

k3s:
  # -- `v0.5.0` from `cluster-api-k3s` releases (`k3s.releaseURL`).
  version: v0.5.0
  # "k3s" is not in clusterctl's built-in provider list -> the operator needs the release asset URL.
  releaseURL: https://github.com/k3s-io/cluster-api-k3s/releases

infrastructure:
  docker:
    # -- CAPD `v1.13.8` (`ClusterTopology: true`).
    version: v1.13.8           # CAPD is released with core (infrastructure-components-development.yaml)
    featureGates:
      ClusterTopology: true    # CAPD shares core's gate set; matches the upstream quickstart (CLUSTER_TOPOLOGY=true)
    leaseFlags: true
  aws:
    # -- CAPA `v2.13.1` (`configSecret`, `credentialsFromStore`) and CAPH `infrastructure.hetzner.version` (`v1.1.12`).
    version: v2.13.1
    # Secret (ns capa-system) holding CAPA's clusterctl variables. AWS_B64ENCODED_CREDENTIALS has no default in
    # CAPA's components, so the secret must exist before the provider installs (the operator retries until it does).
    configSecret: capa-variables
    # true: ExternalSecret from ClusterSecretStore/platform key `capi-aws` (property AWS_B64ENCODED_CREDENTIALS,
    #       `clusterawsadm bootstrap credentials encode-as-profile`).
    # false: empty credentials, CAPA uses its pod identity (IRSA / EKS Pod Identity on an AWS mgmt cluster).
    #        Untested (#26).
    credentialsFromStore: true
    # CAPA feature gates are CAPA's own (EKS, MachinePool, ...); ClusterTopology is not one of them - do not add it.
    featureGates: {}
    leaseFlags: true
  hetzner:
    version: v1.1.12
    # CAPH takes no provider-level credentials: every HetznerCluster names its token secret (hetznerSecretRef). That
    # secret (`hetzner` in ns fleet) is rendered by addons/clusterclasses. CAPH has no --feature-gates flag.
  gcp:
    # -- CAPG `v1.13.1`, manager `image` pinned by digest, `GKE` + `MachinePool` `featureGates`.
    version: v1.13.1   # contract v1beta1 (metadata.yaml: 1.13 -> v1beta1), built on CAPI core 1.13
    # The operator swaps the manager image of CAPG's components for this pin (multi-arch index: amd64, arm64, arm,
    # ppc64le, s390x). Bump version and image together (renovate.json, hack/image-audit.sh).
    image: registry.k8s.io/cluster-api-gcp/cluster-api-gcp-controller:v1.13.1@sha256:4432fe0b984a99810f139029a62f16dd23eeeb8f0a31037f8c5c5ef89ddfcba5
    # Secret (ns capg-system) holding CAPG's clusterctl variable GCP_B64ENCODED_CREDENTIALS: an external_account (WIF)
    # credential config built from capi.gcp above - identifiers and a token file path, no key material (credentials.yaml).
    configSecret: capg-variables
    # Path of the projected ServiceAccount token the credential config points at (credentials.yaml patches it in).
    tokenPath: /var/run/secrets/tokens/gcp
    # GKE: the GCPManaged* controllers (off by default). MachinePool: GKE node pools are MachinePools (CAPG's own gate;
    # core's MachinePool gate is set too while gcp is on, templates/providers.yaml).
    featureGates:
      GKE: true
      MachinePool: true
    leaseFlags: true

externalSecrets:
  store: platform              # ClusterSecretStore name (docs/conventions.md)
  refreshInterval: 1h
