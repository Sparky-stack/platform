# Platform-owned ClusterComponentType, derived from openchoreo/openchoreo@v1.3.3
# samples/getting-started/component-types/service.yaml. Platform changes are marked "# Platform:"; the list and the
# upgrade recipe are in files/README.md.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterComponentType
metadata:
  name: service
  annotations:
    openchoreo.dev/description: "A long-running request-serving component with one or more endpoints"
spec:
  workloadType: deployment
  # Platform: the platform's build ClusterWorkflows (== values.yaml buildWorkflows.stacks, guarded by
  # templates/upstream-defaults.yaml) instead of upstream's buildpacks/podman ones, which are not installed.
  allowedWorkflows:
    - kind: ClusterWorkflow
      name: go
    - kind: ClusterWorkflow
      name: nextjs
    - kind: ClusterWorkflow
      name: elixir
    - kind: ClusterWorkflow
      name: ruby
    - kind: ClusterWorkflow
      name: dockerfile
  allowedTraits:
    - kind: ClusterTrait
      name: health-probes
    - kind: ClusterTrait
      name: horizontal-pod-autoscaler
    - kind: ClusterTrait
      name: observability-alert-rule
    - kind: ClusterTrait
      name: persistent-volume-claim
    # Platform: keda-scaler and metrics added (files/platform/cluster-traits/); upstream's vertical-pod-autoscaler
    # removed (not installed: it needs the VPA CRDs on data planes).
    - kind: ClusterTrait
      name: keda-scaler
    - kind: ClusterTrait
      name: metrics
  validations:
    - rule: "${size(workload.endpoints) > 0}"
      message: "Service components must have at least one endpoint. Use 'deployment/worker' for components without endpoints."
    - rule: >-
        ${workload.endpoints.exists(name, ep, "external" in ep.visibility)

          ? has(gateway.ingress) && has(gateway.ingress.external)
          : true}
      message: "Endpoints with 'external' visibility require gateway.ingress.external to be configured on the Environment or DataPlane."
    - rule: >-
        ${workload.endpoints.exists(name, ep, "internal" in ep.visibility)

          ? has(gateway.ingress) && has(gateway.ingress.internal)
          : true}
      message: "Endpoints with 'internal' visibility require gateway.ingress.internal to be configured on the Environment or DataPlane."
  environmentConfigs:
    openAPIV3Schema:
      type: object
      $defs:
        ResourceQuantity:
          type: object
          default: {}
          properties:
            cpu:
              type: string
              default: "100m"
            memory:
              type: string
              default: "256Mi"
        ResourceRequirements:
          type: object
          properties:
            requests:
              $ref: "#/$defs/ResourceQuantity"
            limits:
              $ref: "#/$defs/ResourceQuantity"
          default: {}
      properties:
        replicas:
          type: integer
          default: 1
          minimum: 0
        resources:
          $ref: "#/$defs/ResourceRequirements"
        imagePullPolicy:
          type: string
          default: IfNotPresent
          enum:
            - Always
            - IfNotPresent
            - Never
        # Platform: knobs of the embedded resilience trait (docs/openchoreo.md "Resilience defaults").
        resilience:
          type: object
          default: {}
          properties:
            zoneSpread:
              type: string
              enum: [ScheduleAnyway, DoNotSchedule]
              default: ScheduleAnyway
            nodePool:
              type: string
              default: ""
            terminationGracePeriodSeconds:
              type: integer
              default: 30
              minimum: 1
            preStopSleepSeconds:
              type: integer
              default: 5
              minimum: 0
  # Platform: resilience defaults embedded, so developers attach nothing (files/platform/cluster-traits/resilience.yaml).
  traits:
    - kind: ClusterTrait
      name: resilience
      instanceName: resilience
      environmentConfigs:
        replicas: ${environmentConfigs.replicas}
        zoneSpread: ${environmentConfigs.resilience.zoneSpread}
        nodePool: ${environmentConfigs.resilience.nodePool}
        terminationGracePeriodSeconds: ${environmentConfigs.resilience.terminationGracePeriodSeconds}
        preStopSleepSeconds: ${environmentConfigs.resilience.preStopSleepSeconds}
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
          # Platform: Stakater Reloader (addon reloader) rolls the pods when a Secret they reference rotates.
          annotations:
            secret.reloader.stakater.com/auto: "true"
        spec:
          replicas: ${environmentConfigs.replicas}
          selector:
            matchLabels: ${metadata.podSelectors}
          template:
            metadata:
              labels: ${metadata.podSelectors}
            spec:
              containers:
                - name: main
                  image: ${workload.container.image}
                  imagePullPolicy: ${environmentConfigs.imagePullPolicy}
                  command: |
                    ${has(workload.container.command) ? workload.container.command : oc_omit()}
                  args: |
                    ${has(workload.container.args) ? workload.container.args : oc_omit()}
                  resources:
                    requests:
                      cpu: ${environmentConfigs.resources.requests.cpu}
                      memory: ${environmentConfigs.resources.requests.memory}
                    limits:
                      cpu: ${environmentConfigs.resources.limits.cpu}
                      memory: ${environmentConfigs.resources.limits.memory}
                  env: ${dependencies.toContainerEnvs()}
                  envFrom: ${configurations.toContainerEnvFrom()}
                  volumeMounts: ${configurations.toContainerVolumeMounts() + dependencies.toContainerVolumeMounts()}
              volumes: ${configurations.toVolumes() + dependencies.toVolumes()}
    - id: service
      includeWhen: ${size(workload.endpoints) > 0}
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${metadata.componentName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          type: ClusterIP
          selector: ${metadata.podSelectors}
          ports: ${workload.toServicePorts()}
    - id: httproute-external
      forEach: '${workload.endpoints.transformMap(name, ep, "external" in ep.visibility && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}'
      var: endpoint
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${oc_generate_name(metadata.componentName, endpoint.key)}
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key, "openchoreo.dev/endpoint-visibility": "external"})}'
        spec:
          parentRefs:
            - name: ${gateway.ingress.external.name}
              namespace: ${gateway.ingress.external.namespace}
          hostnames: |
            ${[gateway.ingress.external.?http, gateway.ingress.external.?https]
              .filter(g, g.hasValue()).map(g, g.value().host).distinct()
              .map(h, metadata.environmentName + "-" + metadata.componentNamespace + "." + h)}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /${metadata.componentName}-${endpoint.key}
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: '${endpoint.value.?basePath.orValue("/")}'
                # Allow cross-origin calls (e.g. Backstage OpenAPI console) without credentials.
                - type: CORS
                  cors:
                    allowOrigins: ["*"]
                    allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD]
                    allowHeaders: ["*"]
                    exposeHeaders: ["*"]
                    allowCredentials: false
              backendRefs:
                - name: ${metadata.componentName}
                  port: ${endpoint.value.port}
    - id: httproute-internal
      forEach: '${workload.endpoints.transformMap(name, ep, "internal" in ep.visibility && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}'
      var: endpoint
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: '${oc_generate_name(metadata.componentName, endpoint.key, "internal")}'
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key, "openchoreo.dev/endpoint-visibility": "internal"})}'
        spec:
          parentRefs:
            - name: ${gateway.ingress.internal.name}
              namespace: ${gateway.ingress.internal.namespace}
          hostnames: |
            ${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]
              .filter(g, g.hasValue()).map(g, g.value().host).distinct()
              .map(h, metadata.environmentName + "-" + metadata.componentNamespace + "." + h)}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /${metadata.componentName}-${endpoint.key}
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: '${endpoint.value.?basePath.orValue("/")}'
              backendRefs:
                - name: ${metadata.componentName}
                  port: ${endpoint.value.port}
    - id: env-config
      forEach: ${configurations.toConfigEnvsByContainer()}
      var: envConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${envConfig.resourceName}
          namespace: ${metadata.namespace}
        data: |
          ${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}
    - id: file-config
      forEach: ${configurations.toConfigFileList()}
      var: config
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${config.resourceName}
          namespace: ${metadata.namespace}
        data:
          ${config.name}: |
            ${config.value}
    - id: secret-env-external
      forEach: ${configurations.toSecretEnvsByContainer()}
      var: secretEnv
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${secretEnv.resourceName}
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: ${dataplane.secretStore}
            kind: ClusterSecretStore
          target:
            name: ${secretEnv.resourceName}
            creationPolicy: Owner
          data: |
            ${secretEnv.envs.map(secret, {
              "secretKey": secret.name,
              "remoteRef": {
                "key": secret.remoteRef.key,
                ?"property": secret.remoteRef.?property
              }
            })}
    - id: secret-file-external
      forEach: ${configurations.toSecretFileList()}
      var: file
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${file.resourceName}
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: ${dataplane.secretStore}
            kind: ClusterSecretStore
          target:
            name: ${file.resourceName}
            creationPolicy: Owner
          data:
            - secretKey: ${file.name}
              remoteRef:
                key: ${file.remoteRef.key}
                property: |
                  ${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}
