# OpenChoreo platform-team resources on mgmt (README.md). CRs carry SkipDryRunOnMissingResource: Argo CD retries until
# addon openchoreo-control-plane has installed the CRDs. Environments live in charts/cluster, Projects in charts/tenant.

# --- installation.yaml (defaults so `helm template` works standalone) ---------------------------------------------
installation:
  githubOrg: https://github.com/Sparky-stack      # the promotion gate opens PRs only in repositories of this owner
openchoreo:
  orgNamespace: default
  controlPlane:
    host: openchoreo.localhost
  observability:
    enabled: true
    httpPort: 11080
  workflowPlane:
    enabled: true
    autoBuild: poll                           # poll | webhook | none (templates/auto-build.yaml)

# DeploymentPipeline `default`: promotion order. Every Project created from a tenant file references it (charts/tenant),
# and charts/tenant renders one ProjectReleaseBinding per environment listed here (keep both lists in sync).
deploymentPipeline:
  name: default
  # -- `[development, staging, production]`.
  environments: [development, staging, production]

# Data-service types in files/platform/ (docs/data-services.md): ClusterTrait keda-scaler and the ClusterResourceTypes
# of the Crossplane platform APIs (postgresql, mysql, ...). The Deployment component types (files/cluster-component-types/)
# always allow keda-scaler; with false that entry names no trait.
dataServices:
  # -- Platform types for the data-service addons (`files/platform/`); usable only where the data plane announces the addon (`platform.koorikla.io/requires-addons`).
  enabled: true

# docs/openchoreo.md "Application metrics": opt-in PodMonitor for the component's metrics port (addon telemetry scrapes it).
# The Deployment component types (files/cluster-component-types/) always allow it; with false that entry names no trait.
appMetrics:
  # -- Render ClusterTrait `metrics` (opt-in app metrics scraping).
  enabled: true

# installation.yaml secrets: tenantStores.enabled points component ExternalSecrets at the cell's SecretStore
# tenantStoreName (== addon secret-stores tenantStores.storeName); auto-build needs githubGateApp.enabled (its token).
secrets:
  tenantStores:
    enabled: false
  githubGateApp:
    enabled: false
tenantStoreName: openbao-tenant

# --- Promotion gates (docs/promotion.md) ------------------------------------------------------------------------------
# installation.yaml `promotion` is shared with charts/tenant (Argo CD sync windows, per-environment Applications) and
# overrides these defaults.
promotion:
  # -- Restricts `production` binding writes to Argo CD (`promotion.{gatedEnvironments,restrictedGroups,gitOnly,freezeWindows}`) and enforces sync freeze windows.
  gatedEnvironments: [production]
  # Groups (JWT claim `groups`) denied binding writes in gated environments via console/API/occ/MCP (docs/promotion.md).
  restrictedGroups: [developers]
  # Native ValidatingAdmissionPolicy: bindings of gated environments are written only by Argo CD (templates/promotion-git-only.yaml).
  gitOnly:
    enabled: true
    writers: [system:serviceaccount:argocd:argocd-application-controller]
    metadataWriters: [system:serviceaccount:openchoreo-control-plane:controller-manager]   # finalizers only
    deleters: [system:serviceaccount:kube-system:generic-garbage-collector, system:serviceaccount:kube-system:namespace-controller]
    breakGlassGroups: []             # e.g. [platform-break-glass]; empty = git only, no exceptions
  # Weekly freeze windows (gate workflow refuses, Argo CD sync window denies syncs of the gated Applications).
  freezeWindows:
    - name: weekend
      start: "Fri 16:00"
      end: "Mon 08:00"
      timeZone: Europe/Tallinn
      environments: [production]

# ClusterWorkflow `promotion-gate` (files/promotion-gate/gate.py, docs/promotion.md): verifies a release in its source
# environment and opens the promotion PR. Triggered by addon argo-events or manually in workflows-<org namespace>.
promotionGate:
  # -- HTTP `smoke` + 15-minute Prometheus 5xx SLO gate (`observe`) posting `statusContext` (`openchoreo/promotion-gate`) on PRs.
  enabled: true
  workflowPlane: default             # ClusterWorkflowPlane (addon openchoreo-workflow-plane)
  # Egress opt-in (== openchoreo-workflow-plane runNetworkPolicy.platformWorkflows.podLabels).
  podLabels: { platform.koorikla.io/egress: openchoreo }
  image: docker.io/library/python:3.14.10-alpine3.24@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { memory: 128Mi }
  ttlAfterCompletion: 1h
  # Empty = plain HTTP derived from openchoreo.controlPlane.host / observability.httpPort (local only; set https:// in cloud).
  apiURL: ""                         # http://api.<host>:8080
  tokenURL: ""                       # http://thunder.<host>:8080/oauth2/token
  observerURL: ""                    # http://observer.<host>:<httpPort>
  # In-cluster Prometheus queried for data-plane kgateway Envoy 5xx rate (docs/promotion.md).
  prometheusURL: http://openchoreo-observability-prometheus.openchoreo-observability-plane:9091
  controlPlanePort: 8080             # control-plane Gateway HTTP listener (addon openchoreo-control-plane)
  # Thunder OAuth client (addon thunder bootstrap script 70; role binding in templates/promotion-authz.yaml).
  clientID: openchoreo-promotion-gate
  clientSecret: { key: promotion-gate, property: client-secret }
  # Platform GitHub App (docs/promotion.md): each run mints a token scoped to the component's repository.
  github: { key: promotion-gate-github }
  statusContext: openchoreo/promotion-gate   # required status check on the app repo's default branch
  smoke:
    http: true                       # GET every external endpoint of the source binding; only 2xx passes
    path: /
    # dns (cloud) or podHostIP (local CAPD: connect to a running Pod's node IP on the Gateway port with Host header).
    connect: dns
    # Gate egress TCP ports for connect podHostIP (== charts/cluster openchoreo.dataPlane.gatewayPort).
    egressPorts: []
  observe:
    enabled: true
    windowMinutes: 15
    maxErrorRate: 0.05               # 5xx share of the gateway's requests to the component in the source environment
# --- in-cluster builds (docs/build-plane.md) ---------------------------------------------------------------------
# Image registry: installation.yaml `registry` (defaults for standalone renders). harbor: push to
# <host>/<appsProject>/<project>/<component> as robot `builder`; external: push to <external.repository>/<component>.
registry:
  type: harbor
  host: harbor.openchoreo.localhost:9443
  appsProject: apps
  external:
    repository: ghcr.io/sparky-stack
    credentialsKey: platform-ghcr

# ClusterWorkflows (OpenChoreo, on the control plane) -> Argo ClusterWorkflowTemplate koorikla-build on the workflow plane
# (addon openchoreo-workflow-plane). One component workflow per stack, same ci/scripts as the GitHub Actions
# wrappers; the stack's ClusterComponentTypes list them in allowedWorkflows (files/cluster-component-types/).
buildWorkflows:
  # -- Language stack build workflows (`buildWorkflows.{stacks,platforms,secrets}`: `go`, `nextjs`, `elixir`, `ruby`, `dockerfile`) and chart deploy workflow (`helmChartWorkflow`).
  enabled: true
  workflowPlane: default                     # ClusterWorkflowPlane
  workflowTemplate: koorikla-build
  ttlAfterCompletion: 1d
  platforms: linux/amd64,linux/arm64         # default per run; a run may narrow it (e.g. the node's arch only)
  # Signing with cosign-platform; transparencyLog false keeps private repo names/digests out of public Rekor (docs/build-plane.md#signing).
  signing:
    transparencyLog: false
  # Allowed https://<host>/<owner>/ prefixes (empty = installation.githubOrg); enforced in schema, scripts and git credential helper.
  git:
    allowedRepositoryPrefixes: []
  # Per-run installation tokens for the run's repository (docs/build-plane.md#git-credentials); key must be in workflowStore.keys.
  github:
    # -- Per-run GitHub App installation tokens (`buildWorkflows.github`) for the run's one repository (ESO `GithubAccessToken` generator; `contents: write` for builds, `read` for charts), no PAT.
    key: promotion-gate-github
    secretStore: workflows                   # == addon openchoreo-workflow-plane clusterWorkflowPlane.secretStore
    apiURL: ""                               # GitHub Enterprise Server: https://<host>/api/v3 ("" = api.github.com)
    permissions: { contents: write }
    readPermissions: { contents: read }
    tokenRefreshInterval: 30m
    # Workflow-plane agent SA granted GithubAccessToken CRUD in workflows-<org ns> (templates/build-github.yaml).
    agent: { namespace: openchoreo-workflow-plane, serviceAccount: cluster-agent-workflowplane }
  # Per-run Secrets (ExternalSecrets in workflows-<org ns>, store = the ClusterWorkflowPlane's secretStoreRef):
  secrets:
    cosign: cosign-platform                  # cosign.key (encrypted), cosign.password; cosign.pub is public
    harbor:                                  # registry.type harbor
      robot: robot$builder                   # == addons/harbor config.robots[name=builder]
      key: harbor
      property: builder-secret
      caStore: mgmt-harbor                   # name-scoped read of the registry CA public cert (addon harbor)
      caSecret: harbor-ca-bundle
  stacks:
    - name: go
      displayName: Go
      description: Go module - go vet, golangci-lint (if present), go test -race, govulncheck, multi-arch image
      stack: go
      checkImage: docker.io/library/golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9
      checkSetup: ""
      checkEnv: { RUN_LINT: "true", RUN_VULNCHECK: "true" }
    - name: nextjs
      displayName: Next.js
      description: Next.js app - install, lint, typecheck, test, next build, dependency audit, multi-arch image
      stack: nextjs
      checkImage: docker.io/library/node:24.22.3-trixie-slim@sha256:af02d57b57719b9657a45199a79264a9437940cd55b3c7b3fc99615654f124a0
      checkSetup: ""
      checkEnv: { RUN_LINT: "true", RUN_TYPECHECK: "true", RUN_TEST: "true", RUN_BUILD: "true", RUN_AUDIT: "true", AUDIT_LEVEL: critical }
    - name: elixir
      displayName: Elixir / Phoenix
      description: mix project - compile --warnings-as-errors, format, credo, test (+ PostgreSQL), sobelow, audits, image
      stack: elixir
      checkImage: docker.io/library/elixir:1.19.7-otp-28@sha256:7e27df3e4a684163e4a18e618eede53badb70e97e0c92a1845ab22e2e1d96da2
      checkSetup: mix local.hex --force && mix local.rebar --force
      checkEnv: { MIX_ENV: test, RUN_FORMAT: "true", RUN_CREDO: "true", RUN_TEST: "true", RUN_SOBELOW: "true", RUN_AUDIT: "true" }
      postgres: true                         # offers parameter checks.postgres (ephemeral sidecar, default off)
    - name: ruby
      displayName: Ruby / Rails
      description: Bundler app - rubocop, rspec / rails test (+ PostgreSQL), brakeman, bundler-audit, image
      stack: ruby
      checkImage: docker.io/library/ruby:3.4.12-trixie@sha256:5803b69dd8a875a9afc7e3bbc10d0ba683e12aad2640dbbd44295b4890cc8927
      checkSetup: bundle install --jobs 4
      checkEnv: { RUN_RUBOCOP: "true", TEST_COMMAND: auto, RUN_BRAKEMAN: auto, RUN_AUDIT: "true" }
      postgres: true
    - name: dockerfile
      displayName: Dockerfile
      description: Any Dockerfile - dependency scan, multi-arch image, scan, SBOM, signature (no language checks)
      stack: none
      checkImage: ""
      checkSetup: ""
      checkEnv: {}

# Auto-build (docs/build-plane.md#auto-build): creates WorkflowRun <component>-<sha[:12]> per new commit for Components
# with spec.autoBuild: true. Trigger = installation.yaml openchoreo.workflowPlane.autoBuild (poll | webhook | none).
autoBuild:
  workflowTemplate: auto-build               # == addon argo-events autoBuild.workflowTemplate (Sensor target)
  # -- Builds Components with `autoBuild: true` once per new commit (`autoBuild.{pollSchedule,resyncSchedule,github}`); trigger per installation `openchoreo.workflowPlane.autoBuild` (`poll` | `webhook` | `none`).
  pollSchedule: "* * * * *"                  # trigger poll (cron, UTC; conditional requests, Forbid concurrency)
  resyncSchedule: "*/30 * * * *"             # trigger webhook: reconcile missed deliveries ("" = off)
  maxRunsPerPass: 5                          # WorkflowRuns one pass may create (the rest wait for the next pass)
  staleRunSeconds: 7200                      # an unfinished auto-build run older than this no longer blocks the next
  minRateRemaining: 100                      # pause the pass when the token's GitHub rate limit falls below this
  secretStore: workflows                     # == addon openchoreo-workflow-plane clusterWorkflowPlane.secretStore
  # Read-only installation token of the platform GitHub App (key in addon secret-stores workflowStore.keys).
  github:
    key: promotion-gate-github
    permissions: { contents: read }
    tokenRefreshInterval: 30m
  # registry.type harbor: pull-only robot (== addons/harbor config.robots[name=nodes]) to rebuild missing digests.
  registry:
    robot: robot$nodes
    key: harbor
    property: nodes-secret
  image: docker.io/library/python:3.14.10-alpine3.24@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
  # PR previews (docs/preview-environments.md): second App token for commit statuses and PR labels.
  previews:
    github:
      permissions: { statuses: write, pull_requests: write }
    # -- With `installation.yaml` `previews.enabled`, builds PR heads, cuts the preview `ComponentRelease`, posts `openchoreo/preview` and expires previews ([preview environments](../../docs/preview-environments.md)).
    statusContext: openchoreo/preview          # commit status on the PR head (Details = the preview URL)
    optIn:                                     # == charts/tenant previewOptIn (the ApplicationSet's selector)
      annotation: platform.koorikla.io/preview-environments
      value: enabled
    argocdNamespace: argocd
    schedule: "*/2 * * * *"                    # trigger webhook only (poll runs previews every pollSchedule)

# installation.yaml previews.* (defaults == charts/tenant previews and addon kyverno-policies previews.maxPerTenant).
previews:
  enabled: false
  ttl: 48h
  expiredLabel: preview-expired
  maxPerTenant: 2                  # == Kyverno platform-preview-cap: the pass grants at most this many per tenant (#385)
  grantedLabel: preview-granted    # set by the pass only: the PR's preview renders resources
  waitingLabel: preview-waiting    # set by the pass on PRs beyond the cap (with a failed commit status)
  skipBots: true                   # PRs whose author login ends in [bot] (Dependabot, Renovate) get no preview...
  botLabel: preview                # ...unless they carry this label

# Generic (non-component) ClusterWorkflow `helm-chart`: package + push + sign a Helm chart as OCI (<registry>/charts/<name>).
helmChartWorkflow:
  enabled: true
