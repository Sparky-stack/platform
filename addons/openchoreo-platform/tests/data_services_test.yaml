suite: openchoreo-platform - data-service types (ClusterTrait keda-scaler, ClusterResourceType postgresql, #70)
templates:
  - templates/platform-types.yaml
  - templates/upstream-defaults.yaml
tests:
  - it: renders keda-scaler and postgresql, cluster-scoped, skipped in dry-run while the CRDs are missing
    template: templates/platform-types.yaml
    set:
      resilience.enabled: false   # tests/resilience_test.yaml
      appMetrics.enabled: false   # tests/app_config_metrics_test.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - isNull: { path: metadata.namespace }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true

  - it: renders nothing with dataServices.enabled false
    template: templates/platform-types.yaml
    set:
      dataServices.enabled: false
      resilience.enabled: false
      appMetrics.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: without dataServices the component types do not offer keda-scaler
    template: templates/upstream-defaults.yaml
    documentSelector: { path: metadata.name, value: service }
    set:
      dataServices.enabled: false
    asserts:
      - notContains:
          path: spec.allowedTraits
          content: { kind: ClusterTrait, name: keda-scaler }

  - it: keda-scaler creates a ScaledObject for the component's Deployment
    template: templates/platform-types.yaml
    documentSelector: { path: metadata.name, value: keda-scaler }
    asserts:
      - isKind: { of: ClusterTrait }
      - equal: { path: 'spec.creates[0].includeWhen', value: "${environmentConfigs.enabled}" }
      - equal: { path: 'spec.creates[0].template.apiVersion', value: keda.sh/v1alpha1 }
      - equal: { path: 'spec.creates[0].template.kind', value: ScaledObject }
      - equal: { path: 'spec.creates[0].template.metadata.namespace', value: "${metadata.namespace}" }
      - equal:
          path: spec.creates[0].template.spec.scaleTargetRef
          value: { apiVersion: apps/v1, kind: Deployment, name: "${metadata.name}" }
      - equal: { path: 'spec.creates[0].template.spec.triggers', value: "${parameters.triggers}" }

  - it: keda-scaler removes /spec/replicas from the Deployment (the agent's apply then leaves KEDA's replicas alone)
    template: templates/platform-types.yaml
    documentSelector: { path: metadata.name, value: keda-scaler }
    asserts:
      - equal:
          path: spec.patches
          value:
            - target: { group: apps, version: v1, kind: Deployment, where: "${environmentConfigs.enabled}" }
              operations: [{ op: remove, path: /spec/replicas }]

  - it: keda-scaler refuses data planes without addon keda (ClusterDataPlane annotation from the fleet file)
    template: templates/platform-types.yaml
    documentSelector: { path: metadata.name, value: keda-scaler }
    asserts:
      - equal: { path: 'metadata.annotations["platform.koorikla.io/requires-addons"]', value: keda }
      - matchRegex:
          path: spec.preRenderValidations[0].rule
          pattern: '^\$\{!environmentConfigs\.enabled \|\| \(has\(dataplane\.annotations\) && "addons\.platform\.koorikla\.io/keda" in dataplane\.annotations && dataplane\.annotations\["addons\.platform\.koorikla\.io/keda"\] == "true"\)\}$'
      - matchRegex: { path: 'spec.preRenderValidations[0].message', pattern: 'addons\.keda: true' }
      - isNull: { path: spec.validations }    # deprecated alias; mutually exclusive with preRenderValidations

  - it: keda-scaler rejects a second autoscaler (rendered HPA) and offers no ClusterTriggerAuthentication
    template: templates/platform-types.yaml
    documentSelector: { path: metadata.name, value: keda-scaler }
    asserts:
      - equal: { path: 'spec.postRenderValidations[0].target.kind', value: HorizontalPodAutoscaler }
      - equal: { path: 'spec.postRenderValidations[0].target.mustMatch', value: false }
      - equal: { path: 'spec.postRenderValidations[0].rule', value: "${false}" }
      - equal:
          path: spec.parameters.openAPIV3Schema.properties.triggers.items.properties.authenticationRef.properties
          value: { name: { type: string, minLength: 1 } }

  - it: postgresql renders the Crossplane PostgreSQL XR, never a raw CNPG Cluster
    template: templates/platform-types.yaml
    documentSelector: { path: metadata.name, value: postgresql }
    asserts:
      - isKind: { of: ClusterResourceType }
      - lengthEqual: { path: spec.resources, count: 1 }
      - equal: { path: 'spec.resources[0].id', value: postgresql }
      - equal: { path: 'spec.resources[0].template.apiVersion', value: platform.koorikla.io/v1alpha1 }
      - equal: { path: 'spec.resources[0].template.kind', value: PostgreSQL }
      - equal: { path: 'spec.resources[0].template.metadata.name', value: "${metadata.name}" }
      - equal: { path: 'spec.resources[0].template.metadata.namespace', value: "${metadata.namespace}" }
      - equal: { path: 'metadata.annotations["platform.koorikla.io/requires-addons"]', value: crossplane }

  - it: postgresql is ready only when the XR is Ready (an unknown kind is healthy by presence in OpenChoreo 1.3.3)
    template: templates/platform-types.yaml
    documentSelector: { path: metadata.name, value: postgresql }
    asserts:
      - matchRegex:
          path: spec.resources[0].readyWhen
          pattern: 'applied\.postgresql\.status\.conditions\.exists\(c, c\.type == "Ready" && c\.status == "True"\)'

  - it: postgresql outputs - host/port from the XR status, credentials only as secretKeyRefs to <name>-app
    template: templates/platform-types.yaml
    documentSelector: { path: metadata.name, value: postgresql }
    asserts:
      - contains: { path: spec.outputs, content: { name: host, value: "${applied.postgresql.status.endpoint}" } }
      - contains: { path: spec.outputs, content: { name: port, value: "${string(applied.postgresql.status.port)}" } }
      - contains: { path: spec.outputs, content: { name: database, value: "${parameters.database}" } }
      - contains: { path: spec.outputs, content: { name: username, secretKeyRef: { name: "${metadata.name}-app", key: username } } }
      - contains: { path: spec.outputs, content: { name: password, secretKeyRef: { name: "${metadata.name}-app", key: password } } }
      - contains: { path: spec.outputs, content: { name: uri, secretKeyRef: { name: "${metadata.name}-app", key: uri } } }
      - lengthEqual: { path: spec.outputs, count: 6 }

  - it: keda-scaler is an allowed trait of service
    template: templates/upstream-defaults.yaml
    documentSelector: { path: metadata.name, value: service }
    asserts:
      - contains: { path: spec.allowedTraits, content: { kind: ClusterTrait, name: keda-scaler } }
      - contains: { path: spec.allowedTraits, content: { kind: ClusterTrait, name: horizontal-pod-autoscaler } }

  - it: keda-scaler is an allowed trait of web-application
    template: templates/upstream-defaults.yaml
    documentSelector: { path: metadata.name, value: web-application }
    asserts:
      - contains: { path: spec.allowedTraits, content: { kind: ClusterTrait, name: keda-scaler } }

  - it: keda-scaler is an allowed trait of worker
    template: templates/upstream-defaults.yaml
    documentSelector: { path: metadata.name, value: worker }
    asserts:
      - contains: { path: spec.allowedTraits, content: { kind: ClusterTrait, name: keda-scaler } }

  - it: scheduled-task (CronJob) gets no keda-scaler
    template: templates/upstream-defaults.yaml
    documentSelector: { path: metadata.name, value: scheduled-task }
    asserts:
      - equal: { path: spec.allowedTraits, value: [] }
