suite: openchoreo-platform - build ClusterWorkflows (workflow plane, koorikla/ci parity)
templates:
  - templates/build-workflows.yaml
  - templates/build-github.yaml
  - templates/helm-chart-workflow.yaml
  - templates/upstream-defaults.yaml
tests:
  - it: one component ClusterWorkflow per stack on ClusterWorkflowPlane default
    template: templates/build-workflows.yaml
    asserts:
      - hasDocuments: { count: 5 }
      - isKind: { of: ClusterWorkflow }
      - equal: { path: 'metadata.labels["openchoreo.dev/workflow-type"]', value: component }
      - equal: { path: spec.workflowPlaneRef, value: { kind: ClusterWorkflowPlane, name: default } }
      - equal: { path: spec.runTemplate.spec.workflowTemplateRef, value: { name: koorikla-build, clusterScope: true } }
      - equal: { path: spec.runTemplate.spec.serviceAccountName, value: workflow-sa }
      - equal: { path: spec.runTemplate.spec.automountServiceAccountToken, value: false }
      - equal: { path: spec.runTemplate.spec.executor.serviceAccountName, value: workflow-sa }
      - notExists: { path: spec.runTemplate.spec.podMetadata }   # builds never opt into platform-workflow egress

  - it: Backstage and the autoBuild matcher find the repository fields
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    asserts:
      - equal: { path: 'spec.parameters.openAPIV3Schema.properties.repository.properties.url["x-openchoreo-component-parameter-repository-url"]', value: true }
      - equal: { path: 'spec.parameters.openAPIV3Schema.properties.repository.properties.appPath["x-openchoreo-component-parameter-repository-app-path"]', value: true }

  - it: harbor pushes to <host>/apps/<project>/<component> as robot builder, trusting the registry CA
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    asserts:
      - contains:
          path: spec.runTemplate.spec.arguments.parameters
          content: { name: image-repo, value: "harbor.openchoreo.localhost:9443/apps/${metadata.labels['openchoreo.dev/project']}/${metadata.labels['openchoreo.dev/component']}" }
      - matchRegex:
          path: 'spec.resources[?(@.id == "registry-secret")].template.spec.target.template.data[".dockerconfigjson"]'
          pattern: '"harbor.openchoreo.localhost:9443":\{"username":"robot\$builder"'
      - equal:
          path: 'spec.resources[?(@.id == "registry-ca")].template.spec.secretStoreRef'
          value: { kind: ClusterSecretStore, name: mgmt-harbor }

  - it: external registry pushes to <repository>/<component> with its credentials and no CA resource
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    set: { registry.type: external }
    asserts:
      - contains:
          path: spec.runTemplate.spec.arguments.parameters
          content: { name: image-repo, value: "ghcr.io/koorikla/${metadata.labels['openchoreo.dev/component']}" }
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: registry-host, value: ghcr.io } }
      - notExists: { path: 'spec.resources[?(@.id == "registry-ca")]' }

  - it: per run, a GitHub App installation token for the run's one repository with contents write (no PAT)
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    asserts:
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.kind', value: GithubAccessToken }
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.apiVersion', value: generators.external-secrets.io/v1alpha1 }
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.metadata.name', value: "${metadata.workflowRunName}-git" }
      # exactly one repository: the name of this run's repository.url (OpenChoreo CEL, ".git" removed), never a list
      # from values, never empty (an empty list would mean every repository of the installation)
      - equal:
          path: 'spec.resources[?(@.id == "git-token")].template.spec.repositories'
          value: ["${parameters.repository.url.substring(parameters.repository.url.lastIndexOf('/') + 1, size(parameters.repository.url) - (parameters.repository.url.endsWith('.git') ? 4 : 0))}"]
      # contents write only when this run commits the image ref (gitops.enabled; PR previews run without it)
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.spec.permissions', value: { contents: "${parameters.gitops.enabled ? 'write' : 'read'}" } }
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.spec.appIDRef', value: { name: build-github-app, key: app-id } }
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.spec.installIDRef', value: { name: build-github-app, key: installation-id } }
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.spec.auth.privateKey.secretRef', value: { name: build-github-app, key: private-key } }
      - notExists: { path: 'spec.resources[?(@.id == "git-token")].template.spec.url' }
      # the run's Secret holds only that token, re-minted before it expires; no store key is read for git
      - equal:
          path: 'spec.resources[?(@.id == "git-secret")].template.spec.dataFrom'
          value:
            - sourceRef:
                generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: GithubAccessToken, name: "${metadata.workflowRunName}-git" }
      - notExists: { path: 'spec.resources[?(@.id == "git-secret")].template.spec.data' }
      - notExists: { path: 'spec.resources[?(@.id == "git-secret")].template.spec.secretStoreRef' }
      - equal: { path: 'spec.resources[?(@.id == "git-secret")].template.spec.refreshInterval', value: 30m }
      - equal:
          path: 'spec.resources[?(@.id == "git-secret")].template.spec.target.template.data'
          value: { username: x-access-token, password: "{{ .token }}" }
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: github-api-url, value: "https://api.github.com" } }
      - notContains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: git-author }, any: true }

  - it: helm-chart builds only clone - their token is read-only
    template: templates/helm-chart-workflow.yaml
    asserts:
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.spec.permissions', value: { contents: read } }
      - lengthEqual: { path: 'spec.resources[?(@.id == "git-token")].template.spec.repositories', count: 1 }

  - it: GitHub Enterprise Server - the generator and the GitOps commit use apiURL
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    set: { buildWorkflows.github.apiURL: "https://ghe.example.com/api/v3" }
    asserts:
      - equal: { path: 'spec.resources[?(@.id == "git-token")].template.spec.url', value: "https://ghe.example.com/api/v3" }
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: github-api-url, value: "https://ghe.example.com/api/v3" } }

  - it: fails without token permissions (never an unscoped installation token)
    template: templates/build-workflows.yaml
    set: { buildWorkflows.github.permissions: null }
    asserts:
      - failedTemplate: { errorPattern: "permissions .* are required" }

  - it: the App's private key reaches only ESO, through the scoped store, in the run namespace
    template: templates/build-github.yaml
    documentSelector: { path: kind, value: ExternalSecret }
    asserts:
      - equal: { path: metadata, value: { name: build-github-app, namespace: workflows-default } }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: workflows } }
      - equal:
          path: spec.data
          value:
            - { secretKey: app-id, remoteRef: { key: promotion-gate-github, property: githubAppID } }
            - { secretKey: installation-id, remoteRef: { key: promotion-gate-github, property: githubAppInstallationID } }
            - { secretKey: private-key, remoteRef: { key: promotion-gate-github, property: githubAppPrivateKey } }

  - it: OpenChoreo's workflow-plane agent may manage GithubAccessToken generators in the run namespace only
    template: templates/build-github.yaml
    asserts:
      - equal:
          path: rules
          value: [{ apiGroups: [generators.external-secrets.io], resources: [githubaccesstokens], verbs: [get, list, watch, create, update, patch, delete] }]
        documentSelector: { path: kind, value: Role }
      - equal: { path: metadata.namespace, value: workflows-default }
        documentSelector: { path: kind, value: Role }
      - equal:
          path: subjects
          value: [{ kind: ServiceAccount, name: cluster-agent-workflowplane, namespace: openchoreo-workflow-plane }]
        documentSelector: { path: kind, value: RoleBinding }

  - it: no App credentials or agent rights without a workflow plane
    template: templates/build-github.yaml
    set: { openchoreo.workflowPlane.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  - it: the signing key and git credentials come from the platform store, never from values
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: dockerfile }
    asserts:
      - equal: { path: 'spec.resources[?(@.id == "cosign-secret")].template.spec.secretStoreRef.name', value: "${workflowplane.secretStore}" }
      - equal:
          path: 'spec.resources[?(@.id == "cosign-secret")].template.spec.data'
          value:
            - { secretKey: cosign.key, remoteRef: { key: cosign-platform, property: cosign.key } }
            - { secretKey: cosign.password, remoteRef: { key: cosign-platform, property: cosign.password } }
      - equal: { path: 'spec.resources[?(@.id == "git-secret")].template.spec.target.template.type', value: kubernetes.io/basic-auth }

  - it: repository.url is limited to the installation's githubOrg (no token for other hosts or owners)
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    asserts:
      - equal:
          path: spec.parameters.openAPIV3Schema.properties.repository.properties.url.pattern
          value: '^(https://github\.com/koorikla/)[A-Za-z0-9][A-Za-z0-9._-]*$'
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: git-allowed-prefixes, value: "https://github.com/koorikla/" } }

  - it: the allowlist follows installation.githubOrg (trailing slash normalized)
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    set: { installation.githubOrg: "https://github.com/acme/" }
    asserts:
      - equal:
          path: spec.parameters.openAPIV3Schema.properties.repository.properties.url.pattern
          value: '^(https://github\.com/acme/)[A-Za-z0-9][A-Za-z0-9._-]*$'
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: git-allowed-prefixes, value: "https://github.com/acme/" } }

  - it: explicit allowedRepositoryPrefixes replace githubOrg, one alternative per prefix
    template: templates/helm-chart-workflow.yaml
    set:
      buildWorkflows.git.allowedRepositoryPrefixes: ["https://github.com/koorikla/", "https://git.example.com:8443/team/apps/"]
    asserts:
      - equal:
          path: spec.parameters.openAPIV3Schema.properties.repository.properties.url.pattern
          value: '^(https://github\.com/koorikla/|https://git\.example\.com:8443/team/apps/)[A-Za-z0-9][A-Za-z0-9._-]*$'
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: git-allowed-prefixes, value: "https://github.com/koorikla/ https://git.example.com:8443/team/apps/" } }

  - it: rejects an allowlist prefix that is not https://<host>/<owner>/
    template: templates/helm-chart-workflow.yaml
    set: { buildWorkflows.git.allowedRepositoryPrefixes: ["https://github.com/"] }
    asserts:
      - failedTemplate: { errorPattern: "must be https://<host>/<owner>/" }

  - it: rejects a prefix without the closing slash (would also match koorikla-evil)
    template: templates/helm-chart-workflow.yaml
    set: { buildWorkflows.git.allowedRepositoryPrefixes: ["https://github.com/koorikla"] }
    asserts:
      - failedTemplate: { errorPattern: "ending in /" }

  - it: rejects a non-https prefix
    template: templates/helm-chart-workflow.yaml
    set: { buildWorkflows.git.allowedRepositoryPrefixes: ["http://github.com/koorikla/"] }
    asserts:
      - failedTemplate: { errorPattern: "must be https://" }

  - it: gitops writes only deploy/openchoreo/<name>.yaml, refs and paths cannot inject options or traverse
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: nextjs }
    asserts:
      - equal: { path: spec.parameters.openAPIV3Schema.properties.gitops.properties.workloadPath.pattern, value: '^deploy/openchoreo/[A-Za-z0-9][A-Za-z0-9._-]*\.yaml$' }
      - equal: { path: spec.parameters.openAPIV3Schema.properties.repository.properties.revision.properties.branch.pattern, value: '^[A-Za-z0-9_][A-Za-z0-9._/-]*$' }
      - equal: { path: spec.parameters.openAPIV3Schema.properties.repository.properties.revision.properties.commit.pattern, value: '^([0-9a-f]{7,40})?$' }
      - exists: { path: spec.parameters.openAPIV3Schema.properties.docker.properties.context.pattern }
      - exists: { path: spec.parameters.openAPIV3Schema.properties.docker.properties.filePath.pattern }
      - exists: { path: spec.parameters.openAPIV3Schema.properties.repository.properties.appPath.pattern }

  - it: signatures stay out of the public Rekor log unless the installation opts in
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    asserts:
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: tlog-upload, value: "false" } }

  - it: transparencyLog true uploads to Rekor (both workflow kinds)
    template: templates/helm-chart-workflow.yaml
    set: { buildWorkflows.signing.transparencyLog: true }
    asserts:
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: tlog-upload, value: "true" } }

  - it: dockerfile has no language checks, elixir offers the PostgreSQL sidecar
    template: templates/build-workflows.yaml
    asserts:
      - notExists: { path: spec.parameters.openAPIV3Schema.properties.checks }
        documentSelector: { path: metadata.name, value: dockerfile }
      - equal: { path: spec.parameters.openAPIV3Schema.properties.checks.properties.postgres.default, value: false }
        documentSelector: { path: metadata.name, value: elixir }

  - it: checks.image overrides must be digest references (run pods in workflows-* admit only digests, #36)
    template: templates/build-workflows.yaml
    documentSelector: { path: metadata.name, value: go }
    asserts:
      - equal:
          path: spec.parameters.openAPIV3Schema.properties.checks.properties.image.pattern
          value: "^[^@\\s]+@sha256:[0-9a-f]{64}$"
      - matchRegex:
          path: spec.parameters.openAPIV3Schema.properties.checks.properties.image.default
          pattern: "@sha256:[0-9a-f]{64}$"

  - it: rejects a stack default checkImage without a digest
    template: templates/build-workflows.yaml
    set:
      buildWorkflows.stacks:
        - { name: go, displayName: Go, description: d, stack: go, checkImage: "docker.io/library/golang:1.27.4-trixie", checkSetup: "", checkEnv: {} }
    asserts:
      - failedTemplate:
          errorPattern: 'buildWorkflows.stacks\[go\].checkImage "docker.io/library/golang:1.27.4-trixie" must be pinned by digest'

  - it: component types allow exactly the build workflows
    template: templates/upstream-defaults.yaml
    documentSelector: { path: metadata.name, value: service }
    asserts:
      - equal:
          path: spec.allowedWorkflows
          value:
            - { kind: ClusterWorkflow, name: go }
            - { kind: ClusterWorkflow, name: nextjs }
            - { kind: ClusterWorkflow, name: elixir }
            - { kind: ClusterWorkflow, name: ruby }
            - { kind: ClusterWorkflow, name: dockerfile }

  - it: component types allow the observability-alert-rule trait and ship the ClusterTrait
    template: templates/upstream-defaults.yaml
    asserts:
      - contains:
          path: spec.allowedTraits
          content: { kind: ClusterTrait, name: observability-alert-rule }
        documentSelector: { path: metadata.name, value: service }
      - contains:
          path: spec.allowedTraits
          content: { kind: ClusterTrait, name: observability-alert-rule }
        documentSelector: { path: metadata.name, value: web-application }
      - contains:
          path: spec.allowedTraits
          content: { kind: ClusterTrait, name: observability-alert-rule }
        documentSelector: { path: metadata.name, value: worker }
      - isEmpty: { path: spec.allowedTraits }
        documentSelector: { path: metadata.name, value: scheduled-task }
      - isKind: { of: ClusterTrait }
        documentSelector: { path: metadata.name, value: observability-alert-rule }
      - equal:
          path: spec.creates[0].targetPlane
          value: observabilityplane
        documentSelector: { path: metadata.name, value: observability-alert-rule }
      - equal:
          path: spec.creates[0].template.kind
          value: ObservabilityAlertRule
        documentSelector: { path: metadata.name, value: observability-alert-rule }

  - it: helm-chart is a generic workflow pushing to <registry>/charts
    template: templates/helm-chart-workflow.yaml
    asserts:
      - notExists: { path: 'metadata.labels["openchoreo.dev/workflow-type"]' }
      - contains: { path: spec.runTemplate.spec.arguments.parameters, content: { name: oci-registry, value: harbor.openchoreo.localhost:9443/apps/charts } }
