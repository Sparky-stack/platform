suite: openchoreo-platform - app pods roll when their OpenBao-backed Secret rotates (#268)
# Reloader (addon reloader, VAP reloader-rollout-only) rolls a Deployment annotated secret.reloader.stakater.com/auto
# when a Secret it references (envFrom/env/volumes) changes; unrelated Secrets in the cell never roll it. Live check:
# docs/runbooks/certificates-and-secrets.md section 7.
templates:
  - templates/upstream-defaults.yaml
tests:
  - it: every Deployment component type opts its Deployment in to Reloader for referenced Secrets
    documentSelector: { path: spec.workloadType, value: deployment, matchMany: true }
    asserts:
      - equal:
          path: spec.resources[?(@.id == "deployment")].template.metadata.annotations
          value: { secret.reloader.stakater.com/auto: "true" }
      # the opt-in rolls on Secrets the pod references: the ExternalSecret target is what envFrom reads
      - equal:
          path: spec.resources[?(@.id == "secret-env-external")].template.spec.target.name
          value: ${secretEnv.resourceName}

  - it: keeps the opt-in with per-tenant secret stores (cells read OpenBao through SecretStore openbao-tenant)
    documentSelector: { path: metadata.name, value: service }
    set:
      secrets.tenantStores.enabled: true
    asserts:
      - equal:
          path: spec.resources[?(@.id == "deployment")].template.metadata.annotations
          value: { secret.reloader.stakater.com/auto: "true" }
      - equal:
          path: spec.resources[?(@.id == "secret-env-external")].template.spec.secretStoreRef.kind
          value: SecretStore

  - it: does not annotate the CronJob type (Jobs read the Secret at start; Reloader ignores jobs and cronjobs)
    documentSelector: { path: metadata.name, value: scheduled-task }
    asserts:
      - notExists:
          path: spec.resources[0].template.metadata.annotations
