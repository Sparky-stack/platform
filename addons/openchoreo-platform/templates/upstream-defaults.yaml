{{- /* OpenChoreo ClusterComponentTypes, ClusterTraits and ClusterProjectType from files/ (files/README.md). The component
types are platform-owned files with the platform changes written in, so the object in Git is the object applied. */ -}}
{{- range $path, $_ := .Files.Glob "files/*/*.yaml" }}
---
# Source: {{ $.Chart.Name }}/{{ $path }}
{{- $obj := $.Files.Get $path | fromYaml }}
{{- include "platform.skipDryRun" $obj }}
{{- if eq $obj.kind "ClusterComponentType" }}
{{- /* Guard: allowedWorkflows is written out in the files; it must name exactly the per-stack ClusterWorkflows of
templates/build-workflows.yaml, so a stack added to buildWorkflows.stacks fails here until the files list it. */ -}}
{{- if $.Values.buildWorkflows.enabled }}
{{- $workflows := list }}
{{- range $.Values.buildWorkflows.stacks }}{{ $workflows = append $workflows (dict "kind" "ClusterWorkflow" "name" .name) }}{{ end }}
{{- if ne (toJson $workflows) (toJson $obj.spec.allowedWorkflows) }}
{{- fail (printf "%s: spec.allowedWorkflows must list the ClusterWorkflows of buildWorkflows.stacks, in order: %s" $path (toJson $workflows)) }}
{{- end }}
{{- end }}
{{- /* The one installation toggle (secrets.tenantStores.enabled, set by installations/local): component ExternalSecrets
use the cell namespace's own SecretStore instead of the data plane's ClusterSecretStore (addon secret-stores). */ -}}
{{- if $.Values.secrets.tenantStores.enabled }}
{{- range $r := $obj.spec.resources }}
{{- if and $r.template (eq (toString $r.template.kind) "ExternalSecret") }}
{{- $_ := set $r.template.spec "secretStoreRef" (dict "kind" "SecretStore" "name" $.Values.tenantStoreName) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{ toYaml $obj }}
{{- end }}
