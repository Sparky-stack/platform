{{- /* Upstream OpenChoreo 1.3.3 ClusterComponentTypes, ClusterTraits and ClusterProjectType from files/ (cluster-scoped,
mgmt). Verbatim (files/README.md) except the ClusterComponentType edits below, so an upstream bump stays a file copy. */ -}}
{{- if .Values.upstreamDefaults.enabled }}
{{- range $path, $_ := .Files.Glob "files/*/*.yaml" }}
---
# Source: {{ $.Chart.Name }}/{{ $path }}
{{- $obj := $.Files.Get $path | fromYaml }}
{{- $_ := set $obj.metadata "annotations" (merge (default dict $obj.metadata.annotations) (dict "argocd.argoproj.io/sync-options" "SkipDryRunOnMissingResource=true")) }}
{{- if eq $obj.kind "ClusterComponentType" }}
{{- $deployment := eq (toString $obj.spec.workloadType) "deployment" }}
{{- /* Components may build with the platform's per-stack ClusterWorkflows (templates/build-workflows.yaml). */ -}}
{{- if $.Values.buildWorkflows.enabled }}
{{- $wf := list }}
{{- range $.Values.buildWorkflows.stacks }}{{ $wf = append $wf (dict "kind" "ClusterWorkflow" "name" .name) }}{{ end }}
{{- $_ := set $obj.spec "allowedWorkflows" $wf }}
{{- end }}
{{- /* Platform trait keda-scaler (templates/platform-types.yaml, #70) on the Deployment-based component types. */ -}}
{{- if and $.Values.dataServices.enabled $deployment }}
{{- $_ := set $obj.spec "allowedTraits" (append (default list $obj.spec.allowedTraits) (dict "kind" "ClusterTrait" "name" "keda-scaler")) }}
{{- end }}
{{- /* Resilience defaults (#251, files/platform/cluster-traits/resilience.yaml): every Deployment component type embeds
ClusterTrait resilience, so developers get spread, PDB, graceful shutdown and priority without attaching anything.
Its knobs are component type environmentConfigs (`resilience.*` in a ReleaseBinding's componentTypeEnvironmentConfigs);
the trait reads the component type's replicas to decide on a PodDisruptionBudget. */ -}}
{{- if and $.Values.resilience.enabled $deployment }}
{{- $knobs := dict "zoneSpread" (dict "type" "string" "enum" (list "ScheduleAnyway" "DoNotSchedule") "default" "ScheduleAnyway")
      "nodePool" (dict "type" "string" "default" "")
      "terminationGracePeriodSeconds" (dict "type" "integer" "default" 30 "minimum" 1)
      "preStopSleepSeconds" (dict "type" "integer" "default" 5 "minimum" 0) }}
{{- $_ := set $obj.spec.environmentConfigs.openAPIV3Schema.properties "resilience" (dict "type" "object" "default" dict "properties" $knobs) }}
{{- $bind := dict "replicas" "${environmentConfigs.replicas}" }}
{{- range $k, $v := $knobs }}{{ $_ := set $bind $k (printf "${environmentConfigs.resilience.%s}" $k) }}{{ end }}
{{- $_ := set $obj.spec "traits" (append (default list $obj.spec.traits) (dict "kind" "ClusterTrait" "name" "resilience" "instanceName" "resilience" "environmentConfigs" $bind)) }}
{{- end }}
{{- /* Per-tenant secret stores (installation.yaml secrets.tenantStores.enabled, #96): the ExternalSecrets component
types render for SecretReferences use the cell namespace's own SecretStore instead of the data plane's
ClusterSecretStore (which then refuses tenant namespaces; addon secret-stores). Developers never name a store. */ -}}
{{- if $.Values.secrets.tenantStores.enabled }}
{{- range $r := $obj.spec.resources }}
{{- if and $r.template (eq (toString $r.template.kind) "ExternalSecret") }}
{{- $_ := set $r.template.spec "secretStoreRef" (dict "kind" "SecretStore" "name" $.Values.tenantStoreName) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{ toYaml $obj }}
{{- end }}
{{- end }}
