{{- /* Platform-owned OpenChoreo types (files/platform/). ClusterTrait resilience (#251, docs/openchoreo.md "Resilience
defaults") is embedded in the Deployment component types by templates/upstream-defaults.yaml (resilience.enabled).
The data-service types (#70, docs/data-services.md, dataServices.enabled): ClusterTrait keda-scaler and
ClusterResourceType postgresql. Each needs operators on the data plane
(platform.koorikla.io/requires-addons): keda-scaler checks dataplane.annotations itself, postgresql bindings are checked
at admission (addon kyverno-policies platform-data-plane-capabilities). Cluster-scoped. */ -}}
{{- range $path, $_ := .Files.Glob "files/platform/*/*.yaml" }}
{{- $enabled := $.Values.dataServices.enabled }}
{{- if eq (base $path) "resilience.yaml" }}{{ $enabled = $.Values.resilience.enabled }}{{ end }}
{{- if $enabled }}
---
# Source: {{ $.Chart.Name }}/{{ $path }}
{{- $obj := $.Files.Get $path | fromYaml }}
{{- $_ := set $obj.metadata "annotations" (merge (default dict $obj.metadata.annotations) (dict "argocd.argoproj.io/sync-options" "SkipDryRunOnMissingResource=true")) }}
{{ toYaml $obj }}
{{- end }}
{{- end }}
