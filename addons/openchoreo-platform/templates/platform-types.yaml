{{- /* Platform-owned OpenChoreo types from files/platform/ (docs/data-services.md, docs/openchoreo.md): resilience is
always on (the Deployment component types embed it), metrics has its own switch, every other file (data-service types)
follows dataServices.enabled. */ -}}
{{- $switchByFile := dict "resilience.yaml" true "metrics.yaml" .Values.appMetrics.enabled }}
{{- range $path, $_ := .Files.Glob "files/platform/*/*.yaml" }}
{{- $enabled := $.Values.dataServices.enabled }}
{{- if hasKey $switchByFile (base $path) }}{{ $enabled = get $switchByFile (base $path) }}{{ end }}
{{- if $enabled }}
---
# Source: {{ $.Chart.Name }}/{{ $path }}
{{- $obj := $.Files.Get $path | fromYaml }}
{{- include "platform.skipDryRun" $obj }}
{{ toYaml $obj }}
{{- end }}
{{- end }}
