{{- /*
Generic ClusterWorkflow `helm-chart` (cluster-scoped, mgmt; no component, run it with a WorkflowRun): lint, unit-test,
package, push to <registry>/charts/<chart> (OCI) and cosign-sign with the platform key (Argo template koorikla-helm-chart).
*/ -}}
{{- if .Values.helmChartWorkflow.enabled }}
{{- $b := .Values.buildWorkflows }}
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterWorkflow
metadata:
  name: {{ .Values.helmChartWorkflow.name }}
  labels:
    app.kubernetes.io/part-of: openchoreo
  annotations:
    openchoreo.dev/display-name: Helm chart (OCI)
    openchoreo.dev/description: Lint, unit-test, package, push and sign a Helm chart as an OCI artifact
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  workflowPlaneRef:
    kind: ClusterWorkflowPlane
    name: {{ $b.workflowPlane }}
  ttlAfterCompletion: {{ $b.ttlAfterCompletion | quote }}
  parameters:
    openAPIV3Schema:
      type: object
      required: [repository]
      properties:
        repository:
          type: object
          required: [url]
          properties:
            url:
              type: string
              description: {{ printf "Git repository URL, under %s" (include "build.gitPrefixes" .) | quote }}
              pattern: {{ include "build.repoUrlPattern" . | toJson }}
            revision:
              type: object
              default: {}
              properties:
                branch: { type: string, default: main, pattern: "^[A-Za-z0-9_][A-Za-z0-9._/-]*$" }
                commit: { type: string, default: "", pattern: "^([0-9a-f]{7,40})?$" }
        chart:
          type: object
          default: {}
          properties:
            path: { type: string, default: ".", pattern: {{ include "build.relPathPattern" . | toJson }}, description: Chart directory relative to the repository root }
            version: { type: string, default: "", description: Version override (default Chart.yaml) }
            push: { type: boolean, default: true }
  runTemplate:
    apiVersion: argoproj.io/v1alpha1
    kind: Workflow
    metadata:
      name: ${metadata.workflowRunName}
      namespace: ${metadata.namespace}
    spec:
      serviceAccountName: workflow-sa
      automountServiceAccountToken: false     # token only in Argo's executor containers (koorikla-build header)
      executor:
        serviceAccountName: workflow-sa
      workflowTemplateRef:
        name: {{ .Values.helmChartWorkflow.workflowTemplate }}
        clusterScope: true
      arguments:
        parameters:
          - { name: workflowrun-name, value: "${metadata.workflowRunName}" }
          - { name: git-repo, value: "${parameters.repository.url}" }
          - { name: git-allowed-prefixes, value: {{ include "build.gitPrefixes" . | quote }} }
          - { name: branch, value: "${parameters.repository.revision.branch}" }
          - { name: commit, value: "${parameters.repository.revision.commit}" }
          - { name: chart-path, value: "${parameters.chart.path}" }
          - { name: chart-version, value: "${parameters.chart.version}" }
          - { name: push, value: "${parameters.chart.push}" }
          - { name: oci-registry, value: {{ printf "%s/charts" (include "build.repoPrefix" .) | quote }} }
          - { name: registry-host, value: {{ include "build.registryHost" . | quote }} }
          - { name: git-secret, value: "${metadata.workflowRunName}-git" }
          - { name: registry-secret, value: "${metadata.workflowRunName}-registry" }
          - { name: registry-ca-secret, value: "${metadata.workflowRunName}-registry-ca" }
          - { name: cosign-secret, value: "${metadata.workflowRunName}-cosign" }
          - { name: tlog-upload, value: {{ $b.signing.transparencyLog | toString | quote }} }
  resources:
    {{- include "build.resources" (dict "root" . "permissions" $b.github.readPermissions) | nindent 4 }}
{{- end }}
