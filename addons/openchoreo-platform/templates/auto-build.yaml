{{- /*
Auto-build trigger (values.yaml autoBuild, docs/build-plane.md "Auto-build") in the run namespace workflows-<org ns> of
the mgmt workflow plane: WorkflowTemplate auto-build (one reconcile pass of files/auto-build/auto_build.py; the
argo-events Sensor starts it for webhook pushes) + CronWorkflow auto-build-poll (poll: pollSchedule, webhook: resyncSchedule).
The pass reads GitHub with a short-lived installation token (ESO GithubAccessToken generator, no PAT). PR previews
(previews.enabled) add a second token, preview RBAC and, for trigger webhook, CronWorkflow auto-build-previews (PR
pushes reach the webhook before Argo CD generated the preview Application). registry.type harbor adds a pull-only robot
+ CA for the "already built" check (a pinned digest missing in Harbor, e.g. after a clean bootstrap, rebuilds; #200).
Egress: the namespace's default-deny NetworkPolicy (addon openchoreo-workflow-plane): DNS, API server, Harbor, public 443.
*/ -}}
{{- $trigger := toString .Values.openchoreo.workflowPlane.autoBuild }}
{{- /* Off without the platform GitHub App in the store (secrets.githubGateApp.enabled): every pass needs its token. */ -}}
{{- if and (ne $trigger "none") .Values.openchoreo.workflowPlane.enabled .Values.buildWorkflows.enabled .Values.secrets.githubGateApp.enabled }}
{{- $a := .Values.autoBuild }}
{{- $org := .Values.openchoreo.orgNamespace }}
{{- $ns := printf "workflows-%s" $org }}
{{- $name := $a.workflowTemplate }}
{{- $script := .Files.Get "files/auto-build/auto_build.py" }}
{{- if contains "{{" $script }}{{ fail "files/auto-build/auto_build.py must not contain '{{' (Argo templating)" }}{{ end }}
{{- $schedule := ternary $a.pollSchedule $a.resyncSchedule (eq $trigger "poll") }}
{{- $pv := .Values.previews }}
{{- $pa := $a.previews }}
{{- $harbor := eq (toString .Values.registry.type) "harbor" }}
{{- $hs := .Values.buildWorkflows.secrets.harbor }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-auto-build
  namespace: {{ $org }}
rules:
  - apiGroups: [openchoreo.dev]
    resources: [components]
    verbs: [list]
  - apiGroups: [openchoreo.dev]
    resources: [workflows]
    verbs: [get]
  - apiGroups: [openchoreo.dev]
    resources: [workflowruns]
    verbs: [get, list, create]
  {{- if $pv.enabled }}
  # PR previews: read the preview's Component and Environment, cut its ComponentRelease, and annotate the binding once
  # per release (OpenChoreo 1.3.3 does not requeue a binding whose release appears later)
  - apiGroups: [openchoreo.dev]
    resources: [components, environments]
    verbs: [get]
  - apiGroups: [openchoreo.dev]
    resources: [releasebindings]
    verbs: [get, patch]
  - apiGroups: [openchoreo.dev]
    resources: [componentreleases]
    verbs: [get, create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-auto-build
  namespace: {{ $org }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-auto-build
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-auto-build
rules:
  - apiGroups: [openchoreo.dev]
    resources: [clusterworkflows]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-auto-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-auto-build
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-auto-build
  namespace: {{ $ns }}
rules:
  # The cache ConfigMap: create cannot be limited by name, read/write is.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $a.stateConfigMap }}]
    verbs: [get, update]
  # Argo's executor (init/wait) reports step results with the pod's token.
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
  {{- if $pv.enabled }}
  # PR previews: the image the build step of a preview run reported (its Argo Workflow outputs)
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-auto-build
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-auto-build
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-github-app
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $a.secretStore }}
  target:
    name: {{ $name }}-github-app
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: app-id
      remoteRef: { key: {{ $a.github.key }}, property: githubAppID }
    - secretKey: installation-id
      remoteRef: { key: {{ $a.github.key }}, property: githubAppInstallationID }
    - secretKey: private-key
      remoteRef: { key: {{ $a.github.key }}, property: githubAppPrivateKey }
---
{{ include "autoBuild.githubToken" (dict "name" $name "token" (printf "%s-github-token" $name) "root" $
     "permissions" $a.github.permissions) }}
{{- if $harbor }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-registry
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $a.secretStore }}
  target:
    name: {{ $name }}-registry
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      data:
        username: {{ $a.registry.robot | quote }}
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef: { key: {{ $a.registry.key }}, property: {{ $a.registry.property }} }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-registry-ca
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $hs.caStore }}
  target:
    name: {{ $name }}-registry-ca
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: ca.crt
      remoteRef: { key: {{ $hs.caSecret }}, property: ca.crt }
{{- end }}
{{- if $pv.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-auto-build-previews
  namespace: {{ $pa.argocdNamespace }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-auto-build-previews
  namespace: {{ $pa.argocdNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-auto-build-previews
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
{{ include "autoBuild.githubToken" (dict "name" (printf "%s-previews" $name) "token" (printf "%s-previews-token" $name) "root" $
     "permissions" $pa.github.permissions) }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entrypoint: reconcile
  serviceAccountName: {{ $name }}
  arguments:
    parameters:
      - name: repository              # webhook: the pushed repository's clone URL; empty = every opted-in Component
        value: ""
  activeDeadlineSeconds: 300
  # One pass at a time across poll, resync and webhook runs (WorkflowRun creation is idempotent anyway).
  synchronization:
    mutexes:
      - name: {{ $name }}
  podGC:
    strategy: OnPodSuccess
  ttlStrategy:
    secondsAfterSuccess: 600
    secondsAfterFailure: 86400
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: github-token
      secret:
        secretName: {{ $name }}-github-token
        defaultMode: 288              # 0440: group 65532 (fsGroup)
    {{- if $pv.enabled }}
    - name: previews-token
      secret:
        secretName: {{ $name }}-previews-token
        defaultMode: 288
    {{- end }}
    {{- if $harbor }}
    - name: registry
      secret:
        secretName: {{ $name }}-registry
        defaultMode: 288
    - name: registry-ca
      secret:
        secretName: {{ $name }}-registry-ca
        defaultMode: 292              # 0444: public cert
    {{- end }}
  templates:
    - name: reconcile
      script:
        image: {{ $a.image }}
        command: [python3]
        resources: {{- toYaml $a.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
          - { name: github-token, mountPath: /var/run/secrets/auto-build, readOnly: true }
          {{- if $pv.enabled }}
          - { name: previews-token, mountPath: /var/run/secrets/auto-build-previews, readOnly: true }
          {{- end }}
          {{- if $harbor }}
          - { name: registry, mountPath: /var/run/secrets/auto-build-registry, readOnly: true }
          - { name: registry-ca, mountPath: /var/run/secrets/auto-build-registry-ca, readOnly: true }
          {{- end }}
        env:
          - { name: ORG_NAMESPACE, value: {{ $org | quote }} }
          - { name: STATE_NAMESPACE, value: {{ $ns | quote }} }
          - { name: STATE_CONFIGMAP, value: {{ $a.stateConfigMap | quote }} }
          - { name: TOKEN_FILE, value: /var/run/secrets/auto-build/token }
          - { name: ALLOWED_PREFIXES, value: {{ include "build.gitPrefixes" . | quote }} }
          - { name: MAX_RUNS, value: {{ $a.maxRunsPerPass | toString | quote }} }
          - { name: STALE_SECONDS, value: {{ $a.staleRunSeconds | toString | quote }} }
          - { name: MIN_RATE_REMAINING, value: {{ $a.minRateRemaining | toString | quote }} }
          {{- if $harbor }}
          # registry-aware "already built": a Workload pinning a digest this registry does not have is rebuilt (#200)
          - { name: REGISTRY_HOST, value: {{ include "build.registryHost" . | quote }} }
          - { name: REGISTRY_AUTH_DIR, value: /var/run/secrets/auto-build-registry }
          - { name: REGISTRY_CA_FILE, value: /var/run/secrets/auto-build-registry-ca/ca.crt }
          {{- end }}
          {{- if $pv.enabled }}
          # PR previews (docs/preview-environments.md); the opt-in == charts/tenant previewOptIn
          - { name: PREVIEWS, value: "true" }
          - { name: PREVIEW_TOKEN_FILE, value: /var/run/secrets/auto-build-previews/token }
          - { name: PREVIEW_OPT_IN_ANNOTATION, value: {{ $pa.optIn.annotation | quote }} }
          - { name: PREVIEW_OPT_IN_VALUE, value: {{ $pa.optIn.value | quote }} }
          - { name: PREVIEW_EXPIRED_LABEL, value: {{ $pv.expiredLabel | default "preview-expired" | quote }} }
          - { name: PREVIEW_TTL, value: {{ $pv.ttl | default "48h" | quote }} }
          - { name: PREVIEW_STATUS_CONTEXT, value: {{ $pa.statusContext | quote }} }
          - { name: ARGOCD_NAMESPACE, value: {{ $pa.argocdNamespace | quote }} }
          {{- end }}
          # Webhook input reaches the script only as an env value, never as code.
          - { name: REPOSITORY, value: {{ `"{{workflow.parameters.repository}}"` }} }
        source: |
          {{- $script | nindent 10 }}
{{- /* concurrencyPolicy Forbid: a slow pass is never overlapped by the next tick. */ -}}
{{- $crons := list }}
{{- if $schedule }}{{ $crons = append $crons (dict "suffix" "poll" "schedule" $schedule "trigger" $trigger) }}{{ end }}
{{- if and $pv.enabled (eq $trigger "webhook") $pa.schedule }}{{ $crons = append $crons (dict "suffix" "previews" "schedule" $pa.schedule "trigger" "previews") }}{{ end }}
{{- range $crons }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: {{ $name }}-{{ .suffix }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schedules: [{{ .schedule | quote }}]
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  workflowMetadata:
    labels:
      platform.koorikla.io/trigger: {{ .trigger }}
  workflowSpec:
    workflowTemplateRef:
      name: {{ $name }}
{{- end }}
{{- end }}

{{- /* An installation token of the platform GitHub App for the reconcile pass: ESO GithubAccessToken generator <name>
(scoped to `permissions`) + ExternalSecret <token> that re-mints it every autoBuild.github.tokenRefreshInterval. */ -}}
{{- define "autoBuild.githubToken" -}}
{{- $a := .root.Values.autoBuild }}
{{- $ns := printf "workflows-%s" .root.Values.openchoreo.orgNamespace }}
{{- $app := printf "%s-github-app" $a.workflowTemplate -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  appIDRef: { name: {{ $app }}, key: app-id }
  installIDRef: { name: {{ $app }}, key: installation-id }
  permissions: {{- toYaml .permissions | nindent 4 }}
  auth:
    privateKey:
      secretRef: { name: {{ $app }}, key: private-key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .token }}
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $a.github.tokenRefreshInterval }}
  target:
    name: {{ .token }}
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: {{ .name }}
{{- end }}
