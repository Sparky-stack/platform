{{- /*
GitHub App credentials of in-cluster builds in the run namespace workflows-<org ns> (mgmt workflow plane, docs/build-plane.md
"Git credentials"): ExternalSecret <appSecret> (read only by ESO, no pod mounts it) and RBAC that lets OpenChoreo's
workflow-plane agent apply each run's `<run>-git` GithubAccessToken generator (templates/_build.tpl build.resources).
*/ -}}
{{- if and .Values.openchoreo.workflowPlane.enabled .Values.buildWorkflows.enabled }}
{{- $g := .Values.buildWorkflows.github }}
{{- $ns := printf "workflows-%s" .Values.openchoreo.orgNamespace }}
{{- $key := required "buildWorkflows.github.key (store key of the platform GitHub App) is required" $g.key }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $g.appSecret }}
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $g.secretStore }}
  target:
    name: {{ $g.appSecret }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: app-id
      remoteRef: { key: {{ $key }}, property: githubAppID }
    - secretKey: installation-id
      remoteRef: { key: {{ $key }}, property: githubAppInstallationID }
    - secretKey: private-key
      remoteRef: { key: {{ $key }}, property: githubAppPrivateKey }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-github-tokens
  namespace: {{ $ns }}
rules:
  - apiGroups: [generators.external-secrets.io]
    resources: [githubaccesstokens]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-github-tokens
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-github-tokens
subjects:
  - kind: ServiceAccount
    name: {{ $g.agent.serviceAccount }}
    namespace: {{ $g.agent.namespace }}
{{- end }}
