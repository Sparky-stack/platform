# Istio 1.32.0 ambient mesh (catalog: namespace istio-system, roles [workload], default true). docs/networking.md.
# Sidecar-free mTLS via ztunnel + istio-cni; works on both cluster CNIs:
#   cni: cilium  (default) -> istio-cni uses the standard /etc/cni/net.d + /opt/cni/bin (k3s with flannel-backend=none)
#   cni: flannel           -> values/cni-flannel.yaml switches to k3s' own CNI dirs (global.platform: k3s)
# North-south Gateway API (GatewayClass kgateway) stays on kgateway; Istio adds only ambient + optional waypoints.
# Gateway API CRDs come from addons/gateway-api-crds; the Istio charts never install them.
# Namespaces join the mesh by label istio.io/dataplane-mode=ambient (OpenChoreo cell namespaces: kyverno-policies).
# Multicluster (docs/multicluster.md): the catalog sets global.multiCluster.clusterName = cluster name on every cluster,
# and on mesh members only (labels from the fleet file's mesh.group) global.meshID, global.network and the istiod env
# AMBIENT_ENABLE_MULTI_NETWORK / AMBIENT_ENABLE_BAGGAGE. Mesh members also get values/mesh-member.yaml (layered by the
# ApplicationSet): istiod's CA off, istiod/ztunnel use istio-csr (addon istio-csr -> OpenBao on mgmt), istiod waits
# for its istio-csr-issued serving cert. No CA key on any workload cluster.
# Non-members keep network "" on istiod and ztunnel alike (a mismatch would route local traffic to a gateway).

# Images: full references pinned by multi-arch index digest (docs/conventions.md invariant 9). The Istio charts use an
# `image` containing "/" verbatim (hub, tag and variant are then ignored): bump the version and digest together.
global:
  # -- Istio namespace (`global.{multiCluster.clusterName,meshID,network}` are populated from cluster labels; `global.platform` is `k3s` in `values/cni-flannel.yaml` and `gke` in `values/provider-gcp-gke.yaml`).
  istioNamespace: istio-system
  proxy:
    # waypoint proxies istiod injects (optional in ambient; rendered into the injector config, not a pod spec)
    image: docker.io/istio/proxyv2:1.32.0-distroless@sha256:9cd1f1cc261f3fe250ab483543e7256c39d5871eae5f1817c0809eff09e365d4   # index: amd64, arm64

base: {}

istiod:
  # -- `ambient` profile (with `cni.profile` and `ztunnel.profile`, distroless `1.32.0` images pinned by multi-arch index digest; `istiod.env.ENABLE_CA_SERVER` is `"false"` in `values/mesh-member.yaml`).
  profile: ambient
  image: docker.io/istio/pilot:1.32.0-distroless@sha256:219ab7efcf1fd1f883086ad4a4a649c0e70bee3200423d6eef9f435103a79423   # index: amd64, arm64
  # PILOT_ENABLE_REMOTE_CREDENTIALS_CONTROLLER is deliberately NOT set: "false" crashes istiod 1.32.0 as soon as it
  # has a remote secret (nil *CredentialsController.HasSynced in multicluster.Cluster.Run, SIGSEGV seen live). Fixed
  # upstream on master by istio/istio#62295, not in any release yet: set it once on a 1.32 backport or 1.33.
  # Consequence for the peers' reader RBAC: docs/multicluster.md "Reader RBAC" (addon istio-eastwest reader.*).
  pilot:
    autoscaleEnabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

cni:
  profile: ambient
  image: docker.io/istio/install-cni:1.32.0-distroless@sha256:bf8fa30fe56fc7209941af23999f1463071b9885c22ec81f5998645718698787   # index: amd64, arm64
  cni:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

ztunnel:
  profile: ambient
  image: docker.io/istio/ztunnel:1.32.0-distroless@sha256:953a77fc17379301de4b7c6697b1668471c9c1f6ff912c9c5b78f454ab362180   # index: amd64, arm64
  # Roll ztunnel only after istiod is Healthy (Argo CD sync wave, on the DaemonSet's metadata). On a mesh member that
  # means istiod already serves with its istio-csr-issued cert, so the new ztunnel pods fetch workload certificates
  # from istio-csr (group root in OpenBao) - no manual restart when a running cluster joins (docs/multicluster.md). Joining/leaving a group
  # also changes the pod annotation mesh.platform.koorikla.io/group (catalog clusterLabelParameters), so that rollout
  # always happens, even if nothing else in the pod template changed.
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  podAnnotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
