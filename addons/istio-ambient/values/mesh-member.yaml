# Mesh members only: the addon ApplicationSets layer values/mesh-member.yaml on clusters labelled
# mesh.platform.koorikla.io/group (fleet file mesh.group; docs/multicluster.md "Mesh CA (OpenBao)").
# istiod is no CA here: istio-csr (addon istio-csr) answers ztunnel's/gateways' CSRs and gets them signed by the mesh CA
# in OpenBao on mgmt. No CA key exists on this cluster (AGENTS.md invariant 4).
istiod:
  env:
    ENABLE_CA_SERVER: "false"
  global:
    caAddress: cert-manager-istio-csr.istio-system.svc:443   # proxies generated by istiod (east-west gateway, waypoints)
  # Fail closed: istiod decides at start whether it has serving certs - started without them it serves no xDS TLS on
  # :15012 ("The secure discovery service is disabled") until restarted, and ztunnel never gets Ready. These two
  # non-optional mounts keep the pod in ContainerCreating until istio-csr has issued istiod's certificate and published
  # the pinned root (ConfigMap istio-ca-root-cert); ztunnel (sync wave 1) waits for istiod to be Healthy. istiod reads
  # the certificate from the gate mount itself (extraContainerArgs): the chart's own mount of Secret istiod-tls
  # (/var/run/secrets/istiod/tls) is *optional*, so kubelet may set it up empty before the Secret exists and fill it only
  # after the container started (seen on a clean bootstrap, #192).
  extraContainerArgs:
    - --tlsCertFile=/var/run/secrets/platform/istiod-tls-gate/tls.crt
    - --tlsKeyFile=/var/run/secrets/platform/istiod-tls-gate/tls.key
    - --caCertFile=/var/run/secrets/platform/istiod-tls-gate/ca.crt
  volumes:
    - name: istiod-tls-gate
      secret: { secretName: istiod-tls }
    - name: root-cert-gate
      configMap: { name: istio-ca-root-cert }
  volumeMounts:
    - { name: istiod-tls-gate, mountPath: /var/run/secrets/platform/istiod-tls-gate, readOnly: true }
    - { name: root-cert-gate, mountPath: /var/run/secrets/platform/root-cert-gate, readOnly: true }

ztunnel:
  caAddress: cert-manager-istio-csr.istio-system.svc:443
