apiVersion: v2
name: istio-ambient
description: Istio Ambient mesh (base + istiod + cni + ztunnel) for k3s workload clusters with Cilium CNI
type: application
version: 0.1.0
# Upstream's OCI charts (ghcr.io/istio/release/charts, published since 1.31; the GCS bucket and gcr.io stop at 1.30.x
# and go away on 2026-12-16). OCI needs no `helm repo add` / index download; the tarballs are byte-identical to
# https://blob.istio.io/istio-release/charts. Helm cannot pin a dependency by digest, so hack/deps.sh checks every
# vendored tarball against the sha256 below (= its OCI layer digest); bump them with the versions.
appVersion: "1.32.0"
dependencies:
  - name: base
    version: 1.32.0
    repository: oci://ghcr.io/istio/release/charts
  - name: istiod
    version: 1.32.0
    repository: oci://ghcr.io/istio/release/charts
  - name: cni
    version: 1.32.0
    repository: oci://ghcr.io/istio/release/charts
  - name: ztunnel
    version: 1.32.0
    repository: oci://ghcr.io/istio/release/charts
annotations:
  platform.koorikla.io/dependency-digests: |
    base-1.32.0.tgz sha256:505ce0d9b6cf5d73a9998728fdf0821510a237470567e6c332164937c6850f05
    istiod-1.32.0.tgz sha256:17d275e3661e2e943a1ab630386bacab0cda76ea007978351a3a10fe9f4050d4
    cni-1.32.0.tgz sha256:8fa98238dd8dbf11ac1ebd00e27af9874f83ff40b54d2732c23941e251881c9a
    ztunnel-1.32.0.tgz sha256:1ee5cc123b8f13d668b79f1cb25ef052a30fad1c772e4d000607b931b5cc9d93
