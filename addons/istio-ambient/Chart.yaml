appVersion: "1.32.0"
dependencies:
  - name: base
    version: 1.32.0
    repository: https://blob.istio.io/istio-release/charts
  - name: istiod
    version: 1.32.0
    repository: https://blob.istio.io/istio-release/charts
  - name: cni
    version: 1.32.0
    repository: https://blob.istio.io/istio-release/charts
  - name: ztunnel
    version: 1.32.0
    repository: https://blob.istio.io/istio-release/charts
