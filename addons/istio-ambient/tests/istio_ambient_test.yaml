suite: istio-ambient - base CRDs + istiod + istio-cni + ztunnel (ambient), CNI dirs per cluster CNI
release:
  name: istio-ambient
  namespace: istio-system
tests:
  - it: renders the Istio ambient security CRDs from base
    template: charts/base/templates/crds.yaml
    documentSelector:
      path: metadata.name
      value: authorizationpolicies.security.istio.io
    asserts:
      - isKind:
          of: CustomResourceDefinition

  - it: installs only istio.io CRDs (Gateway API CRDs come from addons/gateway-api-crds)
    template: charts/base/templates/crds.yaml
    asserts:
      - matchRegex:
          path: spec.group
          pattern: \.istio\.io$

  - it: runs istiod with ambient enabled and small requests
    template: charts/istiod/templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: istiod
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PILOT_ENABLE_AMBIENT
            value: "true"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: runs ztunnel
    template: charts/ztunnel/templates/daemonset.yaml
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: ztunnel

  - it: enables ambient in istio-cni, enrolling by istio.io/dataplane-mode=ambient
    template: charts/cni/templates/configmap-cni.yaml
    asserts:
      - equal:
          path: data.AMBIENT_ENABLED
          value: "true"
      - matchRegex:
          path: data.AMBIENT_ENABLEMENT_SELECTOR
          pattern: "istio.io/dataplane-mode: ambient"

  - it: "cni: cilium (default) - istio-cni uses the standard CNI dirs (k3s with flannel-backend=none)"
    template: charts/cni/templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cni-bin-dir
            hostPath:
              path: /opt/cni/bin
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cni-net-dir
            hostPath:
              path: /etc/cni/net.d

  - it: "cni: flannel (values/cni-flannel.yaml) - istio-cni uses k3s' own CNI dirs"
    template: charts/cni/templates/daemonset.yaml
    values:
      - ../values/cni-flannel.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cni-bin-dir
            hostPath:
              path: /var/lib/rancher/k3s/data/cni
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cni-net-dir
            hostPath:
              path: /var/lib/rancher/k3s/agent/etc/cni/net.d

  - it: tolerates extra top-level installation.yaml keys
    template: charts/ztunnel/templates/daemonset.yaml
    set:
      installation:
        name: aws-example
      capi:
        providers:
          aws: true
    asserts:
      - isKind:
          of: DaemonSet

  # --- multicluster wiring (docs/multicluster.md): what the chart does with the catalog's label parameters ---------
  - it: "ztunnel rolls after istiod: Argo CD sync wave 1 on the DaemonSet (no imperative restart when a cluster joins)"
    template: charts/ztunnel/templates/daemonset.yaml
    asserts:
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "1" }

  - it: "istiod stays in the default wave (0), so Argo waits for it to be Healthy before ztunnel"
    template: charts/istiod/templates/deployment.yaml
    asserts:
      - notExists: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]' }

  - it: "non-member (catalog defaults: network/meshID empty, flags false) - no NETWORK on ztunnel, no meshId"
    set:
      global: { network: "", meshID: "", multiCluster: { clusterName: prod-euc1 } }
      istiod:
        env: { AMBIENT_ENABLE_MULTI_NETWORK: "false", AMBIENT_ENABLE_BAGGAGE: "false", PILOT_DISABLE_SELF_SIGNED_CA: "false" }
      ztunnel:
        podAnnotations: { mesh.platform.koorikla.io/group: "" }
    asserts:
      - notMatchRegex: { path: 'spec.template.spec.containers[0].env[*].name', pattern: '^NETWORK$' }
        template: charts/ztunnel/templates/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: ISTIO_META_CLUSTER_ID, value: prod-euc1 }
        template: charts/ztunnel/templates/daemonset.yaml
      - equal: { path: 'spec.template.metadata.annotations["mesh.platform.koorikla.io/group"]', value: "" }
        template: charts/ztunnel/templates/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AMBIENT_ENABLE_MULTI_NETWORK, value: "false" }
        template: charts/istiod/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PILOT_DISABLE_SELF_SIGNED_CA, value: "false" }
        template: charts/istiod/templates/deployment.yaml
      - notMatchRegex: { path: data.mesh, pattern: 'meshId' }
        template: charts/istiod/templates/configmap.yaml
        documentSelector: { path: metadata.name, value: istio }

  - it: "member (labels from mesh.group) - NETWORK, cluster ID, group annotation, meshId, multi-network istiod, no self-signed CA"
    set:
      global: { network: dev1, meshID: local, multiCluster: { clusterName: dev1 } }
      istiod:
        env: { AMBIENT_ENABLE_MULTI_NETWORK: "true", AMBIENT_ENABLE_BAGGAGE: "true", PILOT_DISABLE_SELF_SIGNED_CA: "true" }
      ztunnel:
        podAnnotations: { mesh.platform.koorikla.io/group: local }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: NETWORK, value: dev1 }
        template: charts/ztunnel/templates/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: ISTIO_META_CLUSTER_ID, value: dev1 }
        template: charts/ztunnel/templates/daemonset.yaml
      - equal: { path: 'spec.template.metadata.annotations["mesh.platform.koorikla.io/group"]', value: local }
        template: charts/ztunnel/templates/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AMBIENT_ENABLE_MULTI_NETWORK, value: "true" }
        template: charts/istiod/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AMBIENT_ENABLE_BAGGAGE, value: "true" }
        template: charts/istiod/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PILOT_DISABLE_SELF_SIGNED_CA, value: "true" }
        template: charts/istiod/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: CLUSTER_ID, value: dev1 }
        template: charts/istiod/templates/deployment.yaml
      - matchRegex: { path: data.mesh, pattern: 'meshId: local' }
        template: charts/istiod/templates/configmap.yaml
        documentSelector: { path: metadata.name, value: istio }

  - it: "istiod never starts Secret informers on peer clusters (peers' reader role has no Secret access)"
    template: charts/istiod/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PILOT_ENABLE_REMOTE_CREDENTIALS_CONTROLLER, value: "false" }
