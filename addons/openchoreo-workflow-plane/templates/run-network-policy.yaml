{{- /*
Default-deny egress for the run namespace (check and Dockerfile RUN steps execute tenant code): DNS, the Harbor Gateway,
the API server (Argo's executor) and the public internet only. platformWorkflows widens egress for platform pods only.
*/ -}}
{{- $np := .Values.runNetworkPolicy }}
{{- if $np.enabled }}
{{- $ns := printf "workflows-%s" .Values.openchoreo.orgNamespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: build-runs-default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if and $np.registry.enabled (eq (toString .Values.registry.type) "harbor") }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $np.registry.namespace }} } }
          podSelector: { matchLabels: {{ toJson $np.registry.podLabels }} }
      ports:
        - { protocol: TCP, port: {{ $np.registry.port }} }
    {{- end }}
    {{- range $np.apiServer }}
    - to:
        - ipBlock: { cidr: {{ .cidr }} }
      ports:
        - { protocol: TCP, port: {{ .port }} }
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson $np.internet.exceptCIDRs }}
      ports:
        {{- range $np.internet.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- $pw := $np.platformWorkflows }}
{{- if $pw.enabled }}
{{- $obs := .Values.openchoreo.observability }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-workflows-openchoreo
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {{ toJson $pw.podLabels }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $pw.controlPlane.namespace }} } }
          podSelector: { matchLabels: {{ toJson $pw.controlPlane.podLabels }} }
      ports:
        - { protocol: TCP, port: {{ $pw.controlPlane.port }} }
    {{- if $obs.enabled }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $pw.observability.namespace }} } }
          podSelector: { matchLabels: {{ toJson $pw.observability.podLabels }} }
      ports:
        - { protocol: TCP, port: {{ $obs.httpPort }} }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $pw.observability.namespace }} } }
          podSelector: { matchLabels: {{ toJson $pw.observability.prometheus.podLabels }} }
      ports:
        {{- range $pw.observability.prometheus.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
