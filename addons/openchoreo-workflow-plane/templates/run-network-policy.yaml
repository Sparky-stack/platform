{{- /*
Build run namespace workflows-<org ns> (OpenChoreo's WorkflowRun controller creates it on the first run and tolerates
an existing one; rendered here so its NetworkPolicy exists before any run) and a default-deny NetworkPolicy for every
pod in it. Check steps and Dockerfile RUN steps execute tenant code (rootless BuildKit with
--oci-worker-no-process-sandbox shares the pod network), so they reach only:
  DNS                 kube-dns in kube-system
  the registry        the Harbor Gateway proxy pods (registry host rewritten to them by coredns-local), harbor only
  the API server      Argo's executor (init/wait) writes workflowtaskresults; run containers carry no token
  the internet        80/443 outside private ranges: git, base images, package registries, Trivy DB, Sigstore
Nothing else on mgmt (argocd-repo-server, harbor-core over HTTP, webhooks, other namespaces). No ingress at all.
Enforced by k3s' network policy controller (flannel mgmt) or Cilium. Delete=false: removing the addon must not delete
run history.
Platform workflows (runNetworkPolicy.platformWorkflows): pods labelled podLabels (set only by platform-authored
ClusterWorkflows in their runTemplate spec.podMetadata, e.g. promotion-gate of addon openchoreo-platform; build
ClusterWorkflows never set it, parameters cannot) may additionally reach the OpenChoreo API/Thunder through the
control-plane Gateway, the observer through the observability Gateway (the hosts coredns-local rewrites to them), and
the observability Prometheus (in-cluster Service :9091 -> pod :9090, for the promotion gate's 5xx error-rate query).
NetworkPolicies are additive: this only widens egress for those pods.
*/ -}}
{{- $np := .Values.runNetworkPolicy }}
{{- if $np.enabled }}
{{- $ns := printf "workflows-%s" .Values.openchoreo.orgNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: build-runs-default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if and $np.registry.enabled (eq (toString (.Values.registry).type) "harbor") }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $np.registry.namespace }} } }
          podSelector: { matchLabels: {{ toJson $np.registry.podLabels }} }
      ports:
        - { protocol: TCP, port: {{ $np.registry.port }} }
    {{- end }}
    {{- range $np.apiServer }}
    - to:
        - ipBlock: { cidr: {{ .cidr }} }
      ports:
        - { protocol: TCP, port: {{ .port }} }
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson $np.internet.exceptCIDRs }}
      ports:
        {{- range $np.internet.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- $pw := $np.platformWorkflows }}
{{- if $pw.enabled }}
{{- if not $pw.podLabels }}{{ fail "runNetworkPolicy.platformWorkflows.podLabels must not be empty (it would widen egress for every run pod)" }}{{ end }}
{{- $obs := .Values.openchoreo.observability | default dict }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-workflows-openchoreo
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {{ toJson $pw.podLabels }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $pw.controlPlane.namespace }} } }
          podSelector: { matchLabels: {{ toJson $pw.controlPlane.podLabels }} }
      ports:
        - { protocol: TCP, port: {{ $pw.controlPlane.port }} }
    {{- if $obs.enabled }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $pw.observability.namespace }} } }
          podSelector: { matchLabels: {{ toJson $pw.observability.podLabels }} }
      ports:
        - { protocol: TCP, port: {{ required "openchoreo.observability.httpPort is required" $obs.httpPort }} }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $pw.observability.namespace }} } }
          podSelector: { matchLabels: {{ toJson $pw.observability.prometheus.podLabels }} }
      ports:
        {{- range $pw.observability.prometheus.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
