{{- /*
Executor token of workflow-sa: Argo mounts it into init/wait only (runs set automountServiceAccountToken: false), and
Kubernetes no longer creates it. Without it every run pod hangs in Init (docs/build-plane.md "Security posture of build pods").
*/ -}}
{{- $t := .Values.runExecutorToken }}
{{- if $t.enabled }}
{{- $ns := printf "workflows-%s" .Values.openchoreo.orgNamespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $t.serviceAccount }}
  namespace: {{ $ns }}
automountServiceAccountToken: false     # run containers never get it; Argo mounts the Secret below into init/wait
secrets:
  - name: {{ $t.serviceAccount }}.service-account-token
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ $t.serviceAccount }}.service-account-token
  namespace: {{ $ns }}
  annotations:
    kubernetes.io/service-account.name: {{ $t.serviceAccount }}
{{- end }}
