{{- /*
Cross-field render-time validation of this chart (renders nothing): installation toggle, plane CR vs agent, no
control-plane CA copied, agent RBAC, run NetworkPolicy labels, BuildKit mirror names. Single-key rules (types, names) are
in values.schema.json. secretStore != "platform" and runNamespacePrefix stay here: their messages say why
(tenant isolation, asserted by hack/tests/test_secret_store_scope.sh; OpenChoreo run namespaces).
*/ -}}
{{- if not .Values.openchoreo.workflowPlane.enabled }}
{{- fail "openchoreo.workflowPlane.enabled is false: disable this addon for mgmt (addons.platform.koorikla.io/openchoreo-workflow-plane: \"false\")" }}
{{- end }}
{{- $wp := index .Values "openchoreo-workflow-plane" }}
{{- if ne $wp.clusterAgent.planeID .Values.clusterWorkflowPlane.planeID }}
{{- fail "clusterWorkflowPlane.planeID must equal openchoreo-workflow-plane.clusterAgent.planeID" }}
{{- end }}
{{- if ne (index $wp "argo-workflows" "commonLabels" "openchoreo.dev/plane-id") $wp.clusterAgent.planeID }}
{{- fail "openchoreo-workflow-plane.argo-workflows.commonLabels[openchoreo.dev/plane-id] must equal clusterAgent.planeID" }}
{{- end }}
{{- if or (not $wp.clusterAgent.tls.enabled) (not $wp.clusterAgent.tls.generateCerts) $wp.clusterAgent.tls.caSecretName }}
{{- fail "openchoreo-workflow-plane.clusterAgent.tls: enabled, generateCerts, caSecretName empty (no control-plane CA key is copied)" }}
{{- end }}
{{- if and .Values.agentServerCA.enabled (ne .Values.agentServerCA.configMapName $wp.clusterAgent.tls.serverCAConfigMap) }}
{{- fail "agentServerCA.configMapName must equal openchoreo-workflow-plane.clusterAgent.tls.serverCAConfigMap" }}
{{- end }}
{{- if eq .Values.clusterWorkflowPlane.secretStore "platform" }}
{{- fail "clusterWorkflowPlane.secretStore must be the key-scoped store workflows, never the full platform store" }}
{{- end }}
{{- if .Values.clusterAgentRBAC.enabled }}
{{- if $wp.clusterAgent.rbac.create }}
{{- fail "clusterAgentRBAC.enabled: set openchoreo-workflow-plane.clusterAgent.rbac.create=false (the upstream ClusterRole is cluster-admin in all but name, #33)" }}
{{- end }}
{{- $prefix := toString .Values.clusterAgentRBAC.runNamespacePrefix }}
{{- if not (regexMatch "^[a-z0-9][-a-z0-9]*-$" $prefix) }}
{{- fail (printf "clusterAgentRBAC.runNamespacePrefix %q must be a namespace name prefix ending in - (OpenChoreo: workflows-)" $prefix) }}
{{- end }}
{{- end }}
{{- $np := .Values.runNetworkPolicy }}
{{- if and $np.enabled $np.platformWorkflows.enabled (not $np.platformWorkflows.podLabels) }}
{{- fail "runNetworkPolicy.platformWorkflows.podLabels must not be empty (it would widen egress for every run pod)" }}
{{- end }}
{{- /* BuildKit mirrors (templates/buildkitd-config.yaml): names end up verbatim in buildkitd.toml. */}}
{{- $reg := .Values.registry | default dict }}
{{- if and .Values.buildkitMirrors.enabled (eq (toString $reg.type) "harbor") $reg.proxyCache }}
{{- $hostRE := "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]+)?$" }}
{{- $host := required "registry.host is required for BuildKit mirrors (registry.type harbor)" $reg.host }}
{{- if not (regexMatch $hostRE $host) }}
{{- fail (printf "registry.host %q must be <hostname>[:port]" $host) }}
{{- end }}
{{- $seen := dict }}
{{- range $pc := $reg.proxyCache }}
{{- if not (regexMatch $hostRE (toString $pc.upstream)) }}
{{- fail (printf "registry.proxyCache upstream %q must be <hostname>[:port]" (toString $pc.upstream)) }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$" (toString $pc.project)) }}
{{- fail (printf "registry.proxyCache project %q for %s must be a Harbor project name" (toString $pc.project) $pc.upstream) }}
{{- end }}
{{- if eq $pc.upstream $host }}
{{- fail (printf "registry.proxyCache upstream %s is the registry itself (registry.host)" $host) }}
{{- end }}
{{- if hasKey $seen $pc.upstream }}
{{- fail (printf "registry.proxyCache lists upstream %s twice" $pc.upstream) }}
{{- end }}
{{- $_ := set $seen $pc.upstream true }}
{{- end }}
{{- end }}
