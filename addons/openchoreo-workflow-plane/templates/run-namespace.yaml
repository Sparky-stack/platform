{{- /*
Run namespace workflows-<org ns>, rendered while anything of this chart lives in it. Delete=false keeps run history when
the addon goes. runNamespacePrefix names it only when the RBAC alone is on (the other objects hardcode workflows-).
*/ -}}
{{- $np := .Values.runNetworkPolicy.enabled }}
{{- $token := .Values.runExecutorToken.enabled }}
{{- if or $np $token .Values.clusterAgentRBAC.enabled }}
{{- $prefix := ternary "workflows-" (toString .Values.clusterAgentRBAC.runNamespacePrefix) (or $np $token) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ printf "%s%s" $prefix .Values.openchoreo.orgNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
{{- end }}
