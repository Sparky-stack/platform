{{- /*
Build run namespace workflows-<org ns> on mgmt, rendered here (once) whenever this chart puts something in it: the run
NetworkPolicies, the executor token, the agent's Role. OpenChoreo's WorkflowRun controller creates it on the first run
and tolerates an existing one. Delete=false: removing the addon must not delete run history.
The NetworkPolicy/token templates use the fixed OpenChoreo 1.3.3 name workflows-; clusterAgentRBAC.runNamespacePrefix
only moves it when they are both off (RBAC-only), as before.
*/ -}}
{{- $np := .Values.runNetworkPolicy.enabled }}
{{- $token := .Values.runExecutorToken.enabled }}
{{- if or $np $token .Values.clusterAgentRBAC.enabled }}
{{- $prefix := ternary "workflows-" (toString .Values.clusterAgentRBAC.runNamespacePrefix) (or $np $token) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ printf "%s%s" $prefix .Values.openchoreo.orgNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
{{- end }}
