{{- /*
BuildKit registry mirrors: each registry.proxyCache upstream pulls through its Harbor proxy-cache project first, then
falls back to upstream. Only for registry.type harbor (docs/build-plane.md "Build pulls: BuildKit mirrors").
*/ -}}
{{- $m := .Values.buildkitMirrors }}
{{- $reg := .Values.registry }}
{{- if and $m.enabled (eq (toString $reg.type) "harbor") $reg.proxyCache }}
{{- $host := $reg.host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $m.configMapName }}
  namespace: {{ printf "workflows-%s" .Values.openchoreo.orgNamespace }}
data:
  buildkitd.toml: |
    # Rendered by addon openchoreo-workflow-plane from installation.yaml registry.proxyCache (#38).
    {{- range $pc := $reg.proxyCache }}
    [registry.{{ $pc.upstream | quote }}]
      mirrors = [{{ printf "%s/%s" $host $pc.project | quote }}]
    {{- end }}
    [registry.{{ $host | quote }}]
      ca = [{{ $m.caFile | quote }}]
{{- end }}
