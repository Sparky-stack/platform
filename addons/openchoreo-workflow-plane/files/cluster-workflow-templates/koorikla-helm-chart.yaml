# ClusterWorkflowTemplate koorikla-helm-chart: package a Helm chart as an OCI artifact with ci/scripts
# (helm/check.sh: dependency build, lint --strict, helm-unittest; helm/package-push.sh), push it to the installation's
# registry and cosign-sign it with the platform key. Behind the generic (non-component) ClusterWorkflow `helm-chart`
# of addon openchoreo-platform. Source checkout reuses koorikla-build's checkout template. Steps run the versioned
# scripts of ci/scripts/workflow/ in the toolbox image (helm-package.sh, sign.sh), like koorikla-build.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: koorikla-helm-chart
  annotations:
    workflows.argoproj.io/description: Lint, test, package, push and sign a Helm chart (OCI) with ci/scripts
spec:
  entrypoint: pipeline
  arguments:
    parameters:
      - name: workflowrun-name
      - name: git-repo
      - name: git-allowed-prefixes         # space-separated URL prefixes the run's git token may be sent to
      - name: branch
        value: main
      - name: commit
        value: ""
      - name: chart-path
        value: "."
      - name: chart-version
        value: ""
      - name: oci-registry                 # <registry>/<project>/charts (no oci:// prefix)
      - name: registry-host
      - name: push
        value: "true"
      - name: tlog-upload                  # "true": also record the signature in the public Rekor log
        value: "false"
      - name: workload-path                # checkout's loop guard; unused for charts
        value: ".none/none"
      - name: git-secret
      - name: registry-secret
      - name: registry-ca-secret
      - name: cosign-secret
  # No ServiceAccount token in the run's containers: check steps run tenant code in a tenant-chosen image, and
  # workflow-sa may patch workflowtaskresults (another run's outputs, e.g. the digest that gets signed). Only Argo's
  # executor (init/wait containers) gets the token, through executor.serviceAccountName.
  automountServiceAccountToken: false
  executor:
    serviceAccountName: workflow-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
  volumes:
    - name: git
      secret:
        secretName: "{{workflow.parameters.git-secret}}"
        optional: true
    - name: registry-auth
      secret:
        secretName: "{{workflow.parameters.registry-secret}}"
        items: [{ key: .dockerconfigjson, path: config.json }]
    - name: registry-ca
      secret:
        secretName: "{{workflow.parameters.registry-ca-secret}}"
        optional: true
    - name: cosign
      secret:
        secretName: "{{workflow.parameters.cosign-secret}}"
  templates:
    - name: pipeline
      dag:
        tasks:
          - name: checkout
            templateRef:
              name: koorikla-build
              template: checkout
              clusterScope: true
          - name: package
            depends: checkout
            template: package
          - name: sign
            depends: package
            when: "'{{workflow.parameters.push}}' == 'true'"
            template: sign
            arguments:
              parameters:
                - { name: digest-ref, value: "{{tasks.package.outputs.parameters.digest-ref}}" }

    - name: package
      # Infrastructure retry (pod killed by a node/k3s restart: exit 255; Argo errors), as in koorikla-build.
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        expression: "lastRetry.status == 'Error' || asInt(lastRetry.exitCode) == 255"
        backoff: { duration: 30s, factor: "2", maxDuration: 5m }
      container:
        image: "@@TOOLBOX_IMAGE@@"
        command: [bash, /opt/koorikla-ci/scripts/workflow/helm-package.sh]
        env:
          - { name: CHART_DIR, value: "{{workflow.parameters.chart-path}}" }
          - { name: CHART_VERSION, value: "{{workflow.parameters.chart-version}}" }
          - { name: OCI_REGISTRY, value: "{{workflow.parameters.oci-registry}}" }
          - { name: PUSH, value: "{{workflow.parameters.push}}" }
          - { name: CI_OUT_DIR, value: /work/out }
          - { name: HOME, value: /work/home }
          - { name: HELM_CACHE_HOME, value: /work/.cache/helm }
          - { name: HELM_CONFIG_HOME, value: /work/home/.config/helm }
          - { name: HELM_DATA_HOME, value: /work/home/.local/share/helm }
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: "1", memory: 1Gi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: registry-auth, mountPath: /registry-auth, readOnly: true }
          - { name: registry-ca, mountPath: /registry-ca, readOnly: true }
          - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
      outputs:
        parameters:
          - { name: digest-ref, valueFrom: { path: /tmp/digest-ref } }

    - name: sign
      inputs:
        parameters:
          - name: digest-ref
      # Same bounded OnError retry as koorikla-build's sign (pod creation rejected by a webhook without endpoints).
      retryStrategy:
        limit: "4"
        retryPolicy: OnError
        backoff: { duration: 10s, factor: "2", maxDuration: 5m }
      container:
        image: "@@TOOLBOX_IMAGE@@"
        command: [bash, /opt/koorikla-ci/scripts/workflow/sign.sh]
        env:
          - { name: DIGEST_REF, value: "{{inputs.parameters.digest-ref}}" }
          - { name: COSIGN_KEY, value: /cosign/cosign.key }
          - { name: TLOG_UPLOAD, value: "{{workflow.parameters.tlog-upload}}" }
          - { name: RECURSIVE, value: "false" }      # a chart is one manifest: no per-platform signatures, no attestations
          - { name: HOME, value: /tmp }
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: "1", memory: 512Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: registry-auth, mountPath: /registry-auth, readOnly: true }
          - { name: registry-ca, mountPath: /registry-ca, readOnly: true }
          - { name: cosign, mountPath: /cosign, readOnly: true }
          - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
