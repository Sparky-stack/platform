# ClusterWorkflowTemplate koorikla-build: DAG and pod specs for per-stack OpenChoreo ClusterWorkflows (docs/build-plane.md).
# Every step runs a versioned script from ci/scripts/workflow/ in @@TOOLBOX_IMAGE@@ (copied to /ci for check and build).
# Rendered verbatim except @@...@@ image placeholders so Argo {{...}} expressions bypass Helm.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: koorikla-build
  annotations:
    workflows.argoproj.io/description: Build, check, scan, sign an image with ci/scripts and hand it to GitOps
spec:
  entrypoint: pipeline
  arguments:
    parameters:
      # identity (set by the OpenChoreo ClusterWorkflow from the WorkflowRun)
      - name: component-name
      - name: project-name
      - name: namespace-name
      - name: workflowrun-name
      # source
      - name: git-repo
      - name: git-allowed-prefixes         # space-separated URL prefixes the run's git token may be sent to
      - name: branch
        value: main
      - name: commit
        value: ""
      - name: app-path
        value: "."
      # stack checks (empty check-image skips them)
      - name: stack
        value: none
      - name: check-image
        value: ""
      - name: check-setup
        value: ""
      - name: check-env
        value: "{}"
      - name: postgres
        value: "false"
      # image
      - name: image-repo                   # <registry>/<project path>/<component>, no tag
      - name: registry-host                # host[:port] the CA / credentials belong to
      - name: docker-context
        value: "."
      - name: dockerfile-path
        value: Dockerfile
      - name: build-args
        value: "[]"
      - name: platforms
        value: linux/amd64,linux/arm64
      - name: build-cache
        value: "true"
      # scanning gates
      - name: fail-severities
        value: CRITICAL
      - name: ignore-unfixed
        value: "true"
      - name: trivy-ignore-file
        value: ""
      # signing: "true" also records signatures in the public Rekor log (installation switch, default off)
      - name: tlog-upload
        value: "false"
      # GitOps hand-off
      - name: gitops-enabled
        value: "true"
      - name: gitops-branch
        value: main
      - name: workload-path
        value: deploy/openchoreo/workload.yaml
      - name: github-api-url               # the GitOps commit goes through the GitHub API (authored + signed by the App)
        value: https://api.github.com
      # per-run Secrets (ExternalSecrets rendered by the ClusterWorkflow)
      - name: git-secret                   # basic-auth: x-access-token + an App installation token for this repo only
      - name: registry-secret
      - name: registry-ca-secret
      - name: cosign-secret
  # No ServiceAccount token in the run's containers: check steps run tenant code in a tenant-chosen image, and
  # workflow-sa may patch workflowtaskresults (another run's outputs, e.g. the digest that gets signed). Only Argo's
  # executor (init/wait containers) gets the token, through executor.serviceAccountName.
  automountServiceAccountToken: false
  executor:
    serviceAccountName: workflow-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
  volumes:
    - name: git
      secret:
        secretName: "{{workflow.parameters.git-secret}}"
        optional: true
    - name: registry-auth
      secret:
        secretName: "{{workflow.parameters.registry-secret}}"
        items: [{ key: .dockerconfigjson, path: config.json }]
    - name: registry-ca
      secret:
        secretName: "{{workflow.parameters.registry-ca-secret}}"
        optional: true                     # external registries with public CAs have none
    - name: cosign
      secret:
        secretName: "{{workflow.parameters.cosign-secret}}"
  templates:
    - name: pipeline
      dag:
        tasks:
          - name: checkout
            template: checkout
          - name: check
            depends: checkout
            when: "'{{tasks.checkout.outputs.parameters.skip}}' != 'true' && '{{workflow.parameters.check-image}}' != '' && '{{workflow.parameters.postgres}}' != 'true'"
            template: check
          - name: check-with-postgres
            depends: checkout
            when: "'{{tasks.checkout.outputs.parameters.skip}}' != 'true' && '{{workflow.parameters.check-image}}' != '' && '{{workflow.parameters.postgres}}' == 'true'"
            template: check-with-postgres
          - name: scan-fs
            depends: checkout
            when: "'{{tasks.checkout.outputs.parameters.skip}}' != 'true'"
            template: scan-fs
          - name: build
            depends: "(check.Succeeded || check.Skipped) && (check-with-postgres.Succeeded || check-with-postgres.Skipped) && scan-fs.Succeeded"
            template: build
            arguments:
              parameters:
                - { name: short-sha, value: "{{tasks.checkout.outputs.parameters.short-sha}}" }
          - name: scan-image
            depends: build
            template: scan-image
            arguments:
              parameters:
                - { name: digest-ref, value: "{{tasks.build.outputs.parameters.digest-ref}}" }
          - name: sbom
            depends: build
            template: sbom
            arguments:
              parameters:
                - { name: digest-ref, value: "{{tasks.build.outputs.parameters.digest-ref}}" }
          - name: sign
            depends: scan-image && sbom
            template: sign
            arguments:
              parameters:
                - { name: digest-ref, value: "{{tasks.build.outputs.parameters.digest-ref}}" }
          - name: gitops
            depends: sign
            when: "'{{workflow.parameters.gitops-enabled}}' == 'true'"
            template: gitops
            arguments:
              parameters:
                - { name: image, value: "{{tasks.build.outputs.parameters.image}}" }
                - { name: commit-sha, value: "{{tasks.checkout.outputs.parameters.commit-sha}}" }
                - { name: short-sha, value: "{{tasks.checkout.outputs.parameters.short-sha}}" }

    # --- source (checkout.sh + guards.sh: GIT_ALLOWED_PREFIXES, ref/path validation, GitOps loop guard; docs/build-plane.md)
    - name: checkout
      retryStrategy:
        limit: "3"
        retryPolicy: OnError
      container:
        image: "@@TOOLBOX_IMAGE@@"
        command: [bash, /opt/koorikla-ci/scripts/workflow/checkout.sh]
        env:
          - &repo-env { name: REPO, value: "{{workflow.parameters.git-repo}}" }
          - &allowed-prefixes-env { name: GIT_ALLOWED_PREFIXES, value: "{{workflow.parameters.git-allowed-prefixes}}" }
          - { name: BRANCH, value: "{{workflow.parameters.branch}}" }
          - { name: COMMIT, value: "{{workflow.parameters.commit}}" }
          - { name: WORKLOAD_PATH, value: "{{workflow.parameters.workload-path}}" }
          - { name: HOME, value: /tmp }
          - &git-secret-env { name: GIT_SECRET, value: "{{workflow.parameters.git-secret}}" }
          - &run-namespace-env { name: RUN_NAMESPACE, value: "{{workflow.namespace}}" }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: "1", memory: 512Mi }
        securityContext: &restricted
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: git, mountPath: /secrets/git, readOnly: true }
          - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
      outputs:
        parameters:
          - { name: commit-sha, valueFrom: { path: /tmp/commit-sha } }
          - { name: short-sha, valueFrom: { path: /tmp/short-sha } }
          - { name: skip, valueFrom: { path: /tmp/skip } }

    # --- stack checks: ci/scripts/<stack>/check.sh in the official toolchain image ------------------------
    # check-init.sh (init container, toolbox) copies the scripts and turns check-env (JSON object of the script's env
    # flags) into an env file: toolchain images carry neither the scripts nor jq. check.sh runs the stack check from that
    # copy. Caches live on the run's volume.
    - name: check
      # Retry pods killed by a node/k3s restart (exit 255) or Argo pod-creation error, never a failed step exit code.
      retryStrategy: &infra-retry
        limit: "2"
        retryPolicy: Always
        expression: "lastRetry.status == 'Error' || asInt(lastRetry.exitCode) == 255"
        backoff: { duration: 30s, factor: "2", maxDuration: 5m }
      initContainers: &check-init
        - name: scripts
          image: "@@TOOLBOX_IMAGE@@"
          command: [bash, /opt/koorikla-ci/scripts/workflow/check-init.sh]
          env:
            - { name: CHECK_ENV, value: "{{workflow.parameters.check-env}}" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          securityContext: *restricted
          mirrorVolumeMounts: true
      container:
        # never empty: Argo validates every referenced template's image at submission, even when `when` skips the task
        image: "{{=workflow.parameters['check-image'] != '' ? workflow.parameters['check-image'] : '@@TOOLBOX_IMAGE@@'}}"
        command: [bash, /ci/scripts/workflow/check.sh]
        env:
          - { name: STACK, value: "{{workflow.parameters.stack}}" }
          - { name: APP_PATH, value: "{{workflow.parameters.app-path}}" }
          - { name: CHECK_SETUP, value: "{{workflow.parameters.check-setup}}" }
          - { name: CI_OUT_DIR, value: /work/out }
          - { name: HOME, value: /work/home }
          - { name: XDG_CACHE_HOME, value: /work/.cache }
          - { name: GOPATH, value: /work/.cache/go }
          - { name: GOCACHE, value: /work/.cache/go-build }
          - { name: GOFLAGS, value: -buildvcs=false }
          - { name: npm_config_cache, value: /work/.cache/npm }
          - { name: COREPACK_HOME, value: /work/.cache/corepack }
          - { name: MIX_HOME, value: /work/.cache/mix }
          - { name: HEX_HOME, value: /work/.cache/hex }
          - { name: BUNDLE_PATH, value: /work/.cache/bundle }
          - { name: GEM_HOME, value: /work/.cache/gem }
          - { name: CI, value: "true" }
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "2", memory: 3Gi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }    # writable root FS: toolchains write to /tmp and their own dirs
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: ci, mountPath: /ci }
      volumes:
        - { name: ci, emptyDir: {} }

    # Same, with an ephemeral PostgreSQL sidecar (Elixir/Rails test suites). Trust auth on localhost only: the database
    # lives and dies with the pod, there is no credential to manage.
    - name: check-with-postgres
      retryStrategy: *infra-retry
      initContainers: *check-init
      container:
        # never empty: Argo validates every referenced template's image at submission, even when `when` skips the task
        image: "{{=workflow.parameters['check-image'] != '' ? workflow.parameters['check-image'] : '@@TOOLBOX_IMAGE@@'}}"
        command: [bash, /ci/scripts/workflow/check.sh]
        env:
          - { name: STACK, value: "{{workflow.parameters.stack}}" }
          - { name: APP_PATH, value: "{{workflow.parameters.app-path}}" }
          - { name: CHECK_SETUP, value: "{{workflow.parameters.check-setup}}" }
          - { name: CI_OUT_DIR, value: /work/out }
          - { name: HOME, value: /work/home }
          - { name: XDG_CACHE_HOME, value: /work/.cache }
          - { name: MIX_HOME, value: /work/.cache/mix }
          - { name: HEX_HOME, value: /work/.cache/hex }
          - { name: BUNDLE_PATH, value: /work/.cache/bundle }
          - { name: GEM_HOME, value: /work/.cache/gem }
          - { name: CI, value: "true" }
          - { name: DATABASE_URL, value: "postgres://postgres@127.0.0.1:5432/test" }
          - { name: PGHOST, value: 127.0.0.1 }
          - { name: PGUSER, value: postgres }
          - { name: PGDATABASE, value: test }
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "2", memory: 3Gi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }    # writable root FS: toolchains write to /tmp and their own dirs
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: ci, mountPath: /ci }
      sidecars:
        - name: postgres
          image: "@@POSTGRES_IMAGE@@"
          env:
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }
            - { name: POSTGRES_DB, value: test }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: pgrun, mountPath: /var/run/postgresql }
      volumes:
        - { name: ci, emptyDir: {} }
        - { name: pgdata, emptyDir: {} }
        - { name: pgrun, emptyDir: {} }

    - name: scan-fs
      retryStrategy: *infra-retry
      container:
        image: "@@TOOLBOX_IMAGE@@"
        command: [bash, /opt/koorikla-ci/scripts/workflow/scan-fs.sh]
        env: &scan-env
          - { name: APP_PATH, value: "{{workflow.parameters.app-path}}" }
          - { name: IGNORE_REL, value: "{{workflow.parameters.trivy-ignore-file}}" }
          - { name: FAIL_SEVERITIES, value: "{{workflow.parameters.fail-severities}}" }
          - { name: IGNORE_UNFIXED, value: "{{workflow.parameters.ignore-unfixed}}" }
          - { name: CI_OUT_DIR, value: /work/out }
          - { name: TRIVY_CACHE_DIR, value: /tmp/trivy }
          - { name: HOME, value: /tmp }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 2Gi }
        securityContext: *restricted
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }

    # --- image build: rootless BuildKit (uid 1000; Unconfined seccomp/AppArmor + SETUID/SETGID for rootlesskit userns; docs/build-plane.md)
    - name: build
      retryStrategy: *infra-retry
      inputs:
        parameters:
          - name: short-sha
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Reads the source written by uid 65532 on the run volume through group 65532. supplementalGroups, not fsGroup:
        # fsGroup also chowns the BuildKit state emptyDir to gid 65532 (setgid), a gid the rootless user namespace does not
        # map, so overlayfs snapshots fail with "lchown ...: operation not permitted".
        supplementalGroups: [65532]
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      # The BuildKit image carries no ci/scripts: the toolbox copies them to the pod's /ci volume. This init container
      # mounts only that volume (no registry credentials, no tenant check-env) and keeps the restricted profile.
      initContainers:
        - name: scripts
          image: "@@TOOLBOX_IMAGE@@"
          command: [cp, -R, /opt/koorikla-ci/scripts, /ci/scripts]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: ci, mountPath: /ci }
      container:
        image: "@@BUILDKIT_IMAGE@@"
        command: [sh, /ci/scripts/workflow/build.sh]   # POSIX sh: the BuildKit image has neither bash nor jq
        env:
          # overlayfs explicitly: "auto" picks the native snapshotter in this pod (seen on k3d, btrfs node disk), which copies
          # the whole parent tree for every layer and step - a hello-world build took >15 min instead of ~1. Rootless
          # overlayfs needs Linux >= 5.11 (unprivileged overlay mounts in a user namespace).
          - { name: BUILDKITD_FLAGS, value: --oci-worker-no-process-sandbox --oci-worker-snapshotter=overlayfs }
          - { name: HOME, value: /home/user }
          - { name: IMAGE_REPO, value: "{{workflow.parameters.image-repo}}" }
          - { name: REGISTRY_HOST, value: "{{workflow.parameters.registry-host}}" }
          - { name: SHORT_SHA, value: "{{inputs.parameters.short-sha}}" }
          - { name: DOCKER_CONTEXT, value: "{{workflow.parameters.docker-context}}" }
          - { name: DOCKERFILE_PATH, value: "{{workflow.parameters.dockerfile-path}}" }
          - { name: BUILD_ARGS, value: "{{workflow.parameters.build-args}}" }
          - { name: PLATFORMS, value: "{{workflow.parameters.platforms}}" }
          - { name: BUILD_CACHE, value: "{{workflow.parameters.build-cache}}" }
        resources:
          requests: { cpu: 500m, memory: 768Mi }
          limits: { cpu: "4", memory: 6Gi }
        # rootlesskit maps the build user namespace with newuidmap/newgidmap, which gain CAP_SETUID/CAP_SETGID from file
        # capabilities: that needs privilege escalation (no no_new_privs) and both caps in the bounding set. Without
        # them: "newuidmap ... operation not permitted" (escalation off) or "Could not set caps" (caps dropped).
        # The process itself runs as uid 1000 with no effective capabilities.
        securityContext:
          allowPrivilegeEscalation: true
          capabilities: { drop: [ALL], add: [SETUID, SETGID] }
          seccompProfile: { type: Unconfined }
          appArmorProfile: { type: Unconfined }
        volumeMounts:
          - { name: work, mountPath: /work, readOnly: true }
          - { name: registry-auth, mountPath: /registry-auth, readOnly: true }
          - { name: registry-ca, mountPath: /registry-ca, readOnly: true }
          - { name: buildkitd-config, mountPath: /buildkitd, readOnly: true }
          - { name: buildkitd, mountPath: /home/user/.local/share/buildkit }
          - { name: ci, mountPath: /ci, readOnly: true }
      volumes:
        - { name: buildkitd, emptyDir: {} }
        - { name: ci, emptyDir: {} }
        # registry mirrors to the Harbor proxy caches (addon openchoreo-workflow-plane templates/buildkitd-config.yaml);
        # absent with an external registry: direct pulls
        - name: buildkitd-config
          configMap: { name: buildkitd-config, optional: true }
      outputs:
        parameters:
          - { name: digest-ref, valueFrom: { path: /tmp/digest-ref } }
          - { name: image, valueFrom: { path: /tmp/image } }

    # --- supply chain: ci/scripts common scripts in the toolbox -----------------------------------------------------
    # Registry trust (lib.sh registry_trust): Go tools (trivy, syft, cosign, crane) read SSL_CERT_FILE; the registry CA is appended to the
    # system bundle so public registries (Trivy DB, Sigstore) keep working. Registry auth: DOCKER_CONFIG.
    # HOME and TRIVY_CACHE_DIR live in the pod's own /tmp emptyDir, never on the run volume the tenant check step
    # writes (no planted tool config, no poisoned Trivy DB); scan-fs does the same.
    - name: scan-image
      retryStrategy: *infra-retry
      inputs:
        parameters:
          - name: digest-ref
      container:
        image: "@@TOOLBOX_IMAGE@@"
        command: [bash, /opt/koorikla-ci/scripts/workflow/scan-image.sh]
        env:
          - { name: DIGEST_REF, value: "{{inputs.parameters.digest-ref}}" }
          - { name: PLATFORMS, value: "{{workflow.parameters.platforms}}" }
          - { name: IGNORE_REL, value: "{{workflow.parameters.trivy-ignore-file}}" }
          - { name: FAIL_SEVERITIES, value: "{{workflow.parameters.fail-severities}}" }
          - { name: IGNORE_UNFIXED, value: "{{workflow.parameters.ignore-unfixed}}" }
          - { name: CI_OUT_DIR, value: /work/out }
          - { name: TRIVY_CACHE_DIR, value: /tmp/trivy }
          - { name: HOME, value: /tmp }
        resources:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { cpu: "2", memory: 3Gi }
        securityContext: *restricted
        volumeMounts: &supply-mounts
          - { name: work, mountPath: /work }
          - { name: registry-auth, mountPath: /registry-auth, readOnly: true }
          - { name: registry-ca, mountPath: /registry-ca, readOnly: true }
          - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }

    - name: sbom
      retryStrategy: *infra-retry
      inputs:
        parameters:
          - name: digest-ref
      container:
        image: "@@TOOLBOX_IMAGE@@"
        command: [bash, /opt/koorikla-ci/scripts/workflow/sbom.sh]
        env:
          - { name: DIGEST_REF, value: "{{inputs.parameters.digest-ref}}" }
          - { name: PLATFORMS, value: "{{workflow.parameters.platforms}}" }
          - { name: CI_OUT_DIR, value: /work/out }
          - { name: HOME, value: /tmp }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "2", memory: 2Gi }
        securityContext: *restricted
        volumeMounts: *supply-mounts
      volumes:
        - { name: tmp, emptyDir: {} }

    # cosign with the platform key (ExternalSecret from the secret backend key cosign-platform; private key never in
    # git). Cloud installations set the ClusterWorkflow's cosign key ref to a KMS URI reached through workload identity
    # instead of a key file. sign.sh signs the index and every platform manifest, attests the Trivy vuln report
    # (VULN_PREDICATE) and the SBOM (SBOM_PREDICATE).
    - name: sign
      inputs:
        parameters:
          - name: digest-ref
      # Defence in depth: OnError retries only Argo errors (pod creation rejected, e.g. a Kyverno webhook without
      # endpoints while its controller restarts), never a failed cosign exit. ~2.5 min of backoff covers a restart; a
      # repeated signature on the same digest is harmless.
      retryStrategy:
        limit: "4"
        retryPolicy: OnError
        backoff: { duration: 10s, factor: "2", maxDuration: 5m }
      container:
        image: "@@TOOLBOX_IMAGE@@"
        command: [bash, /opt/koorikla-ci/scripts/workflow/sign.sh]
        env:
          - { name: DIGEST_REF, value: "{{inputs.parameters.digest-ref}}" }
          - { name: COSIGN_KEY, value: /cosign/cosign.key }
          - { name: TLOG_UPLOAD, value: "{{workflow.parameters.tlog-upload}}" }
          - { name: VULN_PREDICATE, value: /work/out/trivy-vuln.json }
          - { name: SBOM_PREDICATE, value: /work/out/sbom.spdx.json }
          - { name: CI_OUT_DIR, value: /work/out }
          - { name: HOME, value: /tmp }
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: "1", memory: 512Mi }
        securityContext: *restricted
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: registry-auth, mountPath: /registry-auth, readOnly: true }
          - { name: registry-ca, mountPath: /registry-ca, readOnly: true }
          - { name: cosign, mountPath: /cosign, readOnly: true }
          - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }

    # --- GitOps hand-off (gitops.sh: CAS commit of the signed image ref via the GitHub contents API; docs/build-plane.md)
    - name: gitops
      inputs:
        parameters:
          - name: image
          - name: commit-sha
          - name: short-sha
      retryStrategy:
        limit: "2"
        retryPolicy: OnError
      container:
        image: "@@TOOLBOX_IMAGE@@"
        command: [bash, /opt/koorikla-ci/scripts/workflow/gitops.sh]
        env:
          - *repo-env
          - *allowed-prefixes-env
          - *git-secret-env
          - *run-namespace-env
          - { name: GITHUB_API_URL, value: "{{workflow.parameters.github-api-url}}" }
          - { name: GITOPS_BRANCH, value: "{{workflow.parameters.gitops-branch}}" }
          - { name: WORKLOAD_PATH, value: "{{workflow.parameters.workload-path}}" }
          - { name: IMAGE, value: "{{inputs.parameters.image}}" }
          - { name: COMMIT_SHA, value: "{{inputs.parameters.commit-sha}}" }
          - { name: SHORT_SHA, value: "{{inputs.parameters.short-sha}}" }
          - { name: COMPONENT, value: "{{workflow.parameters.component-name}}" }
          - { name: PROJECT, value: "{{workflow.parameters.project-name}}" }
          - { name: NAMESPACE, value: "{{workflow.parameters.namespace-name}}" }
          - { name: RUN, value: "{{workflow.parameters.workflowrun-name}}" }
          - { name: HOME, value: /tmp }
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
        securityContext: *restricted
        volumeMounts:
          - { name: git, mountPath: /secrets/git, readOnly: true }
          - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
