# Shared mesh root CA on mgmt (catalog: namespace fleet, roles [mgmt], default false; enable with
# installation.yaml mgmt.addons.mesh-root-ca: true). docs/multicluster.md "Trust".
#   Issuer mesh-root-selfsigned -> Certificate mesh-root-ca (isCA) -> Issuer mesh-root-ca
# charts/cluster issues <name>-mesh-ca (intermediate, one per cluster with mesh.group) from Issuer mesh-root-ca.
# The root private key never leaves mgmt; workload clusters only receive the public root as cacerts ca.crt.

# Generated by the ApplicationSet (defaults so `helm template` works standalone). Unused except installation.name.
cluster: { name: mgmt, role: mgmt, provider: docker, region: local, environment: mgmt, cni: flannel }
installation: { name: local }

root:
  namespace: fleet            # = CAPI namespace; the per-cluster intermediates (charts/cluster) live here too
  issuerName: mesh-root-ca    # charts/cluster templates/mesh-helpers.yaml "mesh.rootIssuer" (contract test)
  duration: 87600h            # 10y. Rotating the root is a planned, multi-step operation (docs/multicluster.md)
  renewBefore: 2160h
  privateKey:
    algorithm: RSA
    size: 4096
