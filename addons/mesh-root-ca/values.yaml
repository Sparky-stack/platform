# Istio mesh roots on mgmt (catalog: namespace cert-manager, roles [mgmt], default false; enable with
# installation.yaml mgmt.addons.mesh-root-ca: true). docs/multicluster.md "Trust".
# Per mesh group <g> (installation.yaml mesh.groups):
#   Issuer mesh-root-selfsigned -> Certificate mesh-root-<g> (isCA) -> ClusterIssuer mesh-root-<g>
# charts/cluster issues <name>-mesh-ca (intermediate, 14d) in fleet from ClusterIssuer mesh-root-<its group>.
# One root per group: a group is a cryptographic boundary, not just a discovery boundary - an intermediate of group A
# cannot mint identities that group B accepts. Root keys never leave mgmt and live in cert-manager's cluster resource
# namespace, which no ClusterSecretStore reaches (mgmt-fleet only reads fleet).
# templates/admission.yaml: ValidatingAdmissionPolicies limiting what can be signed by these roots and by the
# <name>-client-ca issuers (CAPI k3s client CAs) of charts/cluster.

# Generated by the ApplicationSet (defaults so `helm template` works standalone). Unused except installation.name.
cluster: { name: mgmt, role: mgmt, provider: docker, region: local, environment: mgmt, cni: flannel }
installation: { name: local }

# From installation.yaml (ApplicationSet valuesObject): every mesh group of the installation. A fleet file's mesh.group
# must be listed (charts/cluster fails otherwise). Environments / trust levels never share a group (except `local`).
mesh:
  groups: []

root:
  # = cert-manager's --cluster-resource-namespace (the cert-manager namespace): a ClusterIssuer reads its CA Secret only
  # from there. Keep it out of fleet: store mgmt-fleet hands fleet Secrets to any ExternalSecret in fleet/argocd.
  namespace: cert-manager
  issuerPrefix: mesh-root-    # ClusterIssuer mesh-root-<group>; charts/cluster mesh-helpers.yaml "mesh.rootIssuer" (contract test)
  duration: 87600h            # 10y. Rotating a root is a planned, multi-step operation (docs/multicluster.md)
  renewBefore: 2160h
  privateKey:
    algorithm: RSA
    size: 4096

# ValidatingAdmissionPolicies (admissionregistration.k8s.io/v1) on mgmt. cert-manager auto-approves every
# CertificateRequest, so without these anyone who may create a Certificate in fleet could mint cluster-admin client
# certs from a <name>-client-ca issuer, or a mesh intermediate from a mesh root ClusterIssuer from any namespace.
admission:
  enabled: true
  intermediateNamespace: fleet                  # = charts/cluster: <name>-mesh-ca, <name>-mesh-reader, <name>-client-ca
  intermediateMaxDuration: 336h                 # = charts/cluster mesh-pki.yaml (14d)
  readerUser: platform:istio-reader             # = charts/cluster mesh.readerUser, addon istio-eastwest reader.user
  readerMaxDuration: 168h                       # = charts/cluster mesh-remote-secret.yaml (7d)
  # The only principals on the mesh controller path: Argo CD applies the Certificates (charts/cluster from git),
  # cert-manager's controller creates their CertificateRequests.
  certificateWriters: [system:serviceaccount:argocd:argocd-application-controller]
  requestCreators: [system:serviceaccount:cert-manager:cert-manager]
