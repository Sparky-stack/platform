suite: mesh roots on mgmt - one per mesh group, ClusterIssuers, keys in cert-manager's namespace
templates:
  - templates/root-ca.yaml
release:
  namespace: cert-manager
set:
  mesh: { groups: [local, prod] }
tests:
  - it: renders one selfsigned issuer, then a root Certificate + ClusterIssuer per group
    asserts:
      - hasDocuments: { count: 5 }
      - isKind: { of: Issuer }
        documentIndex: 0
      - isNotNull: { path: spec.selfSigned }
        documentIndex: 0
      - equal: { path: metadata.namespace, value: cert-manager }
        documentIndex: 0
      - isKind: { of: Certificate }
        documentIndex: 1
      - equal: { path: metadata.name, value: mesh-root-local }
        documentIndex: 1
      - equal: { path: metadata.namespace, value: cert-manager }
        documentIndex: 1
      - equal: { path: spec.isCA, value: true }
        documentIndex: 1
      - equal: { path: spec.secretName, value: mesh-root-local }
        documentIndex: 1
      - equal: { path: spec.privateKey.rotationPolicy, value: Never }
        documentIndex: 1
      - equal: { path: spec.usages, value: [cert sign, crl sign, digital signature] }
        documentIndex: 1
      - isKind: { of: ClusterIssuer }
        documentIndex: 2
      - equal: { path: metadata.name, value: mesh-root-local }
        documentIndex: 2
      - equal: { path: spec.ca.secretName, value: mesh-root-local }
        documentIndex: 2
      - equal: { path: metadata.name, value: mesh-root-prod }
        documentIndex: 3
      - equal: { path: metadata.name, value: mesh-root-prod }
        documentIndex: 4

  - it: "negative: the root key never lives in fleet (store mgmt-fleet would expose it)"
    asserts:
      - notEqual: { path: metadata.namespace, value: fleet }
        documentIndex: 1
      - notEqual: { path: metadata.namespace, value: fleet }
        documentIndex: 3

  - it: names each root after the installation and its group
    set:
      installation.name: hetzner-example
    documentIndex: 3
    asserts:
      - equal: { path: spec.commonName, value: hetzner-example mesh root CA (prod) }
      - equal: { path: spec.subject.organizationalUnits, value: [mesh prod] }

  - it: renders no root without groups
    set:
      mesh: { groups: [] }
    asserts:
      - hasDocuments: { count: 0 }

  - it: rejects a group that is not a DNS label
    set:
      mesh: { groups: [Prod_1] }
    asserts:
      - failedTemplate: { errorMessage: "mesh-root-ca: mesh.groups entry \"Prod_1\" must be a DNS label (lower-case alphanumerics and '-', max 32 chars)" }

  - it: rejects duplicate groups
    set:
      mesh: { groups: [local, local] }
    asserts:
      - failedTemplate: { errorMessage: "mesh-root-ca: mesh.groups has duplicates" }
