suite: mesh PKI admission guards (CEL semantics are tested with the kyverno CLI in hack/tests/test_mesh_admission.sh)
templates:
  - templates/admission.yaml
tests:
  - it: renders four ValidatingAdmissionPolicies, each bound with Deny
    asserts:
      - hasDocuments: { count: 8 }
      - isKind: { of: ValidatingAdmissionPolicy }
        documentIndex: 0
      - equal: { path: spec.failurePolicy, value: Fail }
        documentIndex: 0
      - isKind: { of: ValidatingAdmissionPolicyBinding }
        documentIndex: 4
      - equal: { path: spec.validationActions, value: [Deny] }
        documentIndex: 4
      - equal: { path: spec.policyName, value: platform-mesh-issuers }
        documentIndex: 7

  - it: limits *-client-ca certificates to the reader profile (CN, no subject, not CA, client auth, <= 168h)
    documentIndex: 0
    asserts:
      - equal: { path: metadata.name, value: platform-mesh-reader-certificates }
      - matchRegex: { path: 'spec.matchConditions[0].expression', pattern: "endsWith\\('-client-ca'\\)" }
      - matchRegex: { path: 'spec.validations[1].expression', pattern: "commonName == 'platform:istio-reader'" }
      - matchRegex: { path: 'spec.validations[6].expression', pattern: "duration\\('168h'\\)" }

  - it: limits mesh root issuance to Argo CD-applied fleet/<x>-mesh-ca intermediates <= 14d
    documentIndex: 1
    asserts:
      - equal: { path: metadata.name, value: platform-mesh-intermediate-certificates }
      - matchRegex: { path: 'spec.matchConditions[0].expression', pattern: "startsWith\\('mesh-root-'\\)" }
      - matchRegex: { path: 'spec.validations[0].expression', pattern: 'system:serviceaccount:argocd:argocd-application-controller' }
      - matchRegex: { path: 'spec.validations[5].expression', pattern: "duration\\('336h'\\)" }

  - it: can be switched off
    set:
      admission.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
