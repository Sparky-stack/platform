{{- /*
One mesh root per mesh group (installation.yaml mesh.groups). rotationPolicy Never: a new root key would orphan every
member's intermediate until all are re-issued - root rotation is a deliberate procedure (trust bundle with both roots),
not a renewal. ClusterIssuer (not a namespaced Issuer) so the root Secret stays in cert-manager's namespace while the
intermediates are requested from fleet; templates/admission.yaml limits who may use it.
*/ -}}
{{- $r := .Values.root }}
{{- $groups := (.Values.mesh | default dict).groups | default list }}
{{- range $g := $groups }}
{{- if not (regexMatch "^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$" (toString $g)) }}
{{- fail (printf "mesh-root-ca: mesh.groups entry %q must be a DNS label (lower-case alphanumerics and '-', max 32 chars)" (toString $g)) }}
{{- end }}
{{- end }}
{{- if ne (len $groups) (len (uniq $groups)) }}{{ fail "mesh-root-ca: mesh.groups has duplicates" }}{{ end }}
{{- if $groups }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mesh-root-selfsigned
  namespace: {{ $r.namespace }}
  labels:
    app.kubernetes.io/part-of: istio-mesh
spec:
  selfSigned: {}
{{- end }}
{{- range $g := $groups }}
{{- $name := printf "%s%s" $r.issuerPrefix $g }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
  namespace: {{ $r.namespace }}
  labels:
    app.kubernetes.io/part-of: istio-mesh
    mesh.platform.koorikla.io/group: {{ $g }}
spec:
  isCA: true
  commonName: {{ printf "%s mesh root CA (%s)" $.Values.installation.name $g | quote }}
  subject:
    organizations: [{{ $.Values.installation.name | quote }}]
    organizationalUnits: [{{ printf "mesh %s" $g | quote }}]
  secretName: {{ $name }}
  duration: {{ $r.duration }}
  renewBefore: {{ $r.renewBefore }}
  privateKey:
    algorithm: {{ $r.privateKey.algorithm }}
    size: {{ $r.privateKey.size }}
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
    - digital signature
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: mesh-root-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: istio-mesh
    mesh.platform.koorikla.io/group: {{ $g }}
spec:
  ca:
    secretName: {{ $name }}   # in the cluster resource namespace ({{ $r.namespace }})
{{- end }}
