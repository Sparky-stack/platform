suite: openchoreo-observability-plane glue and guards
templates:
  - templates/validate.yaml
  - templates/cluster-observability-plane.yaml
  - templates/agent-server-ca.yaml
  - templates/secrets.yaml
  - templates/opensearch-tlsroute.yaml
  - templates/prometheus-network-policy.yaml
tests:
  - it: registers ClusterObservabilityPlane default trusting the in-namespace agent cert
    template: templates/cluster-observability-plane.yaml
    asserts:
      - isKind: { of: ClusterObservabilityPlane }
      - equal: { path: metadata.name, value: default }
      - isNull: { path: metadata.namespace }
      - equal: { path: spec.planeID, value: default }
      - equal: { path: spec.observerURL, value: "http://observer.openchoreo.localhost:11080" }
      - equal:
          path: spec.clusterAgent.clientCA.secretKeyRef
          value: { name: cluster-agent-tls, namespace: NAMESPACE, key: ca.crt }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true

  - it: agent server CA is a ConfigMap with the gateway CA public cert only
    template: templates/agent-server-ca.yaml
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: mgmt-openchoreo } }
      - equal: { path: spec.target.manifest, value: { apiVersion: v1, kind: ConfigMap } }
      - equal: { path: spec.target.name, value: cluster-gateway-ca }
      - equal:
          path: spec.data
          value: [{ secretKey: ca.crt, remoteRef: { key: cluster-gateway-ca, property: ca.crt } }]

  - it: secrets come from the platform store
    template: templates/secrets.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: spec.secretStoreRef.name, value: platform }
      - equal: { path: metadata.name, value: observer-secret }
        documentIndex: 0
      - equal: { path: metadata.name, value: opensearch-admin-credentials }
        documentIndex: 1
      - contains:
          path: spec.data
          content: { secretKey: password, remoteRef: { key: openchoreo-observability, property: opensearch-password } }
        documentIndex: 1

  - it: OpenSearch TLS passthrough route on the tls listener
    template: templates/opensearch-tlsroute.yaml
    documentSelector: { path: kind, value: TLSRoute }
    asserts:
      - equal: { path: spec.hostnames, value: [opensearch.observability.openchoreo.localhost] }
      - equal: { path: "spec.parentRefs[0].sectionName", value: tls }
      # not Service opensearch: the logs module's BackendConfigPolicy there originates TLS and breaks passthrough
      - equal: { path: "spec.rules[0].backendRefs[0].name", value: opensearch-passthrough }

  - it: passthrough Service selects the OpenSearch pods
    template: templates/opensearch-tlsroute.yaml
    documentSelector: { path: kind, value: Service }
    asserts:
      - equal: { path: metadata.name, value: opensearch-passthrough }
      - equal: { path: 'spec.selector["app.kubernetes.io/name"]', value: opensearch }
      - equal: { path: "spec.ports[0].port", value: 9200 }

  - it: fails when observability is disabled in the installation
    template: templates/validate.yaml
    set:
      openchoreo.observability.enabled: false
    asserts:
      - failedTemplate: {}

  - it: fails when the observer host drifts from the installation host
    template: templates/validate.yaml
    set:
      openchoreo.controlPlane.host: oc.example.com
    asserts:
      - failedTemplate:
          errorMessage: "openchoreo-observability-plane.observer.http.hostnames must contain observer.oc.example.com"

  - it: fails when the Gateway port drifts from the installation
    template: templates/validate.yaml
    set:
      openchoreo.observability.httpPort: 80
    asserts:
      - failedTemplate: {}

  - it: fails when a control-plane CA secret would be copied
    template: templates/validate.yaml
    set:
      openchoreo-observability-plane.clusterAgent.tls.caSecretName: cluster-gateway-ca
    asserts:
      - failedTemplate: {}

  - it: defaults render cleanly
    template: templates/validate.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: creates rca-agent-secret and finops-agent ExternalSecrets from openchoreo-ai when agents are enabled
    template: templates/secrets.yaml
    set:
      openchoreo-observability-plane.rca.enabled: true
      openchoreo-observability-plane.rca.llm.modelName: gpt-5.2
      openchoreo-observability-plane.finOpsAgent.enabled: true
      openchoreo-observability-plane.finOpsAgent.llmName: gpt-5.2
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: metadata.name, value: rca-agent-secret }
        documentIndex: 2
      - contains:
          path: spec.data
          content: { secretKey: RCA_LLM_API_KEY, remoteRef: { key: openchoreo-ai, property: rca-llm-api-key } }
        documentIndex: 2
      - contains:
          path: spec.data
          content: { secretKey: OAUTH_CLIENT_SECRET, remoteRef: { key: openchoreo-ai, property: rca-oauth-client-secret } }
        documentIndex: 2
      - equal: { path: metadata.name, value: finops-agent }
        documentIndex: 3
      - contains:
          path: spec.data
          content: { secretKey: LLM_API_KEY, remoteRef: { key: openchoreo-ai, property: finops-llm-api-key } }
        documentIndex: 3
      - contains:
          path: spec.data
          content: { secretKey: OAUTH_CLIENT_SECRET, remoteRef: { key: openchoreo-ai, property: finops-oauth-client-secret } }
        documentIndex: 3

  - it: AI agents are off by default (no agent Secrets, no agent URLs on the plane CR)
    asserts:
      - hasDocuments: { count: 2 }
        template: templates/secrets.yaml
      - notExists: { path: spec.rcaAgentURL }
        template: templates/cluster-observability-plane.yaml
      - notExists: { path: spec.finOpsAgentURL }
        template: templates/cluster-observability-plane.yaml

  - it: enabled agents are published on ClusterObservabilityPlane through the plane Gateway
    template: templates/cluster-observability-plane.yaml
    set:
      openchoreo-observability-plane.rca.enabled: true
      openchoreo-observability-plane.rca.llm.modelName: gpt-5.2
      openchoreo-observability-plane.finOpsAgent.enabled: true
      openchoreo-observability-plane.finOpsAgent.llmName: gpt-5.2
    asserts:
      - equal: { path: spec.rcaAgentURL, value: "http://rca-agent.openchoreo.localhost:11080" }
      - equal: { path: spec.finOpsAgentURL, value: "http://finops-agent.openchoreo.localhost:11080" }

  - it: rejects the RCA agent without a model
    template: templates/validate.yaml
    set: { openchoreo-observability-plane.rca.enabled: true }
    asserts:
      - failedTemplate: { errorMessage: "openchoreo-observability-plane.rca.enabled needs rca.llm.modelName (docs/ai-agents.md)" }

  - it: rejects the FinOps agent without a model
    template: templates/validate.yaml
    set: { openchoreo-observability-plane.finOpsAgent.enabled: true }
    asserts:
      - failedTemplate: { errorMessage: "openchoreo-observability-plane.finOpsAgent.enabled needs finOpsAgent.llmName (docs/ai-agents.md)" }

  - it: rejects an agent hostname outside the installation's control-plane host
    template: templates/validate.yaml
    set:
      openchoreo-observability-plane.rca.enabled: true
      openchoreo-observability-plane.rca.llm.modelName: gpt-5.2
      openchoreo-observability-plane.rca.http.hostnames: [rca.evil.example]
    asserts:
      - failedTemplate: { errorMessage: "openchoreo-observability-plane.rca.http.hostnames[0] must be rca-agent.openchoreo.localhost" }

  - it: opens Prometheus HTTP query port only to platform-workflow pods in workflows-<orgNamespace>
    template: templates/prometheus-network-policy.yaml
    asserts:
      - isKind: { of: NetworkPolicy }
      - equal: { path: metadata.name, value: prometheus-platform-workflows }
      - equal: { path: metadata.namespace, value: NAMESPACE }
      - equal:
          path: spec.podSelector
          value: { matchLabels: { app.kubernetes.io/name: prometheus, operator.prometheus.io/name: openchoreo-observability } }
      - equal: { path: spec.policyTypes, value: [Ingress] }
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: workflows-default } }
                  podSelector: { matchLabels: { platform.koorikla.io/egress: openchoreo } }
              ports:
                - { protocol: TCP, port: 9090 }
                - { protocol: TCP, port: 9091 }

  - it: Prometheus workflow ingress follows openchoreo.orgNamespace
    template: templates/prometheus-network-policy.yaml
    set: { openchoreo.orgNamespace: acme }
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: workflows-acme

  - it: no Prometheus workflow ingress without the workflow plane
    template: templates/prometheus-network-policy.yaml
    set: { openchoreo.workflowPlane.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  - it: refuses empty fromPodLabels on Prometheus workflow ingress (would expose Prometheus to tenant build pods)
    template: templates/prometheus-network-policy.yaml
    set: { prometheusIngress.fromPodLabels: null }
    asserts:
      - failedTemplate: { errorPattern: "fromPodLabels must not be empty" }
