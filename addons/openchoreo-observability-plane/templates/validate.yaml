{{- /*
Cross-field render-time validation of this chart (renders nothing): the subcharts' literal hostnames/ports must match
installation.yaml (openchoreo.controlPlane.host, openchoreo.observability.*), the plane CR's planeID the agent's, plus
the OpenSearch JVM, AI agent, logs setup Job and Prometheus ingress invariants. Types and required platform keys are
in values.schema.json.
*/ -}}
{{- $o := .Values.openchoreo.observability }}
{{- if not $o.enabled }}
{{- fail "openchoreo.observability.enabled is false: disable this addon for mgmt (addons.platform.koorikla.io/openchoreo-observability-plane: \"false\")" }}
{{- end }}
{{- $host := .Values.openchoreo.controlPlane.host }}
{{- $obs := index .Values "openchoreo-observability-plane" }}
{{- $observer := printf "observer.%s" $host }}
{{- if not (has $observer $obs.observer.http.hostnames) }}
{{- fail (printf "openchoreo-observability-plane.observer.http.hostnames must contain %s" $observer) }}
{{- end }}
{{- if ne (toString $obs.gateway.httpPort) (toString $o.httpPort) }}
{{- fail (printf "openchoreo-observability-plane.gateway.httpPort (%v) must equal openchoreo.observability.httpPort (%v)" $obs.gateway.httpPort $o.httpPort) }}
{{- end }}
{{- if ne (toString $obs.gateway.tlsPassthrough.port) (toString $o.tlsPort) }}
{{- fail (printf "openchoreo-observability-plane.gateway.tlsPassthrough.port (%v) must equal openchoreo.observability.tlsPort (%v)" $obs.gateway.tlsPassthrough.port $o.tlsPort) }}
{{- end }}
{{- $baseURL := printf "http://%s:%v" $observer $o.httpPort }}
{{- $found := false }}
{{- range $obs.observer.extraEnvs }}
{{- if and (eq .name "OBSERVER_BASE_URL") (eq .value $baseURL) }}{{ $found = true }}{{ end }}
{{- end }}
{{- if not $found }}
{{- fail (printf "openchoreo-observability-plane.observer.extraEnvs OBSERVER_BASE_URL must be %s" $baseURL) }}
{{- end }}
{{- $obsHost := printf "observability.%s" $host }}
{{- if ne $obs.gateway.tlsPassthrough.hostname (printf "opensearch.%s" $obsHost) }}
{{- fail (printf "openchoreo-observability-plane.gateway.tlsPassthrough.hostname must be opensearch.%s" $obsHost) }}
{{- end }}
{{- if not (has (printf "opentelemetry.%s" $obsHost) (index .Values "observability-tracing-opensearch" "opentelemetryCollectorCustomizations" "http" "hostnames")) }}
{{- fail (printf "observability-tracing-opensearch.opentelemetryCollectorCustomizations.http.hostnames must contain opentelemetry.%s" $obsHost) }}
{{- end }}
{{- if not (has (printf "prometheus.%s" $obsHost) (index .Values "observability-metrics-prometheus" "prometheusCustomizations" "http" "hostnames")) }}
{{- fail (printf "observability-metrics-prometheus.prometheusCustomizations.http.hostnames must contain prometheus.%s" $obsHost) }}
{{- end }}
{{- if ne $obs.clusterAgent.planeID .Values.clusterObservabilityPlane.planeID }}
{{- fail "clusterObservabilityPlane.planeID must equal openchoreo-observability-plane.clusterAgent.planeID" }}
{{- end }}
{{- if or (not $obs.clusterAgent.tls.enabled) (not $obs.clusterAgent.tls.generateCerts) $obs.clusterAgent.tls.caSecretName }}
{{- fail "openchoreo-observability-plane.clusterAgent.tls: enabled, generateCerts, caSecretName empty (no control-plane CA key is copied)" }}
{{- end }}
{{- if and .Values.agentServerCA.enabled (ne .Values.agentServerCA.configMapName $obs.clusterAgent.tls.serverCAConfigMap) }}
{{- fail "agentServerCA.configMapName must equal openchoreo-observability-plane.clusterAgent.tls.serverCAConfigMap" }}
{{- end }}
{{- /* OpenSearch: the JVM's processor count is pinned to the CPU limit (a JVM that does not see its cgroup, as in k3d,
sizes GC threads and thread pools for every host CPU and outgrows the memory limit). */}}
{{- $os := index .Values "observability-logs-opensearch" "openSearch" }}
{{- if $os.enabled }}
{{- $limits := (($os.resources | default dict).limits | default dict) }}
{{- $cpu := toString ($limits.cpu | default "") }}
{{- if not $cpu }}
{{- fail "observability-logs-opensearch.openSearch.resources.limits.cpu is required (the JVM's -XX:ActiveProcessorCount pins to it)" }}
{{- end }}
{{- $n := 0 }}
{{- if hasSuffix "m" $cpu }}
{{- $n = divf (trimSuffix "m" $cpu | float64) 1000 | ceil | int }}
{{- else }}
{{- $n = $cpu | float64 | ceil | int }}
{{- end }}
{{- $flag := printf "-XX:ActiveProcessorCount=%d" $n }}
{{- if not (has $flag (splitList " " (toString $os.opensearchJavaOpts))) }}
{{- fail (printf "observability-logs-opensearch.openSearch.opensearchJavaOpts must contain %s (= resources.limits.cpu %s, rounded up)" $flag $cpu) }}
{{- end }}
{{- end }}
{{- /* AI agents (docs/ai-agents.md): a model is required and the published URL host is ours. */}}
{{- if $obs.rca.enabled }}
{{- if not $obs.rca.llm.modelName }}
{{- fail "openchoreo-observability-plane.rca.enabled needs rca.llm.modelName (docs/ai-agents.md)" }}
{{- end }}
{{- if ne (first $obs.rca.http.hostnames) (printf "rca-agent.%s" $host) }}
{{- fail (printf "openchoreo-observability-plane.rca.http.hostnames[0] must be rca-agent.%s" $host) }}
{{- end }}
{{- end }}
{{- if $obs.finOpsAgent.enabled }}
{{- if not $obs.finOpsAgent.llmName }}
{{- fail "openchoreo-observability-plane.finOpsAgent.enabled needs finOpsAgent.llmName (docs/ai-agents.md)" }}
{{- end }}
{{- if ne (first $obs.finOpsAgent.http.hostnames) (printf "finops-agent.%s" $host) }}
{{- fail (printf "openchoreo-observability-plane.finOpsAgent.http.hostnames[0] must be finops-agent.%s" $host) }}
{{- end }}
{{- end }}
{{- /* Logs setup Job (templates/opensearch-setup-logs.yaml) runs as an Argo CD hook instead of the module's own Job. */}}
{{- $setup := index .Values "observability-logs-opensearch" "openSearchSetup" }}
{{- if $setup.enabled }}
{{- fail "observability-logs-opensearch.openSearchSetup.enabled must stay false: templates/opensearch-setup-logs.yaml runs the setup as an Argo CD hook (set openSearchSetup.run)" }}
{{- end }}
{{- if $setup.run }}
{{- $prefix := index .Values "observability-logs-opensearch" "auditLogs" "indexPrefix" }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9._-]*$" ($prefix | default "")) }}
{{- fail (printf "observability-logs-opensearch.auditLogs.indexPrefix %q is not an OpenSearch index name prefix" $prefix) }}
{{- end }}
{{- end }}
{{- /* An empty fromPodLabels would open Prometheus to tenant build pods (templates/prometheus-network-policy.yaml). */}}
{{- if and .Values.prometheusIngress.enabled .Values.openchoreo.workflowPlane.enabled (not .Values.prometheusIngress.fromPodLabels) }}
{{- fail "prometheusIngress.fromPodLabels must not be empty (it would open Prometheus to tenant build pods)" }}
{{- end }}
