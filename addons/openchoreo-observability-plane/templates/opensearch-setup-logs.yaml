{{- /* Runs the logs module's idempotent OpenSearch setup as an Argo CD PostSync hook (BeforeHookCreation) so a slow-boot
timeout is retried on the next sync instead of leaving a terminal failed Job (#192; openSearchSetup.enabled stays false). */ -}}
{{- $sub := index .Values "observability-logs-opensearch" }}
{{- $s := $sub.openSearchSetup }}
{{- if $s.run }}
{{- $secret := required "observability-logs-opensearch.openSearchSetup.openSearchSecretName is required" $s.openSearchSecretName }}
{{- $prefix := $sub.auditLogs.indexPrefix }}
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-setup-logs
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: opensearch-setup
          env:
            - { name: OPENSEARCH_ADDRESS, value: "https://opensearch:9200" }
            - name: OPENSEARCH_USERNAME
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: username } }
            - name: OPENSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
            - { name: OBSERVER_ALERTING_WEBHOOK_URL, value: {{ $s.alertingWebhookUrl | quote }} }
            - { name: CONTAINER_LOGS_MIN_INDEX_AGE, value: {{ $s.dataRetentionTime.containerLogs | quote }} }
            - { name: K8S_EVENTS_MIN_INDEX_AGE, value: {{ $s.dataRetentionTime.k8sEvents | quote }} }
            - { name: AUDIT_LOGS_MIN_INDEX_AGE, value: {{ $s.dataRetentionTime.auditLogs | quote }} }
            - { name: AUDIT_LOGS_INDEX_PREFIX, value: {{ $prefix | quote }} }
          image: {{ printf "%s:%s" $s.image.repository (required "observability-logs-opensearch.openSearchSetup.image.tag is required (tag@digest)" $s.image.tag) | quote }}
          imagePullPolicy: IfNotPresent
          resources:
            requests: { memory: 50Mi, cpu: 50m }
            limits: { memory: 75Mi, cpu: 75m }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsGroup: 10500
            runAsUser: 10500
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
{{- end }}
