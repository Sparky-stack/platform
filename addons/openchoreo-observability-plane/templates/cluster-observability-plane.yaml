{{- /* ClusterObservabilityPlane on mgmt: trusts the plane agent's self-signed cert and publishes observer/AI agent URLs (docs/observability.md). */ -}}
{{- $obs := index .Values "openchoreo-observability-plane" }}
{{- $o := .Values.openchoreo.observability }}
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterObservabilityPlane
metadata:
  name: {{ .Values.clusterObservabilityPlane.name }}
  labels:
    app.kubernetes.io/part-of: openchoreo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    openchoreo.dev/display-name: {{ printf "Observability plane (%s)" .Values.cluster.name | quote }}
    openchoreo.dev/description: "Logs, traces (OpenSearch) and metrics (Prometheus) on the management cluster"
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  planeID: {{ .Values.clusterObservabilityPlane.planeID }}
  clusterAgent:
    clientCA:
      secretKeyRef:
        name: {{ $obs.clusterAgent.tls.secretName }}
        namespace: {{ .Release.Namespace }}
        key: ca.crt
  observerURL: {{ printf "http://observer.%s:%v" .Values.openchoreo.controlPlane.host $o.httpPort | quote }}
  {{- if $obs.rca.enabled }}
  # http: the plane Gateway's HTTP listener. Fine locally; on cloud installations the portal -> agent hop carries user
  # tokens: serve the agent routes on the TLS listener (https://) before enabling an agent there. VERIFY (docs/ai-agents.md)
  rcaAgentURL: {{ printf "http://%s:%v" (first $obs.rca.http.hostnames) $o.httpPort | quote }}
  {{- end }}
  {{- if $obs.finOpsAgent.enabled }}
  finOpsAgentURL: {{ printf "http://%s:%v" (first $obs.finOpsAgent.http.hostnames) $o.httpPort | quote }}
  {{- end }}
