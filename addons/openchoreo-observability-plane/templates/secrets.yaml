{{- /* ExternalSecrets for observer, OpenSearch admin (sync wave -1), and optional AI agents from ClusterSecretStore `platform` (docs/observability.md). */ -}}
{{- $obs := index .Values "openchoreo-observability-plane" }}
{{- $store := .Values.secrets.store }}
{{- $key := .Values.secrets.remoteKey }}
{{- $ai := .Values.secrets.aiRemoteKey }}
{{- $rows := list
  (dict "name" $obs.observer.secretName "key" $key "data" (list "UID_RESOLVER_OAUTH_CLIENT_SECRET=observer-client-secret"))
  (dict "name" "opensearch-admin-credentials" "key" $key "wave" "-1"
        "data" (list "username=opensearch-username" "password=opensearch-password")) }}
{{- if $obs.rca.enabled }}
{{- $rows = append $rows (dict "name" (required "rca.secretName is required" $obs.rca.secretName) "key" $ai
        "data" (list "RCA_LLM_API_KEY=rca-llm-api-key" "OAUTH_CLIENT_SECRET=rca-oauth-client-secret")) }}
{{- end }}
{{- if $obs.finOpsAgent.enabled }}
{{- $rows = append $rows (dict "name" (required "finOpsAgent.secretName is required" $obs.finOpsAgent.secretName) "key" $ai
        "data" (list "LLM_API_KEY=finops-llm-api-key" "OAUTH_CLIENT_SECRET=finops-oauth-client-secret")) }}
{{- end }}
{{- range $i, $s := $rows }}
{{- if $i }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
  {{- with $s.wave }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ . | quote }}
  {{- end }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ $s.name }}
  data:
    {{- range $s.data }}
    {{- $kv := splitList "=" . }}
    - secretKey: {{ first $kv }}
      remoteRef: { key: {{ $s.key }}, property: {{ last $kv }} }
    {{- end }}
{{- end }}
