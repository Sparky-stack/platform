{{- /*
Secrets of the plane and its modules, from ClusterSecretStore `platform` key `openchoreo-observability` (values.yaml
"secrets"). Never committed; seeded by `make secrets` locally.
  observer-secret               UID_RESOLVER_OAUTH_CLIENT_SECRET: Thunder client openchoreo-observer-resource-reader-client
  opensearch-admin-credentials  username/password: OpenSearch initial admin (logs module node), setup Jobs, adapters,
                                trace receiver. Data planes read the same key through their `default` store (addon telemetry).
*/ -}}
{{- $obs := index .Values "openchoreo-observability-plane" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $obs.observer.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.store is required" .Values.secrets.store }}
  target:
    name: {{ $obs.observer.secretName }}
  data:
    - secretKey: UID_RESOLVER_OAUTH_CLIENT_SECRET
      remoteRef: { key: {{ .Values.secrets.remoteKey }}, property: observer-client-secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
  annotations:
    # before the OpenSearch StatefulSet and the setup Jobs (they read it at start)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: opensearch-admin-credentials
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.secrets.remoteKey }}, property: opensearch-username }
    - secretKey: password
      remoteRef: { key: {{ .Values.secrets.remoteKey }}, property: opensearch-password }
{{- if ($obs.rca).enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $obs.rca.secretName | default "rca-agent-secret" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.store is required" .Values.secrets.store }}
  target:
    name: {{ $obs.rca.secretName | default "rca-agent-secret" }}
  data:
    - secretKey: RCA_LLM_API_KEY
      remoteRef: { key: {{ .Values.secrets.aiRemoteKey | default "openchoreo-ai" }}, property: rca-llm-api-key }
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef: { key: {{ .Values.secrets.aiRemoteKey | default "openchoreo-ai" }}, property: rca-oauth-client-secret }
{{- end }}
{{- if ($obs.finOpsAgent).enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $obs.finOpsAgent.secretName | default "finops-agent" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.store is required" .Values.secrets.store }}
  target:
    name: {{ $obs.finOpsAgent.secretName | default "finops-agent" }}
  data:
    - secretKey: LLM_API_KEY
      remoteRef: { key: {{ .Values.secrets.aiRemoteKey | default "openchoreo-ai" }}, property: finops-llm-api-key }
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef: { key: {{ .Values.secrets.aiRemoteKey | default "openchoreo-ai" }}, property: finops-oauth-client-secret }
{{- end }}
