{{- /*
Secrets of the plane and its modules, from ClusterSecretStore `platform` key `openchoreo-observability` (values.yaml
"secrets"). Never committed; seeded by `task secrets` locally.
  observer-secret               UID_RESOLVER_OAUTH_CLIENT_SECRET: Thunder client openchoreo-observer-resource-reader-client
  opensearch-admin-credentials  username/password: OpenSearch initial admin (logs module node), setup Jobs, adapters,
                                trace receiver. Data planes read the same key through their `default` store (addon telemetry).
AI agents (only while enabled; key `openchoreo-ai`, docs/ai-agents.md):
  rca.secretName (rca-agent-secret)     RCA_LLM_API_KEY, OAUTH_CLIENT_SECRET (Thunder client openchoreo-rca-agent)
  finOpsAgent.secretName (finops-agent) LLM_API_KEY, OAUTH_CLIENT_SECRET (Thunder client openchoreo-finops-agent)
*/ -}}
{{- $obs := index .Values "openchoreo-observability-plane" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $obs.observer.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.store is required" .Values.secrets.store }}
  target:
    name: {{ $obs.observer.secretName }}
  data:
    - secretKey: UID_RESOLVER_OAUTH_CLIENT_SECRET
      remoteRef: { key: {{ .Values.secrets.remoteKey }}, property: observer-client-secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
  annotations:
    # before the OpenSearch StatefulSet and the setup Jobs (they read it at start)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: opensearch-admin-credentials
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.secrets.remoteKey }}, property: opensearch-username }
    - secretKey: password
      remoteRef: { key: {{ .Values.secrets.remoteKey }}, property: opensearch-password }
{{- if ($obs.rca).enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "rca.secretName is required" $obs.rca.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.store is required" .Values.secrets.store }}
  target:
    name: {{ $obs.rca.secretName }}
  data:
    - secretKey: RCA_LLM_API_KEY
      remoteRef: { key: {{ .Values.secrets.aiRemoteKey }}, property: rca-llm-api-key }
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef: { key: {{ .Values.secrets.aiRemoteKey }}, property: rca-oauth-client-secret }
{{- end }}
{{- if ($obs.finOpsAgent).enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "finOpsAgent.secretName is required" $obs.finOpsAgent.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.store is required" .Values.secrets.store }}
  target:
    name: {{ $obs.finOpsAgent.secretName }}
  data:
    - secretKey: LLM_API_KEY
      remoteRef: { key: {{ .Values.secrets.aiRemoteKey }}, property: finops-llm-api-key }
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef: { key: {{ .Values.secrets.aiRemoteKey }}, property: finops-oauth-client-secret }
{{- end }}
