{{- /* TLSRoute for single-node OpenSearch via dedicated Service opensearch-passthrough (Service `opensearch` has a
BackendConfigPolicy that originates TLS in kgateway and breaks passthrough). */ -}}
{{- $gw := index .Values "openchoreo-observability-plane" "gateway" }}
{{- if and $gw.tlsPassthrough.enabled (index .Values "observability-logs-opensearch" "openSearch" "enabled") }}
apiVersion: v1
kind: Service
metadata:
  name: opensearch-passthrough
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: opensearch
  ports:
    - name: https
      port: 9200
      targetPort: 9200
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: opensearch
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  parentRefs:
    - name: gateway-default
      namespace: {{ .Release.Namespace }}
      sectionName: tls
  hostnames:
    - {{ $gw.tlsPassthrough.hostname | quote }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: opensearch-passthrough
          port: 9200
{{- end }}
