{{- /*
OpenSearch for data-plane collectors (Fluent Bit container logs, k8s events): TLS passthrough on the plane's Gateway
listener `tls` (SNI opensearch.observability.<host>) -> Service opensearch:9200 (OpenSearch's own TLS + basic auth).
The logs module renders this route only for its operator mode (openSearchCluster); single-node mode needs it here.
*/ -}}
{{- $gw := index .Values "openchoreo-observability-plane" "gateway" }}
{{- if and $gw.tlsPassthrough.enabled (index .Values "observability-logs-opensearch" "openSearch" "enabled") }}
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: opensearch
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  parentRefs:
    - name: gateway-default
      namespace: {{ .Release.Namespace }}
      sectionName: tls
  hostnames:
    - {{ $gw.tlsPassthrough.hostname | quote }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: opensearch
          port: 9200
{{- end }}
