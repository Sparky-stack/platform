# OpenChoreo 1.3.3 observability plane on mgmt, co-located with the control plane (docs/observability.md).
# Values = upstream install/k3d/{single,multi}-cluster/values-op.yaml @ v1.3.3 + the k3d multi-cluster module flags,
# except lines marked "platform:". One Application, one namespace (openchoreo-observability-plane):
#
#   openchoreo-observability-plane   observer (REST + MCP for Backstage, openchoreo-api, MCP clients), controller-manager
#                                    (ObservabilityAlertRules), cluster-agent (in-cluster to the cluster-gateway),
#                                    Gateway gateway-default (11080 HTTP, 11085 TLS passthrough)
#   observability-logs-opensearch    OpenSearch single node (logs + traces + k8s events), logs-adapter, index setup Job
#   observability-tracing-opensearch OTLP receiver collector (multiClusterReceiver) -> OpenSearch, tracing-adapter
#   observability-metrics-prometheus Prometheus (remote-write receiver) + operator + Alertmanager, metrics-adapter
#
# Needs (mgmt addons): cert-manager, external-secrets (+ ClusterSecretStores `platform`, `mgmt-openchoreo`; ESO with
# generic targets enabled for ConfigMaps, see templates/agent-server-ca.yaml), gateway-api-crds, kgateway, thunder
# (OAuth client openchoreo-observer-resource-reader-client), openchoreo-control-plane, coredns-local (mgmt pods resolve
# observer.openchoreo.localhost and *.observability.openchoreo.localhost to the Gateway below).
#
# Endpoints (k3d publishes host 11080/11085 -> mgmt nodes -> klipper hostPorts of Service gateway-default in this ns):
#   http://observer.openchoreo.localhost:11080                           observer API (+ /mcp); ClusterObservabilityPlane
#                                                                        observerURL; browser + Backstage backend
#   http://opentelemetry.observability.openchoreo.localhost:11080        OTLP/HTTP + gRPC ingest (traces) from data planes
#   http://prometheus.observability.openchoreo.localhost:11080/api/v1/write  Prometheus remote-write ingest (metrics)
#   opensearch.observability.openchoreo.localhost:11085                  OpenSearch HTTPS (TLS passthrough, basic auth):
#                                                                        Fluent Bit logs + k8s events from data planes
# Hostnames are literals (subchart values cannot be templated); templates/validate.yaml checks them against
# installation.yaml openchoreo.controlPlane.host and openchoreo.observability.*.
# Images: every image is fully qualified and pinned by multi-arch index digest (docs/conventions.md invariant 9,
# hack/tests/test_image_pins.sh), the operator-injected Prometheus config reloader included. Tag and digest change
# together with the chart version.

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster:
  name: mgmt
openchoreo:
  orgNamespace: default
  controlPlane:
    host: openchoreo.localhost
  observability:
    enabled: true
    httpPort: 11080           # obs-plane Gateway HTTP listener == k3d published port
    tlsPort: 11085            # obs-plane Gateway TLS passthrough listener (OpenSearch) == k3d published port
  workflowPlane:
    enabled: true

# --- platform glue (templates/) -------------------------------------------------------------------------------------
# Additive NetworkPolicy opening Prometheus (:9091 Service -> :9090 pod http-web) to platform-authored workflow pods in
# workflows-<orgNamespace> (promotion-gate; #104). Upstream's observability-plane-ingress blocks cross-namespace ingress
# to every pod except gateway-default and opentelemetry-collector.
prometheusIngress:
  enabled: true
  podLabels: { app.kubernetes.io/name: prometheus, operator.prometheus.io/name: openchoreo-observability }
  fromPodLabels: { platform.koorikla.io/egress: openchoreo }   # == openchoreo-platform promotionGate.podLabels
  ports: [9090]             # pod port http-web: NetworkPolicy matches after the Service DNAT (:9091 -> :9090)

# ClusterObservabilityPlane `default` (cluster-scoped, on mgmt). Its agent identity: the chart's self-signed client cert
# (Secret cluster-agent-tls in this namespace, CN = planeID); the plane trusts exactly that certificate (ca.crt of a
# self-signed cert == the cert). Same cluster as the cluster-gateway, so nothing leaves mgmt.
clusterObservabilityPlane:
  name: default
  planeID: default            # == openchoreo-observability-plane.clusterAgent.planeID (validated)

# ConfigMap cluster-gateway-ca in this namespace (the agent verifies the cluster-gateway with it): the control plane's
# gateway CA PUBLIC cert, read from openchoreo-control-plane/cluster-gateway-ca (ca.crt only) through the read-only
# ClusterSecretStore `mgmt-openchoreo`. ESO writes a ConfigMap (generic target): external-secrets on mgmt needs
# `genericTargets.enabled: true` (adds --unsafe-allow-generic-targets + ConfigMap RBAC).
agentServerCA:
  enabled: true
  store: mgmt-openchoreo
  sourceSecret: cluster-gateway-ca
  configMapName: cluster-gateway-ca   # == openchoreo-observability-plane.clusterAgent.tls.serverCAConfigMap

# Secrets from ClusterSecretStore `platform` (never committed; seeded by `make secrets` locally):
#   key `openchoreo-observability`:
#     opensearch-username     must be `admin` (OpenSearch demo security config user)
#     opensearch-password     >= 8 chars, upper+lower+digit+special (OpenSearch 3 initial admin password policy)
#     observer-client-secret  == Thunder client openchoreo-observer-resource-reader-client's secret
#   key `openchoreo-ai` (read only while rca / finOpsAgent are enabled; docs/ai-agents.md):
#     rca-llm-api-key             provider key, or any placeholder when llm.baseUrl is the agentgateway
#     rca-oauth-client-secret     == Thunder client openchoreo-rca-agent's secret (addon thunder reads the same property)
#     finops-llm-api-key          provider key, or any placeholder when llmBaseUrl is the agentgateway
#     finops-oauth-client-secret  == Thunder client openchoreo-finops-agent's secret (addon thunder reads it too)
secrets:
  store: platform
  remoteKey: openchoreo-observability
  aiRemoteKey: openchoreo-ai

openchoreo-observability-plane:
  observer:
    image:
      tag: v1.3.3@sha256:58f27ddf5ff2d701b92178ad552bfb069e1a55811dfea411b83cf61fcb680be1   # index: amd64, arm64
    secretName: observer-secret             # templates/secrets.yaml (UID_RESOLVER_OAUTH_CLIENT_SECRET)
    controlPlaneApiUrl: "http://api.openchoreo.localhost:8080"
    cors:
      allowedOrigins:
        - "http://openchoreo.localhost:8080"
    extraEnvs:
      - name: OBSERVER_BASE_URL
        value: "http://observer.openchoreo.localhost:11080"
      - name: AUTHZ_TIMEOUT
        value: "30s"
    http:
      hostnames:
        - observer.openchoreo.localhost
    alertStoreSqliteSize: 128Mi             # local-path PVC
    resources:                              # upstream: requests 100m/128Mi, limits 200m/200Mi
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }

  controllerManager:
    image:
      tag: v1.3.3@sha256:ce7e9d6394cd10bdd7d4f9f5746468b3f1f010b714b878a8a51051aac0b97863   # index: amd64, arm64
    resources:                              # platform: upstream requests 100m/256Mi
      requests: { cpu: 20m, memory: 96Mi }
      limits: { cpu: 500m, memory: 512Mi }

  security:
    oidc:
      issuer: "http://thunder.openchoreo.localhost:8080"      # == control plane security.oidc.issuer
      jwksUrl: "http://thunder.openchoreo.localhost:8080/oauth2/jwks"
      tokenUrl: "http://thunder.openchoreo.localhost:8080/oauth2/token"
      authServerBaseUrl: "http://thunder.openchoreo.localhost:8080"

  gateway:
    httpPort: 11080                          # klipper binds 11080/11085 next to the control plane's 8080/8443
    httpsPort: 11085
    tls:
      enabled: false
    tlsPassthrough:                          # OpenSearch for data-plane Fluent Bit / events (templates/opensearch-tlsroute.yaml)
      enabled: true
      hostname: opensearch.observability.openchoreo.localhost
      port: 11085

  # platform: co-located with the control plane -> in-cluster cluster-gateway URL (upstream default), no TLSRoute hop.
  clusterAgent:
    serverUrl: wss://cluster-gateway.openchoreo-control-plane.svc.cluster.local:8443/ws
    planeID: default
    image:
      tag: v1.3.3@sha256:de4907fcf4ffa6822dcbcaff876b02861bae0804c3aa86db6df64f918ef8451c   # index: amd64, arm64
    resources:                               # upstream requests 50m/128Mi
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 100m, memory: 256Mi }
    tls:
      enabled: true
      generateCerts: true                    # self-signed client cert -> Secret cluster-agent-tls (trusted by the plane CR)
      secretName: cluster-agent-tls
      clientSecretName: cluster-agent-tls
      serverCAConfigMap: cluster-gateway-ca  # templates/agent-server-ca.yaml
      caSecretName: ""                       # never copy the control plane's CA (private key)

  tls:
    enabled: false

  # --- AI agents: switched off (docs/ai-agents.md) -----------------------------------------------------------------
  # Configured here, inert while `enabled: false` (upstream renders nothing for them). Switch on = `enabled: true` +
  # model name, after: key `openchoreo-ai` in the platform store, Thunder client 53/60 (addon thunder), and either addon
  # agentgateway (base URLs below) or an empty base URL with a real provider key. The control plane's rca-agent /
  # finops-agent authz roles and client_id bindings ship enabled upstream. templates/secrets.yaml syncs the agent
  # Secrets; templates/cluster-observability-plane.yaml publishes the agent URLs on the plane CR.
  rca:
    enabled: false                           # switch 1/2 for the RCA (SRE) agent
    image:
      tag: v1.3.3@sha256:f61a2ac460f6eecde24cdbb36f6ab87e2b37a0827f318800a2dbb297ac23e8b5   # sre-agent, amd64 + arm64
    openchoreoApiUrl: "http://api.openchoreo.localhost:8080"     # == observer.controlPlaneApiUrl (co-located)
    cors:
      allowedOrigins:
        - "http://openchoreo.localhost:8080"
    http:
      hostnames:
        - rca-agent.openchoreo.localhost     # == ClusterObservabilityPlane rcaAgentURL host (validated)
    secretName: rca-agent-secret             # templates/secrets.yaml: RCA_LLM_API_KEY, OAUTH_CLIENT_SECRET
    llm:
      modelName: ""                          # switch 2/2, e.g. gpt-5.2 (required when enabled; validated)
      baseUrl: "http://agentgateway-proxy.agentgateway-system.svc.cluster.local"   # addon agentgateway; "" = provider direct
    oauth:
      clientId: openchoreo-rca-agent         # == Thunder script 53
    resources:                               # upstream requests 100m/1Gi (!), limits 250m/1.5Gi: mind host RAM
      requests: { cpu: 50m, memory: 512Mi }
      limits: { cpu: 250m, memory: 1536Mi }
  finOpsAgent:
    enabled: false                           # switch 1/2 for the FinOps agent; needs addon finops-opencost too
    image:
      tag: v1.3.3@sha256:1875e43e83d25c90dfc16703eb3b9ec3d12cd280117313c79e09f2348022564c   # finops-agent, amd64 + arm64
    openchoreoApiUrl: "http://api.openchoreo.localhost:8080"
    cors:
      allowedOrigins:
        - "http://openchoreo.localhost:8080"
    http:
      hostnames:
        - finops-agent.openchoreo.localhost  # == ClusterObservabilityPlane finOpsAgentURL host (validated)
    # opencostMcpServerUrl / observer.finOpsAdapter.url: upstream defaults match addon finops-opencost's Services
    secretName: finops-agent                 # templates/secrets.yaml: LLM_API_KEY, OAUTH_CLIENT_SECRET
    llmName: ""                              # switch 2/2, an OpenAI model (1.3.3 supports OpenAI only), e.g. gpt-5.2
    llmBaseUrl: "http://agentgateway-proxy.agentgateway-system.svc.cluster.local"   # addon agentgateway; "" = direct
    oauth:
      clientId: openchoreo-finops-agent      # == Thunder script 60

# --- logs: OpenSearch single node (shared with traces and k8s events) + logs-adapter --------------------------------
observability-logs-opensearch:
  fluent-bit:
    enabled: false                           # collectors run on data planes (addon telemetry)
  openSearchCluster:
    enabled: false                           # platform: operator cluster = 2 data + 3 masters (~5 GiB); single node here
  openSearch:
    enabled: true
    singleNode: true
    image:
      repository: docker.io/opensearchproject/opensearch   # platform: fully qualified
      tag: 3.3.0@sha256:d96afaf6cbd2a6a3695aeb2f1d48c9a16ad5c8918eb849e5cbf43475f0f8e146   # index: amd64, arm64
    majorVersion: "3"                        # = image tag major; set, so the chart does not semver-parse the tag@digest
    extraEnvs:                               # platform: upstream hardcodes the initial admin password
      - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: opensearch-admin-credentials
            key: password
    # ActiveProcessorCount = the CPU limit (templates/validate.yaml). Inside k3d the JVM finds no cgroup controllers
    # ("System not containerized") and sizes GC threads and OpenSearch's thread pools (write, search, ml, grpc ...) for
    # every host CPU; the pools grow lazily and native memory crossed the 1536Mi limit after ~45 min (OOMKilled,
    # traces in flight dropped). A container-aware JVM gets the same value from the CPU quota.
    opensearchJavaOpts: "-Xms512m -Xmx512m -XX:ActiveProcessorCount=1"
    resources:                               # platform: upstream requests 1 CPU / 100Mi
      requests: { cpu: 200m, memory: 1Gi }
      limits: { cpu: "1", memory: 1536Mi }
    persistence:
      enabled: true
      size: 8Gi                              # local-path on k3d
      image: docker.io/library/busybox       # fsgroup-volume init container (upstream busybox:latest)
      imageTag: 1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    # Host kernel must allow vm.max_map_count >= 262144 (k3d shares the host kernel; Arch/systemd default 1048576).
    sysctlInit:
      enabled: false
      image: docker.io/library/busybox       # upstream busybox:latest
      imageTag: 1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
  openSearchSetup:
    enabled: false                           # platform: the module's Job is terminal once failed; the same setup runs
    run: true                                # as an Argo CD PostSync hook (templates/opensearch-setup-logs.yaml, #192)
    image:
      tag: 0.7.0@sha256:4c1b5bef4e4eee94ad965146371fbc81e123bc1e435c530d177f42024bb257f3   # index: amd64, arm64
    openSearchSecretName: opensearch-admin-credentials
    dataRetentionTime:
      containerLogs: "7d"                    # platform: upstream 30d
      k8sEvents: "7d"
      auditLogs: "30d"
  adapter:
    image:
      tag: 0.7.0@sha256:a3921d5aec41452f3a9a440325bc64c4a73dd3e139bac66032bf226b0a86eaaf   # index: amd64, arm64
    openSearchSecretName: opensearch-admin-credentials
    resources:
      requests: { cpu: 20m, memory: 48Mi }
      limits: { cpu: 100m, memory: 128Mi }

# --- traces: OTLP receiver (from data-plane collectors) -> OpenSearch, tracing-adapter ------------------------------
observability-tracing-opensearch:
  global:
    installationMode: multiClusterReceiver
  openSearch:
    enabled: false                           # the logs module's node
  openSearchSetup:
    image:
      tag: 0.8.0@sha256:dfb2305dcfd799c4476aa6915c815da4e5239539e2e8c5f4bc17fae0325c6df0   # index: amd64, arm64
    openSearchSecretName: opensearch-admin-credentials
    dataRetentionTime:
      traces: "7d"
  adapter:
    image:
      tag: 0.8.0@sha256:57a13f88cd17c2316137be5c82a4c9fa826b878f6eddb99e0f6a289f7b5deae2   # index: amd64, arm64
    openSearchSecretName: opensearch-admin-credentials
    resources:
      requests: { cpu: 20m, memory: 48Mi }
      limits: { cpu: 100m, memory: 128Mi }
  opentelemetry-collector:
    image:
      repository: docker.io/otel/opentelemetry-collector-contrib   # platform: fully qualified
      tag: 0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849   # index: amd64, arm64, ...
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }
  opentelemetryCollectorCustomizations:
    tailSampling:
      enabled: false                         # platform: sampling decisions belong to the data-plane collectors
    http:
      hostnames:
        - opentelemetry.observability.openchoreo.localhost

# --- metrics: Prometheus (remote-write receiver) + Alertmanager (metric alerts -> observer), metrics-adapter --------
observability-metrics-prometheus:
  global:
    installationMode: multiClusterReceiver
  prometheusCustomizations:
    http:
      hostnames:
        - prometheus.observability.openchoreo.localhost
  kube-prometheus-stack:
    prometheusOperator:
      image:
        tag: v0.94.1
        sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a   # hex only (the chart adds @sha256:)
      prometheusConfigReloader:   # sidecar the operator adds to Prometheus/Alertmanager pods (operator flag)
        image:
          tag: v0.94.1
          sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
      # platform: upstream limits 40m CPU / 60Mi. Throttled at 40m on the busy mgmt cluster the operator answers its
      # 1 s /healthz liveness probe too late, the kubelet kills it (exit 0 "Shutting down") -> CrashLoopBackOff.
      # Same startup-safe ceiling as addon telemetry (a null CPU limit renders as 0, which the API rejects).
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: 500m, memory: 256Mi }
      admissionWebhooks:
        certManager:
          enabled: true          # platform: cert-manager issues the webhook cert (no Helm hook Jobs under Argo)
    # platform: mgmt runs no app workloads -> no kubelet/cAdvisor scrape, no kube-state-metrics here
    kubelet:
      enabled: false
    kubeStateMetrics:
      enabled: false
    kubernetesServiceMonitors:
      enabled: false
    prometheus:
      prometheusSpec:
        image:
          tag: v3.15.1-distroless
          sha: 451a845bae1d51622b41af1780eb2ad911bbb79a9855bc8e9bb67fabbc03f934   # index: amd64, arm64, ...
        retention: 7d
        retentionSize: 6GiB
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 8Gi
        resources:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { cpu: "1", memory: 1Gi }
    alertmanager:
      alertmanagerSpec:
        image:
          tag: v0.34.1
          sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a   # index: amd64, arm64, ...
        resources:
          requests: { cpu: 10m, memory: 48Mi }
          limits: { cpu: 100m, memory: 128Mi }
  adapter:
    image:
      tag: 0.8.0@sha256:97e67d24a826e1e6ab01517dab08ef84306c856b74a37badfc9d5f9b83b49f35   # index: amd64, arm64
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { cpu: 100m, memory: 128Mi }
