suite: moco wrapper
release:
  name: moco
  namespace: moco-system
templates:
  - templates/namespace.yaml
  - templates/controller.yaml
  - charts/moco/templates/deployment.yaml
tests:
  - it: the upstream Deployment runs no pods (it cannot meet Pod Security restricted)
    template: charts/moco/templates/deployment.yaml
    asserts:
      - equal: { path: spec.replicas, value: 0 }

  - it: the platform controller meets Pod Security restricted (seccomp, non-root, no privilege escalation, all capabilities dropped)
    template: templates/controller.yaml
    asserts:
      - equal: { path: spec.template.spec.securityContext, value: { runAsNonRoot: true, runAsUser: 10000, runAsGroup: 10000, seccompProfile: { type: RuntimeDefault } } }
      - equal: { path: 'spec.template.spec.containers[0].securityContext', value: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } } }
      - equal: { path: spec.template.spec.serviceAccountName, value: moco-controller-manager }

  - it: keeps the pod labels the upstream webhook Service selects
    template: templates/controller.yaml
    asserts:
      - equal: { path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: moco-controller }
      - equal: { path: 'spec.template.metadata.labels["app.kubernetes.io/name"]', value: moco }

  - it: operator and injected images are multi-arch pins by digest
    template: templates/controller.yaml
    asserts:
      - matchRegex: { path: 'spec.template.spec.containers[0].image', pattern: '^ghcr\.io/cybozu-go/moco:0\.38\.0@sha256:[0-9a-f]{64}$' }
      - matchRegex: { path: 'spec.template.spec.containers[0].args[1]', pattern: '^ghcr\.io/cybozu-go/moco-agent:[0-9.]+@sha256:[0-9a-f]{64}$' }
      - matchRegex: { path: 'spec.template.spec.containers[0].args[3]', pattern: '^ghcr\.io/cybozu-go/moco/fluent-bit:[0-9.]+@sha256:[0-9a-f]{64}$' }
      - matchRegex: { path: 'spec.template.spec.containers[0].args[5]', pattern: '^ghcr\.io/cybozu-go/moco/mysqld_exporter:[0-9.]+@sha256:[0-9a-f]{64}$' }

  - it: an operator image without digest fails the render
    template: templates/controller.yaml
    set:
      moco.image.tag: "0.38.0"
    asserts:
      - failedTemplate: { errorPattern: 'moco.image "ghcr.io/cybozu-go/moco:0.38.0" is not pinned by digest' }

  - it: the operator namespace enforces restricted and joins the ambient mesh (it dials mysqld pods in STRICT cells)
    template: templates/namespace.yaml
    asserts:
      - equal: { path: 'metadata.labels["pod-security.kubernetes.io/enforce"]', value: restricted }
      - equal: { path: 'metadata.labels["istio.io/dataplane-mode"]', value: ambient }
