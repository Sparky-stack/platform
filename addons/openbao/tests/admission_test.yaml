suite: openbao - reader-cert admission guards (CEL semantics are tested with the kyverno CLI in hack/tests/test_mesh_admission.sh)
release: { name: openbao, namespace: openbao }
templates:
  - templates/mesh-admission.yaml
tests:
  - it: renders three ValidatingAdmissionPolicies, each bound with Deny
    asserts:
      - hasDocuments: { count: 6 }
      - isKind: { of: ValidatingAdmissionPolicy }
        documentIndex: 0
      - equal: { path: spec.failurePolicy, value: Fail }
        documentIndex: 0
      - isKind: { of: ValidatingAdmissionPolicyBinding }
        documentIndex: 3
      - equal: { path: spec.validationActions, value: [Deny] }
        documentIndex: 3
      - equal: { path: spec.policyName, value: platform-mesh-issuers }
        documentIndex: 5

  - it: limits *-client-ca certificates to the reader profile (CN, no subject, not CA, client auth, <= 168h)
    documentIndex: 0
    asserts:
      - equal: { path: metadata.name, value: platform-mesh-reader-certificates }
      - matchRegex: { path: 'spec.matchConditions[0].expression', pattern: "endsWith\\('-client-ca'\\)" }
      - matchRegex: { path: 'spec.validations[1].expression', pattern: "commonName == 'platform:istio-reader'" }
      - matchRegex: { path: 'spec.validations[6].expression', pattern: "duration\\('168h'\\)" }

  - it: no mesh-root / intermediate policies remain (the mesh CA is OpenBao, not a cert-manager issuer)
    asserts:
      - notMatchRegex: { path: metadata.name, pattern: 'intermediate' }

  - it: can be switched off
    set:
      admission.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
