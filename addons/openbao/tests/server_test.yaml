suite: openbao - server configuration (upstream chart values)
release: { name: openbao, namespace: openbao }
templates:
  - charts/openbao/templates/server-config-configmap.yaml
  - charts/openbao/templates/server-statefulset.yaml
set:
  mesh: { groups: [local], ca: { host: openbao.example.test, port: 8200 } }
tests:
  - it: static auto-unseal, TLS with auto-reload, raft storage, stdout audit device
    template: charts/openbao/templates/server-config-configmap.yaml
    asserts:
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'seal "static" \{\s+current_key_id = "platform-1"\s+current_key\s+= "file:///openbao/unseal/key"' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'tls_auto_reload\s+= true' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'storage "raft"' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'audit "file" "stdout"' }
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'tls_disable' }

  - it: self-initialisation writes every policy and identity once (Kubernetes auth, audience-bound, 15m)
    template: charts/openbao/templates/server-config-configmap.yaml
    asserts:
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'initialize "kubernetes-auth"' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'initialize "mesh-policies"' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'initialize "mesh-roles"' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path\s+= "auth/kubernetes/role/platform-mesh-config"\s+data = \{\s+bound_service_account_names\s+= \["openbao-mesh-config", "openbao-mesh-bootstrap"\]' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path\s+= "auth/kubernetes/role/platform-mesh-bootstrap"\s+data = \{\s+bound_service_account_names\s+= \["openbao-mesh-bootstrap"\]' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path\s+= "auth/kubernetes/role/mesh-ca-read"\s+data = \{\s+bound_service_account_names\s+= \["eso-openbao-pki-public"\]' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'audience\s+= "openbao"' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'token_max_ttl\s+= "15m"' }

  - it: "member policy: static, templated on the identity entity (sign on its own role in its own group only)"
    template: charts/openbao/templates/server-config-configmap.yaml
    asserts:
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path\s+= "sys/policies/acl/mesh-member"\s+data = \{\s+policy = <<EOP\s+path "pki-mesh-\{\{identity\.entity\.metadata\.group\}\}-int/sign/\{\{identity\.entity\.metadata\.cluster\}\}" \{ capabilities = \["create", "update"\] \}\s+EOP' }
      # + the token self-operations ESO's vault provider performs (token_no_default_policy: the default policy is not
      # attached): lookup-self validates the SecretStore (403 left openbao-pki-public InvalidProviderConfig live),
      # revoke-self when it closes the client. Nothing else.
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path\s+= "sys/policies/acl/mesh-ca-read"\s+data = \{\s+policy = <<EOP\s+path "\+/cert/ca" \{ capabilities = \["read"\] \}\s+path "auth/token/lookup-self" \{ capabilities = \["read"\] \}\s+path "auth/token/revoke-self" \{ capabilities = \["update"\] \}\s+EOP' }

  - it: "reconcile policies: no policy authoring, no key export/import, no verbatim or external CA signing, bounded parameters"
    template: charts/openbao/templates/server-config-configmap.yaml
    asserts:
      # the policy reconciler's two exact grants are the only ones (next test); no other identity may touch sys/policies
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "sys/policy/[^"]*" \{\s*capabilities\s*=\s*\["(create|update|read|list|delete|sudo)' }
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "sys/policies/(?:[^a]|a[^c]|ac[^l]|acl[^/"])[^"]*" \{\s*capabilities\s*=\s*\["(create|update|read|list|delete|sudo)' }
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "sys/policies/acl/(?:[^t]|t[^e]|te[^n]|ten[^a]|tena[^n]|tenan[^t]|tenant[^-])[^"]*" \{\s*capabilities\s*=\s*\["(create|update|read|list|delete|sudo)' }
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "auth/kubernetes/(?:[^r]|r[^o]|ro[^l]|rol[^e]|role[^/]|role/[^t]|role/t[^e]|role/te[^n]|role/ten[^a]|role/tena[^n]|role/tenan[^t]|role/tenant[^-]|role/tenant-[^cw])[^"]*" \{\s*capabilities\s*=\s*\["(create|update)' }
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\*"|path "sys/\*"|path "pki-mesh-\*"|path "\+/\*"|sys/raw|sys/seal|generate-root' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "sys/auth/mesh-\*" \{\s+capabilities\s+= \[[^]]*\]\s+allowed_parameters = \{ "\*" = \[\], "type" = \["jwt"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "auth/mesh-\*" \{\s+capabilities\s+= \[[^]]*\]\s+allowed_parameters = \{ "\*" = \[\], "token_policies" = \["mesh-member"\] \}\s+denied_parameters\s+= \{ "policies" = \[\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "identity/entity/name/mesh-\*" \{\s+capabilities\s+= \[[^]]*\]\s+allowed_parameters = \{ "metadata" = \[\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "sys/mounts/pki-mesh-\*" \{\s+capabilities\s+= \[[^]]*\]\s+allowed_parameters = \{ "\*" = \[\], "type" = \["pki"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/root/sign-intermediate" \{\s+capabilities\s+= \["create", "update"\]\s+required_parameters = \["max_path_length"\]\s+allowed_parameters\s+= \{ "\*" = \[\], "max_path_length" = \["0"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/root/sign-intermediate" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: '"allow_ip_sans" = \["false"\]' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: '"allow_any_name" = \["false"\]' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/intermediate/generate/exported" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/root/generate/exported" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/issuers/import/\*" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/sign-verbatim\*" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/root/sign-self-issued" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/keys/\*" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "\+/root/rotate/\*" \{ capabilities = \["deny"\] \}' }

  - it: "self-init writes no tenant policy or tenant role (the policy reconciler does, from files/policies/)"
    template: charts/openbao/templates/server-config-configmap.yaml
    asserts:
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path\s+= "sys/policies/acl/tenant-' }
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path\s+= "auth/kubernetes/role/tenant-' }

  - it: "policy reconciler: only tenant-* policies and the two tenant roles with every parameter pinned; own role bound to one ServiceAccount"
    template: charts/openbao/templates/server-config-configmap.yaml
    asserts:
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'initialize "policy-reconciler"' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "sys/policies/acl/tenant-\*" \{ capabilities = \["create", "read", "update", "delete"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "sys/policies/acl" \{ capabilities = \["list"\] \}' }
      # exactly two role paths, create/update only (required_parameters also blocks reads), every value pinned
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "auth/kubernetes/role/tenant-config" \{\s+capabilities\s+= \["create", "update"\]\s+required_parameters = \[[^]]*"token_no_default_policy"[^]]*\]\s+allowed_parameters\s+= \{ "bound_service_account_names" = \["openbao-tenant-config"\], "bound_service_account_namespaces" = \["openbao"\], "audience" = \["openbao"\], "token_policies" = \["tenant-config"\], "token_no_default_policy" = \["true"\], "token_ttl" = \["15m"\], "token_max_ttl" = \["15m"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "auth/kubernetes/role/tenant-writer" \{\s+capabilities\s+= \["create", "update"\]\s+required_parameters = \[[^]]*\]\s+allowed_parameters\s+= \{ "bound_service_account_names" = \["\*"\], "bound_service_account_namespaces" = \["openbao-tenants"\], "alias_name_source" = \["serviceaccount_name"\], "audience" = \["openbao"\], "token_policies" = \["tenant-write"\], "token_no_default_policy" = \["true"\], "token_ttl" = \["15m"\], "token_max_ttl" = \["15m"\] \}' }
      - notMatchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "auth/kubernetes/role/tenant-\*"' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "pki-\*" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path "sys/policies/acl/platform-\*" \{ capabilities = \["deny"\] \}' }
      - matchRegex: { path: 'data["extraconfig-from-values.hcl"]', pattern: 'path\s+= "auth/kubernetes/role/platform-policy-reconciler"\s+data = \{\s+bound_service_account_names\s+= \["openbao-policy-reconciler"\]\s+bound_service_account_namespaces = \["openbao"\]\s+audience\s+= "openbao"\s+token_policies\s+= \["platform-policy-reconciler"\]\s+token_no_default_policy\s+= true\s+token_ttl\s+= "5m"' }

  - it: pinned multi-arch image, restricted pod security, seal key and TLS mounted read-only
    template: charts/openbao/templates/server-statefulset.yaml
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].image', value: "quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f" }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }
      - equal: { path: 'spec.template.spec.containers[0].securityContext', value: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } } }
      - contains: { path: 'spec.template.spec.containers[0].volumeMounts', content: { name: unseal, mountPath: /openbao/unseal, readOnly: true } }
      - contains: { path: 'spec.template.spec.containers[0].volumeMounts', content: { name: tls, mountPath: /openbao/tls, readOnly: true } }
      - equal: { path: spec.replicas, value: 1 }
