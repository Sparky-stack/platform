suite: openbao - per-tenant secrets (descriptor inputs, scoped reconcile CronJob)
release: { name: openbao, namespace: openbao }
templates:
  - templates/tenant-secrets.yaml
set:
  mesh: { groups: [local], ca: { host: openbao.example.test, port: 8200 } }
tests:
  - it: off by default (secrets.tenantStores.enabled)
    asserts:
      - hasDocuments: { count: 0 }

  - it: the descriptor store reads only the inputs namespace; the template rejects a descriptor named for another tenant
    set: { secrets.tenantStores.enabled: true }
    asserts:
      - containsDocument: { kind: Namespace, apiVersion: v1, name: openbao-tenants, any: true }
      - equal: { path: spec.provider.kubernetes.remoteNamespace, value: openbao-tenants }
        documentSelector: { path: metadata.name, value: openbao-tenant-source }
      - equal: { path: metadata.namespace, value: openbao-tenants }
        documentSelector: { path: kind, value: Role }
      - equal: { path: spec.dataFrom, value: [{ find: { tags: { openbao.platform.koorikla.io/tenant: "true" } } }] }
        documentSelector: { path: metadata.name, value: tenant-clients }
      - matchRegex: { path: 'spec.target.template.templateFrom[0].literal', pattern: 'if ne \$secret \(printf "%s-openbao-tenant" \$name\)' }
        documentSelector: { path: metadata.name, value: tenant-clients }
      - equal: { path: spec.target.deletionPolicy, value: Retain }
        documentSelector: { path: metadata.name, value: tenant-clients }

  - it: CronJob logs in as tenant-config with a short projected token, no Kubernetes API access, inputs tenants + mesh members
    set: { secrets.tenantStores.enabled: true }
    documentSelector: { path: kind, value: CronJob }
    asserts:
      - equal: { path: metadata.name, value: tenant-reconcile }
      - equal: { path: spec.jobTemplate.spec.template.spec.serviceAccountName, value: openbao-tenant-config }
      - equal: { path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken, value: false }
      - equal: { path: 'spec.jobTemplate.spec.template.spec.containers[0].command', value: [/bin/sh, /scripts/tenant-reconcile.sh] }
      - contains: { path: 'spec.jobTemplate.spec.template.spec.containers[0].env', content: { name: LOGIN_ROLE, value: tenant-config } }
      - contains: { path: 'spec.jobTemplate.spec.template.spec.containers[0].env', content: { name: READER_AUDIENCE, value: openbao-tenant-secrets } }
      - contains: { path: 'spec.jobTemplate.spec.template.spec.containers[0].env', content: { name: WRITER_NS, value: openbao-tenants } }
      - contains: { path: spec.jobTemplate.spec.template.spec.volumes, content: { name: tenants, secret: { secretName: tenant-clients, optional: true } } }
      - contains: { path: spec.jobTemplate.spec.template.spec.volumes, content: { name: clusters, secret: { secretName: mesh-clients, optional: true } } }
      - contains: { path: spec.jobTemplate.spec.template.spec.volumes, content: { name: scripts, configMap: { name: tenant-reconcile } } }
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content: { name: token, projected: { sources: [{ serviceAccountToken: { audience: openbao, expirationSeconds: 600, path: token } }] } }
