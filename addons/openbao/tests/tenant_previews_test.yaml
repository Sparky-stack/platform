suite: openbao - PR previews read their tenant's secrets (Kyverno-generated preview descriptors, #267)
release: { name: openbao, namespace: openbao }
templates:
  - templates/tenant-previews.yaml
  - templates/tenant-secrets.yaml
set:
  mesh: { groups: [local], ca: { host: openbao.example.test, port: 8200 } }
  openchoreo: { orgNamespace: default }
tests:
  - it: needs both tenant stores and previews
    set: { secrets.tenantStores.enabled: true, previews.enabled: false }
    template: templates/tenant-previews.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: a descriptor per preview ProjectReleaseBinding of the org namespace, tenant = its project, kept in sync
    set: { secrets.tenantStores.enabled: true, previews.enabled: true }
    template: templates/tenant-previews.yaml
    documentSelector: { path: kind, value: GeneratingPolicy }
    asserts:
      - equal: { path: spec.evaluation.synchronize.enabled, value: true }
      - equal: { path: "spec.matchConstraints.resourceRules[0].resources", value: [projectreleasebindings] }
      - equal: { path: spec.matchConstraints.objectSelector, value: { matchLabels: { platform.koorikla.io/preview: "true" } } }
      - equal: { path: "spec.matchConditions[0].expression", value: "object.metadata.namespace == 'default'" }
      - equal: { path: "spec.variables[0].expression", value: object.spec.owner.projectName }
      - matchRegex: { path: "spec.variables[2].expression", pattern: '"name": variables.project \+ "-openbao-tenant-" \+ variables.environment' }
      - matchRegex: { path: "spec.variables[2].expression", pattern: '"openbao.platform.koorikla.io/tenant": "true"' }
      - equal: { path: "spec.generate[0].expression", value: 'generator.Apply("openbao-tenants", variables.downstream)' }

  - it: Kyverno writes Secrets only in the inputs namespace (Role), reads bindings cluster-wide
    set: { secrets.tenantStores.enabled: true, previews.enabled: true }
    template: templates/tenant-previews.yaml
    asserts:
      - equal: { path: metadata.namespace, value: openbao-tenants }
        documentSelector: { path: kind, value: Role }
      - equal: { path: subjects, value: [{ kind: ServiceAccount, name: kyverno-background-controller, namespace: kyverno }] }
        documentSelector: { path: kind, value: RoleBinding }
      - equal: { path: rules, value: [{ apiGroups: [openchoreo.dev], resources: [projectreleasebindings], verbs: [get, list, watch] }] }
        documentSelector: { path: kind, value: ClusterRole }
      # background (generate) AND reports controller: without the latter the policy never turns Ready and Argo's
      # openbao sync stalls on a clean bootstrap
      - equal:
          path: metadata.labels["rbac.kyverno.io/aggregate-to-background-controller"]
          value: "true"
        documentSelector: { path: kind, value: ClusterRole }
      - equal:
          path: metadata.labels["rbac.kyverno.io/aggregate-to-reports-controller"]
          value: "true"
        documentSelector: { path: kind, value: ClusterRole }

  - it: the reconcile computes preview namespaces in the installation's org namespace
    set: { secrets.tenantStores.enabled: true, openchoreo.orgNamespace: acme }
    template: templates/tenant-secrets.yaml
    documentSelector: { path: kind, value: CronJob }
    asserts:
      - contains: { path: "spec.jobTemplate.spec.template.spec.containers[0].env", content: { name: ORG_NAMESPACE, value: acme } }

  - it: RBAC syncs before the GeneratingPolicy (Kyverno checks RBACPermissionsGranted only when the policy changes)
    set: { secrets.tenantStores.enabled: true, previews.enabled: true }
    template: templates/tenant-previews.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        documentSelector: { path: kind, value: ClusterRole }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        documentSelector: { path: kind, value: Role }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        documentSelector: { path: kind, value: RoleBinding }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
        documentSelector: { path: kind, value: GeneratingPolicy }
