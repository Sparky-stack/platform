{{- /*
Gateway + TLSRoute on mgmt (kgateway, TLS passthrough): members dial SNI mesh.ca.host on port mesh.ca.port and reach
Service <release>-active:8200 (the raft leader). OpenBao terminates TLS itself (openbao-tls), so the gateway never sees
a token or a CSR. Same pattern as OpenSearch on the observability plane.
Locally klipper binds the port as a hostPort and k3d publishes it on 127.0.0.1 (bootstrap/k3d-mgmt.yaml). Elsewhere
mesh.ca.host is a DNS name (external-dns gateway-tlsroute source) and gateway.loadBalancerSourceRanges (the members'
egress CIDRs) is REQUIRED - templates/validate.yaml fails the render, same rule as the addon mesh east-west gateway - because the listener
exposes the whole API, including unauthenticated sys/health, sys/seal-status and the logins. kgateway applies the ranges
to the proxy Service through GatewayParameters (spec.infrastructure.parametersRef).
*/ -}}
{{- $g := .Values.gateway }}
{{- with $g.loadBalancerSourceRanges }}
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: {{ $g.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" $ | nindent 4 }}
spec:
  kube:
    service:
      loadBalancerSourceRanges:
        {{- toYaml . | nindent 8 }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $g.className }}
  {{- if $g.loadBalancerSourceRanges }}
  infrastructure:
    parametersRef: { group: gateway.kgateway.dev, kind: GatewayParameters, name: {{ $g.name }} }
  {{- end }}
  listeners:
    - name: tls
      protocol: TLS
      port: {{ include "openbao-addon.port" . }}
      hostname: {{ include "openbao-addon.host" . | quote }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $g.name }}
      namespace: {{ .Release.Namespace }}
      sectionName: tls
  hostnames:
    - {{ include "openbao-addon.host" . | quote }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ printf "%s-active" .Release.Name }}
          port: 8200
