{{- /*
Members reach OpenBao through a kgateway TLS passthrough listener (same pattern as OpenSearch on the observability
plane): SNI mesh.ca.host on port mesh.ca.port -> Service <release>-active:8200 (the raft leader). OpenBao terminates
TLS itself with openbao-tls, so the gateway never sees a token or a CSR. kgateway provisions the proxy Deployment +
Service (type LoadBalancer; klipper binds the listener port as a hostPort on mgmt, k3d publishes it on the serverlb:
bootstrap/k3d-mgmt.yaml, bound to 127.0.0.1 on the host). Real installations: a DNS name for mesh.ca.host (external-dns
gateway-tlsroute source) and gateway.loadBalancerSourceRanges = the members' egress CIDRs, REQUIRED outside docker
(the render fails, same rule as addon mesh east-west gateway): the listener exposes the whole OpenBao API, including the
unauthenticated sys/health, sys/seal-status and the login endpoints. kgateway applies the ranges to the proxy Service
through GatewayParameters (spec.infrastructure.parametersRef).
*/ -}}
{{- $g := .Values.gateway }}
{{- if and (ne .Values.cluster.provider "docker") (empty $g.loadBalancerSourceRanges) }}
{{- fail (printf "openbao (%s, provider %s): gateway.loadBalancerSourceRanges is required outside docker - the mesh members' egress CIDRs (installations/<inst>/addons/openbao/values.yaml)" .Values.cluster.name .Values.cluster.provider) }}
{{- end }}
{{- with $g.loadBalancerSourceRanges }}
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: {{ $g.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" $ | nindent 4 }}
spec:
  kube:
    service:
      loadBalancerSourceRanges:
        {{- toYaml . | nindent 8 }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $g.className }}
  {{- if $g.loadBalancerSourceRanges }}
  infrastructure:
    parametersRef: { group: gateway.kgateway.dev, kind: GatewayParameters, name: {{ $g.name }} }
  {{- end }}
  listeners:
    - name: tls
      protocol: TLS
      port: {{ include "openbao-addon.port" . }}
      hostname: {{ include "openbao-addon.host" . | quote }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $g.name }}
      namespace: {{ .Release.Namespace }}
      sectionName: tls
  hostnames:
    - {{ include "openbao-addon.host" . | quote }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ printf "%s-active" .Release.Name }}
          port: 8200
