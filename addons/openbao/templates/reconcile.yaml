{{- /*
Mesh reconcile on mgmt: files/mesh-reconcile.sh as a Sync hook Job (wave 1) and a CronJob (drift, new members).
OpenBao has no CRDs and self-init runs once, so a script applies group CAs, member PKI roles, entities and JWT auth.
  Job (Sync hook)  bootstrapServiceAccount: role platform-mesh-bootstrap (group CAs; CA-equivalent, so never on a
                   schedule), then platform-mesh-config
  CronJob          serviceAccount: role platform-mesh-config only (no key, no signing, no policy writes)
Both administer the CA: protect namespace openbao (who may create pods there may use them).
*/ -}}
{{- $r := .Values.reconcile }}
{{- $groups := include "openbao-addon.groups" . | fromJsonArray }}
{{- $p := .Values.pki }}
{{- $m := .Values.memberAuth }}
{{- $env := concat (include "openbao-addon.reconcileBaseEnv" (dict "root" . "dirName" "INPUT_DIR" "dirValue" "/inputs" "loginRole" $r.loginRole) | fromJsonArray) (list
  (dict "name" "MESH_GROUPS" "value" (join " " $groups))
  (dict "name" "INSTALLATION" "value" .Values.installation.name)
  (dict "name" "TRUST_DOMAIN" "value" $p.trustDomain)
  (dict "name" "ALLOWED_DOMAINS" "value" (join "," $p.allowedDomains))
  (dict "name" "WORKLOAD_TTL" "value" $p.workloadTTL)
  (dict "name" "WORKLOAD_MAX_TTL" "value" $p.workloadMaxTTL)
  (dict "name" "ROOT_TTL" "value" $p.rootTTL)
  (dict "name" "INT_TTL" "value" $p.intermediateTTL)
  (dict "name" "KEY_TYPE" "value" $p.keyType)
  (dict "name" "ROOT_KEY_BITS" "value" (toString $p.rootKeyBits))
  (dict "name" "INT_KEY_BITS" "value" (toString $p.intermediateKeyBits))
  (dict "name" "MEMBER_SA" "value" $m.serviceAccount)
  (dict "name" "MEMBER_AUDIENCE" "value" $m.audience)
  (dict "name" "MEMBER_ROLE" "value" $m.role)
  (dict "name" "MEMBER_POLICY" "value" $m.policy)
  (dict "name" "MEMBER_TOKEN_TTL" "value" $m.tokenTTL)
) }}
{{- $jobEnv := concat $env (list
  (dict "name" "BOOTSTRAP_LOGIN_ROLE" "value" $r.bootstrapLoginRole)
  (dict "name" "FAIL_ON_NO_MEMBER" "value" "false")) }}
{{- $cronEnv := append $env (dict "name" "FAIL_ON_NO_MEMBER" "value" "true") }}
{{- include "openbao-addon.serviceAccount" (dict "root" . "name" $r.serviceAccount) }}
---
{{- include "openbao-addon.serviceAccount" (dict "root" . "name" $r.bootstrapServiceAccount) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
data:
  mesh-reconcile.sh: |
    {{- .Files.Get "files/mesh-reconcile.sh" | nindent 4 }}
{{- $inputs := list (dict "name" "inputs" "secret" .Values.meshClients.secretName "path" "/inputs") }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mesh-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    # Sync hook in wave 1 (after OpenBao, wave 0, is Ready), NOT PostSync: PostSync waits for every resource to be
    # Healthy, and openbao-ca-bundle cannot be before this Job created the group roots (bootstrap deadlock).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10                 # OpenBao may still be starting / self-initialising on the first sync
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: { app.kubernetes.io/name: mesh-reconcile }
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get "files/mesh-reconcile.sh") (toJson $jobEnv) | sha256sum | trunc 16 }}
    spec:
      {{- include "openbao-addon.reconcilePod" (dict "root" $ "sa" $r.bootstrapServiceAccount "env" $jobEnv "script" "mesh-reconcile" "inputs" $inputs) | nindent 6 }}
---
{{- include "openbao-addon.reconcileCronJob" (dict "root" $ "name" "mesh-reconcile" "schedule" $r.schedule "sa" $r.serviceAccount "env" $cronEnv "inputs" $inputs) }}
