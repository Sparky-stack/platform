{{- /*
Mesh reconcile on mgmt: files/mesh-reconcile.sh as an Argo CD Sync hook Job (wave 1, every sync) and as a CronJob
(reconcile.schedule: new/removed members, drift). It applies the mesh PKI from installation.yaml groups and the fleet
members (group CAs, per-member PKI role, identity entity, JWT auth); OpenBao has no CRDs and self-init runs only once.
Why POSIX sh + the bao CLI of the OpenBao image (~150 lines): OpenTofu/Terraform needs a state backend and an admin
credential on mgmt; the young OpenBao config operators have no release and no stable PKI + JWT auth CRDs yet.
Identities (projected tokens, audience reconcile.audience, 10 minutes, exchanged for 15-minute OpenBao tokens). No root
token, and the reconcile authors no ACL policy (all static, written once by self-initialisation):
  Job (Sync hook) ServiceAccount reconcile.bootstrapServiceAccount: logs in twice. Role platform-mesh-bootstrap creates
                  missing group CAs (internal keys; signing the intermediate is CA-equivalent, so this identity never
                  runs on a schedule), then role platform-mesh-config enrols the members.
  CronJob         ServiceAccount reconcile.serviceAccount: role platform-mesh-config only (jwt mounts mesh-*, PKI roles
                  with pinned flags, identity entities mesh-*). It cannot generate, import, export or sign with a CA key
                  and cannot write a policy (negative tests: hack/tests/openbao_integration.sh).
Both are CA-administration identities nonetheless: protect namespace openbao (who may create pods there may use them).
*/ -}}
{{- $r := .Values.reconcile }}
{{- $groups := include "openbao-addon.groups" . | fromJsonArray }}
{{- $p := .Values.pki }}
{{- $m := .Values.memberAuth }}
{{- $env := list
  (dict "name" "BAO_ADDR" "value" (printf "https://%s-active.%s.svc:8200" .Release.Name .Release.Namespace))
  (dict "name" "BAO_CACERT" "value" "/openbao/tls/ca.crt")
  (dict "name" "HOME" "value" "/tmp")
  (dict "name" "INPUT_DIR" "value" "/inputs")
  (dict "name" "TOKEN_FILE" "value" "/var/run/secrets/openbao/token")
  (dict "name" "LOGIN_ROLE" "value" $r.loginRole)
  (dict "name" "MESH_GROUPS" "value" (join " " $groups))
  (dict "name" "INSTALLATION" "value" .Values.installation.name)
  (dict "name" "TRUST_DOMAIN" "value" $p.trustDomain)
  (dict "name" "ALLOWED_DOMAINS" "value" (join "," $p.allowedDomains))
  (dict "name" "WORKLOAD_TTL" "value" $p.workloadTTL)
  (dict "name" "WORKLOAD_MAX_TTL" "value" $p.workloadMaxTTL)
  (dict "name" "ROOT_TTL" "value" $p.rootTTL)
  (dict "name" "INT_TTL" "value" $p.intermediateTTL)
  (dict "name" "KEY_TYPE" "value" $p.keyType)
  (dict "name" "ROOT_KEY_BITS" "value" (toString $p.rootKeyBits))
  (dict "name" "INT_KEY_BITS" "value" (toString $p.intermediateKeyBits))
  (dict "name" "MEMBER_SA" "value" $m.serviceAccount)
  (dict "name" "MEMBER_AUDIENCE" "value" $m.audience)
  (dict "name" "MEMBER_ROLE" "value" $m.role)
  (dict "name" "MEMBER_POLICY" "value" $m.policy)
  (dict "name" "MEMBER_TOKEN_TTL" "value" $m.tokenTTL)
}}
{{- $jobEnv := concat $env (list
  (dict "name" "BOOTSTRAP_LOGIN_ROLE" "value" $r.bootstrapLoginRole)
  (dict "name" "FAIL_ON_NO_MEMBER" "value" "false")) }}
{{- $cronEnv := append $env (dict "name" "FAIL_ON_NO_MEMBER" "value" "true") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $r.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $r.bootstrapServiceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
data:
  mesh-reconcile.sh: |
    {{- .Files.Get "files/mesh-reconcile.sh" | nindent 4 }}
{{- $inputs := list (dict "name" "inputs" "secret" .Values.meshClients.secretName "path" "/inputs") }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mesh-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    # Sync hook in wave 1 (after OpenBao, wave 0, is Ready), NOT PostSync: PostSync waits for every resource to be
    # Healthy, and openbao-ca-bundle cannot be before this Job created the group roots (bootstrap deadlock).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10                 # OpenBao may still be starting / self-initialising on the first sync
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: { app.kubernetes.io/name: mesh-reconcile }
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get "files/mesh-reconcile.sh") (toJson $jobEnv) | sha256sum | trunc 16 }}
    spec:
      {{- include "openbao-addon.reconcilePod" (dict "root" $ "sa" $r.bootstrapServiceAccount "env" $jobEnv "script" "mesh-reconcile" "inputs" $inputs) | nindent 6 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mesh-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    # Final wave (no hook in it): a run fails until a group CA exists or while every member is unreachable, i.e. the
    # CronJob may be Degraded. Argo CD fails a sync on a Degraded resource of an earlier wave, not of the final one.
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: {{ $r.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: { app.kubernetes.io/name: mesh-reconcile }
        spec:
          {{- include "openbao-addon.reconcilePod" (dict "root" $ "sa" $r.serviceAccount "env" $cronEnv "script" "mesh-reconcile" "inputs" $inputs) | nindent 10 }}
