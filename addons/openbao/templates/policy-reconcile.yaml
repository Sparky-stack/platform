{{- /*
CronJob policy-reconcile on mgmt (with secrets.tenantStores.enabled; #96, docs/multicluster.md "Policies from git: the
policy reconciler"): writes every files/policies/tenant-*.hcl and the auth roles tenant-config / tenant-writer at any
time, without re-initialising OpenBao.
Its identity (ServiceAccount policyReconciler.serviceAccount, self-init role platform-policy-reconciler) may write only
sys/policies/acl/tenant-* and those two roles with every parameter pinned, so the render fails on any other policy file
(OpenBao would answer 403). Final wave, like tenant-reconcile: a failing run never fails a sync.
*/ -}}
{{- if (((.Values.secrets).tenantStores).enabled) }}
{{- $p := .Values.policyReconciler }}
{{- $t := .Values.tenantSecrets }}
{{- $ns := .Release.Namespace }}
{{- $r := .Values.reconcile }}
{{- $files := .Files.Glob "files/policies/*.hcl" }}
{{- if not $files }}{{ fail "openbao: files/policies/ has no policy" }}{{ end }}
{{- include "openbao-addon.serviceAccount" (dict "root" . "name" $p.serviceAccount) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-reconcile
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
data:
  policy-reconcile.sh: |
    {{- .Files.Get "files/policy-reconcile.sh" | nindent 4 }}
  {{- range $path, $_ := $files }}
  {{- $name := base $path }}
  {{- if not (regexMatch "^tenant-[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.hcl$" $name) }}
  {{- fail (printf "openbao: files/policies/%s: the policy reconciler may only write tenant-* policies (others: self-initialisation)" $name) }}
  {{- end }}
  {{ $name }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- $env := concat (include "openbao-addon.reconcileBaseEnv" (dict "root" . "dirName" "POLICY_DIR" "dirValue" "/scripts" "loginRole" $p.loginRole) | fromJsonArray) (list
  (dict "name" "CONFIG_SA" "value" $t.serviceAccount)
  (dict "name" "CONFIG_NS" "value" $ns)
  (dict "name" "WRITER_NS" "value" $t.inputsNamespace)
  (dict "name" "AUDIENCE" "value" $r.audience)
  (dict "name" "ROLE_TTL" "value" $p.roleTTL)
) }}
{{- $checksum := printf "%s%s%s" (.Files.Get "files/policy-reconcile.sh") (toJson $env) (toJson $files) | sha256sum | trunc 16 }}
---
{{- include "openbao-addon.reconcileCronJob" (dict "root" $ "name" "policy-reconcile" "schedule" $t.schedule "sa" $p.serviceAccount "env" $env "inputs" list "checksum" $checksum) }}
{{- end }}
