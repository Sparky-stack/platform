{{- /*
ExternalSecret mesh-clients on mgmt: every mesh member's PUBLIC auth data (fleet Secrets <cluster>-mesh-openbao from
charts/cluster mesh-openbao.yaml, found by label meshClients.label via ClusterSecretStore mgmt-fleet), flattened into
the files the mesh-reconcile Job mounts: <cluster>.group, <cluster>.server (API server URL), <cluster>.ca (cluster CA
cert).
Retain: a store error keeps the last list; the reconcile never prunes on an empty list either.
A Secret not named exactly <cluster>-mesh-openbao becomes rejected.<secret name> = reason (the reconcile logs it and
counts it as invalid: no auth mount, no entity), so one Secret cannot claim another cluster's inputs. This does NOT
authenticate the writer: any labelled Secret <x>-mesh-openbao in fleet enrols member <x> with its own JWKS, so write
access to Secrets in fleet is mesh-CA admin access (fleet also holds every kubeconfig; docs/multicluster.md "Who may do
what in OpenBao").
*/ -}}
{{- $m := .Values.meshClients }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $m.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $m.store }}
  target:
    name: {{ $m.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
            {{`{{- range $secret, $json := . }}`}}
            {{`{{- $c := $json | fromJson }}`}}
            {{`{{- $name := toString (get $c "cluster") }}`}}
            {{`{{- if ne $secret (printf "%s-mesh-openbao" $name) }}`}}
            {{`rejected.{{ $secret }}: {{ printf "cluster %q does not match the Secret name (want <cluster>-mesh-openbao)" $name | toJson }}`}}
            {{`{{- else }}`}}
            {{`{{ $name }}.group: {{ get $c "group" | toJson }}`}}
            {{`{{ $name }}.server: {{ get $c "server" | toJson }}`}}
            {{`{{ $name }}.ca: {{ get $c "ca" | toJson }}`}}
            {{`{{- end }}`}}
            {{`{{- end }}`}}
  dataFrom:
    - find:
        tags:
          {{ $m.label }}: "true"
