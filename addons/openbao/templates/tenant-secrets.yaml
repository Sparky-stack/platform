{{- /*
Per-tenant secrets in OpenBao (installation.yaml secrets.tenantStores.enabled; docs/multicluster.md "Tenant secrets
(OpenBao)"). Everything a tenant may read is decided here and in files/tenant-reconcile.sh; the policies themselves
are files/policies/ (written by templates/policy-reconcile.yaml): tenant-read / tenant-write, templated on entity
metadata `tenant`.
  Namespace tenantSecrets.inputsNamespace  charts/tenant renders per tenant: Secret <tenant>-openbao-tenant (label
                                           tenantSecrets.label; data tenant + namespaces = its cell namespaces on the
                                           data planes) and ServiceAccount <tenant>-writer (OpenBao role tenant-writer).
                                           Write access to Secrets here is tenant-admin access: protect it like openbao.
  SecretStore openbao-tenant-source        kubernetes provider, list/get/watch of Secrets in that namespace only (the
                                           descriptors are not secret; besides them only the public CA openbao-ca)
  ExternalSecret tenant-clients            descriptors found by label -> <tenant>.namespaces; a Secret not named
                                           <tenant>-openbao-tenant becomes rejected.<secret> (one descriptor cannot
                                           claim another tenant's name)
  ExternalSecret <inputs ns>/openbao-ca    OpenBao's CA certificate (public; ClusterSecretStore caPublic.store, key
                                           caPublic.secretName) for pods there that call OpenBao as a tenant's writer
                                           (charts/tenant demo-secrets.yaml); not labelled, so never a descriptor
  CronJob tenant-reconcile                 files/tenant-reconcile.sh with ServiceAccount tenantSecrets.serviceAccount
                                           (role tenant-config); inputs: tenant-clients + mesh-clients (the
                                           member clusters whose JWKS the tenant logins are verified against)
*/ -}}
{{- if (((.Values.secrets).tenantStores).enabled) }}
{{- $t := .Values.tenantSecrets }}
{{- $ns := .Release.Namespace }}
{{- $r := .Values.reconcile }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-openbao-tenants
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-openbao-tenants
  namespace: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-openbao-tenants
  namespace: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-openbao-tenants }
subjects:
  - { kind: ServiceAccount, name: eso-openbao-tenants, namespace: {{ $ns }} }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-tenant-source
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $t.inputsNamespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-openbao-tenants
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $t.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: openbao-tenant-source }
  target:
    name: {{ $t.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain         # a store error keeps the last list; the reconcile never prunes on an empty one
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
            {{`{{- range $secret, $json := . }}`}}
            {{`{{- $d := $json | fromJson }}`}}
            {{`{{- $name := toString (get $d "tenant") }}`}}
            {{`{{- if ne $secret (printf "%s-openbao-tenant" $name) }}`}}
            {{`rejected.{{ $secret }}: {{ printf "tenant %q does not match the Secret name (want <tenant>-openbao-tenant)" $name | toJson }}`}}
            {{`{{- else }}`}}
            {{`{{ $name }}.namespaces: {{ get $d "namespaces" | toJson }}`}}
            {{`{{- end }}`}}
            {{`{{- end }}`}}
  dataFrom:
    - find:
        tags:
          {{ $t.label }}: "true"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-ca
  namespace: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.caPublic.store }} }
  target:
    name: openbao-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef: { key: {{ .Values.caPublic.secretName }}, property: ca.crt }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $t.serviceAccount }}
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-reconcile
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
data:
  tenant-reconcile.sh: |
    {{- .Files.Get "files/tenant-reconcile.sh" | nindent 4 }}
{{- $env := list
  (dict "name" "BAO_ADDR" "value" (printf "https://%s-active.%s.svc:8200" .Release.Name $ns))
  (dict "name" "BAO_CACERT" "value" "/openbao/tls/ca.crt")
  (dict "name" "HOME" "value" "/tmp")
  (dict "name" "INPUT_DIR" "value" "/inputs")
  (dict "name" "TOKEN_FILE" "value" "/var/run/secrets/openbao/token")
  (dict "name" "LOGIN_ROLE" "value" $t.loginRole)
  (dict "name" "READER_SA" "value" $t.readerServiceAccount)
  (dict "name" "READER_AUDIENCE" "value" $t.audience)
  (dict "name" "READER_POLICY" "value" $t.readerPolicy)
  (dict "name" "TOKEN_TTL" "value" $t.tokenTTL)
  (dict "name" "WRITER_NS" "value" $t.inputsNamespace)
}}
{{- $inputs := list
  (dict "name" "tenants" "secret" $t.secretName "path" "/inputs/tenants")
  (dict "name" "clusters" "secret" .Values.meshClients.secretName "path" "/inputs/clusters") }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tenant-reconcile
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"    # final wave: a failing run (e.g. no member reachable) never fails the sync
spec:
  schedule: {{ $t.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: { app.kubernetes.io/name: tenant-reconcile }
          annotations:
            checksum/config: {{ printf "%s%s" (.Files.Get "files/tenant-reconcile.sh") (toJson $env) | sha256sum | trunc 16 }}
        spec:
          {{- include "openbao-addon.reconcilePod" (dict "r" $r "env" $env "sa" $t.serviceAccount "img" .Values.openbao.server.image "tlsSecret" .Values.tls.secretName "script" "tenant-reconcile" "inputs" $inputs) | nindent 10 }}
{{- end }}
