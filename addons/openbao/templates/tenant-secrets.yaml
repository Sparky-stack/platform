{{- /*
Per-tenant secrets on mgmt (with secrets.tenantStores.enabled; docs/multicluster.md "Tenant secrets (OpenBao)"):
namespace tenantSecrets.inputsNamespace, the ESO plumbing that collects the tenant descriptors from it (SecretStore
openbao-tenant-source -> ExternalSecret tenant-clients) and CronJob tenant-reconcile (files/tenant-reconcile.sh).
charts/tenant renders per tenant into that namespace: descriptor Secret <tenant>-openbao-tenant (data tenant +
namespaces = its cell namespaces on the data planes) and ServiceAccount <tenant>-writer (role tenant-writer). Write
access to Secrets there is tenant-admin access: protect it like namespace openbao.
A descriptor not named <tenant>-openbao-tenant becomes rejected.<secret>, so one descriptor cannot claim another
tenant's name. PR previews (#267): Kyverno generates <tenant>-openbao-tenant-<environment> (data tenant + environment,
templates/tenant-previews.yaml) per preview ProjectReleaseBinding; they become <tenant>.previews, and the reconcile
computes those cell namespaces itself. ExternalSecret openbao-ca there (OpenBao's public CA for charts/tenant demo-secrets.yaml) is unlabelled,
so never a descriptor. The reconcile (role tenant-config) also mounts mesh-clients: tenant logins are verified against
the member clusters' JWKS. Policies tenant-read / tenant-write: files/policies/ (policy-reconcile.yaml).
*/ -}}
{{- if (((.Values.secrets).tenantStores).enabled) }}
{{- $t := .Values.tenantSecrets }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
---
{{- include "openbao-addon.serviceAccount" (dict "root" . "name" "eso-openbao-tenants") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-openbao-tenants
  namespace: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-openbao-tenants
  namespace: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-openbao-tenants }
subjects:
  - { kind: ServiceAccount, name: eso-openbao-tenants, namespace: {{ $ns }} }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-tenant-source
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  provider:
    {{- include "koorikla-lib.esoKubernetesProvider" (dict "remoteNamespace" $t.inputsNamespace
      "serviceAccount" "eso-openbao-tenants") | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $t.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: openbao-tenant-source }
  target:
    name: {{ $t.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain         # a store error keeps the last list; the reconcile never prunes on an empty one
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
            {{`{{- $previews := dict }}`}}
            {{`{{- range $secret, $json := . }}`}}
            {{`{{- $d := $json | fromJson }}`}}
            {{`{{- $name := toString (get $d "tenant") }}`}}
            {{`{{- $env := toString (get $d "environment") }}`}}
            {{`{{- if and $env (eq $secret (printf "%s-openbao-tenant-%s" $name $env)) }}`}}
            {{`{{- $_ := set $previews $name (trim (printf "%s %s" (get $previews $name) $env)) }}`}}
            {{`{{- else if $env }}`}}
            {{`rejected.{{ $secret }}: {{ printf "preview of tenant %q does not match the Secret name (want <tenant>-openbao-tenant-<environment>)" $name | toJson }}`}}
            {{`{{- else if ne $secret (printf "%s-openbao-tenant" $name) }}`}}
            {{`rejected.{{ $secret }}: {{ printf "tenant %q does not match the Secret name (want <tenant>-openbao-tenant)" $name | toJson }}`}}
            {{`{{- else }}`}}
            {{`{{ $name }}.namespaces: {{ get $d "namespaces" | toJson }}`}}
            {{`{{- end }}`}}
            {{`{{- end }}`}}
            {{`{{- range $name, $envs := $previews }}`}}
            {{`{{ $name }}.previews: {{ $envs | toJson }}`}}
            {{`{{- end }}`}}
  dataFrom:
    - find:
        tags:
          {{ $t.label }}: "true"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-ca
  namespace: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    # With openbao-ca-bundle (wave 2, templates/pki.yaml), which it reads (ESO retries until it exists): in wave 0 it
    # is Degraded on a clean
    # bootstrap and Argo never reaches wave 2 (first-boot deadlock).
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.caPublic.store }} }
  target:
    name: openbao-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef: { key: {{ .Values.caPublic.secretName }}, property: ca.crt }
---
{{- include "openbao-addon.serviceAccount" (dict "root" . "name" $t.serviceAccount) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-reconcile
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
data:
  tenant-reconcile.sh: |
    {{- .Files.Get "files/tenant-reconcile.sh" | nindent 4 }}
{{- $env := concat (include "openbao-addon.reconcileBaseEnv" (dict "root" . "dirName" "INPUT_DIR" "dirValue" "/inputs" "loginRole" $t.loginRole) | fromJsonArray) (list
  (dict "name" "READER_SA" "value" $t.readerServiceAccount)
  (dict "name" "READER_AUDIENCE" "value" $t.audience)
  (dict "name" "READER_POLICY" "value" $t.readerPolicy)
  (dict "name" "TOKEN_TTL" "value" $t.tokenTTL)
  (dict "name" "WRITER_NS" "value" $t.inputsNamespace)
  (dict "name" "ORG_NAMESPACE" "value" (((.Values.openchoreo).orgNamespace) | default "default"))
) }}
{{- $inputs := list
  (dict "name" "tenants" "secret" $t.secretName "path" "/inputs/tenants")
  (dict "name" "clusters" "secret" .Values.meshClients.secretName "path" "/inputs/clusters") }}
{{- $checksum := printf "%s%s" (.Files.Get "files/tenant-reconcile.sh") (toJson $env) | sha256sum | trunc 16 }}
---
{{- include "openbao-addon.reconcileCronJob" (dict "root" $ "name" "tenant-reconcile" "schedule" $t.schedule "sa" $t.serviceAccount "env" $env "inputs" $inputs "checksum" $checksum) }}
{{- end }}
