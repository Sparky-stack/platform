{{- /*
Static auto-unseal key (OpenBao seal "static": AES-256-GCM, 64 hex characters) from ClusterSecretStore `platform`
(key openbao-unseal, seeded by `make secrets` locally). Mounted read-only into the OpenBao pods only. Losing it means
losing the data (no recovery keys exist with self-initialisation); back it up with the secret backend. Production:
cloud KMS seal instead (docs/multicluster.md "Mesh CA (OpenBao)").
*/ -}}
{{- $u := .Values.unseal }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $u.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $u.store }}
  target:
    name: {{ $u.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain        # never delete the seal key because the backend blinked
  data:
    - secretKey: key
      remoteRef: { key: {{ $u.remoteKey }}, property: {{ $u.property }} }
