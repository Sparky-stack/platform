{{- /*
ExternalSecret openbao-unseal on mgmt: the static auto-unseal key (seal "static", AES-256-GCM, 64 hex characters) from
ClusterSecretStore `platform` (key openbao-unseal, seeded by `task secrets` locally), mounted only into the OpenBao
pods.
Losing it loses the data: self-initialisation creates no recovery keys. Back it up with the secret backend. Production:
a cloud KMS seal instead (docs/multicluster.md "Mesh CA (OpenBao)").
*/ -}}
{{- $u := .Values.unseal }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $u.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    # Before the StatefulSet (wave 0) that mounts this Secret: if ESO's webhook is not ready yet on a fresh bootstrap,
    # this wave fails and Argo CD retries, instead of applying the StatefulSet and waiting forever on a pod stuck on
    # the missing volume.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $u.store }}
  target:
    name: {{ $u.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain        # never delete the seal key because the backend blinked
  data:
    - secretKey: key
      remoteRef: { key: {{ $u.remoteKey }}, property: {{ $u.property }} }
