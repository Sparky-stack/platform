{{- /*
ValidatingAdmissionPolicies for the remote-secret reader certs (docs/multicluster.md "Admission guards"): the
<name>-client-ca Issuers wrap a workload cluster's k3s client CA, and cert-manager approves and signs anything (e.g.
O=system:masters). Admit exactly what charts/cluster mesh-remote-secret.yaml renders:
  platform-mesh-reader-certificates    Certificates: CN=<readerUser>, client auth only, not a CA, <= readerMaxDuration
  platform-mesh-certificaterequests    CertificateRequests: created by cert-manager's controller only, same limits
  platform-mesh-issuers                a <name>-cca Secret backs only Issuer fleet/<name>-client-ca
  platform-openbao-fleet-reads         store mgmt-fleet only finds the members' public OpenBao inputs by label
*/ -}}
{{- $a := .Values.admission }}
{{- if $a.enabled }}
{{- $labels := dict "app.kubernetes.io/part-of" "istio-mesh" }}
{{- $m := .Values.meshClients }}
{{- $clientIssuer := "has(object.spec.issuerRef) && object.spec.issuerRef.name.endsWith('-client-ca') && (!has(object.spec.issuerRef.kind) || object.spec.issuerRef.kind == 'Issuer')" }}
{{- $noSANs := "!has(object.spec.dnsNames) && !has(object.spec.ipAddresses) && !has(object.spec.uris) && !has(object.spec.emailAddresses) && !has(object.spec.otherNames)" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-mesh-reader-certificates
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cert-manager.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [certificates]
  matchConditions:
    - name: client-ca-issuer
      expression: {{ $clientIssuer | quote }}
  validations:
    - expression: {{ printf "object.metadata.namespace == '%s'" $a.readerNamespace | quote }}
      message: {{ printf "certificates from a *-client-ca issuer live in %s only" $a.readerNamespace | quote }}
    - expression: {{ printf "has(object.spec.commonName) && object.spec.commonName == '%s'" $a.readerUser | quote }}
      message: {{ printf "*-client-ca issuers sign only CN=%s (the mesh reader identity)" $a.readerUser | quote }}
    - expression: "!has(object.spec.subject) && !has(object.spec.literalSubject)"
      message: "no subject (O = Kubernetes groups, e.g. system:masters) on *-client-ca certificates"
    - expression: {{ $noSANs | quote }}
      message: "no SANs on *-client-ca certificates"
    - expression: "!has(object.spec.isCA) || object.spec.isCA == false"
      message: "*-client-ca issuers never sign a CA"
    - expression: "has(object.spec.usages) && size(object.spec.usages) > 0 && object.spec.usages.all(u, u in ['client auth', 'digital signature'])"
      message: "usages must be client auth / digital signature only"
    - expression: {{ printf "has(object.spec.duration) && duration(object.spec.duration) <= duration('%s')" $a.readerMaxDuration | quote }}
      message: {{ printf "duration must be set and <= %s (client certs cannot be revoked)" $a.readerMaxDuration | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-mesh-certificaterequests
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cert-manager.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [certificaterequests]
  matchConditions:
    - name: client-ca-issuer
      expression: {{ $clientIssuer | quote }}
  validations:
    - expression: {{ printf "request.operation != 'CREATE' || request.userInfo.username in %s" (toJson $a.requestCreators) | quote }}
      message: "reader CertificateRequests are created only by cert-manager from an admitted Certificate"
    - expression: {{ printf "object.metadata.namespace == '%s'" $a.readerNamespace | quote }}
      message: {{ printf "reader CertificateRequests live in %s only" $a.readerNamespace | quote }}
    - expression: "!has(object.spec.isCA) || object.spec.isCA == false"
      message: "*-client-ca issuers never sign a CA"
    - expression: "has(object.spec.usages) && object.spec.usages.all(u, u in ['client auth', 'digital signature'])"
      message: "usages outside the reader profile"
    - expression: {{ printf "has(object.spec.duration) && duration(object.spec.duration) <= duration('%s')" $a.readerMaxDuration | quote }}
      message: "duration outside the reader profile"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-mesh-issuers
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cert-manager.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [issuers, clusterissuers]
  matchConditions:
    - name: wraps-client-ca-secret
      expression: "has(object.spec.ca) && object.spec.ca.secretName.endsWith('-cca')"
  validations:
    - expression: {{ printf "request.kind.kind == 'Issuer' && object.metadata.namespace == '%s' && object.metadata.name == object.spec.ca.secretName.substring(0, size(object.spec.ca.secretName) - 4) + '-client-ca'" $a.readerNamespace | quote }}
      message: {{ printf "a CAPI client CA Secret <x>-cca may only back Issuer %s/<x>-client-ca" $a.readerNamespace | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-openbao-fleet-reads
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets]
  matchConditions:
    - name: this-namespace
      expression: {{ printf "object.metadata.namespace == '%s'" $.Release.Namespace | quote }}
    - name: uses-fleet-store
      expression: {{ printf "(has(object.spec.secretStoreRef) && object.spec.secretStoreRef.name == '%[1]s') || (has(object.spec.data) && object.spec.data.exists(d, has(d.sourceRef) && has(d.sourceRef.storeRef) && d.sourceRef.storeRef.name == '%[1]s')) || (has(object.spec.dataFrom) && object.spec.dataFrom.exists(d, has(d.sourceRef) && has(d.sourceRef.storeRef) && d.sourceRef.storeRef.name == '%[1]s'))" $m.store | quote }}
  validations:
    - expression: {{ printf "object.metadata.name == '%s' && (!has(object.spec.data) || size(object.spec.data) == 0) && has(object.spec.dataFrom) && size(object.spec.dataFrom) == 1 && has(object.spec.dataFrom[0].find) && !has(object.spec.dataFrom[0].find.name) && !has(object.spec.dataFrom[0].find.path) && has(object.spec.dataFrom[0].find.tags) && object.spec.dataFrom[0].find.tags == {'%s': 'true'} && !has(object.spec.dataFrom[0].sourceRef)" $m.secretName $m.label | quote }}
      message: {{ printf "store %s may only feed ExternalSecret %s with dataFrom.find.tags {%s: \"true\"} (members' public OpenBao inputs)" $m.store $m.secretName $m.label | quote }}
{{- range $p := list "platform-mesh-reader-certificates" "platform-mesh-certificaterequests" "platform-mesh-issuers" "platform-openbao-fleet-reads" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $p }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  policyName: {{ $p }}
  validationActions: [Deny]
{{- end }}
{{- end }}
