{{- /*
TLS for OpenBao on mgmt and publication of PUBLIC certificates only:
  Issuer openbao-selfsigned -> Certificate openbao-ca (CA, key stays in this namespace) -> Issuer openbao-ca
  -> Certificate openbao-tls (listener: in-cluster names + mesh.ca.host; OpenBao reloads it on renewal, listener tls_auto_reload)
  ExternalSecret openbao-ca-bundle: ca.crt (OpenBao's CA) + mesh-root-<g>.pem (each mesh group's root certificate)
Why two narrow stores: openbao-ca-source may GET only Secret openbao-ca; openbao-pki-public logs in as Kubernetes auth
role mesh-ca-read, whose static self-init policy reads +/cert/ca (public certificates) and nothing else.
ClusterSecretStore mgmt-openbao (ca-store.yaml) may GET only the bundle: consumers never reach a key.
Sync waves: 0 OpenBao + everything else, 1 the mesh-reconcile Job (Sync hook: creates the group roots), 2 the
openbao-pki-public store, openbao-ca-bundle and the CronJobs.
*/ -}}
{{- $ns := .Release.Namespace }}
{{- $t := .Values.tls }}
{{- $host := include "openbao-addon.host" . }}
{{- $groups := include "openbao-addon.groups" . | fromJsonArray }}
{{- $name := .Release.Name }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-selfsigned
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $t.caIssuer }}
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ printf "%s OpenBao CA" .Values.installation.name | quote }}
  secretName: {{ $t.caIssuer }}
  duration: {{ $t.caDuration }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never     # members pin this CA (Vault issuer caBundleSecretRef); rotate deliberately
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: openbao-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $t.caIssuer }}
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $t.caIssuer }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $t.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  secretName: {{ $t.secretName }}
  commonName: {{ printf "%s.%s.svc" $name $ns | quote }}
  dnsNames:
    - {{ $host | quote }}
    - {{ $name }}
    - {{ printf "%s.%s" $name $ns }}
    - {{ printf "%s.%s.svc" $name $ns }}
    - {{ printf "%s.%s.svc.cluster.local" $name $ns }}
    - {{ printf "%s-active.%s.svc" $name $ns }}
    - {{ printf "*.%s-internal" $name | quote }}
    - {{ printf "*.%s-internal.%s.svc" $name $ns | quote }}
  ipAddresses: [127.0.0.1]
  duration: {{ $t.duration }}
  renewBefore: {{ $t.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [server auth, client auth, digital signature]    # client auth: raft peers (retry_join) present it
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ $t.caIssuer }}
---
{{- include "koorikla-lib.esoSecretReader" (dict "name" "openbao-ca-source" "secret" $t.caIssuer "namespace" $ns
    "labels" (include "openbao-addon.labels" .) "automountServiceAccountToken" false) }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-ca-source
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  provider:
    {{- include "koorikla-lib.esoKubernetesProvider" (dict "remoteNamespace" $ns
      "serviceAccount" "eso-openbao-ca-source") | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.caPublic.pkiReader }}
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Logs in with a projected token of the ServiceAccount above (audience == reconcile.audience); role mesh-ca-read and
# its policy (read +/cert/ca only) are written once by self-initialisation (values.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-pki-public
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"    # with openbao-ca-bundle: after the mesh-reconcile Sync hook (wave 1)
spec:
  provider:
    vault:
      server: {{ printf "https://%s-active.%s.svc:8200" $name $ns | quote }}
      version: v1                 # raw logical reads (pki-mesh-<g>-root/cert/ca), no KV semantics
      caProvider:
        type: Secret
        name: {{ $t.secretName }}
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: mesh-ca-read
          serviceAccountRef:
            name: {{ .Values.caPublic.pkiReader }}
            audiences: [{{ .Values.reconcile.audience | quote }}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.caPublic.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    # Reads pki-mesh-<g>-root/cert/ca, which only the mesh-reconcile Job (Sync hook, wave 1) creates: in wave 2, the
    # final wave, so it syncs after the roots exist. Ordering contract: hack/tests/test_mesh_ca_sync_order.sh.
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: SecretStore, name: openbao-ca-source }
  target:
    name: {{ .Values.caPublic.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef: { key: {{ $t.caIssuer }}, property: tls.crt }    # the CA certificate itself (self-signed)
    {{- range $g := $groups }}
    - secretKey: {{ printf "mesh-root-%s.pem" $g }}
      sourceRef:
        storeRef: { kind: SecretStore, name: openbao-pki-public }
      remoteRef: { key: {{ printf "pki-mesh-%s-root/cert/ca" $g }}, property: certificate }
    {{- end }}
