{{- /*
ClusterSecretStore mgmt-openbao (+ its ESO ServiceAccount/Role/RoleBinding): lets caPublic.namespaces (fleet:
charts/cluster mesh-trust.yaml) and, with secrets.tenantStores.enabled, openbao-tenants (tenant-secrets.yaml openbao-ca)
read Secret openbao/openbao-ca-bundle, which holds PUBLIC certificates only (templates/pki.yaml).
Why a name-scoped get is enough: ESO's kubernetes provider reads a remoteRef with one GET and validates the store with a
SelfSubjectRulesReview, so no list/watch and no other Secret here (CA key, listener key, seal key) is reachable.
*/ -}}
{{- $p := .Values.caPublic }}
{{- $nss := $p.namespaces }}
{{- if (((.Values.secrets).tenantStores).enabled) }}
{{- $nss = append $nss .Values.tenantSecrets.inputsNamespace }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $p.secretName }}]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-{{ $p.store }} }
subjects:
  - { kind: ServiceAccount, name: eso-{{ $p.store }}, namespace: {{ .Release.Namespace }} }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $p.store }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaces: {{ toJson $nss }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: eso-{{ $p.store }}
          namespace: {{ .Release.Namespace }}
