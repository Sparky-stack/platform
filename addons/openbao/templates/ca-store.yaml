{{- /*
ClusterSecretStore mgmt-openbao (+ its ESO ServiceAccount/Role/RoleBinding): lets caPublic.namespaces (fleet:
charts/cluster mesh-trust.yaml) and, with secrets.tenantStores.enabled, openbao-tenants (tenant-secrets.yaml openbao-ca)
read Secret openbao/openbao-ca-bundle, which holds PUBLIC certificates only (templates/pki.yaml).
Why a name-scoped get is enough: ESO's kubernetes provider reads a remoteRef with one GET and validates the store with a
SelfSubjectRulesReview, so no list/watch and no other Secret here (CA key, listener key, seal key) is reachable.
*/ -}}
{{- $p := .Values.caPublic }}
{{- $nss := $p.namespaces }}
{{- if (((.Values.secrets).tenantStores).enabled) }}
{{- $nss = append $nss .Values.tenantSecrets.inputsNamespace }}
{{- end }}
{{- include "koorikla-lib.esoSecretReader" (dict "name" $p.store "secret" $p.secretName "namespace" .Release.Namespace
    "labels" (include "openbao-addon.labels" .) "automountServiceAccountToken" false) }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $p.store }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaces: {{ toJson $nss }}
  provider:
    {{- include "koorikla-lib.esoKubernetesProvider" (dict "remoteNamespace" .Release.Namespace
      "serviceAccount" (printf "eso-%s" $p.store) "clusterStore" true "namespace" .Release.Namespace) | nindent 4 }}
