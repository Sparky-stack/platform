{{- /*
ClusterSecretStore mgmt-openbao: read-only, name-scoped access to Secret openbao/openbao-ca-bundle (templates/pki.yaml),
which holds PUBLIC certificates only (OpenBao's CA, the mesh group roots). ESO's kubernetes provider reads a remoteRef
with one GET and validates the store with a SelfSubjectRulesReview that accepts a name-scoped get rule: no list/watch,
no other Secret of this namespace (CA key, listener key, static seal key) is reachable. Consumers: charts/cluster
mesh-trust.yaml (ns fleet, CRS payload for each member's istio-system); with secrets.tenantStores.enabled also
ExternalSecret openbao-tenants/openbao-ca (tenant-secrets.yaml: OpenBao's CA for charts/tenant's demo seed).
*/ -}}
{{- $p := .Values.caPublic }}
{{- $nss := $p.namespaces }}
{{- if (((.Values.secrets).tenantStores).enabled) }}
{{- /* + openbao-tenants: tenant-secrets.yaml ExternalSecret openbao-ca (CA for the charts/tenant demo seed CronJobs) */}}
{{- $nss = append $nss .Values.tenantSecrets.inputsNamespace }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $p.secretName }}]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-{{ $p.store }} }
subjects:
  - { kind: ServiceAccount, name: eso-{{ $p.store }}, namespace: {{ .Release.Namespace }} }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $p.store }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaces: {{ toJson $nss }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: eso-{{ $p.store }}
          namespace: {{ .Release.Namespace }}
