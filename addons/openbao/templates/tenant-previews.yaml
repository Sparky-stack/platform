{{- /*
PR previews read their tenant's OpenBao secrets (#267, docs/preview-environments.md). Kyverno generates a descriptor
Secret <project>-openbao-tenant-<environment> per preview ProjectReleaseBinding. The preview label is not a trust
boundary: files/tenant-reconcile.sh derives the cell namespace from the binding's project and environment, never from
the input, so a binding only opens a project's own secrets to that project's own preview cell.
*/ -}}
{{- if and (((.Values.secrets).tenantStores).enabled) ((.Values.previews).enabled) }}
{{- $t := .Values.tenantSecrets }}
{{- $kbc := $t.kyvernoBackgroundController }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: platform-preview-tenant-secrets
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # After its RBAC (wave -1): Kyverno evaluates RBACPermissionsGranted only when the policy changes, so a policy
    # created before the aggregated ClusterRole stays not-Ready forever (Argo Degraded, openbao sync stalls).
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: PR previews read their tenant's OpenBao secrets
    policies.kyverno.io/description: >-
      Per preview ProjectReleaseBinding a tenant descriptor {{ $t.inputsNamespace }}/<project>-openbao-tenant-<environment>,
      so the preview's cell namespace may log in to OpenBao as its own project (kv-tenant-<project>) and nothing else.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [openchoreo.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [projectreleasebindings]
    objectSelector:
      matchLabels: { platform.koorikla.io/preview: "true" }
  matchConditions:
    - name: org-namespace
      expression: {{ printf "object.metadata.namespace == '%s'" (((.Values.openchoreo).orgNamespace) | default "default") | quote }}
    - name: project-is-a-tenant-name
      expression: "object.spec.owner.projectName.matches('^[a-z0-9]([-a-z0-9]{0,48}[a-z0-9])?$')"
    - name: environment-is-a-preview
      expression: "object.spec.environment.matches('^pr-[0-9]+-[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(object.spec.environment) <= 63"
    # A terminating binding gets no descriptor. The DELETE removes the descriptor (synchronize), but OpenChoreo's
    # finalizer removal afterwards is an UPDATE of a still-matching binding: without this Kyverno re-creates the
    # descriptor and nothing ever deletes it (leak after hello-world#35). Non-matching UPDATE + synchronize = delete.
    - name: binding-is-not-terminating
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: project
      expression: object.spec.owner.projectName
    - name: environment
      expression: object.spec.environment
    - name: downstream
      expression: >-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": variables.project + "-openbao-tenant-" + variables.environment,
              "namespace": "{{ $t.inputsNamespace }}",
              "labels": {"{{ $t.label }}": "true", "app.kubernetes.io/part-of": "tenant-secrets", "platform.koorikla.io/preview": "true"}
            }),
            "type": dyn("Opaque"),
            "data": dyn({
              "tenant": base64.encode(bytes(variables.project)),
              "environment": base64.encode(bytes(variables.environment))
            })
          }
        ]
  generate:
    - expression: generator.Apply("{{ $t.inputsNamespace }}", variables.downstream)
---
# Kyverno's background controller reads the preview bindings (cluster-wide list for generateExisting) and writes the
# descriptors in the inputs namespace only (Role, not ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # before the GeneratingPolicy (wave 0)
  name: kyverno:background-controller:preview-tenant-secrets
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    # The policy only turns Ready (RBACPermissionsGranted) when the reports controller can read its match kinds too;
    # until then Argo sees it Degraded and the openbao sync stalls before openbao-ca-bundle (clean-bootstrap deadlock).
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [openchoreo.dev]
    resources: [projectreleasebindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # before the GeneratingPolicy (wave 0)
  name: kyverno-preview-tenant-secrets
  namespace: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # before the GeneratingPolicy (wave 0)
  name: kyverno-preview-tenant-secrets
  namespace: {{ $t.inputsNamespace }}
  labels:
    {{- include "openbao-addon.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: kyverno-preview-tenant-secrets }
subjects:
  - { kind: ServiceAccount, name: {{ $kbc.name }}, namespace: {{ $kbc.namespace }} }
{{- end }}
