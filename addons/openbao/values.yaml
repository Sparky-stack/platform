# OpenBao on mgmt: the Istio mesh CA (catalog: namespace openbao, roles [mgmt], default false; enable with
# installation.yaml mgmt.addons.openbao: true). docs/multicluster.md "Mesh CA (OpenBao)".
#
#   openbao (upstream chart)    StatefulSet `openbao` (integrated raft storage, 1 replica locally), TLS listener with
#                               auto-reload, static auto-unseal key from the secret backend, declarative audit device and
#                               one-time self-initialisation (no root token is ever handed out)
#   templates/pki.yaml          ns-scoped CA (Issuer openbao-ca) -> Secret openbao-tls (listener cert);
#                               openbao-ca-bundle = PUBLIC certs only: OpenBao's CA + every group's mesh root
#   templates/ca-store.yaml     ClusterSecretStore `mgmt-openbao`: name-scoped GET of openbao-ca-bundle (fleet only)
#   templates/unseal.yaml       Secret openbao-unseal (static seal key) from ClusterSecretStore `platform`
#   templates/gateway.yaml      Gateway `openbao` (kgateway, TLS passthrough on mesh.ca.port, SNI mesh.ca.host) + TLSRoute
#   templates/mesh-clients.yaml ExternalSecret mesh-clients: every mesh member's public auth inputs (API server URL +
#                               cluster CA certificate), collected from the fleet Secrets charts/cluster renders
#   templates/reconcile.yaml    Job (Argo Sync hook, wave 1) + CronJob `mesh-reconcile`: files/mesh-reconcile.sh applies the
#                               mesh PKI (group CAs: Job only; per member PKI role, identity entity, JWT auth) with
#                               scoped, short-lived tokens. It writes no ACL policy (all static, self-initialisation).
#   templates/tenant-secrets.yaml + templates/policy-reconcile.yaml  tenant secrets (opt-in): CronJobs tenant-reconcile
#                               and policy-reconcile (tenant-* ACL policies from files/policies/, no re-init needed)
#   templates/mesh-admission.yaml  ValidatingAdmissionPolicies for the remote-secret reader certs (charts/cluster
#                               <name>-client-ca issuers over the CAPI k3s client CAs)
#
# Endpoint for members: https://<mesh.ca.host>:<mesh.ca.port> (installation.yaml), e.g.
# https://openbao.openchoreo.localhost:8200. Locally the members' coredns-local sends *.openchoreo.localhost to the k3d
# serverlb, which publishes mesh.ca.port (bootstrap/k3d-mgmt.yaml) to the Gateway's klipper hostPort on mgmt. mgmt
# pods (ESO, the reconcile Job) use https://openbao-active.openbao.svc:8200.

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster: { name: mgmt, provider: docker }
installation: { name: local }
# installation.yaml `mesh`: groups (one root + intermediate per group) and ca (the address members dial).
mesh:
  # -- Mesh groups (`mesh.{groups,ca.host,ca.port}`) reconciled into PKI mounts and the passthrough endpoint.
  groups: []
  ca:
    host: openbao.openchoreo.localhost
    port: 8200

# --- platform glue (templates/) -------------------------------------------------------------------------------------
# Static auto-unseal key (OpenBao `seal "static"`, AES-256-GCM): store key `openbao-unseal`, property `key` = 64 hex
# characters (32 bytes). Seeded by `task secrets` locally. Production: replace the static seal with a cloud KMS seal
# (`seal "awskms"` via IRSA / Pod Identity, or `seal "transit"` against another OpenBao) - docs/multicluster.md.
unseal:
  # -- Pulls `openbao-unseal` (`unseal.{store,remoteKey,secretName}`) from `ClusterSecretStore/platform` for static auto-unseal.
  store: platform
  remoteKey: openbao-unseal
  property: key
  secretName: openbao-unseal       # mounted at /openbao/unseal/key (== openbao.server.ha.raft.config current_key)

tls:
  caIssuer: openbao-ca             # namespaced CA (Secret + Issuer); its key never leaves this namespace
  caDuration: 87600h
  secretName: openbao-tls          # listener cert (tls_auto_reload picks up renewals)
  duration: 2160h
  renewBefore: 720h

# Public certificate publication (no private key): Secret openbao-ca-bundle with
#   ca.crt               OpenBao's CA (members verify the OpenBao listener with it: Vault issuer caBundleSecretRef)
#   mesh-root-<g>.pem    each mesh group's root CA certificate (members pin it as istio-csr rootCAFile)
# filled by ESO from the CA Secret (SecretStore openbao-ca-source, GET of openbao-ca only) and from OpenBao itself
# (SecretStore openbao-pki-public: Kubernetes auth role mesh-ca-read, policy = read +/cert/ca only; self-initialisation).
caPublic:
  # -- Publishes root/CA bundles (`caPublic.{store,secretName,namespaces}`) through `ClusterSecretStore/mgmt-openbao` to `fleet`.
  store: mgmt-openbao
  secretName: openbao-ca-bundle
  namespaces: [fleet]              # charts/cluster mesh-trust.yaml (CRS payload for the member's istio-system)
  pkiReader: eso-openbao-pki-public   # ServiceAccount of SecretStore openbao-pki-public (== reconcile CA_READER_SA)

# Gateway (kgateway): one TLS passthrough listener; OpenBao terminates TLS itself. kgateway provisions the proxy and a
# Service named after the Gateway (LoadBalancer -> klipper hostPort on mgmt; the chart's Services keep `openbao*`).
gateway:
  name: openbao-gateway
  className: kgateway
  # REQUIRED outside docker (render fails): the mesh members' egress CIDRs. The listener exposes the whole OpenBao API
  # (unauthenticated sys/health, sys/seal-status, login endpoints). Applied to the proxy Service via GatewayParameters.
  # Locally empty: k3d publishes the port on 127.0.0.1 only.
  loadBalancerSourceRanges: []

# Mesh PKI applied by files/mesh-reconcile.sh. TTLs follow the outage budget (docs/multicluster.md "When OpenBao is
# down"): workload certificates 24h (ztunnel renews at half-life, so running pods survive >= 12h without OpenBao),
# istiod / istio-csr serving certs requested by addon mesh (istio-csr) within workloadMaxTTL.
pki:
  # -- X.509 constraints (`pki.{trustDomain,allowedDomains,workloadTTL,rootTTL,intermediateTTL}`: `cluster.local`, `24h` leaf TTL).
  trustDomain: cluster.local
  allowedDomains:                  # == addon mesh (istio-csr): istiod cert (CN + SAN) and istio-csr's own serving cert
    - istiod.istio-system.svc
    - cert-manager-istio-csr.istio-system.svc
  workloadTTL: 24h
  workloadMaxTTL: 48h
  rootTTL: 87600h                  # 10y; root rotation is a planned procedure (trust bundle), docs/multicluster.md
  intermediateTTL: 43800h          # 5y; key never leaves OpenBao; rotation: docs/multicluster.md "Root and intermediate rotation"
  keyType: ec
  rootKeyBits: 384
  intermediateKeyBits: 256

# How members authenticate (== addon mesh issuer.* values): the cert-manager Vault Issuer `openbao-mesh` in istio-system
# logs in with a 10-minute token of ServiceAccount istio-system/istio-csr-openbao; cert-manager always adds the
# audience vault://<issuer namespace>/<issuer name>, which is the only audience accepted here.
memberAuth:
  serviceAccount: istio-system:istio-csr-openbao
  audience: vault://istio-system/openbao-mesh
  role: istio-csr
  policy: mesh-member              # static templated policy from self-initialisation (entity metadata cluster/group)
  tokenTTL: 10m

reconcile:
  schedule: "*/5 * * * *"          # also an Argo Sync hook (wave 1); new members are picked up within one ESO refresh + 5m
  # == openbao.server.ha.raft.config (self-initialisation; server_test.yaml checks the names match):
  serviceAccount: openbao-mesh-config          # CronJob: role platform-mesh-config (members only)
  loginRole: platform-mesh-config
  bootstrapServiceAccount: openbao-mesh-bootstrap   # Sync-hook Job: also role platform-mesh-bootstrap (group CAs)
  bootstrapLoginRole: platform-mesh-bootstrap
  audience: openbao                # projected token audience == the Kubernetes auth roles' `audience`
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

# Inputs for the reconcile: one fleet Secret per member (charts/cluster mesh-openbao.yaml) with label
# mesh.platform.koorikla.io/openbao-client=true, read through ClusterSecretStore mgmt-fleet (find by label).
meshClients:
  store: mgmt-fleet
  secretName: mesh-clients
  label: mesh.platform.koorikla.io/openbao-client

# Per-tenant secrets (installation.yaml secrets.tenantStores.enabled; docs/multicluster.md "Tenant secrets (OpenBao)"):
# templates/tenant-secrets.yaml + files/tenant-reconcile.sh (policies: files/policies/, written by policyReconciler). Per tenant (charts/tenant renders the descriptor Secret
# <tenant>-openbao-tenant and the ServiceAccount <tenant>-writer in inputsNamespace):
#   kv-tenant-<tenant>                       KV v2 mount (never deleted by the reconcile: data outlives the tenant file)
#   identity entity tenant-<tenant>          metadata tenant=<tenant>; the templated policies tenant-read /
#                                            tenant-write (files/policies/) key on it
#   auth/tenants-<cluster>/role/<tenant>     per mesh member (the clusters of meshClients): JWT login of ServiceAccount
#                                            readerServiceAccount in exactly the tenant's namespaces, audience below
# The SecretStore in each tenant namespace is rendered on the workload cluster by addon secret-stores (same names).
tenantSecrets:
  inputsNamespace: openbao-tenants   # descriptors (charts/tenant) + writer ServiceAccounts; == role tenant-writer (pinned)
  label: openbao.platform.koorikla.io/tenant
  secretName: tenant-clients
  readerServiceAccount: openbao-tenant          # == addon secret-stores tenantStores.serviceAccount
  audience: openbao-tenant-secrets              # == addon secret-stores tenantStores.audience
  readerPolicy: tenant-read                     # files/policies/tenant-read.hcl
  tokenTTL: 10m
  serviceAccount: openbao-tenant-config         # == role tenant-config (written by the policy reconciler, pinned)
  loginRole: tenant-config
  schedule: "*/5 * * * *"
  # PR previews (templates/tenant-previews.yaml, with previews.enabled): the identity that writes the preview
  # descriptors here (Kyverno GeneratingPolicy platform-preview-tenant-secrets), bound by a Role in inputsNamespace.
  kyvernoBackgroundController: { namespace: kyverno, name: kyverno-background-controller }

# Policy reconciler (templates/policy-reconcile.yaml + files/policy-reconcile.sh; with secrets.tenantStores.enabled):
# CronJob policy-reconcile writes every files/policies/tenant-*.hcl as ACL policy <name> (prunes tenant-* policies no
# longer in git) and the Kubernetes auth roles tenant-config + tenant-writer. Its own identity and its pins are
# self-init (values.yaml openbao.server.ha.raft.config, initialize "policy-reconciler"); the role values below must
# equal those pins (contract test test_openbao_policy_reconcile.sh) or OpenBao answers 403.
policyReconciler:
  # -- ServiceAccount, `loginRole`, and pinned `roleTTL` of the policy reconciler (must equal the self-init pins).
  serviceAccount: openbao-policy-reconciler     # == self-init role platform-policy-reconciler
  loginRole: platform-policy-reconciler
  roleTTL: 15m                                  # tenant-config / tenant-writer token_ttl == token_max_ttl (pinned)

# installation.yaml secrets.tenantStores (default off).
secrets:
  tenantStores:
    # -- Enables per-tenant KV v2 mounts `kv-tenant-<tenant>`, JWT auth `tenants-<cluster>` per mesh member, and CronJobs `tenant-reconcile` (`tenantSecrets.*`) and `policy-reconcile` ([Tenant secrets](../../docs/multicluster.md#tenant-secrets-openbao), [policy reconciler](../../docs/multicluster.md#policies-from-git-the-policy-reconciler)).
    enabled: false

# ValidatingAdmissionPolicies (admissionregistration.k8s.io/v1) on mgmt for the remote-secret reader certs:
# cert-manager auto-approves every CertificateRequest and a CA issuer signs whatever it is asked, so without these
# anyone who may create a Certificate in fleet could mint cluster-admin client certs from a <name>-client-ca issuer.
admission:
  enabled: true
  readerNamespace: fleet                      # = charts/cluster: <name>-mesh-reader, <name>-client-ca
  readerUser: platform:istio-reader           # = charts/cluster mesh.readerUser, addon mesh reader.user
  readerMaxDuration: 168h                     # = charts/cluster mesh-remote-secret.yaml (7d)
  requestCreators: [system:serviceaccount:cert-manager:cert-manager]

# --- upstream chart (openbao/openbao-helm) --------------------------------------------------------------------------
openbao:
  global:
    tlsDisable: false              # https everywhere (BAO_ADDR, probes)
  injector:
    enabled: false
  csi:
    enabled: false
  ui:
    enabled: false
  server:
    image:
      registry: quay.io
      repository: openbao/openbao
      tag: "2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f"   # multi-arch
    updateStrategyType: RollingUpdate
    logLevel: info
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
    authDelegator:
      enabled: true                # TokenReview for the mgmt-local Kubernetes auth method (reconcile, ESO)
    extraEnvironmentVars:
      BAO_CACERT: /openbao/tls/ca.crt
      BAO_TLS_SERVER_NAME: openbao.openbao.svc
    volumes:
      - name: tls
        secret:
          secretName: openbao-tls
          defaultMode: 0440
      - name: unseal
        secret:
          secretName: openbao-unseal
          defaultMode: 0440
          items: [{ key: key, path: key }]
      - name: tmp                  # the chart's start script renders the config to /tmp (read-only root filesystem)
        emptyDir: { sizeLimit: 16Mi }
    volumeMounts:
      - { name: tls, mountPath: /openbao/tls, readOnly: true }
      - { name: unseal, mountPath: /openbao/unseal, readOnly: true }
      - { name: tmp, mountPath: /tmp }
    dataStorage:
      enabled: true
      size: 1Gi
    auditStorage:
      enabled: false               # audit device = stdout (collected with the container logs)
    statefulSet:
      securityContext:
        pod:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile: { type: RuntimeDefault }
        container:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
    standalone:
      enabled: false
    ha:
      enabled: true
      replicas: 1                  # local; 3 (or 5) in production: self-initialisation runs on the first node only,
                                   # the others join through retry_join (docs/multicluster.md)
      raft:
        enabled: true
        setNodeId: true
        # tpl'd by the chart; words HOST_IP, POD_IP, HOSTNAME, API_ADDR, RAFT_ADDR are sed-replaced at start.
        config: |
          ui = false
          listener "tcp" {
            address            = "[::]:8200"
            cluster_address    = "[::]:8201"
            tls_cert_file      = "/openbao/tls/tls.crt"
            tls_key_file       = "/openbao/tls/tls.key"
            tls_min_version    = "tls12"
            tls_auto_reload    = true
          }
          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr     = "https://openbao-0.openbao-internal:8200"
              leader_ca_cert_file = "/openbao/tls/ca.crt"
            }
          }
          service_registration "kubernetes" {}
          # Static auto-unseal (local backend). Production: seal "awskms" { ... } with workload identity.
          seal "static" {
            current_key_id = "platform-1"
            current_key    = "file:///openbao/unseal/key"
          }
          audit "file" "stdout" {
            description = "every request and response (HMAC'd secrets) to the container log"
            options {
              file_path = "stdout"
            }
          }
          # One-time self-initialisation (first start only; the root token is revoked afterwards and never returned).
          # Every mgmt identity and every non-tenant ACL policy is written HERE, once; later, only the policy
          # reconciler (below) may author policies, and only tenant-* ones (docs/multicluster.md "Who may do what in
          # OpenBao"). Identities (Kubernetes auth, projected tokens with
          # audience "openbao"; names == addon values reconcile.*, caPublic.pkiReader, contract test server_test.yaml):
          #   platform-mesh-bootstrap  SA openbao-mesh-bootstrap (Sync-hook Job only): group CAs. CA-equivalent - it
          #                            can sign an intermediate CSR with a group root - so it never runs on a schedule.
          #   platform-mesh-config     SAs openbao-mesh-config (CronJob) + openbao-mesh-bootstrap: member enrolment
          #                            (jwt mounts, PKI roles with pinned safety flags, identity entities). No key,
          #                            no signing, no policy writes.
          #   mesh-ca-read             SA eso-openbao-pki-public: the group roots' public certificates, plus the
          #                            token self-operations ESO's vault provider needs without the default policy
          #                            (lookup-self validates the SecretStore, revoke-self closes the client).
          # Members get the static templated policy mesh-member: sign on pki-mesh-<group>-int/sign/<cluster>, where
          # group/cluster are metadata of the identity entity mesh-<cluster> the reconcile binds to auth/mesh-<cluster>.
          # Changing these (non-tenant) policies later is an admin action (re-initialise) by design.
          initialize "kubernetes-auth" {
            request "enable" {
              operation = "update"
              path      = "sys/auth/kubernetes"
              data = {
                type        = "kubernetes"
                description = "mgmt ServiceAccounts (mesh reconcile, ESO public-certificate reader)"
              }
            }
            request "config" {
              operation = "update"
              path      = "auth/kubernetes/config"
              data = {
                kubernetes_host = "https://kubernetes.default.svc"
              }
            }
          }
          initialize "mesh-policies" {
            request "member" {
              operation = "update"
              path      = "sys/policies/acl/mesh-member"
              data = {
                policy = <<EOP
          path "pki-mesh-{{ "{{identity.entity.metadata.group}}" }}-int/sign/{{ "{{identity.entity.metadata.cluster}}" }}" { capabilities = ["create", "update"] }
          EOP
              }
            }
            request "ca-read" {
              operation = "update"
              path      = "sys/policies/acl/mesh-ca-read"
              data = {
                policy = <<EOP
          path "+/cert/ca" { capabilities = ["read"] }
          path "auth/token/lookup-self" { capabilities = ["read"] }
          path "auth/token/revoke-self" { capabilities = ["update"] }
          EOP
              }
            }
            request "config" {
              operation = "update"
              path      = "sys/policies/acl/platform-mesh-config"
              data = {
                policy = <<EOP
          path "sys/auth" { capabilities = ["read"] }
          path "sys/auth/mesh-*" {
            capabilities       = ["create", "read", "update", "delete", "sudo"]
            allowed_parameters = { "*" = [], "type" = ["jwt"] }
            denied_parameters  = { "plugin_name" = [] }
          }
          path "auth/mesh-*" {
            capabilities       = ["create", "read", "update", "list"]
            allowed_parameters = { "*" = [], "token_policies" = ["mesh-member"] }
            denied_parameters  = { "policies" = [] }
          }
          path "+/roles/+" {
            capabilities        = ["create", "read", "update"]
            required_parameters = ["allow_any_name", "allow_ip_sans", "allow_localhost", "allow_subdomains", "allow_glob_domains", "allow_wildcard_certificates", "enforce_hostnames", "allowed_uri_sans_template", "allowed_other_sans", "code_signing_flag", "email_protection_flag", "no_store", "generate_lease", "issuer_ref"]
            allowed_parameters  = { "*" = [], "allow_any_name" = ["false"], "allow_ip_sans" = ["false"], "allow_localhost" = ["false"], "allow_subdomains" = ["false"], "allow_glob_domains" = ["false"], "allow_wildcard_certificates" = ["false"], "enforce_hostnames" = ["true"], "allowed_uri_sans_template" = ["false"], "allowed_other_sans" = [""], "code_signing_flag" = ["false"], "email_protection_flag" = ["false"], "no_store" = ["true"], "generate_lease" = ["false"], "issuer_ref" = ["default"] }
            denied_parameters   = { "allowed_domains_template" = [], "ext_key_usage_oids" = [], "basic_constraints_valid_for_non_ca" = [] }
          }
          path "identity/entity/name/mesh-*" {
            capabilities       = ["create", "read", "update", "delete"]
            allowed_parameters = { "metadata" = [] }
          }
          path "identity/entity-alias" {
            capabilities       = ["create", "update"]
            allowed_parameters = { "name" = [], "canonical_id" = [], "mount_accessor" = [] }
          }
          path "+/root/sign-intermediate" { capabilities = ["deny"] }
          path "sys/mounts/*" { capabilities = ["deny"] }
          path "sys/policies/*" { capabilities = ["deny"] }
          path "sys/policy/*" { capabilities = ["deny"] }
          path "auth/kubernetes/*" { capabilities = ["deny"] }
          path "+/root/generate/exported" { capabilities = ["deny"] }
          path "+/intermediate/generate/exported" { capabilities = ["deny"] }
          path "+/issuers/generate/+/exported" { capabilities = ["deny"] }
          path "+/keys/*" { capabilities = ["deny"] }
          path "+/config/ca" { capabilities = ["deny"] }
          path "+/config/keys" { capabilities = ["deny"] }
          path "+/config/issuers" { capabilities = ["deny"] }
          path "+/issuers/import/*" { capabilities = ["deny"] }
          path "+/issuer/+" { capabilities = ["deny"] }
          path "+/intermediate/cross-sign" { capabilities = ["deny"] }
          path "+/root/rotate/*" { capabilities = ["deny"] }
          path "+/root/replace" { capabilities = ["deny"] }
          path "+/root/sign-self-issued" { capabilities = ["deny"] }
          path "+/issuer/+/sign-self-issued" { capabilities = ["deny"] }
          path "+/sign-verbatim*" { capabilities = ["deny"] }
          path "+/issuer/+/sign-verbatim*" { capabilities = ["deny"] }
          path "+/issuer/+/sign-intermediate" { capabilities = ["deny"] }
          EOP
              }
            }
            request "bootstrap" {
              operation = "update"
              path      = "sys/policies/acl/platform-mesh-bootstrap"
              data = {
                policy = <<EOP
          path "sys/mounts/pki-mesh-*" {
            capabilities       = ["create", "read", "update"]
            allowed_parameters = { "*" = [], "type" = ["pki"] }
            denied_parameters  = { "plugin_name" = [] }
          }
          path "+/root/generate/internal" { capabilities = ["create", "update"] }
          path "+/intermediate/generate/internal" { capabilities = ["create", "update"] }
          path "+/root/sign-intermediate" {
            capabilities        = ["create", "update"]
            required_parameters = ["max_path_length"]
            allowed_parameters  = { "*" = [], "max_path_length" = ["0"] }
          }
          path "+/intermediate/set-signed" { capabilities = ["create", "update"] }
          path "sys/policies/*" { capabilities = ["deny"] }
          path "sys/policy/*" { capabilities = ["deny"] }
          path "sys/auth/*" { capabilities = ["deny"] }
          path "auth/kubernetes/*" { capabilities = ["deny"] }
          path "+/root/generate/exported" { capabilities = ["deny"] }
          path "+/intermediate/generate/exported" { capabilities = ["deny"] }
          path "+/issuers/generate/+/exported" { capabilities = ["deny"] }
          path "+/keys/*" { capabilities = ["deny"] }
          path "+/config/ca" { capabilities = ["deny"] }
          path "+/config/keys" { capabilities = ["deny"] }
          path "+/config/issuers" { capabilities = ["deny"] }
          path "+/issuers/import/*" { capabilities = ["deny"] }
          path "+/issuer/+" { capabilities = ["deny"] }
          path "+/intermediate/cross-sign" { capabilities = ["deny"] }
          path "+/root/rotate/*" { capabilities = ["deny"] }
          path "+/root/replace" { capabilities = ["deny"] }
          path "+/root/sign-self-issued" { capabilities = ["deny"] }
          path "+/issuer/+/sign-self-issued" { capabilities = ["deny"] }
          path "+/sign-verbatim*" { capabilities = ["deny"] }
          path "+/issuer/+/sign-verbatim*" { capabilities = ["deny"] }
          path "+/issuer/+/sign-intermediate" { capabilities = ["deny"] }
          EOP
              }
            }
          }
          initialize "mesh-roles" {
            request "config" {
              operation = "update"
              path      = "auth/kubernetes/role/platform-mesh-config"
              data = {
                bound_service_account_names      = ["openbao-mesh-config", "openbao-mesh-bootstrap"]
                bound_service_account_namespaces = ["openbao"]
                audience                         = "openbao"
                token_policies                   = ["platform-mesh-config"]
                token_no_default_policy          = true
                token_ttl                        = "15m"
                token_max_ttl                    = "15m"
              }
            }
            request "bootstrap" {
              operation = "update"
              path      = "auth/kubernetes/role/platform-mesh-bootstrap"
              data = {
                bound_service_account_names      = ["openbao-mesh-bootstrap"]
                bound_service_account_namespaces = ["openbao"]
                audience                         = "openbao"
                token_policies                   = ["platform-mesh-bootstrap"]
                token_no_default_policy          = true
                token_ttl                        = "15m"
                token_max_ttl                    = "15m"
              }
            }
            request "ca-read" {
              operation = "update"
              path      = "auth/kubernetes/role/mesh-ca-read"
              data = {
                bound_service_account_names      = ["eso-openbao-pki-public"]
                bound_service_account_namespaces = ["openbao"]
                audience                         = "openbao"
                token_policies                   = ["mesh-ca-read"]
                token_no_default_policy          = true
                token_ttl                        = "10m"
                token_max_ttl                    = "10m"
              }
            }
          }
          # Policy reconciler (docs/multicluster.md "Policies from git: the policy reconciler"): the only identity that
          # may write ACL policies after this first start, and only policies named tenant-* (files/policies/, CronJob
          # policy-reconcile) plus the two Kubernetes auth roles of the tenant identities with every parameter pinned
          # (it cannot bind a role to its own ServiceAccount nor attach any other policy). No root, no PKI, no mesh, no
          # secret, no auth method, no identity. Policies of other names (mesh-*, platform-*) stay self-init only:
          # whoever may write those is CA-equivalent or could rewrite this policy. Nothing can mint a root token later
          # (self-initialisation creates no recovery keys; task test:openbao proves root token generation fails).
          initialize "policy-reconciler" {
            request "policy" {
              operation = "update"
              path      = "sys/policies/acl/platform-policy-reconciler"
              data = {
                policy = <<EOP
          path "sys/policies/acl" { capabilities = ["list"] }
          path "sys/policies/acl/tenant-*" { capabilities = ["create", "read", "update", "delete"] }
          path "auth/kubernetes/role/tenant-config" {
            capabilities        = ["create", "update"]
            required_parameters = ["bound_service_account_names", "bound_service_account_namespaces", "audience", "token_policies", "token_no_default_policy", "token_ttl", "token_max_ttl"]
            allowed_parameters  = { "bound_service_account_names" = ["openbao-tenant-config"], "bound_service_account_namespaces" = ["openbao"], "audience" = ["openbao"], "token_policies" = ["tenant-config"], "token_no_default_policy" = ["true"], "token_ttl" = ["15m"], "token_max_ttl" = ["15m"] }
          }
          path "auth/kubernetes/role/tenant-writer" {
            capabilities        = ["create", "update"]
            required_parameters = ["bound_service_account_names", "bound_service_account_namespaces", "alias_name_source", "audience", "token_policies", "token_no_default_policy", "token_ttl", "token_max_ttl"]
            allowed_parameters  = { "bound_service_account_names" = ["*"], "bound_service_account_namespaces" = ["openbao-tenants"], "alias_name_source" = ["serviceaccount_name"], "audience" = ["openbao"], "token_policies" = ["tenant-write"], "token_no_default_policy" = ["true"], "token_ttl" = ["15m"], "token_max_ttl" = ["15m"] }
          }
          path "auth/token/revoke-self" { capabilities = ["update"] }
          path "sys/policies/acl/platform-*" { capabilities = ["deny"] }
          path "sys/policies/acl/mesh-*" { capabilities = ["deny"] }
          path "sys/policy/*" { capabilities = ["deny"] }
          path "sys/mounts/*" { capabilities = ["deny"] }
          path "sys/auth/*" { capabilities = ["deny"] }
          path "auth/kubernetes/config" { capabilities = ["deny"] }
          path "auth/kubernetes/role/platform-*" { capabilities = ["deny"] }
          path "auth/kubernetes/role/mesh-*" { capabilities = ["deny"] }
          path "identity/*" { capabilities = ["deny"] }
          path "kv-tenant-*" { capabilities = ["deny"] }
          path "pki-*" { capabilities = ["deny"] }
          EOP
              }
            }
            request "role" {
              operation = "update"
              path      = "auth/kubernetes/role/platform-policy-reconciler"
              data = {
                bound_service_account_names      = ["openbao-policy-reconciler"]
                bound_service_account_namespaces = ["openbao"]
                audience                         = "openbao"
                token_policies                   = ["platform-policy-reconciler"]
                token_no_default_policy          = true
                token_ttl                        = "5m"
                token_max_ttl                    = "5m"
              }
            }
          }
