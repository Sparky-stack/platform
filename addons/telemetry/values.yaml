# Data-plane telemetry on every workload cluster (namespace `telemetry`), shipping to the OpenChoreo observability plane
# on mgmt (addon openchoreo-observability-plane). docs/observability.md.
#
#   signal            collector (this chart)                        -> obs plane on mgmt (ingest URL)
#   container logs    Fluent Bit DaemonSet (logs module, OpenChoreo   -> OpenSearch  https://opensearch.observability.<host>:<tlsPort>
#                     schema: Backstage "Runtime Logs")                  (TLS passthrough, basic auth)
#   k8s events        events collector (OpenChoreo build)             -> OpenSearch  (same)
#   pod metrics       Prometheus agent (metrics module exporter mode,   -> Prometheus http://prometheus.observability.<host>:<httpPort>/api/v1/write
#                     cAdvisor + kube-state-metrics, OpenChoreo labels)
#   OTLP traces       OpenTelemetry Collector DaemonSet = FAN-OUT     -> OTLP/HTTP  http://opentelemetry.observability.<host>:<httpPort>
#   OTLP metrics      (apps, OBI, falcosidekick)                      -> remote write (as above)
#   OTLP/webhook logs (falcosidekick alerts, apps)                    -> nothing by default (Falco's JSON stdout already
#                                                                        reaches OpenSearch through Fluent Bit); Datadog overlay
#
# Datadog: installations/<inst>/addons/telemetry/values.yaml(.disabled) adds the datadog exporter/connector to the
# collector pipelines; the API key comes from the cluster's ClusterSecretStore `default`, key `datadog`.
# Endpoints and the cluster name reach the collector as env vars (ConfigMap telemetry-env, templated from
# installation.yaml); Fluent Bit's literal host/port below are checked against installation.yaml (templates/validate.yaml).
# Needs: external-secrets + ClusterSecretStore `default` (key `openchoreo-observability`: opensearch-username/-password),
# coredns-local on docker clusters (*.openchoreo.localhost -> mgmt k3d serverlb, which publishes 11080/11085).

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster:
  name: default
openchoreo:
  controlPlane:
    # -- `mgmt` ingestion endpoints (with `openchoreo.observability.{httpPort,tlsPort}`) for remote-write, OTLP, and OpenSearch.
    host: openchoreo.localhost
  observability:
    enabled: true
    httpPort: 11080
    tlsPort: 11085

# --- platform glue (templates/) -------------------------------------------------------------------------------------
secrets:
  # -- Pulls `openchoreo-observability` credentials (`secrets.{store,remoteKey}`) from workload `ClusterSecretStore/default`.
  store: default                       # workload clusters: ClusterSecretStore/default (AGENTS.md invariant 5)
  remoteKey: openchoreo-observability  # opensearch-username, opensearch-password (same key as on mgmt)

# Datadog fan-out (off). Enabling renders Secret telemetry-datadog (DD_API_KEY) from `secrets.store`, key `datadog`,
# property `api-key`; the collector loads it via envFrom (optional). The exporter/pipelines are a values overlay.
datadog:
  # -- Optional dual-shipping to Datadog (`datadog.{enabled,remoteKey,property}`; `false` by default).
  enabled: false
  remoteKey: datadog
  property: api-key

# Not in the Istio ambient mesh (#53): ztunnel's DNS proxy (istio-cni AMBIENT_DNS_CAPTURE, on by default) answers
# *.localhost names with loopback (RFC 6761), so enrolled pods lose the local installation's ingest hosts
# (*.observability.openchoreo.localhost -> "dial tcp [::1]:11080: connection refused"; seen live on dev1). Consequence:
# PodMonitors whose targets sit in STRICT cell namespaces are refused (docs/networking.md "Strict mTLS in cell
# namespaces", exceptions). templates/namespace.yaml pins istio.io/dataplane-mode=none (contract-tested).

# Images: every image below is fully qualified and pinned by multi-arch index digest (docs/conventions.md invariant 9,
# hack/tests/test_image_pins.sh), including the init containers and the Prometheus config reloader the operator injects.
# A chart bump updates tag and digest together.

# --- OpenTelemetry Collector: the fan-out point ----------------------------------------------------------------------
opentelemetry-collector:
  # -- `daemonset` with `service.internalTrafficPolicy: Local` on OTLP port `4317`.
  mode: daemonset
  fullnameOverride: telemetry-collector
  image:
    repository: docker.io/otel/opentelemetry-collector-contrib   # contrib: k8sattributes, webhookevent, datadog, prw
    tag: 0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849   # index: amd64, arm64, ...
  command:
    name: otelcol-contrib
  service:
    enabled: true
    internalTrafficPolicy: Local       # pods (and hostNetwork OBI) talk to the collector on their own node
  ports:
    otlp: { enabled: true }            # 4317 (also hostPort on the node)
    otlp-http: { enabled: true }       # 4318 (also hostPort on the node)
    falco:                             # falcosidekick webhook (CloudEvents) -> logs pipeline
      enabled: true
      containerPort: 8088
      servicePort: 8088
      protocol: TCP
    jaeger-compact: { enabled: false }
    jaeger-thrift: { enabled: false }
    jaeger-grpc: { enabled: false }
    zipkin: { enabled: false }
  clusterRole:
    create: true
    rules:                             # k8sattributes
      - apiGroups: [""]
        resources: [pods, namespaces, nodes]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: [get, list, watch]
  extraEnvsFrom:
    - configMapRef:
        name: telemetry-env            # CLUSTER_NAME, OBS_OTLP_ENDPOINT, OBS_REMOTE_WRITE_URL (templates/env.yaml)
    - secretRef:
        name: telemetry-datadog        # DD_API_KEY, only with datadog.enabled
        optional: true
  resources:                           # memory_limiter keeps it under 80% of the limit
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Full collector config (alternateConfig: not merged with the chart defaults, which bring jaeger/zipkin/self-scrape
  # receivers that a parent chart cannot null out). Component names as of collector 0.163 (k8s_attributes, otlp_http).
  alternateConfig:
    extensions:
      health_check:
        endpoint: "${env:MY_POD_IP}:13133"
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "${env:MY_POD_IP}:4317" }
          http: { endpoint: "${env:MY_POD_IP}:4318" }
      webhookevent/falco:              # falcosidekick `cloudevents` output (addon falco); body = the Falco JSON
        endpoint: "${env:MY_POD_IP}:8088"
        path: /falco
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      # Same enrichment as the upstream tracing module's exporter collector: all pod labels as attributes (the
      # tracing adapter filters spans by openchoreo.dev/* labels), plus pod/namespace/node metadata.
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: OTEL_K8S_NODE_NAME
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: resource_attribute, name: k8s.pod.ip }]
          - sources: [{ from: connection }]
        extract:
          labels:
            - tag_name: $$1
              key_regex: (.*)
              from: pod
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
      resource/cluster:
        attributes:
          - { key: k8s.cluster.name, value: "${env:CLUSTER_NAME}", action: upsert }
          - { key: openchoreo_cluster_instance, value: "${env:CLUSTER_NAME}", action: upsert }   # == Fluent Bit's field
    exporters:
      otlp_http/observability:
        endpoint: "${env:OBS_OTLP_ENDPOINT}"     # OTLP/HTTP via the obs-plane Gateway (HTTPRoute -> receiver :4318)
        tls: { insecure: true }                  # plain HTTP locally (1.3.3 ships no ingest auth/TLS; #46)
      prometheusremotewrite/observability:
        endpoint: "${env:OBS_REMOTE_WRITE_URL}"
        resource_to_telemetry_conversion: { enabled: true }
        tls: { insecure: true }
      nop: {}
    service:
      extensions: [health_check]
      telemetry:
        logs: { level: info }
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [otlp_http/observability]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [prometheusremotewrite/observability]
        logs:
          receivers: [otlp, webhookevent/falco]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [nop]

# --- container logs: Fluent Bit only (OpenSearch + adapter live on mgmt) ----------------------------------------------
observability-logs-opensearch:
  openSearch:
    enabled: false
  openSearchCluster:
    enabled: false
  openSearchSetup:
    enabled: false
  adapter:
    enabled: false
  fluentBitCustomizations:
    clusterInstance: "${CLUSTER_NAME}"           # platform: Fluent Bit expands it from ConfigMap telemetry-env (envFrom)
  fluent-bit:
    enabled: true
    image:
      repository: cr.fluentbit.io/fluent/fluent-bit   # platform: fully qualified (chart default)
      tag: 5.1.5
      digest: sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4   # index: amd64, arm64, arm
    envFrom:
      - configMapRef:
          name: telemetry-env
    # Connect address (VHost below is the SNI). Local: the mgmt k3d serverlb container itself, because curl (upstream
    # wait-for-index-template init container) resolves every *.localhost name to loopback without asking DNS, so the
    # coredns-local rewrite never applies. Real installations: opensearch.observability.<controlPlane.host>.
    openSearchHost: k3d-platform-mgmt-serverlb
    openSearchPort: 11085                                            # == installation openchoreo.observability.tlsPort
    openSearchVHost: opensearch.observability.openchoreo.localhost   # SNI for the Gateway's TLS passthrough
    waitForIndexTemplate:
      image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777   # index: amd64, arm64, ...
    # Upstream init containers (observability-logs-opensearch 0.7.0) with the busybox image fully qualified and pinned:
    # the chart hardcodes `busybox:1.37.0` inside this templated string (copy kept identical otherwise).
    initContainers: |-
      - name: set-volume-ownership
        image: "{{ with .Values.global.imageRegistry }}{{ . }}/{{ end }}docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec"
        command: ["sh", "-c", "chown -R 10000:10000 /var/lib/fluent-bit/db"]
        resources:
          limits:
            cpu: 15m
            memory: "32Mi"
          requests:
            cpu: 10m
            memory: "24Mi"
        securityContext:
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - name: db
          mountPath: /var/lib/fluent-bit/db
      {{- if .Values.waitForIndexTemplate.enabled }}
      - name: wait-for-index-template
        image: "{{ with .Values.global.imageRegistry }}{{ . }}/{{ end }}{{ .Values.waitForIndexTemplate.image }}"
        command:
        - sh
        - -c
        - |
          for t in $TEMPLATES; do
            until [ "$(curl -sk -o /dev/null -w '%{http_code}' -u "$OPENSEARCH_USERNAME:$OPENSEARCH_PASSWORD" \
                  --connect-to "$OPENSEARCH_VHOST:$OPENSEARCH_PORT:$OPENSEARCH_HOST:$OPENSEARCH_PORT" \
                  "https://$OPENSEARCH_VHOST:$OPENSEARCH_PORT/_index_template/$t")" = "200" ]; do
              echo "Waiting for OpenSearch index template $t..."
              sleep 5
            done
            echo "Index template $t found"
          done
        env:
        - name: OPENSEARCH_HOST
          value: {{ .Values.openSearchHost | quote }}
        - name: OPENSEARCH_PORT
          value: {{ .Values.openSearchPort | quote }}
        - name: OPENSEARCH_VHOST
          value: {{ .Values.openSearchVHost | default "opensearch" | quote }}
        - name: TEMPLATES
          value: {{ join " " .Values.waitForIndexTemplate.templateNames | quote }}
        - name: OPENSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.waitForIndexTemplate.credentialsSecretName }}
              key: username
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.waitForIndexTemplate.credentialsSecretName }}
              key: password
        resources:
          limits:
            cpu: 15m
            memory: "32Mi"
          requests:
            cpu: 10m
            memory: "24Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
      {{- end }}
    resources:                                   # platform: upstream requests 25m/125Mi
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 192Mi }

# --- pod metrics: Prometheus agent -> remote write (cAdvisor + kube-state-metrics with OpenChoreo labels) -------------
observability-metrics-prometheus:
  global:
    installationMode: multiClusterExporter
  prometheusCustomizations:
    http:
      observabilityPlaneUrl: http://prometheus.observability.openchoreo.localhost:11080/api/v1/write
    agent:
      image: quay.io/prometheus/prometheus:v3.15.1-distroless@sha256:451a845bae1d51622b41af1780eb2ad911bbb79a9855bc8e9bb67fabbc03f934   # index: amd64, arm64, ...
  kube-prometheus-stack:
    prometheus:
      enabled: false
    alertmanager:
      enabled: false
    kubelet:
      serviceMonitor:
        # platform: upstream sets null (anonymous kubelet scrape). The agent's own SA token instead (Secret from
        # templates/prometheus-agent-token.yaml; ClusterRole openchoreo-prometheus-agent has nodes/metrics).
        authorization:
          type: Bearer
          credentials:
            name: openchoreo-prometheus-agent-token
            key: token
        # platform: no kubelet /metrics endpoint (#83). On k3s it also serves the embedded control plane
        # (apiserver, etcd, scheduler, workqueues): ~100k samples / 15 MB per scrape on dev1. Dropping those
        # families with metricRelabelings (#105) cut the stored series, not the cost of fetching, parsing and
        # caching each one, which kept the agent at 230-250Mi of the chart's hardcoded 256Mi limit. OpenChoreo's
        # metrics adapter (observability-metrics-prometheus 0.8.0) queries only container_cpu_usage_seconds_total
        # and container_memory_working_set_bytes (cAdvisor), kube_pod_* (kube-state-metrics), hubble_http_* and
        # OpenCost's node_*_hourly_cost: nothing reads kubelet_*, prober_* or the control-plane families.
        # /metrics/cadvisor and /metrics/probes stay; /metrics/resource stays off (chart default, duplicates cAdvisor).
        kubelet: false
    prometheusOperator:
      image:
        tag: v0.94.1
        sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a   # hex only (the chart adds @sha256:); index: amd64, arm64, ...
      prometheusConfigReloader:   # sidecar the operator adds to the Prometheus agent pod (operator flag, not a pod spec here)
        image:
          tag: v0.94.1
          sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b   # index: amd64, arm64, ...
      # platform: upstream limits 40m CPU / 60Mi. CFS throttling at 40m makes the informer cache sync miss its deadline
      # on clusters with many CRDs (dev1/Cilium: CrashLoopBackOff "failed to sync cache"). A null CPU limit does not
      # remove the subchart default here (it renders as 0, which the API rejects), so a startup-safe ceiling instead.
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: 500m, memory: 256Mi }
      admissionWebhooks:
        certManager:
          enabled: true                           # platform: no Helm hook Jobs under Argo (cert-manager on workloads)
    kube-state-metrics:
      image:
        tag: v2.20.0
        sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b   # with prefix (this chart adds only @); index: amd64, arm64, ...
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 128Mi }

# --- kgateway Envoy HTTP metrics -> remote write (promotion gate 5xx error rate; #104) ----------------------------------
# PodMonitor `kgateway-http` (templates/gateway-podmonitor.yaml) for the data-plane kgateway Envoy proxy pods in
# `openchoreo-data-plane` (port `http-monitoring` :9091, path /metrics = kgateway's `prometheus.io/*` annotations; the
# proxy serves Envoy's used-only stats there, ~3k lines vs ~11k on /stats/prometheus). The gateway terminates
# north-south HTTP on every data plane, independent of the CNI and of Istio ambient mTLS. Only
# `envoy_cluster_upstream_rq` (one series per upstream cluster x response code, labels envoy_cluster_name =
# kube_<namespace>_<service>_<port> and envoy_response_code) is kept so Envoy's other series do not cost agent memory.
gatewayMetrics:
  enabled: true
  keep: envoy_cluster_upstream_rq

# --- Hubble HTTP metrics -> remote write (OpenChoreo observer `metric: http`; #104) -------------------------------------
# ServiceMonitor `hubble-http` (templates/hubble-servicemonitor.yaml) for Cilium's `kube-system/hubble-metrics` Service
# (addon cilium; no targets on flannel clusters, and 0 series while cilium `l7Visibility.enabled` is false). Only the
# families the observer's metrics adapter queries are kept: the other Hubble families are L3/L4 counters nobody reads
# and would cost agent memory (see the kubelet note above).
hubbleMetrics:
  enabled: true
  keep: hubble_http_(requests_total|request_duration_seconds_(bucket|sum|count))

# --- k8s events -> OpenSearch k8s-events-* (Backstage events) ---------------------------------------------------------
observability-events-otel-collector:
  enabled: true
  collector:
    image:
      tag: 0.1.2@sha256:2ac7562b98dfb9c1837593dbc585f279856f15cb6c52f438621dd82d313dcc75   # index: amd64, arm64
    resources:                                    # platform: upstream requests 100m/128Mi
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 256Mi }
    extraEnv:
      - name: OPENSEARCH_USERNAME
        valueFrom: { secretKeyRef: { name: opensearch-admin-credentials, key: username } }
      - name: OPENSEARCH_PASSWORD
        valueFrom: { secretKeyRef: { name: opensearch-admin-credentials, key: password } }
  extraExtensions:
    basicauth/opensearch:
      client_auth:
        username: ${env:OPENSEARCH_USERNAME}
        password: ${env:OPENSEARCH_PASSWORD}
  exporters:
    opensearch:
      logs_index: k8s-events
      logs_index_time_format: yyyy-MM-dd
      http:
        endpoint: https://opensearch.observability.openchoreo.localhost:11085
        tls:
          insecure_skip_verify: true              # local OpenSearch serves its demo cert; real cert in the cloud
        auth:
          authenticator: basicauth/opensearch
  pipelineExporters: [opensearch]
