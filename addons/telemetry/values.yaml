# Data-plane telemetry on every workload cluster (namespace `telemetry`), shipping to the OpenChoreo observability plane
# on mgmt (addon openchoreo-observability-plane). docs/observability.md.
#
#   signal            collector (this chart)                        -> obs plane on mgmt (ingest URL)
#   container logs    Fluent Bit DaemonSet (logs module, OpenChoreo   -> OpenSearch  https://opensearch.observability.<host>:<tlsPort>
#                     schema: Backstage "Runtime Logs")                  (TLS passthrough, basic auth)
#   k8s events        events collector (OpenChoreo build)             -> OpenSearch  (same)
#   pod metrics       Prometheus agent (metrics module exporter mode,   -> Prometheus http://prometheus.observability.<host>:<httpPort>/api/v1/write
#                     cAdvisor + kube-state-metrics, OpenChoreo labels)
#   OTLP traces       OpenTelemetry Collector DaemonSet = FAN-OUT     -> OTLP/HTTP  http://opentelemetry.observability.<host>:<httpPort>
#   OTLP metrics      (apps, OBI, falcosidekick)                      -> remote write (as above)
#   OTLP/webhook logs (falcosidekick alerts, apps)                    -> nothing by default (Falco's JSON stdout already
#                                                                        reaches OpenSearch through Fluent Bit); Datadog overlay
#
# Datadog: installations/<inst>/addons/telemetry/values.yaml(.disabled) adds the datadog exporter/connector to the
# collector pipelines; the API key comes from the cluster's ClusterSecretStore `default`, key `datadog`.
# Endpoints and the cluster name reach the collector as env vars (ConfigMap telemetry-env, templated from
# installation.yaml); Fluent Bit's literal host/port below are checked against installation.yaml (templates/validate.yaml).
# Needs: external-secrets + ClusterSecretStore `default` (key `openchoreo-observability`: opensearch-username/-password),
# coredns-local on docker clusters (*.openchoreo.localhost -> mgmt k3d serverlb, which publishes 11080/11085).

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster:
  name: default
  role: workload
openchoreo:
  controlPlane:
    host: openchoreo.localhost
  observability:
    enabled: true
    httpPort: 11080
    tlsPort: 11085

# --- platform glue (templates/) -------------------------------------------------------------------------------------
secrets:
  store: default                       # workload clusters: ClusterSecretStore/default (AGENTS.md invariant 5)
  remoteKey: openchoreo-observability  # opensearch-username, opensearch-password (same key as on mgmt)

# Datadog fan-out (off). Enabling renders Secret telemetry-datadog (DD_API_KEY) from `secrets.store`, key `datadog`,
# property `api-key`; the collector loads it via envFrom (optional). The exporter/pipelines are a values overlay.
datadog:
  enabled: false
  remoteKey: datadog
  property: api-key

# --- OpenTelemetry Collector: the fan-out point ----------------------------------------------------------------------
opentelemetry-collector:
  mode: daemonset
  fullnameOverride: telemetry-collector
  image:
    repository: docker.io/otel/opentelemetry-collector-contrib   # contrib: k8sattributes, webhookevent, datadog, prw
  command:
    name: otelcol-contrib
  service:
    enabled: true
    internalTrafficPolicy: Local       # pods (and hostNetwork OBI) talk to the collector on their own node
  ports:
    otlp: { enabled: true }            # 4317 (also hostPort on the node)
    otlp-http: { enabled: true }       # 4318 (also hostPort on the node)
    falco:                             # falcosidekick webhook (CloudEvents) -> logs pipeline
      enabled: true
      containerPort: 8088
      servicePort: 8088
      protocol: TCP
    jaeger-compact: { enabled: false }
    jaeger-thrift: { enabled: false }
    jaeger-grpc: { enabled: false }
    zipkin: { enabled: false }
  clusterRole:
    create: true
    rules:                             # k8sattributes
      - apiGroups: [""]
        resources: [pods, namespaces, nodes]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: [get, list, watch]
  extraEnvsFrom:
    - configMapRef:
        name: telemetry-env            # CLUSTER_NAME, OBS_OTLP_ENDPOINT, OBS_REMOTE_WRITE_URL (templates/env.yaml)
    - secretRef:
        name: telemetry-datadog        # DD_API_KEY, only with datadog.enabled
        optional: true
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Full collector config (alternateConfig: not merged with the chart defaults, which bring jaeger/zipkin/self-scrape
  # receivers that a parent chart cannot null out). Component names as of collector 0.163 (k8s_attributes, otlp_http).
  alternateConfig:
    extensions:
      health_check:
        endpoint: "${env:MY_POD_IP}:13133"
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "${env:MY_POD_IP}:4317" }
          http: { endpoint: "${env:MY_POD_IP}:4318" }
      webhookevent/falco:              # falcosidekick `cloudevents` output (addon falco). VERIFY receiver name + payload
        endpoint: "${env:MY_POD_IP}:8088"
        path: /falco
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      # Same enrichment as the upstream tracing module's exporter collector: all pod labels as attributes (the
      # tracing adapter filters spans by openchoreo.dev/* labels), plus pod/namespace/node metadata.
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: OTEL_K8S_NODE_NAME
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: resource_attribute, name: k8s.pod.ip }]
          - sources: [{ from: connection }]
        extract:
          labels:
            - tag_name: $$1
              key_regex: (.*)
              from: pod
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
      resource/cluster:
        attributes:
          - { key: k8s.cluster.name, value: "${env:CLUSTER_NAME}", action: upsert }
          - { key: openchoreo_cluster_instance, value: "${env:CLUSTER_NAME}", action: upsert }   # == Fluent Bit's field
    exporters:
      otlp_http/observability:
        endpoint: "${env:OBS_OTLP_ENDPOINT}"     # OTLP/HTTP via the obs-plane Gateway (HTTPRoute -> receiver :4318)
        tls: { insecure: true }                  # VERIFY: plain HTTP locally (1.3.3 ships no ingest auth/TLS)
      prometheusremotewrite/observability:
        endpoint: "${env:OBS_REMOTE_WRITE_URL}"
        resource_to_telemetry_conversion: { enabled: true }
        tls: { insecure: true }
      nop: {}
    service:
      extensions: [health_check]
      telemetry:
        logs: { level: info }
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [otlp_http/observability]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [prometheusremotewrite/observability]
        logs:
          receivers: [otlp, webhookevent/falco]
          processors: [memory_limiter, k8s_attributes, resource/cluster, batch]
          exporters: [nop]

# --- container logs: Fluent Bit only (OpenSearch + adapter live on mgmt) ----------------------------------------------
observability-logs-opensearch:
  openSearch:
    enabled: false
  openSearchCluster:
    enabled: false
  openSearchSetup:
    enabled: false
  adapter:
    enabled: false
  fluentBitCustomizations:
    clusterInstance: "${CLUSTER_NAME}"           # platform: Fluent Bit expands it from ConfigMap telemetry-env (envFrom)
  fluent-bit:
    enabled: true
    image:
      repository: cr.fluentbit.io/fluent/fluent-bit   # platform: fully qualified (chart default)
    envFrom:
      - configMapRef:
          name: telemetry-env
    openSearchHost: opensearch.observability.openchoreo.localhost   # coredns-local -> mgmt k3d serverlb
    openSearchPort: 11085                                            # == installation openchoreo.observability.tlsPort
    openSearchVHost: opensearch.observability.openchoreo.localhost   # SNI for the Gateway's TLS passthrough
    resources:                                   # platform: upstream requests 25m/125Mi
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 192Mi }

# --- pod metrics: Prometheus agent -> remote write (cAdvisor + kube-state-metrics with OpenChoreo labels) -------------
observability-metrics-prometheus:
  global:
    installationMode: multiClusterExporter
  prometheusCustomizations:
    http:
      observabilityPlaneUrl: http://prometheus.observability.openchoreo.localhost:11080/api/v1/write
  kube-prometheus-stack:
    prometheus:
      enabled: false
    alertmanager:
      enabled: false
    kubelet:
      serviceMonitor:
        # platform: upstream sets null (anonymous kubelet scrape). The agent's own SA token instead (Secret from
        # templates/prometheus-agent-token.yaml; ClusterRole openchoreo-prometheus-agent has nodes/metrics).
        authorization:
          type: Bearer
          credentials:
            name: openchoreo-prometheus-agent-token
            key: token
    prometheusOperator:
      admissionWebhooks:
        certManager:
          enabled: true                           # platform: no Helm hook Jobs under Argo (cert-manager on workloads)
    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 128Mi }

# --- k8s events -> OpenSearch k8s-events-* (Backstage events) ---------------------------------------------------------
observability-events-otel-collector:
  enabled: true
  collector:
    resources:                                    # platform: upstream requests 100m/128Mi
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 256Mi }
    extraEnv:
      - name: OPENSEARCH_USERNAME
        valueFrom: { secretKeyRef: { name: opensearch-admin-credentials, key: username } }
      - name: OPENSEARCH_PASSWORD
        valueFrom: { secretKeyRef: { name: opensearch-admin-credentials, key: password } }
  extraExtensions:
    basicauth/opensearch:
      client_auth:
        username: ${env:OPENSEARCH_USERNAME}
        password: ${env:OPENSEARCH_PASSWORD}
  exporters:
    opensearch:
      logs_index: k8s-events
      logs_index_time_format: yyyy-MM-dd
      http:
        endpoint: https://opensearch.observability.openchoreo.localhost:11085
        tls:
          insecure_skip_verify: true              # VERIFY: OpenSearch demo cert; real cert in cloud installations
        auth:
          authenticator: basicauth/opensearch
  pipelineExporters: [opensearch]
