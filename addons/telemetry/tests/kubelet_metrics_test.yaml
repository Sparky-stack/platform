suite: telemetry kubelet scrape - no kubelet /metrics endpoint, cAdvisor + probes only (#83)
templates:
  - charts/observability-metrics-prometheus/charts/kube-prometheus-stack/templates/exporters/kubelet/servicemonitor.yaml
set:
  cluster.name: dev1
tests:
  - it: scrapes only /metrics/cadvisor and /metrics/probes (no kubelet /metrics, no /metrics/resource)
    asserts:
      - equal:
          path: metadata.name
          value: openchoreo-observability-kubelet
      - lengthEqual:
          path: spec.endpoints
          count: 2
      - equal:
          path: spec.endpoints[0].path
          value: /metrics/cadvisor
      - equal:
          path: spec.endpoints[1].path
          value: /metrics/probes

  - it: cAdvisor keeps the chart's relabelings (the container CPU/memory series the OpenChoreo adapter reads stay)
    asserts:
      - equal:
          path: spec.endpoints[0].metricRelabelings[0].regex
          value: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
      - notMatchRegex:
          path: spec.endpoints[0].metricRelabelings[0].regex
          pattern: usage_seconds_total|working_set

  - it: the remaining endpoints scrape with the agent's own token (not anonymously)
    asserts:
      - equal:
          path: spec.endpoints[0].authorization
          value:
            type: Bearer
            credentials:
              name: openchoreo-prometheus-agent-token
              key: token
      - equal:
          path: spec.endpoints[1].authorization.credentials.name
          value: openchoreo-prometheus-agent-token

  - it: negative - re-enabling the kubelet /metrics endpoint adds a path-less endpoint first
    set:
      observability-metrics-prometheus.kube-prometheus-stack.kubelet.serviceMonitor.kubelet: true
    asserts:
      - lengthEqual:
          path: spec.endpoints
          count: 3
      - isNull:
          path: spec.endpoints[0].path
