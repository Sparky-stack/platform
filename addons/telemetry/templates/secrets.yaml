{{- /*
Secrets from the workload cluster's ClusterSecretStore `default` (never committed):
  opensearch-admin-credentials  Fluent Bit + events collector -> OpenSearch on mgmt (key openchoreo-observability)
  telemetry-datadog             DD_API_KEY for the collector's datadog exporter (key datadog), only with datadog.enabled
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.store is required" .Values.secrets.store }}
  target:
    name: opensearch-admin-credentials
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.secrets.remoteKey }}, property: opensearch-username }
    - secretKey: password
      remoteRef: { key: {{ .Values.secrets.remoteKey }}, property: opensearch-password }
{{- if .Values.datadog.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telemetry-datadog
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: telemetry-datadog
  data:
    - secretKey: DD_API_KEY
      remoteRef: { key: {{ .Values.datadog.remoteKey }}, property: {{ .Values.datadog.property }} }
{{- end }}
