{{- /* Hubble HTTP metrics for the OpenChoreo observer: values.yaml `hubbleMetrics` (#104). */ -}}
{{- if .Values.hubbleMetrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hubble-http
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hubble-http
    app.kubernetes.io/part-of: telemetry
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: hubble                  # cilium chart: Service hubble-metrics (headless, one endpoint per agent)
  endpoints:
    - port: hubble-metrics
      scheme: http
      metricRelabelings:
        - action: keep
          sourceLabels: [__name__]
          regex: {{ .Values.hubbleMetrics.keep | quote }}
{{- end }}
