{{- /*
Per-cluster settings for the collectors as env vars (envFrom): subchart values cannot be templated from cluster.* or
installation.yaml, env vars can. CLUSTER_NAME also stamps Fluent Bit's openchoreo_cluster_instance.
*/ -}}
{{- $host := required "openchoreo.controlPlane.host is required" .Values.openchoreo.controlPlane.host }}
{{- $o := .Values.openchoreo.observability }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-env
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: telemetry
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  CLUSTER_NAME: {{ required "cluster.name is required (generated by the addon ApplicationSet)" .Values.cluster.name | quote }}
  OBS_OTLP_ENDPOINT: {{ printf "http://opentelemetry.observability.%s:%v" $host $o.httpPort | quote }}
  OBS_REMOTE_WRITE_URL: {{ printf "http://prometheus.observability.%s:%v/api/v1/write" $host $o.httpPort | quote }}
