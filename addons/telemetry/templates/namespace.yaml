{{- /* Argo CD creates the namespace (CreateNamespace=true); this object pins it out of the Istio ambient mesh (#53).
ztunnel's DNS proxy (istio-cni AMBIENT_DNS_CAPTURE, on by default) answers *.localhost names with loopback (RFC 6761):
enrolled, every exporter here lost the local installation's ingest hosts (*.observability.openchoreo.localhost ->
"dial tcp [::1]:11080: connection refused", seen live on dev1). `none` also wins over a stray namespace-level label.
Prune/Delete=false: removing this template or the app must never delete the namespace (Argo CD tracks it now). */ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    istio.io/dataplane-mode: none
