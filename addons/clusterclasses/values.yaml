# ClusterClasses in namespace `fleet` (docs/conventions.md). k3s-docker always; k3s-aws / k3s-hetzner when the
# installation enables the provider (installation.yaml `capi.providers`). Every class installs k3s with the
# cluster-api-k3s v0.5.0 bootstrap + control plane provider; the k3s version is the Cluster's topology.version.
# Per-cluster knobs are ClusterClass variables, set by charts/cluster from the fleet file (providerSpec, machineType).

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) ---------
cluster: { name: mgmt, role: mgmt, provider: docker, region: local, environment: mgmt }
installation: { name: local }
secrets: { backend: kubernetes }
capi:
  providers:
    docker: true
    aws: false
    hetzner: false

namespace: fleet

k3s:
  # Ingress is kgateway (OpenChoreo); k3s' bundled traefik is never wanted.
  disableComponents: [traefik]
  # Cloud classes also drop klipper servicelb: the cloud CCM (addons/aws-ccm, addons/hcloud-ccm) provides LoadBalancers.
  cloudDisableComponents: [traefik, servicelb]

docker:
  # Node OS only - k3s itself is installed at boot (curl get.k3s.io, version = topology.version). kindest/node is a
  # systemd-in-docker image CAPD knows how to bootstrap; its bundled kubeadm/containerd stay unused.
  kindImage: kindest/node:v1.35.8   # VERIFY with the first CAPD boot (k3s v1.35.10+k3s1 on top)

aws:
  controlPlaneMachineType: t3.large
  workerMachineType: t3.large
  # Created once per account by `clusterawsadm bootstrap iam create-cloudformation-stack` (policies include what the
  # AWS cloud-controller-manager needs on control-plane nodes).
  iamInstanceProfiles:
    controlPlane: control-plane.cluster-api-provider-aws.sigs.k8s.io
    nodes: nodes.cluster-api-provider-aws.sigs.k8s.io

hetzner:
  controlPlaneMachineType: cpx31
  workerMachineType: cpx31
  image: ubuntu-24.04
  networkZone: eu-central
  loadBalancerType: lb11
  # Secret in ns fleet read by CAPH (HetznerCluster.spec.hetznerSecretRef); CAPH copies it into every workload
  # cluster as kube-system/hcloud (keys token, network) for the hcloud cloud-controller-manager.
  secretName: hetzner

externalSecrets:
  store: platform
  refreshInterval: 1h
