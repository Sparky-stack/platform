{{- /*
k3s on CAPA (AWS). Rendered when capi.providers.aws. UNTESTED (no credentials): rendered + schema-checked only.
Node identity: plain Ubuntu AMI, k3s installed at boot. kubelet runs with --cloud-provider=external, k3s' embedded CCM is
off, node name = EC2 private DNS name (what the AWS CCM expects). The AWS cloud-controller-manager (addons/aws-ccm,
Argo CD, catalog providers: [aws]) initialises the nodes: providerID aws:///<az>/<instance-id>, addresses, removes the
uninitialized taint, and provides Service type LoadBalancer.
*/ -}}

{{- define "k3s-aws.cluster" -}}
template:
  spec:
    region: eu-central-1        # replaced by variable region
    sshKeyName: ""              # replaced by variable sshKeyName ("" = no key; omitted would mean key "default")
    controlPlaneLoadBalancer:
      # k3s serves an ECDSA certificate the classic ELB's SSL health check cannot negotiate -> TCP.
      healthCheckProtocol: TCP  # ELB type (CAPA default: classic) untested until the first AWS boot (#26)
    network:
      cni:
        # Node-to-node rules replacing CAPA's Calico defaults. Base = cni: cilium; patch cni-flannel swaps them.
        cniIngressRules:
          {{- include "k3s-aws.cniIngressRules.cilium" . | nindent 10 }}
{{- end }}

{{- define "k3s-aws.cniIngressRules.cilium" -}}
- description: cilium vxlan
  protocol: udp
  fromPort: 8472
  toPort: 8472
- description: cilium wireguard
  protocol: udp
  fromPort: 51871
  toPort: 51871
- description: cilium health
  protocol: tcp
  fromPort: 4240
  toPort: 4240
- description: cilium health icmp
  protocol: icmp
  fromPort: -1
  toPort: -1
- description: hubble peer (relay to agents)
  protocol: tcp
  fromPort: 4244
  toPort: 4244
{{- end }}

{{- define "k3s-aws.cniIngressRules.flannel" -}}
- description: flannel vxlan
  protocol: udp
  fromPort: 8472
  toPort: 8472
{{- end }}

{{- define "k3s-aws.machine" -}}
{{- $role := index . 0 }}{{ $root := index . 1 -}}
template:
  spec:
    instanceType: {{ ternary $root.Values.aws.controlPlaneMachineType $root.Values.aws.workerMachineType (eq $role "controlPlane") }}
    iamInstanceProfile: {{ index $root.Values.aws.iamInstanceProfiles $role }}
    ami:
      id: ami-00000000000000000   # replaced by variable ami
    sshKeyName: ""                # replaced by variable sshKeyName
    cloudInit:
      # Plain distro AMIs lack CAPA's secrets-manager boot helper: user data goes in the clear (IMDS-visible).
      insecureSkipSecretsManager: true
{{- end }}

{{- define "k3s-aws.controlPlane" -}}
template:
  spec:
    kthreesConfigSpec:
      files:
        {{- include "clusterclasses.cniFile" . | nindent 8 }}
      serverConfig:
        disableComponents: {{ toJson .Values.k3s.cloudDisableComponents }}
        cloudProviderName: external
        disableCloudController: true
      agentConfig:
        nodeName: {{`"{{ ds.meta_data.local_hostname }}"`}}   # cloud-init jinja: EC2 private DNS name
{{- end }}

{{- define "k3s-aws.worker" -}}
template:
  spec:
    agentConfig:
      nodeName: {{`"{{ ds.meta_data.local_hostname }}"`}}
{{- end }}

{{- if .Values.capi.providers.aws }}
{{- $ns := .Values.namespace }}
{{- $v := .Values.aws }}
{{- $clusterName := include "clusterclasses.templateName" (list "k3s-aws" (include "k3s-aws.cluster" .)) }}
{{- $cpMachineName := include "clusterclasses.templateName" (list "k3s-aws-control-plane" (include "k3s-aws.machine" (list "controlPlane" .))) }}
{{- $workerMachineName := include "clusterclasses.templateName" (list "k3s-aws-worker" (include "k3s-aws.machine" (list "nodes" .))) }}
{{- $cpName := include "clusterclasses.templateName" (list "k3s-aws-control-plane" (include "k3s-aws.controlPlane" .)) }}
{{- $workerName := include "clusterclasses.templateName" (list "k3s-aws-worker" (include "k3s-aws.worker" .)) }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: k3s-aws
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: AWSClusterTemplate
      name: {{ $clusterName }}
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KThreesControlPlaneTemplate
      name: {{ $cpName }}
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSMachineTemplate
        name: {{ $cpMachineName }}
  workers:
    machineDeployments:
      - class: default-worker
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KThreesConfigTemplate
            name: {{ $workerName }}
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: AWSMachineTemplate
            name: {{ $workerMachineName }}
        {{- include "clusterclasses.workerHealthCheck" . | nindent 8 }}
  variables:
    - name: region
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: AWS region (fleet file `region`).
    - name: ami
      required: true
      schema:
        openAPIV3Schema:
          type: string
          pattern: ^ami-[0-9a-f]+$
          description: AMI in `region` with cloud-init (e.g. Ubuntu 24.04 LTS); k3s is installed at boot.
    - name: sshKeyName
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: ""
          description: EC2 key pair for all nodes ("" = none).
    - name: controlPlaneMachineType
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: {{ $v.controlPlaneMachineType }}
    - name: workerMachineType
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: {{ $v.workerMachineType }}
    {{- include "clusterclasses.commonVariables" . | nindent 4 }}
  patches:
    - name: cluster
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: AWSClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/region
              valueFrom:
                variable: region
            - op: replace
              path: /spec/template/spec/sshKeyName
              valueFrom:
                variable: sshKeyName
    - name: machines
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: AWSMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/ami/id
              valueFrom:
                variable: ami
            - op: replace
              path: /spec/template/spec/sshKeyName
              valueFrom:
                variable: sshKeyName
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: AWSMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/instanceType
              valueFrom:
                variable: controlPlaneMachineType
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: AWSMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/instanceType
              valueFrom:
                variable: workerMachineType
    # cni-flannel replaces the whole control-plane files list: it must run before every patch that appends files.
    {{- include "clusterclasses.cniFlannelPatch" "flannel-backend: vxlan" | nindent 4 }}
    - name: registryAuth
      enabledIf: {{`"{{ .registryAuth }}"`}}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KThreesControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            {{- include "clusterclasses.registriesPatch" (list "/spec/template/spec/kthreesConfigSpec/files" true) | nindent 12 }}
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KThreesConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            {{- include "clusterclasses.registriesPatch" (list "/spec/template/spec/files" false) | nindent 12 }}
    {{- include "clusterclasses.registryCAPatch" . | nindent 4 }}
    - name: cni-flannel-security-groups
      enabledIf: {{`'{{ if eq .cni "flannel" }}true{{ end }}'`}}
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: AWSClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/network/cni/cniIngressRules
              value:
                {{- include "k3s-aws.cniIngressRules.flannel" . | nindent 16 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSClusterTemplate
metadata:
  name: {{ $clusterName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-aws.cluster" . | nindent 2 }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KThreesControlPlaneTemplate
metadata:
  name: {{ $cpName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-aws.controlPlane" . | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: {{ $cpMachineName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-aws.machine" (list "controlPlane" .) | nindent 2 }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KThreesConfigTemplate
metadata:
  name: {{ $workerName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-aws.worker" . | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: {{ $workerMachineName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-aws.machine" (list "nodes" .) | nindent 2 }}
{{- end }}
