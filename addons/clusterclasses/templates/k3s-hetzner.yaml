{{- /*
k3s on CAPH (Hetzner Cloud). Rendered when capi.providers.hetzner. UNTESTED (no credentials): rendered + schema-checked.
Node identity: kubelet --cloud-provider=external, k3s' embedded CCM off. The hcloud cloud-controller-manager
(addons/hcloud-ccm, Argo CD, catalog providers: [hetzner]) matches Node name == server name (CAPH names servers after
the Machine) and sets providerID hcloud://<server-id>, addresses, removes the uninitialized taint, provides LBs. It
reads kube-system/hcloud, which CAPH itself writes into every workload cluster (reconcileWorkloadClusterSecrets:
keys token, network, from hetznerSecretRef) - no extra secret plumbing.
Pod network (variable cni): cilium (default) = Cilium VXLAN overlay + Cilium WireGuard (UDP 8472/51871); flannel =
k3s flannel with the wireguard-native backend (UDP 51820). Both encrypt node-to-node traffic themselves and need no
hcloud network routes, so the CCM route controller stays off (hcloud-ccm networking.enabled=false). CAPH creates no
firewall, so no port rules are needed. Untested until the first Hetzner boot (#26).
*/ -}}

{{- define "k3s-hetzner.cluster" -}}
template:
  spec:
    controlPlaneRegions: [fsn1]       # replaced by variable region
    controlPlaneLoadBalancer:
      region: fsn1                    # replaced by variable region
      type: {{ .Values.hetzner.loadBalancerType }}
    hcloudNetwork:
      enabled: true
      networkZone: {{ .Values.hetzner.networkZone }}   # replaced by variable networkZone
    hcloudPlacementGroups:
      - name: control-plane
        type: spread
      - name: workers
        type: spread
    hetznerSecretRef:
      name: {{ .Values.hetzner.secretName }}
      key:
        hcloudToken: hcloud
    sshKeys: {}                       # hcloud keys added from variable sshKey
{{- end }}

{{- define "k3s-hetzner.machine" -}}
{{- $role := index . 0 }}{{ $root := index . 1 -}}
template:
  spec:
    type: {{ ternary $root.Values.hetzner.controlPlaneMachineType $root.Values.hetzner.workerMachineType (eq $role "control-plane") }}
    imageName: {{ $root.Values.hetzner.image }}   # replaced by variable image
    placementGroupName: {{ ternary "control-plane" "workers" (eq $role "control-plane") }}
{{- end }}

{{- define "k3s-hetzner.controlPlane" -}}
template:
  spec:
    kthreesConfigSpec:
      serverConfig:
        disableComponents: {{ toJson .Values.k3s.cloudDisableComponents }}
        cloudProviderName: external
        disableCloudController: true
      files:
        {{- include "clusterclasses.cniFile" . | nindent 8 }}
{{- end }}

{{- define "k3s-hetzner.worker" -}}
template:
  spec: {}   # agents follow the servers' CNI settings; kubelet --cloud-provider=external is the provider default
{{- end }}

{{- if .Values.capi.providers.hetzner }}
{{- $ns := .Values.namespace }}
{{- $v := .Values.hetzner }}
{{- $clusterName := include "clusterclasses.templateName" (list "k3s-hetzner" (include "k3s-hetzner.cluster" .)) }}
{{- $cpMachineName := include "clusterclasses.templateName" (list "k3s-hetzner-control-plane" (include "k3s-hetzner.machine" (list "control-plane" .))) }}
{{- $workerMachineName := include "clusterclasses.templateName" (list "k3s-hetzner-worker" (include "k3s-hetzner.machine" (list "worker" .))) }}
{{- $cpName := include "clusterclasses.templateName" (list "k3s-hetzner-control-plane" (include "k3s-hetzner.controlPlane" .)) }}
{{- $workerName := include "clusterclasses.templateName" (list "k3s-hetzner-worker" (include "k3s-hetzner.worker" .)) }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: k3s-hetzner
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HetznerClusterTemplate
      name: {{ $clusterName }}
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KThreesControlPlaneTemplate
      name: {{ $cpName }}
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: {{ $cpMachineName }}
  workers:
    machineDeployments:
      - class: default-worker
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KThreesConfigTemplate
            name: {{ $workerName }}
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            name: {{ $workerMachineName }}
        {{- include "clusterclasses.workerHealthCheck" . | nindent 8 }}
  variables:
    - name: region
      required: true
      schema:
        openAPIV3Schema:
          type: string
          enum: [fsn1, hel1, nbg1, ash, hil, sin]
          description: Hetzner location for the control plane and its load balancer (fleet file `region`).
    - name: networkZone
      required: false
      schema:
        openAPIV3Schema:
          type: string
          enum: [eu-central, us-east, us-west, ap-southeast]
          default: {{ $v.networkZone }}
          description: Must contain `region` (eu-central = fsn1/nbg1/hel1).
    - name: sshKey
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: ""
          description: Name of an SSH key in the Hetzner project, put on every server ("" = none).
    - name: image
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: {{ $v.image }}
          description: Hetzner image name with cloud-init; k3s is installed at boot.
    - name: controlPlaneMachineType
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: {{ $v.controlPlaneMachineType }}
    - name: workerMachineType
      required: false
      schema:
        openAPIV3Schema:
          type: string
          default: {{ $v.workerMachineType }}
    {{- include "clusterclasses.commonVariables" . | nindent 4 }}
  patches:
    - name: cluster
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HetznerClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/controlPlaneRegions
              valueFrom:
                template: {{`"[{{ .region | quote }}]"`}}
            - op: replace
              path: /spec/template/spec/controlPlaneLoadBalancer/region
              valueFrom:
                variable: region
            - op: replace
              path: /spec/template/spec/hcloudNetwork/networkZone
              valueFrom:
                variable: networkZone
    - name: sshKey
      enabledIf: {{`"{{ if .sshKey }}true{{ end }}"`}}
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HetznerClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/sshKeys/hcloud
              valueFrom:
                template: {{`"[{\"name\": {{ .sshKey | quote }}}]"`}}
    - name: machines
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/imageName
              valueFrom:
                variable: image
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/type
              valueFrom:
                variable: controlPlaneMachineType
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/type
              valueFrom:
                variable: workerMachineType
    # cni-flannel replaces the whole control-plane files list: it must run before every patch that appends files.
    {{- include "clusterclasses.cniFlannelPatch" "flannel-backend: wireguard-native" | nindent 4 }}
    - name: registryAuth
      enabledIf: {{`"{{ .registryAuth }}"`}}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KThreesControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            {{- include "clusterclasses.registriesPatch" (list "/spec/template/spec/kthreesConfigSpec/files" true) | nindent 12 }}
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KThreesConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            {{- include "clusterclasses.registriesPatch" (list "/spec/template/spec/files" false) | nindent 12 }}
    {{- include "clusterclasses.registryCAPatch" . | nindent 4 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerClusterTemplate
metadata:
  name: {{ $clusterName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.cluster" . | nindent 2 }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KThreesControlPlaneTemplate
metadata:
  name: {{ $cpName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.controlPlane" . | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ $cpMachineName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.machine" (list "control-plane" .) | nindent 2 }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KThreesConfigTemplate
metadata:
  name: {{ $workerName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.worker" . | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ $workerMachineName }}
  namespace: {{ $ns }}
  annotations:
    {{- include "clusterclasses.annotations" . | nindent 4 }}
spec:
  {{- include "k3s-hetzner.machine" (list "worker" .) | nindent 2 }}
---
# CAPH token for every HetznerCluster (hetznerSecretRef). Never committed: platform store key capi-hetzner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.hetzner.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store }}
  target:
    name: {{ .Values.hetzner.secretName }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # CAPH sets it too; keeping it in the template stops ESO and CAPH from fighting over it (untested, #26)
          clusterctl.cluster.x-k8s.io/move: ""
  data:
    - secretKey: hcloud
      remoteRef:
        key: capi-hetzner
        property: hcloud
{{- end }}
