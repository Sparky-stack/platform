# Workload clusters with provider hetzner (catalog: namespace kube-system, roles [workload], providers [hetzner]).
# Initialises k3s nodes started with --cloud-provider=external (ClusterClass k3s-hetzner): providerID
# hcloud://<server-id>, addresses, uninitialized taint; Service type LoadBalancer -> Hetzner LB.
# Credentials: kube-system/hcloud (keys token, network) is written into the workload cluster by CAPH itself
# (HetznerCluster reconcileWorkloadClusterSecrets), which is the chart's default secret - nothing to wire here.
# Must run in kube-system (secretKeyRef is namespace-local).

# Generated by the addon ApplicationSet (defaults keep `helm template` working standalone). Unused here.
cluster: { name: dev-fsn1, role: workload, provider: hetzner, region: fsn1, environment: development }
installation: { name: hetzner-example }

hcloud-cloud-controller-manager:
  # Pod network is k3s flannel (wireguard-native) -> no CCM route controller / cluster CIDR allocation.
  networking:
    enabled: false   # VERIFY with the first Hetzner boot (alternative: native routing over the hcloud network)
  image:
    repository: docker.io/hetznercloud/hcloud-cloud-controller-manager
