# Workload clusters with provider aws (catalog: namespace kube-system, roles [workload], providers [aws]).
# Initialises k3s nodes started with --cloud-provider=external and node-name = EC2 private DNS name (ClusterClass
# k3s-aws): providerID aws:///<az>/<instance-id>, addresses, uninitialized taint; Service type LoadBalancer -> ELB/NLB.
# Credentials: the control-plane instance profile (control-plane.cluster-api-provider-aws.sigs.k8s.io from
# clusterawsadm) - no secret. Cluster ID comes from the instance's kubernetes.io/cluster/<name> tag set by CAPA.

# Generated by the addon ApplicationSet (defaults keep `helm template` working standalone). Unused here.
cluster: { name: prod-euc1, role: workload, provider: aws, region: eu-central-1, environment: production }
installation: { name: aws-example }

aws-cloud-controller-manager:
  image:
    repository: registry.k8s.io/provider-aws/cloud-controller-manager
    # minor follows the workload Kubernetes minor (k3s v1.35); pinned by multi-arch index digest
    tag: v1.35.0@sha256:bf5a41be5f0dd5049cc1f69e1a23ff2691f2f46483546204676cea78796e75cd   # index: amd64, arm64
  args:
    - --v=2
    - --cloud-provider=aws
    - --configure-cloud-routes=false   # pod network is k3s flannel (VXLAN), no VPC routes
  # k3s labels servers node-role.kubernetes.io/control-plane=true (kubeadm: ""), so the chart default never matches.
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  # Run before CNI/CoreDNS are usable on a node that is still uninitialized.
  hostNetworking: true
