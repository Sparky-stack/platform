# CloudNativePG on workload clusters: opt-in (catalog default false; enable per cluster with label
# addons.platform.koorikla.io/cloudnative-pg: "true", i.e. cluster file `addons: { cloudnative-pg: true }`).
# docs/data-services.md "PostgreSQL (CloudNativePG)".
#
# CRDs: rendered by the chart (crds.create) and applied server-side by Argo CD (the Cluster CRD exceeds the client-side
# last-applied annotation limit). The operator generates its webhook certificate and patches the webhook caBundles
# itself; the catalog entry syncs with ServerSideDiff so those controller-owned fields never show as drift.
#
# Watch scope: cluster-wide (config.clusterWide: OpenChoreo cell namespaces dp-* are created at runtime). RBAC this
# implies: ClusterRole cnpg - Clusters/Poolers/Backups/... plus the Pods (incl. pods/exec), PVCs, Services, Secrets,
# ConfigMaps, Jobs, PDBs, Roles/RoleBindings, ServiceAccounts and PodMonitors it creates for every PostgreSQL cluster,
# in every namespace, and its own webhook configurations. Aggregation to admin/edit/view stays off (cnpg-edit/-view
# exist for explicit bindings).
#
# Images: multi-arch (amd64, arm64), pinned by digest - the operator (also the instance manager it injects into every
# PostgreSQL pod: OPERATOR_IMAGE_NAME follows image.tag), and the defaults for Clusters / Poolers that set no image
# (POSTGRES_IMAGE_NAME, PGBOUNCER_IMAGE_NAME). "standard" PostgreSQL images: no in-tree barman-cloud; backups go through
# the Barman Cloud plugin (below), the current upstream path.
# Metrics: PodMonitor for the operator, scraped by the Prometheus agent of addon telemetry (every PodMonitor, every
# namespace). PostgreSQL instances expose :9187; their PodMonitor is per Cluster (docs/data-services.md).

namespace:
  # -- `restricted` Pod Security admission label on namespace `cnpg-system`.
  podSecurity: restricted           # Pod Security admission level enforced on the operator namespace ("" = no labels)
  # Istio ambient mesh client (#53): the CNPG operator reaches PostgreSQL
  # instance pods (status :8000) in cell namespaces, which enforce STRICT mTLS (addon
  # kyverno-policies templates/cell-mesh.yaml) and refuse plaintext from outside the mesh. Inert without Istio.
  ambient: true

cloudnative-pg:
  fullnameOverride: cnpg            # Deployment/ServiceAccount/ClusterRole cnpg (upstream's documented names)
  image:
    repository: ghcr.io/cloudnative-pg/cloudnative-pg
    tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"
  crds:
    create: true
  config:
    # -- `true` (watches all namespaces, including OpenChoreo `dp-*` cells).
    clusterWide: true
    data:
      POSTGRES_IMAGE_NAME: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:de572898499fab9406f0da51929da562f96f3be40ca79fafea8ec1a8d5b42065"
      PGBOUNCER_IMAGE_NAME: "ghcr.io/cloudnative-pg/pgbouncer:1.25.2@sha256:b15c428057d1ffbc19fb70496911a5f1a47066dcc1315bf794f4e85ade29e2e5"
  # Pod Security restricted: upstream defaults (restated so an upstream change cannot loosen them; unit-tested).
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
    capabilities: { drop: [ALL] }
  resources:                        # platform: upstream sets none
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }
  monitoring:
    podMonitorEnabled: true         # needs addon telemetry (prometheus-operator CRDs) on the same cluster

# ClusterImageCatalog "postgresql-standard": the PostgreSQL image per major version for Clusters that reference the
# catalog (spec.imageCatalogRef) instead of an image - every PostgreSQL XR of addon crossplane (docs/data-services.md
# "PostgreSQL as a service"). Same "standard" flavour as POSTGRES_IMAGE_NAME; multi-arch, pinned by digest.
imageCatalog:
  # -- `ClusterImageCatalog/postgresql-standard` (`imageCatalog.{enabled,name,images}`) with digest-pinned PostgreSQL 16/17/18 images.
  enabled: true
  name: postgresql-standard
  images:
    "16": ghcr.io/cloudnative-pg/postgresql:16.16-standard-trixie@sha256:0848a2f80eb48d9bff76857ce988a6053b4120e7ecbdc4414e24cb1cd2df0754
    "17": ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie@sha256:b6d31545fc2c500cc56af2cff91bbc37408deff6815b84446da0a2c9a54b3d1c
    "18": ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:de572898499fab9406f0da51929da562f96f3be40ca79fafea8ec1a8d5b42065

# Barman Cloud plugin (CNPG-I): WAL archiving + base backups to S3 / GCS / Azure Blob through ObjectStore resources,
# replacing the deprecated in-tree spec.backup.barmanObjectStore. Off by default (nothing to back up to locally); turn on
# per installation/cluster overlay together with an object store reachable through workload identity
# (docs/data-services.md "Backups"). Must run in the operator's namespace; certificates from cert-manager.
plugin-barman-cloud:
  # -- `false` by default; enables object-storage backups when turned on.
  enabled: false
  image:
    registry: ghcr.io
    repository: cloudnative-pg/plugin-barman-cloud
    tag: "v0.16.0@sha256:6404a416718bd7aad943c67a25a7bb20d0558b43edfeab0bf167f013ca435882"
  sidecarImage:
    registry: ghcr.io
    repository: cloudnative-pg/plugin-barman-cloud-sidecar
    tag: "v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0"
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
