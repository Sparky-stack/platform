suite: cloudnative-pg wrapper
release:
  name: cloudnative-pg
  namespace: cnpg-system
templates:
  - templates/namespace.yaml
  - charts/cloudnative-pg/templates/deployment.yaml
  - charts/cloudnative-pg/templates/config.yaml
  - charts/cloudnative-pg/templates/rbac.yaml
  - charts/cloudnative-pg/templates/monitoring-configmap.yaml
  - charts/cloudnative-pg/templates/podmonitor.yaml
  - charts/cloudnative-pg/templates/crds/crds.yaml
  - charts/plugin-barman-cloud/templates/deployment.yaml
  - charts/plugin-barman-cloud/templates/configmap.yaml
  - templates/image-catalog.yaml
tests:
  - it: the operator image (also the instance manager in every PostgreSQL pod) is pinned by digest
    template: charts/cloudnative-pg/templates/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/cloudnative-pg/cloudnative-pg:1\.30\.1@sha256:[0-9a-f]{64}$'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_IMAGE_NAME
            value: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07

  - it: default PostgreSQL and PgBouncer images are multi-arch standard images pinned by digest
    template: charts/cloudnative-pg/templates/config.yaml
    asserts:
      - matchRegex:
          path: data.POSTGRES_IMAGE_NAME
          pattern: '^ghcr\.io/cloudnative-pg/postgresql:[0-9.]+-standard-trixie@sha256:[0-9a-f]{64}$'
      - matchRegex:
          path: data.PGBOUNCER_IMAGE_NAME
          pattern: '^ghcr\.io/cloudnative-pg/pgbouncer:[0-9.]+@sha256:[0-9a-f]{64}$'

  - it: watches all namespaces (documented RBAC)
    template: charts/cloudnative-pg/templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: WATCH_NAMESPACE }
          any: true

  - it: the operator pod meets Pod Security restricted
    template: charts/cloudnative-pg/templates/deployment.yaml
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - notExists: { path: spec.template.spec.hostNetwork }

  - it: CRDs are part of the chart (applied server-side by Argo CD)
    template: charts/cloudnative-pg/templates/crds/crds.yaml
    documentSelector: { path: metadata.name, value: clusters.postgresql.cnpg.io }
    asserts:
      - isKind: { of: CustomResourceDefinition }

  - it: operator metrics are scraped by a PodMonitor
    template: charts/cloudnative-pg/templates/podmonitor.yaml
    asserts:
      - isKind: { of: PodMonitor }
      - equal: { path: metadata.namespace, value: cnpg-system }

  - it: no PodMonitor when monitoring is off
    template: charts/cloudnative-pg/templates/podmonitor.yaml
    set:
      cloudnative-pg.monitoring.podMonitorEnabled: false
    asserts:
      - hasDocuments: { count: 0 }


  - it: when switched on, the Barman Cloud plugin and its sidecar are pinned by digest and restricted
    set:
      plugin-barman-cloud.enabled: true
    template: charts/plugin-barman-cloud/templates/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/cloudnative-pg/plugin-barman-cloud:v[0-9.]+@sha256:[0-9a-f]{64}$'
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]

  - it: the Barman Cloud sidecar image injected into PostgreSQL pods is pinned by digest
    set:
      plugin-barman-cloud.enabled: true
    template: charts/plugin-barman-cloud/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data.SIDECAR_IMAGE
          pattern: '^ghcr\.io/cloudnative-pg/plugin-barman-cloud-sidecar:v[0-9.]+@sha256:[0-9a-f]{64}$'

  - it: the operator namespace enforces Pod Security restricted
    template: templates/namespace.yaml
    asserts:
      - equal: { path: metadata.name, value: cnpg-system }
      - equal:
          path: 'metadata.labels["pod-security.kubernetes.io/enforce"]'
          value: restricted

  - it: no Namespace object without a Pod Security level
    template: templates/namespace.yaml
    set:
      namespace.podSecurity: ""
    asserts:
      - hasDocuments: { count: 0 }

  - it: the ClusterImageCatalog pins one multi-arch standard image per supported major
    template: templates/image-catalog.yaml
    asserts:
      - isKind: { of: ClusterImageCatalog }
      - equal: { path: metadata.name, value: postgresql-standard }
      - lengthEqual: { path: spec.images, count: 3 }
      - equal: { path: 'spec.images[0].major', value: 16 }
      - equal: { path: 'spec.images[1].major', value: 17 }
      - equal: { path: 'spec.images[2].major', value: 18 }
      - matchRegex:
          path: spec.images[0].image
          pattern: '^ghcr\.io/cloudnative-pg/postgresql:16\.[0-9]+-standard-trixie@sha256:[0-9a-f]{64}$'
      - matchRegex:
          path: spec.images[2].image
          pattern: '^ghcr\.io/cloudnative-pg/postgresql:18\.[0-9]+-standard-trixie@sha256:[0-9a-f]{64}$'

  - it: no ClusterImageCatalog when switched off
    template: templates/image-catalog.yaml
    set:
      imageCatalog.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
