{{- /* One pinned PostgreSQL image per major: a bump here rolls every catalog-backed Cluster of that major. */ -}}
{{- with .Values.imageCatalog }}
{{- if .enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: {{ .name }}
spec:
  images:
    {{- range $major, $image := .images }}
    - major: {{ int $major }}
      image: {{ $image | quote }}
    {{- end }}
{{- end }}
{{- end }}
