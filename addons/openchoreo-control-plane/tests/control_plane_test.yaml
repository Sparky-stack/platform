suite: openchoreo-control-plane glue and guards
templates:
  - templates/validate.yaml
  - templates/gateway-ca-crs.yaml
  - templates/backstage-secrets.yaml
  - templates/backstage-github-app.yaml
  - templates/mcp-service-role.yaml
  - charts/openchoreo-control-plane/templates/authz/bootstrap-configmap.yaml
  - charts/openchoreo-control-plane/templates/backstage/extra-config-configmap.yaml
  - charts/openchoreo-control-plane/templates/backstage/deployment.yaml
  - charts/openchoreo-control-plane/templates/cluster-gateway/certificate.yaml
  - charts/openchoreo-control-plane/templates/cluster-gateway/tlsroute.yaml
tests:
  - it: gateway CA payload carries only the public cert, into fleet, typed for CRS
    template: templates/gateway-ca-crs.yaml
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: metadata.namespace, value: fleet }
      - equal: { path: metadata.name, value: openchoreo-gateway-ca }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: mgmt-openchoreo } }
      - equal: { path: spec.target.template.type, value: addons.cluster.x-k8s.io/resource-set }
      - equal:
          path: spec.data
          value: [{ secretKey: cacrt, remoteRef: { key: cluster-gateway-ca, property: ca.crt } }]
      - matchRegex:
          path: spec.target.template.data["cluster-gateway-ca.yaml"]
          pattern: 'kind: ConfigMap\nmetadata:\n  name: cluster-gateway-ca\n  namespace: openchoreo-data-plane'
      - notMatchRegex:
          path: spec.target.template.data["cluster-gateway-ca.yaml"]
          pattern: 'tls\.key'

  - it: backstage-secrets from the platform store with the mandatory keys
    template: templates/backstage-secrets.yaml
    asserts:
      - equal: { path: metadata.name, value: backstage-secrets }
      - equal: { path: spec.secretStoreRef.name, value: platform }
      - equal: { path: spec.target.template.data.jenkins-api-key, value: placeholder-not-in-use }
      - contains:
          path: spec.data
          content: { secretKey: client-secret, remoteRef: { key: openchoreo, property: backstage-client-secret } }

  - it: cluster-gateway server cert covers the name agents dial
    template: charts/openchoreo-control-plane/templates/cluster-gateway/certificate.yaml
    asserts:
      - contains: { path: spec.dnsNames, content: cluster-gateway.openchoreo.localhost }

  - it: TLS passthrough route for the agent host
    template: charts/openchoreo-control-plane/templates/cluster-gateway/tlsroute.yaml
    asserts:
      - equal: { path: spec.hostnames, value: [cluster-gateway.openchoreo.localhost] }
      - equal:
          path: spec.parentRefs[0].sectionName
          value: tls-passthrough

  - it: fails when the console host drifts from the installation
    template: templates/validate.yaml
    set:
      openchoreo.controlPlane.host: example.com
    asserts:
      - failedTemplate: {}

  - it: fails when the agent URL host is not the TLS route host / cert SAN
    template: templates/validate.yaml
    set:
      openchoreo.controlPlane.clusterGatewayURL: wss://gw.example.com:8443/ws
    asserts:
      - failedTemplate: {}

  - it: fails when the agent URL port is not the passthrough listener port
    template: templates/validate.yaml
    set:
      openchoreo.controlPlane.clusterGatewayURL: wss://cluster-gateway.openchoreo.localhost:443/ws
    asserts:
      - failedTemplate: {}

  - it: fails when Backstage observability features drift from the installation
    template: templates/validate.yaml
    set:
      openchoreo.observability.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "openchoreo-control-plane.backstage.features.observability.enabled (true) must equal openchoreo.observability.enabled (false)"

  - it: observability off in both places renders
    template: templates/validate.yaml
    set:
      openchoreo.observability.enabled: false
      openchoreo-control-plane.backstage.features.observability.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  # --- golden-path templates (docs/project-templates.md) -----------------------------------------------------------
  - it: Backstage loads the golden-path templates Location and keeps the image's own locations
    template: charts/openchoreo-control-plane/templates/backstage/extra-config-configmap.yaml
    asserts:
      - matchRegex:
          path: data["app-config.extra.yaml"]
          pattern: 'target: https://github.com/koorikla/platform/blob/main/templates/catalog-info.yaml'
      - matchRegex:
          path: data["app-config.extra.yaml"]
          pattern: 'target: /app/catalog-entities/org.yaml'
      - matchRegex:
          path: data["app-config.extra.yaml"]
          pattern: 'target: /app/templates/create-openchoreo-clusterworkflow/template.yaml'
      - matchRegex:
          path: data["app-config.extra.yaml"]
          pattern: '- allow:\n    - Template\n    locations:\n    - exact: https://github.com/koorikla/platform/blob/main/templates/catalog-info.yaml\n      type: url'
      - notMatchRegex:
          path: data["app-config.extra.yaml"]
          pattern: 'template.yaml\n      type: url'   # a per-template pattern never matches the origin Backstage checks

  - it: the extra config is passed to Backstage
    template: charts/openchoreo-control-plane/templates/backstage/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: app-config.extra.yaml

  - it: no GitHub App credential unless switched on
    template: templates/backstage-github-app.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: GitHub App switched on with its integration and env renders the credential ExternalSecret
    template: templates/backstage-github-app.yaml
    values: [values/scaffolder-github-app.yaml]
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: metadata.name, value: backstage-github-app }
      - equal: { path: spec.secretStoreRef, value: { kind: ClusterSecretStore, name: platform } }
      - equal:
          path: spec.data
          value:
            - { secretKey: app-id, remoteRef: { key: platform-github-app, property: githubAppID } }
            - { secretKey: private-key, remoteRef: { key: platform-github-app, property: githubAppPrivateKey } }

  - it: GitHub App switched on with its integration and env passes validation
    template: templates/validate.yaml
    values: [values/scaffolder-github-app.yaml]
    asserts:
      - hasDocuments: { count: 0 }

  - it: fails when the GitHub App is switched on without the Backstage integration
    template: templates/validate.yaml
    set:
      scaffolder.githubApp.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "scaffolder.githubApp.enabled needs openchoreo-control-plane.backstage.appConfig.integrations.github[].apps (docs/project-templates.md)"

  - it: fails when the Backstage integration references the App but the credential is off
    template: templates/validate.yaml
    values: [values/scaffolder-github-app.yaml]
    set:
      scaffolder.githubApp.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "openchoreo-control-plane.backstage.appConfig.integrations.github[].apps is set but scaffolder.githubApp.enabled is false (no credentials Secret)"

  - it: fails when the App env does not come from the credential Secret
    template: templates/validate.yaml
    values: [values/scaffolder-github-app.yaml]
    set:
      openchoreo-control-plane.backstage.extraEnv: []
    asserts:
      - failedTemplate:
          errorMessage: "scaffolder.githubApp.enabled needs openchoreo-control-plane.backstage.extraEnv GITHUB_APP_ID and GITHUB_APP_PRIVATE_KEY from Secret backstage-github-app"

  # Headless MCP client (docs/ai-agents.md "OpenChoreo MCP servers"): read-only role, upstream binding re-pointed to it.
  - it: mcp-service role grants view actions and workflowrun:create only
    template: templates/mcp-service-role.yaml
    asserts:
      - isKind: { of: ClusterAuthzRole }
      - equal: { path: metadata.name, value: mcp-service }
      - contains: { path: spec.actions, content: workflowrun:create }
      - notContains: { path: spec.actions, content: secret:view }
      - notContains: { path: spec.actions, content: resource:read-secrets }
      - notContains: { path: spec.actions, content: component:exec }
      - notContains: { path: spec.actions, content: "*" }

  - it: service_mcp_client binds to mcp-service (not admin) and all 10 upstream bindings are kept
    template: charts/openchoreo-control-plane/templates/authz/bootstrap-configmap.yaml
    asserts:
      - matchRegex:
          path: data["manifests.yaml"]
          pattern: 'name: mcp-tryout-client-binding(\n.*){1,12}\n\s+name: mcp-service\n\s+kind: ClusterAuthzRole'
      - matchRegex:
          path: data["manifests.yaml"]
          pattern: '(kind: ClusterAuthzRoleBinding[\s\S]*){10}'
      - notMatchRegex:
          path: data["manifests.yaml"]
          pattern: '(kind: ClusterAuthzRoleBinding[\s\S]*){11}'
