{{- /*
Render-time consistency with installation.yaml: the subchart's literal hostnames must match
openchoreo.controlPlane.host and openchoreo.controlPlane.clusterGatewayURL (which workload-cluster agents dial).
*/ -}}
{{- $cp := index .Values "openchoreo-control-plane" }}
{{- $host := required "openchoreo.controlPlane.host is required" .Values.openchoreo.controlPlane.host }}
{{- if not (has $host $cp.backstage.http.hostnames) }}
{{- fail (printf "openchoreo-control-plane.backstage.http.hostnames must contain %s (openchoreo.controlPlane.host)" $host) }}
{{- end }}
{{- if not (has (printf "api.%s" $host) $cp.openchoreoApi.http.hostnames) }}
{{- fail (printf "openchoreo-control-plane.openchoreoApi.http.hostnames must contain api.%s" $host) }}
{{- end }}
{{- if not (contains (printf "//thunder.%s" $host) $cp.security.oidc.issuer) }}
{{- fail (printf "openchoreo-control-plane.security.oidc.issuer must be served by thunder.%s" $host) }}
{{- end }}
{{- $u := urlParse (required "openchoreo.controlPlane.clusterGatewayURL is required" .Values.openchoreo.controlPlane.clusterGatewayURL) }}
{{- $parts := splitList ":" $u.host }}
{{- $gwHost := first $parts }}
{{- $gwPort := ternary (last $parts) "443" (eq (len $parts) 2) }}
{{- if ne $u.scheme "wss" }}
{{- fail "openchoreo.controlPlane.clusterGatewayURL must use wss://" }}
{{- end }}
{{- if ne (toString $gwPort) (toString $cp.gateway.httpsPort) }}
{{- fail (printf "clusterGatewayURL port %s must equal openchoreo-control-plane.gateway.httpsPort %v (TLS passthrough listener)" $gwPort $cp.gateway.httpsPort) }}
{{- end }}
{{- if not $cp.clusterGateway.tlsRoute.enabled }}
{{- fail "openchoreo-control-plane.clusterGateway.tlsRoute.enabled must be true: remote agents connect through the Gateway" }}
{{- end }}
{{- if ne (index $cp.clusterGateway.tlsRoute.hosts 0).host $gwHost }}
{{- fail (printf "openchoreo-control-plane.clusterGateway.tlsRoute.hosts[0].host must be %s (clusterGatewayURL)" $gwHost) }}
{{- end }}
{{- if not (has $gwHost $cp.clusterGateway.tls.dnsNames) }}
{{- fail (printf "openchoreo-control-plane.clusterGateway.tls.dnsNames must contain %s (server cert SAN for agents)" $gwHost) }}
{{- end }}
{{- $obsEnabled := dig "observability" "enabled" false .Values.openchoreo }}
{{- if ne (toString $obsEnabled) (toString $cp.backstage.features.observability.enabled) }}
{{- fail (printf "openchoreo-control-plane.backstage.features.observability.enabled (%v) must equal openchoreo.observability.enabled (%v)" $cp.backstage.features.observability.enabled $obsEnabled) }}
{{- end }}
{{- /*
Scaffolder GitHub App (docs/project-templates.md "Repository creation"): the wrapper's ExternalSecret and the
subchart's GitHub integration + env must be switched on together; one without the other either breaks Backstage's
startup (config references unset env) or leaves an unused credential.
*/ -}}
{{- $app := .Values.scaffolder.githubApp }}
{{- $gh := dig "appConfig" "integrations" "github" list $cp.backstage }}
{{- $hasApp := false }}
{{- range $gh }}{{ if .apps }}{{ $hasApp = true }}{{ end }}{{ end }}
{{- $envFromSecret := list }}
{{- range (concat ($cp.backstage.env | default list) ($cp.backstage.extraEnv | default list)) }}
{{- if eq (dig "valueFrom" "secretKeyRef" "name" "" .) $app.secretName }}{{ $envFromSecret = append $envFromSecret .name }}{{ end }}
{{- end }}
{{- if and $app.enabled (not $hasApp) }}
{{- fail "scaffolder.githubApp.enabled needs openchoreo-control-plane.backstage.appConfig.integrations.github[].apps (docs/project-templates.md)" }}
{{- end }}
{{- if and $hasApp (not $app.enabled) }}
{{- fail "openchoreo-control-plane.backstage.appConfig.integrations.github[].apps is set but scaffolder.githubApp.enabled is false (no credentials Secret)" }}
{{- end }}
{{- if and $app.enabled (or (not (has "GITHUB_APP_ID" $envFromSecret)) (not (has "GITHUB_APP_PRIVATE_KEY" $envFromSecret))) }}
{{- fail (printf "scaffolder.githubApp.enabled needs openchoreo-control-plane.backstage.extraEnv GITHUB_APP_ID and GITHUB_APP_PRIVATE_KEY from Secret %s" $app.secretName) }}
{{- end }}
