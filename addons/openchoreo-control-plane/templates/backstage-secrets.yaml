{{- /*
Backstage's Secret (backstage.secretName). Mandatory keys per the upstream deployment: backend-secret, client-secret,
jenkins-api-key (Jenkins integration is off; a non-secret placeholder satisfies the non-optional env). github-* are
optional and left out. client-secret == Thunder's Backstage client secret (same store key, addon thunder).
*/ -}}
{{- $name := index .Values "openchoreo-control-plane" "backstage" "secretName" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "backstageSecrets.store" .Values.backstageSecrets.store }}
  target:
    name: {{ $name }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        jenkins-api-key: placeholder-not-in-use
  data:
    - secretKey: backend-secret
      remoteRef: { key: {{ .Values.backstageSecrets.remoteKey }}, property: backstage-backend-secret }
    - secretKey: client-secret
      remoteRef: { key: {{ .Values.backstageSecrets.remoteKey }}, property: backstage-client-secret }
