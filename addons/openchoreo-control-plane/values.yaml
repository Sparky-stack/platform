# OpenChoreo 1.3.3 control plane on mgmt. Values = upstream install/k3d/multi-cluster/values-cp.yaml @ v1.3.3, except
# lines marked "platform:". Needs (mgmt addons): cert-manager, external-secrets (+ ClusterSecretStores `platform` and
# `mgmt-openchoreo`), gateway-api-crds, kgateway (GatewayClass `kgateway`), thunder (IdP), coredns-local (pods resolve
# *.openchoreo.localhost to the Gateway below). Until those exist, the Application's retries cover the ordering.
#
# Endpoints (k3d publishes host 8080/8443 -> mgmt nodes -> klipper hostPorts of Service gateway-default):
#   http://openchoreo.localhost:8080          console (Backstage)
#   http://api.openchoreo.localhost:8080      openchoreo-api
#   http://thunder.openchoreo.localhost:8080  ThunderID (route from addon thunder)
#   cluster-gateway.openchoreo.localhost:8443 agent websocket, TLS passthrough (SNI) -> cluster-gateway; the server cert
#                                             (Certificate cluster-gateway-tls) carries that SAN, signed by the
#                                             chart's CA Secret cluster-gateway-ca (see templates/gateway-ca-crs.yaml).
# Hostnames are literals here (subchart values cannot be templated); templates/validate.yaml fails the render when they
# drift from installation.yaml openchoreo.controlPlane.{host,clusterGatewayURL}. Other installations override them in
# installations/<inst>/addons/openchoreo-control-plane/values.yaml.

# --- installation.yaml (defaults so `helm template` works standalone) ---------------------------------------------
openchoreo:
  # -- Org namespace (`default`), console/API hostnames (`controlPlane.host`), and agent WebSocket endpoint (`controlPlane.clusterGatewayURL`).
  orgNamespace: default
  controlPlane:
    host: openchoreo.localhost
    clusterGatewayURL: wss://cluster-gateway.openchoreo.localhost:8443/ws
  observability:
    enabled: true             # == backstage.features.observability.enabled below (validated)
    httpPort: 11080

# Secret backstage-secrets (templates/backstage-secrets.yaml) from ClusterSecretStore `platform`, key `openchoreo`
# (properties backstage-client-secret == Thunder's Backstage client secret, backstage-backend-secret).
backstageSecrets:
  # -- Pulls Backstage secrets (`openchoreo`) and optional `scaffolder.githubApp` credentials from `ClusterSecretStore/platform`.
  store: platform
  remoteKey: openchoreo

# Golden-path project templates (docs/project-templates.md). Repository creation and the platform PR authenticate as the
# platform write GitHub App (ClusterSecretStore `platform`, key `platform-github-app`, docs/forking.md credentials (c)).
# Off by default (the key is optional in `task secrets`): templates are listed and their forms work, the publish step
# fails. Switching on needs this flag (renders ExternalSecret backstage-github-app, templates/backstage-github-app.yaml)
# AND the subchart's GitHub integration + env, both shown in docs/project-templates.md "Repository creation";
# templates/validate.yaml fails the render when only one side is set.
scaffolder:
  githubApp:
    enabled: false
    store: platform
    remoteKey: platform-github-app
    secretName: backstage-github-app

# Shared CAPI ClusterResourceSet payload `fleet/openchoreo-gateway-ca` (templates/gateway-ca-crs.yaml): ConfigMap
# openchoreo-data-plane/cluster-gateway-ca with the gateway CA's PUBLIC certificate, read through ClusterSecretStore
# `mgmt-openchoreo` (read-only on this namespace). Every workload cluster's CRS (charts/cluster) lists it.
gatewayCA:
  # -- Exports `cluster-gateway-ca` (`gatewayCA.{enabled,store,namespace,sourceSecret}`) via `ClusterSecretStore/mgmt-openchoreo` to `fleet` for workload agent trust.
  enabled: true
  store: mgmt-openchoreo
  namespace: fleet
  name: openchoreo-gateway-ca
  sourceSecret: cluster-gateway-ca    # cert-manager CA Secret of the chart (Certificate cluster-gateway-ca, 10y)

# Images: fully qualified (chart defaults ghcr.io/openchoreo, registry.k8s.io), tag@digest pinned by multi-arch index
# digest (docs/conventions.md invariant 9; hack/tests/test_image_pins.sh). A chart bump updates them together.
openchoreo-control-plane:
  openchoreoApi:
    image:
      tag: v1.3.3@sha256:ed0fb79a93c55946a1b38b51fdf34ba9cccec0998a7befbdd62a4e3aae1ef63f   # index: amd64, arm64
    http:
      hostnames:
        - api.openchoreo.localhost
    config:
      server:
        publicUrl: "http://api.openchoreo.localhost:8080"
      security:
        authorization:
          bootstrap:   # authz bootstrap Job (kubectl apply of the default roles)
            image: registry.k8s.io/kubectl:v1.36.0@sha256:63e5e76b746bb8b891a94968d380736c035e768dab0d56ddad1f50c750a4be39   # index: amd64, arm64, ...
    # platform: no remoteConnect (`occ remote` tunnels): needs the data plane's SNI router published per cluster

  backstage:
    image:
      tag: v1.3.3@sha256:997f6605c620514a34557f64716830c845830119625edd1e13669d2637d3f79c   # openchoreo-ui; amd64, arm64
    secretName: backstage-secrets
    baseUrl: "http://openchoreo.localhost:8080"     # Thunder's Backstage redirect URI lives under it (addon thunder)
    http:
      hostnames:
        - openchoreo.localhost
    features:
      workflows:
        # platform: Build tab, WorkflowRuns + logs (workflow plane on mgmt, docs/build-plane.md). Set per installation by
        # the catalog from installation.yaml openchoreo.workflowPlane.enabled.
        # -- Wired from `installation.yaml` via `installationParameters` (alongside `features.observability.enabled`).
        enabled: true
      observability:
        # platform: Metrics/Traces/Runtime Logs tabs + RuntimeHealthCard. Backstage asks openchoreo-api for the
        # environment's ClusterObservabilityPlane observerURL (addon openchoreo-observability-plane); no URL here.
        # Must equal installation.yaml openchoreo.observability.enabled (templates/validate.yaml).
        enabled: true
    # platform: extra Backstage config (ConfigMap app-config.extra.yaml, loaded last). Backstage REPLACES arrays from
    # earlier config files, so catalog.locations repeats the image's list (openchoreo-ui v1.3.3 /app/app-config.yaml:
    # org groups + the 14 OpenChoreo wizards) and appends the golden-path templates of this repo
    # (templates/catalog-info.yaml, a Location; hack/tests/test_project_templates.sh). A chart bump re-checks the list.
    # Forks: point the url target at their own repo (docs/forking.md).
    appConfig:
      catalog:
        rules:
          # Backstage defaults + Resource: catalog:register adds each new repo's catalog-info.yaml (kind Resource)
          - allow: [API, Component, Location, Resource]
          # golden-path templates: only from this repo's templates/catalog-info.yaml. Backstage checks entities a
          # Location emits against that Location's ORIGIN (this config target), not the template.yaml URL (#59:
          # a templates/*/template.yaml pattern rejected all six as "not of an allowed kind for that location").
          - allow: [Template]
            locations:
              - type: url
                exact: https://github.com/koorikla/platform/blob/main/templates/catalog-info.yaml
        locations:
          - type: file
            target: /app/catalog-entities/org.yaml
            rules: [{ allow: [Group] }]
          - type: file
            target: /app/templates/create-openchoreo-componenttype/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-resourcetype/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-projecttype/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-trait/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-workflow/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-environment/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-namespace/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-deploymentpipeline/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-clustercomponenttype/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-clusterresourcetype/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-clusterprojecttype/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-clustertrait/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-clusterworkflow/template.yaml
            rules: [{ allow: [Template] }]
          - type: file
            target: /app/templates/create-openchoreo-notification-channel/template.yaml
            rules: [{ allow: [Template] }]
          - type: url
            target: https://github.com/koorikla/platform/blob/main/templates/catalog-info.yaml
    resources:                  # platform: upstream requests 200m/256Mi, limits 2/2Gi
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

  controllerManager:
    image:
      tag: v1.3.3@sha256:ce7e9d6394cd10bdd7d4f9f5746468b3f1f010b714b878a8a51051aac0b97863   # index: amd64, arm64
    resources:                  # platform: upstream requests 200m/256Mi
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

  security:
    oidc:
      issuer: "http://thunder.openchoreo.localhost:8080"     # = Thunder publicUrl (id_token iss)
      jwksUrl: "http://thunder.openchoreo.localhost:8080/oauth2/jwks"
      authorizationUrl: "http://thunder.openchoreo.localhost:8080/oauth2/authorize"
      tokenUrl: "http://thunder.openchoreo.localhost:8080/oauth2/token"

  # Agents of remote planes connect through the Gateway's TLS passthrough listener (port gateway.httpsPort, SNI host
  # below) to Service cluster-gateway-external; mTLS end to end. Each plane's client CA comes from its ClusterDataPlane
  # (charts/cluster: per-cluster CA fleet/<name>-agent-ca).
  clusterGateway:
    image:
      tag: v1.3.3@sha256:a3486320d84c4dcbdccb6ecef09550b015d268c7002e504b221021a517cc0360   # index: amd64, arm64
    tlsRoute:
      enabled: true
      hosts:
        - host: cluster-gateway.openchoreo.localhost
          paths:
            - path: /
              pathType: Prefix
    tls:
      issuerRef:
        name: cluster-gateway-server-issuer   # CA Issuer over Secret cluster-gateway-ca (rendered by the chart)
      dnsNames:
        - cluster-gateway.openchoreo-control-plane.svc
        - cluster-gateway.openchoreo-control-plane.svc.cluster.local
        - cluster-gateway.openchoreo.localhost   # the name agents dial (SNI + SAN)

  eventForwarder:
    image:
      tag: v1.3.3@sha256:9030b624d60781aa6ec25ccf5d3ff2af229882439a517afe46083fbfe769da9b   # index: amd64, arm64

  gateway:
    httpPort: 8080          # == k3d published port, so in-cluster and browser URLs are identical
    httpsPort: 8443         # TLS passthrough listener for cluster-gateway (no https listener: tls off)
    tls:
      enabled: false
