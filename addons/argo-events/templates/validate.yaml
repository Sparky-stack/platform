{{- /*
Renders nothing: every value check of this chart, so a bad value fails the whole render with one message instead of
an object that Argo CD applies half-broken. Each check runs only where the value is used.
*/ -}}
{{- $mode := toString .Values.workflowPlane }}
{{- if not (has $mode (list "auto" "true" "false")) }}
{{- fail (printf "workflowPlane: %q is not auto, true or false" $mode) }}
{{- end }}
{{- $wf := eq (include "ae.workflowPlane" .) "true" }}

{{- /* The EventBus can only run a version the controller config lists (pinned images, values.yaml). */}}
{{- $jsVersions := list }}
{{- range (index .Values "argo-events" "configs" "jetstream" "versions") }}{{ $jsVersions = append $jsVersions (toString .version) }}{{ end }}
{{- if not (has (toString .Values.eventBus.natsVersion) $jsVersions) }}
{{- fail (printf "eventBus.natsVersion %q is not in argo-events.configs.jetstream.versions %v (pinned EventBus images)" (toString .Values.eventBus.natsVersion) $jsVersions) }}
{{- end }}

{{- if .Values.falco.enabled }}
{{- range (.Values.falco.clusters | default list) }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" (toString .)) }}
{{- fail (printf "falco.clusters: %q is not a cluster name (DNS-1123 label)" (toString .)) }}
{{- end }}
{{- end }}
{{- if not .Values.falco.clusters }}{{ fail "falco.clusters is empty (generated by the addon ApplicationSet: catalog fleetParameters)" }}{{ end }}
{{- if $wf }}
{{- $priorities := list "Emergency" "Alert" "Critical" "Error" "Warning" "Notice" "Informational" "Debug" }}
{{- if not (has (.Values.falco.minimumPriority | title) $priorities) }}
{{- fail (printf "falco.minimumPriority %q is not a Falco priority" .Values.falco.minimumPriority) }}
{{- end }}
{{- end }}
{{- end }}

{{- /* Same condition as auto-build-webhook.yaml. */}}
{{- $autoBuild := toString (dig "workflowPlane" "autoBuild" "none" (.Values.openchoreo | default dict)) }}
{{- if and (eq $autoBuild "webhook") $wf (dig "githubGateApp" "enabled" false (.Values.secrets | default dict)) }}
{{- $w := .Values.autoBuildWebhook }}
{{- $ghOrg := dig "githubOrg" "" (.Values.installation | default dict) }}
{{- if not (regexMatch "^https://github\\.com/[A-Za-z0-9][A-Za-z0-9-]*/?$" (required "installation.githubOrg is required (owner whose pushes trigger builds)" $ghOrg)) }}
{{- fail (printf "installation.githubOrg %q: the auto-build webhook supports https://github.com/<owner>" $ghOrg) }}
{{- end }}
{{- if not (and $w.secret.store $w.secret.key $w.secret.property) }}
{{- fail "autoBuildWebhook.secret.{store,key,property} are required: without an HMAC secret the EventSource accepts unsigned payloads" }}
{{- end }}
{{- end }}
