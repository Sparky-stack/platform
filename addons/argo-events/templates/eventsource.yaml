{{- /*
EventBus + EventSource `platform` (Falco escalation webhook, OpenChoreo ReleaseBinding events) + their plumbing:
per-cluster bearer tokens derived from the store, Service exposure through the control-plane Gateway, read-only RBAC on
bindings. Falco: one endpoint per cluster (POST /falco/<cluster>, event falco-<cluster>), each accepting only that
cluster's token, so the endpoint an event arrives on authenticates the cluster it names (docs/observability.md).
*/ -}}
{{- $sc := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
{{- $podSc := dict "runAsNonRoot" true "runAsUser" 65532 "runAsGroup" 65532 "seccompProfile" (dict "type" "RuntimeDefault") }}
{{- /* The EventBus can only run a version the controller config lists (pinned images, values.yaml). */ -}}
{{- $jsVersions := list }}
{{- range (index .Values "argo-events" "configs" "jetstream" "versions") }}{{ $jsVersions = append $jsVersions (toString .version) }}{{ end }}
{{- if not (has (toString .Values.eventBus.natsVersion) $jsVersions) }}
{{- fail (printf "eventBus.natsVersion %q is not in argo-events.configs.jetstream.versions %v (pinned EventBus images)" (toString .Values.eventBus.natsVersion) $jsVersions) }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  jetstream:
    version: {{ .Values.eventBus.natsVersion | quote }}
    replicas: 1
    # Pod Security restricted (the namespace is externally reachable and stays in Kyverno/PSS scope); fsGroup lets the
    # non-root NATS server write its JetStream store (emptyDir).
    securityContext: {{- toYaml (merge (dict "fsGroup" 65532) $podSc) | nindent 6 }}
    containerTemplate:
      resources: {{- toYaml .Values.eventBus.resources.nats | nindent 8 }}
      securityContext: {{- toYaml $sc | nindent 8 }}
    reloaderContainerTemplate:
      resources: {{- toYaml .Values.eventBus.resources.reloader | nindent 8 }}
      securityContext: {{- toYaml $sc | nindent 8 }}
    metricsContainerTemplate:
      resources: {{- toYaml .Values.eventBus.resources.metrics | nindent 8 }}
      securityContext: {{- toYaml $sc | nindent 8 }}
    settings: |
      max_memory_store: {{ .Values.eventBus.maxMemoryStore }}
      max_file_store: {{ .Values.eventBus.maxFileStore }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-eventsource
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: platform
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  eventBusName: default
  template:
    serviceAccountName: platform-eventsource
    securityContext: {{- toYaml $podSc | nindent 6 }}
    container:
      resources: {{- toYaml .Values.podResources | nindent 8 }}
      securityContext: {{- toYaml $sc | nindent 8 }}
  {{- if .Values.falco.enabled }}
  {{- $clusters := include "ae.falcoClusters" . | fromJsonArray }}
  service:
    ports:
      - name: falco
        port: {{ .Values.falco.port }}
        targetPort: {{ .Values.falco.port }}
  webhook:
    {{- range $c := $clusters }}
    {{ printf "falco-%s" $c }}:
      port: {{ $.Values.falco.port | quote }}
      endpoint: {{ printf "%s/%s" $.Values.falco.endpoint $c }}
      method: POST
      authSecret:                       # requests without "Authorization: Bearer <token>" are rejected (401)
        name: falco-webhook
        key: {{ $c | quote }}
    {{- end }}
  {{- end }}
{{- if .Values.promotionGate.enabled }}
---
# Argo Events allows one event source type per EventSource ("Some types of event sources can not be put in one
# spec"): the ReleaseBinding watch has its own, next to the Falco webhook in `platform`.
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: releasebindings
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  eventBusName: default
  template:
    serviceAccountName: platform-eventsource
    securityContext: {{- toYaml $podSc | nindent 6 }}
    container:
      resources: {{- toYaml .Values.podResources | nindent 8 }}
      securityContext: {{- toYaml $sc | nindent 8 }}
  resource:
    releasebinding-rollout:
      namespace: {{ .Values.openchoreo.orgNamespace }}
      group: openchoreo.dev
      version: v1alpha1
      resource: releasebindings
      eventTypes: [ADD, UPDATE]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-releasebinding-reader
  namespace: {{ .Values.openchoreo.orgNamespace }}
rules:
  - apiGroups: [openchoreo.dev]
    resources: [releasebindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-releasebinding-reader
  namespace: {{ .Values.openchoreo.orgNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-releasebinding-reader
subjects:
  - kind: ServiceAccount
    name: platform-eventsource
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.falco.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-webhook
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.falco.tokenSecret.store }}
  target:
    name: falco-webhook
    template:
      engineVersion: v2
      data:   # gitleaks:allow: ESO template; one derived token per cluster, the store's token is never written here
        {{- range $c := include "ae.falcoClusters" . | fromJsonArray }}
        {{ $c | quote }}: {{ include "ae.falcoToken" $c | quote }}
        {{- end }}
  data:
    - secretKey: token
      remoteRef: { key: {{ .Values.falco.tokenSecret.key }}, property: {{ .Values.falco.tokenSecret.property }} }
{{- if .Values.falco.route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: falco-escalation
spec:
  parentRefs:
    - name: {{ .Values.falco.route.gateway.name }}
      namespace: {{ .Values.falco.route.gateway.namespace }}
      sectionName: {{ .Values.falco.route.sectionName }}
  hostnames:
    - {{ printf "%s.%s" .Values.falco.route.hostPrefix (required "openchoreo.controlPlane.host is required" .Values.openchoreo.controlPlane.host) | quote }}
  rules:
    - matches:
        {{- range $c := include "ae.falcoClusters" . | fromJsonArray }}
        - path: { type: Exact, value: {{ printf "%s/%s" $.Values.falco.endpoint $c }} }
          method: POST
        {{- end }}
      backendRefs:
        - name: platform-eventsource-svc   # Service the controller creates for EventSource `platform`
          port: {{ .Values.falco.port }}
{{- end }}
{{- end }}
