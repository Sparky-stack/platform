{{- /*
EventBus `default` and EventSources `platform` (Falco escalation webhook) and `releasebindings` (OpenChoreo rollouts,
for the promotion gate) on mgmt, namespace argo-events, with their token Secret, HTTPRoute and RBAC.
*/ -}}
{{- $clusters := list }}
{{- if .Values.falco.enabled }}{{ $clusters = include "ae.falcoClusters" . | fromJsonArray }}{{ end }}
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  jetstream:
    version: {{ .Values.eventBus.natsVersion | quote }}
    replicas: 1
    # Pod Security restricted (the namespace is externally reachable and stays in Kyverno/PSS scope); fsGroup lets the
    # non-root NATS server write its JetStream store (emptyDir).
    securityContext:
      fsGroup: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile: { type: RuntimeDefault }
    containerTemplate:
      resources: {{- toYaml .Values.eventBus.resources.nats | nindent 8 }}
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
    reloaderContainerTemplate:
      resources: {{- toYaml .Values.eventBus.resources.reloader | nindent 8 }}
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
    metricsContainerTemplate:
      resources: {{- toYaml .Values.eventBus.resources.metrics | nindent 8 }}
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
    settings: |
      max_memory_store: {{ .Values.eventBus.maxMemoryStore }}
      max_file_store: {{ .Values.eventBus.maxFileStore }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-eventsource
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: platform
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  eventBusName: default
  template: {{- include "ae.eventPod" (dict "sa" "platform-eventsource" "root" .) | nindent 4 }}
  {{- if .Values.falco.enabled }}
  service:
    ports:
      - name: falco
        port: {{ .Values.falco.port }}
        targetPort: {{ .Values.falco.port }}
  {{- /* One endpoint per cluster (POST /falco/<cluster>, event falco-<cluster>), each accepting only that cluster's
  token: the endpoint an event arrives on authenticates the cluster it names (docs/observability.md). */}}
  webhook:
    {{- range $c := $clusters }}
    {{ printf "falco-%s" $c }}:
      port: {{ $.Values.falco.port | quote }}
      endpoint: {{ printf "%s/%s" $.Values.falco.endpoint $c }}
      method: POST
      authSecret:                       # requests without "Authorization: Bearer <token>" are rejected (401)
        name: falco-webhook
        key: {{ $c | quote }}
    {{- end }}
  {{- end }}
{{- if .Values.promotionGate.enabled }}
---
# Argo Events allows one event source type per EventSource ("Some types of event sources can not be put in one
# spec"): the ReleaseBinding watch has its own, next to the Falco webhook in `platform`.
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: releasebindings
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  eventBusName: default
  template: {{- include "ae.eventPod" (dict "sa" "platform-eventsource" "root" .) | nindent 4 }}
  resource:
    releasebinding-rollout:
      namespace: {{ .Values.openchoreo.orgNamespace }}
      group: openchoreo.dev
      version: v1alpha1
      resource: releasebindings
      eventTypes: [ADD, UPDATE]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-releasebinding-reader
  namespace: {{ .Values.openchoreo.orgNamespace }}
rules:
  - apiGroups: [openchoreo.dev]
    resources: [releasebindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-releasebinding-reader
  namespace: {{ .Values.openchoreo.orgNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-releasebinding-reader
subjects:
  - kind: ServiceAccount
    name: platform-eventsource
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.falco.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-webhook
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.falco.tokenSecret.store }}
  target:
    name: falco-webhook
    template:
      engineVersion: v2
      data:   # gitleaks:allow: ESO template; one derived token per cluster, the store's token is never written here
        {{- range $c := $clusters }}
        {{ $c | quote }}: {{ include "ae.falcoToken" $c | quote }}
        {{- end }}
  data:
    - secretKey: token
      remoteRef: { key: {{ .Values.falco.tokenSecret.key }}, property: {{ .Values.falco.tokenSecret.property }} }
{{- if .Values.falco.route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: falco-escalation
spec:
  parentRefs:
    - name: {{ .Values.falco.route.gateway.name }}
      namespace: {{ .Values.falco.route.gateway.namespace }}
      sectionName: {{ .Values.falco.route.sectionName }}
  hostnames:
    - {{ printf "%s.%s" .Values.falco.route.hostPrefix .Values.openchoreo.controlPlane.host | quote }}
  rules:
    - matches:
        {{- range $c := $clusters }}
        - path: { type: Exact, value: {{ printf "%s/%s" $.Values.falco.endpoint $c }} }
          method: POST
        {{- end }}
      backendRefs:
        - name: platform-eventsource-svc   # Service the controller creates for EventSource `platform`
          port: {{ .Values.falco.port }}
{{- end }}
{{- end }}
