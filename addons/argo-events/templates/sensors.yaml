{{- /*
Sensors falco-escalation (-> Workflow falco-response) and promotion-gate (-> OpenChoreo WorkflowRun of ClusterWorkflow
promotion-gate) on mgmt, only with the workflow plane (_helpers.tpl ae.workflowPlane). Deterministic object names
(event uuid / rollout id): a re-delivered event fails with AlreadyExists instead of running twice.
*/ -}}
{{- $wf := eq (include "ae.workflowPlane" .) "true" }}
{{- if and .Values.falco.enabled $wf }}
{{- /* Falco priorities from most to least severe: match minimumPriority and everything above it. */}}
{{- $min := printf "^%s$" (.Values.falco.minimumPriority | title) }}
{{- $anchored := list }}
{{- range list "Emergency" "Alert" "Critical" "Error" "Warning" "Notice" "Informational" "Debug" }}
{{- if not (has $min $anchored) }}{{ $anchored = append $anchored (printf "^%s$" .) }}{{ end }}
{{- end }}
{{- $clusters := include "ae.falcoClusters" . | fromJsonArray }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-escalation-sensor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-escalation-sensor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-escalation-sensor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-escalation-sensor
subjects:
  - kind: ServiceAccount
    name: falco-escalation-sensor
    namespace: {{ .Release.Namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: falco-escalation
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  eventBusName: default
  template: {{- include "ae.eventPod" (dict "sa" "falco-escalation-sensor" "root" .) | nindent 4 }}
  # One dependency + trigger per cluster: the endpoint (event falco-<cluster>) authenticated the sender, so the trigger
  # hands its cluster to the Workflow as a literal argument; the payload's own `cluster` field is only cross-checked.
  dependencies:
    {{- range $c := $clusters }}
    - name: {{ printf "falco_%s" ($c | replace "-" "_") }}   # condition expressions read '-' as minus
      eventSourceName: platform
      eventName: {{ printf "falco-%s" $c }}
      filters:
        data:
          - path: body.priority
            type: string
            value: {{ $anchored | toJson }}   # each value is a regex
          - path: body.uuid
            type: string
            value: ["^[0-9a-fA-F-]{8,64}$"]
    {{- end }}
  triggers:
    {{- range $c := $clusters }}
    {{- $dep := printf "falco_%s" ($c | replace "-" "_") }}
    - rateLimit: {{- toYaml $.Values.falco.response.rateLimit | nindent 8 }}
      template:
        name: {{ printf "falco-response-%s" $c }}
        conditions: {{ $dep }}
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: falco-response-placeholder   # replaced: falco-<event uuid>
                namespace: {{ $.Release.Namespace }}
                labels:
                  platform.koorikla.io/trigger: falco
                  platform.koorikla.io/cluster: {{ $c | quote }}
              spec:
                workflowTemplateRef:
                  name: falco-response
                arguments:
                  parameters:
                    - name: event
                      value: "{}"
                    - name: cluster
                      value: {{ $c | quote }}
          parameters:
            - src:
                dependencyName: {{ $dep }}
                dataTemplate: {{ `'falco-{{ .Input.body.uuid | lower | trunc 50 }}'` }}
              dest: metadata.name
            - src:
                dependencyName: {{ $dep }}
                dataKey: body
              dest: spec.arguments.parameters.0.value
      retryStrategy:
        steps: 3
        duration: 2s
    {{- end }}
{{- end }}
{{- if and .Values.promotionGate.enabled $wf }}
{{- $ns := .Values.openchoreo.orgNamespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promotion-gate-sensor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-promotion-gate
  namespace: {{ $ns }}
rules:
  - apiGroups: [openchoreo.dev]
    resources: [workflowruns]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-promotion-gate
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-promotion-gate
subjects:
  - kind: ServiceAccount
    name: promotion-gate-sensor
    namespace: {{ .Release.Namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: promotion-gate
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  eventBusName: default
  template: {{- include "ae.eventPod" (dict "sa" "promotion-gate-sensor" "root" .) | nindent 4 }}
  dependencies:
    - name: rollout
      eventSourceName: releasebindings
      eventName: releasebinding-rollout
      filters:
        data:
          - path: body.spec.environment
            type: string
            value: {{ .Values.promotionGate.sourceEnvironments | toJson }}
          - path: body.spec.releaseName
            type: string
            value: [".+"]
          - path: body.status.delivery.succeededAt    # set once per rollout when every resource is healthy
            type: string
            value: [".+"]
        # ...and that rollout is the current spec's. Two stale states follow every releaseName edit:
        # - the spec edit itself (Argo CD's UPDATE) still carries the whole previous status, delivery AND
        #   lastSpecUpdateTime of the previous rollout (#155): only the generation tells it apart, so the Ready
        #   condition must have observed this generation (gjson numbers are float64 on both sides);
        # - the controller's first status write (new lastSpecUpdateTime) still carries the previous release's
        #   finished delivery. RFC 3339 UTC timestamps compare as strings (govaluate).
        exprs:
          - expr: observed == generation
            fields:
              - { name: observed, path: 'body.status.conditions.#(type=="Ready").observedGeneration' }
              - { name: generation, path: body.metadata.generation }
          - expr: started >= specChanged
            fields:
              - { name: started, path: body.status.delivery.startedAt }
              - { name: specChanged, path: body.status.lastSpecUpdateTime }
  triggers:
    - template:
        name: promotion-gate
        k8s:
          operation: create
          source:
            resource:
              apiVersion: openchoreo.dev/v1alpha1
              kind: WorkflowRun
              metadata:
                name: promotion-gate-placeholder   # replaced: gate-<component>-<hash of the rollout id>
                namespace: {{ $ns }}
                labels:
                  platform.koorikla.io/trigger: rollout
              spec:
                workflow:
                  kind: ClusterWorkflow
                  name: {{ .Values.promotionGate.workflow }}
                  parameters:
                    project: ""
                    component: ""
                    sourceEnvironment: ""
                    release: ""
          parameters:
            - src:
                dependencyName: rollout
                dataTemplate: {{ `'gate-{{ .Input.body.spec.owner.componentName | trunc 40 | trimSuffix "-" }}-{{ .Input.body.status.delivery.rolloutId | sha256sum | trunc 10 }}'` }}
              dest: metadata.name
            - src: { dependencyName: rollout, dataKey: body.spec.owner.projectName }
              dest: spec.workflow.parameters.project
            - src: { dependencyName: rollout, dataKey: body.spec.owner.componentName }
              dest: spec.workflow.parameters.component
            - src: { dependencyName: rollout, dataKey: body.spec.environment }
              dest: spec.workflow.parameters.sourceEnvironment
            - src: { dependencyName: rollout, dataKey: body.spec.releaseName }
              dest: spec.workflow.parameters.release
{{- end }}
