{{- /*
WorkflowTemplate falco-response (docs/observability.md "Falco response") with its script ConfigMap and identities, on
mgmt; the OpenChoreo workflow plane's Argo Workflows controller runs it. files/falco_response.py does the work.
*/ -}}
{{- if and .Values.falco.enabled (eq (include "ae.workflowPlane" .) "true") }}
{{- $r := .Values.falco.response }}
{{- $ns := .Values.openchoreo.orgNamespace }}
{{- /* a plain format string: printf with no argument here rendered "%!s(MISSING)" into every step's source */}}
{{- $run := "import runpy, sys; sys.argv = ['falco_response.py', '%s']; runpy.run_path('/scripts/falco_response.py', run_name='__main__')" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-response
data:
  falco_response.py: |
    {{- .Files.Get "files/falco_response.py" | nindent 4 }}
---
{{- /* Executor-only SA token pattern: init/wait use falco-response-executor (workflowtaskresults only); only enrich/record mount falco-response's token (docs/observability.md). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-response                        # pod identity; the WorkflowTemplate disables its token except for enrich/record
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-response-executor
automountServiceAccountToken: false
secrets:
  - name: falco-response-executor.service-account-token
---
{{- /* Argo mounts the executor's token from this Secret into the init/wait containers only (Argo Workflows
TokenNameForServiceAccount: <sa>.service-account-token); the main container never sees it. */}}
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: falco-response-executor.service-account-token
  annotations:
    kubernetes.io/service-account.name: falco-response-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-response-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]          # Argo emissary executor reports step outputs
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-response-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-response-executor
subjects:
  - kind: ServiceAccount
    name: falco-response-executor
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-falco-response
  namespace: {{ $ns }}
rules:
  - apiGroups: [openchoreo.dev]
    resources: [renderedreleases, environments]
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-falco-response
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-falco-response
subjects:
  - kind: ServiceAccount
    name: falco-response
    namespace: {{ .Release.Namespace }}
{{- if $r.notify.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-notify
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $r.notify.secret.store }}
  target:
    name: falco-notify
  dataFrom:
    - extract: { key: {{ $r.notify.secret.key }} }   # properties url, token (optional)
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: falco-response
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entrypoint: respond
  serviceAccountName: falco-response
  automountServiceAccountToken: false         # default for every step; enrich/record opt in below
  executor:
    serviceAccountName: falco-response-executor
  activeDeadlineSeconds: 300
  ttlStrategy:
    secondsAfterCompletion: {{ $r.ttlSecondsAfterFinished }}
  podGC:
    strategy: OnPodSuccess
  arguments:
    parameters:
      - name: event                           # falcosidekick JSON (Sensor falco-escalation)
      - name: cluster                         # the cluster whose endpoint (token) the event arrived on
        value: ""                             # empty = unauthenticated: enrich skips the event
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: scripts
      configMap: { name: falco-response }
  templates:
    - name: respond
      steps:
        - - name: enrich
            template: enrich
        - - name: record
            template: record
            arguments:
              parameters:
                - { name: context, value: {{ `"{{steps.enrich.outputs.result}}"` }} }
          {{- if $r.rca.enabled }}
          - name: rca
            template: call
            arguments:
              parameters:
                - { name: step, value: rca }
                - { name: context, value: {{ `"{{steps.enrich.outputs.result}}"` }} }
          {{- end }}
          {{- if $r.notify.enabled }}
          - name: notify
            template: call
            arguments:
              parameters:
                - { name: step, value: notify }
                - { name: context, value: {{ `"{{steps.enrich.outputs.result}}"` }} }
          {{- end }}
    - name: enrich                            # Kubernetes API (read): ServiceAccount falco-response
      automountServiceAccountToken: true
      script:
        image: {{ $r.image }}
        command: [python3]
        source: {{ printf $run "enrich" | quote }}
        env:
          - { name: EVENT, value: {{ `"{{workflow.parameters.event}}"` }} }
          - { name: CLUSTER, value: {{ `"{{workflow.parameters.cluster}}"` }} }
          - { name: ORG_NAMESPACE, value: {{ $ns | quote }} }
          - { name: MINIMUM_PRIORITY, value: {{ .Values.falco.minimumPriority | quote }} }
        {{- include "ae.falcoScriptTrailer" $r.resources | nindent 8 }}
    - name: record                            # Kubernetes API (Event): ServiceAccount falco-response
      automountServiceAccountToken: true
      inputs:
        parameters:
          - name: context
      script:
        image: {{ $r.image }}
        command: [python3]
        source: {{ printf $run "record" | quote }}
        env:
          - { name: CONTEXT, value: {{ `"{{inputs.parameters.context}}"` }} }
          - { name: WORKFLOW_NAME, value: {{ `"{{workflow.name}}"` }} }
        {{- include "ae.falcoScriptTrailer" $r.resources | nindent 8 }}
    - name: call                              # endpoints outside the cluster API (rca, notify): no ServiceAccount token
      inputs:
        parameters:
          - name: step
          - name: context
      script:
        image: {{ $r.image }}
        command: [python3]
        source: {{ printf $run "{{inputs.parameters.step}}" | quote }}
        env:
          - { name: CONTEXT, value: {{ `"{{inputs.parameters.context}}"` }} }
          - { name: RCA_URL, value: {{ $r.rca.url | quote }} }
          {{- if $r.notify.enabled }}
          - name: NOTIFY_URL
            valueFrom: { secretKeyRef: { name: falco-notify, key: url } }
          - name: NOTIFY_TOKEN
            valueFrom: { secretKeyRef: { name: falco-notify, key: token, optional: true } }
          {{- end }}
        {{- include "ae.falcoScriptTrailer" $r.resources | nindent 8 }}
{{- end }}
