{{- /*
WorkflowTemplate falco-response (docs/observability.md "Falco response"), run by the OpenChoreo workflow plane's Argo
Workflows controller on mgmt. files/falco_response.py (ConfigMap) does the work; the ServiceAccount can only read
OpenChoreo RenderedReleases/Environments and write Events in the org namespace (no data-plane access).
*/ -}}
{{- if .Values.falco.enabled }}
{{- $r := .Values.falco.response }}
{{- $ns := .Values.openchoreo.orgNamespace }}
{{- $run := printf "import runpy, sys; sys.argv = ['falco_response.py', '%s']; runpy.run_path('/scripts/falco_response.py', run_name='__main__')" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-response
data:
  falco_response.py: |
    {{- .Files.Get "files/falco_response.py" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-response
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-response-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]          # Argo emissary executor reports step outputs
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-response-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-response-executor
subjects:
  - kind: ServiceAccount
    name: falco-response
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-falco-response
  namespace: {{ $ns }}
rules:
  - apiGroups: [openchoreo.dev]
    resources: [renderedreleases, environments]
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-falco-response
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-falco-response
subjects:
  - kind: ServiceAccount
    name: falco-response
    namespace: {{ .Release.Namespace }}
{{- if $r.notify.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-notify
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $r.notify.secret.store }}
  target:
    name: falco-notify
  dataFrom:
    - extract: { key: {{ $r.notify.secret.key }} }   # properties url, token (optional)
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: falco-response
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entrypoint: respond
  serviceAccountName: falco-response
  activeDeadlineSeconds: 300
  ttlStrategy:
    secondsAfterCompletion: {{ $r.ttlSecondsAfterFinished }}
  podGC:
    strategy: OnPodSuccess
  arguments:
    parameters:
      - name: event                           # falcosidekick JSON (Sensor falco-escalation)
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: scripts
      configMap: { name: falco-response }
  templates:
    - name: respond
      steps:
        - - name: enrich
            template: enrich
        - - name: record
            template: act
            arguments:
              parameters:
                - { name: step, value: record }
                - { name: context, value: {{ `"{{steps.enrich.outputs.result}}"` }} }
          {{- if $r.rca.enabled }}
          - name: rca
            template: act
            arguments:
              parameters:
                - { name: step, value: rca }
                - { name: context, value: {{ `"{{steps.enrich.outputs.result}}"` }} }
          {{- end }}
          {{- if $r.notify.enabled }}
          - name: notify
            template: act
            arguments:
              parameters:
                - { name: step, value: notify }
                - { name: context, value: {{ `"{{steps.enrich.outputs.result}}"` }} }
          {{- end }}
    - name: enrich
      script:
        image: {{ $r.image }}
        command: [python3]
        source: {{ printf $run "enrich" | quote }}
        env:
          - { name: EVENT, value: {{ `"{{workflow.parameters.event}}"` }} }
          - { name: ORG_NAMESPACE, value: {{ $ns | quote }} }
          - { name: MINIMUM_PRIORITY, value: {{ .Values.falco.minimumPriority | quote }} }
        resources: {{- toYaml $r.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
          - { name: scripts, mountPath: /scripts, readOnly: true }
    - name: act
      inputs:
        parameters:
          - name: step
          - name: context
      script:
        image: {{ $r.image }}
        command: [python3]
        source: {{ printf $run "{{inputs.parameters.step}}" | quote }}
        env:
          - { name: CONTEXT, value: {{ `"{{inputs.parameters.context}}"` }} }
          - { name: WORKFLOW_NAME, value: {{ `"{{workflow.name}}"` }} }
          - { name: RCA_URL, value: {{ $r.rca.url | quote }} }
          {{- if $r.notify.enabled }}
          - name: NOTIFY_URL
            valueFrom: { secretKeyRef: { name: falco-notify, key: url } }
          - name: NOTIFY_TOKEN
            valueFrom: { secretKeyRef: { name: falco-notify, key: token, optional: true } }
          {{- end }}
        resources: {{- toYaml $r.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        volumeMounts:
          - { name: scripts, mountPath: /scripts, readOnly: true }
{{- end }}
