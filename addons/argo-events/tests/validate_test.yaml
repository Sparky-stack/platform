suite: argo-events - value checks (templates/validate.yaml fails the render; nothing is applied half-broken)
release:
  name: argo-events
  namespace: argo-events
templates:
  - templates/validate.yaml
set:
  workflowPlane: "true"
tests:
  - it: valid defaults render nothing (and do not fail)
    asserts:
      - hasDocuments: { count: 0 }

  - it: rejects an unknown workflowPlane mode
    set: { workflowPlane: maybe }
    asserts:
      - failedTemplate: { errorPattern: "/workflowPlane': value must be one of" }

  - it: an EventBus version without pinned images fails rendering
    set: { eventBus.natsVersion: "2.9.16" }
    asserts:
      - failedTemplate:
          errorPattern: 'eventBus.natsVersion "2.9.16" is not in argo-events.configs.jetstream.versions'

  - it: rejects a cluster name that is not a DNS label
    set: { falco.clusters: [dev1, "Dev_1"] }
    asserts:
      - failedTemplate: { errorPattern: "/falco/clusters/1': 'Dev_1' does not match pattern" }

  - it: an empty cluster list fails the render (the ApplicationSet generates it)
    set: { falco.clusters: [] }
    asserts:
      - failedTemplate: { errorMessage: "falco.clusters is empty (generated by the addon ApplicationSet: catalog fleetParameters)" }

  - it: falco.clusters is not checked with falco off
    set: { falco.enabled: false, falco.clusters: [] }
    asserts:
      - hasDocuments: { count: 0 }

  - it: rejects an unknown minimum priority
    set: { falco.minimumPriority: severe }
    asserts:
      - failedTemplate: { errorPattern: "/falco/minimumPriority': 'severe' does not match pattern" }

  - it: auto-build webhook refuses to run without an HMAC secret (unsigned payloads would be accepted)
    set: { openchoreo.workflowPlane.autoBuild: webhook, secrets.githubGateApp.enabled: true, autoBuildWebhook.secret.key: "" }
    asserts:
      - failedTemplate: { errorPattern: "without an HMAC secret the EventSource accepts unsigned payloads" }

  - it: auto-build webhook rejects a non-GitHub owner URL
    set: { openchoreo.workflowPlane.autoBuild: webhook, secrets.githubGateApp.enabled: true, installation.githubOrg: https://gitlab.com/acme }
    asserts:
      - failedTemplate: { errorPattern: "supports https://github.com/<owner>" }

  - it: auto-build values are not checked when the webhook is off (poll)
    set: { autoBuildWebhook.secret.key: "", installation.githubOrg: https://gitlab.com/acme }
    asserts:
      - hasDocuments: { count: 0 }

  - it: needs openchoreo.controlPlane.host (routes are <hostPrefix>.<host>)
    set:
      openchoreo.controlPlane.host: null
    asserts:
      - failedTemplate: { errorPattern: "/openchoreo/controlPlane': missing property 'host'" }

  - it: needs autoBuildWebhook.workflowTemplate
    set:
      autoBuildWebhook.workflowTemplate: ""
    asserts:
      - failedTemplate: { errorPattern: "/autoBuildWebhook/workflowTemplate': minLength" }
