suite: argo-events - Falco escalation receiver + promotion gate trigger
release:
  name: argo-events
  namespace: argo-events
templates:
  - templates/eventsource.yaml
  - templates/sensors.yaml
  - templates/falco-response.yaml
  - templates/workflow-admission.yaml
set:
  workflowPlane: "true"            # most tests: as on mgmt with the workflow plane; detection is tested below
tests:
  - it: without the Argo Workflows CRDs (auto) no WorkflowTemplate, no Sensors and no Workflow admission pin render
    templates: [templates/sensors.yaml, templates/falco-response.yaml, templates/workflow-admission.yaml]
    set:
      workflowPlane: auto
    asserts:
      - hasDocuments: { count: 0 }

  - it: with the Argo Workflows CRDs (auto) WorkflowTemplate and Sensors render
    template: templates/falco-response.yaml
    set:
      workflowPlane: auto
    capabilities:
      apiVersions: [argoproj.io/v1alpha1/WorkflowTemplate]
    asserts:
      - isKind: { of: WorkflowTemplate }
        documentSelector: { path: kind, value: WorkflowTemplate }

  - it: with the Argo Workflows CRDs (auto) both Sensors render
    template: templates/sensors.yaml
    set:
      workflowPlane: auto
    capabilities:
      apiVersions: [argoproj.io/v1alpha1/WorkflowTemplate]
    asserts:
      - isKind: { of: Sensor }
        documentSelector: { path: metadata.name, value: falco-escalation }
      - isKind: { of: Sensor }
        documentSelector: { path: metadata.name, value: promotion-gate }

  - it: auto follows the installation switch (workflow plane off = no workflow objects, even with Argo CRDs present)
    templates: [templates/sensors.yaml, templates/falco-response.yaml]
    set:
      workflowPlane: auto
      openchoreo.workflowPlane.enabled: false
    capabilities:
      apiVersions: [argoproj.io/v1alpha1/WorkflowTemplate]
    asserts:
      - hasDocuments: { count: 0 }

  - it: the EventSource renders without the workflow plane
    template: templates/eventsource.yaml
    set:
      workflowPlane: auto
    asserts:
      - isKind: { of: EventSource }
        documentSelector: { path: metadata.name, value: platform }

  - it: rejects an unknown workflowPlane mode
    template: templates/workflow-admission.yaml
    set:
      workflowPlane: maybe
    asserts:
      - failedTemplate: { errorMessage: 'workflowPlane: "maybe" is not auto, true or false' }

  - it: EventBus JetStream pods run Pod Security restricted
    template: templates/eventsource.yaml
    documentSelector: { path: kind, value: EventBus }
    asserts:
      - equal: { path: spec.jetstream.securityContext, value: { fsGroup: 65532, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } } }
      - equal: { path: spec.jetstream.containerTemplate.securityContext, value: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } } }
      - equal: { path: spec.jetstream.reloaderContainerTemplate.securityContext.allowPrivilegeEscalation, value: false }
      - equal: { path: spec.jetstream.metricsContainerTemplate.securityContext.capabilities, value: { drop: [ALL] } }

  - it: the webhook listener is configurable (HTTPS outside local)
    template: templates/eventsource.yaml
    documentSelector: { path: kind, value: HTTPRoute }
    set:
      falco.route.sectionName: https
    asserts:
      - equal: { path: "spec.parentRefs[0].sectionName", value: https }

  - it: one-node JetStream EventBus with small requests
    template: templates/eventsource.yaml
    documentSelector: { path: kind, value: EventBus }
    asserts:
      - equal: { path: spec.jetstream.replicas, value: 1 }
      - equal: { path: spec.jetstream.containerTemplate.resources.requests.memory, value: 48Mi }

  - it: one Falco endpoint per cluster, each accepting only that cluster's token (no shared endpoint)
    template: templates/eventsource.yaml
    set:
      falco.clusters: [prod1, dev1, mgmt]
    asserts:
      - equal:
          path: spec.webhook["falco-dev1"]
          value: { port: "12000", endpoint: /falco/dev1, method: POST, authSecret: { name: falco-webhook, key: dev1 } }
        documentSelector: { path: metadata.name, value: platform }
      - equal:
          path: spec.webhook["falco-prod1"].authSecret
          value: { name: falco-webhook, key: prod1 }
        documentSelector: { path: metadata.name, value: platform }
      - notExists: { path: spec.webhook.falco }
        documentSelector: { path: metadata.name, value: platform }

  - it: per-cluster tokens are derived from the platform store's token, which is never written into the namespace
    template: templates/eventsource.yaml
    documentSelector: { path: kind, value: ExternalSecret }
    set:
      falco.clusters: [prod1, dev1, mgmt]
    asserts:
      - equal: { path: spec.secretStoreRef.name, value: platform }
      - equal: { path: metadata.namespace, value: argo-events }
      - equal: { path: spec.data, value: [{ secretKey: token, remoteRef: { key: falco-webhook, property: token } }] }
      - equal: { path: spec.target.template.engineVersion, value: v2 }
      - equal:
          path: spec.target.template.data
          value:
            dev1: '{{ printf "%s:%s" "dev1" .token | sha256sum }}'
            mgmt: '{{ printf "%s:%s" "mgmt" .token | sha256sum }}'
            prod1: '{{ printf "%s:%s" "prod1" .token | sha256sum }}'

  - it: rejects a cluster name that is not a DNS label
    template: templates/eventsource.yaml
    set:
      workflowPlane: "false"             # else sensors.yaml may report the same error first
      falco.clusters: [dev1, "Dev_1"]
    asserts:
      - failedTemplate: { errorMessage: 'falco.clusters: "Dev_1" is not a cluster name (DNS-1123 label)' }

  - it: an empty cluster list fails the render (the ApplicationSet generates it)
    template: templates/eventsource.yaml
    set:
      workflowPlane: "false"             # else sensors.yaml may report the same error first
      falco.clusters: []
    asserts:
      - failedTemplate: { errorMessage: "falco.clusters is empty (generated by the addon ApplicationSet: catalog fleetParameters)" }

  - it: exposes POST /falco on the control-plane Gateway as events.<host>
    template: templates/eventsource.yaml
    documentSelector: { path: kind, value: HTTPRoute }
    set:
      openchoreo.controlPlane.host: openchoreo.example.com
    asserts:
      - equal: { path: spec.hostnames, value: [events.openchoreo.example.com] }
      - equal: { path: "spec.parentRefs[0]", value: { name: gateway-default, namespace: openchoreo-control-plane, sectionName: http } }
      - equal: { path: "spec.rules[0].backendRefs[0]", value: { name: platform-eventsource-svc, port: 12000 } }

  - it: the route admits exactly the per-cluster endpoints
    template: templates/eventsource.yaml
    documentSelector: { path: kind, value: HTTPRoute }
    set:
      falco.clusters: [prod1, dev1]
    asserts:
      - equal:
          path: "spec.rules[0].matches"
          value:
            - { path: { type: Exact, value: /falco/dev1 }, method: POST }
            - { path: { type: Exact, value: /falco/prod1 }, method: POST }

  - it: watches ReleaseBindings in the org namespace read-only
    template: templates/eventsource.yaml
    asserts:
      - equal:
          path: spec.resource.releasebinding-rollout
          value: { namespace: default, group: openchoreo.dev, version: v1alpha1, resource: releasebindings, eventTypes: [ADD, UPDATE] }
        documentSelector: { path: metadata.name, value: releasebindings }
      - equal: { path: rules, value: [{ apiGroups: [openchoreo.dev], resources: [releasebindings], verbs: [get, list, watch] }] }
        documentSelector: { path: kind, value: Role }

  - it: escalates Critical and above, one Workflow per event uuid
    template: templates/sensors.yaml
    documentSelector: { path: metadata.name, value: falco-escalation }
    asserts:
      - isKind: { of: Sensor }
        documentIndex: 0
      - equal: { path: "spec.dependencies[0].filters.data[0].value", value: ["^Emergency$", "^Alert$", "^Critical$"] }
        documentIndex: 0
      - equal: { path: "spec.triggers[0].template.k8s.source.resource.spec.workflowTemplateRef.name", value: falco-response }
        documentIndex: 0
      - equal: { path: "spec.triggers[0].template.k8s.parameters[0].dest", value: metadata.name }
        documentIndex: 0

  - it: starts the promotion gate after a successful rollout in staging, one WorkflowRun per rollout
    template: templates/sensors.yaml
    documentSelector: { path: metadata.name, value: promotion-gate }
    asserts:
      - equal: { path: "spec.dependencies[0].filters.data[0]", value: { path: body.spec.environment, type: string, value: [staging] } }
      - equal: { path: "spec.triggers[0].template.k8s.source.resource.kind", value: WorkflowRun }
      - equal: { path: "spec.triggers[0].template.k8s.source.resource.spec.workflow", value: { kind: ClusterWorkflow, name: promotion-gate, parameters: { project: "", component: "", sourceEnvironment: "", release: "" } } }
      - matchRegex: { path: "spec.triggers[0].template.k8s.parameters[0].src.dataTemplate", pattern: 'rolloutId \| sha256sum' }

  - it: starts the gate only for the rollout of the binding's current spec (not a stale delivery after a releaseName edit)
    template: templates/sensors.yaml
    documentSelector: { path: metadata.name, value: promotion-gate }
    asserts:
      - equal:
          path: "spec.dependencies[0].filters.exprs"
          value:
            - expr: started >= specChanged
              fields:
                - { name: started, path: body.status.delivery.startedAt }
                - { name: specChanged, path: body.status.lastSpecUpdateTime }
      - notExists: { path: "spec.dependencies[0].filtersLogicalOperator" }   # default and: data AND exprs

  - it: rejects an unknown minimum priority
    template: templates/sensors.yaml
    set:
      falco.minimumPriority: severe
    asserts:
      - failedTemplate: { errorMessage: 'falco.minimumPriority "severe" is not a Falco priority' }

  - it: falco-response enriches and records; RCA and notify only when enabled
    template: templates/falco-response.yaml
    documentSelector: { path: kind, value: WorkflowTemplate }
    asserts:
      - lengthEqual: { path: "spec.templates[0].steps[1]", count: 1 }
      - matchRegex: { path: "spec.templates[1].script.image", pattern: '@sha256:[0-9a-f]{64}$' }

  - it: RCA step when the agent is enabled
    template: templates/falco-response.yaml
    documentSelector: { path: kind, value: WorkflowTemplate }
    set:
      falco.response.rca.enabled: true
    asserts:
      - equal: { path: "spec.templates[0].steps[1][1].name", value: rca }

  - it: the response identity only reads OpenChoreo objects and writes Events in the org namespace
    template: templates/falco-response.yaml
    documentSelector: { path: "rules[0].resources[0]", value: renderedreleases }
    asserts:
      - equal: { path: metadata.name, value: argo-events-falco-response }
      - equal:
          path: rules
          value:
            - { apiGroups: [openchoreo.dev], resources: [renderedreleases, environments], verbs: [get, list] }
            - { apiGroups: [events.k8s.io], resources: [events], verbs: [create] }

  - it: no step container gets a ServiceAccount token unless it talks to the Kubernetes API (executor-only pattern)
    template: templates/falco-response.yaml
    documentSelector: { path: kind, value: WorkflowTemplate }
    set:
      falco.response.rca.enabled: true
      falco.response.notify.enabled: true
      falco.response.notify.secret: { store: platform, key: falco-notify }
    asserts:
      - equal: { path: spec.automountServiceAccountToken, value: false }
      - equal: { path: spec.executor.serviceAccountName, value: falco-response-executor }
      # rca and notify call endpoints outside the cluster: template `call`, which must not opt back in
      - equal: { path: "spec.templates[0].steps[1][1]", value: { name: rca, template: call, arguments: { parameters: [{ name: step, value: rca }, { name: context, value: "{{steps.enrich.outputs.result}}" }] } } }
      - equal: { path: "spec.templates[0].steps[1][2].template", value: call }
      - notExists: { path: "spec.templates[?(@.name == 'call')].automountServiceAccountToken" }
      - notExists: { path: "spec.templates[?(@.name == 'call')].serviceAccountName" }
      - notExists: { path: "spec.templates[?(@.name == 'call')].executor" }
      # only the Kubernetes API steps opt in, and they get no external endpoint or notify credential
      - equal: { path: "spec.templates[?(@.name == 'enrich')].automountServiceAccountToken", value: true }
      - equal: { path: "spec.templates[?(@.name == 'record')].automountServiceAccountToken", value: true }
      - notContains: { path: "spec.templates[?(@.name == 'record')].script.env", content: { name: RCA_URL, value: "http://sre-agent.openchoreo-observability-plane.svc.cluster.local:8080/api/v1alpha1/rca-agent/analyze" } }
      - notContains: { path: "spec.templates[?(@.name == 'record')].script.env", content: { name: NOTIFY_URL, valueFrom: { secretKeyRef: { name: falco-notify, key: url } } } }
      - lengthEqual: { path: spec.templates, count: 4 }

  - it: the executor identity only reports step outputs (its token is mounted into Argo's init/wait containers only)
    template: templates/falco-response.yaml
    asserts:
      - equal: { path: "rules", value: [{ apiGroups: [argoproj.io], resources: [workflowtaskresults], verbs: [create, patch] }] }
        documentSelector: { path: "rules[0].resources[0]", value: workflowtaskresults }
      - equal: { path: "roleRef.name", value: falco-response-executor }
        documentSelector: { path: "subjects[0].name", value: falco-response-executor }
      - equal: { path: type, value: kubernetes.io/service-account-token }
        documentSelector: { path: metadata.name, value: falco-response-executor.service-account-token }
      - equal: { path: "metadata.annotations[\"kubernetes.io/service-account.name\"]", value: falco-response-executor }
        documentSelector: { path: metadata.name, value: falco-response-executor.service-account-token }

  - it: Workflows in the release namespace are pinned to WorkflowTemplate falco-response at admission (Deny)
    template: templates/workflow-admission.yaml
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: spec.failurePolicy, value: Fail }
        documentSelector: { path: kind, value: ValidatingAdmissionPolicy }
      - equal:
          path: spec.matchConstraints
          value:
            resourceRules: [{ apiGroups: [argoproj.io], apiVersions: ["*"], operations: [CREATE], resources: [workflows] }]
            namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: argo-events } }
        documentSelector: { path: kind, value: ValidatingAdmissionPolicy }
      - matchRegex: { path: "spec.validations[0].expression", pattern: "workflowTemplateRef == \\{'name': 'falco-response'\\}" }
        documentSelector: { path: kind, value: ValidatingAdmissionPolicy }
      - equal: { path: spec.validationActions, value: [Deny] }
        documentSelector: { path: kind, value: ValidatingAdmissionPolicyBinding }

  - it: the Sensor's Workflow is exactly what the admission pin allows (template ref by name + the event argument)
    template: templates/sensors.yaml
    documentSelector: { path: metadata.name, value: falco-escalation }
    asserts:
      - equal:
          path: "spec.triggers[0].template.k8s.source.resource.spec"
          value: { workflowTemplateRef: { name: falco-response }, arguments: { parameters: [{ name: event, value: "{}" }, { name: cluster, value: mgmt }] } }

  - it: one trigger per cluster, fired only by that cluster's endpoint and naming that cluster in the Workflow
    template: templates/sensors.yaml
    documentSelector: { path: metadata.name, value: falco-escalation }
    set:
      falco.clusters: [prod-eu, dev1]
    asserts:
      - lengthEqual: { path: spec.dependencies, count: 2 }
      - lengthEqual: { path: spec.triggers, count: 2 }
      - equal: { path: "spec.dependencies[1].name", value: falco_prod_eu }
      - equal: { path: "spec.dependencies[1].eventName", value: falco-prod-eu }
      - equal: { path: "spec.triggers[1].template.conditions", value: falco_prod_eu }
      - equal: { path: "spec.triggers[1].template.k8s.source.resource.spec.arguments.parameters[1]", value: { name: cluster, value: prod-eu } }
      - equal: { path: "spec.triggers[1].template.k8s.source.resource.metadata.labels[\"platform.koorikla.io/cluster\"]", value: prod-eu }
      - equal: { path: "spec.triggers[1].template.k8s.parameters[1].src", value: { dependencyName: falco_prod_eu, dataKey: body } }
      - equal: { path: "spec.triggers[0].template.conditions", value: falco_dev1 }
      - equal: { path: "spec.triggers[1].rateLimit", value: { unit: Minute, requestsPerUnit: 6 } }

  - it: falco-response hands the authenticated cluster to enrich (empty by default = skipped)
    template: templates/falco-response.yaml
    documentSelector: { path: kind, value: WorkflowTemplate }
    asserts:
      - contains: { path: spec.arguments.parameters, content: { name: cluster, value: "" } }
      - contains:
          path: spec.templates[?(@.name == "enrich")].script.env
          content: { name: CLUSTER, value: "{{workflow.parameters.cluster}}" }

  - it: no Workflow admission pin without the Falco receiver
    template: templates/workflow-admission.yaml
    set:
      falco.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: one event source type per EventSource (webhook in platform, resource watch in releasebindings)
    template: templates/eventsource.yaml
    asserts:
      - notExists: { path: spec.resource }
        documentSelector: { path: metadata.name, value: platform }
      - notExists: { path: spec.webhook }
        documentSelector: { path: metadata.name, value: releasebindings }

  - it: the promotion-gate sensor listens on EventSource releasebindings
    template: templates/sensors.yaml
    documentSelector: { path: metadata.name, value: promotion-gate }
    asserts:
      - equal: { path: "spec.dependencies[0].eventSourceName", value: releasebindings }

  - it: every falco-response step script passes its step name to falco_response.py (no printf MISSING)
    template: templates/falco-response.yaml
    documentSelector: { path: kind, value: WorkflowTemplate }
    asserts:
      - matchRegex:
          path: spec.templates[?(@.name == "enrich")].script.source
          pattern: "sys.argv = \\['falco_response.py', 'enrich'\\]"
      - matchRegex:
          path: spec.templates[?(@.name == "record")].script.source
          pattern: "sys.argv = \\['falco_response.py', 'record'\\]"
      - matchRegex:
          path: spec.templates[?(@.name == "call")].script.source
          pattern: "sys.argv = \\['falco_response.py', '\\{\\{inputs.parameters.step\\}\\}'\\]"
      - notMatchRegex:
          path: spec.templates[?(@.name == "enrich")].script.source
          pattern: "MISSING"

  - it: the Falco escalation trigger is rate limited (a CRITICAL burst must not flood mgmt with Workflows)
    template: templates/sensors.yaml
    documentSelector: { path: metadata.name, value: falco-escalation }
    asserts:
      - equal: { path: "spec.triggers[0].rateLimit", value: { unit: Minute, requestsPerUnit: 6 } }
