# Argo Events v1.9.11 (argo-helm chart 2.4.28) on mgmt (catalog: namespace argo-events, roles [mgmt]).
# docs/observability.md "Falco response", docs/promotion.md "Automated gate".
#
#   EventBus default          NATS JetStream, 1 replica, in-memory sized (events are transient; Falco events also stay in
#                             OpenSearch, rollouts in the ReleaseBinding status)
#   EventSource platform      webhook  falco                  POST /falco, bearer token (store `platform` key falco-webhook)
#                             resource releasebinding-rollout  ReleaseBindings in the OpenChoreo org namespace
#   Sensor falco-escalation   priority >= Critical -> Workflow from WorkflowTemplate falco-response (one per event uuid)
#   Sensor promotion-gate     rollout succeeded in an autoTrigger environment -> OpenChoreo WorkflowRun (ClusterWorkflow
#                             promotion-gate, addon openchoreo-platform), one per rollout
#   WorkflowTemplate falco-response   enrich (control-plane objects) -> record Event -> RCA agent (if on) -> notify (if set)
#   ValidatingAdmissionPolicy argo-events-workflows-falco-response-only   Workflows here run only falco-response
# Argo Workflows itself is the OpenChoreo workflow plane's controller on mgmt (addon openchoreo-workflow-plane); it must
# watch this namespace (cluster-wide controller, the chart default).
#
# Budget (memory requests, budget 200Mi): controller 48Mi + JetStream 48Mi (+ reloader 8Mi + exporter 8Mi) + EventSource
# 24Mi + 2 Sensors 2x24Mi = 184Mi (limits 608Mi). Workflow pods (falco-response, promotion gate) are short-lived.

# --- generated by the addon ApplicationSet (defaults so `helm template` works standalone) ---------------------------
cluster: { name: mgmt, role: mgmt, provider: docker, region: local, environment: mgmt, cni: flannel }
openchoreo:
  orgNamespace: default
  controlPlane:
    host: openchoreo.localhost
  observability:
    enabled: true
  workflowPlane:
    enabled: true                    # installation.yaml; false: no workflow objects even if Argo CRDs exist (auto)

argo-events:
  fullnameOverride: argo-events
  # Images fully qualified and pinned by multi-arch index digest (docs/conventions.md invariant 9; contract:
  # hack/tests/test_image_pins.sh). The controller also starts the EventSource / Sensor pods from this image
  # (env ARGO_EVENTS_IMAGE).
  global:
    image:
      repository: quay.io/argoproj/argo-events
      tag: v1.9.11@sha256:fa07b2c9ece6ec60a3a8377866dfe21e8bad062d5b5407f1f181d3f1d24fb861   # index: amd64, arm64
  crds:
    install: true
    keep: true
  configs:
    # EventBus images live in the controller config, not in a pod spec: only the versions listed here can run.
    # NATS Streaming (STAN) never runs (the EventBus is JetStream), but the controller refuses to start without at
    # least one STAN version (ValidateConfig): one pinned entry instead of the chart's `latest` list.
    nats:
      versions:
        - version: 0.22.1
          natsStreamingImage: docker.io/library/nats-streaming:0.22.1@sha256:3dd7b21a7fceebc956629af8ad31b7e5dfb2cc717cba4be55e6b50f7ca726932   # index: amd64, arm64, arm
          metricsExporterImage: docker.io/natsio/prometheus-nats-exporter:0.14.0@sha256:839c59f6a23473a657f6560c2a14dca9b9ce722a017933a41d071a3c9dd3a7d7   # index: amd64, arm64, arm
    jetstream:
      # Exactly the version eventBus.natsVersion selects (the chart default lists ten, tag-only).
      versions:
        - version: "2.10.29"
          natsImage: docker.io/library/nats:2.10.29@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f   # index: amd64, arm64, arm, ppc64le, s390x
          metricsExporterImage: docker.io/natsio/prometheus-nats-exporter:0.14.0@sha256:839c59f6a23473a657f6560c2a14dca9b9ce722a017933a41d071a3c9dd3a7d7   # index: amd64, arm64, arm
          configReloaderImage: docker.io/natsio/nats-server-config-reloader:0.14.0@sha256:8c28b75bc416bb068761b19edf9a471bf8e35062bf619ea49c8e22af517e383e   # index: amd64, arm64, arm
          startCommand: /nats-server
      streamConfig:
        maxMsgs: 10000
        maxAge: 24h
        maxBytes: 64MB
        replicas: 1                  # one JetStream node (EventBus replicas 1)
        duplicates: 300s
  controller:
    rbac:
      namespaced: true               # manage EventBus/EventSources/Sensors in this namespace only
      managedNamespace: argo-events
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 128Mi }
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532                 # the image declares no USER (kubelet refuses runAsNonRoot without a numeric uid)
      runAsGroup: 65532
      capabilities: { drop: [ALL] }
      seccompProfile: { type: RuntimeDefault }
  webhook:
    enabled: false                   # admission webhook for Argo Events CRs: not needed (GitOps-validated)

eventBus:
  natsVersion: "2.10.29"             # must be in argo-events.configs.jetstream.versions (pinned above)
  resources:
    nats: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 128Mi } }
    reloader: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 32Mi } }
    metrics: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 32Mi } }
  maxMemoryStore: 64MB
  maxFileStore: 128MB                # emptyDir

# Argo Workflows (the OpenChoreo workflow plane, addon openchoreo-workflow-plane) runs falco-response and the
# promotion gate: auto = render WorkflowTemplate falco-response and both Sensors only once its CRDs exist on the
# cluster (Argo CD re-renders when they appear), true / false force it. The EventSource and EventBus always render.
workflowPlane: auto

# Pods of the EventSource / Sensors (one pod each).
podResources:
  requests: { cpu: 10m, memory: 24Mi }
  limits: { memory: 96Mi }

# Falco escalation receiver (contract: docs/observability.md "Falco response").
falco:
  enabled: true
  port: 12000
  endpoint: /falco
  # Bearer token falcosidekick sends (Authorization: Bearer <token>); same store key the falco addon reads.
  tokenSecret: { store: platform, key: falco-webhook, property: token }
  # Exposed on the control-plane Gateway (HTTP listener, all namespaces allowed) as http://events.<host>:8080/falco.
  # Data-plane pods resolve *.openchoreo.localhost to mgmt through addon coredns-local (no new DNS rule); mgmt pods
  # to the Gateway Service. Locally plain HTTP on the docker network; cloud installations put TLS on that listener.
  route:
    enabled: true
    hostPrefix: events                 # events.<openchoreo.controlPlane.host>
    gateway: { name: gateway-default, namespace: openchoreo-control-plane }
    # Gateway listener. Locally `http` (plain HTTP on the docker network, bearer token in cleartext there). Every
    # non-local installation must use an HTTPS listener (e.g. `https`) and an https:// url in the falco-webhook key:
    # the token authenticates every escalation (docs/observability.md "Falco response").
    sectionName: http
  minimumPriority: critical            # defence in depth: sidekick already sends only >= critical
  response:
    image: docker.io/library/python:3.14.10-alpine3.24@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 96Mi }
    ttlSecondsAfterFinished: 21600          # 6h: keeps failures inspectable without piling up Workflows
    # Escalation budget: at most this many falco-response Workflows per minute (Sensor trigger rateLimit). A burst of
    # CRITICAL alerts (e.g. a noisy rule on a new node) must not flood mgmt with Workflows; events above the budget wait.
    rateLimit: { unit: Minute, requestsPerUnit: 6 }
    # OpenChoreo RCA agent (observability plane, rca.enabled - off in this platform until an LLM endpoint exists).
    rca:
      enabled: false
      url: http://sre-agent.openchoreo-observability-plane.svc.cluster.local:8080/api/v1alpha1/rca-agent/analyze
    # Notification webhook (chat/incident tool), from the store: key falco-notify, properties url (+ token).
    notify:
      enabled: false
      # secret: { store: platform, key: falco-notify }

# Promotion gate trigger (docs/promotion.md): after a successful rollout in one of these environments, start the
# OpenChoreo ClusterWorkflow promotion-gate for that component (addon openchoreo-platform). One WorkflowRun per rollout
# (name derived from the rollout id), so re-delivered events are no-ops.
promotionGate:
  enabled: true
  sourceEnvironments: [staging]
  workflow: promotion-gate
