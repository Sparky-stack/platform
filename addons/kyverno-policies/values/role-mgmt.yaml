# mgmt runs no Istio (catalog istio-ambient: roles [workload]) and no OpenChoreo data plane.
ambientEnrollment:
  enabled: false

# mgmt has no OpenChoreo cell namespaces.
imageVerification:
  enabled: false

# The OpenChoreo workflow plane (catalog openchoreo-workflow-plane: roles [mgmt]) runs here: digest-only run images.
workflowImageDigests:
  enabled: true

# PR previews: the Environments live here (expiry, cap, TTL); preview cell namespaces only on data planes.
previewGuards:
  environments: true
  namespaces: false

# OpenChoreo control plane: ResourceReleaseBindings only to data planes that run their type's operators (#70).
dataPlaneCapabilities:
  enabled: true
