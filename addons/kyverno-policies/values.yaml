# Kyverno policies on every cluster (docs/networking.md "Kyverno"); the engine is addons/kyverno.
# One template per concern; values/role-mgmt.yaml switches between the mgmt and workload sets:
#   kyverno-policies (upstream)             Pod Security Standards baseline, Audit only
#   templates/ambient-enrollment.yaml       cell namespaces join Istio ambient                 (workload)
#   templates/cell-mesh.yaml                HBONE, strict mTLS and peer authz per cell          (workload)
#   templates/image-verification.yaml       supply-chain gate                                   (workload)
#   templates/workload-resilience.yaml      replicas, probes, requests                          (workload)
#   templates/previews.yaml                 PR preview guards                          (mgmt + workload)
#   templates/workflow-image-digests.yaml   digest-only images in workflows-*                   (mgmt)
#   templates/data-plane-capabilities.yaml  bindings only to capable data planes                (mgmt)

# Never touched by any policy here. Same list as addons/kyverno (hack/tests/test_gitops_contracts.sh checks it).
platformNamespaces: &platformNamespaces
  - kube-system
  - kube-public
  - kube-node-lease
  - kyverno
  - argocd
  - cert-manager
  - external-secrets
  - platform-secrets
  - capi-operator-system
  - capi-system
  - capi-k3s-bootstrap-system
  - capi-k3s-control-plane-system
  - capd-system
  - capa-system
  - caph-system
  - fleet
  - openchoreo-control-plane
  - openchoreo-data-plane
  - openchoreo-workflow-plane
  - openchoreo-observability-plane
  - openchoreo-secrets
  - thunder
  - kgateway-system
  - istio-system
  - cilium
  - falco
  - telemetry
  - obi
  - agentgateway-system

kyverno-policies:
  # -- `baseline` in `Audit` mode (`validationFailureAction: Audit`, `failurePolicy: Ignore`), excluding `platformNamespaces` (`vpolExclude`).
  podSecurityStandard: baseline
  validationFailureAction: Audit
  failurePolicy: Ignore             # audit-only policies must never block a request
  kyvernoVersion: "1.20.0"          # = addons/kyverno appVersion; "autodetect" would need helm lookup (empty in Argo CD)
  vpolExclude:
    excludeNamespaces: *platformNamespaces
  customAnnotations:
    # The ValidatingPolicy CRD comes from addons/kyverno; don't fail the dry run before it exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

# Cell namespaces (one per project x environment) join Istio ambient; one that already has istio.io/dataplane-mode
# (e.g. "none" via ProjectReleaseBinding namespaceLabels) is left alone - that is the opt-out.
ambientEnrollment:
  # -- `true` on workload clusters (`false` on `mgmt`), enrolling `renderedrelease-controller` namespaces into Istio ambient.
  enabled: true
  cellNamespaceSelector:
    matchLabels:
      openchoreo.dev/managed-by: renderedrelease-controller
    matchExpressions:
      - { key: openchoreo.dev/project, operator: Exists }
      - { key: openchoreo.dev/environment, operator: Exists }
  # Every in-cluster client of cell pods must be in the mesh (hack/tests/test_mesh_contracts.sh checks it).
  mtls:
    # -- Every enrolled cell gets NetworkPolicy `platform-mesh-hbone` and a `STRICT` `PeerAuthentication`, or `PERMISSIVE` where `<optOutLabel>=permissive` ([strict mTLS in cell namespaces](../../docs/networking.md#strict-mtls-in-cell-namespaces)).
    strict: true
    optOutLabel: platform.koorikla.io/mtls
    # -- With `strict`: AuthorizationPolicy `platform-cell-peers` admits into a cell only its own workloads and these SPIFFE principals (`<trust domain>/ns/<namespace>/sa/<service account>`); any other mesh identity, e.g. another cell, is refused (#324).
    platformPeers:
      - cluster.local/ns/openchoreo-data-plane/sa/gateway-default   # data-plane gateway: all ingress into cells
      - cluster.local/ns/telemetry/sa/openchoreo-prometheus-agent   # metrics scrapes of cell pods (#209, #323)
      - cluster.local/ns/cnpg-system/sa/cnpg                        # CloudNativePG operator -> instance manager
      - cluster.local/ns/moco-system/sa/moco-controller-manager     # MOCO operator -> moco-agent gRPC + mysqld (#256)
      - cluster.local/ns/keda/sa/keda-operator                      # KEDA scalers polling in-cell endpoints
      - cluster.local/ns/strimzi/sa/strimzi-cluster-operator        # Strimzi operator -> Kafka brokers in cells
  # Replaces Strimzi's own per-listener policies (off in addon strimzi), which open only Kafka ports, not HBONE (#210).
  strimzi:
    # -- Every enrolled cell gets NetworkPolicy `platform-strimzi`: pods with `strimzi.io/cluster` admit the cell's pods, `openchoreo.dev/system-component` pods and `peers` on any port (HBONE `15008` included) plus kubelet probes.
    enabled: true
    peers:
      - { namespace: strimzi, podLabels: { strimzi.io/kind: cluster-operator } }  # cluster operator: admin client, rolls
      - { namespace: keda, podLabels: { app: keda-operator } }                    # KEDA kafka scaler: consumer lag

# Source of kubelet probes after istio-cni's SNAT. Must match addons/mesh ambient.probeSourceCIDRs
# (hack/tests/test_mesh_probe_cidrs.sh).
mesh:
  probeSourceCIDRs: [169.254.7.127/32, "fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128"]

# --- Supply-chain gate per environment (templates/image-verification.yaml, docs/supply-chain.md) ----------------------
imageVerification:
  # -- `Audit` in `development`/`staging` and `Deny` in `production` (`imageVerification.{enabled,environments,github,platformKey,requireDigest}`), verifying koorikla/platform `app-container.yaml` keyless workflow attestations or `cosign-platform` signatures.
  enabled: true
  # environment -> Audit (PolicyReport only) | Deny (blocked at admission).
  environments:
    development: Audit
    staging: Audit
    production: Deny
  # Action for cell namespaces of every environment NOT listed above (a new environment is never unchecked):
  # Audit | Deny | "" (unlisted environments are not checked).
  defaultAction: Audit
  # Enforce fails closed (Kyverno down = production rollouts pause), audit never blocks.
  failurePolicy:
    Audit: Ignore
    Deny: Fail
  # Webhook timeout of every image policy (max 30): a cold keyless verification takes ~5-10 s (#136).
  timeoutSeconds: 30
  # Workload clusters only (mgmt has no OpenChoreo cell namespaces); values/role-mgmt.yaml turns it off.
  cellNamespaceSelector:
    matchLabels:
      openchoreo.dev/managed-by: renderedrelease-controller
  # Keyless images of the reusable workflow app-container.yaml. Anyone can call it, so every trusted source
  # (repository, ref, trigger) is one attestor (docs/supply-chain.md); all three attestations are required.
  github:
    enabled: true
    prefixes: ["ghcr.io/koorikla/"]        # image reference prefixes this source covers
    issuer: https://token.actions.githubusercontent.com
    # Subject = <workflow>@<workflowRef>; a tag is mutable, so workflowRef must be a 40-hex commit SHA (Renovate
    # tracks the tag in the trailing comment).
    workflow: https://github.com/koorikla/platform/.github/workflows/app-container.yaml
    workflowRef: "3311f541a8eab72a2649b6f1eda4fe05efa3142e" # ci-v1.0.0
    # Previous pin, kept until every production image is rebuilt at workflowRef (at most one; docs/supply-chain.md
    # "Moving the workflow pin"). Each costs a failed verification per check, so keep the window short.
    transitionWorkflowRefs: []
    # The builds production trusts, one record per (repository, ref, trigger), tried in this order. Each becomes the
    # attestor `name` (DNS label, at most 60 characters, unique; a transition copy is its first 52 characters plus
    # -<sha7>). repository, ref and trigger are the certificate extensions githubWorkflowRepository,
    # githubWorkflowRef and githubWorkflowTrigger. trigger push: only builds of merged code (pull_request_target
    # may build untrusted PR code). An installation overlay adds its app repos (docs/supply-chain.md).
    trustedSources:
      - name: gh-koorikla-hello-world-heads-main
        repository: koorikla/hello-world
        ref: refs/heads/main
        trigger: push
    rekorURL: https://rekor.sigstore.dev
    attestations: [sbom, provenance, vuln] # names from `attestationTypes`
  # In-cluster builds under <registry.host>/<registry.appsProject>/, signed with the platform cosign key (public key
  # only). Without a key the registry is not trusted at all (docs/supply-chain.md "Wiring the key").
  platformKey:
    enabled: true
    publicKey: ""                          # PEM: cosign.pub of store key cosign-platform, inline (stable or KMS-backed
                                           # installations: installations/<inst>/addons/kyverno-policies/values.yaml)
    # Without publicKey (registry.type harbor) the key comes per workload cluster from charts/cluster
    # image-verification-crs.yaml; a missing ConfigMap fails the check, never skips it.
    cluster:
      namespace: kyverno                   # == charts/cluster imageVerification.namespace (addon kyverno's namespace)
      configMap: platform-image-verification   # == charts/cluster imageVerification.configMap; key cosign.pub
      pullSecret: platform-registry        # == charts/cluster imageVerification.pullSecret (credentials.secrets)
    rekor: false                           # in-cluster signing without a transparency log (cosign --tlog-upload=false)
    # Provenance is BuildKit's unsigned SLSA manifest, so it is not required here.
    attestations: [sbom, vuln]
  attestationTypes:                        # in-toto predicate types (as listed by `cosign verify` on koorikla images)
    sbom: https://spdx.dev/Document/v2.3
    provenance: https://slsa.dev/provenance/v1
    vuln: https://cosign.sigstore.dev/attestation/vuln/v1
  # Tag-only image references: denied by enforce, reported by audit (docs/supply-chain.md "Digest references").
  requireDigest:
    Audit: false
    Deny: true
  # Trusted prefixes besides github.prefixes and the platform registry (CloudNativePG / MOCO operand images are
  # trusted by digest through the catalog's sharedValueFiles).
  extraTrustedPrefixes: []

# --- Digest-only images in workflow run namespaces (templates/workflow-image-digests.yaml) ----------------------------
workflowImageDigests:
  # -- On `mgmt` only, denies Pods in `workflows-*` whose images are not `image@sha256:<digest>` (`ValidatingPolicy/platform-workflow-image-digests`, [build plane](../../docs/build-plane.md#security-posture-of-build-pods)).
  enabled: false                     # values/role-mgmt.yaml: the workflow plane runs on mgmt (catalog roles [mgmt])
  namespacePrefix: workflows-
  failurePolicy: Fail                # Kyverno down: new run pods wait (only workflows-*), never admitted unchecked

# --- PR preview environments (templates/previews.yaml); installation.yaml `previews` overrides these defaults -------
previews:
  # -- PR previews (`previews` and `previewGuards`): expiry stamp, per-tenant cap and TTL `DeletingPolicy` on `mgmt` Environments; quota, limits and egress isolation in preview cell namespaces ([preview environments](../../docs/preview-environments.md)).
  enabled: false
  ttl: 48h
  maxPerTenant: 2

# --- Data-plane capabilities of resource types (templates/data-plane-capabilities.yaml) -------------------------------
dataPlaneCapabilities:
  # -- On `mgmt` only, denies a `ResourceReleaseBinding` whose (Cluster)ResourceType names an addon in `platform.koorikla.io/requires-addons` that the environment's data plane does not announce (`ValidatingPolicy/platform-data-plane-capabilities`, [data services](../../docs/data-services.md#only-on-data-planes-that-run-the-operator)).
  enabled: false                     # values/role-mgmt.yaml: the OpenChoreo control plane runs on mgmt

previewGuards:
  environments: false                # mgmt (values/role-mgmt.yaml): expiry stamp, per-tenant cap, TTL deletion
  namespaces: true                   # data planes: quota, limits, isolation of preview cell namespaces
  schedule: "*/5 * * * *"            # DeletingPolicy run (cron)
  ttlGrace: 1h                       # delete this long after expires-at: the auto-build pass expires the PR first
  # One or two small services plus the preview's database (#331). requests.storage >= postgresql's minimum volume + 5Gi
  # (hack/tests/test_kyverno_policies.sh).
  quota:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    persistentvolumeclaims: "2"
    requests.storage: 15Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
  containerLimits:
    default: { cpu: 500m, memory: 256Mi }
    defaultRequest: { cpu: 50m, memory: 64Mi }
    max: { memory: 1Gi }

# installation.yaml `registry` (injected by the ApplicationSet; standalone default). appsProject: where builds push.
registry:
  host: ""
  appsProject: apps

# --- Workload resilience (templates/workload-resilience.yaml) ----------------------------------------------------------
workloadResilience:
  # -- Workload clusters only (mgmt has no OpenChoreo cell namespaces); values/role-mgmt.yaml turns it off.
  enabled: true
  # -- Environments (cell namespace label `openchoreo.dev/environment`) where the checks deny; Audit everywhere else.
  enforcedEnvironments: [production]
  cellNamespaceSelector:
    matchLabels:
      openchoreo.dev/managed-by: renderedrelease-controller
