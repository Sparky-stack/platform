# Data plane dev1 runs crossplane: bindings of both types pass; a binding of a missing Resource is denied.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: data-plane-capabilities-capable
policies: [../policies.yaml]
resources: [../bindings.yaml, ../binding-cache.yaml, ../binding-orphan.yaml]
clusterResources: [cluster.yaml]
results:
  - policy: platform-data-plane-capabilities
    kind: ResourceReleaseBinding
    resources: [default/orders-db-development, default/cache-development]
    result: pass
  - policy: platform-data-plane-capabilities
    kind: ResourceReleaseBinding
    resources: [default/ghost-development]
    result: fail
checks:
  - match:
      resource: {metadata: {name: ghost-development}}
    assert:
      message: 'ResourceReleaseBinding ghost-development: Resource ghost does not exist in namespace default (apply it before its bindings).'
