# Cluster state (resource.List / resource.Get): Resource orders-db (ClusterResourceType postgresql, requires crossplane), Resource cache
# (ClusterResourceType valkey, no requirement), environment development on ClusterDataPlane dev1 (crossplane: false).
apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata: {name: opted-out}
spec:
  # CRDs from addons/openchoreo-control-plane, written to ../crds/ by hack/tests/test_kyverno_policies.sh: the REST
  # mapping for the policy's lookups.
  crds:
    - ../crds/resourcereleasebindings.openchoreo.dev.yaml
    - ../crds/resources.openchoreo.dev.yaml
    - ../crds/clusterresourcetypes.openchoreo.dev.yaml
    - ../crds/environments.openchoreo.dev.yaml
    - ../crds/clusterdataplanes.openchoreo.dev.yaml
  resources:
    - apiVersion: openchoreo.dev/v1alpha1
      kind: Resource
      metadata: {name: orders-db, namespace: default}
      spec: {owner: {projectName: demo}, type: {kind: ClusterResourceType, name: postgresql}}
    - apiVersion: openchoreo.dev/v1alpha1
      kind: Resource
      metadata: {name: cache, namespace: default}
      spec: {owner: {projectName: demo}, type: {kind: ClusterResourceType, name: valkey}}
    - apiVersion: openchoreo.dev/v1alpha1
      kind: ClusterResourceType
      metadata: {name: postgresql, annotations: {platform.koorikla.io/requires-addons: crossplane}}
      spec: {resources: [{id: x, template: {}}]}
    - apiVersion: openchoreo.dev/v1alpha1
      kind: ClusterResourceType
      metadata: {name: valkey}
      spec: {resources: [{id: x, template: {}}]}
    - apiVersion: openchoreo.dev/v1alpha1
      kind: Environment
      metadata: {name: development, namespace: default}
      spec: {dataPlaneRef: {kind: ClusterDataPlane, name: dev1}}
    - apiVersion: openchoreo.dev/v1alpha1
      kind: ClusterDataPlane
      metadata: {name: dev1, annotations: {addons.platform.koorikla.io/keda: "true", addons.platform.koorikla.io/crossplane: "false"}}
      spec: {planeID: dev1}
