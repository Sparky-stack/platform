# Offline: with a platform key only <registry.host>/<registry.appsProject>/ is trusted (pinned host:port and project).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: openchoreo-trusted-registries-platform-key
policies: [policies.yaml]
resources: [resources.yaml]
variables: values.yaml
results:
  - policy: openchoreo-trusted-registries-enforce
    kind: Pod
    resources: [dp-default-demo-production-1/prod-platform-apps]
    result: pass
  - policy: openchoreo-trusted-registries-enforce
    kind: Pod
    resources:
      - dp-default-demo-production-1/prod-platform-other-port
      - dp-default-demo-production-1/prod-platform-other-project
      - dp-default-demo-production-1/prod-platform-no-port
    result: fail
