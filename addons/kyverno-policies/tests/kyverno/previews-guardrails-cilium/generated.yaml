# What platform-preview-guardrails (templates/previews.yaml, cluster.cni cilium) creates in the preview cell namespace; kyverno
# test compares each generated object with its entry here.
apiVersion: v1
kind: ResourceQuota
metadata:
  labels:
    platform.koorikla.io/preview: "true"
  name: platform-preview
  namespace: dp-default-demo-pr-9-hello-world-1234abcd
spec:
  hard:
    limits.cpu: "4"
    limits.memory: 2Gi
    persistentvolumeclaims: "2"
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    requests.storage: 15Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  labels:
    platform.koorikla.io/preview: "true"
  name: platform-preview
  namespace: dp-default-demo-pr-9-hello-world-1234abcd
spec:
  limits:
    - default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        memory: 1Gi
      type: Container
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    platform.koorikla.io/preview: "true"
  name: platform-preview-isolation
  namespace: dp-default-demo-pr-9-hello-world-1234abcd
spec:
  egress:
    - to:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: openchoreo.dev/environment
                operator: DoesNotExist
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    platform.koorikla.io/preview: "true"
  name: platform-preview-database-apiserver
  namespace: dp-default-demo-pr-9-hello-world-1234abcd
specs:
  - egress:
      - toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
              - port: "6443"
                protocol: TCP
    endpointSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: Exists
        - key: cnpg.io/podRole
          operator: In
          values:
            - instance
        - key: openchoreo.dev/component
          operator: DoesNotExist
  - egress:
      - toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
              - port: "6443"
                protocol: TCP
    endpointSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: Exists
        - key: cnpg.io/jobRole
          operator: Exists
        - key: openchoreo.dev/component
          operator: DoesNotExist
