# Sample workflow run Pods (Argo executor init/wait + a main container, as the workflow-controller creates them).
apiVersion: v1
kind: Pod
metadata: { name: build-pinned, namespace: workflows-default }
spec:
  containers:
    - { name: main, image: "ghcr.io/koorikla/platform/ci-toolbox:main@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
    - { name: wait, image: "quay.io/argoproj/argoexec:v4.0.8@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
  initContainers:
    - { name: init, image: "quay.io/argoproj/argoexec:v4.0.8@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
---
apiVersion: v1
kind: Pod
metadata: { name: check-tag-and-digest, namespace: workflows-default }
spec:
  containers:
    - { name: main, image: "docker.io/library/golang:1.27.4-trixie@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
    - { name: wait, image: "quay.io/argoproj/argoexec:v4.0.8@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
  initContainers:
    - { name: init, image: "quay.io/argoproj/argoexec:v4.0.8@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
---
