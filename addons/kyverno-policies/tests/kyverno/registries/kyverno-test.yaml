# Offline: trusted-registry gate per environment. Run by hack/tests/test_kyverno_policies.sh against the rendered
# addon (policies.yaml is written there; helm-values.yaml, if present, is passed to helm template). Signature checks
# need the network: ../signatures/kyverno-test.yaml. Platform registry WITH a key: ../platform-key.
# Rendered with installation registry.host set and NO platformKey.publicKey: the platform registry is not trusted.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: openchoreo-trusted-registries
policies: [policies.yaml]
# resources-cnpg.yaml / resources-moco.yaml: written by the script from the pins in addons/cloudnative-pg/values.yaml
# (#327) and addons/moco/values.yaml (#256).
resources: [resources.yaml, resources-cnpg.yaml, resources-moco.yaml]
variables: values.yaml
results:
  - policy: openchoreo-trusted-registries-enforce
    kind: Pod
    resources:
      - dp-default-demo-production-1/prod-trusted
      - dp-default-demo-production-1/prod-cnpg-catalog            # pinned CNPG operator + imageCatalog image
      - dp-default-demo-production-1/prod-moco-mysql              # pinned mysqld catalog image + moco-agent
    result: pass
  - policy: openchoreo-trusted-registries-enforce
    kind: Pod
    resources:
      - dp-default-demo-production-1/prod-untrusted              # unsigned initContainer from docker.io
      - dp-default-demo-production-1/prod-untrusted-ephemeral    # kubectl debug image
      - dp-default-demo-production-1/prod-lookalike
      - dp-default-demo-production-1/prod-registry-port          # old in-cluster registry prefix: never trusted
      - dp-default-demo-production-1/prod-platform-unsigned      # unsigned image denied in production (no key)
      - dp-default-demo-production-1/prod-cnpg-other-digest      # catalog repository + tag, another digest
      - dp-default-demo-production-1/prod-cnpg-operator-other-digest
      - dp-default-demo-production-1/prod-cnpg-unlisted          # same registry, not in the catalog
      - dp-default-demo-production-1/prod-cnpg-tag-only          # catalog image without its digest
      - dp-default-demo-production-1/prod-cnpg-untrusted-sidecar # pinned images + docker.io sidecar
      - dp-default-demo-production-1/prod-moco-other-digest      # mysqld catalog repository + tag, another digest
      - dp-default-demo-production-1/prod-moco-agent-tag-only    # moco-agent without its digest
      - dp-default-demo-production-1/prod-moco-slow-log          # fluent-bit slow-log sidecar: not admitted
    result: fail
  - policy: openchoreo-trusted-registries-audit
    kind: Pod
    resources: [dp-default-demo-staging-1/staging-untrusted, dp-default-demo-qa-1/qa-untrusted]
    result: fail                                                 # qa is not listed: defaultAction Audit
  - policy: openchoreo-trusted-registries-enforce
    kind: Pod
    resources: [dp-default-demo-staging-1/staging-untrusted, dp-default-demo-qa-1/qa-untrusted]
    result: skip
  - policy: openchoreo-trusted-registries-audit
    kind: Pod
    resources: [dp-default-demo-production-1/prod-untrusted]
    result: skip
