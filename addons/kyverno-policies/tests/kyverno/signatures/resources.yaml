spec:
  containers:
    # Built by koorikla/hello-world main through koorikla/ci container.yaml (keyless, cosign v3 bundle) with signed
    # SPDX SBOM, SLSA provenance and vuln attestations.
    - { name: app, image: "ghcr.io/koorikla/hello-world:d04ca59@sha256:068979444334cb0dc031d9a286dcd7daed372572a5354135d19e8a471fcb2ec1" }
---
apiVersion: v1
