apiVersion: v1
kind: Pod
metadata: { name: prod-signed-mutable-ref, namespace: dp-default-demo-production-1 }
spec:
  containers:
    # Built by koorikla/hello-world main through koorikla/ci container.yaml (keyless, cosign v3 bundle) with signed
    # SPDX SBOM, SLSA provenance and vuln attestations - but called as koorikla/ci@v1: the certificate SAN names the
    # mutable ref (container.yaml@refs/tags/v1), not the pinned commit, so it is rejected (#41).
    - { name: app, image: "ghcr.io/koorikla/hello-world:d04ca59@sha256:068979444334cb0dc031d9a286dcd7daed372572a5354135d19e8a471fcb2ec1" }
---
apiVersion: v1
kind: Pod
metadata: { name: prod-tag-only, namespace: dp-default-demo-production-1 }
spec:
  containers:
    - { name: app, image: "ghcr.io/koorikla/hello-world:d04ca59" }   # production requires a digest
---
apiVersion: v1
kind: Pod
metadata: { name: staging-tag, namespace: dp-default-demo-staging-1 }
spec:
  containers:
    - { name: app, image: "ghcr.io/koorikla/hello-world:d04ca59" }   # tags only reported outside production
---
apiVersion: v1
kind: Pod
metadata: { name: prod-unsigned-init, namespace: dp-default-demo-production-1 }
spec:
  containers:
    - { name: app, image: "ghcr.io/koorikla/hello-world:d04ca59@sha256:068979444334cb0dc031d9a286dcd7daed372572a5354135d19e8a471fcb2ec1" }
  initContainers:
    # Signed by koorikla/ci's own pipeline (githubWorkflowRepository koorikla/ci), not an allowed app repository.
    - { name: init, image: "ghcr.io/koorikla/ci-toolbox:v1@sha256:d9505f97eddefe4989e3b38b289aeccea15b4c35a2de3a479f339431864b6a79" }
