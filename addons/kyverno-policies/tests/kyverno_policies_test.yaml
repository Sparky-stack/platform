    set:
      registry: { host: "harbor.openchoreo.localhost:9443", appsProject: apps }
    asserts:
      - equal: { path: "spec.variables[0].expression", value: '["ghcr.io/koorikla/"]' }

  - it: CloudNativePG (#327) - exactly the pinned operator + imageCatalog images of addons/cloudnative-pg values
    template: templates/image-verification.yaml
