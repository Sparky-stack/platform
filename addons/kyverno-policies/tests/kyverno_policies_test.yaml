    set:
      registry: { type: harbor, host: "harbor.openchoreo.localhost:9443", appsProject: apps }
      imageVerification.platformKey.publicKey: "-----BEGIN PUBLIC KEY-----\nX\n-----END PUBLIC KEY-----\n"
