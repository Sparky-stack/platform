    asserts:
      - equal: { path: spec.matchImageReferences, value: [{ glob: "ghcr.io/koorikla/*" }] }
      - lengthEqual: { path: spec.attestors, count: 1 }
      - lengthEqual: { path: spec.validations, count: 1 }
      - notMatchRegex: { path: "spec.validations[0].expression", pattern: platform-key }

  - it: a platform-key attestation requirement adds the platform source to that attestation's policy only
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-attest-vuln-enforce }
    set:
      registry: { host: "harbor.openchoreo.localhost:9443", appsProject: apps }
      imageVerification.platformKey.publicKey: "-----BEGIN PUBLIC KEY-----\nX\n-----END PUBLIC KEY-----\n"
      imageVerification.platformKey.attestations: [vuln]
    asserts:
      - contains: { path: spec.matchImageReferences, content: { glob: "harbor.openchoreo.localhost:9443/apps/*" } }
      - equal: { path: "spec.attestors[1].name", value: platform-key }
      - lengthEqual: { path: spec.validations, count: 2 }
      - equal:
          path: "spec.validations[1].expression"
          value: >-
            variables.images.filter(image, ["harbor.openchoreo.localhost:9443/apps/"].exists(p, image.startsWith(p))).all(image,
            verifyAttestationSignatures(image, attestations["vuln"], [attestors["platform-key"]]) > 0)

  # --- platform key from the cluster (charts/cluster image-verification-crs, #15) ------------------------------------
  - it: registry.type harbor without publicKey trusts the platform registry with the key read from Kyverno's namespace
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
    set:
      registry: { type: harbor, host: "harbor.openchoreo.localhost:9443", appsProject: apps }
    asserts:
      - contains: { path: spec.matchImageReferences, content: { glob: "harbor.openchoreo.localhost:9443/apps/*" } }
      - equal: { path: "spec.attestors[1]", value: { name: platform-key, cosign: { key: { expression: variables.platformPublicKey }, ctlog: { insecureIgnoreTlog: true, insecureIgnoreSCT: true } } } }
      - equal:
          path: "spec.variables[0]"
          value: { name: platformPublicKey, expression: 'resource.Get("v1", "configmaps", "kyverno", "platform-image-verification").data["cosign.pub"]' }
      - equal: { path: spec.credentials, value: { secrets: [platform-registry] } }

  - it: the cluster key also trusts the registry prefix (trusted-registries)
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-trusted-registries-enforce }
    set:
      registry: { type: harbor, host: "harbor.openchoreo.localhost:9443", appsProject: apps }
    asserts:
      - equal: { path: "spec.variables[0].expression", value: '["ghcr.io/koorikla/","harbor.openchoreo.localhost:9443/apps/"]' }

  - it: by default the platform source requires its signed SBOM (SPDX 2.3) and vuln attestations, not provenance
    template: templates/image-verification.yaml
    set:
      registry: { type: harbor, host: "harbor.openchoreo.localhost:9443", appsProject: apps }
    asserts:
      - contains: { path: spec.matchImageReferences, content: { glob: "harbor.openchoreo.localhost:9443/apps/*" } }
        documentSelector: { path: metadata.name, value: openchoreo-attest-sbom-enforce }
      - equal: { path: "spec.attestations[0].intoto.type", value: "https://spdx.dev/Document/v2.3" }
        documentSelector: { path: metadata.name, value: openchoreo-attest-sbom-enforce }
      - contains: { path: spec.matchImageReferences, content: { glob: "harbor.openchoreo.localhost:9443/apps/*" } }
        documentSelector: { path: metadata.name, value: openchoreo-attest-vuln-enforce }
      - equal: { path: spec.matchImageReferences, value: [{ glob: "ghcr.io/koorikla/*" }] }
        documentSelector: { path: metadata.name, value: openchoreo-attest-provenance-enforce }
      - notExists: { path: spec.credentials }
        documentSelector: { path: metadata.name, value: openchoreo-attest-provenance-enforce }

  - it: an inline publicKey wins over the cluster key (no resource lookup, no pull secret)
    template: templates/image-verification.yaml
