suite: kyverno-policies - PSS baseline (Audit) + Istio ambient enrollment of OpenChoreo cell namespaces
release:
  name: kyverno-policies
  namespace: kyverno
tests:
  - it: ships the PSS baseline as Audit-only ValidatingPolicies that skip platform namespaces
    template: charts/kyverno-policies/templates/baseline/disallow-privileged-containers.cel.yaml
    asserts:
      - isKind: { of: ValidatingPolicy }
      - equal: { path: spec.validationActions, value: [Audit] }
      - equal: { path: spec.failurePolicy, value: Ignore }
      - matchRegex: { path: "spec.matchConditions[0].expression", pattern: "'argocd'.*'openchoreo-data-plane'.*'istio-system'" }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-options"]', value: SkipDryRunOnMissingResource=true }

  - it: labels OpenChoreo cell namespaces with istio.io/dataplane-mode=ambient (admission + existing)
    template: templates/ambient-enrollment.yaml
    documentSelector: { path: kind, value: MutatingPolicy }
    asserts:
      - equal: { path: spec.failurePolicy, value: Ignore }
      - equal: { path: spec.evaluation.mutateExisting.enabled, value: true }
      - equal: { path: "spec.matchConstraints.resourceRules[0].resources", value: [namespaces] }
      - equal:
          path: spec.matchConstraints.objectSelector
          value:
            matchLabels: { openchoreo.dev/managed-by: renderedrelease-controller }
            matchExpressions:
              - { key: openchoreo.dev/project, operator: Exists }
              - { key: openchoreo.dev/environment, operator: Exists }
              - { key: istio.io/dataplane-mode, operator: DoesNotExist }
      - matchRegex: { path: "spec.matchConditions[0].expression", pattern: '"kgateway-system","istio-system"' }
      - matchRegex: { path: "spec.mutations[0].applyConfiguration.expression", pattern: '"istio.io/dataplane-mode": "ambient"' }

  - it: lets Kyverno's background controller update namespaces (mutateExisting)
    template: templates/ambient-enrollment.yaml
    documentSelector: { path: kind, value: ClusterRole }
    asserts:
      - equal: { path: 'metadata.labels["rbac.kyverno.io/aggregate-to-background-controller"]', value: "true" }
      - contains: { path: rules, content: { apiGroups: [""], resources: [namespaces], verbs: [get, list, watch, update, patch] } }

  - it: renders no enrollment on mgmt (values/role-mgmt.yaml)
    template: templates/ambient-enrollment.yaml
    values: [../values/role-mgmt.yaml]
    asserts:
      - hasDocuments: { count: 0 }

  - it: "cell mesh (#53): HBONE NetworkPolicy into ambient cells, peers = OpenChoreo's (same namespace, system components)"
    template: templates/cell-mesh.yaml
    documentSelector: { path: metadata.name, value: openchoreo-cell-hbone }
    asserts:
      - isKind: { of: GeneratingPolicy }
      - equal: { path: spec.evaluation, value: { synchronize: { enabled: true }, generateExisting: { enabled: true } } }
      - contains:
          path: spec.matchConstraints.objectSelector.matchExpressions
          content: { key: istio.io/dataplane-mode, operator: NotIn, values: [none] }
      - equal: { path: 'spec.matchConstraints.objectSelector.matchLabels["openchoreo.dev/managed-by"]', value: renderedrelease-controller }
      - matchRegex: { path: "spec.matchConditions[0].expression", pattern: '"kgateway-system","istio-system"' }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: 'kind: NetworkPolicy\n' }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: '\{ port: 15008, protocol: TCP \}' }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: 'key: openchoreo.dev/system-component, operator: Exists' }
      # kubelet probes: ambient SNATs them to 169.254.7.127 (IPv6 fd16:...), a separate rule after the HBONE one
      - matchRegex:
          path: "spec.generate[0].template.value"
          pattern: 'port: 15008, protocol: TCP \}\n(?:\s*#.*\n)*\s*- from:\n\s*- ipBlock: \{ cidr: 169\.254\.7\.127/32 \}\n\s*- ipBlock: \{ cidr: "fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128" \}\n$'
      # never 15008 from an ipBlock: that would let any mesh pod (another cell) past OpenChoreo's isolation
      - notMatchRegex: { path: "spec.generate[0].template.value", pattern: 'ipBlock[\s\S]*port: 15008' }

  - it: "cell mesh (#53): STRICT PeerAuthentication in ambient cells, PERMISSIVE when opted out (platform.koorikla.io/mtls=permissive)"
    template: templates/cell-mesh.yaml
    documentSelector: { path: metadata.name, value: openchoreo-cell-mtls }
    asserts:
      - isKind: { of: GeneratingPolicy }
      - equal: { path: spec.evaluation.synchronize.enabled, value: true }
      - contains:
          path: spec.matchConstraints.objectSelector.matchExpressions
          content: { key: istio.io/dataplane-mode, operator: NotIn, values: [none] }
      # the opt-out is the generated mode, never the selector: Kyverno keeps a synchronized object whose trigger stops
      # matching, so an opted-out cell would stay STRICT (seen live on dev1)
      - notContains:
          path: spec.matchConstraints.objectSelector.matchExpressions
          content: { key: platform.koorikla.io/mtls, operator: NotIn, values: [permissive] }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: 'kind: PeerAuthentication\n' }
      # quoted: an unquoted (( a ? b : c )) is a YAML mapping and the policy fails to compile
      - matchRegex:
          path: "spec.generate[0].template.value"
          pattern: "mode: \"\\(\\( object.metadata.\\?labels\\[\\?'platform.koorikla.io/mtls'\\].orValue\\(''\\) == 'permissive' \\? 'PERMISSIVE' : 'STRICT' \\)\\)\""

  - it: "cell mesh (#324): AuthorizationPolicy in ambient cells admits the cell itself and platformPeers only, allow-all when opted out"
    template: templates/cell-mesh.yaml
    documentSelector: { path: metadata.name, value: openchoreo-cell-authz }
    asserts:
      - isKind: { of: GeneratingPolicy }
      - equal: { path: spec.evaluation, value: { synchronize: { enabled: true }, generateExisting: { enabled: true } } }
      - contains:
          path: spec.matchConstraints.objectSelector.matchExpressions
          content: { key: istio.io/dataplane-mode, operator: NotIn, values: [none] }
      - matchRegex: { path: "spec.matchConditions[0].expression", pattern: '"kgateway-system","istio-system"' }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: 'kind: AuthorizationPolicy\n' }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: 'action: ALLOW\n' }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: "'permissive' \\? \\[\\{\\}\\] :" }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: "\\{'namespaces': \\[object.metadata.name\\]\\}" }
      - matchRegex: { path: "spec.generate[0].template.value", pattern: '"cluster.local/ns/telemetry/sa/openchoreo-prometheus-agent"' }
      # never a wildcard principal or namespace: "*" is any mesh identity, i.e. back to STRICT-only
      - notMatchRegex: { path: "spec.generate[0].template.value", pattern: '"\*"|/\*"' }

  - it: "cell mesh (#53, #324): Kyverno's background controller may manage the generated kinds, RBAC a wave before the policies"
    template: templates/cell-mesh.yaml
    documentSelector: { path: kind, value: ClusterRole }
    asserts:
      - equal: { path: 'metadata.labels["rbac.kyverno.io/aggregate-to-background-controller"]', value: "true" }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "-1" }
      - contains: { path: rules, content: { apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [get, list, watch, create, update, patch, delete] } }
      - contains: { path: rules, content: { apiGroups: [security.istio.io], resources: [peerauthentications, authorizationpolicies], verbs: [get, list, watch, create, update, patch, delete] } }

  - it: "cell mesh: mtls.strict false keeps the HBONE policy, drops STRICT and the AuthorizationPolicy (plaintext has no identity)"
    template: templates/cell-mesh.yaml
    set: { ambientEnrollment.mtls.strict: false }
    asserts:
      - hasDocuments: { count: 2 }
      - notContains: { path: rules, content: { apiGroups: [security.istio.io], resources: [peerauthentications, authorizationpolicies], verbs: [get, list, watch, create, update, patch, delete] } }
        documentSelector: { path: kind, value: ClusterRole }

  - it: "cell mesh: nothing on mgmt (values/role-mgmt.yaml)"
    template: templates/cell-mesh.yaml
    values: [../values/role-mgmt.yaml]
    asserts:
      - hasDocuments: { count: 0 }

  - it: verifies images per environment - Audit everywhere but production (defaultAction), Deny (fail closed, digest) in production
    template: templates/image-verification.yaml
    asserts:
      # per action: signature + sbom/provenance/vuln attestation ImageValidatingPolicies + the trusted-registries policy
      - hasDocuments: { count: 10 }
      - equal: { path: metadata.name, value: openchoreo-verify-images-audit }
        documentIndex: 0
      - equal: { path: spec.validationActions, value: [Audit] }
        documentIndex: 0
      - equal: { path: spec.failurePolicy, value: Ignore }
        documentIndex: 0
      - equal: { path: spec.validationConfigurations.verifyDigest, value: false }
        documentIndex: 0
      - equal:
          path: spec.matchConstraints.namespaceSelector
          value:
            matchLabels: { openchoreo.dev/managed-by: renderedrelease-controller }
            matchExpressions: [{ key: openchoreo.dev/environment, operator: NotIn, values: [production] }]
        documentIndex: 0
      - equal: { path: "spec.matchConstraints.resourceRules[0].resources", value: [pods, pods/ephemeralcontainers] }
        documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
      - equal: { path: "spec.matchConstraints.resourceRules[0].resources", value: [pods, pods/ephemeralcontainers] }
        documentSelector: { path: metadata.name, value: openchoreo-trusted-registries-enforce }
      - matchRegex: { path: "spec.matchConditions[0].expression", pattern: "^!\\(request\\.namespace in " }
        documentSelector: { path: metadata.name, value: openchoreo-trusted-registries-enforce }
      - equal: { path: spec.validationActions, value: [Deny] }
        documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
      - equal: { path: spec.failurePolicy, value: Fail }
        documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
      - equal: { path: spec.validationConfigurations.verifyDigest, value: true }
        documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
      - equal: { path: spec.validationConfigurations.mutateDigest, value: false }
        documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
      - equal: { path: "spec.matchConstraints.namespaceSelector.matchExpressions[0].values", value: [production] }
        documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
      - isKind: { of: ValidatingPolicy }
        documentSelector: { path: metadata.name, value: openchoreo-trusted-registries-enforce }

  - it: "one ImageValidatingPolicy per check (#136): the API server calls their webhooks in parallel"
    template: templates/image-verification.yaml
    documentSelector: { path: kind, value: ImageValidatingPolicy, matchMany: true }
    asserts:
      - matchRegex: { path: metadata.name, pattern: '^openchoreo-(verify-images|attest-(sbom|provenance|vuln))-(audit|enforce)$' }
      # one check per policy: a policy with several validations runs them one after the other (~5 s each, cold)
      - lengthEqual: { path: spec.validations, count: 1 }
      - equal: { path: spec.webhookConfiguration.timeoutSeconds, value: 30 }
      - equal: { path: spec.validationConfigurations.required, value: true }

  - it: production attestation policies enforce like the signature policy (Deny, fail closed, digest, same scope)
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-attest-provenance-enforce }
    asserts:
      - equal: { path: spec.validationActions, value: [Deny] }
      - equal: { path: spec.failurePolicy, value: Fail }
      - equal: { path: spec.validationConfigurations.verifyDigest, value: true }
      - equal: { path: "spec.matchConstraints.namespaceSelector.matchExpressions[0].values", value: [production] }
      - equal: { path: spec.matchImageReferences, value: [{ glob: "ghcr.io/koorikla/*" }] }
      - equal: { path: spec.attestations, value: [{ name: provenance, intoto: { type: "https://slsa.dev/provenance/v1" } }] }
      - equal:
          path: "spec.validations[0].expression"
          value: >-
            variables.images.filter(image, ["ghcr.io/koorikla/"].exists(p, image.startsWith(p))).all(image,
            verifyAttestationSignatures(image, attestations["provenance"], [attestors["gh-koorikla-hello-world-heads-main"]]) > 0)
      - matchRegex: { path: "spec.validations[0].message", pattern: 'has no provenance attestation \(https://slsa.dev/provenance/v1\) signed by gh-koorikla-hello-world-heads-main$' }

  - it: the signature policy verifies only the signature (attestations are their own policies)
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
    asserts:
      - notExists: { path: spec.attestations }
      - equal:
          path: "spec.validations[0].expression"
          value: >-
            variables.images.filter(image, ["ghcr.io/koorikla/"].exists(p, image.startsWith(p))).all(image,
            verifyImageSignatures(image, [attestors["gh-koorikla-hello-world-heads-main"]]) > 0)

  - it: every required attestation gets its own production policy
    template: templates/image-verification.yaml
    asserts:
      - containsDocument: { kind: ImageValidatingPolicy, apiVersion: policies.kyverno.io/v1, name: openchoreo-attest-sbom-enforce, any: true }
      - containsDocument: { kind: ImageValidatingPolicy, apiVersion: policies.kyverno.io/v1, name: openchoreo-attest-provenance-enforce, any: true }
      - containsDocument: { kind: ImageValidatingPolicy, apiVersion: policies.kyverno.io/v1, name: openchoreo-attest-vuln-enforce, any: true }
      - containsDocument: { kind: ImageValidatingPolicy, apiVersion: policies.kyverno.io/v1, name: openchoreo-attest-sbom-audit, any: true }

  - it: no attestation required, no attestation policy
    template: templates/image-verification.yaml
    set:
      imageVerification.github.attestations: []
    asserts:
      - hasDocuments: { count: 4 }

  - it: "a policy name over 40 characters is refused (webhook label svc-ignore-finegrained-<policy> <= 63)"
    template: templates/image-verification.yaml
    set:
      imageVerification.attestationTypes.supercalifragilistic: https://example.com/predicate/v1
      imageVerification.github.attestations: [supercalifragilistic]
    asserts:
      - failedTemplate:
          errorPattern: 'policy name "openchoreo-attest-supercalifragilistic-audit" is longer than 40 characters'

  - it: pins the reusable workflow identity AND the calling repository/ref (koorikla/platform is public)
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-attest-sbom-enforce }
    asserts:
      - equal:
          path: spec.attestors[0].cosign.keyless
          value:
            identities:
              - issuer: https://token.actions.githubusercontent.com
                subject: https://github.com/koorikla/platform/.github/workflows/app-container.yaml@3311f541a8eab72a2649b6f1eda4fe05efa3142e
            additionalExtensions:
              githubWorkflowRepository: koorikla/hello-world
              githubWorkflowRef: refs/heads/main
              githubWorkflowTrigger: push
      - contains: { path: spec.attestations, content: { name: sbom, intoto: { type: "https://spdx.dev/Document/v2.3" } } }
      - matchRegex: { path: "spec.validations[0].expression", pattern: 'verifyAttestationSignatures\(image, attestations\["sbom"\]' }
      - matchRegex: { path: "spec.validations[0].expression", pattern: '^variables\.images\.filter\(' }
      - matchRegex: { path: "spec.variables[0].expression", pattern: 'images\.initContainers.*images\.ephemeralContainers' }

  - it: the trusted reusable workflow is pinned by commit SHA (subject = workflow@sha)
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
    set:
      imageVerification.github.workflowRef: 0123456789abcdef0123456789abcdef01234567
      imageVerification.github.transitionWorkflowRefs: []
    asserts:
      - lengthEqual: { path: "spec.attestors[0].cosign.keyless.identities", count: 1 }
      - equal:
          path: spec.attestors[0].cosign.keyless.identities[0].subject
          value: https://github.com/koorikla/platform/.github/workflows/app-container.yaml@0123456789abcdef0123456789abcdef01234567

  - it: "during a pin move the previous commit stays trusted through its own attestors, tried after every current one (#136)"
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
    set:
      imageVerification.github.workflowRef: 0123456789abcdef0123456789abcdef01234567
      imageVerification.github.transitionWorkflowRefs: [fedcba9876543210fedcba9876543210fedcba98]
      imageVerification.github.repositories: [koorikla/hello-world, koorikla/other]
    asserts:
      - lengthEqual: { path: spec.attestors, count: 4 }
      - equal: { path: "spec.attestors[0].name", value: gh-koorikla-hello-world-heads-main }
      - equal: { path: "spec.attestors[1].name", value: gh-koorikla-other-heads-main }
      - equal: { path: "spec.attestors[2].name", value: gh-koorikla-hello-world-heads-main-fedcba9 }
      - equal: { path: "spec.attestors[3].name", value: gh-koorikla-other-heads-main-fedcba9 }
      - equal:
          path: spec.attestors[2].cosign.keyless
          value:
            identities:
              - issuer: https://token.actions.githubusercontent.com
                subject: https://github.com/koorikla/platform/.github/workflows/app-container.yaml@fedcba9876543210fedcba9876543210fedcba98
            additionalExtensions:
              githubWorkflowRepository: koorikla/hello-world
              githubWorkflowRef: refs/heads/main
              githubWorkflowTrigger: push
      - equal:
          path: "spec.attestors[1].cosign.keyless.identities[0].subject"
          value: https://github.com/koorikla/platform/.github/workflows/app-container.yaml@0123456789abcdef0123456789abcdef01234567
      # one attestor per call, ||-chained in that order: CEL stops at the first that verifies and Kyverno caches a
      # single-attestor success (a list call is cached only when EVERY attestor verifies, i.e. never during a move)
      - equal:
          path: "spec.validations[0].expression"
          value: >-
            variables.images.filter(image, ["ghcr.io/koorikla/"].exists(p, image.startsWith(p))).all(image,
            verifyImageSignatures(image, [attestors["gh-koorikla-hello-world-heads-main"]]) > 0 ||
            verifyImageSignatures(image, [attestors["gh-koorikla-other-heads-main"]]) > 0 ||
            verifyImageSignatures(image, [attestors["gh-koorikla-hello-world-heads-main-fedcba9"]]) > 0 ||
            verifyImageSignatures(image, [attestors["gh-koorikla-other-heads-main-fedcba9"]]) > 0)
      - notMatchRegex: { path: "spec.validations[0].expression", pattern: '\[attestors\[[^]]*\], attestors' }

  - it: attestation checks chain the attestors the same way (current pin first)
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-attest-vuln-enforce }
    set:
      imageVerification.github.workflowRef: 0123456789abcdef0123456789abcdef01234567
      imageVerification.github.transitionWorkflowRefs: [fedcba9876543210fedcba9876543210fedcba98]
    asserts:
      - equal:
          path: "spec.validations[0].expression"
          value: >-
            variables.images.filter(image, ["ghcr.io/koorikla/"].exists(p, image.startsWith(p))).all(image,
            verifyAttestationSignatures(image, attestations["vuln"], [attestors["gh-koorikla-hello-world-heads-main"]]) > 0 ||
            verifyAttestationSignatures(image, attestations["vuln"], [attestors["gh-koorikla-hello-world-heads-main-fedcba9"]]) > 0)

  - it: Kyverno verifies one identity per attestor (multiple identities are unsupported)
    template: templates/image-verification.yaml
    documentSelector: { path: kind, value: ImageValidatingPolicy, matchMany: true }
    asserts:
      - notExists: { path: "spec.attestors[0].cosign.keyless.identities[1]" }

  - it: a transition entry that is not a full commit SHA is refused
    template: templates/validate.yaml
    set:
      imageVerification.github.transitionWorkflowRefs: [v1]
    asserts:
      - failedTemplate:
          errorMessage: 'imageVerification.github.workflowRef "v1" must be a 40-hex commit SHA of https://github.com/koorikla/platform/.github/workflows/app-container.yaml (tags and branches are mutable)'

  - it: at most two trusted workflow commits (current + previous)
    template: templates/validate.yaml
    set:
      imageVerification.github.workflowRef: 0123456789abcdef0123456789abcdef01234567
      imageVerification.github.transitionWorkflowRefs:
        - fedcba9876543210fedcba9876543210fedcba98
        - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorMessage: 'imageVerification.github: workflowRef + transitionWorkflowRefs trust 3 workflow commits, at most 2 (the current pin and the previous one while app repos move)'

  - it: a transition entry repeating workflowRef is refused
    template: templates/validate.yaml
    set:
      imageVerification.github.workflowRef: 0123456789abcdef0123456789abcdef01234567
      imageVerification.github.transitionWorkflowRefs: [0123456789abcdef0123456789abcdef01234567]
    asserts:
      - failedTemplate:
          errorPattern: 'transitionWorkflowRefs must not repeat workflowRef'

  - it: a mutable workflow ref (tag) is refused
    template: templates/validate.yaml
    set:
      imageVerification.github.workflowRef: refs/tags/v1
    asserts:
      - failedTemplate:
          errorMessage: 'imageVerification.github.workflowRef "refs/tags/v1" must be a 40-hex commit SHA of https://github.com/koorikla/platform/.github/workflows/app-container.yaml (tags and branches are mutable)'

  - it: a short tag or abbreviated SHA is refused
    template: templates/validate.yaml
    set:
      imageVerification.github.workflowRef: de39b1d
    asserts:
      - failedTemplate:
          errorMessage: 'imageVerification.github.workflowRef "de39b1d" must be a 40-hex commit SHA of https://github.com/koorikla/platform/.github/workflows/app-container.yaml (tags and branches are mutable)'

  - it: a ref smuggled into the workflow URL is refused
    template: templates/image-verification.yaml
    set:
      imageVerification.github.workflow: https://github.com/koorikla/platform/.github/workflows/app-container.yaml@refs/heads/main
    asserts:
      - failedTemplate:
          errorPattern: "/imageVerification/github/workflow': '.*@refs/heads/main' does not match pattern"

  - it: without the GitHub source no workflow pin is required
    template: templates/image-verification.yaml
    set:
      imageVerification.github.enabled: false
      imageVerification.github.workflowRef: ""
      registry: { host: "harbor.openchoreo.localhost:9443", appsProject: apps }
      imageVerification.platformKey.publicKey: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEexample
        -----END PUBLIC KEY-----
    asserts:
      - notFailedTemplate: {}

  - it: one attestor per allowed (repository, ref); the platform key only when a public key is set
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
    set:
      registry: { host: "harbor.openchoreo.localhost:9443", appsProject: apps }
      imageVerification.github.repositories: [koorikla/hello-world, koorikla/other]
      imageVerification.github.refs: [refs/heads/main, refs/tags/v1]
      imageVerification.github.transitionWorkflowRefs: []
      imageVerification.platformKey.publicKey: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEexample
        -----END PUBLIC KEY-----
    asserts:
      - lengthEqual: { path: spec.attestors, count: 5 }
      - equal: { path: "spec.attestors[3].name", value: gh-koorikla-other-tags-v1 }
      - equal: { path: "spec.attestors[4].name", value: platform-key }
      - equal: { path: "spec.attestors[4].cosign.ctlog", value: { insecureIgnoreTlog: true, insecureIgnoreSCT: true } }
      - contains: { path: spec.matchImageReferences, content: { glob: "harbor.openchoreo.localhost:9443/apps/*" } }
      - lengthEqual: { path: spec.matchImageReferences, count: 2 }

  - it: one attestor per trigger when several triggers are allowed
    template: templates/image-verification.yaml
    documentSelector: { path: metadata.name, value: openchoreo-verify-images-enforce }
    set:
      imageVerification.github.triggers: [push, workflow_dispatch]
      imageVerification.github.transitionWorkflowRefs: []
    asserts:
      - lengthEqual: { path: spec.attestors, count: 2 }
      - equal: { path: "spec.attestors[1].name", value: gh-koorikla-hello-world-heads-main-workflow-dispatch }
      - equal: { path: "spec.attestors[1].cosign.keyless.additionalExtensions.githubWorkflowTrigger", value: workflow_dispatch }

  - it: the platform registry is NOT trusted without a public key (unsigned in-cluster images are denied in production)
    template: templates/image-verification.yaml
