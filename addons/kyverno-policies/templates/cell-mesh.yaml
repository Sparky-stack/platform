{{- /*
Mesh policy of ambient-enrolled cell namespaces (docs/networking.md "Strict mTLS in cell namespaces"). Generated
and kept in sync (generateExisting) in every enrolled cell; cells with istio.io/dataplane-mode=none get none of them:
  GeneratingPolicy openchoreo-cell-hbone    NetworkPolicy platform-mesh-hbone: HBONE 15008 from OpenChoreo's peers,
                                            plus kubelet probes after istio-cni's SNAT
  GeneratingPolicy openchoreo-cell-strimzi  NetworkPolicy platform-strimzi: Kafka pods admit the cell, system
                                            components and strimzi.peers on any port (#210)
  GeneratingPolicy openchoreo-cell-mtls     PeerAuthentication default: STRICT, PERMISSIVE with <mtls.optOutLabel>
  GeneratingPolicy openchoreo-cell-authz    AuthorizationPolicy platform-cell-peers: only the cell's own workloads and
                                            mtls.platformPeers (#324)
The opt-out switches content, never the selector: Kyverno keeps a synchronized object whose trigger stops matching.
*/ -}}
{{- $ae := .Values.ambientEnrollment }}
{{- if $ae.enabled }}
{{- $cells := dict "sel" $ae.cellNamespaceSelector "mode" "{ key: istio.io/dataplane-mode, operator: NotIn, values: [none] }" }}
{{- $specCtx := dict "root" . "cells" $cells }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openchoreo-cell-hbone
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: HBONE into ambient OpenChoreo cells
    policies.kyverno.io/description: >-
      NetworkPolicy platform-mesh-hbone in every ambient-enrolled cell namespace: Istio HBONE (tcp 15008) to component
      pods from the peers OpenChoreo's per-component NetworkPolicy admits (same namespace, platform system components),
      and kubelet probes from ambient's link-local SNAT source 169.254.7.127.
spec:
  {{- include "kp.cellMeshSpec" $specCtx | nindent 2 }}
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: platform-mesh-hbone
            namespace: (( object.metadata.name ))
            labels: { app.kubernetes.io/managed-by: kyverno }
          spec:
            podSelector:
              matchExpressions:
                - { key: openchoreo.dev/component, operator: Exists }
            policyTypes: [Ingress]
            ingress:
              - from:
                  - podSelector: {}
                  - namespaceSelector: {}
                    podSelector:
                      matchExpressions:
                        - { key: openchoreo.dev/system-component, operator: Exists }
                ports:
                  - { port: 15008, protocol: TCP }
              # Kubelet probes: istio-cni SNATs them to this link-local source on enrolled pods (Istio "Ambient, health
              # probes, and Kubernetes NetworkPolicy"). Cilium sees it as world, not host, so OpenChoreo's policy drops
              # every probe (startup probe kills, CrashLoopBackOff). Any port: probe ports are per component. Nothing
              # else can use the source: it is host-local (never routed) and Cilium refuses spoofed pod sources.
              {{- include "kp.probeIngress" . | nindent 14 }}
{{- if $ae.strimzi.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openchoreo-cell-strimzi
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Kafka (Strimzi) pods in ambient OpenChoreo cells
    policies.kyverno.io/description: >-
      NetworkPolicy platform-strimzi in every ambient-enrolled cell namespace, in place of the per-cluster policies the
      Strimzi operator no longer generates (addon strimzi STRIMZI_NETWORK_POLICY_GENERATION=false, #210): Kafka pods
      admit the cell's own pods and the listed platform peers on any port (HBONE 15008 included), and kubelet probes.
spec:
  {{- include "kp.cellMeshSpec" $specCtx | nindent 2 }}
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: platform-strimzi
            namespace: (( object.metadata.name ))
            labels: { app.kubernetes.io/managed-by: kyverno }
          spec:
            # Every pod the operator creates for a Kafka / KafkaNodePool / KafkaConnect / KafkaMirrorMaker2 (brokers,
            # controllers, entity operator, exporter, Cruise Control, Connect workers) carries strimzi.io/cluster.
            podSelector:
              matchExpressions:
                - { key: strimzi.io/cluster, operator: Exists }
            policyTypes: [Ingress]
            ingress:
              # Peers, not ports: ambient tunnels every mesh connection to the pod's 15008, so the CNI sees no Kafka
              # port, and ztunnel's platform-cell-peers decides the identity. No port list: 15008, plus the listener
              # ports for a client outside the tunnel (pod opted out, permissive cell).
              - from:
                  - podSelector: {}
                  - namespaceSelector: {}
                    podSelector:
                      matchExpressions:
                        - { key: openchoreo.dev/system-component, operator: Exists }
                  {{- range $ae.strimzi.peers }}
                  - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .namespace }} } }
                    podSelector: { matchLabels: {{ .podLabels | toJson }} }
                  {{- end }}
              # Kubelet probes after istio-cni's SNAT (see platform-mesh-hbone above).
              {{- include "kp.probeIngress" . | nindent 14 }}
{{- end }}
{{- if $ae.mtls.strict }}
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openchoreo-cell-mtls
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Strict mTLS in ambient OpenChoreo cells
    policies.kyverno.io/description: >-
      PeerAuthentication default (STRICT) in every ambient-enrolled cell namespace, so ztunnel accepts only mesh mTLS.
      PERMISSIVE in a cell with the namespace label {{ $ae.mtls.optOutLabel }}=permissive.
spec:
  {{- include "kp.cellMeshSpec" $specCtx | nindent 2 }}
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: security.istio.io/v1
          kind: PeerAuthentication
          metadata:
            name: default
            namespace: (( object.metadata.name ))
            labels: { app.kubernetes.io/managed-by: kyverno }
          spec:
            mtls:
              mode: "(( object.metadata.?labels[?'{{ $ae.mtls.optOutLabel }}'].orValue('') == 'permissive' ? 'PERMISSIVE' : 'STRICT' ))"
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openchoreo-cell-authz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Only known mesh identities into ambient OpenChoreo cells
    policies.kyverno.io/description: >-
      AuthorizationPolicy platform-cell-peers in every ambient-enrolled cell namespace: ztunnel admits only the cell's
      own workloads and the listed platform identities (gateway, telemetry agent, data-service operators), so a
      workload of another cell is refused. Allows everything in a cell with {{ $ae.mtls.optOutLabel }}=permissive.
spec:
  {{- include "kp.cellMeshSpec" $specCtx | nindent 2 }}
  generate:
    - template:
        interpolate: cel
        # rules is one CEL value (a list): a permissive cell gets [{}] (allow all: plaintext carries no identity),
        # every other cell two rules - its own namespace, then the platform peers (a JSON list is a CEL list).
        # Like the PeerAuthentication mode, the opt-out switches the content, never the selector (Kyverno keeps a
        # synchronized object whose trigger stops matching).
        value: |
          apiVersion: security.istio.io/v1
          kind: AuthorizationPolicy
          metadata:
            name: platform-cell-peers
            namespace: (( object.metadata.name ))
            labels: { app.kubernetes.io/managed-by: kyverno }
          spec:
            action: ALLOW
            rules: >-
              (( object.metadata.?labels[?'{{ $ae.mtls.optOutLabel }}'].orValue('') == 'permissive' ? [{}] : [
              {'from': [{'source': {'namespaces': [object.metadata.name]}}]},
              {'from': [{'source': {'principals': {{ $ae.mtls.platformPeers | toJson }}}}]} ] ))
{{- end }}
---
# Kyverno's background controller creates, updates and deletes the generated objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:cell-mesh
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
  annotations:
    # Before the GeneratingPolicies (wave 0): Kyverno checks RBACPermissionsGranted only when a policy changes, so a
    # policy that raced its RBAC stays not-Ready (#337).
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- if $ae.mtls.strict }}
  - apiGroups: [security.istio.io]
    resources: [peerauthentications, authorizationpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- end }}
{{- end }}
