{{- /*
Mesh policy of ambient-enrolled OpenChoreo cell namespaces (docs/networking.md "Strict mTLS in cell namespaces", #53).
The data-plane gateway is in the mesh (addon openchoreo-data-plane: gateway pod label istio.io/dataplane-mode=ambient),
so ingress reaches component pods as HBONE mTLS, and cells can refuse plaintext.

  GeneratingPolicy openchoreo-cell-hbone    NetworkPolicy platform-mesh-hbone in every enrolled cell: HBONE (tcp 15008)
                                            to component pods from the same peers OpenChoreo's per-component policy
                                            admits (same namespace, openchoreo.dev/system-component pods). Ambient
                                            tunnels every mesh connection to the destination pod's 15008, and
                                            OpenChoreo's policy only opens the endpoint ports, so without this the
                                            gateway (and pod-to-pod traffic within a cell) is dropped by the CNI.
                                            Peers, not ports: inside the tunnel the endpoint port is no longer checked
                                            by the CNI, the peer set stays the same (staging never reaches production).
                                            Plus kubelet probes, which ambient SNATs to 169.254.7.127 (IPv6
                                            fd16:9254:7127:1337:ffff:ffff:ffff:ffff): without it they are dropped too.
  GeneratingPolicy openchoreo-cell-mtls     PeerAuthentication `default` in every enrolled cell: mtls STRICT, so ztunnel
                                            rejects plaintext from clients outside the mesh (kubelet probes are exempt);
                                            PERMISSIVE while the namespace carries <mtls.optOutLabel>=permissive (set per
                                            environment through ProjectReleaseBinding namespaceLabels). The opt-out is a
                                            mode, not a selector: Kyverno never deletes a synchronized object when its
                                            trigger stops matching, but it does re-render it on every trigger update.
  GeneratingPolicy openchoreo-cell-authz    AuthorizationPolicy platform-cell-peers in every enrolled cell (#324): STRICT
                                            proves the caller is *a* mesh workload, this decides *which*. ALLOW (so
                                            deny-by-default for every pod in the cell, databases included) only for the
                                            cell's own workloads (source namespace == the cell) and the platform identities
                                            in <mtls.platformPeers> (gateway, telemetry agent, data-service operators).
                                            A workload of another cell, same cluster or another mesh member, is refused by
                                            ztunnel. Opted-out (permissive) cells allow everything: plaintext has no
                                            identity to check. Kubelet probes bypass ztunnel, so no rule needed for them.
All: kept in sync (an edited or deleted object is restored), existing cells included (generateExisting). Cells
created with istio.io/dataplane-mode=none get none of them.
*/ -}}
{{- $ae := .Values.ambientEnrollment }}
{{- if $ae.enabled }}
{{- $cells := dict "sel" $ae.cellNamespaceSelector "mode" "{ key: istio.io/dataplane-mode, operator: NotIn, values: [none] }" }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openchoreo-cell-hbone
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: HBONE into ambient OpenChoreo cells
    policies.kyverno.io/description: >-
      NetworkPolicy platform-mesh-hbone in every ambient-enrolled cell namespace: Istio HBONE (tcp 15008) to component
      pods from the peers OpenChoreo's per-component NetworkPolicy admits (same namespace, platform system components),
      and kubelet probes from ambient's link-local SNAT source 169.254.7.127.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
    {{- include "kp.cellObjectSelector" $cells | nindent 4 }}
  matchConditions:
    - name: never-platform-namespaces
      expression: '!(object.metadata.name in {{ .Values.platformNamespaces | toJson }})'
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: platform-mesh-hbone
            namespace: (( object.metadata.name ))
            labels: { app.kubernetes.io/managed-by: kyverno }
          spec:
            podSelector:
              matchExpressions:
                - { key: openchoreo.dev/component, operator: Exists }
            policyTypes: [Ingress]
            ingress:
              - from:
                  - podSelector: {}
                  - namespaceSelector: {}
                    podSelector:
                      matchExpressions:
                        - { key: openchoreo.dev/system-component, operator: Exists }
                ports:
                  - { port: 15008, protocol: TCP }
              # Kubelet probes: istio-cni SNATs them to this link-local source on enrolled pods (Istio "Ambient, health
              # probes, and Kubernetes NetworkPolicy"). Cilium sees it as world, not host, so OpenChoreo's policy drops
              # every probe (startup probe kills, CrashLoopBackOff). Any port: probe ports are per component. Nothing
              # else can use the source: it is host-local (never routed) and Cilium refuses spoofed pod sources.
              - from:
                {{- range .Values.mesh.probeSourceCIDRs }}
                  - ipBlock: { cidr: {{ if contains ":" . }}{{ . | quote }}{{ else }}{{ . }}{{ end }} }
                {{- end }}
{{- if $ae.mtls.strict }}
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openchoreo-cell-mtls
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Strict mTLS in ambient OpenChoreo cells
    policies.kyverno.io/description: >-
      PeerAuthentication default (STRICT) in every ambient-enrolled cell namespace, so ztunnel accepts only mesh mTLS.
      PERMISSIVE in a cell with the namespace label {{ $ae.mtls.optOutLabel }}=permissive.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
    {{- include "kp.cellObjectSelector" $cells | nindent 4 }}
  matchConditions:
    - name: never-platform-namespaces
      expression: '!(object.metadata.name in {{ .Values.platformNamespaces | toJson }})'
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: security.istio.io/v1
          kind: PeerAuthentication
          metadata:
            name: default
            namespace: (( object.metadata.name ))
            labels: { app.kubernetes.io/managed-by: kyverno }
          spec:
            mtls:
              mode: "(( object.metadata.?labels[?'{{ $ae.mtls.optOutLabel }}'].orValue('') == 'permissive' ? 'PERMISSIVE' : 'STRICT' ))"
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openchoreo-cell-authz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Only known mesh identities into ambient OpenChoreo cells
    policies.kyverno.io/description: >-
      AuthorizationPolicy platform-cell-peers in every ambient-enrolled cell namespace: ztunnel admits only the cell's
      own workloads and the listed platform identities (gateway, telemetry agent, data-service operators), so a
      workload of another cell is refused. Allows everything in a cell with {{ $ae.mtls.optOutLabel }}=permissive.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
    {{- include "kp.cellObjectSelector" $cells | nindent 4 }}
  matchConditions:
    - name: never-platform-namespaces
      expression: '!(object.metadata.name in {{ .Values.platformNamespaces | toJson }})'
  generate:
    - template:
        interpolate: cel
        # rules is one CEL value (a list): a permissive cell gets [{}] (allow all: plaintext carries no identity),
        # every other cell two rules - its own namespace, then the platform peers (a JSON list is a CEL list).
        # Like the PeerAuthentication mode, the opt-out switches the content, never the selector (Kyverno keeps a
        # synchronized object whose trigger stops matching).
        value: |
          apiVersion: security.istio.io/v1
          kind: AuthorizationPolicy
          metadata:
            name: platform-cell-peers
            namespace: (( object.metadata.name ))
            labels: { app.kubernetes.io/managed-by: kyverno }
          spec:
            action: ALLOW
            rules: >-
              (( object.metadata.?labels[?'{{ $ae.mtls.optOutLabel }}'].orValue('') == 'permissive' ? [{}] : [
              {'from': [{'source': {'namespaces': [object.metadata.name]}}]},
              {'from': [{'source': {'principals': {{ $ae.mtls.platformPeers | toJson }}}}]} ] ))
{{- end }}
---
# Kyverno's background controller creates, updates and deletes the generated objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:cell-mesh
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
  annotations:
    # Before the GeneratingPolicies (wave 0): Kyverno checks RBACPermissionsGranted only when a policy changes, so a
    # policy that raced its RBAC stays not-Ready (#337).
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- if $ae.mtls.strict }}
  - apiGroups: [security.istio.io]
    resources: [peerauthentications, authorizationpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- end }}
{{- end }}
