{{- /*
Istio ambient enrollment of cell namespaces (docs/networking.md "Ambient enrollment"). Re-applied on every update so a
re-rendered namespace keeps the label; mutateExisting labels older namespaces. failurePolicy Ignore: ambient enrolls
running pods without restarts, so a Kyverno outage only delays enrollment.
*/ -}}
{{- if .Values.ambientEnrollment.enabled }}
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: openchoreo-ambient-enrollment
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Istio ambient for OpenChoreo cell namespaces
    policies.kyverno.io/description: >-
      Labels the namespaces OpenChoreo creates on data planes with istio.io/dataplane-mode=ambient, unless the label
      is already set. Never touches platform namespaces.
spec:
  failurePolicy: Ignore
  evaluation:
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
    {{- include "kp.cellObjectSelector" (dict "sel" .Values.ambientEnrollment.cellNamespaceSelector "mode" "{ key: istio.io/dataplane-mode, operator: DoesNotExist }") | nindent 4 }}
  matchConditions:
    - name: never-platform-namespaces
      expression: '!(object.metadata.name in {{ .Values.platformNamespaces | toJson }})'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{metadata: Object.metadata{labels: {"istio.io/dataplane-mode": "ambient"}}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:ambient-enrollment
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, update, patch]
{{- end }}
