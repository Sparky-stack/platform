{{- /*
Supply-chain policy gate per environment (docs/promotion.md "Policy gate", docs/supply-chain.md).
For every distinct action (Audit | Deny) in imageVerification.environments and defaultAction one set of policies,
scoped to OpenChoreo cell namespaces by their label openchoreo.dev/environment:
  ImageValidatingPolicy openchoreo-verify-images-<audit|enforce>      per trusted source: cosign signature
  ImageValidatingPolicy openchoreo-attest-<name>-<audit|enforce>      one per required attestation (sbom, provenance,
                                                                      vuln): signed by the source's attestors
  ValidatingPolicy      openchoreo-trusted-registries-<audit|enforce> every image matches a trusted source prefix
One policy per check, not one policy with every check (#136): each keyless verification costs ~5 s (Kyverno 1.20 refreshes
the Sigstore TUF metadata and walks the registry referrers on every call) and validations of one policy run one after
the other, so signature + 3 attestations took ~20 s of the 30 s webhook timeout for an image not yet in Kyverno's
verification cache. Separate policies get separate (fine-grained) webhooks that the API server calls in parallel, and
Kyverno evaluates them concurrently. Verified results are cached per image DIGEST (addons/kyverno, imageVerifyCache*).
The defaultAction policy covers every cell namespace whose environment has no other action (In -> NotIn), so a new
environment is never unchecked. Pods (containers, initContainers, ephemeralContainers) and pods/ephemeralcontainers
(kubectl debug) are matched; controllers through Kyverno autogen.
Platform namespaces: excluded by Kyverno's webhook namespaceSelector (addons/kyverno) and by matchConditions here.
*/ -}}
{{- $iv := .Values.imageVerification }}
{{- if $iv.enabled }}
{{- $byAction := dict }}
{{- range $env, $action := $iv.environments }}
{{- if not (has $action (list "Audit" "Deny")) }}{{ fail (printf "imageVerification.environments.%s: %q is not Audit or Deny" $env $action) }}{{ end }}
{{- $_ := set $byAction $action (append (get $byAction $action | default list) $env) }}
{{- end }}
{{- $default := $iv.defaultAction | default "" }}
{{- if and $default (not (has $default (list "Audit" "Deny"))) }}{{ fail (printf "imageVerification.defaultAction: %q is not Audit, Deny or empty" $default) }}{{ end }}
{{- if and $default (not (hasKey $byAction $default)) }}{{ $_ := set $byAction $default list }}{{ end }}
{{- $platform := .Values.platformNamespaces | toJson }}
{{- /* sources: [{kind: github|platform, prefixes, attestors: [name], attestations: [name]}] */ -}}
{{- $sources := list }}
{{- $keyless := list }}
{{- if $iv.github.enabled }}
{{- /* Keyless identity: the reusable workflow pinned by commit SHA (a tag or branch ref is mutable). workflowRef is the
current pin; transitionWorkflowRefs keeps the previous one trusted while app repos move to the new pin (at most two).
Kyverno 1.20 verifies only ONE identity per attestor ("multiple identities are not supported"), so every trusted commit
renders its own attestors (name suffix -<sha7> for transition commits) and the validations accept any of them. */ -}}
{{- if not (regexMatch "^https://github\\.com/[^/@]+/[^/@]+/\\.github/workflows/[^/@]+\\.ya?ml$" ($iv.github.workflow | default "")) }}{{ fail (printf "imageVerification.github.workflow %q must be https://github.com/<owner>/<repo>/.github/workflows/<file>.yaml without a ref" ($iv.github.workflow | default "")) }}{{ end }}
{{- $wfRefs := list (toString ($iv.github.workflowRef | default "")) }}
{{- range ($iv.github.transitionWorkflowRefs | default list) }}{{ $wfRefs = append $wfRefs (toString .) }}{{ end }}
{{- range $wfRefs }}
{{- if not (regexMatch "^[0-9a-f]{40}$" .) }}{{ fail (printf "imageVerification.github.workflowRef %q must be a 40-hex commit SHA of %s (tags and branches are mutable)" . $iv.github.workflow) }}{{ end }}
{{- end }}
{{- if gt (len $wfRefs) 2 }}{{ fail (printf "imageVerification.github: workflowRef + transitionWorkflowRefs trust %d workflow commits, at most 2 (the current pin and the previous one while app repos move)" (len $wfRefs)) }}{{ end }}
{{- if ne (len $wfRefs) (len (uniq $wfRefs)) }}{{ fail "imageVerification.github.transitionWorkflowRefs must not repeat workflowRef" }}{{ end }}
{{- $triggers := $iv.github.triggers | default list }}
{{- /* Every attestor of the CURRENT pin comes first: validations try the attestors one at a time (CEL ||, the first that
verifies wins) and only a successful single-attestor verification is cached, so images at the current pin cost one
verification per check; only images still at the transition pin pay the failed attempts before theirs. */ -}}
{{- range $i, $wf := $wfRefs }}
{{- range $repo := $iv.github.repositories }}
{{- range $ref := $iv.github.refs }}
{{- range $trigger := $triggers }}
{{- $n := printf "gh-%s-%s" ($repo | replace "/" "-" | replace "." "-" | replace "_" "-" | lower) ($ref | trimPrefix "refs/" | replace "/" "-" | replace "." "-" | replace "_" "-" | lower) }}
{{- if gt (len $triggers) 1 }}{{ $n = printf "%s-%s" $n ($trigger | replace "_" "-" | lower) }}{{ end }}
{{- $name := ternary ($n | trunc 60 | trimSuffix "-") (printf "%s-%s" ($n | trunc 52 | trimSuffix "-") (substr 0 7 $wf)) (eq $i 0) }}
{{- $keyless = append $keyless (dict "name" $name "repo" $repo "ref" $ref "trigger" $trigger "subject" (printf "%s@%s" $iv.github.workflow $wf)) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $keyless }}{{ fail "imageVerification.github: repositories, refs and triggers must not be empty" }}{{ end }}
{{- $names := list }}{{ range $keyless }}{{ $names = append $names .name }}{{ end }}
{{- if ne (len $names) (len (uniq $names)) }}{{ fail (printf "imageVerification.github: attestor names collide after truncation to 60 characters: %s" (join ", " $names)) }}{{ end }}
{{- $sources = append $sources (dict "kind" "github" "prefixes" $iv.github.prefixes "attestors" $names "attestations" ($iv.github.attestations | default list)) }}
{{- end }}
{{- /* Platform key: images the workflow plane pushed to <registry.host>/<registry.appsProject>/ (installation.yaml).
Trusted ONLY with a public key configured: without a key nothing could verify them, so they are not trusted at all and
the trusted-registries policy denies them (enforce) instead of letting them skip signature verification. */ -}}
{{- $reg := .Values.registry | default dict }}
{{- /* Key source: inline publicKey, else (registry.type harbor) the ConfigMap charts/cluster delivers per workload cluster. */ -}}
{{- $pkc := $iv.platformKey.cluster | default dict }}
{{- $clusterKey := and $iv.platformKey.enabled (not $iv.platformKey.publicKey) (eq (toString $reg.type) "harbor") (ne (toString ($pkc.configMap | default "")) "") }}
{{- $platformKey := and $iv.platformKey.enabled (or $iv.platformKey.publicKey $clusterKey) }}
{{- if $clusterKey }}
{{- range $f := list "namespace" "configMap" }}{{ if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" (toString (get $pkc $f))) }}{{ fail (printf "imageVerification.platformKey.cluster.%s %q is not a Kubernetes object name" $f (toString (get $pkc $f))) }}{{ end }}{{ end }}
{{- end }}
{{- $platformPrefixes := list }}
{{- if $platformKey }}
{{- $host := required "imageVerification.platformKey (publicKey or registry.type harbor) is set: installation registry.host is required (image prefix <host>/<appsProject>/)" $reg.host }}
{{- $project := $reg.appsProject | default "apps" }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?(:[0-9]+)?$" $host) }}{{ fail (printf "registry.host %q must be <dns name>[:<port>]" $host) }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9._]*[a-z0-9])?$" $project) }}{{ fail (printf "registry.appsProject %q is not a registry project name" $project) }}{{ end }}
{{- $platformPrefixes = list (printf "%s/%s/" $host $project) }}
{{- $sources = append $sources (dict "kind" "platform" "prefixes" $platformPrefixes "attestors" (list "platform-key") "attestations" ($iv.platformKey.attestations | default list)) }}
{{- end }}
{{- $trusted := $iv.extraTrustedPrefixes | default list }}
{{- if $iv.github.enabled }}{{ $trusted = concat $iv.github.prefixes $trusted }}{{ end }}
{{- $trusted = concat $trusted $platformPrefixes }}
{{- $usedAttestations := list }}
{{- range $sources }}{{ range .attestations }}{{ if not (hasKey $iv.attestationTypes .) }}{{ fail (printf "imageVerification: unknown attestation %q (attestationTypes)" .) }}{{ end }}{{ $usedAttestations = append $usedAttestations . }}{{ end }}{{ end }}
{{- range $action := keys $byAction | sortAlpha }}
{{- $envs := get $byAction $action | sortAlpha }}
{{- $suffix := ternary "enforce" "audit" (eq $action "Deny") }}
{{- $nsSelector := deepCopy $iv.cellNamespaceSelector }}
{{- $scope := join ", " $envs }}
{{- if eq $action $default }}
{{- $others := list }}{{ range $e, $a := $iv.environments }}{{ if ne $a $action }}{{ $others = append $others $e }}{{ end }}{{ end }}
{{- if $others }}
{{- $_ := set $nsSelector "matchExpressions" (append ($nsSelector.matchExpressions | default list) (dict "key" "openchoreo.dev/environment" "operator" "NotIn" "values" ($others | sortAlpha))) }}
{{- $scope = printf "every environment except %s" (join ", " ($others | sortAlpha)) }}
{{- else }}
{{- $scope = "every environment" }}
{{- end }}
{{- else }}
{{- $_ := set $nsSelector "matchExpressions" (append ($nsSelector.matchExpressions | default list) (dict "key" "openchoreo.dev/environment" "operator" "In" "values" $envs)) }}
{{- end }}
{{- if $sources }}
{{- /* checks: the signature policy, then one policy per attestation any source requires */ -}}
{{- $checks := list (dict "name" (printf "openchoreo-verify-images-%s" $suffix) "attestation" "") }}
{{- range $usedAttestations | uniq | sortAlpha }}
{{- $checks = append $checks (dict "name" (printf "openchoreo-attest-%s-%s" . $suffix) "attestation" .) }}
{{- end }}
{{- range $c := $checks }}
{{- /* Kyverno names the policy's webhook ivpol.validate.kyverno.svc-<fail|ignore>-finegrained-<policy>: one DNS label of
at most 63 characters, so at most 40 for the policy name. */ -}}
{{- if gt (len $c.name) 40 }}{{ fail (printf "imageVerification: policy name %q is longer than 40 characters (Kyverno's webhook name label is limited to 63): shorten the attestation name" $c.name) }}{{ end }}
{{- $att := $c.attestation }}
{{- $cs := list }}
{{- range $sources }}{{ if or (not $att) (has $att .attestations) }}{{ $cs = append $cs . }}{{ end }}{{ end }}
{{- $kinds := list }}{{ range $cs }}{{ $kinds = append $kinds .kind }}{{ end }}
---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: {{ $c.name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- if $att }}
    policies.kyverno.io/title: Signed {{ $att }} attestation of images in OpenChoreo {{ $scope }}
    policies.kyverno.io/description: >-
      Images from a trusted source that requires it carry a signed {{ $att }} attestation
      ({{ get $iv.attestationTypes $att }}) from that source's attestors. One policy per check so the checks run in
      parallel (openchoreo-verify-images-{{ $suffix }} verifies the signature). Action {{ $action }} in {{ $scope }}.
    {{- else }}
    policies.kyverno.io/title: Signed images in OpenChoreo {{ $scope }}
    policies.kyverno.io/description: >-
      Images from a trusted source carry that source's cosign signature: keyless from the koorikla/platform app-container.yaml reusable workflow
      for an allowed repository and ref, or the platform key for images the workflow plane built. The required signed
      attestations are checked by openchoreo-attest-*-{{ $suffix }}. Action {{ $action }} in {{ $scope }}.
    {{- end }}
spec:
  validationActions: [{{ $action }}]
  failurePolicy: {{ get $iv.failurePolicy $action | default "Ignore" }}
  webhookConfiguration:
    timeoutSeconds: {{ $iv.timeoutSeconds }}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
    namespaceSelector:
      {{- toYaml $nsSelector | nindent 6 }}
  matchConditions:
    - name: never-platform-namespaces
      expression: '!(request.namespace in {{ $platform }})'
  matchImageReferences:
    {{- range $s := $cs }}
    {{- range $s.prefixes }}
    - glob: {{ printf "%s*" . | quote }}
    {{- end }}
    {{- end }}
  validationConfigurations:
    mutateDigest: false      # OpenChoreo's agent re-applies the rendered Deployment: a digest patch would flap
    verifyDigest: {{ get $iv.requireDigest $action | default false }}
    required: true
  {{- if and (has "platform" $kinds) $clusterKey $pkc.pullSecret }}
  credentials:
    secrets: [{{ $pkc.pullSecret }}]   # in Kyverno's namespace (charts/cluster image-verification-crs): private apps project
  {{- end }}
  attestors:
    {{- if has "github" $kinds }}
    {{- range $keyless }}
    - name: {{ .name }}
      cosign:
        keyless:
          identities:
            - issuer: {{ $iv.github.issuer }}
              subject: {{ .subject }}
          additionalExtensions:
            githubWorkflowRepository: {{ .repo }}
            githubWorkflowRef: {{ .ref }}
            githubWorkflowTrigger: {{ .trigger }}
        ctlog:
          url: {{ $iv.github.rekorURL }}
    {{- end }}
    {{- end }}
    {{- if has "platform" $kinds }}
    - name: platform-key
      cosign:
        key:
          {{- if $iv.platformKey.publicKey }}
          data: |
            {{- $iv.platformKey.publicKey | trim | nindent 12 }}
          {{- else }}
          expression: variables.platformPublicKey
          {{- end }}
        {{- if not $iv.platformKey.rekor }}
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
        {{- end }}
    {{- end }}
  {{- if $att }}
  attestations:
    - name: {{ $att }}
      intoto:
        type: {{ get $iv.attestationTypes $att }}
  {{- end }}
  variables:
    {{- if and (has "platform" $kinds) $clusterKey }}
    # platform signing key delivered by charts/cluster (image-verification-crs) into Kyverno's namespace; read per
    # admission, so a re-bootstrapped mgmt key needs no policy change. Missing ConfigMap -> evaluation error -> fails.
    - name: platformPublicKey
      expression: >-
        resource.Get("v1", "configmaps", {{ $pkc.namespace | quote }}, {{ $pkc.configMap | quote }}).data["cosign.pub"]
    {{- end }}
    - name: images                      # every container kind (init / ephemeral too: explicit messages, not only required)
      expression: >-
        images.containers
        + ("initContainers" in images ? images.initContainers : [])
        + ("ephemeralContainers" in images ? images.ephemeralContainers : [])
  validations:
    {{- range $s := $cs }}
    {{- $match := printf "[%s].exists(p, image.startsWith(p))" (include "kp.quoteList" $s.prefixes) }}
    {{- /* One attestor per call, joined with ||: CEL stops at the first attestor that verifies, and Kyverno caches a
    result only when every attestor of the call verified - a list of several attestors would never be cached and would
    verify all of them on every admission. */ -}}
    {{- $calls := list }}
    {{- range $s.attestors }}
    {{- if $att }}
    {{- $calls = append $calls (printf "verifyAttestationSignatures(image, attestations[\"%s\"], [attestors[\"%s\"]]) > 0" $att .) }}
    {{- else }}
    {{- $calls = append $calls (printf "verifyImageSignatures(image, [attestors[\"%s\"]]) > 0" .) }}
    {{- end }}
    {{- end }}
    - expression: >-
        variables.images.filter(image, {{ $match }}).all(image, {{ join " || " $calls }})
      message: >-
        {{- if $att }}
        image ({{ join ", " $s.prefixes }}) has no {{ $att }} attestation ({{ get $iv.attestationTypes $att }}) signed by {{ join ", " $s.attestors }}
        {{- else }}
        image ({{ join ", " $s.prefixes }}) is not signed by {{ join ", " $s.attestors }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: openchoreo-trusted-registries-{{ $suffix }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Trusted image sources in OpenChoreo {{ $scope }}
    policies.kyverno.io/description: >-
      Every container image in the cell namespaces of {{ $scope }} matches a trusted source prefix, so no image
      bypasses openchoreo-verify-images-{{ $suffix }} by not matching it. Action {{ $action }}.
spec:
  validationActions: [{{ $action }}]
  failurePolicy: {{ get $iv.failurePolicy $action | default "Ignore" }}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
    namespaceSelector:
      {{- toYaml $nsSelector | nindent 6 }}
  matchConditions:
    - name: never-platform-namespaces
      expression: '!(request.namespace in {{ $platform }})'
  variables:
    - name: trusted
      expression: '{{ $trusted | toJson }}'
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image)
        + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
  validations:
    - expression: 'variables.images.all(i, variables.trusted.exists(t, i.startsWith(t)))'
      messageExpression: >-
        'images must come from ' + variables.trusted.join(', ') + '; untrusted: ' +
        variables.images.filter(i, !variables.trusted.exists(t, i.startsWith(t))).join(', ')
{{- end }}
{{- end }}
