{{- /*
Digest-only images in workflow-plane run namespaces (docs/supply-chain.md "Digest references", #36): a mutable tag
would decide what runs next to the build's signing key and push credentials. Deny, fail closed; every platform image
is digest-pinned (hack/tests/test_image_pins.sh), so no exceptions exist.
*/ -}}
{{- $w := .Values.workflowImageDigests }}
{{- if $w.enabled }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-workflow-image-digests
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Digest-pinned images in workflow run namespaces
    policies.kyverno.io/description: >-
      Every container, initContainer and ephemeral container image of a Pod in {{ $w.namespacePrefix }}* namespaces
      (OpenChoreo workflow runs: builds, gates, auto-build) is referenced by digest (image@sha256:...), including
      Component checks.image overrides. Tag-only references are denied.
spec:
  validationActions: [Deny]
  failurePolicy: {{ $w.failurePolicy }}
  evaluation:
    background:
      enabled: true                  # PolicyReports for run pods admitted before the policy existed
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchConditions:
    # Label selectors cannot match a name prefix, and OpenChoreo creates workflows-<org ns> without a platform label.
    - name: workflow-run-namespaces
      expression: 'request.namespace.startsWith({{ $w.namespacePrefix | toJson }})'
    - name: never-platform-namespaces
      expression: '!(request.namespace in {{ .Values.platformNamespaces | toJson }})'
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image)
        + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
    - name: unpinned
      expression: "variables.images.filter(i, !i.matches('^[^@]+@sha256:[0-9a-f]{64}$'))"
  validations:
    - expression: size(variables.unpinned) == 0
      messageExpression: >-
        'images in {{ $w.namespacePrefix }}* namespaces must be referenced by digest (image@sha256:<digest>, see
        crane digest <image>); tag-only: ' + variables.unpinned.join(', ')
{{- end }}
