# Wrapper defaults for argo-cd (mgmt only).
# Used identically by bootstrap/bootstrap.sh and the GitOps argo-cd-mgmt Application so adoption is clean.
# Images pinned by multi-arch index digest (docs/conventions.md invariant 9; hack/tests/test_image_pins.sh): every
# component running quay.io/argoproj/argocd gets the same tag@digest (per component, not global.image.tag, which also
# feeds the app.kubernetes.io/version label). A chart bump updates the anchor below and redis together.
argo-cd:
  fullnameOverride: argocd
  global:
    domain: localhost
    networkPolicy:
      create: false
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: true   # prevent permanent diff on CAPI/ESO/cert-manager/OpenChoreo CRD defaults
      controller.status.processors: 10
      controller.operation.processors: 5
    cm:
      helm.dependencies.enabled: "true"   # repo-server runs helm dependency build for wrapper charts (https + OCI)
      timeout.reconciliation: 300s
      timeout.reconciliation.jitter: 60s
      # Thunder's PreSync setup Job mounts a PVC; k3s local-path binds on first consumer (WaitForFirstConsumer).
      # Treat Pending PVCs as Healthy so the hook Job can start and bind the volume.
      resource.customizations.health.PersistentVolumeClaim: |
        hs = {}
        if obj.status ~= nil and obj.status.phase ~= nil then
          if obj.status.phase == "Bound" then
            hs.status = "Healthy"
            hs.message = obj.status.phase
            return hs
          end
          if obj.status.phase == "Pending" then
            hs.status = "Healthy"
            hs.message = "Waiting for first consumer (WaitForFirstConsumer)"
            return hs
          end
        end
        hs.status = "Progressing"
        return hs
  controller:
    image:
      tag: &argocdTag v3.6.1@sha256:296e3d74f449b2ce45265613fcb68c18ed7366488360c8ea32f5f2a93d2e5c54   # index: amd64, arm64, ppc64le, s390x
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  server:
    image: { tag: *argocdTag }
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  repoServer:
    image: { tag: *argocdTag }
    env:
      - name: ARGOCD_EXEC_TIMEOUT
        value: "180s"   # allow initial OCI/https helm dependency builds (e.g. openchoreo-control-plane)
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  applicationSet:
    enabled: true
    image: { tag: *argocdTag }
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  redis:
    image:   # chart default repository (ECR Public mirror of Docker Official redis)
      tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763   # index: amd64, arm64, arm, ...
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  dex:
    enabled: false
    initImage: { tag: *argocdTag }
  notifications:
    enabled: false
    image: { tag: *argocdTag }
  commitServer:
    image: { tag: *argocdTag }
  redisSecretInit:
    image: { tag: *argocdTag }
