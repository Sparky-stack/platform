suite: cilium - L7 HTTP visibility + Hubble labels the OpenChoreo observer joins on (#104)
release:
  name: cilium
  namespace: kube-system
set:
  cilium.k8sServiceHost: 172.18.0.5
tests:
  - it: Hubble httpV2 carries the pod context labels the observer's metrics adapter joins kube_pod_labels on
    template: charts/cilium/templates/cilium-configmap.yaml
    asserts:
      - matchRegex:
          path: data["hubble-metrics"]
          pattern: (^| )httpV2:[^ ]*labelsContext=([a-z_]+,)*destination_namespace(,|$)
      - matchRegex:
          path: data["hubble-metrics"]
          pattern: (^| )httpV2:[^ ]*labelsContext=([a-z_]+,)*destination_pod(,|$)
      - matchRegex:
          path: data["hubble-metrics"]
          pattern: (^| )httpV2:[^ ]*labelsContext=([a-z_]+,)*source_pod(,|$)

  - it: rolls the agents when cilium-config changes (the agent reads it only at startup)
    template: charts/cilium/templates/cilium-agent/daemonset.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["cilium.io/cilium-configmap-checksum"]

  - it: renders a non-default-deny L7 visibility policy for OpenChoreo component pods
    template: templates/l7-visibility.yaml
    asserts:
      - isKind:
          of: CiliumClusterwideNetworkPolicy
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true
      - equal:
          path: spec.endpointSelector.matchExpressions
          value:
            - key: openchoreo.dev/component
              operator: Exists
      - equal:
          path: spec.enableDefaultDeny
          value: { ingress: false, egress: false }
      - equal:
          path: spec.ingress
          value:
            - fromEntities: [all]
              toPorts:
                - ports:
                    - { port: "8080", protocol: TCP }
                  rules:
                    http: [{}]
      - notExists:
          path: spec.egress
      - notExists:
          path: spec.ingressDeny

  - it: lists every configured HTTP port (numbers become strings)
    template: templates/l7-visibility.yaml
    set:
      l7Visibility.httpPorts: [8080, "3000"]
    asserts:
      - equal:
          path: spec.ingress[0].toPorts[0].ports
          value:
            - { port: "8080", protocol: TCP }
            - { port: "3000", protocol: TCP }

  - it: renders nothing when disabled
    template: templates/l7-visibility.yaml
    set:
      l7Visibility.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: fails without ports (Cilium rejects L7 rules on port 0)
    template: templates/l7-visibility.yaml
    set:
      l7Visibility.httpPorts: []
    asserts:
      - failedTemplate:
          errorPattern: l7Visibility.httpPorts is empty
