# Cilium 1.20.4 for k3s workload clusters born with `cni: cilium` (docs/networking.md).
# Catalog: namespace kube-system, roles [workload], default false; the cluster chart sets the label
# addons.platform.koorikla.io/cilium="true" exactly when the fleet file says `cni: cilium` (the default), and the
# ClusterClass variable `cni` boots k3s with flannel-backend=none, disable-network-policy, disable-kube-proxy.
# Until this addon is synced the nodes are NotReady (no CNI); every other addon retries meanwhile.
#
# Extra top-level keys from installation.yaml / the ApplicationSet (`cluster`, `installation`, ...) are ignored.

cilium:
  # eBPF service load-balancing replaces kube-proxy (k3s runs with disable-kube-proxy). Without kube-proxy the agent
  # cannot use the kubernetes Service VIP, so it dials the cluster's API endpoint directly. That endpoint is per
  # cluster: the catalog's clusterServerParameters set both keys from the Argo CD cluster secret's `server`
  # (= the CAPI kubeconfig endpoint: CAPD load balancer container, AWS ELB, Hetzner LB), reachable from every node.
  # (k3s' local 127.0.0.1:6444 proxy is not an option: it only runs on agents, not on servers.)
  # Also serves hostPort (klipper servicelb on CAPD: OpenChoreo's gateway hostPort) without the portmap plugin.
  kubeProxyReplacement: true
  k8sServiceHost: ""        # required; templates/validate.yaml fails the render when empty
  k8sServicePort: 6443

  cni:
    # Istio ambient chains istio-cni into Cilium's conflist; exclusive mode would delete it.
    exclusive: false
    # confPath/binPath stay at the defaults (/etc/cni/net.d, /opt/cni/bin): with flannel-backend=none k3s does not
    # point its containerd at /var/lib/rancher/k3s/... (k3s pkg/executor/embed/embed.go sets CNIConfDir/CNIBinDir only
    # when flannel runs), so containerd uses its built-in defaults.

  socketLB:
    # CRITICAL for Istio ambient: limit Cilium socket-level LB to the host netns so pod traffic still
    # traverses pod netns redirection into ztunnel instead of bypassing the mesh.
    hostNamespaceOnly: true

  # Istio ambient: BPF masquerading breaks ambient's link-local (169.254.7.127) health-probe SNAT; keep iptables
  # masquerading (Istio platform prerequisites for Cilium).
  bpf:
    masquerade: false

  # = charts/cluster Cluster.spec.clusterNetwork.pods (k3s default cluster-cidr). cluster-pool everywhere: the
  # operator hands each node a /24; no cloud IPAM (ENI) or CCM route controller involved, identical on all providers.
  ipam:
    mode: cluster-pool
    operator:
      clusterPoolIPv4PodCIDRList:
        - 10.42.0.0/16
      clusterPoolIPv4MaskSize: 24

  # VXLAN overlay on every provider (docker, AWS, Hetzner): no VPC route tables or hcloud network routes to manage;
  # the AWS ClusterClass opens 8472/udp between nodes. Native routing is a later per-provider optimisation.
  routingMode: tunnel
  tunnelProtocol: vxlan

  # Transparent node-to-node encryption for all pod traffic (mesh or not; replaces k3s flannel wireguard-native on
  # Hetzner). UDP 51871 between nodes. Needs the host kernel's wireguard module (CAPD: the docker host's).
  encryption:
    enabled: true
    type: wireguard

  # Gateway API is owned by kgateway (+ Istio ambient waypoints), not Cilium.
  gatewayAPI:
    enabled: false
  envoy:
    enabled: false

  # Single replica fits local CAPD; prod HA overrides to 2+ via installation/addon values.
  operator:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    prometheus:
      enabled: true
      # Scraped by the telemetry addon's Prometheus agent (ServiceMonitor `hubble-http` there, which owns the
      # Prometheus Operator CRDs; this CNI app syncs before they exist).
      serviceMonitor:
        enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # The agent reads cilium-config only at startup (e.g. a changed hubble.metrics list would not take effect until the
  # next restart): a checksum annotation rolls the DaemonSet when the ConfigMap changes.
  rollOutCiliumPods: true

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false

  hubble:
    enabled: true
    tls:
      enabled: true
      auto:
        enabled: true
        # cronJob avoids random Helm-generated cert diffs in Argo CD and runs before cert-manager.
        method: cronJob
    relay:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    ui:
      enabled: false
    metrics:
      enableOpenMetrics: true
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - port-distribution
        - icmp
        # OpenChoreo's observer (metrics adapter 0.8.0) reads hubble_http_requests_total{reporter="server"} and
        # hubble_http_request_duration_seconds and joins them to kube_pod_labels on (destination_namespace,
        # destination_pod) / (source_namespace, source_pod): the *_pod context labels are required (#104). Series only
        # exist for traffic Cilium parses at L7, i.e. ports in the l7Visibility policy below (templates/l7-visibility.yaml).
        - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,source_pod,destination_ip,destination_namespace,destination_workload,destination_pod,traffic_direction
      # Scraped by the telemetry addon's Prometheus agent (ServiceMonitor `hubble-http` there, which owns the
      # Prometheus Operator CRDs; this CNI app syncs before they exist).
      serviceMonitor:
        enabled: false

# --- platform glue (templates/) -------------------------------------------------------------------------------------
# L7 HTTP visibility for OpenChoreo component pods (#104): Hubble only emits hubble_http_* for traffic Cilium redirects
# to its L7 proxy, which takes an L7 rule. This CiliumClusterwideNetworkPolicy adds an allow-all `http: [{}]` rule on
# the listed container ports of every pod with an `openchoreo.dev/component` label. `enableDefaultDeny: false` on
# both directions: it only adds visibility and never puts an endpoint into default deny (needs
# enable-non-default-deny-policies, on by default since Cilium 1.17).
# - L7 rules need explicit ports (Cilium rejects port 0 with L7 rules). Only list ports that serve HTTP/1.1, h2c or
#   gRPC on every component pod: the proxy rejects anything else on a listed port. 8080 is OpenChoreo's sample default.
# - Sees plaintext only: north-south traffic from the out-of-mesh gateway (Istio PERMISSIVE, docs/networking.md).
#   HBONE mTLS between ambient pods goes to 15008 and stays opaque. Once the gateway joins the mesh with STRICT
#   mTLS (#53), Hubble is blind and HTTP metrics need another source (Istio waypoint, OBI).
# OFF: on dev1 (Istio ambient, embedded Envoy) the redirected connections hang at the proxy (SYN to-proxy, no reply),
# which took every component's 8080 down; see #104 before re-enabling.
l7Visibility:
  enabled: false
  httpPorts: ["8080"]
