{{- /* crossplane-system enforces Pod Security restricted: core, RBAC manager and every Function/Provider pod (they run
under DeploymentRuntimeConfig "restricted"). Argo CD creates the namespace (CreateNamespace=true); this object only adds
the labels. */ -}}
{{- if .Values.namespace.podSecurity }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    pod-security.kubernetes.io/enforce: {{ .Values.namespace.podSecurity | quote }}
    pod-security.kubernetes.io/audit: {{ .Values.namespace.podSecurity | quote }}
    pod-security.kubernetes.io/warn: {{ .Values.namespace.podSecurity | quote }}
{{- end }}
