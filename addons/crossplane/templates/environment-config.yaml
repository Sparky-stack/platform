{{- /* This cluster's PostgreSQL facts (no developer input): the Composition "postgresql" loads them with
function-environment-configs and dispatches on data.backend. Missing facts fail in templates/validate.yaml. */ -}}
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: platform-postgresql
  annotations:
    {{- include "crossplane.syncAnnotations" "1" | nindent 4 }}
data:
  {{- include "crossplane.pgFacts" . | fromJson | toYaml | nindent 2 }}
