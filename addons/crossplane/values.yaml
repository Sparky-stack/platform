# Crossplane v2 on workload clusters: opt-in (catalog default false; enable per cluster with label
# addons.platform.koorikla.io/crossplane: "true", i.e. cluster file `addons: { crossplane: true }`).
# docs/data-services.md "PostgreSQL as a service".
#
# What this addon installs on a cluster (everything as Helm templates of this chart, so it renders per cluster):
#   - Crossplane core + RBAC manager (upstream chart, below), namespace crossplane-system with Pod Security restricted.
#   - Functions function-environment-configs + function-go-templating + function-auto-ready, and only the provider
#     family members the selected PostgreSQL backend uses (none for cnpg), all pinned by multi-arch digest and run under
#     the DeploymentRuntimeConfig "restricted" (Crossplane's default package runtime lacks seccomp + capability drop).
#   - The PostgreSQL API as the Configuration package platform-postgresql (packages/postgresql: XRD
#     postgresqls.platform.koorikla.io + the ONE Composition "postgresql"), pinned tag@digest, signature-verified, and the
#     EnvironmentConfig platform-postgresql with this cluster's facts: the backend the provider fact selects
#     (postgresql.backendByProvider below, from label platform.koorikla.io/provider) plus its region / network / backup
#     facts. The Composition dispatches on that backend. Developers never choose: there is nothing else to choose from.
#   - A ManagedResourceActivationPolicy activating only the managed resources that Composition composes (provider CRD
#     count and memory stay low; provider.defaultActivations is empty so nothing else is activated).
#   - Kyverno ValidatingPolicies: tenants get PostgreSQL only through the XR (no raw CNPG / RDS / Cloud SQL / Flexible
#     Server objects in their namespaces) and production cells must ask for highAvailability + backup.
#
# Why a package plus an EnvironmentConfig: the API (XRD + Composition) is the same on every cluster and ships as one
# versioned, cosign-signed OCI artifact with its own release (postgresql-vX.Y.Z); only the facts differ per cluster,
# and those render here per cluster through the addon ApplicationSet. The Configuration skips dependency resolution:
# the resolver would install Functions / Providers by floating tag and without the restricted runtime configs, so
# templates/packages.yaml declares them pinned (docs/data-services.md "Packaging").
#
# CRDs: Crossplane v2 installs its own CRDs (Composition, XRD, Function, Provider, ...) from its init container; the
# chart has none. The platform objects here carry SkipDryRunOnMissingResource and sync wave 1 (wave 2 for the
# ProviderConfigs, whose CRDs come with the providers) so Argo CD applies them once Crossplane runs.

# --- generated by the addon ApplicationSet (defaults so `helm template` works standalone) ---------------------------
cluster: { name: sample, provider: docker, region: local, environment: development }

namespace:
  podSecurity: restricted           # Pod Security admission level enforced on crossplane-system ("" = no labels)

crossplane:
  image:
    repository: xpkg.crossplane.io/crossplane/crossplane
    tag: "v2.4.3@sha256:1c66261d805a73cade46e2ac94b665c73aebd4a00844de5fcae4bcadaa2be638"
  # Package signature verification (alpha in 2.4) stays off: its cosign verifier only finds legacy `.sig` tags, while
  # cosign v3 signs with Sigstore bundles via OCI referrers (live: "no signatures found", #247). Re-enable with
  # args: ["--enable-signature-verification"] + packages.signatureVerification.enabled once #247 is resolved.
  args: []
  # Single replicas locally. HA: replicas: 2 and rbacManager.replicas: 2 (leader election is on by default).
  replicas: 1
  rbacManager:
    replicas: 1
  provider:
    # -- `[]` (`templates/activation-policy.yaml` activates only the APIs used by the active `Composition`).
    defaultActivations: []          # no "*" MRAP: templates/activation-policy.yaml activates exactly what is composed
  metrics:
    enabled: true                   # :8080/metrics on core + RBAC manager; PodMonitor below
  # Pod Security restricted (upstream sets neither seccomp nor a capability drop).
  podSecurityContextCrossplane: &podsc
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  podSecurityContextRBACManager: *podsc
  securityContextCrossplane: &sc
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
    seccompProfile: { type: RuntimeDefault }
  securityContextRBACManager: *sc
  resourcesCrossplane:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 1Gi }
  resourcesRBACManager:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 100m, memory: 256Mi }

monitoring:
  podMonitor: true                  # needs addon telemetry (prometheus-operator CRDs) on the same cluster

# Crossplane packages: xpkg.crossplane.io, OSS crossplane-contrib upjet family providers (not the subscription-gated
# xpkg.upbound.io packages), each pinned by multi-arch (amd64 + arm64) index digest. Providers skip dependency
# resolution (a resolved dependency would be a floating tag): the family provider is listed and pinned explicitly.
packages:
  runtimeConfig:
    name: restricted                # DeploymentRuntimeConfig for every Function and Provider here
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }
    providerResources:              # upjet providers hold the Terraform schema in memory
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
  # -- The PostgreSQL API package (packages/postgresql), release tag vX.Y.Z (release-please postgresql-vX.Y.Z) @digest (a
  # Configuration has one manifest, no index); never the moving `main` tag. The promotion point: per-environment pins go
  # in installations/<inst>/addons/crossplane/env-<env>.yaml. Renovate bumps it.
  configuration: ghcr.io/koorikla/platform/postgresql:v0.2.0@sha256:478419ad87ba4e90756b6826638c6977bfda3d23ecdee48b5fa0bca539ba5be1
  # Cosign keyless verification of platform packages (ImageConfig; alpha, needs core flag
  # --enable-signature-verification in crossplane.args). Identity: the reusable workflow that signs on main / tags.
  # Off until Crossplane verifies Sigstore bundles (#247); packages are still keyless-signed with provenance in CI.
  signatureVerification:
    enabled: false
    prefix: ghcr.io/koorikla/platform/
    issuer: https://token.actions.githubusercontent.com
    subjectRegExp: '^https://github\.com/koorikla/platform/\.github/workflows/app-crossplane-configuration\.yaml@refs/(heads/main|tags/postgresql-v[0-9.]+)$'
  functions:
    function-environment-configs: xpkg.crossplane.io/crossplane-contrib/function-environment-configs:v0.9.2@sha256:1e4f74646d274437da6dc94d1323a0be8ccfa2e2497c0e92e6722e870ac4d3f6
    function-go-templating: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.13.2@sha256:20198cb6ea5b4b8a48042343410ec9031e5ec43431d874364ecd3eac8e861290
    function-auto-ready: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.3@sha256:cce8799e19a8f25fb84e1f8dd8855021fdbe8cd7a12a5c22a0c0c345476ae9fe
    # The Configuration's embedded function (packages/postgresql/functions/compose-postgresql), published with it by
    # the same CI run: bump it together with `configuration` (same tag; the Configuration's dependsOn pins this digest).
    # The name is the one the Composition references (Crossplane's name for ghcr.io/koorikla/platform/postgresql_compose-postgresql).
    koorikla-platform-postgresqlcompose-postgresql: ghcr.io/koorikla/platform/postgresql_compose-postgresql:v0.2.0@sha256:7f4d5cb26e8ca5d2736a28acea5dadbee07b45d0900d614889ed416b7d2cc2ce
  # Per backend: only the family members its Composition uses.
  providers:
    cnpg: {}
    aws-rds:
      provider-family-aws: xpkg.crossplane.io/crossplane-contrib/provider-family-aws:v2.9.0@sha256:4b426b75d6c2b5cbc3270b4c2423c81cfd0ce7e7a7f5f02d2af305ba76944505
      provider-aws-rds: xpkg.crossplane.io/crossplane-contrib/provider-aws-rds:v2.9.0@sha256:5f46e7bd9dc5152baa835705f0820d66729d659afc3b287bfa4ff60ccab4c307
      provider-aws-ec2: xpkg.crossplane.io/crossplane-contrib/provider-aws-ec2:v2.9.0@sha256:e5c093671479fa349bc8e08ddea44ecaaa2f50ae5d586191b38127a101de5330
      provider-aws-kms: xpkg.crossplane.io/crossplane-contrib/provider-aws-kms:v2.9.0@sha256:59864b9cfbdc5970f2063dd396717bc769b9849c818dac17b3304bf4cef94911
    gcp-cloudsql:
      provider-family-gcp: xpkg.crossplane.io/crossplane-contrib/provider-family-gcp:v3.1.0@sha256:712ad98847a6484046964fef69b5faef94468ff3d01dbbd53af8c269f1ecac97
      provider-gcp-sql: xpkg.crossplane.io/crossplane-contrib/provider-gcp-sql:v3.1.0@sha256:e108a2d4b34ff89318e3bd0b891f4321f937ee40d999a0f8a215a6334164bda5
    azure-flexible:
      provider-family-azure: xpkg.crossplane.io/crossplane-contrib/provider-family-azure:v2.8.0@sha256:d28c4d7c973edd77d79f279772782eef7eeaa704b9904b098b4c81f58d74f044
      provider-azure-dbforpostgresql: xpkg.crossplane.io/crossplane-contrib/provider-azure-dbforpostgresql:v2.8.0@sha256:5ea12751afc1c3dc5d9a9de0bf5ee423a8b097287c088111504c98099012c7b9

# --- PostgreSQL as a service (docs/data-services.md "PostgreSQL as a service") ---------------------------------------
postgresql:
  # Backend = Composition installed on this cluster. Empty: looked up from the cluster's provider fact (fleet file
  # `provider` -> label platform.koorikla.io/provider -> cluster.provider). A provider missing from the map fails the
  # render (no silent default). Override per cluster only to force a backend (e.g. cnpg on a cloud cluster).
  # -- Active `Composition` (`postgresql.backendByProvider` maps `cluster.provider` to `cnpg`, `aws-rds`, `gcp-cloudsql`, or `azure-flexible`).
  backend: ""
  backendByProvider:
    docker: cnpg
    byo: cnpg            # an existing cluster: in-cluster CloudNativePG (set postgresql.backend for a managed service)
    hetzner: cnpg
    vsphere-talos: cnpg
    aws: aws-rds
    aws-eks: aws-rds
    gcp-gke: gcp-cloudsql
    azure-aks: azure-flexible

  # cnpg: CloudNativePG Clusters in the XR's namespace. Needs addon cloudnative-pg on the same cluster.
  cnpg:
    # -- Backend-specific image catalog (`postgresql-standard`) and `postgresql.{cnpg,aws,gcp,azure}` subnet/VPC and workload-identity settings.
    imageCatalog: postgresql-standard   # ClusterImageCatalog of addon cloudnative-pg (one pinned image per major)
    podMonitor: true                    # per-cluster PodMonitor (instance metrics :9187); needs addon telemetry
    backup:
      # Object store prefix for the Barman Cloud plugin (addon cloudnative-pg plugin-barman-cloud.enabled: true), e.g.
      # s3://example-pg-backups/postgresql. Each XR writes to <prefix>/<cluster>/<namespace>/<name>. Empty: XRs that ask
      # for backup get status.backup "unavailable" (local docker clusters keep no backups).
      destinationPath: ""
      credentials:                      # barmancloud ObjectStore spec.configuration credentials; workload identity only
        s3Credentials:
          inheritFromIAMRole: true
      serviceAccountAnnotations: {}     # on every PostgreSQL ServiceAccount, e.g. eks.amazonaws.com/role-arn (IRSA)

  # aws-rds: RDS for PostgreSQL (Multi-AZ instance for highAvailability) or Aurora PostgreSQL (spec.engine: aurora).
  # Network facts of the cluster (created with it, docs/providers.md); per installation/cluster overlay.
  aws:
    region: ""                          # default: cluster.region
    vpcId: ""
    subnetIds: []                       # private subnets in >= 2 AZs (DB subnet group)
    nodeSecurityGroupId: ""             # source security group allowed to reach 5432 (the cluster's nodes)
    identity:
      source: IRSA                      # IRSA | PodIdentity (association on ServiceAccount crossplane-system/provider-aws)
      roleArn: ""                       # IRSA role of the providers (rds, ec2, kms); unused with PodIdentity

  # gcp-cloudsql: Cloud SQL for PostgreSQL, private IP only (private services access on the VPC is a cluster fact).
  gcp:
    project: ""
    region: ""                          # default: cluster.region
    privateNetwork: ""                  # projects/<project>/global/networks/<vpc>
    allocatedIpRange: ""                # optional: named private services access range
    identity:
      serviceAccount: ""                # GKE Workload Identity: GSA for KSA crossplane-system/provider-gcp ("" = direct WIF principal)

  # azure-flexible: Azure Database for PostgreSQL Flexible Server with VNet integration (delegated subnet + private DNS
  # zone are cluster facts) and Entra authentication enabled next to password authentication.
  azure:
    subscriptionID: ""
    tenantID: ""
    clientID: ""                        # user-assigned managed identity federated with KSA crossplane-system/provider-azure
    resourceGroupName: ""
    location: ""                        # default: cluster.region
    delegatedSubnetId: ""
    privateDnsZoneId: ""

# --- MySQL as a service (docs/data-services.md "MySQL as a service", #256) ------------------------------------------
# Opt-in with addon moco: the catalog sets mysql.enabled from the cluster label addons.platform.koorikla.io/moco (charts/
# platform clusterLabelParameters), so `addons: { moco: true }` installs the operator AND this API, and the capability
# gate of openchoreo-data-plane waits for both. Backend moco only: the cloud Compositions of packages/mysql are layout
# (never applied); a cloud backend here is a follow-up with its providers, MRAP entries and facts.
mysql:
  # -- `"true"` installs the MySQL API (Configuration platform-mysql + EnvironmentConfig + embedded Function); a string because the ApplicationSet passes cluster labels as strings (helm set-string).
  enabled: "false"
  backend: moco
  # mysqlImages fact: addons/moco values.yaml mysqlImageCatalog (catalog valuesFromAddons: [moco]), not restated here.
  # The MySQL API package (packages/mysql) and its embedded function, published by the same package-mysql CI run;
  # bump both together (the Configuration's dependsOn pins the function digest). Renovate bumps them. The first pin is
  # the package-mysql build of commit a239626 (#256, before its release); the next release mysql-vX.Y.Z replaces it.
  configuration: ghcr.io/koorikla/platform/mysql:a239626@sha256:0082fd0f27ad3ad9ff0b8e5aa3d036d9ccf08cf3023bb93ae3133e8ddf50cea6
  function:
    koorikla-platform-mysqlcompose-mysql: ghcr.io/koorikla/platform/mysql_compose-mysql:a239626@sha256:09cee6e26d7b275f3689077c9009f38b8fe8c752eb51d9f225c4be1827c0c0d2

# --- Admission (Kyverno ValidatingPolicy, CRDs from addon kyverno) ----------------------------------------------------
policy:
  enabled: true
  # Raw database objects (CNPG Cluster/Pooler/..., RDS/EC2/KMS, Cloud SQL, Flexible Server managed resources) are denied
  # outside these namespaces, unless a ServiceAccount of one of exemptServiceAccountNamespaces makes the request
  # (Crossplane composing the XR, providers updating their resources, the CNPG operator creating Backups, kube-system
  # controllers such as the garbage collector).
  exemptNamespaces: [crossplane-system, cnpg-system, moco-system]
  exemptServiceAccountNamespaces: [crossplane-system, cnpg-system, moco-system, kube-system]
  # PostgreSQL XRs in OpenChoreo cells of these environments must set highAvailability: true and backup.enabled: true.
  production:
    environments: [production]
    # -- `Deny` on cloud (`Audit` in `values/provider-docker.yaml`) for non-HA or unbacked `production` instances.
    action: Deny                        # values/provider-docker.yaml: Audit (no object store, one node locally)
