# Cluster API operator only. cert-manager (webhook serving cert) is the cert-manager addon; providers (core, k3s,
# docker/aws/hetzner) are CRs rendered by charts/cluster so they can be toggled per installation.

cluster-api-operator:
  # Leave the chart's provider maps empty: providers live in charts/cluster.
  # -- `{}` (kept empty alongside `bootstrap`, `controlPlane`, `infrastructure`, `addon`, `ipam` so `charts/cluster` (scope fleet) owns provider CRs).
  core: {}
  bootstrap: {}
  controlPlane: {}
  infrastructure: {}
  addon: {}
  ipam: {}
  # Re-reconcile a provider when its configSecret changes (CAPA's credentials come from an ExternalSecret).
  # -- `true` so provider controllers re-reconcile when ESO rotates `configSecret` credentials (such as CAPA's `capa-variables`).
  watchConfigSecret: true
  # Lease headroom like the provider managers (charts/cluster values.yaml leaderElection, #192) and mgmt's k3s
  # controllers (#94): the 15s/10s/2s defaults are lost when the mgmt API server stalls during a clean bootstrap.
  leaderElection:
    enabled: true
    leaseDuration: 60s
    renewDeadline: 40s
    retryPeriod: 10s
  image:
    manager:
      repository: registry.k8s.io/capi-operator/cluster-api-operator
      # -- `v0.30.0` pinned by multi-arch index digest.
      tag: v0.30.0@sha256:2dd577d7bd9cf65deb45b8cd6444f5c89c3de3237ed8e150bd3d34df24fbce10   # index: amd64, arm64, arm, ppc64le, s390x
