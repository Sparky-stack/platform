# Cluster API operator only. cert-manager (webhook serving cert) is the cert-manager addon; providers (core, k3s,
# docker/aws/hetzner) are CRs rendered by addons/capi-providers so they can be toggled per installation.

# Generated by the addon ApplicationSet (defaults keep `helm template` working standalone). Unused here.
cluster: { name: mgmt, role: mgmt, provider: docker, region: local, environment: mgmt }
installation: { name: local }

cluster-api-operator:
  # Leave the chart's provider maps empty: providers live in addons/capi-providers.
  core: {}
  bootstrap: {}
  controlPlane: {}
  infrastructure: {}
  addon: {}
  ipam: {}
  # Re-reconcile a provider when its configSecret changes (CAPA's credentials come from an ExternalSecret).
  watchConfigSecret: true
  image:
    manager:
      repository: registry.k8s.io/capi-operator/cluster-api-operator
      tag: v0.30.0
