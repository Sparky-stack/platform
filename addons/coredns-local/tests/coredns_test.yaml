suite: coredns-local rewrite
templates:
  - templates/coredns-custom.yaml
tests:
  - it: workload default rewrites the control-plane hosts to the mgmt k3d load balancer
    asserts:
      - equal: { path: metadata.name, value: coredns-custom }
      - equal: { path: metadata.namespace, value: kube-system }
      - matchRegex:
          path: data["openchoreo.override"]
          pattern: 'name regex \^\(\.\+\\\.\)\?openchoreo\\\.localhost\\\.\$ k3d-platform-mgmt-serverlb\n'
  - it: mgmt rewrites to the control-plane Gateway Service
    values: [../values/role-mgmt.yaml]
    asserts:
      - matchRegex:
          path: data["openchoreo.override"]
          pattern: 'gateway-default\.openchoreo-control-plane\.svc\.cluster\.local'
  - it: follows openchoreo.controlPlane.host
    set:
      openchoreo.controlPlane.host: oc.example.com
    asserts:
      - matchRegex:
          path: data["openchoreo.override"]
          pattern: 'oc\\\.example\\\.com\\\.\$'

  - it: mgmt with observability sends observer/*.observability names to the obs-plane Gateway first
    values: [../values/role-mgmt.yaml]
    set:
      openchoreo.observability.enabled: true
    asserts:
      - matchRegex:
          path: data["openchoreo.override"]
          pattern: '(?s)name regex \^\(observer\\\.\|\.\+\\\.observability\\\.\)openchoreo\\\.localhost\\\.\$ gateway-default\.openchoreo-observability-plane\.svc\.cluster\.local\n.*gateway-default\.openchoreo-control-plane'
  - it: no observability rule without observability
    values: [../values/role-mgmt.yaml]
    asserts:
      - notMatchRegex:
          path: data["openchoreo.override"]
          pattern: 'observability'
  - it: workload with observability keeps the single generic rule (serverlb publishes the obs ports)
    set:
      openchoreo.observability.enabled: true
    asserts:
      - notMatchRegex:
          path: data["openchoreo.override"]
          pattern: 'openchoreo-observability-plane'

  - it: mgmt sends the Harbor registry host to Harbor's Gateway Service before every other rule
    values: [../values/role-mgmt.yaml]
    set:
      registry: { type: harbor, host: "harbor.openchoreo.localhost:9443" }
    asserts:
      - matchRegex:
          path: data["openchoreo.override"]
          pattern: '(?s)^rewrite stop \{\n\s+name regex \^harbor\\\.openchoreo\\\.localhost\\\.\$ harbor\.harbor\.svc\.cluster\.local\n.*gateway-default\.openchoreo-control-plane'
  - it: no registry rule for an external registry or on workload clusters
    set:
      registry: { type: harbor, host: "harbor.openchoreo.localhost:9443" }
    asserts:
      - notMatchRegex:
          path: data["openchoreo.override"]
          pattern: 'harbor\.harbor\.svc'
