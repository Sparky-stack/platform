# Strimzi cluster operator on workload clusters: opt-in (catalog default false; enable per cluster with label
# addons.platform.koorikla.io/strimzi: "true", i.e. cluster file `addons: { strimzi: true }`). docs/data-services.md
# "Kafka (Strimzi)".
#
# Strimzi 1.x: KRaft only (no ZooKeeper), Kafka / KafkaNodePool / KafkaTopic / KafkaUser in kafka.strimzi.io/v1.
# CRDs come from the chart's crds/ directory; Argo CD renders and applies them server-side (every addon Application
# syncs with ServerSideApply=true - the Kafka CRD is far larger than the client-side last-applied annotation allows).
#
# Watch scope: all namespaces (watchAnyNamespace: OpenChoreo cell namespaces dp-* are created at runtime, so they cannot
# be listed). RBAC this implies: ClusterRoleBindings for strimzi-cluster-operator-namespaced / -watched / -global and
# the entity-operator delegation, i.e. the operator can manage Pods, Services, Secrets, ConfigMaps, PVCs,
# NetworkPolicies, PDBs and Roles/RoleBindings in every namespace (it creates the brokers' and entity operators'
# objects next to each Kafka CR). Restrict with watchNamespaces + watchAnyNamespace: false in an installation overlay
# if Kafka clusters live only in known namespaces.
#
# Images: multi-arch (amd64, arm64), pinned by digest. The operator also launches operands: topic/user operator and
# kafka-init (= the operator image, pinned here), Kafka Bridge, Buildah / Maven builder (KafkaConnect builds, pinned
# here) and the Kafka broker image chosen per Kafka CR spec.kafka.version (STRIMZI_KAFKA_IMAGES, tags only - pin a broker
# image by digest with spec.kafka.image, example in docs/data-services.md).

namespace:
  # -- `restricted` Pod Security admission label on namespace `strimzi`.
  podSecurity: restricted           # Pod Security admission level enforced on the operator namespace ("" = no labels)
  # Istio ambient mesh client (#53): the cluster operator reaches Kafka pods in
  # cell namespaces, which enforce STRICT mTLS (addon
  # kyverno-policies templates/cell-mesh.yaml) and refuse plaintext from outside the mesh. Inert without Istio.
  ambient: true

monitoring:
  # -- `true` (scrapes operator metrics via `addons/telemetry`).
  podMonitor: true                  # templates/podmonitor.yaml; needs addon telemetry (prometheus-operator CRDs)

strimzi-kafka-operator:
  # -- `true` so dynamically created OpenChoreo cell namespaces are reconciled.
  watchAnyNamespace: true
  image:
    # -- `1.3.1` pinned by multi-arch index digest (alongside `topicOperator.image`, `userOperator.image`, `kafkaInit.image`).
    tag: "1.3.1@sha256:55f43849559a0d151be473c588c89e9d72649ecadf088c8b9d92d37654a5e5eb"   # quay.io/strimzi/operator
  topicOperator:
    image: { tag: "1.3.1@sha256:55f43849559a0d151be473c588c89e9d72649ecadf088c8b9d92d37654a5e5eb" }
  userOperator:
    image: { tag: "1.3.1@sha256:55f43849559a0d151be473c588c89e9d72649ecadf088c8b9d92d37654a5e5eb" }
  kafkaInit:
    image: { tag: "1.3.1@sha256:55f43849559a0d151be473c588c89e9d72649ecadf088c8b9d92d37654a5e5eb" }
  kafkaBridge:
    image: { tag: "1.2.1@sha256:4597700f87ab33b7768863728730bc2eb68a0d7fa9633ab2a4cebb3a2730cfa9" }
  buildah:
    image: { tag: "1.3.1@sha256:7a2f75ee2a66b5cd83ebadf9be5efdf452e31cf006714e8f46f8ce16b3806b98" }
  mavenBuilder:
    image: { tag: "1.3.1@sha256:ce67465a4df0fa0a684e64962d6d4fff0b767636ae18e2ee7834bba14f5e4813" }
  # Pod Security restricted for the operator (upstream container context already complies; the pod context makes
  # runAsNonRoot/seccomp explicit) and for every operand it creates (Kafka, entity operator, bridge, ...).
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  extraEnvs:
    - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
      value: restricted
  resources:                        # platform: upstream requests 200m/384Mi (JVM: memory stays at upstream)
    requests: { cpu: 50m, memory: 384Mi }
    limits: { cpu: 1000m, memory: 384Mi }
