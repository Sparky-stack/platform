suite: strimzi wrapper
release:
  name: strimzi
  namespace: strimzi
templates:
  - templates/namespace.yaml
  - templates/podmonitor.yaml
  - charts/strimzi-kafka-operator/templates/060-Deployment-strimzi-cluster-operator.yaml
  - charts/strimzi-kafka-operator/templates/021-ClusterRoleBinding-strimzi-cluster-operator.yaml
tests:
  - it: the operator image is fully qualified and pinned by digest
    template: charts/strimzi-kafka-operator/templates/060-Deployment-strimzi-cluster-operator.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^quay\.io/strimzi/operator:1\.3\.1@sha256:[0-9a-f]{64}$'

  - it: operand images the operator launches from env are pinned by digest too (except the per-version Kafka map)
    template: charts/strimzi-kafka-operator/templates/060-Deployment-strimzi-cluster-operator.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "STRIMZI_DEFAULT_TOPIC_OPERATOR_IMAGE")].value
          pattern: '^quay\.io/strimzi/operator:1\.3\.1@sha256:[0-9a-f]{64}$'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "STRIMZI_DEFAULT_USER_OPERATOR_IMAGE")].value
          pattern: '@sha256:[0-9a-f]{64}$'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "STRIMZI_DEFAULT_KAFKA_INIT_IMAGE")].value
          pattern: '@sha256:[0-9a-f]{64}$'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "STRIMZI_DEFAULT_KAFKA_BRIDGE_IMAGE")].value
          pattern: '^quay\.io/strimzi/kafka-bridge:[0-9.]+@sha256:[0-9a-f]{64}$'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "STRIMZI_DEFAULT_BUILDAH_IMAGE")].value
          pattern: '@sha256:[0-9a-f]{64}$'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "STRIMZI_DEFAULT_MAVEN_BUILDER")].value
          pattern: '@sha256:[0-9a-f]{64}$'

  - it: the operator pod meets Pod Security restricted and makes its operands restricted
    template: charts/strimzi-kafka-operator/templates/060-Deployment-strimzi-cluster-operator.yaml
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: STRIMZI_POD_SECURITY_PROVIDER_CLASS, value: restricted }

  - it: watches every namespace (OpenChoreo cell namespaces are created at runtime)
    template: charts/strimzi-kafka-operator/templates/060-Deployment-strimzi-cluster-operator.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: STRIMZI_NAMESPACE, value: "*" }

  - it: all-namespace watch is granted by ClusterRoleBindings (documented RBAC)
    template: charts/strimzi-kafka-operator/templates/021-ClusterRoleBinding-strimzi-cluster-operator.yaml
    asserts:
      - isKind: { of: ClusterRoleBinding }
      - equal:
          path: subjects[0].namespace
          value: strimzi

  - it: KRaft-only operator (no ZooKeeper feature gates or images)
    template: charts/strimzi-kafka-operator/templates/060-Deployment-strimzi-cluster-operator.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "STRIMZI_KAFKA_IMAGES")].value
          pattern: '(?i)zookeeper'
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "STRIMZI_FEATURE_GATES")].value
          value: ""

  - it: cluster operator metrics are scraped by a PodMonitor
    template: templates/podmonitor.yaml
    asserts:
      - isKind: { of: PodMonitor }
      - equal: { path: spec.selector.matchLabels, value: { strimzi.io/kind: cluster-operator } }
      - equal: { path: spec.namespaceSelector.matchNames, value: [strimzi] }
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: http

  - it: no PodMonitor when monitoring is off
    template: templates/podmonitor.yaml
    set:
      monitoring.podMonitor: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: the operator namespace enforces Pod Security restricted
    template: templates/namespace.yaml
    asserts:
      - equal: { path: metadata.name, value: strimzi }
      - equal:
          path: 'metadata.labels["pod-security.kubernetes.io/enforce"]'
          value: restricted

  - it: no Namespace object without a Pod Security level
    template: templates/namespace.yaml
    set:
      namespace.podSecurity: ""
    asserts:
      - hasDocuments: { count: 0 }
