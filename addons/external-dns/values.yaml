# Opt-in ExternalDNS on mgmt and workload clusters (catalog default: false; enable per cluster with label
# addons.platform.koorikla.io/external-dns: "true", or mgmt.addons / cluster addons).
# Gateway API sources match kgateway / OpenChoreo routes; policy is upsert-only by default (safe: never deletes records).
# Docs: docs/dns.md.

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster:
  name: sample
  role: mgmt

dns:
  provider: none              # none | route53 | cloudflare (from installation.yaml)
  domainFilters: []           # overridden from installation.yaml

# --- platform secrets (templates/secrets.yaml) ------------------------------------------------------------------------
secrets:
  store: platform             # values/role-mgmt.yaml -> platform; values/role-workload.yaml -> default
  aws:
    enabled: false            # true only for static IAM user credentials (prefer IRSA / Pod Identity)
    remoteKey: external-dns-aws
  cloudflare:
    enabled: false            # true when using Cloudflare DNS (e.g. installations/<inst>/addons/external-dns/values.yaml)
    remoteKey: external-dns-cloudflare
    property: api-token

# --- upstream external-dns chart (1.23.0 / app v0.23.0) ---------------------------------------------------------------
external-dns:
  policy: upsert-only         # safe default: creates/updates records, never deletes
  # policy: sync              # uncomment to also delete DNS records when Routes/Services are removed
  registry: txt
  txtOwnerId: sample          # overridden per cluster via catalog clusterNameParameters: [external-dns.txtOwnerId]
  # txtPrefix: external-dns-  # optional prefix for ownership TXT records

  sources:
    - gateway-httproute
    - gateway-tlsroute
    - gateway-grpcroute
    - service

  domainFilters: []           # synced from installation.yaml dns.domainFilters via installationParameters / overlay

  provider:
    name: aws                 # values/provider-aws.yaml (Route53) or installation overlay (e.g. cloudflare)

  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
