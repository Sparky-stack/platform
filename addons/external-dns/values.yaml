# ExternalDNS (kubernetes-sigs chart) for Gateway API routes, opt-in per cluster (catalog default: false). docs/dns.md.
#
# Which DNS provider runs is an installation fact (installation.yaml `dns.provider`), independent of the CAPI infra
# provider: the catalog's `installationValueFiles` layers values/dns-<dns.provider>.yaml on top of this file (after the
# role/provider/cni overlays, before installations/<inst>/addons/external-dns/*). `dns.domainFilters` reaches the
# subchart as the catalog installationParameter `external-dns.domainFilters`, `<installation>-<cluster>` as `txtOwnerId`
# (clusterIdParameters). templates/validate.yaml fails the render if any of them disagree with installation.yaml.

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster:
  name: sample
  role: mgmt
dns:
  provider: none              # none | route53 | cloudflare (installation.yaml)
  domainFilters: []           # zones ExternalDNS may touch (installation.yaml)

# --- platform glue (templates/) -------------------------------------------------------------------------------------
# ExternalSecret for the Cloudflare token. Store: `platform` on mgmt (values/role-mgmt.yaml), `dns` on workload clusters
# (values/role-workload.yaml; scoped to this namespace, never the tenant store `default`). Route 53 has no secret:
# IRSA / EKS Pod Identity only, static AWS keys are refused (templates/validate.yaml).
secrets:
  store: platform
  cloudflare:
    enabled: false            # values/dns-cloudflare.yaml
    remoteKey: external-dns-cloudflare   # property api-token: Cloudflare API token scoped to Zone:Read + DNS:Edit

# --- upstream chart (external-dns 1.23.0 / app v0.23.0) -------------------------------------------------------------
external-dns:
  enabled: false              # Chart.yaml condition: only values/dns-route53.yaml or values/dns-cloudflare.yaml turn it on
  image:
    tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3   # index: amd64, arm64, arm

  # Gateway API routes only (kgateway / OpenChoreo publish through Gateways): no Ingress, no Service source. Which
  # Gateways: values/role-*.yaml (workload: the data plane's gateway-default; mgmt: label-selected public ones).
  # Gateway API v1.5.1 standard (addon gateway-api-crds) serves all three as gateway.networking.k8s.io/v1, which is
  # what external-dns v0.23 watches.
  sources:
    - gateway-httproute
    - gateway-grpcroute
    - gateway-tlsroute

  policy: upsert-only         # creates/updates, never deletes. `sync` (also deletes records of removed routes) only per
                              # installation, in installations/<inst>/addons/external-dns/values.yaml, on a dedicated zone
  registry: txt
  txtOwnerId: sample          # = <installation>-<cluster> (catalog clusterIdParameters): unique across installations
                              # sharing a zone (a cooperative marker, not a security boundary: docs/dns.md)
  domainFilters: []           # = installation.yaml dns.domainFilters (catalog installationParameters); never empty when on
  interval: 1m

  provider:
    name: aws                 # chart default; values/dns-<provider>.yaml sets the real one (validated)

  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { cpu: 100m, memory: 128Mi }
  # Chart defaults already meet Pod Security restricted: runAsNonRoot (65532), readOnlyRootFilesystem, drop ALL,
  # seccomp RuntimeDefault, allowPrivilegeEscalation false.
