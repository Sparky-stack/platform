{{- /*
Provider credentials via ESO (never committed). Store from values/role-<role>.yaml: `platform` on mgmt (its namespace
is listed in addon secret-stores platformStore.namespaces), `default` on workload clusters.
  external-dns-cloudflare  key external-dns-cloudflare, property api-token          (values/dns-cloudflare.yaml)
  external-dns-aws         key external-dns-aws, access-key-id + secret-access-key  (last resort, values/dns-route53.yaml)
*/ -}}
{{- $store := required "secrets.store is required" .Values.secrets.store }}
{{- if .Values.secrets.cloudflare.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: external-dns-cloudflare
  data:
    - secretKey: api-token
      remoteRef: { key: {{ .Values.secrets.cloudflare.remoteKey }}, property: api-token }
{{- end }}
{{- if .Values.secrets.aws.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-aws
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: external-dns-aws
  data:
    - secretKey: access-key-id
      remoteRef: { key: {{ .Values.secrets.aws.remoteKey }}, property: access-key-id }
    - secretKey: secret-access-key
      remoteRef: { key: {{ .Values.secrets.aws.remoteKey }}, property: secret-access-key }
{{- end }}
