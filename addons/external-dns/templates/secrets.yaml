{{- /*
Cloudflare token via ESO (never committed). Store from values/role-<role>.yaml: `platform` on mgmt (its namespace is
listed in addon secret-stores platformStore.namespaces), `dns` on workload clusters (secret-stores dnsStore: this
namespace only, a backend location the tenant store `default` cannot read).
  external-dns-cloudflare  key external-dns-cloudflare, property api-token  (values/dns-cloudflare.yaml)
Route 53 has no secret: IRSA / EKS Pod Identity only.
*/ -}}
{{- $store := required "secrets.store is required" .Values.secrets.store }}
{{- if .Values.secrets.cloudflare.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: external-dns-cloudflare
  data:
    - secretKey: api-token
      remoteRef: { key: {{ .Values.secrets.cloudflare.remoteKey }}, property: api-token }
{{- end }}
