{{- /*
Optional ExternalSecrets for external-dns when using static credentials or API tokens.
  secrets.store: `platform` on mgmt (values/role-mgmt.yaml), `default` on workload (values/role-workload.yaml).
  Cloudflare: key `external-dns-cloudflare` property `api-token`.
  AWS static keys (prefer IRSA/Pod Identity instead): key `external-dns-aws` properties `access-key-id`, `secret-access-key`.
*/ -}}
{{- $store := required "secrets.store is required" .Values.secrets.store }}
{{- if .Values.secrets.cloudflare.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: external-dns-cloudflare
  data:
    - secretKey: api-token
      remoteRef:
        key: {{ .Values.secrets.cloudflare.remoteKey | default "external-dns-cloudflare" }}
        property: {{ .Values.secrets.cloudflare.property | default "api-token" }}
{{- end }}
{{- if .Values.secrets.aws.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-aws
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: external-dns-aws
  data:
    - secretKey: access-key-id
      remoteRef:
        key: {{ .Values.secrets.aws.remoteKey | default "external-dns-aws" }}
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: {{ .Values.secrets.aws.remoteKey | default "external-dns-aws" }}
        property: secret-access-key
{{- end }}
