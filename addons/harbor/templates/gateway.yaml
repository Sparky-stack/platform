{{- /* Gateway `harbor` terminating TLS with harbor-tls on registry.host's port, plus TrafficPolicy lifting Envoy's 15s route timeout for layer transfers. */ -}}
{{- $g := .Values.gateway }}
{{- $port := regexFind ":[0-9]+$" .Values.registry.host | trimPrefix ":" | default "443" }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ $g.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: {{ $port }}
      hostname: {{ include "harbor-addon.hostname" . | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - { group: "", kind: Secret, name: {{ .Values.pki.tlsSecret }} }
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ $g.routeName }}-timeouts
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: {{ $g.routeName }} }
  timeouts:
    request: {{ $g.requestTimeout }}
    streamIdle: {{ $g.streamIdleTimeout }}
