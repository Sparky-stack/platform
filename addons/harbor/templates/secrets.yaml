{{- /*
Secret harbor-platform from ClusterSecretStore `platform` (values.yaml "secrets"): every key the Harbor chart would
otherwise generate per render, the admin password, the registry htpasswd (ESO sprig htpasswd: a new bcrypt salt per
refresh, same password), robot secrets and the GHCR credentials for proxy cache + replication.
*/ -}}
{{- $k := .Values.secrets.remoteKey }}
{{- $g := .Values.secrets.ghcrKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"     # before the Harbor workloads (they read it at start)
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.store is required" .Values.secrets.store }}
  target:
    name: {{ .Values.secrets.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        HARBOR_ADMIN_PASSWORD: '{{`{{ .adminPassword }}`}}'
        secretKey: '{{`{{ .secretKey }}`}}'
        secret: '{{`{{ .coreSecret }}`}}'
        CSRF_KEY: '{{`{{ .csrfKey }}`}}'
        JOBSERVICE_SECRET: '{{`{{ .jobserviceSecret }}`}}'
        REGISTRY_HTTP_SECRET: '{{`{{ .registryHttpSecret }}`}}'
        REGISTRY_PASSWD: '{{`{{ .registryPassword }}`}}'
        REGISTRY_HTPASSWD: '{{`{{ htpasswd "harbor_registry_user" .registryPassword }}`}}'
        POSTGRES_PASSWORD: '{{`{{ .databasePassword }}`}}'
        password: '{{`{{ .databasePassword }}`}}'
        {{- range .Values.config.robots }}
        robot-{{ .name }}: '{{`{{ index . "`}}{{ .secretProperty }}{{`" }}`}}'
        {{- end }}
        ghcr-username: '{{`{{ .ghcrUsername }}`}}'
        ghcr-token: '{{`{{ .ghcrToken }}`}}'
  data:
    - { secretKey: adminPassword, remoteRef: { key: {{ $k }}, property: admin-password } }
    - { secretKey: secretKey, remoteRef: { key: {{ $k }}, property: secret-key } }
    - { secretKey: coreSecret, remoteRef: { key: {{ $k }}, property: core-secret } }
    - { secretKey: csrfKey, remoteRef: { key: {{ $k }}, property: csrf-key } }
    - { secretKey: jobserviceSecret, remoteRef: { key: {{ $k }}, property: jobservice-secret } }
    - { secretKey: registryHttpSecret, remoteRef: { key: {{ $k }}, property: registry-http-secret } }
    - { secretKey: registryPassword, remoteRef: { key: {{ $k }}, property: registry-password } }
    - { secretKey: databasePassword, remoteRef: { key: {{ $k }}, property: database-password } }
    {{- range .Values.config.robots }}
    - { secretKey: {{ .secretProperty }}, remoteRef: { key: {{ $k }}, property: {{ .secretProperty }} } }
    {{- end }}
    - { secretKey: ghcrUsername, remoteRef: { key: {{ $g }}, property: username } }
    - { secretKey: ghcrToken, remoteRef: { key: {{ $g }}, property: token } }
