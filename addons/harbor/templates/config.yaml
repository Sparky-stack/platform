{{- /* Harbor desired state as provider-upjet-harbor managed resources in sync wave 1 after Harbor workloads (docs/build-plane.md "Harbor"). */ -}}
{{- $c := .Values.config }}
{{- $ns := .Release.Namespace }}
{{- $secret := .Values.secrets.secretName }}
{{- $ghcr := ne (toString .Values.secrets.ghcrKey) "" }}
{{- define "harbor-addon.mrMeta" -}}
annotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  argocd.argoproj.io/sync-wave: "1"
{{- end }}
{{- define "harbor-addon.providerRef" -}}
providerConfigRef: { kind: ProviderConfig, name: harbor }
{{- end }}
{{- /* Projects and registries hold data or are referenced by projects: never deleted from Harbor (removing an entry
orphans the object; delete it in the UI if intended). */ -}}
{{- define "harbor-addon.keep" -}}
managementPolicies: [Observe, Create, Update, LateInitialize]
{{- end }}
{{- /* Registries: every proxy-cache upstream + every replication source. */ -}}
{{- $regNames := list }}
{{- range .Values.registry.proxyCache }}{{ $regNames = append $regNames .upstream }}{{ end }}
{{- range $c.replication }}{{ $regNames = append $regNames .endpoint }}{{ end }}
{{- $proxy := list }}{{ range .Values.registry.proxyCache }}{{ $proxy = append $proxy .project }}{{ end }}
# Admin credential for the provider: key provider-credentials of Secret {{ $secret }} (templates/secrets.yaml, store key
# {{ .Values.secrets.remoteKey }}). Namespaced: only managed resources in ns {{ $ns }} can use it.
apiVersion: harbor.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: harbor
  namespace: {{ $ns }}
  {{- include "harbor-addon.mrMeta" . | nindent 2 }}
spec:
  url: http://harbor-core.{{ $ns }}.svc   # Harbor core in-cluster (internal TLS off); the provider runs in crossplane-system
  credentials:
    source: Secret
    secretRef: { namespace: {{ $ns }}, name: {{ $secret }}, key: provider-credentials }
{{- range $n := $regNames | uniq }}
{{- $e := index $c.endpoints $n }}
---
apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Registry
metadata:
  name: {{ $n }}
  namespace: {{ $ns }}
  {{- include "harbor-addon.mrMeta" . | nindent 2 }}
spec:
  {{- include "harbor-addon.providerRef" . | nindent 2 }}
  {{- include "harbor-addon.keep" . | nindent 2 }}
  forProvider:
    name: {{ $n }}
    providerName: {{ $e.type }}
    endpointUrl: {{ $e.url }}
    description: platform
    insecure: false
    {{- if and (eq (toString $e.credentials) "ghcr") $ghcr }}
    accessId: {{ $.Values.secrets.ghcrUsername | quote }}
    accessSecretSecretRef: { name: {{ $secret }}, key: ghcr-token }
    {{- end }}
{{- end }}
{{- /* Projects: apps (in-cluster builds), every replication target, every proxy cache. All private: the nodes robot
pulls (a proxy cache with GHCR credentials would otherwise republish private packages anonymously). */ -}}
{{- $projects := list (dict "name" .Values.registry.appsProject "scan" $c.apps.autoScan "cosign" $c.apps.contentTrustCosign "security" (ternary $c.apps.severity "" $c.apps.preventVulnerable)) }}
{{- range $c.replication }}{{ $projects = append $projects (dict "name" .destProject "scan" $c.apps.autoScan) }}{{ end }}
{{- range .Values.registry.proxyCache }}{{ $projects = append $projects (dict "name" .project "scan" false "registry" .upstream) }}{{ end }}
{{- range $p := $projects }}
---
apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Project
metadata:
  name: {{ $p.name }}
  namespace: {{ $ns }}
  {{- include "harbor-addon.mrMeta" . | nindent 2 }}
spec:
  {{- include "harbor-addon.providerRef" . | nindent 2 }}
  {{- include "harbor-addon.keep" . | nindent 2 }}
  forProvider:
    name: {{ $p.name }}
    public: false
    vulnerabilityScanning: {{ $p.scan }}     # scan on push (Trivy)
    {{- if hasKey $p "cosign" }}
    enableContentTrustCosign: {{ $p.cosign }}
    {{- end }}
    {{- with $p.security }}
    deploymentSecurity: {{ . }}         # prevent pulls of artifacts with vulnerabilities of this severity or worse
    {{- end }}
    storageQuota: {{ $c.storageLimitGiB }}
    {{- with $p.registry }}
    registryIdRef: { name: {{ . }} }    # proxy cache of this upstream
    {{- end }}
{{- end }}
{{- range $r := $c.replication }}
---
apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Replication
metadata:
  name: {{ $r.name }}
  namespace: {{ $ns }}
  {{- include "harbor-addon.mrMeta" . | nindent 2 }}
spec:
  {{- include "harbor-addon.providerRef" . | nindent 2 }}
  forProvider:
    name: {{ $r.name }}
    action: pull
    registryIdRef: { name: {{ $r.endpoint }} }
    destNamespace: {{ $r.destProject }}
    destNamespaceReplace: 1
    {{- /* A credential-less endpoint (no secrets.ghcrKey) cannot list packages: the rule exists, disabled. */}}
    enabled: {{ and $r.enabled (or $ghcr (not (index $c.endpoints $r.endpoint).credentials)) }}
    schedule: {{ $r.cron | quote }}
    override: true
    speed: -1
    copyByChunk: false
    filters:
      {{- range $r.filters }}
      - {{ .type }}: {{ .value | quote }}
      {{- end }}
{{- end }}
{{- /* System robot accounts (robot$<name>). Their secret comes from the store (secretSecretRef), so every consumer reads
the same value from the store; a changed store value is set on the robot at the next reconcile. */ -}}
{{- $pullAccess := list (list "repository" "pull") (list "repository" "list") (list "artifact" "read") (list "artifact" "list") (list "tag" "list") }}
{{- $pushAccess := concat $pullAccess (list (list "repository" "push") (list "tag" "create") (list "scan" "read") (list "sbom" "read")) }}
{{- range $r := $c.robots }}
{{- $perms := list }}
{{- range $p := $r.push }}{{ $perms = append $perms (dict "project" $p "access" $pushAccess) }}{{ end }}
{{- range $p := $r.pull }}
{{- if eq $p "proxyCache" }}
{{- range $proxy }}{{ $perms = append $perms (dict "project" . "access" $pullAccess) }}{{ end }}
{{- else }}
{{- $perms = append $perms (dict "project" $p "access" $pullAccess) }}
{{- end }}
{{- end }}
---
apiVersion: robot.harbor.m.crossplane.io/v1alpha1
kind: Account
metadata:
  name: {{ $r.name }}
  namespace: {{ $ns }}
  {{- include "harbor-addon.mrMeta" . | nindent 2 }}
spec:
  {{- include "harbor-addon.providerRef" . | nindent 2 }}
  forProvider:
    name: {{ $r.name }}
    description: {{ $r.description | quote }}
    level: system
    duration: -1                        # never expires
    disable: false
    secretSecretRef: { name: {{ $secret }}, key: robot-{{ $r.name }} }
    permissions:
      {{- range $perms }}
      - kind: project
        namespace: {{ .project }}
        access:
          {{- range .access }}
          - { resource: {{ index . 0 }}, action: {{ index . 1 }} }
          {{- end }}
      {{- end }}
{{- end }}
{{- /* The system CVE allowlist: rendered only when non-empty (the provider requires a non-empty list); a fresh Harbor
starts with an empty one. */ -}}
{{- with $c.cveAllowlist }}
---
apiVersion: config.harbor.m.crossplane.io/v1alpha1
kind: Security
metadata:
  name: system-cve-allowlist
  namespace: {{ $ns }}
  {{- include "harbor-addon.mrMeta" $ | nindent 2 }}
spec:
  {{- include "harbor-addon.providerRef" $ | nindent 2 }}
  forProvider:
    cveAllowlist: {{ toYaml . | nindent 6 }}
{{- end }}
