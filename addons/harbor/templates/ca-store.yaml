{{- /*
ClusterSecretStore mgmt-harbor: read-only, name-scoped access to Secret harbor/harbor-ca-bundle (templates/pki.yaml),
whose ca.crt is the registry CA's PUBLIC certificate. ESO's kubernetes provider reads a remoteRef with one GET and
validates the store with a SelfSubjectRulesReview that accepts a name-scoped get rule, so no list/watch and no other
Secret of this namespace (admin password, serving key) is reachable. Consumers: charts/cluster capi-registries.yaml
(ns fleet, node bootstrap) and the build ClusterWorkflows (workflows-<org ns>, push/scan/sign trust).
*/ -}}
{{- $p := .Values.caPublic }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $p.secretName }}]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-{{ $p.store }}
  namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-{{ $p.store }} }
subjects:
  - { kind: ServiceAccount, name: eso-{{ $p.store }}, namespace: {{ .Release.Namespace }} }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $p.store }}
spec:
  conditions:
    - namespaces: {{ toJson $p.namespaces }}
    {{- with $p.namespaceRegexes }}
    - namespaceRegexes: {{ toJson . }}
    {{- end }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: eso-{{ $p.store }}
          namespace: {{ .Release.Namespace }}
