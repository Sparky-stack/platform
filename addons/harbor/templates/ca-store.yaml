{{- /*
ClusterSecretStore mgmt-harbor: read-only, name-scoped access to Secret harbor/harbor-ca-bundle (templates/pki.yaml),
whose ca.crt is the registry CA's PUBLIC certificate. ESO's kubernetes provider reads a remoteRef with one GET and
validates the store with a SelfSubjectRulesReview that accepts a name-scoped get rule, so no list/watch and no other
Secret of this namespace (admin password, serving key) is reachable. Consumers: charts/cluster capi-registries.yaml
(ns fleet, node bootstrap) and the build ClusterWorkflows (workflows-<org ns>, push/scan/sign trust).
*/ -}}
{{- $p := .Values.caPublic }}
{{- include "koorikla-lib.esoSecretReader" (dict "name" $p.store "secret" $p.secretName "namespace" .Release.Namespace) }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $p.store }}
spec:
  conditions:
    - namespaces: {{ toJson $p.namespaces }}
    {{- with $p.namespaceRegexes }}
    - namespaceRegexes: {{ toJson . }}
    {{- end }}
  provider:
    {{- include "koorikla-lib.esoKubernetesProvider" (dict "remoteNamespace" .Release.Namespace "serviceAccount" (printf "eso-%s" $p.store) "clusterStore" true "namespace" .Release.Namespace) | nindent 4 }}
