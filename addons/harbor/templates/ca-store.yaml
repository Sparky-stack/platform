{{- /* ClusterSecretStore mgmt-harbor: name-scoped GET of Secret harbor/harbor-ca-bundle (public ca.crt only) for fleet and workflows-* (docs/build-plane.md). */ -}}
{{- $p := .Values.caPublic }}
{{- include "koorikla-lib.esoSecretReader" (dict "name" $p.store "secret" $p.secretName
    "namespace" .Release.Namespace) }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $p.store }}
spec:
  conditions:
    - namespaces: {{ toJson $p.namespaces }}
    {{- with $p.namespaceRegexes }}
    - namespaceRegexes: {{ toJson . }}
    {{- end }}
  provider:
    {{- include "koorikla-lib.esoKubernetesProvider" (dict "remoteNamespace" .Release.Namespace
      "serviceAccount" (printf "eso-%s" $p.store) "clusterStore" true "namespace" .Release.Namespace) | nindent 4 }}
