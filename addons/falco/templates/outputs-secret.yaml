{{- /*
Optional falcosidekick outputs, from the cluster's secret store (never committed). Sidekick reads each key through an
optional secretKeyRef env var, so a disabled output has no env var and stays off.
  escalation  key falco-webhook (url, token) -> WEBHOOK_ADDRESS, WEBHOOK_CUSTOMHEADERS "Authorization:Bearer <token>",
              WEBHOOK_MINIMUMPRIORITY (contract: docs/observability.md "Falco response")
  slack       key falco-slack (webhook-url)  -> SLACK_WEBHOOKURL, SLACK_MINIMUMPRIORITY
*/ -}}
{{- if or .Values.escalation.enabled .Values.slack.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-outputs
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secretStore is required" .Values.secretStore }}
  target:
    name: falcosidekick-outputs
    template:
      engineVersion: v2
      data:
        {{- if .Values.escalation.enabled }}
        WEBHOOK_ADDRESS: {{ `"{{ .webhookUrl }}"` }}
        WEBHOOK_CUSTOMHEADERS: {{ `"Authorization:Bearer {{ .webhookToken }}"` }}
        WEBHOOK_MINIMUMPRIORITY: {{ .Values.escalation.minimumPriority | quote }}
        {{- end }}
        {{- if .Values.slack.enabled }}
        SLACK_WEBHOOKURL: {{ `"{{ .slackUrl }}"` }}
        SLACK_MINIMUMPRIORITY: {{ .Values.slack.minimumPriority | quote }}
        {{- end }}
  data:
    {{- if .Values.escalation.enabled }}
    - secretKey: webhookUrl
      remoteRef: { key: {{ .Values.escalation.remoteKey }}, property: url }
    - secretKey: webhookToken
      remoteRef: { key: {{ .Values.escalation.remoteKey }}, property: token }
    {{- end }}
    {{- if .Values.slack.enabled }}
    - secretKey: slackUrl
      remoteRef: { key: {{ .Values.slack.remoteKey }}, property: webhook-url }
    {{- end }}
{{- end }}
