{{- /*
falcosidekick outputs that carry credentials, never committed. Sidekick reads each key through an optional secretKeyRef
env var (falco.falcosidekick.config.extraEnv), so an output without its Secret has no env var and stays off.
  falcosidekick-escalation  WEBHOOK_ADDRESS (<url>/<cluster>), WEBHOOK_CUSTOMHEADERS "Authorization:Bearer <token>"
                            with this cluster's own token (contract: docs/observability.md "Falco response").
                            Workload clusters (escalation.store ""): delivered by mgmt (charts/cluster ClusterResourceSet
                            <cluster>-falco-escalation); nothing here, the cluster never sees the store key.
                            mgmt (escalation.store platform): rendered here from key falco-webhook (url, token).
  falcosidekick-outputs     SLACK_WEBHOOKURL, SLACK_MINIMUMPRIORITY from key falco-slack (webhook-url), when enabled.
The per-cluster token is sha256("<cluster>:<token>") of the store key's token: the same expression as addon
argo-events (ae.falcoToken), which accepts it only on POST <url>/<cluster> (hack/tests/test_falco_tokens.sh).
*/ -}}
{{- if and .Values.escalation.enabled .Values.escalation.store }}
{{- $name := required "cluster.name is required (generated by the addon ApplicationSet)" .Values.cluster.name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-escalation
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.escalation.store }}
  target:
    name: falcosidekick-escalation
    template:
      engineVersion: v2
      data:   # gitleaks:allow: ESO template; the derived per-cluster token only, never the store's token
        WEBHOOK_ADDRESS: {{ printf "{{ printf \"%%s/%%s\" (.url | trimSuffix \"/\") %s }}" (quote $name) | quote }}
        WEBHOOK_CUSTOMHEADERS: {{ printf "Authorization:Bearer {{ printf \"%%s:%%s\" %s .token | sha256sum }}" (quote $name) | quote }}
  data:
    - secretKey: url
      remoteRef: { key: {{ .Values.escalation.remoteKey }}, property: url }
    - secretKey: token
      remoteRef: { key: {{ .Values.escalation.remoteKey }}, property: token }
{{- end }}
{{- if .Values.slack.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-outputs
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secretStore is required" .Values.secretStore }}
  target:
    name: falcosidekick-outputs
    template:
      engineVersion: v2
      data:
        SLACK_WEBHOOKURL: {{ `"{{ .slackUrl }}"` }}
        SLACK_MINIMUMPRIORITY: {{ .Values.slack.minimumPriority | quote }}
  data:
    - secretKey: slackUrl
      remoteRef: { key: {{ .Values.slack.remoteKey }}, property: webhook-url }
{{- end }}
