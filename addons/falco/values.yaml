# Falco 0.45 (chart 9.2.2) on every cluster (mgmt + workload), driver modern_ebpf (CO-RE, no kernel module, no driver
# loader), + falcosidekick (fan-out) + Falco Talon 0.3 (chart 0.5.0, response engine, workload clusters only).
# docs/observability.md "Falco" / "Falco response".
#
#   Falco (DaemonSet)  default rules (falcoctl: falco-rules) + platform rules below; JSON alerts on stdout (-> Fluent Bit
#                      -> OpenSearch on mgmt, next to the app logs) and HTTP -> falcosidekick
#   falcosidekick      talon       -> Falco Talon (actions on OpenChoreo app namespaces dp-*)
#                      cloudevents -> telemetry collector logs pipeline (Datadog overlay fans it out)
#                      otlp.metrics-> telemetry collector metrics pipeline (alert counters -> Prometheus on mgmt)
#                      webhook     -> escalation endpoint on mgmt (addon argo-events, POST /falco, >= critical)
#                      slack       -> OFF until `slack.enabled`
#   Falco Talon        crypto miner -> label + terminate (enabled); shell in app container -> label only
#
# Local caveat: all k3d/CAPD node containers share the host kernel, so every cluster's Falco sees every container's
# syscalls on the machine (other clusters' pods show up without k8s metadata). Noisy locally only; on real nodes each
# Falco sees its own node.

# --- generated by the addon ApplicationSet (defaults so `helm template` works standalone) ---------------------------
cluster:
  name: default
  role: workload
  environment: development

# --- platform glue (templates/) -------------------------------------------------------------------------------------
# Optional falcosidekick outputs from the cluster's secret store (mgmt: `platform`, workload: `default`; set per role).
# Each renders into Secret falcosidekick-outputs, which sidekick reads through optional secretKeyRef env vars
# (falco.falcosidekick.config.extraEnv), so a disabled output simply has no env var.
secretStore: default
escalation:
  enabled: true                  # falco-webhook: properties url, token -> addon argo-events on mgmt (docs/observability.md "Falco response")
  remoteKey: falco-webhook
  minimumPriority: critical
slack:
  enabled: false                 # falco-slack: property webhook-url
  remoteKey: falco-slack
  minimumPriority: warning

falco:
  fullnameOverride: falco        # stable names regardless of the Argo release name
  driver:
    enabled: true
    kind: modern_ebpf
    loader:
      enabled: false             # modern eBPF is built into Falco (CO-RE): no driver download/build init container
  tty: false
  resources:                     # upstream requests 100m/512Mi, limits 1/1Gi
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: "1", memory: 768Mi }
  collectors:
    containerEngine:
      engines:
        docker:
          enabled: false         # mgmt k3d nodes mount the HOST docker.sock (for CAPD): don't enrich from it
        podman:
          enabled: false
    kubernetes:
      enabled: false             # VERIFY container plugin fills k8s.* via the k3s CRI socket. k8smeta collector off: the container plugin already adds k8s.ns.name / k8s.pod.name
  falco:
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    priority: notice
    http_output:
      enabled: true
      url: http://falco-falcosidekick:2801   # == falcosidekick.fullnameOverride
  customRules:
    platform-rules.yaml: |-
      # Platform rules (koorikla/platform addons/falco). App namespaces = OpenChoreo data-plane namespaces
      # dp-<org>-<project>-<env>-<hash>. Talon acts on these rule names (falco-talon.config.rulesOverride).
      - list: platform_namespaces
        items: [kube-system, kube-public, kube-node-lease, local-path-storage, falco, telemetry, obi, cert-manager,
                external-secrets, argocd, fleet, capi-system, capi-operator-system, capd-system, caaph-system,
                capi-k3s-bootstrap-system, capi-k3s-control-plane-system, capa-system, caph-system, thunder,
                openchoreo-system, openchoreo-control-plane, openchoreo-data-plane, openchoreo-observability-plane,
                openchoreo-workflow-plane, cilium, istio-system, kyverno, argo-events]
      - macro: platform_app_namespace
        condition: (k8s.ns.name startswith "dp-")

      - rule: Platform shell in app container
        desc: An interactive or scripted shell started inside a container of an OpenChoreo app namespace.
        condition: >
          spawned_process and container and platform_app_namespace
          and proc.name in (ash, bash, csh, ksh, sh, tcsh, zsh, dash)
        output: >
          Shell in app container (ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name shell=%proc.name
          parent=%proc.pname cmdline=%proc.cmdline user=%user.name image=%container.image.repository)
        priority: WARNING
        tags: [platform, container, shell, mitre_execution, T1059]

      - rule: Platform write below etc
        desc: A file below /etc opened for writing in a container outside the platform namespaces.
        condition: >
          open_write and container and fd.name startswith /etc/
          and not k8s.ns.name in (platform_namespaces)
          and not proc.name in (update-ca-certi, ca-certificates, nginx-entrypoi)
        output: >
          Write below /etc in container (file=%fd.name ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
          proc=%proc.name cmdline=%proc.cmdline image=%container.image.repository)
        priority: ERROR
        tags: [platform, container, filesystem, mitre_persistence, T1543]

      - list: platform_miner_binaries
        items: [xmrig, xmr-stak, minerd, cpuminer, ccminer, cgminer, bfgminer, ethminer, nbminer, t-rex, lolminer,
                nanominer, phoenixminer, teamredminer, gminer, srbminer]
      - list: platform_miner_ports
        items: [3333, 4444, 5555, 6666, 7777, 8888, 9999, 14433, 14444, 45560, 45700]
      - rule: Platform crypto miner indicators
        desc: Known miner binary, stratum URL on the command line, or connection to a mining-pool port, in an app namespace.
        condition: >
          container and platform_app_namespace and (
            (spawned_process and (proc.name in (platform_miner_binaries)
              or proc.cmdline contains "stratum+tcp" or proc.cmdline contains "stratum+ssl"
              or proc.cmdline contains "stratum2+tcp"))
            or (outbound and fd.sport in (platform_miner_ports))
          )
        output: >
          Crypto miner indicator (ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name proc=%proc.name
          cmdline=%proc.cmdline connection=%fd.name image=%container.image.repository)
        priority: CRITICAL
        tags: [platform, container, cryptomining, mitre_impact, T1496]

  falcosidekick:
    enabled: true
    fullnameOverride: falco-falcosidekick
    replicaCount: 1
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }
    webui:
      enabled: false
    config:
      # Talon: every event; Talon itself only acts on the platform rule names (rulesOverride below).
      talon:
        address: http://falco-talon:2803
        minimumpriority: warning
      # Telemetry collector of addon telemetry (workload clusters; values/role-mgmt.yaml blanks these on mgmt).
      cloudevents:
        address: http://telemetry-collector.telemetry.svc.cluster.local:8088/falco
        minimumpriority: notice
      otlp:
        metrics:
          endpoint: http://telemetry-collector.telemetry.svc.cluster.local:4317
          protocol: grpc
          checkcert: false
          minimumpriority: notice
      # webhook / slack: set from Secret falcosidekick-outputs (templates/outputs-secret.yaml) when enabled:
      extraEnv:
        - name: WEBHOOK_ADDRESS
          valueFrom: { secretKeyRef: { name: falcosidekick-outputs, key: WEBHOOK_ADDRESS, optional: true } }
        - name: WEBHOOK_CUSTOMHEADERS
          valueFrom: { secretKeyRef: { name: falcosidekick-outputs, key: WEBHOOK_CUSTOMHEADERS, optional: true } }
        - name: WEBHOOK_MINIMUMPRIORITY
          valueFrom: { secretKeyRef: { name: falcosidekick-outputs, key: WEBHOOK_MINIMUMPRIORITY, optional: true } }
        - name: SLACK_WEBHOOKURL
          valueFrom: { secretKeyRef: { name: falcosidekick-outputs, key: SLACK_WEBHOOKURL, optional: true } }
        - name: SLACK_MINIMUMPRIORITY
          valueFrom: { secretKeyRef: { name: falcosidekick-outputs, key: SLACK_MINIMUMPRIORITY, optional: true } }

  responseActions:
    enabled: false               # the falco chart's bundled Talon is 0.4.x; this addon pins falco-talon 0.5.0 directly

# --- Falco Talon: scoped responses (rules match only the platform rules, which fire only in dp-* namespaces) ---------
falco-talon:
  enabled: true
  replicaCount: 1                # upstream 2 (+ leader election); one is enough per cluster here
  image:
    pullPolicy: IfNotPresent     # upstream Always
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  rbac:                          # platform: least privilege for label / terminate / (commented) isolate
    namespaces: []
    pods: [get, list, update, patch, delete]
    podsEphemeralcontainers: []
    nodes: []
    podsLog: []
    podsExec: []
    podsEviction: [get, create]
    events: [get, create, update, patch]
    daemonsets: []
    deployments: []
    replicasets: [get]
    statefulsets: [get]
    networkpolicies: [get, create, update, patch]
    caliconetworkpolicies: []
    ciliumnetworkpolicies: []
    roles: []
    clusterroles: []
    configmaps: []
    secrets: []
    leases: [get, create, update, patch, watch]
  config:
    defaultNotifiers: [k8sevents]
    # Appended to the chart's rules.yaml. VERIFY Talon 0.3 rule field `dry_run`. Per-environment dry run: override this whole value with `dry_run: true` on
    # the rules (installations/<inst>/addons/falco/env-<env>.yaml; example: installations/local/addons/falco/).
    rulesOverride: |
      - action: Platform label suspicious
        actionner: kubernetes:label
        parameters:
          labels:
            platform.koorikla.io/falco: suspicious

      - action: Platform terminate pod
        actionner: kubernetes:terminate
        parameters:
          ignore_daemonsets: true
          ignore_statefulsets: false
          grace_period_seconds: 0

      # - action: Platform isolate pod      # deny all ingress/egress except DNS for the labelled pod
      #   actionner: kubernetes:networkpolicy
      #   parameters:
      #     allow_cidr: []                # VERIFY kubernetes:networkpolicy parameters

      - rule: Crypto miner in app namespace
        description: Label and kill the pod (its controller recreates it; repeated hits stay visible in OpenSearch).
        match:
          rules:
            - Platform crypto miner indicators
        dry_run: false
        actions:
          - action: Platform label suspicious
          - action: Platform terminate pod

      - rule: Shell in app container
        description: Label only (an operator may be debugging); isolate by uncommenting the action below.
        match:
          rules:
            - Platform shell in app container
        dry_run: false
        actions:
          - action: Platform label suspicious
          # - action: Platform isolate pod
