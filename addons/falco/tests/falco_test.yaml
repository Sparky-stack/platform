suite: falco addon
templates:
  - templates/outputs-secret.yaml
  - charts/falco/templates/configmap.yaml
  - charts/falco/templates/rules-configmap.yaml
  - charts/falco-talon/templates/configmap.yaml
  - charts/falco/charts/falcosidekick/templates/deployment.yaml
  - charts/falco/charts/falcosidekick/templates/secrets.yaml
tests:
  - it: falco.yaml uses modern_ebpf and sends to falcosidekick
    template: charts/falco/templates/configmap.yaml
    asserts:
      - matchRegex: { path: 'data["falco.yaml"]', pattern: 'kind: modern_ebpf' }
      - matchRegex: { path: 'data["falco.yaml"]', pattern: 'url: http://falco-falcosidekick:2801' }
  - it: platform rules are scoped to OpenChoreo app namespaces
    template: charts/falco/templates/rules-configmap.yaml
    asserts:
      - matchRegex: { path: 'data["platform-rules.yaml"]', pattern: 'condition: \(k8s.ns.name startswith "dp-"\)' }
      - matchRegex: { path: 'data["platform-rules.yaml"]', pattern: 'rule: Platform crypto miner indicators' }
      - matchRegex: { path: 'data["platform-rules.yaml"]', pattern: 'rule: Platform shell in app container' }
      - matchRegex: { path: 'data["platform-rules.yaml"]', pattern: 'rule: Platform write below etc' }
  - it: Talon terminates crypto miners and only labels shells
    template: charts/falco-talon/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: '- Platform crypto miner indicators\n\s+dry_run: false\n\s+actions:\n\s+- action: Platform label suspicious\n\s+- action: Platform terminate pod'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: '- Platform shell in app container\n\s+dry_run: false\n\s+actions:\n\s+- action: Platform label suspicious\n\s+# - action'
  - it: workload clusters render no escalation secret and never read the store key (mgmt delivers their token)
    template: templates/outputs-secret.yaml
    set:
      cluster.name: dev1
    asserts:
      - hasDocuments: { count: 0 }
  - it: no output secret on mgmt either when escalation and slack are off
    template: templates/outputs-secret.yaml
    values: [../values/role-mgmt.yaml]
    set:
      cluster.name: mgmt
      escalation.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
  - it: mgmt escalation - its own endpoint and derived token from store platform key falco-webhook, no slack
    template: templates/outputs-secret.yaml
    values: [../values/role-mgmt.yaml]
    set:
      cluster.name: mgmt
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: falcosidekick-escalation }
      - equal: { path: spec.secretStoreRef.name, value: platform }
      - equal: { path: spec.target.template.data.WEBHOOK_ADDRESS, value: '{{ printf "%s/%s" (.url | trimSuffix "/") "mgmt" }}' }
      - equal: { path: spec.target.template.data.WEBHOOK_CUSTOMHEADERS, value: 'Authorization:Bearer {{ printf "%s:%s" "mgmt" .token | sha256sum }}' }
      - equal:
          path: spec.data
          value:
            - { secretKey: url, remoteRef: { key: falco-webhook, property: url } }
            - { secretKey: token, remoteRef: { key: falco-webhook, property: token } }
  - it: mgmt reads slack from the platform store, in its own secret
    template: templates/outputs-secret.yaml
    values: [../values/role-mgmt.yaml]
    set:
      cluster.name: mgmt
      slack.enabled: true
    documentSelector: { path: metadata.name, value: falcosidekick-outputs }
    asserts:
      - equal: { path: spec.secretStoreRef.name, value: platform }
      - equal: { path: spec.data, value: [{ secretKey: slackUrl, remoteRef: { key: falco-slack, property: webhook-url } }] }
  - it: sidekick reads the webhook from Secret falcosidekick-escalation (optional) and escalates critical and above
    template: charts/falco/charts/falcosidekick/templates/deployment.yaml
    set:
      cluster.name: dev1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: WEBHOOK_CUSTOMHEADERS, valueFrom: { secretKeyRef: { name: falcosidekick-escalation, key: WEBHOOK_CUSTOMHEADERS, optional: true } } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: WEBHOOK_ADDRESS, valueFrom: { secretKeyRef: { name: falcosidekick-escalation, key: WEBHOOK_ADDRESS, optional: true } } }
  - it: every event names its cluster (customfields from the ApplicationSet parameter)
    template: charts/falco/charts/falcosidekick/templates/deployment.yaml
    set:
      falco.falcosidekick.config.customfields: cluster:dev1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: CUSTOMFIELDS, value: cluster:dev1 }
  - it: webhook minimum priority is critical
    template: charts/falco/charts/falcosidekick/templates/secrets.yaml
    asserts:
      - equal: { path: data.WEBHOOK_MINIMUMPRIORITY, value: Y3JpdGljYWw= }

  - it: local installation - rules skip containers without k8s metadata (other clusters' pods on the shared kernel)
    template: charts/falco/templates/rules-configmap.yaml
    values: [../../../installations/local/addons/falco/values.yaml]
    asserts:
      - matchRegex: { path: 'data["zz-local-unattributed.yaml"]', pattern: 'condition: \(container and not k8s.ns.name exists\)' }
      - matchRegex: { path: 'data["zz-local-unattributed.yaml"]', pattern: '- rule: Drop and execute new binary in container\n\s+condition: and not local_unattributed_container\n\s+override:\n\s+condition: append' }
      - matchRegex: { path: 'data["zz-local-unattributed.yaml"]', pattern: '- rule: Contact K8S API Server From Container\n\s+condition: and not local_unattributed_container\n\s+override:\n\s+condition: append' }
      - matchRegex: { path: 'data["zz-local-unattributed.yaml"]', pattern: '- rule: Platform write below etc\n\s+condition: and not local_unattributed_container\n\s+override:\n\s+condition: append' }
      # the platform rules stay as they are; only appends, never a replaced condition or a disabled rule
      - matchRegex: { path: 'data["platform-rules.yaml"]', pattern: 'rule: Platform crypto miner indicators' }
      - notMatchRegex: { path: 'data["zz-local-unattributed.yaml"]', pattern: 'enabled: false|condition: replace|override:\n\s+condition: replace' }
  - it: other installations keep every rule on unattributed containers (no local exception without the overlay)
    template: charts/falco/templates/rules-configmap.yaml
    asserts:
      - notExists: { path: 'data["zz-local-unattributed.yaml"]' }
      - notMatchRegex: { path: 'data["platform-rules.yaml"]', pattern: 'k8s.ns.name exists' }

  - it: CAPD node containers (kindest/node) are excepted from "Drop and execute new binary in container" (escalation storm)
    template: charts/falco/templates/rules-configmap.yaml
    asserts:
      - matchRegex: { path: 'data["platform-rules.yaml"]', pattern: 'condition: \(container.image.repository endswith "kindest/node"\)' }
      - matchRegex: { path: 'data["platform-rules.yaml"]', pattern: '- rule: Drop and execute new binary in container\n\s+condition: and not platform_capd_node_container\n\s+override:\n\s+condition: append' }

  - it: in-cluster build pods are excepted from "Drop and execute new binary in container" only for their own binaries
    template: charts/falco/templates/rules-configmap.yaml
    asserts:
      # exactly two rows, each the full tuple (workflows-* namespace, build image, parent, binary path), appended
      - matchRegex:
          path: 'data["platform-rules.yaml"]'
          pattern: '- rule: Drop and execute new binary in container\n\s+exceptions:\n\s+- name: platform_build_dropped_binaries\n\s+fields: \[k8s\.ns\.name, container\.image\.repository, proc\.pname, proc\.exepath\]\n\s+comps: \[startswith, =, =, glob\]\n\s+values:\n\s+- \[workflows-, docker\.io/moby/buildkit, buildkitd, /home/user/\.local/tmp/qemu-check\*/check\]\n\s+- \[workflows-, docker\.io/library/golang, go, /tmp/go-build\*/b\*/\*\.test\]\n\s+override:\n\s+exceptions: append\n'
      # never a blanket disable or a replaced rule / exception list
      - notMatchRegex: { path: 'data["platform-rules.yaml"]', pattern: 'enabled: false|exceptions: replace|condition: replace' }
