suite: dex OIDC broker for GitHub teams
templates:
  - templates/external-secret.yaml
  - templates/validate.yaml
  - charts/dex/templates/deployment.yaml
  - charts/dex/templates/httproute.yaml
  - charts/dex/templates/rbac.yaml
  - charts/dex/templates/secret.yaml
release:
  name: dex
  namespace: dex
tests:
  - it: ExternalSecret reads GitHub OAuth and Thunder client credentials from platform store
    template: templates/external-secret.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: dex-secrets
      - equal:
          path: spec.secretStoreRef.name
          value: platform
      - contains:
          path: spec.data
          content:
            secretKey: github-client-id
            remoteRef:
              key: github-login
              property: github-client-id
      - contains:
          path: spec.data
          content:
            secretKey: github-client-secret
            remoteRef:
              key: github-login
              property: github-client-secret
      - contains:
          path: spec.data
          content:
            secretKey: thunder-client-secret
            remoteRef:
              key: github-login
              property: thunder-client-secret

  - it: HTTPRoute attaches dex.openchoreo.localhost to the control-plane Gateway
    template: charts/dex/templates/httproute.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: gateway-default
      - equal:
          path: spec.parentRefs[0].namespace
          value: openchoreo-control-plane
      - equal:
          path: spec.hostnames[0]
          value: dex.openchoreo.localhost

  - it: Deployment runs single-replica, digest-pinned, PSS restricted, with env vars from dex-secrets
    template: charts/dex/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/dexidp/dex:v2\.46\.1@sha256:[0-9a-f]{64}$'
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: THUNDER_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: dex-secrets
                key: thunder-client-secret

  - it: memory storage requires no RBAC or CRDs
    template: charts/dex/templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: fails validation when Dex host drifts from openchoreo.controlPlane.host
    template: templates/validate.yaml
    set:
      openchoreo.controlPlane.host: example.com
    asserts:
      - failedTemplate:
          errorPattern: 'dex\.example\.com'

  - it: fails validation when an inline staticClient secret is supplied
    template: templates/validate.yaml
    set:
      dex.config.staticClients:
        - id: thunder
          secret: literal-not-allowed
          redirectURIs:
            - http://thunder.openchoreo.localhost:8080/gate/callback
    asserts:
      - failedTemplate:
          errorPattern: 'must use secretEnv'
  - it: read-only root filesystem keeps a writable /tmp (the image renders its config there)
    template: charts/dex/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: tmp, mountPath: /tmp }
      - contains:
          path: spec.template.spec.volumes
          content: { name: tmp, emptyDir: {} }
