{{- $s := .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $s.store }}
  target:
    name: {{ $s.name }}
  data:
    {{- range $key := list "github-client-id" "github-client-secret" "thunder-client-secret" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $s.remoteKey }}
        property: {{ $key }}
    {{- end }}
