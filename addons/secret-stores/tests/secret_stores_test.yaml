suite: secret-stores glue chart (mgmt and workload stores + repo-creds)
templates:
  - templates/stores.yaml
tests:
  - it: creates platform (scoped to its consumer namespaces), mgmt-fleet, mgmt-openchoreo (fleet-scoped), and repo-creds for kubernetes mgmt
    values:
      - ../values.yaml
      - ../values/role-mgmt.yaml
    set:
      secrets:
        backend: kubernetes
        kubernetes:
          namespace: platform-secrets
    asserts:
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: platform
          any: true
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: mgmt-fleet
          any: true
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: mgmt-openchoreo
          any: true
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: workflows
          any: true
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1
          name: platform-repo-creds
          any: true
      - equal:
          path: spec.conditions[0].namespaces
          value: [argocd, fleet, capa-system, thunder, openchoreo-control-plane, openchoreo-observability-plane, falco, argo-events, harbor, openbao, external-dns, agentgateway-system]
        documentIndex: 3
      - notContains:
          path: spec.conditions[0].namespaces
          content: default
        documentIndex: 3
      - notContains:
          path: spec.conditions[0].namespaces
          content: workflows-default
        documentIndex: 3
      - contains:
          path: spec.conditions[0].namespaces
          content: fleet
        documentIndex: 7
      - contains:
          path: spec.conditions[0].namespaces
          content: argocd
        documentIndex: 7
      - equal:
          path: spec.conditions[0].namespaces[0]
          value: fleet
        documentIndex: 11
      - equal:
          path: metadata.namespace
          value: argocd
        documentIndex: 12
      - equal:
          path: spec.target.template.metadata.labels["argocd.argoproj.io/secret-type"]
          value: repo-creds
        documentIndex: 12
      - equal:
          path: spec.target.template.data.url
          value: https://github.com/koorikla
        documentIndex: 12

  - it: creates AWS SecretsManager platform store on aws mgmt
    values:
      - ../values.yaml
      - ../values/role-mgmt.yaml
    set:
      secrets:
        backend: aws
        aws:
          region: eu-central-1
          role: arn:aws:iam::111111111111:role/platform-external-secrets
    asserts:
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: platform
          any: true
      - equal:
          path: spec.provider.aws.service
          value: SecretsManager
        documentIndex: 1
      - equal:
          path: spec.provider.aws.region
          value: eu-central-1
        documentIndex: 1
      - equal:
          path: spec.provider.aws.auth.jwt.serviceAccountRef.name
          value: eso-aws
        documentIndex: 1
      - contains:
          path: spec.conditions[0].namespaces
          content: argocd
        documentIndex: 1

  - it: creates Vault platform store on vault mgmt
    values:
      - ../values.yaml
      - ../values/role-mgmt.yaml
    set:
      secrets:
        backend: vault
        vault:
          server: https://vault.hetzner.example.com
          path: platform
          version: v2
          auth:
            kubernetes:
              mountPath: kubernetes
              role: external-secrets
    asserts:
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: platform
          any: true
      - equal:
          path: spec.provider.vault.server
          value: https://vault.hetzner.example.com
        documentIndex: 1
      - equal:
          path: spec.provider.vault.path
          value: platform
        documentIndex: 1
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: external-secrets
        documentIndex: 1
      - contains:
          path: spec.conditions[0].namespaces
          content: argocd
        documentIndex: 1

  - it: platform store namespaces are overridable and required
    values:
      - ../values.yaml
      - ../values/role-mgmt.yaml
    set:
      platformStore:
        namespaces: [argocd]
    asserts:
      - equal:
          path: spec.conditions[0].namespaces
          value: [argocd]
        documentIndex: 3

  - it: rejects an empty platformStore.namespaces (the store would be readable from every namespace)
    values:
      - ../values.yaml
      - ../values/role-mgmt.yaml
    set:
      platformStore:
        namespaces: null
    asserts:
      - failedTemplate:
          errorMessage: platformStore.namespaces must list the namespaces allowed to read ClusterSecretStore platform

  - it: creates default ClusterSecretStore on workload clusters
    values:
      - ../values.yaml
      - ../values/role-workload.yaml
    set:
      secrets:
        backend: kubernetes
    asserts:
      - containsDocument:
          kind: Namespace
          apiVersion: v1
          name: openchoreo-secrets
          any: true
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: default
          any: true
      - notFailedTemplate: {}
      - hasDocuments: { count: 5 }   # no store dns while dns.provider is not cloudflare

  # --- ClusterSecretStore dns: the Cloudflare token apart from the tenant store default (invariant 5 exception) -----
  - it: workload + dns.provider cloudflare adds store dns, scoped to external-dns, on its own namespace and identity
    values: [../values.yaml, ../values/role-workload.yaml]
    set: { dns.provider: cloudflare }
    asserts:
      - containsDocument: { kind: Namespace, apiVersion: v1, name: external-dns-credentials, any: true }
      - equal: { path: spec.conditions, value: [{ namespaces: [external-dns] }] }
        documentSelector: { path: metadata.name, value: dns }
      - equal: { path: spec.provider.kubernetes.remoteNamespace, value: external-dns-credentials }
        documentSelector: { path: metadata.name, value: dns }
      - equal: { path: spec.provider.kubernetes.auth.serviceAccount.name, value: eso-workload-dns }
        documentSelector: { path: metadata.name, value: dns }

  - it: store dns is never rendered on mgmt (mgmt uses the scoped platform store)
    values: [../values.yaml, ../values/role-mgmt.yaml]
    set: { dns.provider: cloudflare }
    asserts:
      - notFailedTemplate: {}
      - containsDocument: { kind: ClusterSecretStore, apiVersion: external-secrets.io/v1, name: platform, any: true }
      - notEqual: { path: metadata.name, value: dns }
        documentSelector: { path: kind, value: ClusterSecretStore, matchMany: true }

  - it: rejects a dns credentials namespace equal to the tenant store's
    values: [../values.yaml, ../values/role-workload.yaml]
    set: { dns.provider: cloudflare, secrets.dnsStore.kubernetes.namespace: openchoreo-secrets }
    asserts:
      - failedTemplate: { errorMessage: secrets.dnsStore.kubernetes.namespace must differ from secrets.workloadKubernetes.namespace (the tenant store default reads that one) }

  - it: rejects an empty dnsStore.namespaces (the token would be readable from every namespace)
    values: [../values.yaml, ../values/role-workload.yaml]
    set: { dns.provider: cloudflare, dnsStore.namespaces: [] }
    asserts:
      - failedTemplate: { errorMessage: dnsStore.namespaces must list the namespaces allowed to read ClusterSecretStore dns }

  - it: vault store dns needs its own role, distinct from the tenant store's
    values: [../values.yaml, ../values/role-workload.yaml]
    set: { dns.provider: cloudflare, secrets.backend: vault, secrets.dnsStore.vault.role: external-secrets }
    asserts:
      - failedTemplate: { errorMessage: "dns.provider cloudflare on Vault needs secrets.dnsStore.vault.role: a kubernetes-auth role whose policy reads only the DNS key, distinct from secrets.vault.auth.kubernetes.role (the tenant store default's)" }

  - it: vault store dns authenticates with its own role and service account
    values: [../values.yaml, ../values/role-workload.yaml]
    set: { dns.provider: cloudflare, secrets.backend: vault, secrets.dnsStore.vault.role: external-secrets-dns }
    documentSelector: { path: metadata.name, value: dns }
    asserts:
      - equal: { path: spec.provider.vault.auth.kubernetes.role, value: external-secrets-dns }
      - equal: { path: spec.provider.vault.auth.kubernetes.serviceAccountRef.name, value: eso-vault-dns }
      - equal: { path: spec.conditions, value: [{ namespaces: [external-dns] }] }

  - it: aws store dns needs its own IAM role
    values: [../values.yaml, ../values/role-workload.yaml]
    set: { dns.provider: cloudflare, secrets.backend: aws, secrets.aws.role: "arn:aws:iam::1:role/eso" }
    asserts:
      - failedTemplate: { errorMessage: "dns.provider cloudflare on AWS Secrets Manager needs secrets.dnsStore.aws.role: an IAM role that reads only the DNS key, distinct from secrets.aws.role (the tenant store default's)" }

  - it: aws store dns uses service account eso-aws-dns with the DNS role
    values: [../values.yaml, ../values/role-workload.yaml]
    set: { dns.provider: cloudflare, secrets.backend: aws, secrets.aws.role: "arn:aws:iam::1:role/eso", secrets.dnsStore.aws.role: "arn:aws:iam::1:role/eso-dns" }
    asserts:
      - equal: { path: spec.provider.aws.auth.jwt.serviceAccountRef.name, value: eso-aws-dns }
        documentSelector: { path: metadata.name, value: dns }
      - equal: { path: 'metadata.annotations["eks.amazonaws.com/role-arn"]', value: "arn:aws:iam::1:role/eso-dns" }
        documentSelector: { path: metadata.name, value: eso-aws-dns }

  - it: repo-creds default (auth token) reads username + token and templates password
    values:
      - ../values.yaml
      - ../values/role-mgmt.yaml
    asserts:
      - equal:
          path: spec.data[0].remoteRef.property
          value: username
        documentIndex: 12
      - equal:
          path: spec.data[1].remoteRef.property
          value: token
        documentIndex: 12
      - lengthEqual:
          path: spec.data
          count: 2
        documentIndex: 12
      - exists:
          path: spec.target.template.data.password
        documentIndex: 12
      - notExists:
          path: spec.target.template.data.githubAppPrivateKey
        documentIndex: 12

  - it: repo-creds auth githubApp templates Argo CD GitHub App fields from the same key
    values:
      - ../values.yaml
      - ../values/role-mgmt.yaml
    set:
      repoCreds:
        auth: githubApp
    asserts:
      - equal:
          path: spec.data[0].remoteRef.property
          value: githubAppID
        documentIndex: 12
      - equal:
          path: spec.data[1].remoteRef.property
          value: githubAppInstallationID
        documentIndex: 12
      - equal:
          path: spec.data[2].remoteRef.property
          value: githubAppPrivateKey
        documentIndex: 12
      - lengthEqual:
          path: spec.data
          count: 3
        documentIndex: 12
      - equal:
          path: spec.data[0].remoteRef.key
          value: platform-github
        documentIndex: 12
      - equal:
          path: spec.target.template.data.githubAppPrivateKey
          value: "{{ .githubAppPrivateKey }}"
        documentIndex: 12
      - notExists:
          path: spec.target.template.data.password
        documentIndex: 12

  - it: rejects an unknown repoCreds.auth
    values:
      - ../values.yaml
      - ../values/role-mgmt.yaml
    set:
      repoCreds:
        auth: ssh
    asserts:
      - failedTemplate:
          errorMessage: "repoCreds.auth must be token or githubApp (got ssh)"

  # --- ClusterSecretStore workflows: key-scoped to build + promotion-gate secrets in workflows-* (invariant 5) -------
  - it: creates ClusterSecretStore workflows on kubernetes mgmt with name-scoped GET RBAC and workflows-* conditions
    values: [../values.yaml, ../values/role-mgmt.yaml]
    asserts:
      - equal: { path: spec.conditions, value: [{ namespaceRegexes: ["^workflows-.+$"] }] }
        documentSelector: { path: metadata.name, value: workflows, skipEmptyTemplates: true }
      - equal: { path: spec.provider.kubernetes.remoteNamespace, value: platform-secrets }
        documentSelector: { path: metadata.name, value: workflows }
      - equal: { path: spec.provider.kubernetes.auth.serviceAccount.name, value: eso-workflows }
        documentSelector: { path: metadata.name, value: workflows }
      - equal: { path: automountServiceAccountToken, value: false }
        documentIndex: 13
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              resourceNames: [platform-github-build, cosign-platform, harbor, promotion-gate, promotion-gate-github]
              verbs: [get]
            - apiGroups: [authorization.k8s.io]
              resources: [selfsubjectrulesreviews]
              verbs: [create]
        documentIndex: 14
      - notContains: { path: "rules[0].verbs", content: list }
        documentIndex: 14
      - notContains: { path: "rules[0].verbs", content: watch }
        documentIndex: 14
      - notContains: { path: "rules[0].resourceNames", content: platform-github }
        documentIndex: 14
      - notContains: { path: "rules[0].resourceNames", content: openchoreo }
        documentIndex: 14
      - notContains: { path: "rules[0].resourceNames", content: openbao-unseal }
        documentIndex: 14

  - it: external registry swaps harbor for registry.external.credentialsKey in the workflows Role
    values: [../values.yaml, ../values/role-mgmt.yaml]
    set:
      registry:
        type: external
        external:
          credentialsKey: platform-ghcr
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: [platform-github-build, cosign-platform, promotion-gate, promotion-gate-github, platform-ghcr]
        documentIndex: 14

  - it: rejects a workflows-* namespace in platformStore.namespaces
    values: [../values.yaml, ../values/role-mgmt.yaml]
    set:
      platformStore:
        namespaces: [argocd, workflows-default]
    asserts:
      - failedTemplate:
          errorMessage: 'platformStore.namespaces must not include workflow run namespace "workflows-default": use ClusterSecretStore workflows (key-scoped)'

  - it: rejects an empty workflowStore.namespaceRegexes
    values: [../values.yaml, ../values/role-mgmt.yaml]
    set: { workflowStore.namespaceRegexes: [] }
    asserts:
      - failedTemplate:
          errorMessage: workflowStore.namespaceRegexes must restrict ClusterSecretStore workflows to workflow run namespaces

  - it: rejects a workflowStore.namespaceRegexes entry outside workflows-*
    values: [../values.yaml, ../values/role-mgmt.yaml]
    set: { workflowStore.namespaceRegexes: [".*"] }
    asserts:
      - failedTemplate:
          errorMessage: 'workflowStore.namespaceRegexes entry ".*" must start with ^workflows-'

  - it: rejects an empty workflowStore.keys (would leave Role resourceNames empty)
    values: [../values.yaml, ../values/role-mgmt.yaml]
    set: { workflowStore.keys: [] }
    asserts:
      - failedTemplate:
          errorMessage: workflowStore.keys must list the secret keys ClusterSecretStore workflows may read

  - it: vault store workflows uses its own role and service account, and rejects a role equal to platform's
    values: [../values.yaml, ../values/role-mgmt.yaml]
    set: { secrets.backend: vault, secrets.vault.auth.kubernetes.role: external-secrets, secrets.workflowStore.vault.role: external-secrets }
    asserts:
      - failedTemplate:
          errorMessage: "ClusterSecretStore workflows on Vault needs secrets.workflowStore.vault.role: a kubernetes-auth role whose policy reads only workflowStore.keys, distinct from secrets.vault.auth.kubernetes.role (store platform's)"

  - it: aws store workflows uses service account eso-aws-workflows and rejects a role equal to platform's
    values: [../values.yaml, ../values/role-mgmt.yaml]
    set: { secrets.backend: aws, secrets.aws.role: "arn:aws:iam::1:role/eso", secrets.workflowStore.aws.role: "arn:aws:iam::1:role/eso" }
    asserts:
      - failedTemplate:
          errorMessage: "ClusterSecretStore workflows on AWS Secrets Manager needs secrets.workflowStore.aws.role: an IAM role that reads only workflowStore.keys, distinct from secrets.aws.role (store platform's)"

  - it: store workflows is never rendered on workload clusters
    values: [../values.yaml, ../values/role-workload.yaml]
    asserts:
      - notEqual: { path: metadata.name, value: workflows }
        documentSelector: { path: kind, value: ClusterSecretStore, matchMany: true }
