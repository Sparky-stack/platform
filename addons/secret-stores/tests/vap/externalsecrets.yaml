# Tenant namespace: only SecretStore openbao-tenant (2 pass); every other store reference fails (4). Platform
# namespaces are not matched (namespaceSelector, helm-unittest), so store default stays usable there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ok, namespace: dp-default-demo-development-ad621210 }
spec:
  secretStoreRef: { kind: SecretStore, name: openbao-tenant }
  target: { name: ok }
  data: [{ secretKey: password, remoteRef: { key: db, property: password } }]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ok-default-kind, namespace: dp-default-demo-development-ad621210 }
spec:
  secretStoreRef: { name: openbao-tenant }
  target: { name: ok-default-kind }
  dataFrom: [{ extract: { key: db } }]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: cluster-store, namespace: dp-default-demo-development-ad621210 }
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: default }
  target: { name: cluster-store }
  data: [{ secretKey: password, remoteRef: { key: db } }]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: other-store, namespace: dp-default-demo-development-ad621210 }
spec:
  secretStoreRef: { kind: SecretStore, name: smuggled }
  target: { name: other-store }
  data: [{ secretKey: password, remoteRef: { key: db } }]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: data-sourceref, namespace: dp-default-demo-development-ad621210 }
spec:
  secretStoreRef: { kind: SecretStore, name: openbao-tenant }
  target: { name: data-sourceref }
  data:
    - secretKey: password
      remoteRef: { key: db }
      sourceRef: { storeRef: { kind: ClusterSecretStore, name: default } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: cluster-generator, namespace: dp-default-demo-development-ad621210 }
spec:
  target: { name: cluster-generator }
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: platform } }
