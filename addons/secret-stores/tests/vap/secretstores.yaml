# A SecretStore in a tenant namespace: only Kyverno's background controller may create it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: openbao-tenant, namespace: dp-default-demo-development-ad621210 }
spec:
  provider:
    vault:
      server: https://openbao.example.test:8200
      path: kv-tenant-other
      version: v2
      auth: { jwt: { path: tenants-dev1, role: other } }
