{{- /*
ClusterSecretStore `platform` holds every platform credential (GitHub read + write Apps, GHCR, cloud, OpenChoreo):
only the mgmt namespaces in platformStore.namespaces may reference it. hack/tests/test_secret_store_scope.sh checks
that every rendered ExternalSecret using it is in that list.
*/ -}}
{{- define "secret-stores.platformConditions" -}}
{{- $ns := .Values.platformStore.namespaces | default list -}}
{{- if not $ns }}{{ fail "platformStore.namespaces must list the namespaces allowed to read ClusterSecretStore platform" }}{{ end -}}
conditions:
  - namespaces:
      {{- toYaml $ns | nindent 6 }}
{{- end -}}
{{- $backend := .Values.secrets.backend | default "kubernetes" -}}
{{- if eq .Values.role "mgmt" -}}
{{- if eq $backend "kubernetes" -}}
{{- $platformNs := .Values.secrets.kubernetes.namespace | default "platform-secrets" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-platform
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-platform
  namespace: {{ $platformNs | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-platform
  namespace: {{ $platformNs | quote }}
subjects:
  - kind: ServiceAccount
    name: eso-platform
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-platform
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  {{- include "secret-stores.platformConditions" . | nindent 2 }}
  provider:
    kubernetes:
      remoteNamespace: {{ $platformNs | quote }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: eso-platform
          namespace: {{ .Release.Namespace }}
{{- else if eq $backend "aws" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws
  namespace: {{ .Release.Namespace }}
  {{- if .Values.secrets.aws.role }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.secrets.aws.role | quote }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  {{- include "secret-stores.platformConditions" . | nindent 2 }}
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.aws.region | quote }}
      {{- if .Values.secrets.aws.prefix }}
      prefix: {{ .Values.secrets.aws.prefix | quote }}
      {{- end }}
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws
            namespace: {{ .Release.Namespace }}
{{- else if eq $backend "vault" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  {{- include "secret-stores.platformConditions" . | nindent 2 }}
  provider:
    vault:
      server: {{ .Values.secrets.vault.server | quote }}
      path: {{ .Values.secrets.vault.path | default "platform" | quote }}
      version: {{ .Values.secrets.vault.version | default "v2" | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.secrets.vault.auth.kubernetes.mountPath | default "kubernetes" | quote }}
          role: {{ .Values.secrets.vault.auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: eso-vault
            namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-mgmt-fleet
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-mgmt-fleet
  namespace: fleet
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-mgmt-fleet
  namespace: fleet
subjects:
  - kind: ServiceAccount
    name: eso-mgmt-fleet
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-mgmt-fleet
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mgmt-fleet
spec:
  conditions:
    - namespaces:
        - fleet
        - argocd
        - openbao     # addon openbao mesh-clients: members' public auth inputs (fleet/<name>-mesh-openbao, find by label)
  provider:
    kubernetes:
      remoteNamespace: fleet
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: eso-mgmt-fleet
          namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-mgmt-openchoreo
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-mgmt-openchoreo
  namespace: openchoreo-control-plane
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-mgmt-openchoreo
  namespace: openchoreo-control-plane
subjects:
  - kind: ServiceAccount
    name: eso-mgmt-openchoreo
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-mgmt-openchoreo
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mgmt-openchoreo
spec:
  conditions:
    - namespaces:
        - fleet                            # CRS payload openchoreo-gateway-ca (addon openchoreo-control-plane)
        - openchoreo-observability-plane   # in-cluster agent's gateway CA ConfigMap (addon openchoreo-observability-plane)
        - openchoreo-workflow-plane        # in-cluster agent's gateway CA ConfigMap (addon openchoreo-workflow-plane)
  provider:
    kubernetes:
      remoteNamespace: openchoreo-control-plane
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: eso-mgmt-openchoreo
          namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.repoCreds.name | default "platform-repo-creds" | quote }}
  namespace: {{ .Values.repoCreds.namespace | default "argocd" | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  {{- $rcKey := .Values.repoCreds.remoteKey | default "platform-github" }}
  {{- $rcAuth := .Values.repoCreds.auth | default "token" }}
  {{- if not (has $rcAuth (list "token" "githubApp")) }}
  {{- fail (printf "repoCreds.auth must be token or githubApp (got %s)" $rcAuth) }}
  {{- end }}
  {{- $rcProps := list "username" "token" }}
  {{- if eq $rcAuth "githubApp" }}
  {{- $rcProps = list "githubAppID" "githubAppInstallationID" "githubAppPrivateKey" }}
  {{- end }}
  data:
    {{- range $rcProps }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $rcKey | quote }}
        property: {{ . }}
    {{- end }}
  target:
    name: {{ .Values.repoCreds.name | default "platform-repo-creds" | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: {{ .Values.installation.githubOrg | quote }}
        {{- if eq $rcAuth "githubApp" }}
        # Argo CD mints short-lived installation tokens from the App key itself (docs/forking.md).
        githubAppID: '{{ "{{" }} .githubAppID {{ "}} " | trim }}'
        githubAppInstallationID: '{{ "{{" }} .githubAppInstallationID {{ "}} " | trim }}'
        githubAppPrivateKey: '{{ "{{" }} .githubAppPrivateKey {{ "}} " | trim }}'
        {{- else }}
        username: '{{ "{{" }} .username {{ "}} " | trim }}'
        password: '{{ "{{" }} .token {{ "}} " | trim }}'
        {{- end }}
{{- else -}}
{{- if eq $backend "kubernetes" -}}
{{- $wlNs := .Values.secrets.workloadKubernetes.namespace | default "openchoreo-secrets" -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $wlNs | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-workload-default
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-workload-default
  namespace: {{ $wlNs | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-workload-default
  namespace: {{ $wlNs | quote }}
subjects:
  - kind: ServiceAccount
    name: eso-workload-default
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-workload-default
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $wlNs | quote }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: eso-workload-default
          namespace: {{ .Release.Namespace }}
{{- else if eq $backend "aws" -}}
# VERIFY: workload IRSA / Pod Identity auth for AWS Secrets Manager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws
  namespace: {{ .Release.Namespace }}
  {{- if .Values.secrets.aws.role }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.secrets.aws.role | quote }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.aws.region | quote }}
      {{- if .Values.secrets.aws.prefix }}
      prefix: {{ .Values.secrets.aws.prefix | quote }}
      {{- end }}
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws
            namespace: {{ .Release.Namespace }}
{{- else if eq $backend "vault" -}}
# VERIFY: workload Vault auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  provider:
    vault:
      server: {{ .Values.secrets.vault.server | quote }}
      path: {{ .Values.secrets.vault.path | default "platform" | quote }}
      version: {{ .Values.secrets.vault.version | default "v2" | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.secrets.vault.auth.kubernetes.mountPath | default "kubernetes" | quote }}
          role: {{ .Values.secrets.vault.auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: eso-vault
            namespace: {{ .Release.Namespace }}
{{- end }}
{{- /*
ClusterSecretStore `dns` (workload clusters, installation.yaml dns.provider cloudflare): the external-dns Cloudflare
token, zone-wide DNS:Edit. The tenant store `default` is the ClusterDataPlane secretStoreRef, so anything it can read
is readable by every tenant; this store reads from a separate backend location with its own identity and is scoped to
dnsStore.namespaces (external-dns). AGENTS.md invariant 5 exception; addon external-dns refuses any other store.
*/ -}}
{{- if and (ne .Values.role "mgmt") (eq ((.Values.dns).provider | default "none") "cloudflare") }}
{{- $dnsNs := .Values.dnsStore.namespaces | default list }}
{{- if not $dnsNs }}{{ fail "dnsStore.namespaces must list the namespaces allowed to read ClusterSecretStore dns" }}{{ end }}
{{- $ds := .Values.secrets.dnsStore | default dict }}
---
{{- if eq $backend "kubernetes" }}
{{- $credNs := ($ds.kubernetes).namespace | default "external-dns-credentials" }}
{{- if eq $credNs (.Values.secrets.workloadKubernetes.namespace | default "openchoreo-secrets") }}
{{- fail "secrets.dnsStore.kubernetes.namespace must differ from secrets.workloadKubernetes.namespace (the tenant store default reads that one)" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $credNs | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-workload-dns
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-workload-dns
  namespace: {{ $credNs | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-workload-dns
  namespace: {{ $credNs | quote }}
subjects:
  - kind: ServiceAccount
    name: eso-workload-dns
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-workload-dns
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dns
spec:
  conditions:
    - namespaces: {{- toYaml $dnsNs | nindent 8 }}
  provider:
    kubernetes:
      remoteNamespace: {{ $credNs | quote }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: eso-workload-dns
          namespace: {{ .Release.Namespace }}
{{- else if eq $backend "aws" }}
{{- $role := ($ds.aws).role | default "" }}
{{- if or (not $role) (eq $role (.Values.secrets.aws.role | default "")) }}
{{- fail "dns.provider cloudflare on AWS Secrets Manager needs secrets.dnsStore.aws.role: an IAM role that reads only the DNS key, distinct from secrets.aws.role (the tenant store default's)" }}
{{- end }}
# VERIFY: workload IRSA / Pod Identity auth for AWS Secrets Manager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws-dns
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $role | quote }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dns
spec:
  conditions:
    - namespaces: {{- toYaml $dnsNs | nindent 8 }}
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.aws.region | quote }}
      {{- if .Values.secrets.aws.prefix }}
      prefix: {{ .Values.secrets.aws.prefix | quote }}
      {{- end }}
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws-dns
            namespace: {{ .Release.Namespace }}
{{- else if eq $backend "vault" }}
{{- $role := ($ds.vault).role | default "" }}
{{- if or (not $role) (eq $role (.Values.secrets.vault.auth.kubernetes.role | default "")) }}
{{- fail "dns.provider cloudflare on Vault needs secrets.dnsStore.vault.role: a kubernetes-auth role whose policy reads only the DNS key, distinct from secrets.vault.auth.kubernetes.role (the tenant store default's)" }}
{{- end }}
# VERIFY: workload Vault auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-dns
  namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dns
spec:
  conditions:
    - namespaces: {{- toYaml $dnsNs | nindent 8 }}
  provider:
    vault:
      server: {{ .Values.secrets.vault.server | quote }}
      path: {{ ($ds.vault).path | default .Values.secrets.vault.path | default "platform" | quote }}
      version: {{ .Values.secrets.vault.version | default "v2" | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.secrets.vault.auth.kubernetes.mountPath | default "kubernetes" | quote }}
          role: {{ $role | quote }}
          serviceAccountRef:
            name: eso-vault-dns
            namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end -}}
