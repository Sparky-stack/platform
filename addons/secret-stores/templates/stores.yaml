{{- /*
ClusterSecretStores and the identities they authenticate with: one secret-stores.store call each (_helpers.tpl).
mgmt:     platform (every platform credential; platformStore.namespaces only), mgmt-fleet, mgmt-openchoreo, workflows
          (key-scoped; workflows-* only), plus the Argo CD repo-creds ExternalSecret.
workload: default (tenant store, the ClusterDataPlane secretStoreRef) and, with dns.provider cloudflare, dns.
*/ -}}
{{- $backend := .Values.secrets.backend | default "kubernetes" -}}
{{- if eq .Values.role "mgmt" -}}
{{- $platformNs := .Values.secrets.kubernetes.namespace | default "platform-secrets" -}}
{{- include "secret-stores.store" (dict "root" . "backend" $backend "name" "platform"
      "serviceAccount" (get (dict "kubernetes" "eso-platform" "aws" "eso-aws" "vault" "eso-vault") $backend)
      "conditions" (include "secret-stores.platformConditions" . | fromYamlArray)
      "remoteNamespace" $platformNs) }}
---
{{- /* readers: fleet, argocd, openbao (addon openbao mesh-clients: members' public auth inputs
       fleet/<name>-mesh-openbao, found by label) */}}
{{ include "secret-stores.store" (dict "root" . "backend" "kubernetes" "name" "mgmt-fleet" "serviceAccount" "eso-mgmt-fleet"
      "conditions" (list (dict "namespaces" (list "fleet" "argocd" "openbao")))
      "remoteNamespace" "fleet") }}
---
{{- /* readers: fleet (CRS payload openchoreo-gateway-ca, addon openchoreo-control-plane) and the in-cluster agents'
       gateway CA ConfigMaps (addons openchoreo-observability-plane, openchoreo-workflow-plane) */}}
{{ include "secret-stores.store" (dict "root" . "backend" "kubernetes" "name" "mgmt-openchoreo" "serviceAccount" "eso-mgmt-openchoreo"
      "conditions" (list (dict "namespaces" (list "fleet" "openchoreo-observability-plane" "openchoreo-workflow-plane")))
      "remoteNamespace" "openchoreo-control-plane") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.repoCreds.name | default "platform-repo-creds" | quote }}
  namespace: {{ .Values.repoCreds.namespace | default "argocd" | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  {{- $rcKey := .Values.repoCreds.remoteKey | default "platform-github" }}
  {{- $rcAuth := .Values.repoCreds.auth | default "token" }}
  {{- if not (has $rcAuth (list "token" "githubApp")) }}
  {{- fail (printf "repoCreds.auth must be token or githubApp (got %s)" $rcAuth) }}
  {{- end }}
  {{- $rcProps := list "username" "token" }}
  {{- if eq $rcAuth "githubApp" }}
  {{- $rcProps = list "githubAppID" "githubAppInstallationID" "githubAppPrivateKey" }}
  {{- end }}
  data:
    {{- range $rcProps }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $rcKey | quote }}
        property: {{ . }}
    {{- end }}
  target:
    name: {{ .Values.repoCreds.name | default "platform-repo-creds" | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: {{ .Values.installation.githubOrg | quote }}
        {{- if eq $rcAuth "githubApp" }}
        # Argo CD mints short-lived installation tokens from the App key itself (docs/forking.md).
        githubAppID: '{{ "{{" }} .githubAppID {{ "}} " | trim }}'
        githubAppInstallationID: '{{ "{{" }} .githubAppInstallationID {{ "}} " | trim }}'
        githubAppPrivateKey: '{{ "{{" }} .githubAppPrivateKey {{ "}} " | trim }}'
        {{- else }}
        username: '{{ "{{" }} .username {{ "}} " | trim }}'
        password: '{{ "{{" }} .token {{ "}} " | trim }}'
        {{- end }}
{{- /*
ClusterSecretStore `workflows` (mgmt): the only store ClusterWorkflowPlane `default` (${workflowplane.secretStore})
points at. Restricted by namespaceRegexes to `workflows-*` run namespaces and, on the kubernetes backend, by a
name-scoped GET Role (resourceNames = workflowStore.keys) with SelfSubjectRulesReview create so ESO validates the store
without list/watch or access to any other Secret in platform-secrets (AGENTS.md invariant 5). On aws / vault it uses
its own identity (secrets.workflowStore.<backend>.role), never store platform's.
*/ -}}
{{- $wfKeys := (.Values.workflowStore).keys | default list }}
{{- if not $wfKeys }}{{ fail "workflowStore.keys must list the secret keys ClusterSecretStore workflows may read" }}{{ end }}
{{- if and (eq (toString ((.Values.registry).type | default "harbor")) "external") ((.Values.registry.external).credentialsKey) }}
{{- $wfKeys = append (without $wfKeys "harbor") .Values.registry.external.credentialsKey | uniq }}
{{- end }}
{{- $ws := .Values.secrets.workflowStore | default dict }}
{{- $wfAwsRole := ($ws.aws).role | default "" }}
{{- $wfVaultRole := ($ws.vault).role | default "" }}
{{- if and (eq $backend "aws") $wfAwsRole (eq $wfAwsRole (.Values.secrets.aws.role | default "")) }}
{{- fail "ClusterSecretStore workflows on AWS Secrets Manager needs secrets.workflowStore.aws.role: an IAM role that reads only workflowStore.keys, distinct from secrets.aws.role (store platform's)" }}
{{- end }}
{{- if and (eq $backend "vault") (or (not $wfVaultRole) (eq $wfVaultRole (.Values.secrets.vault.auth.kubernetes.role | default ""))) }}
{{- fail "ClusterSecretStore workflows on Vault needs secrets.workflowStore.vault.role: a kubernetes-auth role whose policy reads only workflowStore.keys, distinct from secrets.vault.auth.kubernetes.role (store platform's)" }}
{{- end }}
---
{{ include "secret-stores.store" (dict "root" . "backend" $backend "name" "workflows"
      "serviceAccount" (get (dict "kubernetes" "eso-workflows" "aws" "eso-aws-workflows" "vault" "eso-vault-workflows") $backend)
      "conditions" (include "secret-stores.workflowConditions" . | fromYamlArray)
      "remoteNamespace" $platformNs "automountToken" (ne $backend "kubernetes")
      "resourceNames" $wfKeys "irsaRole" $wfAwsRole "vaultRole" $wfVaultRole "vaultPath" ($ws.vault).path) }}
{{- else -}}
{{- $wlNs := .Values.secrets.workloadKubernetes.namespace | default "openchoreo-secrets" -}}
{{- if eq $backend "kubernetes" -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $wlNs | quote }}
---
{{- end }}
{{- /* VERIFY: workload auth on the aws (IRSA / Pod Identity) and vault backends (stores default and dns) */}}
{{- /* With per-tenant stores (templates/tenant-stores.yaml) tenant namespaces may not use store default at all. */}}
{{- $defaultConds := list }}
{{- if ((.Values.secrets).tenantStores).enabled }}
{{- $defaultConds = list (dict "namespaceSelector" (dict "matchExpressions" (list (dict "key" .Values.tenantStores.tenantLabel "operator" "DoesNotExist")))) }}
{{- end }}
{{ include "secret-stores.store" (dict "root" . "backend" $backend "name" "default"
      "serviceAccount" (get (dict "kubernetes" "eso-workload-default" "aws" "eso-aws" "vault" "eso-vault") $backend)
      "conditions" $defaultConds "remoteNamespace" $wlNs) }}
{{- /*
ClusterSecretStore `dns` (workload clusters, installation.yaml dns.provider cloudflare): the external-dns Cloudflare
token, zone-wide DNS:Edit. The tenant store `default` is the ClusterDataPlane secretStoreRef, so anything it can read
is readable by every tenant; this store reads from a separate backend location with its own identity and is scoped to
dnsStore.namespaces (external-dns). AGENTS.md invariant 5 exception; addon external-dns refuses any other store.
*/ -}}
{{- if eq ((.Values.dns).provider | default "none") "cloudflare" }}
{{- $dnsNs := .Values.dnsStore.namespaces | default list }}
{{- if not $dnsNs }}{{ fail "dnsStore.namespaces must list the namespaces allowed to read ClusterSecretStore dns" }}{{ end }}
{{- $ds := .Values.secrets.dnsStore | default dict }}
{{- $credNs := ($ds.kubernetes).namespace | default "external-dns-credentials" }}
{{- $role := (get $ds $backend | default dict).role | default "" }}
{{- if and (eq $backend "kubernetes") (eq $credNs $wlNs) }}
{{- fail "secrets.dnsStore.kubernetes.namespace must differ from secrets.workloadKubernetes.namespace (the tenant store default reads that one)" }}
{{- else if and (eq $backend "aws") (or (not $role) (eq $role (.Values.secrets.aws.role | default ""))) }}
{{- fail "dns.provider cloudflare on AWS Secrets Manager needs secrets.dnsStore.aws.role: an IAM role that reads only the DNS key, distinct from secrets.aws.role (the tenant store default's)" }}
{{- else if and (eq $backend "vault") (or (not $role) (eq $role (.Values.secrets.vault.auth.kubernetes.role | default ""))) }}
{{- fail "dns.provider cloudflare on Vault needs secrets.dnsStore.vault.role: a kubernetes-auth role whose policy reads only the DNS key, distinct from secrets.vault.auth.kubernetes.role (the tenant store default's)" }}
{{- end }}
---
{{- if eq $backend "kubernetes" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $credNs | quote }}
---
{{- end }}
{{ include "secret-stores.store" (dict "root" . "backend" $backend "name" "dns"
      "serviceAccount" (get (dict "kubernetes" "eso-workload-dns" "aws" "eso-aws-dns" "vault" "eso-vault-dns") $backend)
      "conditions" (list (dict "namespaces" $dnsNs))
      "remoteNamespace" $credNs "irsaRole" $role "vaultRole" $role "vaultPath" ($ds.vault).path) }}
{{- end }}
{{- end -}}
