{{- /*
ClusterSecretStores and the identity each authenticates with (one secret-stores.store call per store, _helpers.tpl).
mgmt: platform, mgmt-fleet, mgmt-openchoreo, workflows, plus Argo CD's repo-creds ExternalSecret.
workload: default, plus dns (dns.provider cloudflare) and delivery (byo clusters).
Validation: values.schema.json and templates/validate.yaml.
*/ -}}
{{- $backend := .Values.secrets.backend | default "kubernetes" -}}
{{- if eq .Values.role "mgmt" -}}
{{- $platformNs := .Values.secrets.kubernetes.namespace | default "platform-secrets" -}}
{{- /* Store platform holds every platform credential: never readable from a workflows-* run namespace
       (hack/tests/test_secret_store_scope.sh checks every ExternalSecret using it is in this list). */ -}}
{{- $platformReaders := .Values.platformStore.namespaces -}}
{{- $rcName := .Values.repoCreds.name | default "platform-repo-creds" -}}
{{- $rcKey := .Values.repoCreds.remoteKey | default "platform-github" -}}
{{- $rcAuth := .Values.repoCreds.auth | default "token" -}}
{{- $rcProps := ternary (list "githubAppID" "githubAppInstallationID" "githubAppPrivateKey") (list "username" "token") (eq $rcAuth "githubApp") -}}
{{- $wfKeys := .Values.workflowStore.keys -}}
{{- /* registry.type external: builds push with registry.external.credentialsKey instead of the harbor robot. */ -}}
{{- if and (eq (toString (.Values.registry.type | default "harbor")) "external") (.Values.registry.external).credentialsKey -}}
{{- $wfKeys = append (without $wfKeys "harbor") .Values.registry.external.credentialsKey | uniq -}}
{{- end -}}
{{- /* Store workflows never reuses store platform's identity on aws / vault: its role reads only workflowStore.keys. */ -}}
{{- $ws := .Values.secrets.workflowStore -}}
{{- $wfAwsRole := ($ws.aws).role | default "" -}}
{{- $wfVaultRole := ($ws.vault).role | default "" -}}
{{- $wfRegexes := .Values.workflowStore.namespaceRegexes -}}
{{- /* ---- mgmt: objects ---- */}}
{{ include "secret-stores.store" (dict "root" . "backend" $backend "name" "platform"
      "serviceAccount" (get (dict "kubernetes" "eso-platform" "aws" "eso-aws" "vault" "eso-vault") $backend)
      "conditions" (list (dict "namespaces" $platformReaders))
      "remoteNamespace" $platformNs) }}
---
{{- /* readers: fleet, argocd, openbao (addon openbao mesh-clients: members' public auth inputs
       fleet/<name>-mesh-openbao, found by label) */}}
{{ include "secret-stores.store" (dict "root" . "backend" "kubernetes" "name" "mgmt-fleet" "serviceAccount" "eso-mgmt-fleet"
      "conditions" (list (dict "namespaces" (list "fleet" "argocd" "openbao")))
      "remoteNamespace" "fleet") }}
---
{{- /* readers: fleet (CRS payload openchoreo-gateway-ca, addon openchoreo-control-plane) and the in-cluster agents'
       gateway CA ConfigMaps (addons openchoreo-observability-plane, openchoreo-workflow-plane) */}}
{{ include "secret-stores.store" (dict "root" . "backend" "kubernetes" "name" "mgmt-openchoreo" "serviceAccount" "eso-mgmt-openchoreo"
      "conditions" (list (dict "namespaces" (list "fleet" "openchoreo-observability-plane" "openchoreo-workflow-plane")))
      "remoteNamespace" "openchoreo-control-plane") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $rcName | quote }}
  namespace: {{ .Values.repoCreds.namespace | default "argocd" | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  data:
    {{- range $rcProps }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $rcKey | quote }}
        property: {{ . }}
    {{- end }}
  target:
    name: {{ $rcName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: {{ .Values.installation.githubOrg | quote }}
        {{- if eq $rcAuth "githubApp" }}
        # Argo CD mints short-lived installation tokens from the App key itself (docs/forking.md).
        githubAppID: '{{`{{ .githubAppID }}`}}'
        githubAppInstallationID: '{{`{{ .githubAppInstallationID }}`}}'
        githubAppPrivateKey: '{{`{{ .githubAppPrivateKey }}`}}'
        {{- else }}
        username: '{{`{{ .username }}`}}'
        password: '{{`{{ .token }}`}}'
        {{- end }}
{{- /*
Store workflows: the only store ClusterWorkflowPlane default (${workflowplane.secretStore}) points at, so build and
promotion-gate runs in workflows-* never touch store platform (AGENTS.md invariant 5). On the kubernetes backend the
Role is name-scoped GET on workflowStore.keys, plus SelfSubjectRulesReview create so ESO can validate the store
without list/watch on platform-secrets.
*/}}
---
{{ include "secret-stores.store" (dict "root" . "backend" $backend "name" "workflows"
      "serviceAccount" (get (dict "kubernetes" "eso-workflows" "aws" "eso-aws-workflows" "vault" "eso-vault-workflows") $backend)
      "conditions" (list (dict "namespaceRegexes" $wfRegexes))
      "remoteNamespace" $platformNs "noTokenAutomount" (eq $backend "kubernetes")
      "resourceNames" $wfKeys "irsaRole" $wfAwsRole "vaultRole" $wfVaultRole "vaultPath" ($ws.vault).path) }}
{{- else -}}
{{- $wlNs := .Values.secrets.workloadKubernetes.namespace | default "openchoreo-secrets" -}}
{{- $d := .Values.delivery -}}
{{- /* The Cloudflare token (zone-wide DNS:Edit) must sit where store default cannot read: anything store default reads
       is readable by every tenant. Separate location, separate identity, readers dnsStore.namespaces only. */ -}}
{{- $dns := eq (.Values.dns.provider | default "none") "cloudflare" -}}
{{- $dnsReaders := .Values.dnsStore.namespaces -}}
{{- $ds := .Values.secrets.dnsStore -}}
{{- $dnsCredNs := ($ds.kubernetes).namespace | default "external-dns-credentials" -}}
{{- $dnsRole := (get $ds $backend | default dict).role | default "" -}}
{{- /* ---- workload: objects ---- */}}
{{- if eq $backend "kubernetes" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $wlNs | quote }}
---
{{- end }}
{{- /* Store default: the ClusterDataPlane secretStoreRef. With per-tenant stores (tenant-stores.yaml) tenant namespaces
       may not use it at all. VERIFY: workload auth on the aws (IRSA / Pod Identity) and vault backends. */}}
{{- $defaultConds := list }}
{{- if .Values.secrets.tenantStores.enabled }}
{{- $defaultConds = list (dict "namespaceSelector" (dict "matchExpressions" (list (dict "key" .Values.tenantStores.tenantLabel "operator" "DoesNotExist")))) }}
{{- end }}
{{ include "secret-stores.store" (dict "root" . "backend" $backend "name" "default"
      "serviceAccount" (get (dict "kubernetes" "eso-workload-default" "aws" "eso-aws" "vault" "eso-vault") $backend)
      "conditions" $defaultConds "remoteNamespace" $wlNs) }}
{{- /*
Store delivery (byo clusters, values/provider-byo.yaml): name-scoped GET of the PUBLIC certificates/keys mgmt pushes
into delivery.namespace (charts/cluster PushSecrets; CAPI clusters get them from ClusterResourceSets instead). Always
the kubernetes provider: the material is pushed to the cluster's own API, not stored in the installation's backend.
*/}}
{{- if $d.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $d.namespace | quote }}
---
{{ include "secret-stores.store" (dict "root" . "backend" "kubernetes" "name" "delivery" "serviceAccount" "eso-delivery"
      "conditions" (list (dict "namespaces" $d.namespaces)) "remoteNamespace" $d.namespace "resourceNames" $d.keys
      "noTokenAutomount" true) }}
{{- end }}
{{- /* Store dns (dns.provider cloudflare): the external-dns token; addon external-dns refuses any other store. */}}
{{- if $dns }}
---
{{- if eq $backend "kubernetes" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $dnsCredNs | quote }}
---
{{- end }}
{{ include "secret-stores.store" (dict "root" . "backend" $backend "name" "dns"
      "serviceAccount" (get (dict "kubernetes" "eso-workload-dns" "aws" "eso-aws-dns" "vault" "eso-vault-dns") $backend)
      "conditions" (list (dict "namespaces" $dnsReaders))
      "remoteNamespace" $dnsCredNs "irsaRole" $dnsRole "vaultRole" $dnsRole "vaultPath" ($ds.vault).path) }}
{{- end }}
{{- end -}}
