{{- /*
GitHub token of the PR preview ApplicationSets (installation.yaml previews.enabled, docs/preview-environments.md), in
Argo CD's namespace on mgmt:
  ExternalSecret <secretName>-app   the platform GitHub App (store `platform`, which argocd may read) - read only by ESO
  GithubAccessToken <secretName>    ESO generator: installation token restricted to previewToken.permissions
  ExternalSecret <secretName>       Secret with that token (`token`), labelled scm-creds (Argo CD's tokenRef strict mode),
                                    re-minted every refreshInterval (tokens live 1h)
The ApplicationSets' pull request generators use it through tokenRef. No PAT; Argo CD never sees the App key.
*/ -}}
{{- $pv := .Values.previews | default dict }}
{{- /* Needs the platform GitHub App (secrets.githubGateApp.enabled, charts/platform values.yaml): without the key the
generator fails and degrades this app (#192). */ -}}
{{- if and (eq .Values.role "mgmt") $pv.enabled (dig "githubGateApp" "enabled" false (.Values.secrets | default dict)) }}
{{- $t := .Values.previewToken }}
{{- $name := $t.secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-app
  namespace: {{ $t.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ $name }}-app
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: app-id
      remoteRef: { key: {{ $t.githubKey }}, property: githubAppID }
    - secretKey: installation-id
      remoteRef: { key: {{ $t.githubKey }}, property: githubAppInstallationID }
    - secretKey: private-key
      remoteRef: { key: {{ $t.githubKey }}, property: githubAppPrivateKey }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: {{ $name }}
  namespace: {{ $t.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  appIDRef: { name: {{ $name }}-app, key: app-id }
  installIDRef: { name: {{ $name }}-app, key: installation-id }
  permissions: {{- toYaml $t.permissions | nindent 4 }}
  auth:
    privateKey:
      secretRef: { name: {{ $name }}-app, key: private-key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $t.namespace }}
spec:
  refreshInterval: {{ $t.refreshInterval }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: scm-creds
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: {{ $name }}
{{- end }}
