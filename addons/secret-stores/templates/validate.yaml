{{- /* Cross-field and tenant-isolation rules of this chart (renders nothing). Types, enums and non-empty lists:
values.schema.json. The messages are contracts of hack/tests/test_secret_store_scope.sh and the unit tests. */ -}}
{{- $backend := .Values.secrets.backend | default "kubernetes" -}}
{{- if eq .Values.role "mgmt" -}}
{{- /* Store platform holds every platform credential: never readable from a workflows-* run namespace. */ -}}
{{- range .Values.platformStore.namespaces -}}
{{- if hasPrefix "workflows-" (toString .) }}{{ fail (printf "platformStore.namespaces must not include workflow run namespace %q: use ClusterSecretStore workflows (key-scoped)" .) }}{{ end -}}
{{- end -}}
{{- /* Store workflows never reuses store platform's identity on aws / vault: its role reads only workflowStore.keys. */ -}}
{{- $ws := .Values.secrets.workflowStore -}}
{{- $wfAwsRole := ($ws.aws).role | default "" -}}
{{- $wfVaultRole := ($ws.vault).role | default "" -}}
{{- if and (eq $backend "aws") $wfAwsRole (eq $wfAwsRole (.Values.secrets.aws.role | default "")) -}}
{{- fail "ClusterSecretStore workflows on AWS Secrets Manager needs secrets.workflowStore.aws.role: an IAM role that reads only workflowStore.keys, distinct from secrets.aws.role (store platform's)" -}}
{{- end -}}
{{- if and (eq $backend "vault") (or (not $wfVaultRole) (eq $wfVaultRole (.Values.secrets.vault.auth.kubernetes.role | default ""))) -}}
{{- fail "ClusterSecretStore workflows on Vault needs secrets.workflowStore.vault.role: a kubernetes-auth role whose policy reads only workflowStore.keys, distinct from secrets.vault.auth.kubernetes.role (store platform's)" -}}
{{- end -}}
{{- else -}}
{{- $d := .Values.delivery -}}
{{- if and $d.enabled (not (and $d.namespace $d.keys $d.namespaces)) }}{{ fail "delivery needs namespace, keys and namespaces" }}{{ end -}}
{{- /* The Cloudflare token (zone-wide DNS:Edit) must sit where store default cannot read: anything store default reads
       is readable by every tenant. Separate location, separate identity, readers dnsStore.namespaces only. */ -}}
{{- if eq (.Values.dns.provider | default "none") "cloudflare" -}}
{{- $wlNs := .Values.secrets.workloadKubernetes.namespace | default "openchoreo-secrets" -}}
{{- $ds := .Values.secrets.dnsStore -}}
{{- $dnsCredNs := ($ds.kubernetes).namespace | default "external-dns-credentials" -}}
{{- $dnsRole := (get $ds $backend | default dict).role | default "" -}}
{{- if and (eq $backend "kubernetes") (eq $dnsCredNs $wlNs) -}}
{{- fail "secrets.dnsStore.kubernetes.namespace must differ from secrets.workloadKubernetes.namespace (the tenant store default reads that one)" -}}
{{- else if and (eq $backend "aws") (or (not $dnsRole) (eq $dnsRole (.Values.secrets.aws.role | default ""))) -}}
{{- fail "dns.provider cloudflare on AWS Secrets Manager needs secrets.dnsStore.aws.role: an IAM role that reads only the DNS key, distinct from secrets.aws.role (the tenant store default's)" -}}
{{- else if and (eq $backend "vault") (or (not $dnsRole) (eq $dnsRole (.Values.secrets.vault.auth.kubernetes.role | default ""))) -}}
{{- fail "dns.provider cloudflare on Vault needs secrets.dnsStore.vault.role: a kubernetes-auth role whose policy reads only the DNS key, distinct from secrets.vault.auth.kubernetes.role (the tenant store default's)" -}}
{{- end -}}
{{- end -}}
{{- if .Values.secrets.tenantStores.enabled -}}
{{- $_ := required "secrets.tenantStores needs mesh.ca.host (installation.yaml): where members reach OpenBao" ((.Values.mesh).ca).host -}}
{{- $_ = required "cluster.name is required (generated by the addon ApplicationSet)" (.Values.cluster).name -}}
{{- end -}}
{{- end -}}
