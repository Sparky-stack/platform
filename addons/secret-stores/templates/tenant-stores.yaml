{{- /*
Per-tenant OpenBao SecretStores on workload clusters (secrets.tenantStores.enabled; docs/multicluster.md "Tenant
secrets (OpenBao)", AGENTS.md invariant 5). Tenant namespace = OpenChoreo cell namespace, label tenantLabel = project.
Isolation is enforced three times: store default excludes tenant namespaces (stores.yaml), the VAPs, and OpenBao.
*/ -}}
{{- if and (ne .Values.role "mgmt") .Values.secrets.tenantStores.enabled }}
{{- $t := .Values.tenantStores }}
{{- $host := ((.Values.mesh).ca).host }}{{- /* required: templates/validate.yaml */ -}}
{{- $port := ((.Values.mesh).ca).port | default 8200 }}
{{- $cluster := (.Values.cluster).name }}
{{- /* In tenant namespaces every store reference must be SecretStore storeName: a namespaced SecretStore ref always
       resolves in the object's own namespace. Never a ClusterSecretStore, a ClusterGenerator or another store. */}}
{{- include "secret-stores.tenantVapHeader" (dict "name" "platform-tenant-externalsecret-store" "tenantLabel" $t.tenantLabel "resource" "externalsecrets") }}
  validations:
    - expression: {{ printf "!has(object.spec.secretStoreRef) || ((!has(object.spec.secretStoreRef.kind) || object.spec.secretStoreRef.kind == 'SecretStore') && object.spec.secretStoreRef.name == '%s')" $t.storeName | quote }}
      message: {{ printf "tenant namespaces may only use their own SecretStore %s (never a ClusterSecretStore or another store)" $t.storeName | quote }}
    - expression: {{ printf "!has(object.spec.data) || object.spec.data.all(d, !has(d.sourceRef) || !has(d.sourceRef.storeRef) || ((!has(d.sourceRef.storeRef.kind) || d.sourceRef.storeRef.kind == 'SecretStore') && d.sourceRef.storeRef.name == '%s'))" $t.storeName | quote }}
      message: {{ printf "data[].sourceRef.storeRef: tenant namespaces may only use SecretStore %s" $t.storeName | quote }}
    - expression: {{ printf "!has(object.spec.dataFrom) || object.spec.dataFrom.all(d, !has(d.sourceRef) || ((!has(d.sourceRef.storeRef) || ((!has(d.sourceRef.storeRef.kind) || d.sourceRef.storeRef.kind == 'SecretStore') && d.sourceRef.storeRef.name == '%s')) && (!has(d.sourceRef.generatorRef) || d.sourceRef.generatorRef.kind != 'ClusterGenerator')))" $t.storeName | quote }}
      message: {{ printf "dataFrom[].sourceRef: tenant namespaces may only use SecretStore %s and no ClusterGenerator" $t.storeName | quote }}
---
{{- /* Same rule for PushSecrets; a label selector could match a store the tenant does not own. */}}
{{- include "secret-stores.tenantVapHeader" (dict "name" "platform-tenant-pushsecret-store" "tenantLabel" $t.tenantLabel "resource" "pushsecrets") }}
  validations:
    - expression: {{ printf "!has(object.spec.secretStoreRefs) || object.spec.secretStoreRefs.all(r, !has(r.labelSelector) && (!has(r.kind) || r.kind == 'SecretStore') && has(r.name) && r.name == '%s')" $t.storeName | quote }}
      message: {{ printf "tenant namespaces may only push to their own SecretStore %s (no ClusterSecretStore, no label selector)" $t.storeName | quote }}
---
{{- /* Tenants cannot create or change SecretStores in their namespaces: only the generator below (storeWriters). */}}
{{- include "secret-stores.tenantVapHeader" (dict "name" "platform-tenant-secretstores-platform-owned" "tenantLabel" $t.tenantLabel "resource" "secretstores") }}
  validations:
    - expression: {{ printf "request.userInfo.username in %s" (toJson $t.storeWriters) | quote }}
      message: "SecretStores in tenant namespaces are platform-rendered (Kyverno GeneratingPolicy platform-tenant-secret-store)"
{{- range $p := list "platform-tenant-externalsecret-store" "platform-tenant-pushsecret-store" "platform-tenant-secretstores-platform-owned" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $p }}
  labels:
    app.kubernetes.io/part-of: tenant-secrets
spec:
  policyName: {{ $p }}
  validationActions: [Deny]
{{- end }}
{{- /*
Per tenant namespace (also existing ones, kept in sync): ServiceAccount serviceAccount + SecretStore storeName = OpenBao
on mgmt (https://<mesh.ca.host>:<mesh.ca.port>, CA from the mesh trust payload caSecret), KV v2 mount
kv-tenant-<project>, JWT auth tenants-<cluster> role <project>, short projected token (audience). OpenBao accepts it
only from the project's own namespaces and confines it to kv-tenant-<project> (addon openbao files/tenant-reconcile.sh).
*/}}
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: platform-tenant-secret-store
  labels:
    app.kubernetes.io/part-of: tenant-secrets
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Per-tenant OpenBao SecretStore
    policies.kyverno.io/description: >-
      Every OpenChoreo cell namespace gets ServiceAccount {{ $t.serviceAccount }} and SecretStore {{ $t.storeName }}:
      OpenBao on mgmt, mount kv-tenant-<project>, JWT auth tenants-{{ $cluster }} role <project>.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
    objectSelector:
      matchExpressions:
        - { key: {{ $t.tenantLabel }}, operator: Exists }
  matchConditions:
    - name: project-is-a-dns-label
      expression: {{ printf "object.metadata.labels['%s'].matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')" $t.tenantLabel | quote }}
  variables:
    - name: ns
      expression: object.metadata.name
    - name: project
      expression: {{ printf "object.metadata.labels['%s']" $t.tenantLabel | quote }}
    - name: ca
      expression: {{ printf "resource.Get('v1', 'secrets', '%s', '%s').data['%s']" $t.caSecret.namespace $t.caSecret.name $t.caSecret.key | quote }}
    - name: labels
      expression: {{ printf "{'app.kubernetes.io/part-of': 'tenant-secrets', '%s': variables.project}" $t.tenantLabel | quote }}
    - name: downstream
      expression: >-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("ServiceAccount"),
            "metadata": dyn({"name": "{{ $t.serviceAccount }}", "namespace": variables.ns, "labels": variables.labels}),
            "automountServiceAccountToken": dyn(false)
          },
          {
            "apiVersion": dyn("external-secrets.io/v1"),
            "kind": dyn("SecretStore"),
            "metadata": dyn({"name": "{{ $t.storeName }}", "namespace": variables.ns, "labels": variables.labels}),
            "spec": dyn({"provider": {"vault": {
              "server": dyn("https://{{ $host }}:{{ $port }}"),
              "path": dyn("kv-tenant-" + variables.project),
              "version": dyn("v2"),
              "caBundle": dyn(variables.ca),
              "auth": dyn({"jwt": {
                "path": dyn("tenants-{{ $cluster }}"),
                "role": dyn(variables.project),
                "kubernetesServiceAccountToken": dyn({
                  "serviceAccountRef": dyn({"name": "{{ $t.serviceAccount }}", "audiences": ["{{ $t.audience }}"]}),
                  "expirationSeconds": dyn({{ $t.tokenExpirationSeconds }})
                })
              }})
            }}})
          }
        ]
  generate:
    - expression: generator.Apply(variables.ns, variables.downstream)
---
# Kyverno's background controller creates the generated objects and reads the public OpenBao CA certificate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:tenant-secret-store
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    app.kubernetes.io/part-of: tenant-secrets
rules:
  - apiGroups: [external-secrets.io]
    resources: [secretstores]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $t.caSecret.name }}]
    verbs: [get]
{{- end }}
