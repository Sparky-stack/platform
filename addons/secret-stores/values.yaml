# Default role is mgmt; appset-addons layers values/role-<role>.yaml on top.
role: mgmt

installation:
  githubOrg: https://github.com/koorikla

secrets:
  backend: kubernetes          # kubernetes | aws | vault
  kubernetes:
    namespace: platform-secrets
  workloadKubernetes:
    namespace: openchoreo-secrets
  aws:
    region: eu-central-1
    prefix: ""
    role: ""
  vault:
    server: https://vault.example.com
    path: platform
    version: v2
    auth:
      kubernetes:
        mountPath: kubernetes
        role: external-secrets
  # ClusterSecretStore `dns` on workload clusters while installation.yaml dns.provider is cloudflare (dnsStore below).
  # It must read from a backend location the tenant store `default` cannot: per backend
  dnsStore:
    kubernetes:
      namespace: external-dns-credentials   # remote namespace (not workloadKubernetes.namespace)
    aws:
      role: ""                 # IAM role (IRSA) allowed to read only the DNS key; must differ from secrets.aws.role,
                               # whose policy must not grant it (render fails if empty or equal)
    vault:
      path: ""                 # default: secrets.vault.path
      role: ""                 # kubernetes-auth role whose policy reads only the DNS key; must differ from
                               # secrets.vault.auth.kubernetes.role (render fails if empty or equal)

# installation.yaml (valuesObject): dns.provider cloudflare puts the Cloudflare token behind store `dns` on workload clusters.
dns:
  provider: none

# Workload clusters: ClusterSecretStore `dns` holds the external-dns Cloudflare token (zone-wide DNS:Edit) apart from the
# tenant store `default` (the ClusterDataPlane secretStoreRef every tenant SecretReference / ExternalSecret can use).
# Only these namespaces may reference it (AGENTS.md invariant 5 exception; hack/tests/test_secret_store_scope.sh).
dnsStore:
  namespaces:
    - external-dns

# Namespaces on mgmt allowed to read ClusterSecretStore `platform` (spec.conditions). Every current consumer is listed;
# a new one must be added here (hack/tests/test_secret_store_scope.sh fails otherwise).
platformStore:
  namespaces:
    - argocd                           # platform-repo-creds (this chart)
    - fleet                            # <cluster>-registries, <cluster>-seed-* (charts/cluster); hetzner (addon clusterclasses)
    - capa-system                      # capa-variables (addon capi-providers, AWS)
    - thunder                          # thunder-bootstrap (addon thunder)
    - openchoreo-control-plane         # backstage-secrets (addon openchoreo-control-plane)
    - openchoreo-observability-plane   # opensearch-admin-credentials, observer-secret (addon openchoreo-observability-plane)
    - falco                            # falcosidekick-outputs when escalation/slack is on (addon falco, role mgmt)
    - harbor                           # harbor-platform: admin, robot and component secrets (addon harbor)
    - workflows-default                # per-run build secrets (git, registry, cosign): ClusterWorkflow resources of addon
                                       # openchoreo-platform, rendered by OpenChoreo into workflows-<openchoreo.orgNamespace>
    - external-dns                     # external-dns-cloudflare when opted in on mgmt with Cloudflare (addon external-dns)
    - agentgateway-system              # <provider>-llm-auth when opted in (addon agentgateway)

repoCreds:
  name: platform-repo-creds
  namespace: argocd
  remoteKey: platform-github
  # token: properties username + token (fine-grained PAT, read-only Contents). githubApp: properties githubAppID,
  # githubAppInstallationID, githubAppPrivateKey (preferred: Argo CD mints short-lived installation tokens).
  # Per installation: installations/<inst>/addons/secret-stores/values.yaml. docs/forking.md "Credentials".
  auth: token
