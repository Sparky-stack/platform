# Default role is mgmt; appset-addons layers values/role-<role>.yaml on top.
role: mgmt

installation:
  githubOrg: https://github.com/koorikla

secrets:
  backend: kubernetes          # kubernetes | aws | vault
  kubernetes:
    namespace: platform-secrets
  workloadKubernetes:
    namespace: openchoreo-secrets
  aws:
    region: eu-central-1
    prefix: ""
    role: ""
  tenantStores:
    enabled: false             # installation.yaml: per-tenant OpenBao SecretStores (tenantStores below)
  vault:
    server: https://vault.example.com
    path: platform
    version: v2
    auth:
      kubernetes:
        mountPath: kubernetes
        role: external-secrets
  # ClusterSecretStore `dns` on workload clusters while installation.yaml dns.provider is cloudflare (dnsStore below).
  # It must read from a backend location the tenant store `default` cannot: per backend
  dnsStore:
    kubernetes:
      namespace: external-dns-credentials   # remote namespace (not workloadKubernetes.namespace)
    aws:
      role: ""                 # IAM role (IRSA) allowed to read only the DNS key; must differ from secrets.aws.role,
                               # whose policy must not grant it (render fails if empty or equal)
    vault:
      path: ""                 # default: secrets.vault.path
      role: ""                 # kubernetes-auth role whose policy reads only the DNS key; must differ from
                               # secrets.vault.auth.kubernetes.role (render fails if empty or equal)
  # ClusterSecretStore `workflows` on mgmt (ClusterWorkflowPlane `default` secretStoreRef): dedicated identity whose
  # policy reads only workflowStore.keys (never the full `platform` store's role).
  workflowStore:
    aws:
      role: ""                 # IAM role (IRSA) allowed to read only workflowStore.keys; must differ from secrets.aws.role
    vault:
      path: ""                 # default: secrets.vault.path
      role: external-secrets-workflows   # kubernetes-auth role whose policy reads only workflowStore.keys; must differ
                                         # from secrets.vault.auth.kubernetes.role (render fails if empty or equal)

# installation.yaml (valuesObject): registry.type selects the registry push key ClusterSecretStore `workflows` may read
# on the kubernetes backend (harbor -> workflowStore.keys entry `harbor`; external -> registry.external.credentialsKey).
registry:
  type: harbor
  external:
    credentialsKey: platform-ghcr

# installation.yaml (valuesObject): dns.provider cloudflare puts the Cloudflare token behind store `dns` on workload clusters.
dns:
  provider: none

# Workload clusters: ClusterSecretStore `dns` holds the external-dns Cloudflare token (zone-wide DNS:Edit) apart from the
# tenant store `default` (the ClusterDataPlane secretStoreRef every tenant SecretReference / ExternalSecret can use).
# Only these namespaces may reference it (AGENTS.md invariant 5 exception; hack/tests/test_secret_store_scope.sh).
dnsStore:
  namespaces:
    - external-dns

# ClusterSecretStore `delivery` on byo clusters (values/provider-byo.yaml, docs/providers.md "Bring your own cluster
# (byo)"): mgmt pushes the PUBLIC material that CAPI clusters receive as ConfigMaps (gateway CA, image verification) as
# Secrets into `namespace`; the consumers' ExternalSecrets (generic target ConfigMap) read them through this store.
# Name-scoped GET of exactly `keys` (AGENTS.md invariant 5 exception: public certificates/keys only), only from
# `namespaces`. Off elsewhere: CAPI clusters get the ConfigMaps from ClusterResourceSets.
delivery:
  enabled: false
  namespace: platform-delivery
  keys:
    - cluster-gateway-ca             # ca.crt: OpenChoreo cluster-gateway CA (addon openchoreo-data-plane)
    - platform-image-verification    # cosign.pub + Harbor ca.crt (addon kyverno)
  namespaces:
    - openchoreo-data-plane
    - kyverno

# Namespaces on mgmt allowed to read ClusterSecretStore `platform` (spec.conditions). Every current consumer is listed;
# a new one must be added here (hack/tests/test_secret_store_scope.sh fails otherwise).
platformStore:
  namespaces:
    - argocd                           # platform-repo-creds (this chart)
    - fleet                            # <cluster>-registries, <cluster>-seed-* (charts/cluster); hetzner (addon clusterclasses)
    - capa-system                      # capa-variables (addon capi-providers, AWS)
    - thunder                          # thunder-bootstrap (addon thunder)
    - openchoreo-control-plane         # backstage-secrets (addon openchoreo-control-plane)
    - openchoreo-observability-plane   # opensearch-admin-credentials, observer-secret (addon openchoreo-observability-plane)
    - falco                            # falcosidekick-outputs when escalation/slack is on (addon falco, role mgmt)
    - argo-events                      # falco-webhook (+ falco-notify when on) (addon argo-events)
    - harbor                           # harbor-platform: admin, robot and component secrets (addon harbor)
    - openbao                          # openbao-unseal: static auto-unseal key of the mesh CA (addon openbao)
    - external-dns                     # external-dns-cloudflare when opted in on mgmt with Cloudflare (addon external-dns)
    - agentgateway-system              # <provider>-llm-auth when opted in (addon agentgateway)

# ClusterSecretStore `workflows` on mgmt (ClusterWorkflowPlane `default` secretStoreRef): per-run ExternalSecrets of
# build and promotion-gate ClusterWorkflows in `workflows-<openchoreo.orgNamespace>`. Restricted by namespaceRegexes to
# `workflows-*` and, on the kubernetes backend, by Role resourceNames to only the keys those workflows read (never the
# full `platform` store: AGENTS.md invariant 5; hack/tests/test_secret_store_scope.sh).
workflowStore:
  namespaceRegexes:
    - "^workflows-.+$"
  keys:
    - cosign-platform                  # build signing key (addon openchoreo-platform buildWorkflows.secrets.cosign)
    - harbor                           # Harbor builder robot when registry.type is harbor (buildWorkflows.secrets.harbor.key)
    - promotion-gate                   # Thunder client secret (addon openchoreo-platform promotionGate.clientSecret.key)
    - promotion-gate-github            # platform GitHub App: promotion gate (openchoreo-platform promotionGate.github.key),
                                       # per-run build tokens (buildWorkflows.github.key), auto-build (autoBuild.github.key)

# installation.yaml (valuesObject): previews.enabled renders templates/preview-token.yaml on mgmt.
previews:
  enabled: false

# GitHub token of the PR preview ApplicationSets' pull request generators (charts/tenant templates/previews.yaml
# previewToken.secretName must match). Installation token of the platform GitHub App (store key below, the promotion
# gate's App), restricted to `permissions`; Argo CD gets only the token.
previewToken:
  secretName: preview-github-token
  namespace: argocd
  githubKey: promotion-gate-github
  permissions: { pull_requests: read }
  refreshInterval: 30m

# Per-tenant SecretStores on workload clusters (templates/tenant-stores.yaml; installation.yaml
# secrets.tenantStores.enabled, default off; needs addon openbao on mgmt and the cluster to be a mesh member: OpenBao
# verifies the logins against the members' JWKS from the mesh-clients inputs, and the CA comes with the mesh trust).
# ClusterSecretStore default then excludes tenant namespaces (conditions), which use SecretStore storeName only.
tenantStores:
  tenantLabel: openchoreo.dev/project          # set by OpenChoreo on every cell namespace (value = project)
  storeName: openbao-tenant
  serviceAccount: openbao-tenant               # == addon openbao tenantSecrets.readerServiceAccount
  audience: openbao-tenant-secrets             # == addon openbao tenantSecrets.audience
  tokenExpirationSeconds: 600
  caSecret: { namespace: istio-system, name: openbao-ca, key: ca.crt }   # charts/cluster mesh-trust payload
  storeWriters:                                # the only identities that may write SecretStores in tenant namespaces
    - system:serviceaccount:kyverno:kyverno-background-controller

repoCreds:
  name: platform-repo-creds
  namespace: argocd
  remoteKey: platform-github
  # token: properties username + token (fine-grained PAT, read-only Contents). githubApp: properties githubAppID,
  # githubAppInstallationID, githubAppPrivateKey (preferred: Argo CD mints short-lived installation tokens).
  # Per installation: installations/<inst>/addons/secret-stores/values.yaml. docs/forking.md "Credentials".
  auth: token
