# OpenChoreo prerequisite. Gateway API CRDs come from the gateway-api-crds addon; kgateway-crds only carries the
# gateway.kgateway.dev CRDs (GatewayParameters, HTTPListenerPolicy, TrafficPolicy, ...), which the OpenChoreo charts use
# (HTTPListenerPolicy `enable-websocket`) and the OpenChoreo component types render (TrafficPolicy).
# The controller creates GatewayClass `kgateway` at startup (not rendered here, Argo does not own it). It watches
# Gateways in every namespace and deploys one envoy proxy per Gateway in the Gateway's namespace; its own namespace is
# free (upstream installs it into the plane namespace, we use the catalog namespace).
# Proxies: Service type LoadBalancer (kgateway default) -> k3s klipper servicelb binds the listener ports as hostPorts
# on the node containers (mgmt: 8080/8443 published by k3d; CAPD workload clusters: 19080 on the node IP).
# kgateway-crds ships its CRDs under templates/ and gatewayparameters is ~520 KB: the addon Application needs
# ServerSideApply=true (client-side apply's last-applied annotation is capped at 256 KiB).
kgateway-crds: {}

kgateway:
  controller:
    # Controller image pinned by multi-arch index digest (docs/conventions.md invariant 9). Only the controller: the
    # global image.tag also names the envoy-wrapper proxy image the controller deploys at runtime (another digest).
    image:
      # -- `v2.3.1` pinned by multi-arch index digest.
      tag: v2.3.1@sha256:fe72209a3dfa735d1155cc8b7ba4605d0600a0b32ec515816052c678f2d5afbf   # index: amd64, arm64
    # -- Sets CPU/memory requests (`50m` / `128Mi`) and a `512Mi` memory limit.
    resources:              # chart sets none; modest requests for a laptop, no CPU limit
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
