name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}   # GitHub API quota for mise downloads
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pinned toolchain as developers (mise.toml); the helm-unittest plugin comes from its postinstall hook.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install: true
          cache: true
      # Bump the v<N> key prefix to force one cold chart fetch everywhere (v2: Istio charts moved to OCI).
      - name: Cache Helm chart dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/helm
            charts/*/charts
            addons/*/charts
          key: helm-charts-v2-${{ hashFiles('charts/*/Chart.lock', 'addons/*/Chart.lock') }}
          restore-keys: |
            helm-charts-v2-
      # Every git hook from prek.toml on every tracked file: the same checks developers get on commit. The changed-
      # charts hook is skipped here only because `task test` below renders every chart.
      - name: Git hooks on all files (task hooks:run)
        run: task hooks:run
        env:
          SKIP: charts
      - name: Lint charts, YAML, shell scripts and GitHub Actions
        run: task lint
      - name: Run full offline validation and tests
        run: task test
