name: package-valkey

# The valkey API Configuration package (packages/valkey): PRs validate + render only; pushes to main and
# release tags (valkey-vX.Y.Z, release-please component "valkey") build, push to
# ghcr.io/koorikla/platform/valkey, cosign keyless sign and attest SLSA provenance.
# Status: layout - no cluster installs it yet (packages/valkey/README.md); enabling it adds the pin to
# addons/crossplane.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/valkey/**'
      - '.github/workflows/package-valkey.yaml'
  push:
    branches: [main]
    tags: ['valkey-v*']
    paths:
      - 'packages/valkey/**'
      - '.github/workflows/package-valkey.yaml'

concurrency:
  group: package-valkey-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/app-crossplane-configuration.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      package_root: packages/valkey
      registry: ghcr.io/koorikla/platform
