name: elixir

# Elixir / Phoenix app: erlef/setup-beam (.tool-versions or inputs), deps +
# _build cache, compile --warnings-as-errors, format check, credo, mix test
# (optional Postgres service), sobelow, hex.audit + mix_audit, Trivy fs on
# mix.lock, then container.yaml.
# CodeQL does not support Elixir; static analysis is credo + sobelow.
#
# Required caller permissions:
#   contents: read, packages: write, id-token: write, attestations: write,
#   security-events: write

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory containing mix.exs'
        required: false
        type: string
        default: '.'
      otp_version:
        description: 'OTP version (default: from .tool-versions)'
        required: false
        type: string
        default: ''
      elixir_version:
        description: 'Elixir version (default: from .tool-versions)'
        required: false
        type: string
        default: ''
      postgres:
        description: 'Start a Postgres service for tests (DATABASE_URL, PG* env are set)'
        required: false
        type: boolean
        default: false
      postgres_image:
        description: 'Postgres service image'
        required: false
        type: string
        default: 'postgres:17'
      run_credo:
        description: 'Run credo (only if it is a dependency)'
        required: false
        type: boolean
        default: true
      run_sobelow:
        description: 'Run sobelow (only if it is a dependency)'
        required: false
        type: boolean
        default: true
      test_args:
        description: 'Extra mix test arguments'
        required: false
        type: string
        default: ''
      build_container:
        description: 'Build/scan/sign the container image after checks'
        required: false
        type: boolean
        default: true
      image_name:
        description: 'Image name (default: repository name)'
        required: false
        type: string
        default: ''
      registry:
        description: 'Registry prefix (default ghcr.io/<owner>)'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context (default working_directory)'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Dockerfile (default <working_directory>/Dockerfile)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated image platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      multiarch_strategy:
        description: 'native (per-arch runners) or qemu'
        required: false
        type: string
        default: 'native'
      build_args:
        description: 'Newline-separated extra build-args'
        required: false
        type: string
        default: ''
      push:
        description: 'Push, attest and sign on non-PR events'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Severities that fail the Trivy scans (image and lockfiles)'
        required: false
        type: string
        default: 'CRITICAL'
      trivy_ignore_unfixed:
        description: 'Ignore unfixed vulnerabilities'
        required: false
        type: boolean
        default: true
      trivy_fail:
        description: 'Fail on Trivy findings at trivy_severity'
        required: false
        type: boolean
        default: true
    secrets:
      registry_username:
        description: 'Registry username (non-GHCR registries)'
        required: false
      registry_password:
        description: 'Registry password/token (non-GHCR registries)'
        required: false
    outputs:
      image:
        description: 'Image reference tagged with the short SHA'
        value: ${{ jobs.container.outputs.image }}
      image_ref:
        description: 'Alias of image'
        value: ${{ jobs.container.outputs.image_ref }}
      image_repo:
        description: 'Image repository without tag'
        value: ${{ jobs.container.outputs.image_repo }}
      digest:
        description: 'Manifest-list digest'
        value: ${{ jobs.container.outputs.digest }}
      image_digest_ref:
        description: 'Immutable <repo>@sha256:... reference'
        value: ${{ jobs.container.outputs.image_digest_ref }}
      short_sha:
        description: '7-character commit SHA'
        value: ${{ jobs.container.outputs.short_sha }}

permissions:
  contents: read

jobs:
  test:
    name: compile, format, credo, test, sobelow, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: elixir-test-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    services:
      postgres:
        # An empty image disables the service.
        image: ${{ inputs.postgres && inputs.postgres_image || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: ecto://postgres:postgres@localhost/test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch koorikla/ci scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/ci}.git" "${CI_SHA:-v1}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Set up BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ inputs.otp_version }}
          elixir-version: ${{ inputs.elixir_version }}
          version-file: ${{ inputs.elixir_version == '' && format('{0}/.tool-versions', inputs.working_directory) || '' }}
          version-type: ${{ inputs.elixir_version == '' && 'strict' || 'loose' }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            ${{ inputs.working_directory }}/deps
            ${{ inputs.working_directory }}/_build
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles(format('{0}/mix.lock', inputs.working_directory)) }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Compile, format, credo, test, sobelow, audit
        env:
          WORKDIR: ${{ inputs.working_directory }}
          RUN_CREDO: ${{ inputs.run_credo }}
          RUN_SOBELOW: ${{ inputs.run_sobelow }}
          TEST_ARGS: ${{ inputs.test_args }}
        run: bash "$CI_SCRIPTS/elixir/check.sh"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Trivy fs scan of lockfiles
        id: fsscan
        env:
          SCAN_PATH: ${{ inputs.working_directory }}
          FAIL_SEVERITIES: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          FAIL_ON_FINDINGS: ${{ inputs.trivy_fail }}
          SKIP_DIRS: "**/deps,**/_build"
        run: bash "$CI_SCRIPTS/common/scan-fs.sh"

      - name: Upload Trivy fs SARIF
        if: always() && steps.fsscan.outputs.fs_sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.fsscan.outputs.fs_sarif }}
          category: trivy-fs-elixir-${{ inputs.working_directory }}

  container:
    name: image
    needs: [test]
    if: >-
      always() && inputs.build_container &&
      needs.test.result == 'success'
    uses: $/.github/workflows/container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ${{ inputs.image_name }}
      registry: ${{ inputs.registry }}
      context: ${{ inputs.context != '' && inputs.context || inputs.working_directory }}
      dockerfile: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.working_directory) }}
      platforms: ${{ inputs.platforms }}
      multiarch_strategy: ${{ inputs.multiarch_strategy }}
      build_args: ${{ inputs.build_args }}
      push: ${{ inputs.push }}
      trivy_severity: ${{ inputs.trivy_severity }}
      trivy_ignore_unfixed: ${{ inputs.trivy_ignore_unfixed }}
      trivy_fail: ${{ inputs.trivy_fail }}
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}
