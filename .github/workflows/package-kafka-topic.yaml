name: package-kafka-topic

# Crossplane Project packages/kafka-topic (docs/crossplane.md): validate + render on PRs; build, push and sign on main/tags.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/kafka-topic/**'
      - '.github/workflows/package-kafka-topic.yaml'
  push:
    branches: [main]
    tags: ['kafka-topic-v*']
    paths:
      - 'packages/kafka-topic/**'
      - '.github/workflows/package-kafka-topic.yaml'

concurrency:
  group: package-kafka-topic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/app-crossplane-configuration.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      package_root: packages/kafka-topic
      registry: ghcr.io/koorikla/platform
