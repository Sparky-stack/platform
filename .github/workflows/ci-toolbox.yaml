name: toolbox

# Builds ghcr.io/koorikla/ci-toolbox (multi-arch, scanned, SBOM, attested,
# cosign-signed) with the same container.yaml app repos use, then smoke-tests
# the pushed image natively on amd64 and arm64.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ci-toolbox.yaml'
      - 'ci/toolbox/**'
      - 'ci/scripts/**'
  push:
    # Leftover from koorikla/ci (where `v1` was the toolbox tag): platform `v*` release
    # tags rebuild the toolbox too (paths are not evaluated for tag pushes). Release-please
    # tags ci/ as `ci-v*`, which does not match.
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/workflows/ci-toolbox.yaml'
      - 'ci/toolbox/**'
      - 'ci/scripts/**'

concurrency:
  group: toolbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/app-container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ci-toolbox
      context: ci
      dockerfile: ci/toolbox/Dockerfile

  smoke:
    name: smoke ${{ matrix.runner }}
    needs: image
    if: needs.image.outputs.image_digest_ref != ''
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run toolbox-smoke
        env:
          IMAGE: ${{ needs.image.outputs.image_digest_ref }}
        run: docker run --rm "$IMAGE" toolbox-smoke
