name: go

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Go module directory relative to repo root'
        required: false
        type: string
        default: '.'
      go_version_file:
        description: 'Path to go.mod or .go-version (defaults to <working_directory>/go.mod)'
        required: false
        type: string
        default: ''
      run_lint:
        description: 'Run golangci-lint'
        required: false
        type: boolean
        default: true
      run_vulncheck:
        description: 'Run govulncheck'
        required: false
        type: boolean
        default: true
      run_codeql:
        description: 'Run CodeQL analysis for Go'
        required: false
        type: boolean
        default: true
      extra_test_cmd:
        description: 'Optional extra test/validation command to run after Go tests'
        required: false
        type: string
        default: ''
      build_container:
        description: 'Build, scan, and sign container image after checks'
        required: false
        type: boolean
        default: true
      image_name:
        description: 'Container image name override'
        required: false
        type: string
        default: ''
      registry:
        description: 'Target OCI registry prefix (defaults to ghcr.io/<owner>)'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context directory (defaults to working_directory)'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Path to Dockerfile (defaults to <working_directory>/Dockerfile)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms for docker buildx'
        required: false
        type: string
        default: 'linux/amd64'
      build_args:
        description: 'Additional newline-separated Docker build-args'
        required: false
        type: string
        default: ''
      push:
        description: 'Push image to registry on non-PR events'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Comma-separated Trivy severities that fail the build'
        required: false
        type: string
        default: 'CRITICAL'
      trivy_ignore_unfixed:
        description: 'Ignore unfixed vulnerabilities in Trivy scan'
        required: false
        type: boolean
        default: true
    secrets:
      registry_username:
        description: 'Optional registry username'
        required: false
      registry_password:
        description: 'Optional registry password/token'
        required: false
    outputs:
      image_ref:
        description: 'Pushed image reference with short SHA tag'
        value: ${{ jobs.container.outputs.image_ref }}
      image:
        description: 'Alias for image_ref'
        value: ${{ jobs.container.outputs.image }}
      image_repo:
        description: 'Image repository without tag'
        value: ${{ jobs.container.outputs.image_repo }}
      digest:
        description: 'Pushed OCI image manifest digest'
        value: ${{ jobs.container.outputs.digest }}
      image_digest_ref:
        description: 'Immutable digest reference'
        value: ${{ jobs.container.outputs.image_digest_ref }}
      short_sha:
        description: '7-character commit SHA'
        value: ${{ jobs.container.outputs.short_sha }}

permissions:
  contents: read

jobs:
  test:
    name: Go vet, lint, test, govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: go-test-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load koorikla/ci scripts
        id: ci_scripts
        env:
          REPO: ${{ github.repository }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          if [ "$REPO" = "koorikla/ci" ] && [ -d "$GITHUB_WORKSPACE/scripts" ]; then
            echo "dir=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_OUTPUT"
          else
            rm -rf "$RUNNER_TEMP_DIR/koorikla-ci"
            git clone --depth 1 https://github.com/koorikla/ci.git "$RUNNER_TEMP_DIR/koorikla-ci"
            echo "dir=$RUNNER_TEMP_DIR/koorikla-ci/scripts" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file != '' && inputs.go_version_file || (inputs.working_directory == '.' && 'go.mod' || format('{0}/go.mod', inputs.working_directory)) }}
          cache-dependency-path: ${{ inputs.go_version_file != '' && inputs.go_version_file || (inputs.working_directory == '.' && 'go.mod' || format('{0}/go.mod', inputs.working_directory)) }}

      - name: Run golangci-lint
        if: inputs.run_lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ inputs.working_directory }}

      - name: Run Go vet, race tests with coverage, and govulncheck
        env:
          WORKDIR: ${{ inputs.working_directory }}
          RUN_LINT: 'false'
          RUN_VULNCHECK: ${{ inputs.run_vulncheck }}
          SCRIPTS_DIR: ${{ steps.ci_scripts.outputs.dir }}
        run: bash "${SCRIPTS_DIR}/go/check.sh"

      - name: Run extra validation command
        if: inputs.extra_test_cmd != ''
        working-directory: ${{ inputs.working_directory }}
        env:
          EXTRA_CMD: ${{ inputs.extra_test_cmd }}
        run: bash -euo pipefail -c "$EXTRA_CMD"

  codeql:
    name: CodeQL (Go)
    if: inputs.run_codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: go-codeql-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file != '' && inputs.go_version_file || (inputs.working_directory == '.' && 'go.mod' || format('{0}/go.mod', inputs.working_directory)) }}
          cache-dependency-path: ${{ inputs.go_version_file != '' && inputs.go_version_file || (inputs.working_directory == '.' && 'go.mod' || format('{0}/go.mod', inputs.working_directory)) }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build Go module for CodeQL
        working-directory: ${{ inputs.working_directory }}
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:go/${{ inputs.working_directory }}'

  container:
    name: Container image
    needs: [test, codeql]
    if: always() && inputs.build_container && needs.test.result == 'success' && (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    uses: koorikla/ci/.github/workflows/container.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ${{ inputs.image_name }}
      registry: ${{ inputs.registry }}
      context: ${{ inputs.context != '' && inputs.context || inputs.working_directory }}
      dockerfile: ${{ inputs.dockerfile != '' && inputs.dockerfile || (inputs.working_directory == '.' && 'Dockerfile' || format('{0}/Dockerfile', inputs.working_directory)) }}
      platforms: ${{ inputs.platforms }}
      build_args: ${{ inputs.build_args }}
      push: ${{ inputs.push }}
      trivy_severity: ${{ inputs.trivy_severity }}
      trivy_ignore_unfixed: ${{ inputs.trivy_ignore_unfixed }}
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}
