name: selftest

# Exercises every reusable workflow against fixtures/<stack>. Images go to
# ghcr.io/koorikla/ci-selftest-<stack>.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/**'
      - 'fixtures/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'fixtures/**'
      - 'scripts/**'

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck scripts (bash 3.2 portable)
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -x -S style
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  go:
    uses: ./.github/workflows/go.yaml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      working_directory: fixtures/go
      image_name: ci-selftest-go

  nextjs:
    uses: ./.github/workflows/nextjs.yaml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      working_directory: fixtures/nextjs
      image_name: ci-selftest-nextjs
