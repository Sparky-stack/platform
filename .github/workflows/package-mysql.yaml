name: package-mysql

# The mysql API Configuration package (packages/mysql): PRs validate + render only; pushes to main and
# release tags (mysql-vX.Y.Z, release-please component "mysql") build, push to
# ghcr.io/koorikla/platform/mysql, cosign keyless sign and attest SLSA provenance.
# Status: layout - no cluster installs it yet (packages/mysql/README.md); enabling it adds the pin to
# addons/crossplane.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/mysql/**'
      - '.github/workflows/package-mysql.yaml'
  push:
    branches: [main]
    tags: ['mysql-v*']
    paths:
      - 'packages/mysql/**'
      - '.github/workflows/package-mysql.yaml'

concurrency:
  group: package-mysql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/app-crossplane-configuration.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      package_root: packages/mysql
      registry: ghcr.io/koorikla/platform
