name: package-mysql

# Crossplane Project packages/mysql (docs/crossplane.md): validate + render on PRs; build, push and sign on main/tags.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/mysql/**'
      - '.github/workflows/package-mysql.yaml'
  push:
    branches: [main]
    tags: ['mysql-v*']
    paths:
      - 'packages/mysql/**'
      - '.github/workflows/package-mysql.yaml'

concurrency:
  group: package-mysql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/app-crossplane-configuration.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      package_root: packages/mysql
      registry: ghcr.io/koorikla/platform
