name: container

# Shared building block: multi-arch buildx build -> push -> Trivy scan ->
# SPDX SBOM -> GitHub attestations (SLSA provenance, SBOM) -> cosign keyless
# sign (+ cosign vuln attestation). Called by every stack workflow; can also be
# called directly for repos that only ship a Dockerfile.
#
# Required caller permissions (job that `uses:` this workflow):
#   contents: read, packages: write, id-token: write, attestations: write,
#   security-events: write

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (default: repository name)'
        required: false
        type: string
        default: ''
      registry:
        description: 'Registry prefix, e.g. ghcr.io/koorikla or harbor.example.com/apps (default ghcr.io/<owner>)'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to the Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Comma-separated target platforms (PR builds are linux/amd64 only)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      build_args:
        description: 'Newline-separated extra build-args (VERSION=<short sha> is always set)'
        required: false
        type: string
        default: ''
      push:
        description: 'Push, attest and sign on non-PR events'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Comma-separated severities that fail the Trivy scan'
        required: false
        type: string
        default: 'CRITICAL'
      trivy_ignore_unfixed:
        description: 'Ignore vulnerabilities without a fixed version'
        required: false
        type: boolean
        default: true
      trivy_fail:
        description: 'Fail the job on findings at trivy_severity (false = report only)'
        required: false
        type: boolean
        default: true
      upload_sarif:
        description: 'Upload Trivy SARIF to GitHub code scanning'
        required: false
        type: boolean
        default: true
      sarif_category:
        description: 'Code-scanning category (default container-<image>)'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'If set, download this workflow artifact into <context> before building (e.g. a prebuilt binary or xpkg inputs)'
        required: false
        type: string
        default: ''
    secrets:
      registry_username:
        description: 'Registry username (default github.actor; needed for non-GHCR registries)'
        required: false
      registry_password:
        description: 'Registry password/token (default GITHUB_TOKEN)'
        required: false
    outputs:
      image:
        description: 'Image reference tagged with the short SHA (<repo>:<short_sha>)'
        value: ${{ jobs.container.outputs.image }}
      image_ref:
        description: 'Alias of image'
        value: ${{ jobs.container.outputs.image }}
      image_repo:
        description: 'Image repository without tag'
        value: ${{ jobs.container.outputs.image_repo }}
      digest:
        description: 'Manifest-list (index) digest sha256:... (empty on PRs)'
        value: ${{ jobs.container.outputs.digest }}
      image_digest_ref:
        description: 'Immutable reference <repo>@sha256:... (empty on PRs)'
        value: ${{ jobs.container.outputs.image_digest_ref }}
      short_sha:
        description: '7-character commit SHA used as tag'
        value: ${{ jobs.container.outputs.short_sha }}

permissions:
  contents: read

jobs:
  container:
    name: Build, scan, SBOM, sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: container-${{ github.repository }}-${{ inputs.image_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      image_repo: ${{ steps.vars.outputs.repo }}
      digest: ${{ steps.vars.outputs.should_push == 'true' && steps.build.outputs.digest || '' }}
      image_digest_ref: ${{ steps.vars.outputs.should_push == 'true' && format('{0}@{1}', steps.vars.outputs.repo, steps.build.outputs.digest) || '' }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch koorikla/ci scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/ci}.git" "${CI_SHA:-v1}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Download build artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.context }}

      - name: Compute image coordinates
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          INPUT_PUSH: ${{ inputs.push }}
          EVENT_NAME: ${{ github.event_name }}
          SARIF_CATEGORY: ${{ inputs.sarif_category }}
        run: bash "$CI_SCRIPTS/common/image-meta.sh"

      - name: Set up QEMU (cross-platform RUN steps)
        if: steps.vars.outputs.should_push == 'true' && inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.vars.outputs.repo }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.short_sha }}
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to registry
        if: steps.vars.outputs.should_push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.vars.outputs.registry_host }}
          username: ${{ secrets.registry_username || github.actor }}
          password: ${{ secrets.registry_password || github.token }}

      - name: Build (and push manifest list)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ steps.vars.outputs.should_push == 'true' && inputs.platforms || 'linux/amd64' }}
          push: ${{ steps.vars.outputs.should_push == 'true' }}
          load: ${{ steps.vars.outputs.should_push != 'true' }}
          tags: ${{ steps.vars.outputs.should_push == 'true' && steps.meta.outputs.tags || steps.vars.outputs.image }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.vars.outputs.should_push == 'true' && steps.meta.outputs.annotations || '' }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.vars.outputs.short_sha }}
            ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ steps.vars.outputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.image_name }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.3

      - name: Trivy DB cache key
        id: trivy_key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.trivy_key.outputs.date }}
          restore-keys: trivy-db-

      - name: Trivy scan (all platforms)
        id: scan
        env:
          IMAGE_REF: ${{ steps.vars.outputs.should_push == 'true' && format('{0}@{1}', steps.vars.outputs.repo, steps.build.outputs.digest) || steps.vars.outputs.image }}
          IMAGE_SRC: ${{ steps.vars.outputs.should_push == 'true' && 'remote' || 'docker' }}
          PLATFORMS: ${{ inputs.platforms }}
          FAIL_SEVERITIES: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          FAIL_ON_FINDINGS: ${{ inputs.trivy_fail }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: bash "$CI_SCRIPTS/common/scan-image.sh"

      - name: Upload Trivy SARIF
        if: always() && inputs.upload_sarif && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.CI_OUT_DIR }}/trivy.sarif
          category: ${{ steps.vars.outputs.sarif_cat }}

      - name: SBOM (SPDX JSON, syft)
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          IMAGE_REF: ${{ steps.vars.outputs.should_push == 'true' && format('{0}@{1}', steps.vars.outputs.repo, steps.build.outputs.digest) || steps.vars.outputs.image }}
          SOURCE: ${{ steps.vars.outputs.should_push == 'true' && 'registry' || 'docker' }}
          PLATFORM: linux/amd64
        run: |
          PATH="$(dirname "$SYFT_CMD"):$PATH" bash "$CI_SCRIPTS/common/sbom.sh"

      - name: Attest SLSA build provenance
        if: steps.vars.outputs.should_push == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.vars.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        if: steps.vars.outputs.should_push == 'true'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.vars.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ env.CI_OUT_DIR }}/sbom.spdx.json
          push-to-registry: true

      - name: Install cosign
        if: steps.vars.outputs.should_push == 'true'
        uses: sigstore/cosign-installer@v4.1.3

      - name: Cosign keyless sign + vuln attestation
        if: steps.vars.outputs.should_push == 'true'
        env:
          IMAGE_DIGEST_REF: ${{ steps.vars.outputs.repo }}@${{ steps.build.outputs.digest }}
          VULN_PREDICATE: ${{ env.CI_OUT_DIR }}/trivy-vuln.json
        run: bash "$CI_SCRIPTS/common/sign-image.sh"

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: container-reports-${{ steps.vars.outputs.image_name }}
          path: ${{ env.CI_OUT_DIR }}
          if-no-files-found: ignore
          retention-days: 14
