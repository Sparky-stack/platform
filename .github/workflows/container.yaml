name: container

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Container image name (defaults to repository name)'
        required: false
        type: string
        default: ''
      registry:
        description: 'Target OCI registry prefix (defaults to ghcr.io/<owner>)'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context directory'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Target platforms for docker buildx (e.g. linux/amd64 or linux/amd64,linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64'
      build_args:
        description: 'Additional newline-separated Docker build-args'
        required: false
        type: string
        default: ''
      push:
        description: 'Push image to registry on non-PR events'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Comma-separated Trivy severities that fail the build'
        required: false
        type: string
        default: 'CRITICAL'
      trivy_ignore_unfixed:
        description: 'Ignore unfixed vulnerabilities in Trivy scan'
        required: false
        type: boolean
        default: true
      trivy_exit_code:
        description: 'Exit code when Trivy finds vulnerabilities of trivy_severity'
        required: false
        type: string
        default: '1'
      upload_sarif:
        description: 'Upload Trivy SARIF report to GitHub Code Scanning'
        required: false
        type: boolean
        default: true
      sarif_category:
        description: 'Optional SARIF category override'
        required: false
        type: string
        default: ''
    secrets:
      registry_username:
        description: 'Optional registry username (defaults to github.actor)'
        required: false
      registry_password:
        description: 'Optional registry password/token (defaults to github.token)'
        required: false
    outputs:
      image_ref:
        description: 'Pushed image reference with short SHA tag (<registry>/<owner>/<name>:<short_sha>)'
        value: ${{ jobs.container.outputs.image_ref }}
      image:
        description: 'Alias for image_ref (<registry>/<owner>/<name>:<short_sha>)'
        value: ${{ jobs.container.outputs.image }}
      image_repo:
        description: 'Image repository without tag (<registry>/<owner>/<name>)'
        value: ${{ jobs.container.outputs.image_repo }}
      digest:
        description: 'Pushed OCI image manifest digest (sha256:...)'
        value: ${{ jobs.container.outputs.digest }}
      image_digest_ref:
        description: 'Immutable digest reference (<registry>/<owner>/<name>@sha256:...)'
        value: ${{ jobs.container.outputs.image_digest_ref }}
      short_sha:
        description: '7-character commit SHA used for image tag'
        value: ${{ jobs.container.outputs.short_sha }}

permissions:
  contents: read

jobs:
  container:
    name: Build, scan, SBOM, sign
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: container-${{ github.repository }}-${{ inputs.image_name || 'default' }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      image_ref: ${{ steps.vars.outputs.image }}
      image: ${{ steps.vars.outputs.image }}
      image_repo: ${{ steps.vars.outputs.repo }}
      digest: ${{ steps.build.outputs.digest }}
      image_digest_ref: ${{ steps.vars.outputs.repo }}@${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load koorikla/ci scripts
        id: ci_scripts
        env:
          REPO: ${{ github.repository }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          if [ "$REPO" = "koorikla/ci" ] && [ -d "$GITHUB_WORKSPACE/scripts" ]; then
            echo "dir=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_OUTPUT"
          else
            rm -rf "$RUNNER_TEMP_DIR/koorikla-ci"
            git clone --depth 1 https://github.com/koorikla/ci.git "$RUNNER_TEMP_DIR/koorikla-ci"
            echo "dir=$RUNNER_TEMP_DIR/koorikla-ci/scripts" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image metadata
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          INPUT_PUSH: ${{ inputs.push }}
          EVENT_NAME: ${{ github.event_name }}
          SARIF_CATEGORY: ${{ inputs.sarif_category }}
          SCRIPTS_DIR: ${{ steps.ci_scripts.outputs.dir }}
        run: bash "${SCRIPTS_DIR}/common/image-meta.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.repo }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.short_sha }}
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to container registry
        if: steps.vars.outputs.should_push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.vars.outputs.registry_host }}
          username: ${{ secrets.registry_username || github.actor }}
          password: ${{ secrets.registry_password || github.token }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ steps.vars.outputs.should_push == 'true' && inputs.platforms || 'linux/amd64' }}
          push: ${{ steps.vars.outputs.should_push == 'true' }}
          load: ${{ steps.vars.outputs.should_push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.vars.outputs.short_sha }}
            ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull image into local daemon for scanning
        if: steps.vars.outputs.should_push == 'true'
        env:
          IMAGE_REF: ${{ steps.vars.outputs.image }}
        run: docker pull --platform linux/amd64 "${IMAGE_REF}"

      - name: Trivy image vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.vars.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy_severity }}
          ignore-unfixed: ${{ inputs.trivy_ignore_unfixed }}
          exit-code: ${{ inputs.trivy_exit_code }}
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: always() && inputs.upload_sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: ${{ steps.vars.outputs.sarif_cat }}

      - name: Trivy vulnerability report for Cosign attestation
        if: steps.vars.outputs.should_push == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.vars.outputs.image }}
          format: cosign-vuln
          output: trivy-vuln.json
          severity: ${{ inputs.trivy_severity }}
          ignore-unfixed: ${{ inputs.trivy_ignore_unfixed }}
          exit-code: '0'
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Generate SPDX JSON SBOM (Syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.vars.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SLSA build provenance
        if: steps.vars.outputs.should_push == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.vars.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SPDX SBOM
        if: steps.vars.outputs.should_push == 'true'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.vars.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Install Cosign
        if: steps.vars.outputs.should_push == 'true'
        uses: sigstore/cosign-installer@v4.1.3

      - name: Cosign keyless sign and attest vulnerabilities
        if: steps.vars.outputs.should_push == 'true'
        env:
          IMAGE_DIGEST_REF: ${{ steps.vars.outputs.repo }}@${{ steps.build.outputs.digest }}
          VULN_PREDICATE: trivy-vuln.json
          SCRIPTS_DIR: ${{ steps.ci_scripts.outputs.dir }}
        run: bash "${SCRIPTS_DIR}/common/sign-image.sh"
