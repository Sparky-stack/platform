name: toolbox

# Builds ghcr.io/koorikla/ci-toolbox (multi-arch, scanned, SBOM, attested,
# cosign-signed) with the same container.yaml app repos use, then smoke-tests
# the pushed image natively on amd64 and arm64.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'toolbox/**'
      - 'scripts/**'
      - '.github/workflows/toolbox.yaml'
      - '.github/workflows/container.yaml'
  push:
    branches: [main]
    paths:
      - 'toolbox/**'
      - 'scripts/**'
      - '.github/workflows/toolbox.yaml'
      - '.github/workflows/container.yaml'

concurrency:
  group: toolbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ci-toolbox
      context: .
      dockerfile: toolbox/Dockerfile

  smoke:
    name: smoke ${{ matrix.runner }}
    needs: image
    if: needs.image.outputs.image_digest_ref != ''
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run toolbox-smoke
        env:
          IMAGE: ${{ needs.image.outputs.image_digest_ref }}
        run: docker run --rm "$IMAGE" toolbox-smoke
