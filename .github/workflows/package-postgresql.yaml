name: package-postgresql

# Crossplane Project packages/postgresql (docs/crossplane.md): validate + render on PRs; build, push and sign on main/tags.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/postgresql/**'
      - '.github/workflows/package-postgresql.yaml'
  push:
    branches: [main]
    tags: ['postgresql-v*']
    paths:
      - 'packages/postgresql/**'
      - '.github/workflows/package-postgresql.yaml'

concurrency:
  group: package-postgresql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/app-crossplane-configuration.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      package_root: packages/postgresql
      registry: ghcr.io/koorikla/platform
