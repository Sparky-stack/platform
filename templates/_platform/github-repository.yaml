# Governance record of ${{ values.repoOwner }}/${{ values.name }}, written by the Backstage scaffolder (golden path
# `${{ values.stack }}`, docs/project-templates.md). Day-0 only: the scaffolder creates the repository and its content;
# repository settings, the default-branch ruleset, permissions and GitHub App installations are reconciled from this
# record by Crossplane on mgmt (Sparky-stack/platform#100; schema owned there).
apiVersion: platform.koorikla.io/v1alpha1
kind: GitHubRepository
metadata:
  name: ${{ values.name }}
spec:
  name: ${{ values.name }}
  owner: ${{ values.repoOwner }}
  tenant: ${{ values.project }}
  framework: ${{ values.stack }}
  visibility: ${{ values.visibility }}
  ownerTeam: ${{ values.codeowners | dump }}   # personal account: GitHub users (CODEOWNERS of the repo)
  gated: true                                    # production promotion gate (docs/promotion.md)
  environments: [development, staging, production]
