[project]
name = "${{ values.name }}"
version = "0.1.0"
requires-python = ">=3.13"        # = the distroless runtime (gcr.io/distroless/python3-debian13)
dependencies = [
  "fastapi>=0.163.1",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
]

[tool.uv]
package = false                   # an application: dependencies only, the code is copied into the image

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
