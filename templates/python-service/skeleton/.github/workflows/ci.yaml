# Golden-path CI (koorikla/platform templates/python-service). Thin caller: the pipeline lives in koorikla/ci, pinned by
# commit SHA (Renovate bumps it, renovate.json); the same SHA is what the platform's Kyverno policy trusts for
# keyless signatures.
name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate OpenChoreo manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate OpenChoreo manifests
        run: uv run --with pyyaml --with jsonschema python3 hack/validate-manifests.py

  # INTERIM until koorikla/ci ships python.yaml (ruff, pytest and pip-audit/osv-scanner, CodeQL).
  # TODO(koorikla/ci#1): switch to koorikla/ci/.github/workflows/python.yaml@<sha> # v1
  # Meanwhile container.yaml builds the multi-arch image and the Dockerfile's build stage runs ruff and pytest, so
  # a failing test fails this job. PRs: build + scan only; main: push, SBOM, provenance, keyless signature.
  build:
    needs: validate-manifests
    uses: koorikla/ci/.github/workflows/container.yaml@de39b1d4162e18e275c7be7e86384d22cc4e070b # v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

  # Push to main: pin the new image (<image>:<short sha>@sha256:<index digest>) and its commit in the OpenChoreo
  # Workload; OpenChoreo deploys it to development (Component autoDeploy).
  bump:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Bump OpenChoreo Workload
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          NEW_COMMIT: ${{ github.sha }}
        run: python3 hack/bump-workload.py
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate bumped manifests
        run: uv run --with pyyaml --with jsonschema python3 hack/validate-manifests.py
      - name: Commit and push Workload bump
        env:
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet deploy/openchoreo/workload.yaml; then
            echo 'No workload changes to commit'
            exit 0
          fi
          git add deploy/openchoreo/workload.yaml
          git commit -m "chore(deploy): bump ${REPO_NAME} image to ${SHORT_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin main
