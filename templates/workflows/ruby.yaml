# Copy to .github/workflows/ci.yaml. Docs: https://github.com/koorikla/ci
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ruby:
    uses: koorikla/ci/.github/workflows/ruby.yaml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      postgres: true            # Rails: DATABASE_URL points at the service
      # test_command: bin/rails test
