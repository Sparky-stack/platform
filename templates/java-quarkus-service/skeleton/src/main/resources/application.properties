# GREETING and APP_VERSION come from the environment (OpenChoreo Workload env; the image sets APP_VERSION).
app.greeting=${GREETING:hello}
app.version=${APP_VERSION:dev}
quarkus.http.port=${PORT:8080}
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
%test.app.greeting=tere
%test.app.version=abc1234
