# The OpenChoreo Workload: image, config, endpoint. CI writes image and commit on every push to main.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: ${{ values.name }}-workload
spec:
  owner:
    projectName: ${{ values.project }}
    componentName: ${{ values.name }}
  source:
    repository: https://github.com/${{ values.repoOwner }}/${{ values.name }}
    branch: main
    commit: "0000000" # replaced by the first CI build
  container:
    image: ghcr.io/${{ values.imageOwner }}/${{ values.name }}:main
    env:
      - key: GREETING
        value: hello
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
