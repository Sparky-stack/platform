# production: promote = a PR setting releaseName to the ComponentRelease running in staging (README).
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: ${{ values.name }}-production
spec:
  owner:
    projectName: ${{ values.project }}
    componentName: ${{ values.name }}
  environment: production
  componentTypeEnvironmentConfigs:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from production
