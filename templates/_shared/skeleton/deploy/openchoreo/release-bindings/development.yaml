# development: no releaseName, OpenChoreo moves it to every new build (Component autoDeploy).
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: ${{ values.name }}-development
spec:
  owner:
    projectName: ${{ values.project }}
    componentName: ${{ values.name }}
  environment: development
  componentTypeEnvironmentConfigs:
    replicas: 1
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from development
