# ReleaseBinding for `development` (first environment of the pipeline).
#
# spec.releaseName is intentionally NOT set: with Component.spec.autoDeploy the OpenChoreo controller owns it and moves
# it to the latest ComponentRelease on every Workload change (Argo CD ignores /spec/releaseName). The name must stay
# <component>-<env>: it is the name the controller would create.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: ${{ values.name }}-development
spec:
  owner:
    projectName: ${{ values.project }}
    componentName: ${{ values.name }}
  environment: development
  componentTypeEnvironmentConfigs:
    replicas: 1
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from development
