# ReleaseBinding for `staging`.
#
# PROMOTION = a PR that sets spec.releaseName to the ComponentRelease currently running in development. Until it is
# set, this binding stays pending (ReleaseSynced=False, ComponentReleaseNotFound).
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: ${{ values.name }}-staging
spec:
  owner:
    projectName: ${{ values.project }}
    componentName: ${{ values.name }}
  environment: staging
  componentTypeEnvironmentConfigs:
    replicas: 1
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from staging
