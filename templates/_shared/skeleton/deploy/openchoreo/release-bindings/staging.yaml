# staging: promote = a PR setting releaseName to the ComponentRelease running in development (README).
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: ${{ values.name }}-staging
spec:
  owner:
    projectName: ${{ values.project }}
    componentName: ${{ values.name }}
  environment: staging
  componentTypeEnvironmentConfigs:
    replicas: 1
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from staging
