# The OpenChoreo Component: what ${{ values.name }} is (README "Files").
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  annotations:
    openchoreo.dev/display-name: ${{ values.name | dump }}
    openchoreo.dev/description: ${{ values.description | dump }}
spec:
  owner:
    projectName: ${{ values.project }}
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true # each new image goes to development; staging and production move by PR (release-bindings/)
  traits:
    - kind: ClusterTrait
      name: health-probes # production requires the readiness probe
      instanceName: probes
      parameters:
        readiness: { enabled: true, handler: { httpGet: { port: 8080, path: /healthz } }, periodSeconds: 5 }
        liveness: { enabled: true, handler: { httpGet: { port: 8080, path: /healthz } }, periodSeconds: 10 }
