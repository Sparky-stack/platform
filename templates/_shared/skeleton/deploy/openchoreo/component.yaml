# OpenChoreo Component: the developer-facing definition of ${{ values.name }}.
#
# No metadata.namespace on purpose: the platform's Argo CD Application sets the destination namespace (the OpenChoreo
# org namespace). The Application exists once the platform PR the scaffolder opened is merged (tenant wiring).
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  annotations:
    openchoreo.dev/display-name: ${{ values.name | dump }}
    openchoreo.dev/description: ${{ values.description | dump }}
spec:
  owner:
    projectName: ${{ values.project }} # immutable; the Project comes from the platform's tenant file
  componentType:
    # Upstream 1.3.3 default ClusterComponentType `service` (workloadType deployment). Immutable after creation.
    kind: ClusterComponentType
    name: deployment/service
  # autoDeploy: every Workload change (CI bumps the image on push to main) cuts a ComponentRelease and points the first
  # pipeline environment (development) at it. Staging and production move only through reviewed PRs that set
  # spec.releaseName in release-bindings/<env>.yaml.
  autoDeploy: true
