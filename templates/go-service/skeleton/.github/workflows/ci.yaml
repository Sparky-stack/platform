# CI (README "CI"): checks and a signed image from the platform's pipeline, pinned by SHA (Renovate bumps it).
name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['deploy/**'] # the bump commit below

permissions:
  contents: read

jobs:
  build:
    uses: Sparky-stack/platform/.github/workflows/app-go.yaml@3311f541a8eab72a2649b6f1eda4fe05efa3142e # ci-v1.0.0
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

  # Push to main: pin the new image digest in deploy/openchoreo/workload.yaml; OpenChoreo deploys it to development.
  bump:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Sparky-stack/platform/.github/workflows/app-workload-bump.yaml@3311f541a8eab72a2649b6f1eda4fe05efa3142e # ci-v1.0.0
    permissions:
      contents: write
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
