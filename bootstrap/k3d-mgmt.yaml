# k3d configuration for the local management cluster (platform-mgmt).
# Joins docker network "kind" so CAPD workload containers and k3d-platform-mgmt-serverlb share DNS/routing.
# Mounts /var/run/docker.sock so the in-cluster CAPD controller can manage workload Docker containers.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: platform-mgmt
servers: 1
agents: 0
# Same k3s as the workload clusters (OpenChoreo CRDs need a recent API server, CEL); fully qualified and pinned by
# multi-arch index digest (amd64, arm64, arm). VERIFY on the next `task up` (k3d passes the reference to docker as is).
image: docker.io/rancher/k3s:v1.35.10-k3s1@sha256:8262ca99a558dca0c0437443421986480b2359f9118f2371359f88a41514522f
network: kind
options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      # Embedded etcd instead of kine/SQLite even with one server: the SQLite datastore of a busy mgmt (Argo CD, CAPI,
      # OpenChoreo, Workflows) grew to ~1.8 GB and kine's compaction failed at the same revision on every start, a
      # crash loop every ~11 min (#76). etcd compacts incrementally. k3d adds this flag itself only when servers > 1.
      - arg: --cluster-init
        nodeFilters:
          - server:0
      # No fsync in the mgmt etcd (#344): this host-shared disk stalled WAL and bolt fsyncs past 8 s and one apply for
      # 29-31 s during a clean bootstrap; a stall over 30 s makes k3s exit ("leaderelection lost for k3s") and Docker
      # restarts every mgmt pod. A container restart keeps the host page cache; only a host/VM crash can lose recent
      # writes, and the lab is rebuilt with `task down up` then. Inside the container, so the same on every Docker host.
      - arg: --etcd-arg=unsafe-no-fsync=true
        nodeFilters:
          - server:0
      # Longer leader election for the embedded controllers, to ride out slow etcd fsyncs. k3s exits on a missed renewal
      # ("leaderelection lost"), and the clean bootstrap's I/O burst (CAPD nodes, Harbor, image pulls) stalls etcd
      # fdatasync for 5-8 s on a busy host: 5 mgmt restarts in the first 15 min, each restarting every mgmt pod.
      # Upstream 15s/10s/2s. Same values as the CAPD ClusterClass (charts/cluster k3s.dockerLeaderElectionArgs,
      # #82; hack/tests/test_gitops_contracts.sh keeps them equal).
      - arg: --kube-controller-manager-arg=leader-elect-lease-duration=60s
        nodeFilters: [server:*]
      - arg: --kube-controller-manager-arg=leader-elect-renew-deadline=40s
        nodeFilters: [server:*]
      - arg: --kube-controller-manager-arg=leader-elect-retry-period=10s
        nodeFilters: [server:*]
      - arg: --kube-scheduler-arg=leader-elect-lease-duration=60s
        nodeFilters: [server:*]
      - arg: --kube-scheduler-arg=leader-elect-renew-deadline=40s
        nodeFilters: [server:*]
      - arg: --kube-scheduler-arg=leader-elect-retry-period=10s
        nodeFilters: [server:*]
      - arg: --kube-cloud-controller-manager-arg=leader-elect-lease-duration=60s
        nodeFilters: [server:*]
      - arg: --kube-cloud-controller-manager-arg=leader-elect-renew-deadline=40s
        nodeFilters: [server:*]
      - arg: --kube-cloud-controller-manager-arg=leader-elect-retry-period=10s
        nodeFilters: [server:*]
# k3s's own leases ("k3s", "k3s-etcd") come from wrangler, not the args above: upstream 45 s lease / 30 s renew
# deadline, exit on a missed renewal (#344). One server, so nothing fails over: ride out 90 s stalls instead.
env:
  - envVar: CATTLE_ELECTION_LEASE_DURATION=120s
    nodeFilters: [server:*]
  - envVar: CATTLE_ELECTION_RENEW_DEADLINE=90s
    nodeFilters: [server:*]
  - envVar: CATTLE_ELECTION_RETRY_PERIOD=10s
    nodeFilters: [server:*]
volumes:
  - volume: /var/run/docker.sock:/var/run/docker.sock
    nodeFilters:
      - server:*
ports:
  # OpenChoreo console, API, and Thunder (HTTP over kgateway)
  - port: 127.0.0.1:8080:8080   # loopback only: tailscaled holds :8443 on the tailnet IP of this host
    nodeFilters:
      - loadbalancer
  # OpenChoreo cluster-gateway (TLS passthrough from workload cluster-agents)
  - port: 127.0.0.1:8443:8443   # agents reach it over docker network kind, not the host port
    nodeFilters:
      - loadbalancer
  # OpenChoreo observability Gateway: HTTP (observer, OTLP, Prometheus remote write) and TLS passthrough (OpenSearch)
  - port: 127.0.0.1:11080:11080
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:11085:11085
    nodeFilters:
      - loadbalancer
  # Harbor registry (Gateway `harbor` in ns harbor, TLS from the mgmt registry CA): UI, docker login/push/pull at
  # https://harbor.openchoreo.localhost:9443. CAPD nodes reach the same port on this load balancer over network kind.
  - port: 127.0.0.1:9443:9443
    nodeFilters:
      - loadbalancer
  # OpenBao, the Istio mesh CA (Gateway in ns openbao, TLS passthrough, installation.yaml mesh.ca.port): CAPD mesh
  # members reach it on this load balancer over network kind (coredns-local), the host only for debugging.
  - port: 127.0.0.1:8200:8200
    nodeFilters:
      - loadbalancer
