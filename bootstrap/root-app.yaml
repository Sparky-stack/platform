# The only manifest applied by hand (or by bootstrap/bootstrap.sh). Everything else is reconciled from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Sparky-stack/platform.git
    targetRevision: HEAD
    path: charts/platform
    helm:
      valueFiles:
        - ../../installations/local/installation.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
