<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1001" viewBox="0 0 960 1001" role="img" aria-label="Network · a request in, its telemetry out"><title>Network · a request in, its telemetry out</title><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.fx{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:4 10;opacity:0;animation:fxdash .9s linear infinite,fxseq 8.00s linear infinite both}@keyframes fxdash{to{stroke-dashoffset:-14}}@keyframes fxseq{0%{opacity:0}3%{opacity:1}33.0%{opacity:1}38.0%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.fx{animation:none;opacity:0}}</style><defs><marker id="ah8b9ab0" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5 L0,10 z" fill="#8b9ab0"/></marker><marker id="as8b9ab0" markerWidth="13" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M13,0 L0,5 L13,10 z" fill="#8b9ab0"/></marker><marker id="ahfbbf24" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5 L0,10 z" fill="#fbbf24"/></marker><marker id="asfbbf24" markerWidth="13" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M13,0 L0,5 L13,10 z" fill="#fbbf24"/></marker></defs><rect width="960" height="1001" rx="16" fill="#0b1120"/><rect x="8" y="8" width="944" height="985" rx="12" fill="none" stroke="#8b9ab0" stroke-opacity=".8"/>
<rect x="204" y="112" width="728" height="364" rx="14" fill="#0f1f31" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="220.0" y="136.0" font-size="13" fill="#38bdf8" font-weight="700" letter-spacing="1.0">WORKLOAD CLUSTER</text>
<rect x="204" y="540" width="728" height="152" rx="14" fill="#0e212d" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="220.0" y="564.0" font-size="13" fill="#2dd4bf" font-weight="700" letter-spacing="1.0">MANAGEMENT CLUSTER</text>
<path d="M 220 316 L 916 316" stroke="#7c8aa0" stroke-width="1.2" stroke-dasharray="3 5"/>
<path d="M 140.0 220.0 L 228.0 220.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 404.0 220.0 L 484.0 220.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 660.0 220.0 L 740.0 220.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 828.0 372.0 L 828.0 260.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 828.0 452.0 L 828.0 588.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 572.0 452.0 L 572.0 588.0" fill="none" stroke="#8b9ab0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah8b9ab0)"/>
<path class="fx" d="M 140.0 220.0 L 228.0 220.0" stroke="#fde5a7" style="animation-delay:0s,0.00s"/>
<path class="fx" d="M 404.0 220.0 L 484.0 220.0" stroke="#fde5a7" style="animation-delay:0s,1.10s"/>
<path class="fx" d="M 660.0 220.0 L 740.0 220.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
<path class="fx" d="M 828.0 372.0 L 828.0 260.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 828.0 452.0 L 828.0 588.0" stroke="#fde5a7" style="animation-delay:0s,4.40s"/>
<rect x="28" y="180" width="112" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="84.0" y="206.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Client</text>
<text class="s" x="84.0" y="226.4" font-size="13" fill="#dde5ef" text-anchor="middle">opens the</text>
<text class="s" x="84.0" y="244.4" font-size="13" fill="#dde5ef" text-anchor="middle">app URL</text>
<rect x="228" y="180" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="316.0" y="206.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Ingress gateway</text>
<text class="s" x="316.0" y="226.4" font-size="13" fill="#dde5ef" text-anchor="middle">kgateway: front</text>
<text class="s" x="316.0" y="244.4" font-size="13" fill="#dde5ef" text-anchor="middle">door of the cluster</text>
<rect x="484" y="180" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="572.0" y="206.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Service mesh</text>
<text class="s" x="572.0" y="226.4" font-size="13" fill="#dde5ef" text-anchor="middle">Istio ambient:</text>
<text class="s" x="572.0" y="244.4" font-size="13" fill="#dde5ef" text-anchor="middle">encrypts every hop</text>
<rect x="740" y="180" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="828.0" y="206.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="828.0" y="226.4" font-size="13" fill="#dde5ef" text-anchor="middle">your</text>
<text class="s" x="828.0" y="244.4" font-size="13" fill="#dde5ef" text-anchor="middle">services</text>
<rect x="484" y="372" width="176" height="80" rx="8" fill="#263247" stroke="none" stroke-width="0"/>
<text class="s" x="572.0" y="398.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="572.0" y="418.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s</text>
<text class="s" x="572.0" y="436.4" font-size="13" fill="#dde5ef" text-anchor="middle">agent</text>
<rect x="740" y="372" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="828.0" y="398.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Collectors</text>
<text class="s" x="828.0" y="418.4" font-size="13" fill="#dde5ef" text-anchor="middle">on every node:</text>
<text class="s" x="828.0" y="436.4" font-size="13" fill="#dde5ef" text-anchor="middle">logs, metrics, traces</text>
<rect x="484" y="588" width="176" height="80" rx="8" fill="#263247" stroke="none" stroke-width="0"/>
<text class="s" x="572.0" y="614.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="572.0" y="634.4" font-size="13" fill="#dde5ef" text-anchor="middle">entry point</text>
<text class="s" x="572.0" y="652.4" font-size="13" fill="#dde5ef" text-anchor="middle">for agents</text>
<rect x="740" y="588" width="176" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="828.0" y="614.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Observability plane</text>
<text class="s" x="828.0" y="634.4" font-size="13" fill="#dde5ef" text-anchor="middle">stores all</text>
<text class="s" x="828.0" y="652.4" font-size="13" fill="#dde5ef" text-anchor="middle">telemetry</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Network · a request in, its telemetry out</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A request comes in through kgateway and the encrypted mesh; its telemetry goes out to the management cluster. Everything rides the</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">cluster network (Cilium or flannel).</text>
<text class="s" x="228.0" y="162.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">A REQUEST IN</text>
<text class="s" x="228.0" y="348.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">ITS TELEMETRY OUT</text>
<circle cx="176.0" cy="220.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="176.0" y="224.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="436.0" cy="220.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="436.0" y="224.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="692.0" cy="220.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="692.0" y="224.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="828.0" cy="340.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="828.0" y="344.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<rect x="844.0" y="499.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="848.0" y="513.0" font-size="13" fill="#aab6c8">dials out</text>
<circle cx="828.0" cy="508.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="828.0" y="512.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="582.0" y="499.0" width="73.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="586.0" y="513.0" font-size="13" fill="#aab6c8">control link</text>
<line x1="28" y1="714" x2="932" y2="714" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="737.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="742" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="742.0" font-size="13.5" fill="#dde5ef">A client opens the app URL; kgateway takes the request</text>
<circle cx="40" cy="765.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="770" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="770.0" font-size="13.5" fill="#dde5ef">kgateway routes it into the service mesh</text>
<circle cx="40" cy="793.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="798" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="798.0" font-size="13.5" fill="#dde5ef">The service mesh delivers it to the app pods and encrypts every hop between pods</text>
<circle cx="40" cy="821.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="826" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="826.0" font-size="13.5" fill="#dde5ef">The collectors on each node gather the app pods&#x27; telemetry: Fluent Bit tails their logs, the Prometheus agent scrapes their metrics, the</text>
<text class="s" x="62.0" y="845.0" font-size="13.5" fill="#dde5ef">OpenTelemetry collector takes their traces</text>
<circle cx="40" cy="868.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="873" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="873.0" font-size="13.5" fill="#dde5ef">The collectors dial out and ship them to the observability plane on the management cluster</text>
<rect x="28" y="913" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="923.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="913" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="923.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="28" y="939" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="58.0" y="949.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 202.7147 945 L 246.7147 945" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="218.7147" cy="945" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="218.7147" y="949.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="256.7" y="949.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<path d="M 26 971 L 48 971" stroke="#8b9ab0" stroke-width="1.6" marker-end="url(#ah8b9ab0)"/>
<text class="s" x="58.0" y="975.0" font-size="13" fill="#aab6c8">the cluster-agent&#x27;s control link, not telemetry (context)</text>
<rect x="412.586" y="965" width="20" height="13" rx="3" fill="#263247"/>
<text class="s" x="442.6" y="975.0" font-size="13" fill="#aab6c8">context, not a step</text>
</svg>
