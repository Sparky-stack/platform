<text class="s" x="336.0" y="410.4" font-size="13" fill="#cbd5e1" text-anchor="middle">dp-* namespaces</text>
<text class="s" x="336.0" y="427.9" font-size="13" fill="#cbd5e1" text-anchor="middle">ambient enrolled</text>
<rect x="464" y="364" width="176" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="552.0" y="390.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">waypoint</text>
<text class="s" x="552.0" y="410.4" font-size="13" fill="#cbd5e1" text-anchor="middle">per-namespace</text>
<text class="s" x="552.0" y="427.9" font-size="13" fill="#cbd5e1" text-anchor="middle">L7 policy</text>
<rect x="572.7" y="356" width="57.3" height="17" rx="8.5" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
<text class="s" x="601.4" y="368.5" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="32" y="500" width="608" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="336.0" y="526.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ztunnel · Istio ambient</text>
<text class="s" x="336.0" y="546.4" font-size="13" fill="#cbd5e1" text-anchor="middle">per node · HBONE mTLS between every pod pair</text>
<text class="s" x="336.0" y="563.9" font-size="13" fill="#cbd5e1" text-anchor="middle">SPIFFE identity · no sidecars</text>
<rect x="32" y="636" width="608" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="336.0" y="662.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Cilium or flannel</text>
<text class="s" x="336.0" y="682.4" font-size="13" fill="#cbd5e1" text-anchor="middle">CNI fixed at cluster birth (fleet file cni)</text>
<text class="s" x="336.0" y="699.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Cilium: eBPF, no kube-proxy, WireGuard</text>
<rect x="736" y="228" width="184" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="828.0" y="254.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">mgmt Gateway</text>
<text class="s" x="828.0" y="274.4" font-size="13" fill="#cbd5e1" text-anchor="middle">kgateway · TLS</text>
<text class="s" x="828.0" y="291.9" font-size="13" fill="#cbd5e1" text-anchor="middle">passthrough :8443</text>
<rect x="736" y="364" width="184" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="828.0" y="390.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="828.0" y="410.4" font-size="13" fill="#cbd5e1" text-anchor="middle">checks the agent&#x27;s</text>
<text class="s" x="828.0" y="427.9" font-size="13" fill="#cbd5e1" text-anchor="middle">client cert</text>
<rect x="736" y="500" width="184" height="80" rx="8" fill="#2f2f51" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="828.0" y="526.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">observability</text>
<text class="s" x="828.0" y="546.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Gateway → OpenSearch,</text>
<text class="s" x="828.0" y="563.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Prometheus</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Network · a request in, the agents out</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">kgateway for north-south, Istio ambient for identity and mTLS, Cilium or flannel underneath; agents and collectors dial out to mgmt.</text>
<circle cx="51.0" cy="247.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="51.0" y="251.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="336.0" cy="158.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="336.0" y="162.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="336.0" cy="331.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="336.0" y="335.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="336.0" cy="467.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="336.0" y="471.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="336.0" cy="603.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="336.0" y="607.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="688.0" cy="254.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="688.0" y="258.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="828.0" cy="331.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="828.0" y="335.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="688.0" cy="413.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="688.0" y="417.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="752" x2="932" y2="752" stroke="#64748b" stroke-width="1.5"/>
<circle cx="40.0" cy="769.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="774" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="774.0" font-size="13.5" fill="#cbd5e1">A client calls the app URL; kgateway (Gateway API) takes it</text>
<circle cx="40.0" cy="797.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="802" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="802.0" font-size="13.5" fill="#cbd5e1">An HTTPRoute sends it to the app Service (through a waypoint</text>
<text class="s" x="60.0" y="821.0" font-size="13.5" fill="#cbd5e1">if opted in)</text>
<circle cx="40.0" cy="844.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="849" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="849.0" font-size="13.5" fill="#cbd5e1">Kyverno enrols every OpenChoreo dp-* namespace in Istio</text>
<text class="s" x="60.0" y="868.0" font-size="13.5" fill="#cbd5e1">ambient</text>
<circle cx="40.0" cy="891.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="896" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="896.0" font-size="13.5" fill="#cbd5e1">Every pod-to-pod hop rides ztunnel&#x27;s HBONE mTLS with</text>
<text class="s" x="60.0" y="915.0" font-size="13.5" fill="#cbd5e1">SPIFFE identities</text>
<circle cx="506.0" cy="769.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="774" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="774.0" font-size="13.5" fill="#cbd5e1">Packets travel on the CNI: Cilium (eBPF) or flannel, chosen per</text>
<text class="s" x="526.0" y="793.0" font-size="13.5" fill="#cbd5e1">cluster</text>
<circle cx="506.0" cy="816.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="821" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="821.0" font-size="13.5" fill="#cbd5e1">The cluster-agent dials out to mgmt on :8443 (TLS</text>
<text class="s" x="526.0" y="840.0" font-size="13.5" fill="#cbd5e1">passthrough, SNI)</text>
<circle cx="506.0" cy="863.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="868" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="868.0" font-size="13.5" fill="#cbd5e1">cluster-gateway accepts only that cluster&#x27;s client certificate</text>
<circle cx="506.0" cy="891.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="896" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="896.0" font-size="13.5" fill="#cbd5e1">Collectors ship logs, metrics and traces through the</text>
<text class="s" x="526.0" y="915.0" font-size="13.5" fill="#cbd5e1">observability Gateway</text>
