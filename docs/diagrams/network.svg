<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1252" viewBox="0 0 960 1252" role="img" aria-label="Network · a request in, the agents out"><title>Network · a request in, the agents out</title><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.fx{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:4 10;opacity:0;animation:fxdash .9s linear infinite,fxseq 9.10s linear infinite both}@keyframes fxdash{to{stroke-dashoffset:-14}}@keyframes fxseq{0%{opacity:0}3%{opacity:1}29.0%{opacity:1}34.0%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.fx{animation:none;opacity:0}}</style><defs><marker id="ah8b9ab0" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5 L0,10 z" fill="#8b9ab0"/></marker><marker id="as8b9ab0" markerWidth="13" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M13,0 L0,5 L13,10 z" fill="#8b9ab0"/></marker><marker id="ahfbbf24" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5 L0,10 z" fill="#fbbf24"/></marker><marker id="asfbbf24" markerWidth="13" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M13,0 L0,5 L13,10 z" fill="#fbbf24"/></marker></defs><rect width="960" height="1252" rx="16" fill="#0b1120"/><rect x="8" y="8" width="944" height="1236" rx="12" fill="none" stroke="#8b9ab0" stroke-opacity=".8"/>
<rect x="16" y="200" width="632" height="760" rx="14" fill="#0f1f31" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="632.0" y="224.0" font-size="13" fill="#38bdf8" font-weight="700" text-anchor="end" letter-spacing="1.0">WORKLOAD CLUSTER</text>
<rect x="728" y="664" width="216" height="296" rx="14" fill="#0e212d" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="744.0" y="688.0" font-size="13" fill="#2dd4bf" font-weight="700" letter-spacing="1.0">MGMT CLUSTER</text>
<path d="M 120.0 156.0 L 120.0 264.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 200.0 304.0 L 280.0 304.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 520.0 304.0 L 440.0 304.0" fill="none" stroke="#8b9ab0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah8b9ab0)"/>
<path d="M 360.0 344.0 L 360.0 416.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 360.0 480.0 L 360.0 552.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 232.0 760.0 L 752.0 760.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 232.0 896.0 L 752.0 896.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 120.0 156.0 L 120.0 264.0" stroke="#fde5a7" style="animation-delay:0s,0.00s"/>
<path class="fx" d="M 200.0 304.0 L 280.0 304.0" stroke="#fde5a7" style="animation-delay:0s,1.10s"/>
<path class="fx" d="M 360.0 344.0 L 360.0 416.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
<path class="fx" d="M 360.0 480.0 L 360.0 552.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 232.0 760.0 L 752.0 760.0" stroke="#fde5a7" style="animation-delay:0s,4.40s"/>
<path class="fx" d="M 232.0 896.0 L 752.0 896.0" stroke="#fde5a7" style="animation-delay:0s,5.50s"/>
<rect x="40" y="100" width="160" height="56" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="120.0" y="123.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Client</text>
<text class="s" x="120.0" y="143.4" font-size="13" fill="#dde5ef" text-anchor="middle">opens the app URL</text>
<rect x="40" y="264" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="120.0" y="290.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">kgateway</text>
<text class="s" x="120.0" y="310.4" font-size="13" fill="#dde5ef" text-anchor="middle">the cluster&#x27;s</text>
<text class="s" x="120.0" y="328.4" font-size="13" fill="#dde5ef" text-anchor="middle">front door</text>
<rect x="280" y="264" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="360.0" y="299.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="360.0" y="319.4" font-size="13" fill="#dde5ef" text-anchor="middle">your services</text>
<rect x="520" y="264" width="112" height="80" rx="8" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="576.0" y="290.4" font-size="15" fill="#dde5ef" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="576.0" y="310.4" font-size="13" fill="#aab6c8" text-anchor="middle">adds every app</text>
<text class="s" x="576.0" y="328.4" font-size="13" fill="#aab6c8" text-anchor="middle">to the mesh</text>
<rect x="40" y="416" width="592" height="64" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="336.0" y="443.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Service mesh (Istio ambient)</text>
<text class="s" x="336.0" y="463.4" font-size="13" fill="#dde5ef" text-anchor="middle">encrypts every hop between pods and gives each one an identity</text>
<rect x="40" y="552" width="592" height="64" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="336.0" y="579.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster network (Cilium or flannel)</text>
<text class="s" x="336.0" y="599.4" font-size="13" fill="#dde5ef" text-anchor="middle">chosen per cluster when it is created</text>
<rect x="40" y="720" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="136.0" y="755.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="136.0" y="775.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s agent</text>
<rect x="40" y="856" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="136.0" y="882.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Collectors</text>
<text class="s" x="136.0" y="902.4" font-size="13" fill="#dde5ef" text-anchor="middle">logs, metrics</text>
<text class="s" x="136.0" y="920.4" font-size="13" fill="#dde5ef" text-anchor="middle">and traces</text>
<rect x="752" y="720" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="836.0" y="746.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="836.0" y="766.4" font-size="13" fill="#dde5ef" text-anchor="middle">accepts only</text>
<text class="s" x="836.0" y="784.4" font-size="13" fill="#dde5ef" text-anchor="middle">known clusters</text>
<rect x="752" y="856" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="836.0" y="882.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Observability plane</text>
<text class="s" x="836.0" y="902.4" font-size="13" fill="#dde5ef" text-anchor="middle">stores all</text>
<text class="s" x="836.0" y="920.4" font-size="13" fill="#dde5ef" text-anchor="middle">telemetry</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Network · a request in, the agents out</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A request enters through kgateway and crosses the mesh on mTLS; the agent and the collectors dial out to mgmt. Kyverno adds every</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">app to the mesh before any traffic.</text>
<text class="s" x="32.0" y="696.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">THE AGENTS OUT</text>
<circle cx="120.0" cy="222.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="120.0" y="226.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="232.0" cy="304.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="232.0" y="308.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="360.0" cy="376.4" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="360.0" y="381.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="360.0" cy="512.4" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="360.0" y="517.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="688.0" cy="760.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="688.0" y="764.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="688.0" cy="896.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="688.0" y="900.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<line x1="28" y1="982" x2="932" y2="982" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="1005.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1010" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="1010.0" font-size="13.5" fill="#dde5ef">A client opens the app URL; kgateway (Gateway API) takes the request</text>
<circle cx="40" cy="1033.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1038" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="1038.0" font-size="13.5" fill="#dde5ef">kgateway routes it to the app pods (HTTPRoute; through a waypoint if opted in)</text>
<circle cx="40" cy="1061.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1066" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="1066.0" font-size="13.5" fill="#dde5ef">App pods reach each other only through the service mesh: ztunnel adds mTLS and a workload identity, no sidecars</text>
<circle cx="40" cy="1089.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1094" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="1094.0" font-size="13.5" fill="#dde5ef">The service mesh rides the cluster network: Cilium (eBPF, WireGuard) or flannel, chosen in the fleet file</text>
<circle cx="40" cy="1117.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1122" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="1122.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out to mgmt on port 8443 (TLS passthrough); cluster-gateway accepts only that cluster&#x27;s certificate</text>
<circle cx="40" cy="1145.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1150" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="1150.0" font-size="13.5" fill="#dde5ef">Collectors (OTel Collector, Fluent Bit, Prometheus agent) dial out and ship logs, metrics and traces to the observability plane</text>
<rect x="28" y="1190" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1200.0" font-size="13" fill="#aab6c8">mgmt cluster</text>
<rect x="162.86294" y="1190" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="192.9" y="1200.0" font-size="13" fill="#aab6c8">workload cluster</text>
<rect x="318.40966000000003" y="1190" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="348.4" y="1200.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 491.12436 1196 L 527.12436 1196" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="505.12436" cy="1196" r="7" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="537.1" y="1200.0" font-size="13" fill="#aab6c8">numbered step</text>
<path d="M 653.03696 1196 L 675.03696 1196" stroke="#8b9ab0" stroke-width="1.6" marker-end="url(#ah8b9ab0)"/>
<text class="s" x="685.0" y="1200.0" font-size="13" fill="#aab6c8">Kyverno sets this up (context)</text>
<rect x="28" y="1216" width="20" height="13" rx="3" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="58.0" y="1226.0" font-size="13" fill="#aab6c8">context, not a step</text>
</svg>
