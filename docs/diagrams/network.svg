<text class="s" x="348.4" y="1098.0" font-size="13" fill="#94a3b8">security &amp; trust</text>
<rect x="465.5368" y="1088" width="20" height="13" rx="3" fill="#2f2f51" stroke="#a78bfa" stroke-width="1.3"/>
<text class="s" x="495.5" y="1098.0" font-size="13" fill="#94a3b8">stateful data</text>
