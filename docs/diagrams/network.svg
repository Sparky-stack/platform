<text class="s" x="336.0" y="708.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="680.0" cy="290.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="680.0" y="294.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="824.0" cy="384.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="824.0" y="388.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="680.0" cy="473.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="680.0" y="477.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="868" x2="932" y2="868" stroke="#8b9ab0" stroke-width="1.5"/>
<circle cx="40.0" cy="891.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="896" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="896.0" font-size="13.5" fill="#cbd5e1">Kyverno enrols every OpenChoreo dp-* namespace in Istio</text>
<text class="s" x="60.0" y="915.0" font-size="13.5" fill="#cbd5e1">ambient (before any traffic)</text>
<circle cx="506.0" cy="891.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="896" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="896.0" font-size="13.5" fill="#cbd5e1">Packets travel on the CNI: Cilium (eBPF) or flannel, chosen per</text>
<text class="s" x="526.0" y="915.0" font-size="13.5" fill="#cbd5e1">cluster</text>
<circle cx="40.0" cy="939.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="944" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="944.0" font-size="13.5" fill="#cbd5e1">A client calls the app URL; kgateway (Gateway API) takes it</text>
<circle cx="506.0" cy="939.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="944" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="944.0" font-size="13.5" fill="#cbd5e1">The cluster-agent dials out to mgmt on :8443 (TLS</text>
<text class="s" x="526.0" y="963.0" font-size="13.5" fill="#cbd5e1">passthrough, SNI)</text>
<circle cx="40.0" cy="987.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="992" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="992.0" font-size="13.5" fill="#cbd5e1">An HTTPRoute sends it to the app Service (through a waypoint</text>
<text class="s" x="60.0" y="1011.0" font-size="13.5" fill="#cbd5e1">if opted in)</text>
<circle cx="506.0" cy="987.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="992" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="992.0" font-size="13.5" fill="#cbd5e1">cluster-gateway accepts only that cluster&#x27;s client certificate</text>
<circle cx="40.0" cy="1035.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="1040" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="1040.0" font-size="13.5" fill="#cbd5e1">Every pod-to-pod hop rides ztunnel&#x27;s HBONE mTLS with</text>
<text class="s" x="60.0" y="1059.0" font-size="13.5" fill="#cbd5e1">SPIFFE identities</text>
<circle cx="506.0" cy="1035.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="1040" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="1040.0" font-size="13.5" fill="#cbd5e1">Collectors ship logs, metrics and traces through the</text>
<text class="s" x="526.0" y="1059.0" font-size="13.5" fill="#cbd5e1">observability plane&#x27;s Gateway</text>
