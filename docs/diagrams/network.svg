<rect x="28" y="180" width="112" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="84.0" y="206.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Client</text>
<text class="s" x="84.0" y="226.4" font-size="13" fill="#dde5ef" text-anchor="middle">opens the</text>
<text class="s" x="84.0" y="244.4" font-size="13" fill="#dde5ef" text-anchor="middle">app URL</text>
<rect x="228" y="180" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="316.0" y="206.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">kgateway</text>
<text class="s" x="316.0" y="226.4" font-size="13" fill="#dde5ef" text-anchor="middle">front door</text>
<text class="s" x="316.0" y="244.4" font-size="13" fill="#dde5ef" text-anchor="middle">of the cluster</text>
<rect x="484" y="180" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="572.0" y="206.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Service mesh</text>
<text class="s" x="572.0" y="226.4" font-size="13" fill="#dde5ef" text-anchor="middle">Istio ambient:</text>
<text class="s" x="572.0" y="244.4" font-size="13" fill="#dde5ef" text-anchor="middle">encrypted hops</text>
<rect x="740" y="180" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="828.0" y="206.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="828.0" y="226.4" font-size="13" fill="#dde5ef" text-anchor="middle">your</text>
<text class="s" x="828.0" y="244.4" font-size="13" fill="#dde5ef" text-anchor="middle">services</text>
<rect x="228" y="332" width="688" height="64" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="572.0" y="359.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster network (Cilium or flannel)</text>
<text class="s" x="572.0" y="379.4" font-size="13" fill="#dde5ef" text-anchor="middle">chosen per cluster when it is created</text>
<rect x="228" y="484" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="316.0" y="510.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="316.0" y="530.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s</text>
<text class="s" x="316.0" y="548.4" font-size="13" fill="#dde5ef" text-anchor="middle">agent</text>
<rect x="484" y="484" width="176" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="572.0" y="510.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Collectors</text>
<text class="s" x="572.0" y="530.4" font-size="13" fill="#dde5ef" text-anchor="middle">logs, metrics,</text>
<text class="s" x="572.0" y="548.4" font-size="13" fill="#dde5ef" text-anchor="middle">traces</text>
<rect x="228" y="700" width="176" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="316.0" y="726.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="316.0" y="746.4" font-size="13" fill="#dde5ef" text-anchor="middle">entry point</text>
<text class="s" x="316.0" y="764.4" font-size="13" fill="#dde5ef" text-anchor="middle">for agents</text>
<rect x="484" y="700" width="176" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="572.0" y="726.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Observability plane</text>
<text class="s" x="572.0" y="746.4" font-size="13" fill="#dde5ef" text-anchor="middle">stores all</text>
<text class="s" x="572.0" y="764.4" font-size="13" fill="#dde5ef" text-anchor="middle">telemetry</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Network · a request in, the agents out</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A request comes in through kgateway and the mesh; separately, the agent and the collectors dial out to the management cluster.</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">Kyverno adds every app to the mesh before traffic arrives.</text>
<text class="s" x="428.0" y="136.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">A REQUEST IN</text>
<text class="s" x="228.0" y="460.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">THE AGENTS OUT</text>
<circle cx="176.0" cy="220.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="176.0" y="224.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="436.0" cy="220.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="436.0" y="224.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="692.0" cy="220.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="692.0" y="224.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="572.0" cy="290.2" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="572.0" y="294.8" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<rect x="332.0" y="611.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="336.0" y="625.0" font-size="13" fill="#aab6c8">dials out</text>
<circle cx="316.0" cy="620.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="316.0" y="624.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="588.0" y="611.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="592.0" y="625.0" font-size="13" fill="#aab6c8">dials out</text>
<circle cx="572.0" cy="620.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="572.0" y="624.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<line x1="28" y1="826" x2="932" y2="826" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="849.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="854" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="854.0" font-size="13.5" fill="#dde5ef">A client opens the app URL; kgateway takes the request</text>
<circle cx="40" cy="877.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="882" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="882.0" font-size="13.5" fill="#dde5ef">kgateway routes it into the service mesh</text>
<circle cx="40" cy="905.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="910" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="910.0" font-size="13.5" fill="#dde5ef">The service mesh delivers it to the app pods and encrypts every hop between pods</text>
<circle cx="40" cy="933.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="938" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="938.0" font-size="13.5" fill="#dde5ef">The service mesh rides the cluster network: Cilium or flannel, chosen per cluster</text>
<circle cx="40" cy="961.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="966" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="966.0" font-size="13.5" fill="#dde5ef">Separately, the cluster-agent dials out to the management cluster; cluster-gateway accepts only that cluster&#x27;s certificate</text>
<circle cx="40" cy="989.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="994" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="994.0" font-size="13.5" fill="#dde5ef">The collectors dial out too and ship logs, metrics and traces to the observability plane</text>
<rect x="28" y="1034" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1044.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1034" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1044.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="28" y="1060" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="58.0" y="1070.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 202.7147 1066 L 246.7147 1066" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="218.7147" cy="1066" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="218.7147" y="1070.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="256.7" y="1070.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
</svg>
