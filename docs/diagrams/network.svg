<text class="s" x="328.0" y="131.1" font-size="13" fill="#cbd5e1" text-anchor="middle">HTTPS to the app URL</text>
<rect x="256" y="248" width="144" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="328.0" y="274.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">kgateway</text>
<text class="s" x="328.0" y="294.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Gateway API</text>
<text class="s" x="328.0" y="311.9" font-size="13" fill="#cbd5e1" text-anchor="middle">HTTPRoute</text>
<rect x="480" y="248" width="144" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="552.0" y="274.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">agents</text>
<text class="s" x="552.0" y="294.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cluster-agent, OTel,</text>
<text class="s" x="552.0" y="311.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Fluent Bit</text>
<rect x="28" y="404" width="152" height="88" rx="11" fill="none" stroke="#fb7185" stroke-opacity=".85" stroke-width="1.4"/>
<rect x="32" y="408" width="144" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="2.2"/>
<text class="s" x="104.0" y="434.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="104.0" y="454.4" font-size="13" fill="#cbd5e1" text-anchor="middle">enrols dp-* in</text>
<text class="s" x="104.0" y="471.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Istio ambient</text>
<rect x="256" y="408" width="144" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="328.0" y="434.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">app pods</text>
<text class="s" x="328.0" y="454.4" font-size="13" fill="#cbd5e1" text-anchor="middle">dp-* namespaces</text>
<text class="s" x="328.0" y="471.9" font-size="13" fill="#cbd5e1" text-anchor="middle">(waypoint: opt-in)</text>
<rect x="480" y="408" width="144" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="552.0" y="434.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">east-west</text>
<text class="s" x="552.0" y="454.4" font-size="13" fill="#cbd5e1" text-anchor="middle">gateway to the</text>
<text class="s" x="552.0" y="471.9" font-size="13" fill="#cbd5e1" text-anchor="middle">mesh group&#x27;s peers</text>
<rect x="556.7" y="400" width="57.3" height="17" rx="8.5" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
<text class="s" x="585.4" y="412.5" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="32" y="568" width="592" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="328.0" y="594.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ztunnel · Istio ambient</text>
<text class="s" x="328.0" y="614.4" font-size="13" fill="#cbd5e1" text-anchor="middle">per node · HBONE mTLS between every pod pair</text>
<text class="s" x="328.0" y="631.9" font-size="13" fill="#cbd5e1" text-anchor="middle">SPIFFE identity · no sidecars</text>
<rect x="32" y="728" width="592" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="328.0" y="754.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Cilium or flannel</text>
<text class="s" x="328.0" y="774.4" font-size="13" fill="#cbd5e1" text-anchor="middle">CNI fixed at cluster birth (fleet file cni)</text>
<text class="s" x="328.0" y="791.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Cilium: eBPF, no kube-proxy, WireGuard</text>
<rect x="720" y="248" width="200" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="820.0" y="274.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">mgmt Gateway</text>
<text class="s" x="820.0" y="294.4" font-size="13" fill="#cbd5e1" text-anchor="middle">kgateway · TLS</text>
<text class="s" x="820.0" y="311.9" font-size="13" fill="#cbd5e1" text-anchor="middle">passthrough :8443</text>
<rect x="720" y="408" width="200" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="820.0" y="434.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="820.0" y="454.4" font-size="13" fill="#cbd5e1" text-anchor="middle">checks the agent&#x27;s</text>
<text class="s" x="820.0" y="471.9" font-size="13" fill="#cbd5e1" text-anchor="middle">client certificate</text>
<rect x="720" y="568" width="200" height="80" rx="8" fill="#2f2f51" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="820.0" y="594.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">observability plane</text>
<text class="s" x="820.0" y="614.4" font-size="13" fill="#cbd5e1" text-anchor="middle">own Gateway →</text>
<text class="s" x="820.0" y="631.9" font-size="13" fill="#cbd5e1" text-anchor="middle">OpenSearch, Prometheus</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Network · a request in, the agents out</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">kgateway for north-south, Istio ambient for identity and mTLS, Cilium or flannel underneath; agents and collectors dial out to mgmt.</text>
<circle cx="328.0" cy="212.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="328.0" y="216.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="328.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="328.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="218.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="218.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="328.0" cy="528.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="328.0" y="532.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="328.0" cy="688.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="328.0" y="692.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="672.0" cy="274.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="672.0" y="278.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="820.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="820.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="672.0" cy="457.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="672.0" y="461.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="852" x2="932" y2="852" stroke="#8b9ab0" stroke-width="1.5"/>
<circle cx="40.0" cy="875.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="880" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="880.0" font-size="13.5" fill="#cbd5e1">A client calls the app URL; kgateway (Gateway API) takes it</text>
<circle cx="506.0" cy="875.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="880" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="880.0" font-size="13.5" fill="#cbd5e1">Packets travel on the CNI: Cilium (eBPF) or flannel, chosen per</text>
<text class="s" x="526.0" y="899.0" font-size="13.5" fill="#cbd5e1">cluster</text>
<circle cx="40.0" cy="923.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="928" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="928.0" font-size="13.5" fill="#cbd5e1">An HTTPRoute sends it to the app Service (through a waypoint</text>
<text class="s" x="60.0" y="947.0" font-size="13.5" fill="#cbd5e1">if opted in)</text>
<circle cx="506.0" cy="923.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="928" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="928.0" font-size="13.5" fill="#cbd5e1">The cluster-agent dials out to mgmt on :8443 (TLS</text>
<text class="s" x="526.0" y="947.0" font-size="13.5" fill="#cbd5e1">passthrough, SNI)</text>
<circle cx="40.0" cy="971.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="976" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="976.0" font-size="13.5" fill="#cbd5e1">Kyverno enrols every OpenChoreo dp-* namespace in Istio</text>
<text class="s" x="60.0" y="995.0" font-size="13.5" fill="#cbd5e1">ambient</text>
<circle cx="506.0" cy="971.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="976" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="976.0" font-size="13.5" fill="#cbd5e1">cluster-gateway accepts only that cluster&#x27;s client certificate</text>
<circle cx="40.0" cy="1019.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="1024" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="1024.0" font-size="13.5" fill="#cbd5e1">Every pod-to-pod hop rides ztunnel&#x27;s HBONE mTLS with</text>
<text class="s" x="60.0" y="1043.0" font-size="13.5" fill="#cbd5e1">SPIFFE identities</text>
<circle cx="506.0" cy="1019.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="1024" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="1024.0" font-size="13.5" fill="#cbd5e1">Collectors ship logs, metrics and traces through the</text>
<text class="s" x="526.0" y="1043.0" font-size="13.5" fill="#cbd5e1">observability plane&#x27;s Gateway</text>
<rect x="28" y="1088" width="20" height="13" rx="3" fill="#173e45" stroke="#2dd4bf" stroke-width="1.3"/>
<text class="s" x="58.0" y="1098.0" font-size="13" fill="#94a3b8">mgmt cluster</text>
