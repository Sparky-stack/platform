<text class="s" x="128.0" y="450.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="128.0" y="470.4" font-size="13" fill="#cbd5e1" text-anchor="middle">enrols dp-* in</text>
<text class="s" x="128.0" y="487.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Istio ambient</text>
<rect x="264" y="424" width="144" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="336.0" y="450.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">app pods</text>
<text class="s" x="336.0" y="470.4" font-size="13" fill="#cbd5e1" text-anchor="middle">dp-* namespaces</text>
<text class="s" x="336.0" y="487.9" font-size="13" fill="#cbd5e1" text-anchor="middle">(waypoint: opt-in)</text>
<rect x="40" y="584" width="592" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="336.0" y="610.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ztunnel · Istio ambient</text>
<text class="s" x="336.0" y="630.4" font-size="13" fill="#cbd5e1" text-anchor="middle">per node · HBONE mTLS between every pod pair</text>
<text class="s" x="336.0" y="647.9" font-size="13" fill="#cbd5e1" text-anchor="middle">SPIFFE identity · no sidecars</text>
<rect x="40" y="744" width="592" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="336.0" y="770.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Cilium or flannel</text>
<text class="s" x="336.0" y="790.4" font-size="13" fill="#cbd5e1" text-anchor="middle">CNI fixed at cluster birth (fleet file cni)</text>
<text class="s" x="336.0" y="807.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Cilium: eBPF, no kube-proxy, WireGuard</text>
<rect x="728" y="264" width="192" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="824.0" y="290.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">mgmt Gateway</text>
<text class="s" x="824.0" y="310.4" font-size="13" fill="#cbd5e1" text-anchor="middle">kgateway · TLS</text>
<text class="s" x="824.0" y="327.9" font-size="13" fill="#cbd5e1" text-anchor="middle">passthrough :8443</text>
<rect x="728" y="424" width="192" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="824.0" y="450.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="824.0" y="470.4" font-size="13" fill="#cbd5e1" text-anchor="middle">checks the agent&#x27;s</text>
<text class="s" x="824.0" y="487.9" font-size="13" fill="#cbd5e1" text-anchor="middle">client certificate</text>
<rect x="728" y="584" width="192" height="80" rx="8" fill="#2f2f51" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="824.0" y="610.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">observability plane</text>
<text class="s" x="824.0" y="630.4" font-size="13" fill="#cbd5e1" text-anchor="middle">own Gateway →</text>
<text class="s" x="824.0" y="647.9" font-size="13" fill="#cbd5e1" text-anchor="middle">OpenSearch, Prometheus</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Network · a request in, the agents out</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">kgateway for north-south, Istio ambient for identity and mTLS, Cilium or flannel underneath; agents and collectors dial out to mgmt.</text>
<circle cx="61.0" cy="445.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="61.0" y="449.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">1</text>
<circle cx="336.0" cy="204.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="336.0" y="208.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="336.0" cy="384.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="336.0" y="388.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="336.0" cy="544.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="336.0" y="548.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
