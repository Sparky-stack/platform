<text class="s" x="336.0" y="327.9" font-size="13" fill="#cbd5e1" text-anchor="middle">HTTPRoute</text>
<rect x="488" y="264" width="144" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="560.0" y="290.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">agents</text>
<text class="s" x="560.0" y="310.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cluster-agent, OTel,</text>
<text class="s" x="560.0" y="327.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Fluent Bit</text>
<rect x="36" y="420" width="152" height="88" rx="11" fill="none" stroke="#fb7185" stroke-opacity=".85" stroke-width="1.4"/>
