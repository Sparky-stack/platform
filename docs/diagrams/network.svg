<text class="s" x="120.0" y="254.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="120.0" y="274.4" font-size="13" fill="#cbd5e1" text-anchor="middle">enrols dp-* namespaces</text>
<text class="s" x="120.0" y="291.9" font-size="13" fill="#cbd5e1" text-anchor="middle">in Istio ambient</text>
<rect x="248" y="228" width="176" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="336.0" y="254.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">kgateway</text>
<text class="s" x="336.0" y="274.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Gateway API</text>
<text class="s" x="336.0" y="291.9" font-size="13" fill="#cbd5e1" text-anchor="middle">HTTPRoute</text>
<rect x="464" y="228" width="176" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="552.0" y="254.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">agent + collectors</text>
<text class="s" x="552.0" y="274.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cluster-agent, OTel,</text>
<text class="s" x="552.0" y="291.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Fluent Bit · dial out</text>
<rect x="32" y="364" width="176" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="120.0" y="390.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">east-west gateway</text>
<text class="s" x="120.0" y="410.4" font-size="13" fill="#cbd5e1" text-anchor="middle">to peer clusters</text>
<text class="s" x="120.0" y="427.9" font-size="13" fill="#cbd5e1" text-anchor="middle">of the mesh group</text>
