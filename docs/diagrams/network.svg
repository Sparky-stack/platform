<path class="fx" d="M 660.0 220.0 L 740.0 220.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
<path class="fx" d="M 572.0 260.0 L 572.0 332.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 316.0 564.0 L 316.0 700.0" stroke="#fde5a7" style="animation-delay:0s,4.40s"/>
