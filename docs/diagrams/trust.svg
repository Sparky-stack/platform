<text class="s" x="711.6" y="980.0" font-size="13" fill="#94a3b8">opt-in (off by default)</text>
<rect x="26" y="992" width="24" height="17" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<text class="s" x="58.0" y="1004.0" font-size="13" fill="#94a3b8">cluster / zone</text>
