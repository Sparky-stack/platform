<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1116" viewBox="0 0 960 1116" role="img" aria-label="Trust &amp; certificates · who signs what, and how it renews"><title>Trust &amp; certificates · who signs what, and how it renews</title><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.fx{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:4 10;opacity:0;animation:fxdash .9s linear infinite,fxseq 10.20s linear infinite both}@keyframes fxdash{to{stroke-dashoffset:-14}}@keyframes fxseq{0%{opacity:0}3%{opacity:1}25.9%{opacity:1}30.9%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.fx{animation:none;opacity:0}}</style><defs><marker id="ahfbbf24" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#fbbf24"/></marker></defs><rect width="960" height="1116" rx="16" fill="#0b1120"/><rect x="8" y="8" width="944" height="1100" rx="12" fill="none" stroke="#8b9ab0" stroke-opacity=".8"/>
