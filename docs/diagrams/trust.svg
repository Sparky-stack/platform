<rect x="32" y="176" width="224" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="160.0" y="202.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cert-manager</text>
<text class="s" x="160.0" y="222.4" font-size="13" fill="#cbd5e1" text-anchor="middle">agent CA per cluster (10y)</text>
<text class="s" x="160.0" y="239.9" font-size="13" fill="#cbd5e1" text-anchor="middle">client cert (1y)</text>
<rect x="336" y="176" width="232" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="452.0" y="202.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ESO + CRS</text>
<text class="s" x="452.0" y="222.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cert, key and the public</text>
<text class="s" x="452.0" y="239.9" font-size="13" fill="#cbd5e1" text-anchor="middle">gateway CA, as a payload</text>
<rect x="680" y="176" width="240" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="202.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="800.0" y="222.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Secret cluster-agent-tls,</text>
<text class="s" x="800.0" y="239.9" font-size="13" fill="#cbd5e1" text-anchor="middle">dials out with mTLS</text>
<rect x="336" y="336" width="232" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="452.0" y="362.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="452.0" y="382.4" font-size="13" fill="#cbd5e1" text-anchor="middle">accepts only the CA in</text>
<text class="s" x="452.0" y="399.9" font-size="13" fill="#cbd5e1" text-anchor="middle">that ClusterDataPlane</text>
<rect x="32" y="488" width="224" height="240" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="160.0" y="559.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="160.0" y="579.4" font-size="13" fill="#cbd5e1" text-anchor="middle">group root + intermediate</text>
<text class="s" x="160.0" y="596.9" font-size="13" fill="#cbd5e1" text-anchor="middle">keys generated inside,</text>
<text class="s" x="160.0" y="614.4" font-size="13" fill="#cbd5e1" text-anchor="middle">never exported</text>
<text class="s" x="160.0" y="631.9" font-size="13" fill="#cbd5e1" text-anchor="middle"></text>
<text class="s" x="160.0" y="649.4" font-size="13" fill="#cbd5e1" text-anchor="middle">per member: JWT auth</text>
<text class="s" x="160.0" y="666.9" font-size="13" fill="#cbd5e1" text-anchor="middle">mount + PKI role</text>
<rect x="188.7" y="468" width="57.3" height="17" rx="8.5" fill="#0b1120" stroke="#fb7185" stroke-width="1"/>
<text class="s" x="217.4" y="480.5" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="336" y="488" width="232" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="452.0" y="514.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ESO + CRS</text>
<text class="s" x="452.0" y="534.4" font-size="13" fill="#cbd5e1" text-anchor="middle">group root + OpenBao CA</text>
<text class="s" x="452.0" y="551.9" font-size="13" fill="#cbd5e1" text-anchor="middle">(public certificates)</text>
<rect x="680" y="488" width="240" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="800.0" y="514.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">istio-csr</text>
<text class="s" x="800.0" y="534.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cert-manager Vault Issuer</text>
<text class="s" x="800.0" y="551.9" font-size="13" fill="#cbd5e1" text-anchor="middle">projected SA token (JWT)</text>
<rect x="680" y="648" width="240" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="674.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ztunnel · istiod</text>
<text class="s" x="800.0" y="694.4" font-size="13" fill="#cbd5e1" text-anchor="middle">workload certs 24h</text>
<text class="s" x="800.0" y="711.9" font-size="13" fill="#cbd5e1" text-anchor="middle">istiod 48h · renew at ½</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Trust &amp; certificates · who signs what, and how it renews</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Two chains, both rooted on mgmt: a CA per cluster for the OpenChoreo agent, and OpenBao&#x27;s mesh CA per group. Private CA keys</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#94a3b8">never leave mgmt.</text>
<text class="s" x="32.0" y="162.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">OPENCHOREO AGENT IDENTITY</text>
<text class="s" x="32.0" y="466.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">MESH CA</text>
<circle cx="53.0" cy="197.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="53.0" y="201.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">8</text>
<circle cx="53.0" cy="509.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="53.0" y="513.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">9</text>
<circle cx="296.0" cy="216.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="296.0" y="220.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="624.0" cy="216.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="624.0" y="220.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="624.0" cy="376.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="624.0" y="380.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="296.0" cy="528.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="296.0" y="532.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="624.0" cy="528.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="624.0" y="532.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="452.0" cy="688.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="452.0" y="692.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="800.0" cy="608.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="800.0" y="612.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="772" x2="932" y2="772" stroke="#8b9ab0" stroke-width="1.5"/>
<circle cx="40.0" cy="795.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="800" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="800.0" font-size="13.5" fill="#cbd5e1">cert-manager issues each cluster&#x27;s agent cert (CN=&lt;name&gt;)</text>
<text class="s" x="60.0" y="819.0" font-size="13.5" fill="#cbd5e1">from that cluster&#x27;s own CA</text>
<circle cx="506.0" cy="795.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="800" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="800.0" font-size="13.5" fill="#cbd5e1">istio-csr logs in with a projected token (its own JWT mount) and</text>
<text class="s" x="526.0" y="819.0" font-size="13.5" fill="#cbd5e1">gets certs signed by the group intermediate</text>
<circle cx="40.0" cy="843.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="848" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="848.0" font-size="13.5" fill="#cbd5e1">ESO and a ClusterResourceSet copy cert, key and the public</text>
<text class="s" x="60.0" y="867.0" font-size="13.5" fill="#cbd5e1">gateway CA to the cluster</text>
<circle cx="506.0" cy="843.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="848" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="848.0" font-size="13.5" fill="#cbd5e1">ztunnel and gateways get 24h workload certs, istiod 48h,</text>
<text class="s" x="526.0" y="867.0" font-size="13.5" fill="#cbd5e1">renewed at half-life</text>
<circle cx="40.0" cy="891.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="896" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="896.0" font-size="13.5" fill="#cbd5e1">The agent dials out with mTLS; cluster-gateway accepts only</text>
<text class="s" x="60.0" y="915.0" font-size="13.5" fill="#cbd5e1">that cluster&#x27;s CA</text>
<circle cx="506.0" cy="891.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="506.0" y="896" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">8</text>
<text class="s" x="526.0" y="896.0" font-size="13.5" fill="#cbd5e1">Rotation: certs renew 30 days before expiry; restart the agent</text>
<text class="s" x="526.0" y="915.0" font-size="13.5" fill="#cbd5e1">to load them (#50)</text>
<circle cx="40.0" cy="939.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="944" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="944.0" font-size="13.5" fill="#cbd5e1">OpenBao publishes each group root; its keys stay inside</text>
<text class="s" x="60.0" y="963.0" font-size="13.5" fill="#cbd5e1">OpenBao</text>
<circle cx="506.0" cy="939.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="506.0" y="944" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">9</text>
<text class="s" x="526.0" y="944.0" font-size="13.5" fill="#cbd5e1">Root rotation is planned: new root beside the old one, trust</text>
<text class="s" x="526.0" y="963.0" font-size="13.5" fill="#cbd5e1">bundle, switch, drop (#71)</text>
<circle cx="40.0" cy="987.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="992" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="60.0" y="992.0" font-size="13.5" fill="#cbd5e1">ESO and a ClusterResourceSet deliver the root and OpenBao&#x27;s</text>
<text class="s" x="60.0" y="1011.0" font-size="13.5" fill="#cbd5e1">CA to every member</text>
<rect x="28" y="1056" width="20" height="13" rx="3" fill="#173e45" stroke="#2dd4bf" stroke-width="1.3"/>
<text class="s" x="58.0" y="1066.0" font-size="13" fill="#94a3b8">mgmt cluster</text>
<rect x="162.86294" y="1056" width="20" height="13" rx="3" fill="#193951" stroke="#38bdf8" stroke-width="1.3"/>
<text class="s" x="192.9" y="1066.0" font-size="13" fill="#94a3b8">workload cluster</text>
<rect x="318.40966000000003" y="1056" width="20" height="13" rx="3" fill="#402a3a" stroke="#fb7185" stroke-width="1.3"/>
<text class="s" x="348.4" y="1066.0" font-size="13" fill="#94a3b8">security &amp; trust</text>
<path d="M 463.5368 1062 L 485.5368 1062" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 463.5368 1062 L 485.5368 1062" stroke="#fde5a7" style="animation-delay:0s,0.00s"/>
<text class="s" x="495.5" y="1066.0" font-size="13" fill="#94a3b8">numbered flow (animated)</text>
<rect x="681.5915" y="1056" width="20" height="13" rx="3" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="s" x="711.6" y="1066.0" font-size="13" fill="#94a3b8">opt-in (off by default)</text>
<circle cx="38" cy="1086" r="9" fill="#0b1120" stroke="#fbbf24" stroke-width="2"/>
<text class="s" x="58.0" y="1090.0" font-size="13" fill="#94a3b8">step at a component</text>
</svg>
