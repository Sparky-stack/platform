<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1104" viewBox="0 0 960 1104" role="img" aria-label="Trust &amp; certificates · who signs what, and how it renews"><title>Trust &amp; certificates · who signs what, and how it renews</title><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.fx{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:4 10;opacity:0;animation:fxdash .9s linear infinite,fxseq 10.20s linear infinite both}@keyframes fxdash{to{stroke-dashoffset:-14}}@keyframes fxseq{0%{opacity:0}3%{opacity:1}25.9%{opacity:1}30.9%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.fx{animation:none;opacity:0}}</style><defs><marker id="ahfbbf24" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5 L0,10 z" fill="#fbbf24"/></marker><marker id="asfbbf24" markerWidth="13" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M13,0 L0,5 L13,10 z" fill="#fbbf24"/></marker></defs><rect width="960" height="1104" rx="16" fill="#0b1120"/><rect x="8" y="8" width="944" height="1088" rx="12" fill="none" stroke="#8b9ab0" stroke-opacity=".8"/>
<rect x="28" y="112" width="544" height="672" rx="14" fill="#0e212d" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="44.0" y="136.0" font-size="13" fill="#2dd4bf" font-weight="700" letter-spacing="1.0">MANAGEMENT CLUSTER</text>
<rect x="668" y="112" width="264" height="672" rx="14" fill="#0f1f31" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="684.0" y="136.0" font-size="13" fill="#38bdf8" font-weight="700" letter-spacing="1.0">WORKLOAD CLUSTER</text>
<path d="M 44 444 L 916 444" stroke="#7c8aa0" stroke-width="1.2" stroke-dasharray="3 5"/>
<path d="M 264.0 224.0 L 684.0 224.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 154.0 264.0 L 154.0 368.0 L 336.0 368.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 800.0 264.0 L 800.0 368.0 L 556.0 368.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 800.0 600.0 L 800.0 680.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 684.0 720.0 L 456.0 720.0 L 456.0 600.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 264.0 224.0 L 684.0 224.0" stroke="#fde5a7" style="animation-delay:0s,1.10s"/>
<path class="fx" d="M 154.0 264.0 L 154.0 368.0 L 336.0 368.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
<path class="fx" d="M 800.0 264.0 L 800.0 368.0 L 556.0 368.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 800.0 600.0 L 800.0 680.0" stroke="#fde5a7" style="animation-delay:0s,5.50s"/>
<path class="fx" d="M 684.0 720.0 L 456.0 720.0 L 456.0 600.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<rect x="44" y="184" width="220" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="177.0" y="210.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cert-manager</text>
<text class="s" x="177.0" y="230.4" font-size="13" fill="#dde5ef" text-anchor="middle">one CA</text>
<text class="s" x="177.0" y="248.4" font-size="13" fill="#dde5ef" text-anchor="middle">per cluster</text>
<rect x="336" y="328" width="220" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="446.0" y="354.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="446.0" y="374.4" font-size="13" fill="#dde5ef" text-anchor="middle">entry point</text>
<text class="s" x="446.0" y="392.4" font-size="13" fill="#dde5ef" text-anchor="middle">for agents</text>
<rect x="684" y="184" width="232" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="210.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="800.0" y="230.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s agent</text>
<text class="s" x="800.0" y="248.4" font-size="13" fill="#dde5ef" text-anchor="middle">on the cluster</text>
<rect x="44" y="520" width="512" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="323.0" y="546.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="323.0" y="566.4" font-size="13" fill="#dde5ef" text-anchor="middle">mesh certificate authority,</text>
<text class="s" x="323.0" y="584.4" font-size="13" fill="#dde5ef" text-anchor="middle">one per group of clusters</text>
<rect x="492.9" y="495" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="524.4" y="508.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="684" y="520" width="232" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="546.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Mesh proxies</text>
<text class="s" x="800.0" y="566.4" font-size="13" fill="#dde5ef" text-anchor="middle">ztunnel and</text>
<text class="s" x="800.0" y="584.4" font-size="13" fill="#dde5ef" text-anchor="middle">gateways</text>
<rect x="684" y="680" width="232" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="800.0" y="706.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">istio-csr</text>
<text class="s" x="800.0" y="726.4" font-size="13" fill="#dde5ef" text-anchor="middle">signs requests</text>
<text class="s" x="800.0" y="744.4" font-size="13" fill="#dde5ef" text-anchor="middle">through OpenBao</text>
<rect x="852.9" y="655" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="884.4" y="668.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Trust &amp; certificates · who signs what, and how it renews</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Two separate certificate chains, both rooted on the management cluster: a CA per cluster for the OpenChoreo agent, and an opt-in mesh</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">CA in OpenBao. No private CA key leaves the management cluster.</text>
<text class="s" x="44.0" y="164.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">AGENT IDENTITY · STEPS 1-4</text>
<text class="s" x="44.0" y="478.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">SERVICE MESH CA · STEPS 5-7</text>
<circle cx="70.0" cy="224.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="70.0" y="228.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="70.0" cy="560.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="70.0" y="564.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="368.5" y="200.0" width="155.0" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="446.0" y="214.0" font-size="13" fill="#aab6c8" text-anchor="middle">copied in by Cluster API</text>
<circle cx="620.0" cy="224.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="620.0" y="228.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="245.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="245.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<rect x="590.3" y="386.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="620.0" y="400.0" font-size="13" fill="#aab6c8" text-anchor="middle">dials out</text>
<circle cx="620.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="620.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="800.0" cy="640.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="800.0" y="644.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<rect x="590.3" y="738.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="620.0" y="752.0" font-size="13" fill="#aab6c8" text-anchor="middle">dials out</text>
<circle cx="620.0" cy="720.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="620.0" y="724.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="806" x2="932" y2="806" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="829.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="834" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="834.0" font-size="13.5" fill="#dde5ef">cert-manager issues each cluster&#x27;s agent certificate from that cluster&#x27;s own CA and renews it a month before it expires</text>
<circle cx="40" cy="857.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="862" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="862.0" font-size="13.5" fill="#dde5ef">cert-manager&#x27;s certificate is copied into the cluster by Cluster API; the CA&#x27;s private key stays on the management cluster</text>
<circle cx="40" cy="885.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="890" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="890.0" font-size="13.5" fill="#dde5ef">cert-manager gives cluster-gateway that cluster&#x27;s CA, the only one it accepts for that cluster</text>
<circle cx="40" cy="913.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="918" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="918.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out with its certificate and restarts by itself when the certificate renews</text>
<circle cx="40" cy="941.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="946" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="946.0" font-size="13.5" fill="#dde5ef">Separately, OpenBao (opt-in) creates a root and an intermediate CA for each group of clusters; the keys never leave it</text>
<circle cx="40" cy="969.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="974" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="974.0" font-size="13.5" fill="#dde5ef">The mesh proxies ask istio-csr for short-lived certificates: 24 hours, renewed at half-life (without the opt-in, istiod signs them)</text>
<circle cx="40" cy="997.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1002" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="1002.0" font-size="13.5" fill="#dde5ef">istio-csr dials out to OpenBao, logs in with its service account and gets each request signed</text>
<rect x="28" y="1042" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1052.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1042" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1052.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<path d="M 511.92409999999995 1048 L 555.9241 1048" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="527.9241" cy="1048" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="527.9241" y="1052.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="565.9" y="1052.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="26" y="1064" width="26" height="20" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="36" cy="1074" r="7" fill="#fbbf24"/><text class="s" x="36" y="1078.2" font-size="11" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="58.0" y="1078.0" font-size="13" fill="#aab6c8">step at a component</text>
<g><rect x="210.86058000000003" y="1065" width="28" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="4 2.5"/><rect x="246.86058000000003" y="1066" width="54.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2"/><text class="s" x="274.0" y="1078" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">OPT-IN</text></g>
<text class="s" x="310.9" y="1078.0" font-size="13" fill="#aab6c8">opt-in, off by default</text>
</svg>
