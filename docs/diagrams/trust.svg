<rect x="32" y="176" width="232" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="148.0" y="202.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cert-manager</text>
<text class="s" x="148.0" y="222.4" font-size="13" fill="#cbd5e1" text-anchor="middle">agent CA per cluster (10y)</text>
<text class="s" x="148.0" y="239.9" font-size="13" fill="#cbd5e1" text-anchor="middle">client cert CN=&lt;name&gt; (1y)</text>
<rect x="328" y="176" width="248" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="452.0" y="202.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ESO + ClusterResourceSet</text>
<text class="s" x="452.0" y="222.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cert + key, public gateway CA</text>
<text class="s" x="452.0" y="239.9" font-size="13" fill="#cbd5e1" text-anchor="middle">→ cluster-agent-tls</text>
<rect x="672" y="176" width="248" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="796.0" y="202.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="796.0" y="222.4" font-size="13" fill="#cbd5e1" text-anchor="middle">reads its cert at start</text>
<text class="s" x="796.0" y="239.9" font-size="13" fill="#cbd5e1" text-anchor="middle">dials out with mTLS</text>
<rect x="328" y="320" width="248" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="452.0" y="346.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="452.0" y="366.4" font-size="13" fill="#cbd5e1" text-anchor="middle">accepts only the CA in</text>
<text class="s" x="452.0" y="383.9" font-size="13" fill="#cbd5e1" text-anchor="middle">that ClusterDataPlane</text>
<rect x="32" y="476" width="232" height="224" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="148.0" y="539.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="148.0" y="559.4" font-size="13" fill="#cbd5e1" text-anchor="middle">group root + intermediate</text>
<text class="s" x="148.0" y="576.9" font-size="13" fill="#cbd5e1" text-anchor="middle">keys generated inside,</text>
<text class="s" x="148.0" y="594.4" font-size="13" fill="#cbd5e1" text-anchor="middle">never exported</text>
<text class="s" x="148.0" y="611.9" font-size="13" fill="#cbd5e1" text-anchor="middle"></text>
<text class="s" x="148.0" y="629.4" font-size="13" fill="#cbd5e1" text-anchor="middle">per member: JWT auth</text>
<text class="s" x="148.0" y="646.9" font-size="13" fill="#cbd5e1" text-anchor="middle">mount + PKI role</text>
<rect x="196.7" y="468" width="57.3" height="17" rx="8.5" fill="#0b1120" stroke="#fb7185" stroke-width="1"/>
<text class="s" x="225.4" y="480.5" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="328" y="476" width="248" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="452.0" y="502.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ESO + ClusterResourceSet</text>
<text class="s" x="452.0" y="522.4" font-size="13" fill="#cbd5e1" text-anchor="middle">group root + OpenBao CA</text>
<text class="s" x="452.0" y="539.9" font-size="13" fill="#cbd5e1" text-anchor="middle">(public certificates)</text>
<rect x="672" y="476" width="248" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="796.0" y="502.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">istio-csr</text>
<text class="s" x="796.0" y="522.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cert-manager Vault Issuer</text>
<text class="s" x="796.0" y="539.9" font-size="13" fill="#cbd5e1" text-anchor="middle">projected SA token (JWT)</text>
<rect x="672" y="620" width="248" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="796.0" y="646.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ztunnel · istiod</text>
<text class="s" x="796.0" y="666.4" font-size="13" fill="#cbd5e1" text-anchor="middle">workload certs 24h</text>
<text class="s" x="796.0" y="683.9" font-size="13" fill="#cbd5e1" text-anchor="middle">istiod 48h · renew at ½</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Trust &amp; certificates · who signs what, and how it renews</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Two chains, both rooted on mgmt: a CA per cluster for the OpenChoreo agent, and OpenBao&#x27;s mesh CA per group. Private CA keys</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#94a3b8">never leave mgmt.</text>
<text class="s" x="32.0" y="162.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">OPENCHOREO AGENT IDENTITY</text>
<text class="s" x="32.0" y="460.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">MESH CA · OPENBAO (OPT-IN)</text>
<circle cx="51.0" cy="195.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="51.0" y="199.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="51.0" cy="495.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="51.0" y="499.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<circle cx="291.0" cy="216.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="291.0" y="220.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="624.0" cy="216.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="624.0" y="220.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="624.0" cy="360.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="624.0" y="364.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="291.0" cy="516.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="291.0" y="520.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="624.0" cy="516.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="624.0" y="520.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="452.0" cy="660.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="452.0" y="664.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="796.0" cy="583.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="796.0" y="587.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<line x1="28" y1="744" x2="932" y2="744" stroke="#64748b" stroke-width="1.5"/>
<circle cx="40.0" cy="761.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="766" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="766.0" font-size="13.5" fill="#cbd5e1">cert-manager issues each cluster&#x27;s agent cert (CN=&lt;name&gt;)</text>
<text class="s" x="60.0" y="785.0" font-size="13.5" fill="#cbd5e1">from that cluster&#x27;s own CA</text>
<circle cx="40.0" cy="808.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="813" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="813.0" font-size="13.5" fill="#cbd5e1">ESO and a ClusterResourceSet copy cert, key and the public</text>
<text class="s" x="60.0" y="832.0" font-size="13.5" fill="#cbd5e1">gateway CA to the cluster</text>
<circle cx="40.0" cy="855.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="860" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="860.0" font-size="13.5" fill="#cbd5e1">The agent dials out with mTLS; cluster-gateway accepts only</text>
<text class="s" x="60.0" y="879.0" font-size="13.5" fill="#cbd5e1">that cluster&#x27;s CA</text>
<circle cx="40.0" cy="902.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="907" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="907.0" font-size="13.5" fill="#cbd5e1">Public roots only: the group root and OpenBao&#x27;s CA reach</text>
<text class="s" x="60.0" y="926.0" font-size="13.5" fill="#cbd5e1">every member the same way</text>
<circle cx="506.0" cy="761.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="766" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="766.0" font-size="13.5" fill="#cbd5e1">istio-csr logs in with a projected token (its own JWT mount) and</text>
<text class="s" x="526.0" y="785.0" font-size="13.5" fill="#cbd5e1">gets certs signed by the group intermediate</text>
<circle cx="506.0" cy="808.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="813" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="813.0" font-size="13.5" fill="#cbd5e1">ztunnel and gateways get 24h workload certs, istiod 48h,</text>
<text class="s" x="526.0" y="832.0" font-size="13.5" fill="#cbd5e1">renewed at half-life</text>
<circle cx="506.0" cy="855.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="860" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="860.0" font-size="13.5" fill="#cbd5e1">Rotation: certs renew 30 days before expiry; restart the agent</text>
<text class="s" x="526.0" y="879.0" font-size="13.5" fill="#cbd5e1">to load them (#50)</text>
<circle cx="506.0" cy="902.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="907" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="907.0" font-size="13.5" fill="#cbd5e1">Root rotation is planned: new root beside the old one, trust</text>
<text class="s" x="526.0" y="926.0" font-size="13.5" fill="#cbd5e1">bundle, switch, drop (#71)</text>
<rect x="28" y="970" width="20" height="13" rx="3" fill="#173e45" stroke="#2dd4bf" stroke-width="1.3"/>
<text class="s" x="58.0" y="980.0" font-size="13" fill="#94a3b8">mgmt cluster</text>
<rect x="162.86294" y="970" width="20" height="13" rx="3" fill="#193951" stroke="#38bdf8" stroke-width="1.3"/>
<text class="s" x="192.9" y="980.0" font-size="13" fill="#94a3b8">workload cluster</text>
<rect x="318.40966000000003" y="970" width="20" height="13" rx="3" fill="#402a3a" stroke="#fb7185" stroke-width="1.3"/>
<text class="s" x="348.4" y="980.0" font-size="13" fill="#94a3b8">security &amp; trust</text>
