<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1104" viewBox="0 0 960 1104" role="img" aria-label="Trust &amp; certificates · who signs what, and how it renews"><title>Trust &amp; certificates · who signs what, and how it renews</title><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.fx{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:4 10;opacity:0;animation:fxdash .9s linear infinite,fxseq 10.20s linear infinite both}@keyframes fxdash{to{stroke-dashoffset:-14}}@keyframes fxseq{0%{opacity:0}3%{opacity:1}25.9%{opacity:1}30.9%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.fx{animation:none;opacity:0}}</style><defs><marker id="ahfbbf24" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5 L0,10 z" fill="#fbbf24"/></marker><marker id="asfbbf24" markerWidth="13" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M13,0 L0,5 L13,10 z" fill="#fbbf24"/></marker></defs><rect width="960" height="1104" rx="16" fill="#0b1120"/><rect x="8" y="8" width="944" height="1088" rx="12" fill="none" stroke="#8b9ab0" stroke-opacity=".8"/>
<rect x="16" y="112" width="560" height="672" rx="14" fill="#0e212d" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="32.0" y="136.0" font-size="13" fill="#2dd4bf" font-weight="700" letter-spacing="1.0">MGMT CLUSTER</text>
<rect x="656" y="112" width="288" height="672" rx="14" fill="#0f1f31" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="672.0" y="136.0" font-size="13" fill="#38bdf8" font-weight="700" letter-spacing="1.0">WORKLOAD CLUSTER</text>
<path d="M 32 444 L 928 444" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 5"/>
<path d="M 252.0 224.0 L 680.0 224.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 142.0 264.0 L 142.0 368.0 L 320.0 368.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 800.0 264.0 L 800.0 368.0 L 540.0 368.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 680.0 560.0 L 252.0 560.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ahfbbf24)" marker-start="url(#asfbbf24)"/>
<path d="M 800.0 600.0 L 800.0 680.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 252.0 224.0 L 680.0 224.0" stroke="#fde5a7" style="animation-delay:0s,1.10s"/>
<path class="fx" d="M 142.0 264.0 L 142.0 368.0 L 320.0 368.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
<path class="fx" d="M 800.0 264.0 L 800.0 368.0 L 540.0 368.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 680.0 560.0 L 252.0 560.0" stroke="#fde5a7" style="animation-delay:0s,5.50s"/>
<path class="fx" d="M 800.0 600.0 L 800.0 680.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<rect x="32" y="184" width="220" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="142.0" y="210.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cert-manager</text>
<text class="s" x="142.0" y="230.4" font-size="13" fill="#dde5ef" text-anchor="middle">one CA per cluster,</text>
<text class="s" x="142.0" y="248.4" font-size="13" fill="#dde5ef" text-anchor="middle">renews certificates</text>
<rect x="320" y="328" width="220" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="430.0" y="354.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-gateway</text>
<text class="s" x="430.0" y="374.4" font-size="13" fill="#dde5ef" text-anchor="middle">the agents&#x27; entry</text>
<text class="s" x="430.0" y="392.4" font-size="13" fill="#dde5ef" text-anchor="middle">point on mgmt</text>
<rect x="680" y="184" width="240" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="210.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="800.0" y="230.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s agent</text>
<text class="s" x="800.0" y="248.4" font-size="13" fill="#dde5ef" text-anchor="middle">on the cluster</text>
<rect x="32" y="520" width="220" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="142.0" y="546.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="142.0" y="566.4" font-size="13" fill="#dde5ef" text-anchor="middle">mesh CA per group,</text>
<text class="s" x="142.0" y="584.4" font-size="13" fill="#dde5ef" text-anchor="middle">keys never leave it</text>
<rect x="180.7" y="497" width="59.3" height="17" rx="8.5" fill="#0b1120" stroke="#2dd4bf" stroke-width="1"/>
<text class="s" x="210.4" y="509.5" font-size="11" font-weight="700" fill="#2dd4bf" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="680" y="520" width="240" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="546.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">istio-csr</text>
<text class="s" x="800.0" y="566.4" font-size="13" fill="#dde5ef" text-anchor="middle">gets mesh certificates</text>
<text class="s" x="800.0" y="584.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed</text>
<rect x="680" y="680" width="240" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="706.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Mesh proxies</text>
<text class="s" x="800.0" y="726.4" font-size="13" fill="#dde5ef" text-anchor="middle">encrypt traffic</text>
<text class="s" x="800.0" y="744.4" font-size="13" fill="#dde5ef" text-anchor="middle">between services</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Trust &amp; certificates · who signs what, and how it renews</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Two certificate chains, both rooted on mgmt: a CA per cluster for the OpenChoreo agent, and OpenBao&#x27;s mesh CA per cluster group.</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">Private CA keys never leave mgmt.</text>
<text class="s" x="32.0" y="164.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">AGENT IDENTITY · ALWAYS ON</text>
<text class="s" x="32.0" y="478.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">SERVICE MESH CA · OPT-IN</text>
<circle cx="59.0" cy="224.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.4"/>
<text class="s" x="59.0" y="228.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">1</text>
<circle cx="56.3" cy="560.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.4"/>
<text class="s" x="56.3" y="564.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">5</text>
<circle cx="616.0" cy="224.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="616.0" y="228.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="231.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="231.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="616.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="616.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="616.0" cy="560.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="616.0" y="564.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="800.0" cy="640.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="800.0" y="644.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="806" x2="932" y2="806" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="829.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40" y="834" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">1</text>
<text class="s" x="62.0" y="834.0" font-size="13.5" fill="#dde5ef">cert-manager issues each cluster&#x27;s agent certificate from that cluster&#x27;s own CA and renews it 30 days before expiry</text>
<circle cx="40" cy="857.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="862" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="862.0" font-size="13.5" fill="#dde5ef">cert-manager&#x27;s certificate is copied to the cluster (ESO, ClusterResourceSet); the CA key stays on mgmt</text>
<circle cx="40" cy="885.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="890" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="890.0" font-size="13.5" fill="#dde5ef">cert-manager gives cluster-gateway that CA: the only one it accepts for this cluster</text>
<circle cx="40" cy="913.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="918" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="918.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out with its certificate (mTLS); Reloader restarts it when the certificate renews</text>
<circle cx="40" cy="941.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40" y="946" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">5</text>
<text class="s" x="62.0" y="946.0" font-size="13.5" fill="#dde5ef">OpenBao (opt-in) holds each group&#x27;s root and intermediate CA; its public root is copied to every member</text>
<circle cx="40" cy="969.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="974" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="974.0" font-size="13.5" fill="#dde5ef">istio-csr logs in to OpenBao with its service account token and gets mesh certificates signed</text>
<circle cx="40" cy="997.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1002" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="1002.0" font-size="13.5" fill="#dde5ef">istio-csr hands short-lived certificates to the mesh: 24 h for workloads, 48 h for istiod, renewed at half-life</text>
<rect x="28" y="1042" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1052.0" font-size="13" fill="#aab6c8">mgmt cluster</text>
<rect x="162.86294" y="1042" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="192.9" y="1052.0" font-size="13" fill="#aab6c8">workload cluster</text>
<path d="M 316.40966000000003 1048 L 352.40966000000003 1048" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="330.40966000000003" cy="1048" r="7" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="362.4" y="1052.0" font-size="13" fill="#aab6c8">numbered step</text>
<circle cx="490.32226" cy="1048" r="8" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="510.3" y="1052.0" font-size="13" fill="#aab6c8">step inside a component</text>
<path d="M 687.6836800000001 1048 L 719.6836800000001 1048" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)" marker-start="url(#asfbbf24)"/>
<text class="s" x="729.7" y="1052.0" font-size="13" fill="#aab6c8">request and reply</text>
<rect x="28" y="1068" width="34" height="13" rx="3" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="5 3"/>
<text class="s" x="72.0" y="1078.0" font-size="13" fill="#aab6c8">opt-in (off by default)</text>
</svg>
