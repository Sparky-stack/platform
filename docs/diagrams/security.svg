<path d="M 288.0 280.0 L 288.0 240.0 L 560.0 240.0 L 560.0 200.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
