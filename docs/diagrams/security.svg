<text class="s" x="40.0" y="666" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="666.0" font-size="13.5" fill="#cbd5e1">The build scans (Trivy) and writes an SBOM and SLSA</text>
<text class="s" x="60.0" y="685.0" font-size="13.5" fill="#cbd5e1">provenance</text>
<circle cx="40.0" cy="708.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="713" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="713.0" font-size="13.5" fill="#cbd5e1">cosign signs and attests: platform key in-cluster, keyless</text>
<text class="s" x="60.0" y="732.0" font-size="13.5" fill="#cbd5e1">(Fulcio) on GitHub</text>
<circle cx="40.0" cy="755.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="760" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="760.0" font-size="13.5" fill="#cbd5e1">Kyverno verifies signature and attestations: Deny in production,</text>
<text class="s" x="60.0" y="779.0" font-size="13.5" fill="#cbd5e1">Audit in dev and staging</text>
<circle cx="40.0" cy="802.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="807" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="807.0" font-size="13.5" fill="#cbd5e1">Only verified images and Pod Security baseline pods start</text>
<circle cx="506.0" cy="661.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="666" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="666.0" font-size="13.5" fill="#cbd5e1">Production bindings: a ValidatingAdmissionPolicy admits only</text>
<text class="s" x="526.0" y="685.0" font-size="13.5" fill="#cbd5e1">Argo CD&#x27;s gated app</text>
<circle cx="506.0" cy="708.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="713" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="713.0" font-size="13.5" fill="#cbd5e1">Falco watches every node&#x27;s syscalls (modern eBPF)</text>
<circle cx="506.0" cy="736.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="741" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="741.0" font-size="13.5" fill="#cbd5e1">Falco Talon responds in place: terminate or label the pod</text>
<circle cx="506.0" cy="764.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="769" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="769.0" font-size="13.5" fill="#cbd5e1">≥ Critical escalates to mgmt: falcosidekick → argo-events →</text>
<text class="s" x="526.0" y="788.0" font-size="13.5" fill="#cbd5e1">falco-response</text>
