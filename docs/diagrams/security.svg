<path d="M 264.0 346.0 L 324.0 346.0 L 324.0 480.0 L 384.0 480.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
