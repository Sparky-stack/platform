<circle cx="40.0" cy="723.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="728" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="728.0" font-size="13.5" fill="#cbd5e1">The build scans (Trivy) and writes an SBOM and SLSA</text>
<text class="s" x="60.0" y="747.0" font-size="13.5" fill="#cbd5e1">provenance</text>
<circle cx="506.0" cy="723.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="728" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="728.0" font-size="13.5" fill="#cbd5e1">Falco sees every pod&#x27;s syscalls (modern eBPF on each node)</text>
<circle cx="40.0" cy="771.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="776" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="776.0" font-size="13.5" fill="#cbd5e1">cosign signs and attests: platform key in-cluster, keyless</text>
<text class="s" x="60.0" y="795.0" font-size="13.5" fill="#cbd5e1">(Fulcio) on GitHub</text>
<circle cx="506.0" cy="771.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="776" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="776.0" font-size="13.5" fill="#cbd5e1">Falco Talon responds in place: terminate or label the pod</text>
<circle cx="40.0" cy="819.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="824" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="824.0" font-size="13.5" fill="#cbd5e1">Kyverno verifies signature and attestations: Deny in production,</text>
<text class="s" x="60.0" y="843.0" font-size="13.5" fill="#cbd5e1">Audit in dev and staging</text>
<circle cx="506.0" cy="819.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="824" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="824.0" font-size="13.5" fill="#cbd5e1">≥ Critical escalates to mgmt: falcosidekick → argo-events →</text>
<text class="s" x="526.0" y="843.0" font-size="13.5" fill="#cbd5e1">falco-response</text>
<circle cx="40.0" cy="867.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="872" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="872.0" font-size="13.5" fill="#cbd5e1">Only verified images and Pod Security baseline pods start</text>
