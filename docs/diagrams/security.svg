<path class="fx" d="M 264.0 160.0 L 384.0 160.0" stroke="#fde5a7" style="animation-delay:0s,1.10s"/>
<path class="fx" d="M 696.0 160.0 L 576.0 160.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
