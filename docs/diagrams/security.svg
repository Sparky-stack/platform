<path class="fx" d="M 264.0 308.0 L 696.0 308.0" stroke="#fde5a7" style="animation-delay:0s,4.40s"/>
<path class="fx" d="M 264.0 346.0 L 324.0 346.0 L 324.0 480.0 L 384.0 480.0" stroke="#fde5a7" style="animation-delay:0s,5.50s"/>
<path class="fx" d="M 576.0 480.0 L 696.0 480.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<path class="fx" d="M 168.0 360.0 L 168.0 640.0 L 384.0 640.0" stroke="#fde5a7" style="animation-delay:0s,7.70s"/>
<rect x="72" y="120" width="192" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="191.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="191.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">scans and signs</text>
<text class="s" x="191.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">every image</text>
<rect x="384" y="120" width="192" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="480.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">images and</text>
<text class="s" x="480.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">signatures</text>
<rect x="696" y="120" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="792.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Admission control</text>
<text class="s" x="792.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">checks signatures</text>
<text class="s" x="792.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">and pod settings</text>
<rect x="72" y="280" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="168.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Detection</text>
<text class="s" x="168.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">watches every pod</text>
<text class="s" x="168.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">at runtime</text>
<rect x="696" y="280" width="192" height="240" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="792.0" y="395.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="792.0" y="415.4" font-size="13" fill="#dde5ef" text-anchor="middle">your services</text>
<rect x="384" y="440" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="480.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Auto-response</text>
<text class="s" x="480.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">stops or labels</text>
<text class="s" x="480.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">offending pods</text>
<rect x="384" y="600" width="192" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="626.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Incident workflow</text>
<text class="s" x="480.0" y="646.4" font-size="13" fill="#dde5ef" text-anchor="middle">finds the app,</text>
<text class="s" x="480.0" y="664.4" font-size="13" fill="#dde5ef" text-anchor="middle">records the incident</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Security · from build to runtime</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A signed supply chain, admission that verifies it, and runtime detection with an automatic response. Identity, secrets and keys</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">underneath: see the trust view.</text>
<circle cx="98.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="98.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="324.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="324.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="636.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="636.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="792.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="792.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="480.0" cy="308.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="312.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="237.7" y="401.0" width="72.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="306.0" y="415.0" font-size="13" fill="#aab6c8" text-anchor="end">every alert</text>
<circle cx="324.0" cy="410.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="324.0" y="414.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<rect x="584.5" y="498.0" width="103.0" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="636.0" y="512.0" font-size="13" fill="#aab6c8" text-anchor="middle">on a rule match</text>
<circle cx="636.0" cy="480.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="636.0" y="484.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<rect x="184.0" y="551.0" width="117.5" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="188.0" y="565.0" font-size="13" fill="#aab6c8">also: critical alerts</text>
<circle cx="168.0" cy="560.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="168.0" y="564.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="702" x2="932" y2="702" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="725.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="730" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="730.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans the image for known vulnerabilities, then cosign signs it with its build record</text>
<circle cx="40" cy="753.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="758" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="758.0" font-size="13.5" fill="#dde5ef">Build &amp; sign pushes the image and its signature to the registry</text>
<circle cx="40" cy="781.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="786" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="786.0" font-size="13.5" fill="#dde5ef">Admission control (Kyverno) fetches the signature from the registry before any pod starts</text>
<circle cx="40" cy="809.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="814" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="814.0" font-size="13.5" fill="#dde5ef">Admission control admits only signed images with safe pod settings: it blocks in production and warns in dev and staging</text>
<circle cx="40" cy="837.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="842" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="842.0" font-size="13.5" fill="#dde5ef">Detection (Falco) watches what every pod does at runtime, on every node</text>
<circle cx="40" cy="865.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="870" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="870.0" font-size="13.5" fill="#dde5ef">Detection sends every alert to Auto-response (Falco Talon)</text>
<circle cx="40" cy="893.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="898" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="898.0" font-size="13.5" fill="#dde5ef">Auto-response stops or labels the offending pod when an alert matches one of its rules</text>
<circle cx="40" cy="921.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="926" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="926.0" font-size="13.5" fill="#dde5ef">Detection also escalates critical alerts to an incident workflow on the management cluster (Argo Events), which finds the affected app and</text>
<text class="s" x="62.0" y="945.0" font-size="13.5" fill="#dde5ef">records the incident on it</text>
<rect x="28" y="985" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="995.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="985" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="995.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<path d="M 26 1017 L 70 1017" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="1017" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1021.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1021.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="422.3199" y="1007" width="26" height="20" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="432.3199" cy="1017" r="7" fill="#fbbf24"/><text class="s" x="432.3199" y="1021.2" font-size="11" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="454.3" y="1021.0" font-size="13" fill="#aab6c8">step at a component</text>
</svg>
