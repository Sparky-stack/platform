<rect x="72" y="120" width="192" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="191.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="191.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">scans and signs</text>
<text class="s" x="191.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">every image</text>
<rect x="384" y="120" width="192" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="480.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">images and</text>
<text class="s" x="480.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">signatures</text>
<rect x="696" y="120" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="792.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Admission control</text>
<text class="s" x="792.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">verifies images</text>
<text class="s" x="792.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">before pods start</text>
<rect x="72" y="280" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="168.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Detection</text>
<text class="s" x="168.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">watches every pod</text>
<text class="s" x="168.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">at runtime</text>
<rect x="696" y="280" width="192" height="260" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="792.0" y="405.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="792.0" y="425.4" font-size="13" fill="#dde5ef" text-anchor="middle">your services</text>
<rect x="72" y="460" width="192" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="168.0" y="495.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Incident workflow</text>
<text class="s" x="168.0" y="515.4" font-size="13" fill="#dde5ef" text-anchor="middle">response runbook</text>
<rect x="384" y="460" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="480.0" y="486.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Auto-response</text>
<text class="s" x="480.0" y="506.4" font-size="13" fill="#dde5ef" text-anchor="middle">stops or labels</text>
<text class="s" x="480.0" y="524.4" font-size="13" fill="#dde5ef" text-anchor="middle">the offending pod</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Security · from build to runtime</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A signed supply chain, admission that verifies it, and runtime detection with an automatic response. Identity, secrets and keys</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">underneath: see the trust view.</text>
<circle cx="98.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="98.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="324.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="324.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="636.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="636.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="792.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="792.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="480.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="184.0" y="401.0" width="84.6" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="188.0" y="415.0" font-size="13" fill="#aab6c8">critical alerts</text>
<circle cx="168.0" cy="410.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="168.0" y="414.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="444.0" cy="410.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="444.0" y="414.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="636.0" cy="500.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="636.0" y="504.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="562" x2="932" y2="562" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="585.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="590" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="590.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans the image for known vulnerabilities, then cosign signs it with its build record</text>
<circle cx="40" cy="613.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="618" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="618.0" font-size="13.5" fill="#dde5ef">Build &amp; sign pushes the image and its signature to the registry</text>
<circle cx="40" cy="641.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="646" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="646.0" font-size="13.5" fill="#dde5ef">Kyverno fetches the signature from the registry before any pod starts</text>
<circle cx="40" cy="669.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="674" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="674.0" font-size="13.5" fill="#dde5ef">Kyverno admits only signed images with safe pod settings: it blocks in production and warns in dev and staging</text>
<circle cx="40" cy="697.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="702" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="702.0" font-size="13.5" fill="#dde5ef">Falco watches what every pod does at runtime, on every node</text>
<circle cx="40" cy="725.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="730" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="730.0" font-size="13.5" fill="#dde5ef">Falco escalates critical alerts to an incident workflow on the management cluster</text>
<circle cx="40" cy="753.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="758" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="758.0" font-size="13.5" fill="#dde5ef">Falco also sends its alerts to Falco Talon</text>
<circle cx="40" cy="781.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="786" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="786.0" font-size="13.5" fill="#dde5ef">Falco Talon stops or labels the offending pod</text>
<rect x="28" y="826" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="836.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="826" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="836.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<path d="M 26 858 L 70 858" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="858" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="862.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="862.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="422.3199" y="848" width="26" height="20" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="432.3199" cy="858" r="7" fill="#fbbf24"/><text class="s" x="432.3199" y="862.2" font-size="11" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="454.3" y="862.0" font-size="13" fill="#aab6c8">step at a component</text>
</svg>
