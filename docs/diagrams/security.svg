<rect x="196" y="112" width="196" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="294.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">build &amp; scan</text>
<text class="s" x="294.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">BuildKit · Trivy</text>
<text class="s" x="294.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">SBOM + SLSA provenance</text>
<rect x="456" y="112" width="196" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="554.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cosign</text>
<text class="s" x="554.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">platform key (in-cluster)</text>
<text class="s" x="554.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">or keyless (Fulcio)</text>
<rect x="716" y="112" width="196" height="80" rx="8" fill="#2f2f51" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="814.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">registry</text>
<text class="s" x="814.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Harbor · GHCR</text>
<text class="s" x="814.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">image + signature + SBOM</text>
<rect x="196" y="256" width="196" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="294.0" y="282.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">production gate</text>
<text class="s" x="294.0" y="302.4" font-size="13" fill="#cbd5e1" text-anchor="middle">ValidatingAdmissionPolicy:</text>
<text class="s" x="294.0" y="319.9" font-size="13" fill="#cbd5e1" text-anchor="middle">only Argo CD writes prod</text>
<rect x="456" y="256" width="196" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="554.0" y="282.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">app pods</text>
<text class="s" x="554.0" y="302.4" font-size="13" fill="#cbd5e1" text-anchor="middle">OpenChoreo dp-*</text>
<text class="s" x="554.0" y="319.9" font-size="13" fill="#cbd5e1" text-anchor="middle">namespaces</text>
<rect x="712" y="252" width="204" height="88" rx="11" fill="none" stroke="#fb7185" stroke-opacity=".85" stroke-width="1.4"/>
<rect x="716" y="256" width="196" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="2.2"/>
<text class="s" x="814.0" y="282.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="814.0" y="302.4" font-size="13" fill="#cbd5e1" text-anchor="middle">image verification</text>
<text class="s" x="814.0" y="319.9" font-size="13" fill="#cbd5e1" text-anchor="middle">+ Pod Security baseline</text>
<rect x="196" y="400" width="196" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="294.0" y="426.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Falco Talon</text>
<text class="s" x="294.0" y="446.4" font-size="13" fill="#cbd5e1" text-anchor="middle">terminate or label</text>
<text class="s" x="294.0" y="463.9" font-size="13" fill="#cbd5e1" text-anchor="middle">the pod (dp-* only)</text>
<rect x="456" y="400" width="196" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="554.0" y="426.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Falco</text>
<text class="s" x="554.0" y="446.4" font-size="13" fill="#cbd5e1" text-anchor="middle">modern eBPF</text>
<text class="s" x="554.0" y="463.9" font-size="13" fill="#cbd5e1" text-anchor="middle">on every node</text>
<rect x="716" y="400" width="196" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="814.0" y="426.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">falco-response</text>
<text class="s" x="814.0" y="446.4" font-size="13" fill="#cbd5e1" text-anchor="middle">falcosidekick →</text>
<text class="s" x="814.0" y="463.9" font-size="13" fill="#cbd5e1" text-anchor="middle">argo-events → workflow</text>
<rect x="196" y="544" width="196" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="294.0" y="570.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Thunder</text>
<text class="s" x="294.0" y="590.4" font-size="13" fill="#cbd5e1" text-anchor="middle">OIDC: console, API,</text>
<text class="s" x="294.0" y="607.9" font-size="13" fill="#cbd5e1" text-anchor="middle">CLI, promotion gate</text>
<rect x="456" y="544" width="196" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="554.0" y="570.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ESO</text>
<text class="s" x="554.0" y="590.4" font-size="13" fill="#cbd5e1" text-anchor="middle">one secret backend,</text>
<text class="s" x="554.0" y="607.9" font-size="13" fill="#cbd5e1" text-anchor="middle">namespace-scoped stores</text>
<rect x="716" y="544" width="196" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="814.0" y="570.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">PKI</text>
<text class="s" x="814.0" y="590.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cert-manager: agent CAs</text>
<text class="s" x="814.0" y="607.9" font-size="13" fill="#cbd5e1" text-anchor="middle">OpenBao: mesh CA</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Security · from build to runtime</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Four layers, each a separate control: signed supply chain, admission, runtime detection and response, and the identity / secrets / keys</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#94a3b8">underneath.</text>
<text class="s" x="32.0" y="134.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">SUPPLY CHAIN</text>
<text class="s" x="32.0" y="156.0" font-size="13" fill="#94a3b8">every image is</text>
<text class="s" x="32.0" y="174.0" font-size="13" fill="#94a3b8">signed + attested</text>
<text class="s" x="32.0" y="278.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">ADMISSION</text>
<text class="s" x="32.0" y="300.0" font-size="13" fill="#94a3b8">only verified</text>
<text class="s" x="32.0" y="318.0" font-size="13" fill="#94a3b8">images start</text>
<text class="s" x="32.0" y="422.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">RUNTIME</text>
<text class="s" x="32.0" y="444.0" font-size="13" fill="#94a3b8">detect, respond,</text>
<text class="s" x="32.0" y="462.0" font-size="13" fill="#94a3b8">escalate</text>
<text class="s" x="32.0" y="566.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">FOUNDATIONS</text>
<text class="s" x="32.0" y="588.0" font-size="13" fill="#94a3b8">identity, secrets,</text>
<text class="s" x="32.0" y="606.0" font-size="13" fill="#94a3b8">keys (trust view)</text>
