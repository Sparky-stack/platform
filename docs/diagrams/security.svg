<rect x="196" y="120" width="180" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="286.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build</text>
<text class="s" x="286.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">builds and scans</text>
<text class="s" x="286.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">every image</text>
<rect x="468" y="120" width="180" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="558.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cosign</text>
<text class="s" x="558.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">signs and</text>
<text class="s" x="558.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">attests it</text>
<rect x="740" y="120" width="180" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="830.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="830.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">Harbor or GitHub,</text>
<text class="s" x="830.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">image + signature</text>
<rect x="196" y="280" width="180" height="80" rx="8" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="286.0" y="306.4" font-size="15" fill="#dde5ef" font-weight="600" text-anchor="middle">Production gate</text>
<text class="s" x="286.0" y="326.4" font-size="13" fill="#aab6c8" text-anchor="middle">only Argo CD may</text>
<text class="s" x="286.0" y="344.4" font-size="13" fill="#aab6c8" text-anchor="middle">write production</text>
<rect x="468" y="280" width="180" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="558.0" y="315.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="558.0" y="335.4" font-size="13" fill="#dde5ef" text-anchor="middle">your services</text>
<rect x="740" y="280" width="180" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="830.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="830.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">verifies before</text>
<text class="s" x="830.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">a pod starts</text>
<rect x="196" y="440" width="180" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="286.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Falco</text>
<text class="s" x="286.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">watches system calls</text>
<text class="s" x="286.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">on every node</text>
<rect x="468" y="440" width="180" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="558.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Falco Talon</text>
<text class="s" x="558.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">stops or labels</text>
<text class="s" x="558.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">the pod</text>
<rect x="740" y="440" width="180" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="830.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Response workflow</text>
<text class="s" x="830.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">on mgmt, for</text>
<text class="s" x="830.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">critical alerts</text>
<rect x="196" y="624" width="180" height="80" rx="8" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="286.0" y="650.4" font-size="15" fill="#dde5ef" font-weight="600" text-anchor="middle">Thunder</text>
<text class="s" x="286.0" y="670.4" font-size="13" fill="#aab6c8" text-anchor="middle">sign-in for console,</text>
<text class="s" x="286.0" y="688.4" font-size="13" fill="#aab6c8" text-anchor="middle">API and CLI</text>
<rect x="468" y="624" width="180" height="80" rx="8" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="558.0" y="650.4" font-size="15" fill="#dde5ef" font-weight="600" text-anchor="middle">External Secrets</text>
<text class="s" x="558.0" y="670.4" font-size="13" fill="#aab6c8" text-anchor="middle">one secret backend,</text>
<text class="s" x="558.0" y="688.4" font-size="13" fill="#aab6c8" text-anchor="middle">scoped stores</text>
<rect x="740" y="624" width="180" height="80" rx="8" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="830.0" y="650.4" font-size="15" fill="#dde5ef" font-weight="600" text-anchor="middle">Certificates</text>
<text class="s" x="830.0" y="670.4" font-size="13" fill="#aab6c8" text-anchor="middle">a CA per cluster,</text>
<text class="s" x="830.0" y="688.4" font-size="13" fill="#aab6c8" text-anchor="middle">a mesh CA</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Security · from build to runtime</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A signed supply chain, admission that checks it, and runtime detection with a response; identity, secrets and keys underneath.</text>
<text class="s" x="32.0" y="142.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">SUPPLY CHAIN</text>
<text class="s" x="32.0" y="162.0" font-size="13" fill="#aab6c8">every image</text>
<text class="s" x="32.0" y="180.0" font-size="13" fill="#aab6c8">is signed</text>
<text class="s" x="32.0" y="302.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">ADMISSION</text>
<text class="s" x="32.0" y="322.0" font-size="13" fill="#aab6c8">only verified</text>
<text class="s" x="32.0" y="340.0" font-size="13" fill="#aab6c8">images start</text>
<text class="s" x="32.0" y="462.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">RUNTIME</text>
<text class="s" x="32.0" y="482.0" font-size="13" fill="#aab6c8">detect and</text>
<text class="s" x="32.0" y="500.0" font-size="13" fill="#aab6c8">respond</text>
<text class="s" x="32.0" y="646.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">FOUNDATIONS</text>
<text class="s" x="32.0" y="666.0" font-size="13" fill="#aab6c8">identity, secrets,</text>
<text class="s" x="32.0" y="684.0" font-size="13" fill="#aab6c8">keys</text>
<circle cx="410.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="410.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="682.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="682.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="830.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="830.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="706.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="706.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="390.0" cy="400.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="390.0" y="404.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="410.0" cy="480.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="410.0" y="484.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="565.0" cy="560.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="565.0" y="564.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="726" x2="932" y2="726" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="749.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="754" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="754.0" font-size="13.5" fill="#dde5ef">The build scans the image (Trivy), writes an SBOM and SLSA provenance and hands it to cosign</text>
<circle cx="40" cy="777.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="782" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="782.0" font-size="13.5" fill="#dde5ef">cosign signs and attests it (platform key in-cluster, keyless on GitHub) and stores both in the registry</text>
<circle cx="40" cy="805.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="810" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="810.0" font-size="13.5" fill="#dde5ef">Kyverno checks the signature and attestations in the registry: Deny in production, Audit in dev and staging</text>
<circle cx="40" cy="833.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="838" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="838.0" font-size="13.5" fill="#dde5ef">Kyverno admits only verified images with Pod Security baseline settings</text>
<circle cx="40" cy="861.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="866" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="866.0" font-size="13.5" fill="#dde5ef">Falco watches every pod&#x27;s system calls (eBPF on each node)</text>
<circle cx="40" cy="889.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="894" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="894.0" font-size="13.5" fill="#dde5ef">Falco alerts Falco Talon, which terminates or labels the pod in place</text>
<circle cx="40" cy="917.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="922" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="922.0" font-size="13.5" fill="#dde5ef">Falco escalates critical alerts to mgmt: falcosidekick → argo-events → the response workflow</text>
<rect x="28" y="962" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="972.0" font-size="13" fill="#aab6c8">mgmt cluster</text>
<rect x="162.86294" y="962" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="192.9" y="972.0" font-size="13" fill="#aab6c8">workload cluster</text>
<path d="M 316.40966000000003 968 L 352.40966000000003 968" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="330.40966000000003" cy="968" r="7" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="362.4" y="972.0" font-size="13" fill="#aab6c8">numbered step</text>
<rect x="480.32226" y="962" width="20" height="13" rx="3" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="510.3" y="972.0" font-size="13" fill="#aab6c8">context, not a step</text>
</svg>
