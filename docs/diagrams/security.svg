<rect x="196" y="120" width="180" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="286.0" y="146.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">build &amp; scan</text>
<text class="s" x="286.0" y="166.4" font-size="13" fill="#cbd5e1" text-anchor="middle">BuildKit · Trivy</text>
<text class="s" x="286.0" y="183.9" font-size="13" fill="#cbd5e1" text-anchor="middle">SBOM · provenance</text>
<rect x="468" y="120" width="180" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="558.0" y="146.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cosign</text>
<text class="s" x="558.0" y="166.4" font-size="13" fill="#cbd5e1" text-anchor="middle">platform key in-cluster</text>
<text class="s" x="558.0" y="183.9" font-size="13" fill="#cbd5e1" text-anchor="middle">or keyless (Fulcio)</text>
<rect x="740" y="120" width="180" height="80" rx="8" fill="#2f2f51" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="830.0" y="146.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">registry</text>
<text class="s" x="830.0" y="166.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Harbor · GHCR</text>
<text class="s" x="830.0" y="183.9" font-size="13" fill="#cbd5e1" text-anchor="middle">image + signature</text>
<rect x="196" y="280" width="180" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="286.0" y="306.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">production gate</text>
<text class="s" x="286.0" y="326.4" font-size="13" fill="#cbd5e1" text-anchor="middle">VAP: only Argo CD&#x27;s</text>
<text class="s" x="286.0" y="343.9" font-size="13" fill="#cbd5e1" text-anchor="middle">gated app writes prod</text>
<rect x="468" y="280" width="180" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="558.0" y="306.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">app pods</text>
<text class="s" x="558.0" y="326.4" font-size="13" fill="#cbd5e1" text-anchor="middle">OpenChoreo dp-*</text>
<text class="s" x="558.0" y="343.9" font-size="13" fill="#cbd5e1" text-anchor="middle">namespaces</text>
<rect x="736" y="276" width="188" height="88" rx="11" fill="none" stroke="#fb7185" stroke-opacity=".85" stroke-width="1.4"/>
<rect x="740" y="280" width="180" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="2.2"/>
<text class="s" x="830.0" y="306.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="830.0" y="326.4" font-size="13" fill="#cbd5e1" text-anchor="middle">image verification</text>
<text class="s" x="830.0" y="343.9" font-size="13" fill="#cbd5e1" text-anchor="middle">+ Pod Security</text>
<rect x="196" y="440" width="180" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="286.0" y="466.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Falco Talon</text>
<text class="s" x="286.0" y="486.4" font-size="13" fill="#cbd5e1" text-anchor="middle">terminate or label</text>
<text class="s" x="286.0" y="503.9" font-size="13" fill="#cbd5e1" text-anchor="middle">the pod (dp-* only)</text>
<rect x="468" y="440" width="180" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="558.0" y="466.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Falco</text>
<text class="s" x="558.0" y="486.4" font-size="13" fill="#cbd5e1" text-anchor="middle">modern eBPF</text>
<text class="s" x="558.0" y="503.9" font-size="13" fill="#cbd5e1" text-anchor="middle">on every node</text>
<rect x="740" y="440" width="180" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="830.0" y="466.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">falco-response</text>
<text class="s" x="830.0" y="486.4" font-size="13" fill="#cbd5e1" text-anchor="middle">via falcosidekick</text>
<text class="s" x="830.0" y="503.9" font-size="13" fill="#cbd5e1" text-anchor="middle">and argo-events</text>
<rect x="196" y="600" width="180" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="286.0" y="626.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Thunder</text>
<text class="s" x="286.0" y="646.4" font-size="13" fill="#cbd5e1" text-anchor="middle">OIDC: console, API,</text>
<text class="s" x="286.0" y="663.9" font-size="13" fill="#cbd5e1" text-anchor="middle">CLI, promotion gate</text>
<rect x="468" y="600" width="180" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="558.0" y="626.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ESO</text>
<text class="s" x="558.0" y="646.4" font-size="13" fill="#cbd5e1" text-anchor="middle">one secret backend,</text>
<text class="s" x="558.0" y="663.9" font-size="13" fill="#cbd5e1" text-anchor="middle">scoped stores</text>
<rect x="740" y="600" width="180" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="830.0" y="626.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">PKI</text>
<text class="s" x="830.0" y="646.4" font-size="13" fill="#cbd5e1" text-anchor="middle">cert-manager: agent CAs</text>
<text class="s" x="830.0" y="663.9" font-size="13" fill="#cbd5e1" text-anchor="middle">OpenBao: mesh CA</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Security · from build to runtime</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Four layers, each its own control: a signed supply chain, admission, runtime detection and response, and the identity, secrets and keys</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#94a3b8">underneath.</text>
<text class="s" x="32.0" y="144.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">SUPPLY CHAIN</text>
<text class="s" x="32.0" y="166.0" font-size="13" fill="#94a3b8">every image is</text>
<text class="s" x="32.0" y="184.0" font-size="13" fill="#94a3b8">signed + attested</text>
<text class="s" x="32.0" y="304.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">ADMISSION</text>
<text class="s" x="32.0" y="326.0" font-size="13" fill="#94a3b8">only verified</text>
<text class="s" x="32.0" y="344.0" font-size="13" fill="#94a3b8">images start</text>
<text class="s" x="32.0" y="464.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">RUNTIME</text>
<text class="s" x="32.0" y="486.0" font-size="13" fill="#94a3b8">detect, respond,</text>
<text class="s" x="32.0" y="504.0" font-size="13" fill="#94a3b8">escalate</text>
<text class="s" x="32.0" y="624.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">FOUNDATIONS</text>
<text class="s" x="32.0" y="646.0" font-size="13" fill="#94a3b8">identity, secrets,</text>
<text class="s" x="32.0" y="664.0" font-size="13" fill="#94a3b8">keys (trust view)</text>
