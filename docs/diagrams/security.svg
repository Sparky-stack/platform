<path class="fx" d="M 372.0 320.0 L 476.0 320.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 288.0 440.0 L 288.0 400.0 L 540.0 400.0 L 540.0 360.0" stroke="#fde5a7" style="animation-delay:0s,4.40s"/>
<path class="fx" d="M 372.0 480.0 L 476.0 480.0" stroke="#fde5a7" style="animation-delay:0s,5.50s"/>
<path class="fx" d="M 288.0 520.0 L 288.0 560.0 L 832.0 560.0 L 832.0 520.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<rect x="204" y="120" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="288.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build</text>
<text class="s" x="288.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">builds and</text>
<text class="s" x="288.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">scans images</text>
<rect x="476" y="120" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="560.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cosign</text>
<text class="s" x="560.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">signing</text>
<text class="s" x="560.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">tool</text>
<rect x="748" y="120" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="832.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="832.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">stores images</text>
<text class="s" x="832.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">and signatures</text>
<rect x="204" y="280" width="168" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="288.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="288.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">admission</text>
<text class="s" x="288.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">policy</text>
<rect x="476" y="280" width="168" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="560.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="560.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">your</text>
<text class="s" x="560.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">services</text>
<rect x="204" y="440" width="168" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="288.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Falco</text>
<text class="s" x="288.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">runtime</text>
<text class="s" x="288.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">detection</text>
<rect x="476" y="440" width="168" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="560.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Falco Talon</text>
<text class="s" x="560.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">automatic</text>
<text class="s" x="560.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">response</text>
<rect x="748" y="440" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="832.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Response workflow</text>
<text class="s" x="832.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">escalation on the</text>
<text class="s" x="832.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">management cluster</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Security · from build to runtime</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A signed supply chain, admission that verifies it, and runtime detection with an automatic response. Identity, secrets and keys</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">underneath: see the trust view.</text>
<text class="s" x="28.0" y="142.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">SUPPLY CHAIN</text>
<text class="s" x="28.0" y="162.0" font-size="13" fill="#aab6c8">every image</text>
<text class="s" x="28.0" y="180.0" font-size="13" fill="#aab6c8">is signed</text>
<text class="s" x="28.0" y="302.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">ADMISSION</text>
<text class="s" x="28.0" y="322.0" font-size="13" fill="#aab6c8">only verified</text>
<text class="s" x="28.0" y="340.0" font-size="13" fill="#aab6c8">images start</text>
<text class="s" x="28.0" y="462.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">RUNTIME</text>
<text class="s" x="28.0" y="482.0" font-size="13" fill="#aab6c8">detect and</text>
<text class="s" x="28.0" y="500.0" font-size="13" fill="#aab6c8">respond</text>
<circle cx="413.6" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="413.6" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="685.6" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="685.6" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="560.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="560.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="413.6" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="413.6" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="414.0" cy="400.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="414.0" y="404.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="413.6" cy="480.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="413.6" y="484.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="560.0" cy="560.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="560.0" y="564.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="594.0" x2="932" y2="594.0" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="617.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="622.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="622.0" font-size="13.5" fill="#dde5ef">The build scans the image for known vulnerabilities, records what is inside it and hands it to cosign</text>
<circle cx="40" cy="645.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="650.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="650.0" font-size="13.5" fill="#dde5ef">cosign signs the image and its build record and stores both next to it in the registry</text>
<circle cx="40" cy="673.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="678.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="678.0" font-size="13.5" fill="#dde5ef">Kyverno fetches the signature from the registry before any pod starts</text>
<circle cx="40" cy="701.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="706.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="706.0" font-size="13.5" fill="#dde5ef">Kyverno admits only signed images with safe pod settings: it blocks in production and warns in dev and staging</text>
<circle cx="40" cy="729.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="734.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="734.0" font-size="13.5" fill="#dde5ef">Falco watches what every pod does at runtime, on every node</text>
<circle cx="40" cy="757.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="762.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="762.0" font-size="13.5" fill="#dde5ef">Falco alerts Falco Talon, which stops or labels the offending pod</text>
<circle cx="40" cy="785.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="790.0" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="790.0" font-size="13.5" fill="#dde5ef">Falco escalates critical alerts to the response workflow on the management cluster</text>
<rect x="28" y="830.0" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="840.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="830.0" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="840.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<path d="M 511.92409999999995 836.0 L 555.9241 836.0" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="527.9241" cy="836.0" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="527.9241" y="840.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="565.9" y="840.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
</svg>
