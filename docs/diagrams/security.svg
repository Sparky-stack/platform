<path d="M 372.0 480.0 L 476.0 480.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 644.0 480.0 L 832.0 480.0 L 832.0 360.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path d="M 288.0 520.0 L 288.0 600.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 372.0 160.0 L 476.0 160.0" stroke="#fde5a7" style="animation-delay:0s,1.10s"/>
<path class="fx" d="M 288.0 280.0 L 288.0 240.0 L 560.0 240.0 L 560.0 200.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
<path class="fx" d="M 372.0 320.0 L 748.0 320.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 372.0 480.0 L 476.0 480.0" stroke="#fde5a7" style="animation-delay:0s,5.50s"/>
<path class="fx" d="M 644.0 480.0 L 832.0 480.0 L 832.0 360.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<path class="fx" d="M 288.0 520.0 L 288.0 600.0" stroke="#fde5a7" style="animation-delay:0s,7.70s"/>
<rect x="204" y="120" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="311.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="311.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">scan, then</text>
<text class="s" x="311.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">cosign</text>
<rect x="476" y="120" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="560.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="560.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">images and</text>
<text class="s" x="560.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">signatures</text>
<rect x="204" y="280" width="168" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="288.0" y="315.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Admission control</text>
<text class="s" x="288.0" y="335.4" font-size="13" fill="#dde5ef" text-anchor="middle">Kyverno</text>
<rect x="748" y="280" width="168" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="832.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="832.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">your</text>
<text class="s" x="832.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">services</text>
<rect x="204" y="440" width="168" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="311.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Detection</text>
<text class="s" x="311.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">Falco, at</text>
<text class="s" x="311.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">runtime</text>
<rect x="476" y="440" width="168" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="560.0" y="475.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Auto-response</text>
<text class="s" x="560.0" y="495.4" font-size="13" fill="#dde5ef" text-anchor="middle">Falco Talon</text>
<rect x="204" y="600" width="168" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="288.0" y="626.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Incident workflow</text>
<text class="s" x="288.0" y="646.4" font-size="13" fill="#dde5ef" text-anchor="middle">response</text>
<text class="s" x="288.0" y="664.4" font-size="13" fill="#dde5ef" text-anchor="middle">runbook</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Security · from build to runtime</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A signed supply chain, admission that verifies it, and runtime detection with an automatic response. Identity, secrets and keys</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">underneath: see the trust view.</text>
<text class="s" x="28.0" y="142.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">SUPPLY CHAIN</text>
<text class="s" x="28.0" y="162.0" font-size="13" fill="#aab6c8">every image</text>
<text class="s" x="28.0" y="180.0" font-size="13" fill="#aab6c8">is signed</text>
<text class="s" x="28.0" y="302.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">ADMISSION</text>
<text class="s" x="28.0" y="322.0" font-size="13" fill="#aab6c8">only verified</text>
<text class="s" x="28.0" y="340.0" font-size="13" fill="#aab6c8">images start</text>
<text class="s" x="28.0" y="462.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">RUNTIME</text>
<text class="s" x="28.0" y="482.0" font-size="13" fill="#aab6c8">detect and</text>
<text class="s" x="28.0" y="500.0" font-size="13" fill="#aab6c8">respond</text>
<circle cx="230.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="230.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="230.0" cy="480.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="230.0" y="484.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="413.6" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="413.6" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="424.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="424.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="414.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="414.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="413.6" cy="480.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="413.6" y="484.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="686.0" cy="480.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="686.0" y="484.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="288.0" cy="560.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="288.0" y="564.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="702" x2="932" y2="702" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="725.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="730" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="730.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans the image for known vulnerabilities, then cosign signs it with its build record</text>
<circle cx="40" cy="753.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="758" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="758.0" font-size="13.5" fill="#dde5ef">Build &amp; sign pushes the image and its signature to the registry</text>
<circle cx="40" cy="781.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="786" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="786.0" font-size="13.5" fill="#dde5ef">Kyverno fetches the signature from the registry before any pod starts</text>
<circle cx="40" cy="809.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="814" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="814.0" font-size="13.5" fill="#dde5ef">Kyverno admits only signed images with safe pod settings: it blocks in production and warns in dev and staging</text>
<circle cx="40" cy="837.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="842" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="842.0" font-size="13.5" fill="#dde5ef">Falco watches what every pod does at runtime, on every node</text>
<circle cx="40" cy="865.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="870" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="870.0" font-size="13.5" fill="#dde5ef">Falco alerts Falco Talon</text>
<circle cx="40" cy="893.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="898" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="898.0" font-size="13.5" fill="#dde5ef">Falco Talon stops or labels the offending pod</text>
<circle cx="40" cy="921.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="926" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="926.0" font-size="13.5" fill="#dde5ef">Falco escalates critical alerts to an incident workflow on the management cluster</text>
<rect x="28" y="966" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="976.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="966" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="976.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<path d="M 26 998 L 70 998" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="998" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1002.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1002.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="422.3199" y="988" width="26" height="20" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="432.3199" cy="998" r="7" fill="#fbbf24"/><text class="s" x="432.3199" y="1002.2" font-size="11" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="454.3" y="1002.0" font-size="13" fill="#aab6c8">step at a component</text>
</svg>
