<rect x="44" y="100" width="240" height="56" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="164.0" y="123.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Fleet file</text>
<text class="m" x="164.0" y="143.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters/dev1.yaml</text>
<rect x="44" y="264" width="144" height="536" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="116.0" y="473.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="116.0" y="493.4" font-size="13" fill="#dde5ef" text-anchor="middle">renders one chart</text>
<text class="s" x="116.0" y="511.4" font-size="13" fill="#dde5ef" text-anchor="middle">per fleet file:</text>
<text class="s" x="116.0" y="529.4" font-size="13" fill="#dde5ef" text-anchor="middle"></text>
<text class="s" x="116.0" y="547.4" font-size="13" fill="#dde5ef" text-anchor="middle">the cluster,</text>
<text class="s" x="116.0" y="565.4" font-size="13" fill="#dde5ef" text-anchor="middle">its secrets,</text>
<text class="s" x="116.0" y="583.4" font-size="13" fill="#dde5ef" text-anchor="middle">its identity,</text>
<text class="s" x="116.0" y="601.4" font-size="13" fill="#dde5ef" text-anchor="middle">its data plane</text>
<rect x="288" y="264" width="132" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="354.0" y="290.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="354.0" y="310.4" font-size="13" fill="#dde5ef" text-anchor="middle">creates and</text>
<text class="s" x="354.0" y="328.4" font-size="13" fill="#dde5ef" text-anchor="middle">upgrades nodes</text>
<rect x="760" y="264" width="156" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="838.0" y="290.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">k3s nodes</text>
<text class="s" x="838.0" y="310.4" font-size="13" fill="#dde5ef" text-anchor="middle">servers +</text>
<text class="s" x="838.0" y="328.4" font-size="13" fill="#dde5ef" text-anchor="middle">workers</text>
<rect x="288" y="416" width="132" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="354.0" y="442.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster secret</text>
<text class="s" x="354.0" y="462.4" font-size="13" fill="#dde5ef" text-anchor="middle">access + labels</text>
<text class="s" x="354.0" y="480.4" font-size="13" fill="#dde5ef" text-anchor="middle">for Argo CD</text>
<rect x="500" y="416" width="132" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="566.0" y="442.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Addon sets</text>
<text class="s" x="566.0" y="462.4" font-size="13" fill="#dde5ef" text-anchor="middle">pick clusters</text>
<text class="s" x="566.0" y="480.4" font-size="13" fill="#dde5ef" text-anchor="middle">by label</text>
<rect x="760" y="416" width="156" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="838.0" y="442.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Addons</text>
<text class="s" x="838.0" y="462.4" font-size="13" fill="#dde5ef" text-anchor="middle">network, mesh,</text>
<text class="s" x="838.0" y="480.4" font-size="13" fill="#dde5ef" text-anchor="middle">policy, …</text>
<rect x="288" y="568" width="132" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="354.0" y="594.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Agent identity</text>
<text class="s" x="354.0" y="614.4" font-size="13" fill="#dde5ef" text-anchor="middle">a CA of its own</text>
<text class="s" x="354.0" y="632.4" font-size="13" fill="#dde5ef" text-anchor="middle">per cluster</text>
<rect x="760" y="568" width="156" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="838.0" y="594.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="838.0" y="614.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s</text>
<text class="s" x="838.0" y="632.4" font-size="13" fill="#dde5ef" text-anchor="middle">agent</text>
<rect x="500" y="720" width="132" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="566.0" y="746.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Data plane</text>
<text class="s" x="566.0" y="766.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s</text>
<text class="s" x="566.0" y="784.4" font-size="13" fill="#dde5ef" text-anchor="middle">record</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Cluster lifecycle · add, upgrade, remove = edit one file</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A fleet file becomes a Cluster API cluster, an Argo CD cluster secret and an OpenChoreo data plane; deleting it removes all three.</text>
<circle cx="116.0" cy="222.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="116.0" y="226.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="218.0" cy="304.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="218.0" y="308.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="248.0" cy="304.0" r="3.6" fill="#fbbf24"/>
<circle cx="248.0" cy="456.0" r="3.6" fill="#fbbf24"/>
<circle cx="248.0" cy="608.0" r="3.6" fill="#fbbf24"/>
<circle cx="696.0" cy="304.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="696.0" y="308.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="354.0" cy="374.2" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="354.0" y="378.8" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="452.0" cy="456.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="452.0" y="460.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="696.0" cy="456.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="696.0" y="460.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="696.0" cy="608.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="696.0" y="612.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<rect x="666.3" y="778.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="696.0" y="792.0" font-size="13" fill="#aab6c8" text-anchor="middle">dials out</text>
<circle cx="696.0" cy="760.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="696.0" y="764.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="846" x2="932" y2="846" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="869.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="874" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="874.0" font-size="13.5" fill="#dde5ef">The fleet file clusters/&lt;name&gt;.yaml is synced by Argo CD (ApplicationSet fleet → Application cluster-&lt;name&gt;)</text>
<circle cx="40" cy="897.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="902" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="902.0" font-size="13.5" fill="#dde5ef">Argo CD renders charts/cluster: the Cluster API cluster, its secrets, the agent identity and the OpenChoreo data plane</text>
<circle cx="40" cy="925.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="930" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="930.0" font-size="13.5" fill="#dde5ef">Cluster API creates the machines and installs k3s</text>
<circle cx="40" cy="953.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="958" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="958.0" font-size="13.5" fill="#dde5ef">Cluster API&#x27;s kubeconfig becomes an Argo CD cluster secret with the fleet labels (ESO)</text>
<circle cx="40" cy="981.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="986" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="986.0" font-size="13.5" fill="#dde5ef">The cluster secret&#x27;s labels select the addon sets (ApplicationSets) that apply</text>
<circle cx="40" cy="1009.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1014" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="1014.0" font-size="13.5" fill="#dde5ef">The addon sets install every selected addon on the new cluster</text>
<circle cx="40" cy="1037.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1042" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="1042.0" font-size="13.5" fill="#dde5ef">The agent identity (its certificate) is delivered to the cluster; the CA key never leaves the management cluster</text>
<circle cx="40" cy="1065.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1070" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="1070.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out; the data plane tells the gateway to accept only this cluster&#x27;s CA</text>
<text class="s" x="28.0" y="1102.0" font-size="13.5" fill="#aab6c8">Upgrade: bump kubernetesVersion in the fleet file; Cluster API replaces the nodes one at a time. Remove: delete the file; Argo CD prunes,</text>
<text class="s" x="28.0" y="1121.0" font-size="13.5" fill="#aab6c8">Cluster API deletes the cluster and its CA goes with it.</text>
<rect x="28" y="1157" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1167.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1157" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1167.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="28" y="1183" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="58.0" y="1193.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 202.7147 1189 L 246.7147 1189" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="218.7147" cy="1189" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="218.7147" y="1193.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="256.7" y="1193.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
</svg>
