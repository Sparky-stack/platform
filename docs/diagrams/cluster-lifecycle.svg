<rect x="32" y="100" width="240" height="56" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="152.0" y="123.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Fleet file</text>
<text class="m" x="152.0" y="143.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters/dev1.yaml</text>
<rect x="32" y="256" width="144" height="536" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="104.0" y="465.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="104.0" y="485.4" font-size="13" fill="#dde5ef" text-anchor="middle">renders one chart</text>
<text class="s" x="104.0" y="503.4" font-size="13" fill="#dde5ef" text-anchor="middle">per fleet file:</text>
<text class="s" x="104.0" y="521.4" font-size="13" fill="#dde5ef" text-anchor="middle"></text>
<text class="s" x="104.0" y="539.4" font-size="13" fill="#dde5ef" text-anchor="middle">the cluster,</text>
<text class="s" x="104.0" y="557.4" font-size="13" fill="#dde5ef" text-anchor="middle">its secrets,</text>
<text class="s" x="104.0" y="575.4" font-size="13" fill="#dde5ef" text-anchor="middle">its identity,</text>
<text class="s" x="104.0" y="593.4" font-size="13" fill="#dde5ef" text-anchor="middle">its data plane</text>
<rect x="276" y="256" width="144" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="348.0" y="282.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="348.0" y="302.4" font-size="13" fill="#dde5ef" text-anchor="middle">creates and</text>
<text class="s" x="348.0" y="320.4" font-size="13" fill="#dde5ef" text-anchor="middle">upgrades nodes</text>
<rect x="764" y="256" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="844.0" y="282.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">k3s nodes</text>
<text class="s" x="844.0" y="302.4" font-size="13" fill="#dde5ef" text-anchor="middle">servers +</text>
<text class="s" x="844.0" y="320.4" font-size="13" fill="#dde5ef" text-anchor="middle">workers</text>
<rect x="276" y="408" width="144" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="348.0" y="434.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster secret</text>
<text class="s" x="348.0" y="454.4" font-size="13" fill="#dde5ef" text-anchor="middle">access + labels</text>
<text class="s" x="348.0" y="472.4" font-size="13" fill="#dde5ef" text-anchor="middle">for Argo CD</text>
<rect x="500" y="408" width="144" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="572.0" y="434.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Addon sets</text>
<text class="s" x="572.0" y="454.4" font-size="13" fill="#dde5ef" text-anchor="middle">pick clusters</text>
<text class="s" x="572.0" y="472.4" font-size="13" fill="#dde5ef" text-anchor="middle">by label</text>
<rect x="764" y="408" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="844.0" y="434.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Addons</text>
<text class="s" x="844.0" y="454.4" font-size="13" fill="#dde5ef" text-anchor="middle">network, mesh,</text>
<text class="s" x="844.0" y="472.4" font-size="13" fill="#dde5ef" text-anchor="middle">policy, …</text>
<rect x="276" y="560" width="144" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="348.0" y="586.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Agent identity</text>
<text class="s" x="348.0" y="606.4" font-size="13" fill="#dde5ef" text-anchor="middle">a CA of its own</text>
<text class="s" x="348.0" y="624.4" font-size="13" fill="#dde5ef" text-anchor="middle">per cluster</text>
<rect x="764" y="560" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="844.0" y="586.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="844.0" y="606.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s</text>
<text class="s" x="844.0" y="624.4" font-size="13" fill="#dde5ef" text-anchor="middle">agent</text>
<rect x="500" y="712" width="144" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="572.0" y="738.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Data plane</text>
<text class="s" x="572.0" y="758.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s view</text>
<text class="s" x="572.0" y="776.4" font-size="13" fill="#dde5ef" text-anchor="middle">of the cluster</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Cluster lifecycle · add, upgrade, remove = edit one file</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A fleet file becomes a Cluster API cluster, an Argo CD cluster secret and an OpenChoreo data plane; deleting it removes all three.</text>
<circle cx="104.0" cy="226.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="104.0" y="230.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="206.0" cy="296.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="206.0" y="300.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="236.0" cy="296.0" r="3.6" fill="#fbbf24"/>
<circle cx="236.0" cy="448.0" r="3.6" fill="#fbbf24"/>
<circle cx="236.0" cy="600.0" r="3.6" fill="#fbbf24"/>
<circle cx="700.0" cy="296.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="700.0" y="300.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="348.0" cy="366.2" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="348.0" y="370.8" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="452.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="452.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="700.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="700.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="700.0" cy="600.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="700.0" y="604.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="700.0" cy="752.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="700.0" y="756.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="838" x2="932" y2="838" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="861.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="866" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="866.0" font-size="13.5" fill="#dde5ef">Argo CD reads clusters/&lt;name&gt;.yaml and creates Application cluster-&lt;name&gt; (ApplicationSet fleet)</text>
<circle cx="40" cy="889.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="894" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="894.0" font-size="13.5" fill="#dde5ef">Argo CD renders charts/cluster: the Cluster API cluster, its secrets, the agent identity and the OpenChoreo data plane</text>
<circle cx="40" cy="917.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="922" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="922.0" font-size="13.5" fill="#dde5ef">Cluster API creates the machines and installs k3s</text>
<circle cx="40" cy="945.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="950" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="950.0" font-size="13.5" fill="#dde5ef">Cluster API&#x27;s kubeconfig becomes an Argo CD cluster secret with the fleet labels (ESO)</text>
<circle cx="40" cy="973.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="978" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="978.0" font-size="13.5" fill="#dde5ef">The cluster secret&#x27;s labels select the addon sets (ApplicationSets) that apply</text>
<circle cx="40" cy="1001.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1006" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="1006.0" font-size="13.5" fill="#dde5ef">The addon sets install every selected addon on the new cluster</text>
<circle cx="40" cy="1029.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1034" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="1034.0" font-size="13.5" fill="#dde5ef">The agent identity (its certificate) is delivered to the cluster; the CA key never leaves mgmt</text>
<circle cx="40" cy="1057.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1062" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="1062.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out; the data plane tells the gateway to accept only this cluster&#x27;s CA</text>
<text class="s" x="28.0" y="1094.0" font-size="13.5" fill="#aab6c8">Upgrade: bump kubernetesVersion in the fleet file; Cluster API replaces the nodes one at a time. Remove: delete the file; Argo CD prunes,</text>
<text class="s" x="28.0" y="1113.0" font-size="13.5" fill="#aab6c8">Cluster API deletes the cluster and its CA goes with it.</text>
<rect x="28" y="1149" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1159.0" font-size="13" fill="#aab6c8">mgmt cluster</text>
<rect x="162.86294" y="1149" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="192.9" y="1159.0" font-size="13" fill="#aab6c8">workload cluster</text>
<rect x="318.40966000000003" y="1149" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="348.4" y="1159.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 491.12436 1155 L 527.12436 1155" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="505.12436" cy="1155" r="7" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="537.1" y="1159.0" font-size="13" fill="#aab6c8">numbered step</text>
</svg>
