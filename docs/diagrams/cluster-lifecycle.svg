<rect x="44" y="108" width="240" height="52" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="164.0" y="129.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Fleet file</text>
<text class="m" x="164.0" y="149.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters/dev1.yaml</text>
<rect x="44" y="264" width="160" height="232" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="124.0" y="366.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="124.0" y="386.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps</text>
<text class="s" x="124.0" y="404.4" font-size="13" fill="#dde5ef" text-anchor="middle">engine</text>
<rect x="300" y="264" width="200" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="400.0" y="290.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="400.0" y="310.4" font-size="13" fill="#dde5ef" text-anchor="middle">creates and</text>
<text class="s" x="400.0" y="328.4" font-size="13" fill="#dde5ef" text-anchor="middle">upgrades nodes</text>
<rect x="300" y="568" width="200" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="400.0" y="594.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cert-manager</text>
<text class="s" x="400.0" y="614.4" font-size="13" fill="#dde5ef" text-anchor="middle">one CA</text>
<text class="s" x="400.0" y="632.4" font-size="13" fill="#dde5ef" text-anchor="middle">per cluster</text>
<rect x="300" y="720" width="200" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="400.0" y="746.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenChoreo</text>
<text class="s" x="400.0" y="766.4" font-size="13" fill="#dde5ef" text-anchor="middle">developer</text>
<text class="s" x="400.0" y="784.4" font-size="13" fill="#dde5ef" text-anchor="middle">platform</text>
<rect x="708" y="264" width="208" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="812.0" y="290.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">k3s nodes</text>
<text class="s" x="812.0" y="310.4" font-size="13" fill="#dde5ef" text-anchor="middle">servers and</text>
<text class="s" x="812.0" y="328.4" font-size="13" fill="#dde5ef" text-anchor="middle">workers</text>
<rect x="708" y="416" width="208" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="812.0" y="442.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Addons</text>
<text class="s" x="812.0" y="462.4" font-size="13" fill="#dde5ef" text-anchor="middle">network, mesh,</text>
<text class="s" x="812.0" y="480.4" font-size="13" fill="#dde5ef" text-anchor="middle">policy, telemetry</text>
<rect x="708" y="568" width="208" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="812.0" y="594.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="812.0" y="614.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s</text>
<text class="s" x="812.0" y="632.4" font-size="13" fill="#dde5ef" text-anchor="middle">agent</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Cluster lifecycle · add, upgrade, remove = edit one file</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">One fleet file in Git becomes a running cluster with its addons and its OpenChoreo agent; deleting the file removes all of it.</text>
<circle cx="124.0" cy="232.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="124.0" y="236.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="237.6" cy="304.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="237.6" y="308.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="644.0" cy="304.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="644.0" y="308.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="644.0" cy="456.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="644.0" y="460.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<rect x="512.4" y="582.0" width="99.1" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="562.0" y="596.0" font-size="13" fill="#aab6c8" text-anchor="middle">via Cluster API</text>
<circle cx="644.0" cy="608.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="644.0" y="612.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="614.3" y="778.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="644.0" y="792.0" font-size="13" fill="#aab6c8" text-anchor="middle">dials out</text>
<circle cx="644.0" cy="760.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="644.0" y="764.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<line x1="28" y1="846" x2="932" y2="846" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="869.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="874" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="874.0" font-size="13.5" fill="#dde5ef">Argo CD reads the fleet file clusters/&lt;name&gt;.yaml</text>
<circle cx="40" cy="897.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="902" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="902.0" font-size="13.5" fill="#dde5ef">Argo CD renders the cluster chart and hands the cluster to Cluster API, with the agent&#x27;s certificate request and its OpenChoreo data</text>
<text class="s" x="62.0" y="921.0" font-size="13.5" fill="#dde5ef">plane</text>
<circle cx="40" cy="944.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="949" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="949.0" font-size="13.5" fill="#dde5ef">Cluster API creates the machines and installs k3s</text>
<circle cx="40" cy="972.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="977" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="977.0" font-size="13.5" fill="#dde5ef">Argo CD installs every addon whose labels match, as soon as the cluster&#x27;s access secret exists</text>
<circle cx="40" cy="1000.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1005" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="1005.0" font-size="13.5" fill="#dde5ef">cert-manager issues the agent&#x27;s certificate from this cluster&#x27;s own CA; Cluster API copies it into the cluster</text>
<circle cx="40" cy="1028.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1033" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="1033.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out to OpenChoreo, which accepts only this cluster&#x27;s CA</text>
<text class="s" x="28.0" y="1065.0" font-size="13.5" fill="#aab6c8">Upgrade: bump kubernetesVersion in the fleet file; Cluster API replaces the nodes one at a time. Remove: delete the file; Argo CD prunes,</text>
<text class="s" x="28.0" y="1084.0" font-size="13.5" fill="#aab6c8">Cluster API deletes the cluster and its CA goes with it.</text>
<rect x="28" y="1120" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1130.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1120" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1130.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="28" y="1146" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="58.0" y="1156.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 202.7147 1152 L 246.7147 1152" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="218.7147" cy="1152" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="218.7147" y="1156.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="256.7" y="1156.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
</svg>
