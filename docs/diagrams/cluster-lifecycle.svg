<rect x="32" y="88" width="232" height="52" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="148.0" y="109.6" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">fleet file</text>
<text class="m" x="148.0" y="129.1" font-size="13" fill="#cbd5e1" text-anchor="middle">clusters/&lt;name&gt;.yaml</text>
<rect x="32" y="232" width="192" height="368" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="128.0" y="367.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="128.0" y="387.4" font-size="13" fill="#cbd5e1" text-anchor="middle">ApplicationSet fleet</text>
<text class="s" x="128.0" y="404.9" font-size="13" fill="#cbd5e1" text-anchor="middle">→ cluster-&lt;name&gt;</text>
<text class="s" x="128.0" y="422.4" font-size="13" fill="#cbd5e1" text-anchor="middle"></text>
<text class="s" x="128.0" y="439.9" font-size="13" fill="#cbd5e1" text-anchor="middle">renders charts/cluster:</text>
<text class="s" x="128.0" y="457.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Cluster, ExternalSecrets,</text>
<text class="s" x="128.0" y="474.9" font-size="13" fill="#cbd5e1" text-anchor="middle">agent PKI, CRS</text>
<rect x="288" y="232" width="152" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="364.0" y="258.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="364.0" y="278.4" font-size="13" fill="#cbd5e1" text-anchor="middle">ClusterClass</text>
<text class="s" x="364.0" y="295.9" font-size="13" fill="#cbd5e1" text-anchor="middle">k3s-&lt;provider&gt;</text>
<rect x="752" y="232" width="168" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="836.0" y="258.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">k3s nodes</text>
<text class="s" x="836.0" y="278.4" font-size="13" fill="#cbd5e1" text-anchor="middle">control plane</text>
<text class="s" x="836.0" y="295.9" font-size="13" fill="#cbd5e1" text-anchor="middle">+ workers</text>
<rect x="288" y="376" width="152" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="364.0" y="402.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster secret</text>
<text class="s" x="364.0" y="422.4" font-size="13" fill="#cbd5e1" text-anchor="middle">ESO: kubeconfig</text>
<text class="s" x="364.0" y="439.9" font-size="13" fill="#cbd5e1" text-anchor="middle">+ fleet labels</text>
<rect x="504" y="376" width="152" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="580.0" y="402.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">addon AppSets</text>
<text class="s" x="580.0" y="422.4" font-size="13" fill="#cbd5e1" text-anchor="middle">select clusters</text>
<text class="s" x="580.0" y="439.9" font-size="13" fill="#cbd5e1" text-anchor="middle">by label</text>
<rect x="752" y="376" width="168" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="836.0" y="402.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">addons</text>
<text class="s" x="836.0" y="422.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Cilium, Istio,</text>
<text class="s" x="836.0" y="439.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Kyverno, ESO, …</text>
<rect x="288" y="520" width="152" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="364.0" y="546.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">agent identity</text>
<text class="s" x="364.0" y="566.4" font-size="13" fill="#cbd5e1" text-anchor="middle">own CA on mgmt</text>
<text class="s" x="364.0" y="583.9" font-size="13" fill="#cbd5e1" text-anchor="middle">cert CN=&lt;name&gt;</text>
<rect x="504" y="520" width="152" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="580.0" y="546.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">ClusterDataPlane</text>
<text class="s" x="580.0" y="566.4" font-size="13" fill="#cbd5e1" text-anchor="middle">+ Environments</text>
<text class="s" x="580.0" y="583.9" font-size="13" fill="#cbd5e1" text-anchor="middle">trusts that CA</text>
<rect x="752" y="520" width="168" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="836.0" y="546.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="836.0" y="566.4" font-size="13" fill="#cbd5e1" text-anchor="middle">OpenChoreo</text>
<text class="s" x="836.0" y="583.9" font-size="13" fill="#cbd5e1" text-anchor="middle">data plane</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Cluster lifecycle · add, upgrade, remove = edit one file</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">A fleet file becomes a CAPI cluster, an Argo CD cluster secret and an OpenChoreo data plane; deleting it removes all three.</text>
<circle cx="51.0" cy="107.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="51.0" y="111.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<circle cx="307.0" cy="251.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="307.0" y="255.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<circle cx="182.0" cy="162.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="182.0" y="166.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="251.0" cy="272.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="251.0" y="276.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="704.0" cy="272.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="704.0" y="276.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="364.0" cy="339.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="364.0" y="343.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="467.0" cy="416.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="467.0" y="420.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="704.0" cy="416.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="704.0" y="420.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="580.0" cy="616.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="580.0" y="620.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="704.0" cy="560.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="704.0" y="564.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="652" x2="932" y2="652" stroke="#64748b" stroke-width="1.5"/>
<circle cx="40.0" cy="669.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="674" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="674.0" font-size="13.5" fill="#cbd5e1">Add clusters/&lt;name&gt;.yaml: ApplicationSet fleet creates</text>
<text class="s" x="60.0" y="693.0" font-size="13.5" fill="#cbd5e1">Application cluster-&lt;name&gt;</text>
<circle cx="40.0" cy="716.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="721" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="721.0" font-size="13.5" fill="#cbd5e1">charts/cluster renders the CAPI Cluster, its ExternalSecrets and</text>
<text class="s" x="60.0" y="740.0" font-size="13.5" fill="#cbd5e1">the agent PKI on mgmt</text>
<circle cx="40.0" cy="763.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="768" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="768.0" font-size="13.5" fill="#cbd5e1">Cluster API creates the machines and installs k3s</text>
<circle cx="40.0" cy="791.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="796" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="796.0" font-size="13.5" fill="#cbd5e1">ESO turns CAPI&#x27;s kubeconfig into an Argo CD cluster secret</text>
<text class="s" x="60.0" y="815.0" font-size="13.5" fill="#cbd5e1">with the fleet labels</text>
<circle cx="40.0" cy="838.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="843" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="60.0" y="843.0" font-size="13.5" fill="#cbd5e1">Addon ApplicationSets select the cluster by label; Argo CD</text>
<text class="s" x="60.0" y="862.0" font-size="13.5" fill="#cbd5e1">pushes the addons</text>
<circle cx="506.0" cy="669.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="674" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="674.0" font-size="13.5" fill="#cbd5e1">A ClusterResourceSet delivers the agent&#x27;s cert; the CA key</text>
<text class="s" x="526.0" y="693.0" font-size="13.5" fill="#cbd5e1">never leaves mgmt</text>
<circle cx="506.0" cy="716.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="721" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="721.0" font-size="13.5" fill="#cbd5e1">The cluster-agent dials out; the gateway accepts only that</text>
<text class="s" x="526.0" y="740.0" font-size="13.5" fill="#cbd5e1">cluster&#x27;s CA</text>
<circle cx="506.0" cy="763.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="768" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="768.0" font-size="13.5" fill="#cbd5e1">Upgrade: bump kubernetesVersion in the fleet file; CAPI</text>
<text class="s" x="526.0" y="787.0" font-size="13.5" fill="#cbd5e1">replaces nodes one at a time</text>
<circle cx="506.0" cy="810.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="815" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<text class="s" x="526.0" y="815.0" font-size="13.5" fill="#cbd5e1">Remove: delete the file; Argo CD prunes, CAPI deletes the</text>
<text class="s" x="526.0" y="834.0" font-size="13.5" fill="#cbd5e1">cluster, its CA goes with it</text>
<rect x="28" y="906" width="20" height="13" rx="3" fill="#173e45" stroke="#2dd4bf" stroke-width="1.3"/>
<text class="s" x="58.0" y="916.0" font-size="13" fill="#94a3b8">mgmt cluster</text>
<rect x="162.86294" y="906" width="20" height="13" rx="3" fill="#193951" stroke="#38bdf8" stroke-width="1.3"/>
<text class="s" x="192.9" y="916.0" font-size="13" fill="#94a3b8">workload cluster</text>
<rect x="318.40966000000003" y="906" width="20" height="13" rx="3" fill="#402a3a" stroke="#fb7185" stroke-width="1.3"/>
<text class="s" x="348.4" y="916.0" font-size="13" fill="#94a3b8">security &amp; trust</text>
<rect x="465.5368" y="906" width="20" height="13" rx="3" fill="#2b3444" stroke="#94a3b8" stroke-width="1.3"/>
<text class="s" x="495.5" y="916.0" font-size="13" fill="#94a3b8">git, GitHub, outside</text>
<path d="M 636.72192 912 L 658.72192 912" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 636.72192 912 L 658.72192 912" stroke="#fde5a7" style="animation-delay:0s,0.00s"/>
<text class="s" x="668.7" y="916.0" font-size="13" fill="#94a3b8">numbered flow (animated)</text>
<path d="M 26 936 L 48 936" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah64748b)"/>
<text class="s" x="58.0" y="940.0" font-size="13" fill="#94a3b8">rendered by Argo CD</text>
<rect x="212.19344" y="928" width="24" height="17" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<text class="s" x="244.2" y="940.0" font-size="13" fill="#94a3b8">cluster / zone</text>
</svg>
