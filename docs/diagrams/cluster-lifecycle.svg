<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1182" viewBox="0 0 960 1182" role="img" aria-label="Cluster lifecycle · add, upgrade, remove = edit one file"><title>Cluster lifecycle · add, upgrade, remove = edit one file</title><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.fx{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:4 10;opacity:0;animation:fxdash .9s linear infinite,fxseq 9.10s linear infinite both}@keyframes fxdash{to{stroke-dashoffset:-14}}@keyframes fxseq{0%{opacity:0}3%{opacity:1}29.0%{opacity:1}34.0%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.fx{animation:none;opacity:0}}</style><defs><marker id="ahfbbf24" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5 L0,10 z" fill="#fbbf24"/></marker><marker id="asfbbf24" markerWidth="13" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M13,0 L0,5 L13,10 z" fill="#fbbf24"/></marker></defs><rect width="960" height="1182" rx="16" fill="#0b1120"/><rect x="8" y="8" width="944" height="1166" rx="12" fill="none" stroke="#8b9ab0" stroke-opacity=".8"/>
<rect x="28" y="200" width="568" height="624" rx="14" fill="#0e212d" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="580.0" y="224.0" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="end" letter-spacing="1.0">MANAGEMENT CLUSTER</text>
<rect x="692" y="200" width="240" height="624" rx="14" fill="#0f1f31" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="916.0" y="224.0" font-size="13" fill="#38bdf8" font-weight="700" text-anchor="end" letter-spacing="1.0">NEW CLUSTER</text>
<path d="M 124.0 264.0 L 124.0 160.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
