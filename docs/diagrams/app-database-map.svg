<rect x="44" y="188" width="166" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="127.0" y="214.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Component</text>
<text class="s" x="127.0" y="234.4" font-size="13" fill="#dde5ef" text-anchor="middle">the service and</text>
<text class="s" x="127.0" y="252.4" font-size="13" fill="#dde5ef" text-anchor="middle">its scaling trait</text>
<rect x="279" y="188" width="166" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="362.0" y="214.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Workload</text>
<text class="s" x="362.0" y="234.4" font-size="13" fill="#dde5ef" text-anchor="middle">image, env from the</text>
<text class="s" x="362.0" y="252.4" font-size="13" fill="#dde5ef" text-anchor="middle">database</text>
<rect x="514" y="188" width="166" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="597.0" y="214.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Database resource</text>
<text class="s" x="597.0" y="234.4" font-size="13" fill="#dde5ef" text-anchor="middle">type postgresql:</text>
<text class="s" x="597.0" y="252.4" font-size="13" fill="#dde5ef" text-anchor="middle">version, database</text>
<rect x="749" y="188" width="166" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="832.0" y="214.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Secret reference</text>
<text class="s" x="832.0" y="234.4" font-size="13" fill="#dde5ef" text-anchor="middle">points at a value</text>
<text class="s" x="832.0" y="252.4" font-size="13" fill="#dde5ef" text-anchor="middle">in OpenBao</text>
<rect x="44" y="428" width="636" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="362.0" y="454.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenChoreo</text>
<text class="s" x="362.0" y="474.4" font-size="13" fill="#dde5ef" text-anchor="middle">control plane: renders every object</text>
<text class="s" x="362.0" y="492.4" font-size="13" fill="#dde5ef" text-anchor="middle">into the cell namespace</text>
<rect x="749" y="428" width="166" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="832.0" y="454.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="832.0" y="474.4" font-size="13" fill="#dde5ef" text-anchor="middle">the project&#x27;s</text>
<text class="s" x="832.0" y="492.4" font-size="13" fill="#dde5ef" text-anchor="middle">secret values</text>
<rect x="851.9" y="403" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="883.4" y="416.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="44" y="636" width="166" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="127.0" y="662.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">PostgreSQL claim</text>
<text class="s" x="127.0" y="682.4" font-size="13" fill="#dde5ef" text-anchor="middle">the platform&#x27;s</text>
<text class="s" x="127.0" y="700.4" font-size="13" fill="#dde5ef" text-anchor="middle">database API</text>
<rect x="279" y="636" width="166" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="362.0" y="662.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Crossplane</text>
<text class="s" x="362.0" y="682.4" font-size="13" fill="#dde5ef" text-anchor="middle">composes it for</text>
<text class="s" x="362.0" y="700.4" font-size="13" fill="#dde5ef" text-anchor="middle">this cluster</text>
<rect x="381.9" y="611" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="413.4" y="624.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="514" y="636" width="166" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="597.0" y="662.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">CloudNativePG</text>
<text class="s" x="597.0" y="682.4" font-size="13" fill="#dde5ef" text-anchor="middle">runs PostgreSQL</text>
<text class="s" x="597.0" y="700.4" font-size="13" fill="#dde5ef" text-anchor="middle">in the cluster</text>
<rect x="616.9" y="611" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="648.4" y="624.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="749" y="636" width="166" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="832.0" y="662.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App secret</text>
<text class="s" x="832.0" y="682.4" font-size="13" fill="#dde5ef" text-anchor="middle">values copied</text>
<text class="s" x="832.0" y="700.4" font-size="13" fill="#dde5ef" text-anchor="middle">from OpenBao</text>
<rect x="514" y="796" width="166" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="597.0" y="822.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Connection secret</text>
<text class="s" x="597.0" y="842.4" font-size="13" fill="#dde5ef" text-anchor="middle">host, user,</text>
<text class="s" x="597.0" y="860.4" font-size="13" fill="#dde5ef" text-anchor="middle">password</text>
<rect x="749" y="796" width="166" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="832.0" y="822.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App pods</text>
<text class="s" x="832.0" y="842.4" font-size="13" fill="#dde5ef" text-anchor="middle">env from both</text>
<text class="s" x="832.0" y="860.4" font-size="13" fill="#dde5ef" text-anchor="middle">secrets</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">App + database · how the objects map</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A developer writes four objects in the app repo; OpenChoreo renders them into the app&#x27;s cell namespace, Crossplane turns the database</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">claim into a real database and the secrets meet in the pods.</text>
<circle cx="127.0" cy="314.0" r="3.6" fill="#fbbf24"/>
<circle cx="362.0" cy="314.0" r="3.6" fill="#fbbf24"/>
<circle cx="597.0" cy="314.0" r="3.6" fill="#fbbf24"/>
<circle cx="832.0" cy="314.0" r="3.6" fill="#fbbf24"/>
<circle cx="402.0" cy="346.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="402.0" y="350.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="402.0" cy="314.0" r="3.6" fill="#fbbf24"/>
<circle cx="127.0" cy="556.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="127.0" y="560.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="724.0" cy="556.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="724.0" y="560.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="240.0" cy="676.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="240.0" y="680.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="475.0" cy="676.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="475.0" y="680.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="597.0" cy="756.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="597.0" y="760.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="832.0" cy="756.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="832.0" y="760.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="710.0" cy="836.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="840.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="922" x2="932" y2="922" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="945.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="950" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="950.0" font-size="13.5" fill="#dde5ef">Component (with the keda-scaler trait), Workload, Resource of type postgresql and SecretReference are synced from the app repo by</text>
<text class="s" x="62.0" y="969.0" font-size="13.5" fill="#dde5ef">Argo CD into OpenChoreo</text>
<circle cx="40" cy="992.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="997" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="997.0" font-size="13.5" fill="#dde5ef">OpenChoreo renders the Resource into the cell namespace as a PostgreSQL claim (platform.koorikla.io, a namespaced Crossplane XR)</text>
<circle cx="40" cy="1020.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1025" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="1025.0" font-size="13.5" fill="#dde5ef">OpenBao&#x27;s value behind the SecretReference lands in the app secret: External Secrets reads the project&#x27;s own mount through the cell&#x27;s</text>
<text class="s" x="62.0" y="1044.0" font-size="13.5" fill="#dde5ef">SecretStore</text>
<circle cx="40" cy="1067.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1072" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="1072.0" font-size="13.5" fill="#dde5ef">PostgreSQL claim is composed by Crossplane with the Composition of the Configuration package; the EnvironmentConfig</text>
<text class="s" x="62.0" y="1091.0" font-size="13.5" fill="#dde5ef">platform-postgresql picks the backend</text>
<circle cx="40" cy="1114.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1119" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="1119.0" font-size="13.5" fill="#dde5ef">Crossplane creates a CloudNativePG Cluster on a local cluster (RDS or Aurora, Cloud SQL, Azure Flexible Server in the cloud)</text>
<circle cx="40" cy="1142.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1147" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="1147.0" font-size="13.5" fill="#dde5ef">CloudNativePG creates the database and its owner and writes the connection secret &lt;name&gt;-app next to the workload</text>
<circle cx="40" cy="1170.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1175" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="1175.0" font-size="13.5" fill="#dde5ef">App secret reaches the app pods as env, from secretKeyRef or envFrom</text>
<circle cx="40" cy="1198.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1203" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="1203.0" font-size="13.5" fill="#dde5ef">Connection secret reaches the app pods, which OpenChoreo deployed from the Workload: host, port and database as values, user,</text>
<text class="s" x="62.0" y="1222.0" font-size="13.5" fill="#dde5ef">password and URI as secret references; KEDA scales them</text>
<text class="s" x="28.0" y="1254.0" font-size="13.5" fill="#aab6c8">Planned: the same map for the event bus and its topics. Production asks for high availability and backups (admission policy); credentials never</text>
<text class="s" x="28.0" y="1273.0" font-size="13.5" fill="#aab6c8">leave the workload cluster.</text>
<rect x="28" y="1309" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1319.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1309" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1319.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="1309" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="1319.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 1341 L 70 1341" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="1341" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1345.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1345.0" font-size="13" fill="#aab6c8">numbered step: one object becomes the next</text>
<g><rect x="383.75158000000005" y="1332" width="28" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="4 2.5"/><rect x="419.75158000000005" y="1333" width="54.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2"/><text class="s" x="446.9" y="1345" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">OPT-IN</text></g>
<text class="s" x="483.8" y="1345.0" font-size="13" fill="#aab6c8">opt-in, off by default</text>
</svg>
