<path d="M 800.0 328.0 L 800.0 248.0" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 160.0 248.0 L 160.0 328.0" stroke="#fde5a7" style="animation-delay:0s,0.00s"/>
<path class="fx" d="M 160.0 408.0 L 160.0 488.0" stroke="#fde5a7" style="animation-delay:0s,1.10s"/>
<path class="fx" d="M 276.0 528.0 L 320.0 528.0 L 320.0 208.0 L 364.0 208.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
<path class="fx" d="M 480.0 248.0 L 480.0 328.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 596.0 368.0 L 684.0 368.0" stroke="#fde5a7" style="animation-delay:0s,4.40s"/>
<path class="fx" d="M 800.0 328.0 L 800.0 248.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<rect x="44" y="168" width="232" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="160.0" y="194.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Package source</text>
<text class="s" x="160.0" y="214.4" font-size="13" fill="#dde5ef" text-anchor="middle">an API, its composition</text>
<text class="s" x="160.0" y="232.4" font-size="13" fill="#dde5ef" text-anchor="middle">and render tests</text>
<rect x="44" y="328" width="232" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="160.0" y="354.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Package CI</text>
<text class="s" x="160.0" y="374.4" font-size="13" fill="#dde5ef" text-anchor="middle">validates, renders,</text>
<text class="s" x="160.0" y="392.4" font-size="13" fill="#dde5ef" text-anchor="middle">signs the package</text>
<rect x="44" y="488" width="232" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="160.0" y="514.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="160.0" y="534.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed package,</text>
<text class="s" x="160.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">addressed by digest</text>
<rect x="364" y="168" width="232" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="480.0" y="194.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Package pin</text>
<text class="s" x="480.0" y="214.4" font-size="13" fill="#dde5ef" text-anchor="middle">version and digest</text>
<text class="s" x="480.0" y="232.4" font-size="13" fill="#dde5ef" text-anchor="middle">in git</text>
<rect x="364" y="328" width="232" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="354.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="480.0" y="374.4" font-size="13" fill="#dde5ef" text-anchor="middle">syncs the pin to</text>
<text class="s" x="480.0" y="392.4" font-size="13" fill="#dde5ef" text-anchor="middle">each cluster</text>
<rect x="364" y="488" width="232" height="80" rx="8" fill="#263247" stroke="none" stroke-width="0"/>
<text class="s" x="480.0" y="514.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Other extensions</text>
<text class="s" x="480.0" y="534.4" font-size="13" fill="#dde5ef" text-anchor="middle">component types, traits:</text>
<text class="s" x="480.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">the infra lane</text>
<rect x="684" y="168" width="232" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="194.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Platform API</text>
<text class="s" x="800.0" y="214.4" font-size="13" fill="#dde5ef" text-anchor="middle">what apps claim,</text>
<text class="s" x="800.0" y="232.4" font-size="13" fill="#dde5ef" text-anchor="middle">e.g. a database</text>
<rect x="684" y="328" width="232" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="800.0" y="354.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Crossplane</text>
<text class="s" x="800.0" y="374.4" font-size="13" fill="#dde5ef" text-anchor="middle">installs packages,</text>
<text class="s" x="800.0" y="392.4" font-size="13" fill="#dde5ef" text-anchor="middle">composes claims</text>
<rect x="852.9" y="303" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="884.4" y="316.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<g opacity="0.55">
<rect x="684" y="488" width="232" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="800.0" y="533.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Signature check</text>
<rect x="834.1" y="463" width="81.9" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="875.1" y="476.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">PLANNED</text>
</g>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Extensions lane · a new platform API</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">A Crossplane package is built, signed and pushed like an app image; a pinned digest in git promotes it, and Crossplane installs the API</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">on every cluster that runs it.</text>
<text class="s" x="44.0" y="134.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">BUILD AND SIGN</text>
<text class="s" x="364.0" y="134.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">DECLARE AND SYNC</text>
<text class="s" x="684.0" y="134.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">RUN AND ADMIT</text>
<circle cx="160.0" cy="288.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="160.0" y="292.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="160.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="160.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="320.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="320.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="480.0" cy="288.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="292.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="630.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="630.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="800.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="800.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="800.0" cy="288.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="800.0" y="292.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="590" x2="932" y2="590" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="613.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="618" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="618.0" font-size="13.5" fill="#dde5ef">A pull request to packages/&lt;api&gt; runs package-&lt;api&gt;.yaml, which calls app-crossplane-configuration.yaml: schema checks and render</text>
<text class="s" x="62.0" y="637.0" font-size="13.5" fill="#dde5ef">tests for every backend</text>
<circle cx="40" cy="660.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="665" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="665.0" font-size="13.5" fill="#dde5ef">Package CI pushes the Configuration package and its embedded function to ghcr.io on main and on release tags, signed keyless with</text>
<text class="s" x="62.0" y="684.0" font-size="13.5" fill="#dde5ef">cosign, with SLSA provenance</text>
<circle cx="40" cy="707.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="712" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="712.0" font-size="13.5" fill="#dde5ef">Registry tag and digest are pinned in addon crossplane&#x27;s values (or one installation&#x27;s) by a Renovate pull request; merging it is the</text>
<text class="s" x="62.0" y="731.0" font-size="13.5" fill="#dde5ef">promotion</text>
<circle cx="40" cy="754.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="759" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="759.0" font-size="13.5" fill="#dde5ef">Package pin on main is synced by Argo CD to every cluster that runs addon crossplane (opt-in)</text>
<circle cx="40" cy="782.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="787" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="787.0" font-size="13.5" fill="#dde5ef">Argo CD applies the Configuration at that digest; Crossplane&#x27;s package manager pulls it and its function from the registry</text>
<circle cx="40" cy="810.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="815" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="815.0" font-size="13.5" fill="#dde5ef">Crossplane will verify the package signature before installing it: the switch is on main but stays off until Crossplane reads cosign v3</text>
<text class="s" x="62.0" y="834.0" font-size="13.5" fill="#dde5ef">signatures</text>
<circle cx="40" cy="857.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="862" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="862.0" font-size="13.5" fill="#dde5ef">Crossplane installs the API definition, its composition and function: apps can now claim the API, for example a PostgreSQL database</text>
<text class="s" x="28.0" y="894.0" font-size="13.5" fill="#aab6c8">The other extension points ride the other lanes: OpenChoreo component types, traits and resource types are files of the openchoreo-platform</text>
<text class="s" x="28.0" y="913.0" font-size="13.5" fill="#aab6c8">addon (infra lane), Backstage templates are read from git by the catalog, Backstage plugins come with its image.</text>
<rect x="28" y="949" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="959.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="949" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="959.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="949" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="959.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 981 L 70 981" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="981" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="985.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="985.0" font-size="13" fill="#aab6c8">numbered step: the change moves along the arrow</text>
<rect x="418.97326000000004" y="975" width="20" height="13" rx="3" fill="#263247"/>
<text class="s" x="449.0" y="985.0" font-size="13" fill="#aab6c8">context, not a step</text>
<g><rect x="589.58342" y="972" width="28" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="4 2.5"/><rect x="625.58342" y="973" width="54.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2"/><text class="s" x="652.7" y="985" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">OPT-IN</text></g>
<text class="s" x="689.6" y="985.0" font-size="13" fill="#aab6c8">opt-in, off by default</text>
<g opacity="0.55"><rect x="28" y="998" width="28" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="4 2.5"/><rect x="64" y="999" width="71.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2"/><text class="s" x="99.7" y="1011" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">PLANNED</text></g>
<text class="s" x="142.0" y="1011.0" font-size="13" fill="#aab6c8">planned, not on main</text>
</svg>
