<rect x="44" y="120" width="158" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="123.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App repo</text>
<text class="s" x="123.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">your code and</text>
<text class="s" x="123.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploy/ folder</text>
<rect x="282" y="120" width="396" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="480.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo workflow plane (or GitHub Actions)</text>
<text class="s" x="480.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">scan, inventory, signature</text>
<rect x="758" y="120" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="837.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="837.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed</text>
<text class="s" x="837.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="44" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="123.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="123.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">syncs the</text>
<text class="s" x="123.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploy/ folder</text>
<rect x="282" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="361.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Release</text>
<text class="s" x="361.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">immutable</text>
<text class="s" x="361.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">snapshot</text>
<rect x="520" y="280" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Development</text>
<text class="s" x="599.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploys</text>
<text class="s" x="599.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">automatically</text>
<rect x="758" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="837.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Promotion gate</text>
<text class="s" x="837.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">checks health,</text>
<text class="s" x="837.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">opens the PR</text>
<rect x="282" y="456" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="361.0" y="482.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Staging</text>
<text class="s" x="361.0" y="502.4" font-size="13" fill="#dde5ef" text-anchor="middle">promoted</text>
<text class="s" x="361.0" y="520.4" font-size="13" fill="#dde5ef" text-anchor="middle">by PR</text>
<rect x="520" y="456" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="622.0" y="482.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Production</text>
<text class="s" x="622.0" y="502.4" font-size="13" fill="#dde5ef" text-anchor="middle">code owners,</text>
<text class="s" x="622.0" y="520.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed images</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">SDLC · from git push to production</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">One signed image, promoted through environments by pull requests; production is gated twice, at promotion and at admission.</text>
<circle cx="546.0" cy="496.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="546.0" y="500.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<circle cx="234.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="234.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="710.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="123.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="234.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="234.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="472.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="472.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="710.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="599.0" cy="408.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="599.0" y="412.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="472.0" cy="496.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="472.0" y="500.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="558" x2="932" y2="558" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="581.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="586" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="586.0" font-size="13.5" fill="#dde5ef">A push to the app repo starts a build on the OpenChoreo workflow plane (or GitHub Actions)</text>
<circle cx="40" cy="609.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="614" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="614.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans the image (Trivy), writes SBOM and SLSA provenance, signs with cosign, pushes it to the registry and commits the</text>
<text class="s" x="62.0" y="633.0" font-size="13.5" fill="#dde5ef">new image ref to deploy/</text>
<circle cx="40" cy="656.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="661" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="661.0" font-size="13.5" fill="#dde5ef">The app repo&#x27;s deploy/ folder is synced by Argo CD</text>
<circle cx="40" cy="684.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="689" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="689.0" font-size="13.5" fill="#dde5ef">Argo CD applies it to OpenChoreo, which snapshots an immutable release (ComponentRelease)</text>
<circle cx="40" cy="712.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="717" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="717.0" font-size="13.5" fill="#dde5ef">The release deploys to development automatically</text>
<circle cx="40" cy="740.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="745" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="745.0" font-size="13.5" fill="#dde5ef">Development&#x27;s health (readiness, smoke tests, alerts, freezes) is checked by the promotion gate</text>
<circle cx="40" cy="768.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="773" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="773.0" font-size="13.5" fill="#dde5ef">The promotion gate opens the pull request that promotes the release to staging; Argo CD applies it once merged</text>
<circle cx="40" cy="796.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="801" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="801.0" font-size="13.5" fill="#dde5ef">Staging is promoted to production the same way, plus CODEOWNERS approval; only Argo CD may write production</text>
<circle cx="40" cy="824.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="829" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<text class="s" x="62.0" y="829.0" font-size="13.5" fill="#dde5ef">Production admits only signed images pinned by digest: Kyverno blocks the rest (in dev and staging it only warns)</text>
<rect x="28" y="869" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="879.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="869" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="879.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="869" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="879.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 688.6388 875 L 732.6388 875" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="704.6388" cy="875" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="704.6388" y="879.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="742.6" y="879.0" font-size="13" fill="#aab6c8">numbered step</text>
</svg>
