<text class="s" x="240.0" y="174.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="120.0" cy="232.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="120.0" y="236.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
