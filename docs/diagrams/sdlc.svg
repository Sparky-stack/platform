<text class="s" x="120.0" y="335.9" font-size="13" fill="#cbd5e1" text-anchor="middle">per app repo</text>
<rect x="280" y="272" width="160" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="360.0" y="298.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">release</text>
<text class="s" x="360.0" y="318.4" font-size="13" fill="#cbd5e1" text-anchor="middle">ComponentRelease:</text>
<text class="s" x="360.0" y="335.9" font-size="13" fill="#cbd5e1" text-anchor="middle">immutable snapshot</text>
<rect x="520" y="272" width="160" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="600.0" y="298.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">promotion gate</text>
<text class="s" x="600.0" y="318.4" font-size="13" fill="#cbd5e1" text-anchor="middle">checks each edge,</text>
<text class="s" x="600.0" y="335.9" font-size="13" fill="#cbd5e1" text-anchor="middle">opens the PR</text>
<rect x="760" y="272" width="160" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="1.5"/>
<text class="s" x="840.0" y="298.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">production gate</text>
<text class="s" x="840.0" y="318.4" font-size="13" fill="#cbd5e1" text-anchor="middle">VAP: only Argo CD</text>
<text class="s" x="840.0" y="335.9" font-size="13" fill="#cbd5e1" text-anchor="middle">writes production</text>
