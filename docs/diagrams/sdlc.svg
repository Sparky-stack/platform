<rect x="44" y="120" width="158" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="123.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App repo</text>
<text class="s" x="123.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">your code and</text>
<text class="s" x="123.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploy/ folder</text>
<rect x="282" y="120" width="396" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="155.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="480.0" y="175.4" font-size="13" fill="#dde5ef" text-anchor="middle">builds, scans and signs every image</text>
<rect x="758" y="120" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="837.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="837.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed</text>
<text class="s" x="837.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="44" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="123.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="123.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps</text>
<text class="s" x="123.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">engine</text>
<rect x="282" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="361.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Release</text>
<text class="s" x="361.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">immutable</text>
<text class="s" x="361.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">snapshot</text>
<rect x="520" y="280" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Development</text>
<text class="s" x="599.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">first</text>
<text class="s" x="599.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">environment</text>
<rect x="758" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="837.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Promotion gate</text>
<text class="s" x="837.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">health checks,</text>
<text class="s" x="837.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">pull requests</text>
<rect x="282" y="488" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="361.0" y="514.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Staging</text>
<text class="s" x="361.0" y="534.4" font-size="13" fill="#dde5ef" text-anchor="middle">second</text>
<text class="s" x="361.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">environment</text>
<rect x="520" y="488" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="514.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Production</text>
<text class="s" x="599.0" y="534.4" font-size="13" fill="#dde5ef" text-anchor="middle">gated</text>
<text class="s" x="599.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">twice</text>
<rect x="758" y="488" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="860.0" y="523.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Admission</text>
<text class="s" x="860.0" y="543.4" font-size="13" fill="#dde5ef" text-anchor="middle">Kyverno</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">SDLC · from git push to production</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">One signed image, promoted through environments by pull requests; production is gated twice, at promotion and at admission.</text>
<circle cx="784.0" cy="528.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="784.0" y="532.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<circle cx="234.0" cy="144.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="234.0" y="148.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="710.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="123.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="234.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="234.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="472.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="472.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="726.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="726.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="480.0" cy="400.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="404.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="702.0" cy="440.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="702.0" y="444.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="590" x2="932" y2="590" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="613.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="618" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="618.0" font-size="13.5" fill="#dde5ef">A push to the app repo starts a build on the OpenChoreo workflow plane, or GitHub Actions</text>
<circle cx="40" cy="641.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="646" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="646.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans and signs the image and pushes it to the registry (it also commits the new version to deploy/)</text>
<circle cx="40" cy="669.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="674" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="674.0" font-size="13.5" fill="#dde5ef">Argo CD reads the deploy/ folder of the app repo</text>
<circle cx="40" cy="697.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="702" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="702.0" font-size="13.5" fill="#dde5ef">Argo CD applies it to OpenChoreo, which snapshots an immutable release</text>
<circle cx="40" cy="725.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="730" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="730.0" font-size="13.5" fill="#dde5ef">The release deploys to development automatically</text>
<circle cx="40" cy="753.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="758" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="758.0" font-size="13.5" fill="#dde5ef">The promotion gate checks development: readiness, smoke tests, alerts, change freezes</text>
<circle cx="40" cy="781.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="786" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="786.0" font-size="13.5" fill="#dde5ef">The promotion gate opens the pull request that promotes the release to staging; Argo CD applies it</text>
<circle cx="40" cy="809.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="814" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="814.0" font-size="13.5" fill="#dde5ef">The promotion gate opens the production pull request only after staging, with code-owner approval</text>
<circle cx="40" cy="837.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="842" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<text class="s" x="62.0" y="842.0" font-size="13.5" fill="#dde5ef">Kyverno admits into production only images signed in the registry and pinned by digest</text>
<rect x="28" y="882" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="892.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="882" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="892.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="882" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="892.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 914 L 70 914" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="914" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="918.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="918.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="422.3199" y="904" width="26" height="20" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="432.3199" cy="914" r="7" fill="#fbbf24"/><text class="s" x="432.3199" y="918.2" font-size="11" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="454.3" y="918.0" font-size="13" fill="#aab6c8">step at a component</text>
<path d="M 605.18048 914 L 627.18048 914" stroke="#8b9ab0" stroke-width="1.6" marker-end="url(#ah8b9ab0)"/>
<text class="s" x="637.2" y="918.0" font-size="13" fill="#aab6c8">commits the new version; admits</text>
</svg>
