<text class="s" x="600.0" y="495.9" font-size="13" fill="#cbd5e1" text-anchor="middle">+ CODEOWNERS</text>
<rect x="756" y="428" width="168" height="88" rx="11" fill="none" stroke="#fb7185" stroke-opacity=".85" stroke-width="1.4"/>
<rect x="760" y="432" width="160" height="80" rx="8" fill="#402a3a" stroke="#fb7185" stroke-width="2.2"/>
<text class="s" x="840.0" y="458.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="840.0" y="478.4" font-size="13" fill="#cbd5e1" text-anchor="middle">denies unsigned or</text>
<text class="s" x="840.0" y="495.9" font-size="13" fill="#cbd5e1" text-anchor="middle">unpinned images</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">SDLC · from git push to production</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">One signed image, promoted through environments by pull requests; production is gated twice, at promotion and at admission.</text>
