<text class="s" x="840.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">Harbor · GHCR</text>
<text class="s" x="840.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">signed image</text>
<rect x="40" y="272" width="160" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
