<text class="s" x="718.0" y="476.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<line x1="28" y1="532" x2="932" y2="532" stroke="#8b9ab0" stroke-width="1.5"/>
<circle cx="40.0" cy="555.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="560" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="560.0" font-size="13.5" fill="#cbd5e1">A push to main starts a build on the OpenChoreo workflow</text>
<text class="s" x="60.0" y="579.0" font-size="13.5" fill="#cbd5e1">plane (or GitHub Actions)</text>
<circle cx="506.0" cy="555.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="560" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="560.0" font-size="13.5" fill="#cbd5e1">autoDeploy binds the release to development</text>
<circle cx="40.0" cy="603.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="608" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="608.0" font-size="13.5" fill="#cbd5e1">The build scans, writes SBOM + SLSA provenance, signs with</text>
<text class="s" x="60.0" y="627.0" font-size="13.5" fill="#cbd5e1">cosign and pushes</text>
<circle cx="506.0" cy="603.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="608" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="608.0" font-size="13.5" fill="#cbd5e1">The promotion gate checks the edge (readiness, smoke, alerts,</text>
<text class="s" x="526.0" y="627.0" font-size="13.5" fill="#cbd5e1">freezes) and opens a PR for staging</text>
<circle cx="40.0" cy="651.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="656" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="656.0" font-size="13.5" fill="#cbd5e1">It commits the new image ref to deploy/ in the app repo</text>
<circle cx="506.0" cy="651.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="656" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="656.0" font-size="13.5" fill="#cbd5e1">Production needs the gate and CODEOWNERS; a</text>
<text class="s" x="526.0" y="675.0" font-size="13.5" fill="#cbd5e1">ValidatingAdmissionPolicy lets only Argo CD write it</text>
<circle cx="40.0" cy="699.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="704" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="704.0" font-size="13.5" fill="#cbd5e1">Argo CD syncs the app&#x27;s Component and Workload into</text>
<text class="s" x="60.0" y="723.0" font-size="13.5" fill="#cbd5e1">OpenChoreo</text>
<circle cx="506.0" cy="699.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="704" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<text class="s" x="526.0" y="704.0" font-size="13.5" fill="#cbd5e1">On prod1 Kyverno denies unsigned or unpinned images</text>
<circle cx="40.0" cy="747.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="752" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="60.0" y="752.0" font-size="13.5" fill="#cbd5e1">OpenChoreo snapshots them as an immutable</text>
<text class="s" x="60.0" y="771.0" font-size="13.5" fill="#cbd5e1">ComponentRelease</text>
