<text class="s" x="123.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">your code and</text>
<text class="s" x="123.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploy/ folder</text>
<rect x="282" y="120" width="396" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="480.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo workflow plane (or GitHub Actions)</text>
<text class="s" x="480.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">scan, inventory, signature</text>
<rect x="758" y="120" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="837.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="837.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed</text>
<text class="s" x="837.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="44" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="123.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="123.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps</text>
<text class="s" x="123.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">engine</text>
<rect x="282" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="361.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Release</text>
<text class="s" x="361.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">immutable</text>
<text class="s" x="361.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">snapshot</text>
<rect x="520" y="280" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Development</text>
<text class="s" x="599.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">first</text>
<text class="s" x="599.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">environment</text>
<rect x="758" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="837.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Promotion gate</text>
<text class="s" x="837.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">health checks,</text>
<text class="s" x="837.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">pull requests</text>
<rect x="282" y="464" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="361.0" y="490.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Staging</text>
<text class="s" x="361.0" y="510.4" font-size="13" fill="#dde5ef" text-anchor="middle">second</text>
<text class="s" x="361.0" y="528.4" font-size="13" fill="#dde5ef" text-anchor="middle">environment</text>
<rect x="520" y="464" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="622.0" y="490.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Production</text>
<text class="s" x="622.0" y="510.4" font-size="13" fill="#dde5ef" text-anchor="middle">admission</text>
<text class="s" x="622.0" y="528.4" font-size="13" fill="#dde5ef" text-anchor="middle">checked</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">SDLC · from git push to production</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">One signed image, promoted through environments by pull requests; production is gated twice, at promotion and at admission.</text>
<circle cx="546.0" cy="504.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="546.0" y="508.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<circle cx="234.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="234.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="710.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="123.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="234.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="234.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="472.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="472.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="726.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="726.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="837.0" cy="390.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="837.0" y="394.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="837.0" cy="416.0" r="3.6" fill="#fbbf24"/>
<circle cx="599.0" cy="416.0" r="3.6" fill="#fbbf24"/>
<line x1="28" y1="566" x2="932" y2="566" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="589.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="594" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="594.0" font-size="13.5" fill="#dde5ef">A push to the app repo starts a build on the OpenChoreo workflow plane, or GitHub Actions</text>
<circle cx="40" cy="617.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="622" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="622.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans and signs the image, pushes it to the registry and commits the new version to deploy/</text>
<circle cx="40" cy="645.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="650" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="650.0" font-size="13.5" fill="#dde5ef">Argo CD reads the deploy/ folder of the app repo</text>
<circle cx="40" cy="673.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="678" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="678.0" font-size="13.5" fill="#dde5ef">Argo CD applies it to OpenChoreo, which snapshots an immutable release</text>
<circle cx="40" cy="701.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="706" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="706.0" font-size="13.5" fill="#dde5ef">The release deploys to development automatically</text>
<circle cx="40" cy="729.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="734" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="734.0" font-size="13.5" fill="#dde5ef">The promotion gate checks development: readiness, smoke tests, alerts, change freezes</text>
<circle cx="40" cy="757.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="762" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="762.0" font-size="13.5" fill="#dde5ef">The promotion gate opens the pull requests that promote the release: staging first, production only with code-owner approval</text>
<circle cx="40" cy="785.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="790" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="790.0" font-size="13.5" fill="#dde5ef">Production admits only signed images pinned by digest: Kyverno blocks the rest</text>
<rect x="28" y="830" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="840.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="830" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="840.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="830" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="840.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 862 L 70 862" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="862" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="866.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="866.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="422.3199" y="853" width="24" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="429.3199" cy="862" r="4" fill="#fbbf24"/>
<text class="s" x="454.3" y="866.0" font-size="13" fill="#aab6c8">step at a component</text>
</svg>
