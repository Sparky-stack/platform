<rect x="44" y="120" width="148" height="100" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="118.0" y="156.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App repo</text>
<text class="s" x="118.0" y="176.4" font-size="13" fill="#dde5ef" text-anchor="middle">your code and</text>
<text class="s" x="118.0" y="194.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploy/ folder</text>
<rect x="272" y="120" width="376" height="100" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="460.0" y="165.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="460.0" y="185.4" font-size="13" fill="#dde5ef" text-anchor="middle">builds, scans and signs every image</text>
<rect x="728" y="120" width="188" height="100" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="822.0" y="156.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="822.0" y="176.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed</text>
<text class="s" x="822.0" y="194.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="44" y="300" width="148" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="118.0" y="326.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="118.0" y="346.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps</text>
<text class="s" x="118.0" y="364.4" font-size="13" fill="#dde5ef" text-anchor="middle">engine</text>
<rect x="272" y="300" width="148" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="346.0" y="326.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenChoreo</text>
<text class="s" x="346.0" y="346.4" font-size="13" fill="#dde5ef" text-anchor="middle">snapshots and</text>
<text class="s" x="346.0" y="364.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploys releases</text>
<rect x="500" y="300" width="148" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="574.0" y="326.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Development</text>
<text class="s" x="574.0" y="346.4" font-size="13" fill="#dde5ef" text-anchor="middle">first</text>
<text class="s" x="574.0" y="364.4" font-size="13" fill="#dde5ef" text-anchor="middle">environment</text>
<rect x="500" y="460" width="148" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="574.0" y="486.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Staging</text>
<text class="s" x="574.0" y="506.4" font-size="13" fill="#dde5ef" text-anchor="middle">second</text>
<text class="s" x="574.0" y="524.4" font-size="13" fill="#dde5ef" text-anchor="middle">environment</text>
<rect x="728" y="460" width="152" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="804.0" y="486.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Promotion gate</text>
<text class="s" x="804.0" y="506.4" font-size="13" fill="#dde5ef" text-anchor="middle">checks staging,</text>
<text class="s" x="804.0" y="524.4" font-size="13" fill="#dde5ef" text-anchor="middle">opens the PR</text>
<rect x="500" y="620" width="148" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="574.0" y="646.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Production</text>
<text class="s" x="574.0" y="666.4" font-size="13" fill="#dde5ef" text-anchor="middle">approved PR,</text>
<text class="s" x="574.0" y="684.4" font-size="13" fill="#dde5ef" text-anchor="middle">then admission</text>
<rect x="728" y="620" width="188" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="822.0" y="646.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Admission</text>
<text class="s" x="822.0" y="666.4" font-size="13" fill="#dde5ef" text-anchor="middle">admits only</text>
<text class="s" x="822.0" y="684.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed images</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">SDLC · from git push to production</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">One signed image: development deploys automatically, staging and production are promoted by pull requests in the app repo. Production</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">is gated twice, at promotion and at admission.</text>
<circle cx="232.0" cy="144.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="232.0" y="148.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="688.0" cy="170.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="688.0" y="174.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="232.0" cy="204.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="232.0" y="208.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="118.0" cy="260.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="118.0" y="264.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<rect x="189.7" y="358.0" width="84.6" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="232.0" y="372.0" font-size="13" fill="#aab6c8" text-anchor="middle">every merge</text>
<circle cx="232.0" cy="340.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="232.0" y="344.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="460.0" cy="340.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="460.0" y="344.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<rect x="390.0" y="418.0" width="173.8" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="394.0" y="432.0" font-size="13" fill="#aab6c8">after the team&#x27;s staging PR</text>
<circle cx="460.0" cy="500.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="460.0" y="504.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="688.0" cy="500.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="688.0" y="504.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<rect x="536.0" y="238.0" width="147.4" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="540.0" y="252.0" font-size="13" fill="#aab6c8">production pull request</text>
<circle cx="904.0" cy="488.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="904.0" y="492.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<rect x="330.0" y="670.0" width="142.8" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="334.0" y="684.0" font-size="13" fill="#aab6c8">after the approved PR</text>
<circle cx="320.0" cy="600.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="320.0" y="604.6" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">10</text>
<circle cx="688.0" cy="660.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="688.0" y="664.6" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">11</text>
<line x1="28" y1="722" x2="932" y2="722" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="745.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="750" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="750.0" font-size="13.5" fill="#dde5ef">A push to the app repo starts Build &amp; sign on OpenChoreo&#x27;s workflow plane on the management cluster</text>
<circle cx="40" cy="773.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="778" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="778.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans and signs the image and pushes it to the registry</text>
<circle cx="40" cy="801.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="806" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="806.0" font-size="13.5" fill="#dde5ef">Build &amp; sign commits the new image version to the deploy/ folder of the app repo</text>
<circle cx="40" cy="829.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="834" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="834.0" font-size="13.5" fill="#dde5ef">Argo CD reads the deploy/ folder of the app repo</text>
<circle cx="40" cy="857.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="862" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="862.0" font-size="13.5" fill="#dde5ef">Argo CD applies it, and every merged promotion pull request after it, to OpenChoreo, which snapshots an immutable release</text>
<circle cx="40" cy="885.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="890" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="890.0" font-size="13.5" fill="#dde5ef">OpenChoreo deploys the release to development automatically</text>
<circle cx="40" cy="913.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="918" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="918.0" font-size="13.5" fill="#dde5ef">OpenChoreo deploys it to staging once the team merges a staging pull request in the app repo</text>
<circle cx="40" cy="941.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="946" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="946.0" font-size="13.5" fill="#dde5ef">The promotion gate checks staging: readiness, smoke tests, alerts, error rate, change freezes</text>
<circle cx="40" cy="969.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="974" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<text class="s" x="62.0" y="974.0" font-size="13.5" fill="#dde5ef">The promotion gate opens the production pull request in the app repo only if every check passes</text>
<circle cx="40" cy="997.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1002" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">10</text>
<text class="s" x="62.0" y="1002.0" font-size="13.5" fill="#dde5ef">OpenChoreo submits it to production only after a code owner approves and merges that pull request</text>
<circle cx="40" cy="1025.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1030" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">11</text>
<text class="s" x="62.0" y="1030.0" font-size="13.5" fill="#dde5ef">Kyverno admits a pod into production, before it starts, only if its image is signed in the registry and pinned by digest</text>
<rect x="28" y="1070" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1080.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1070" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1080.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="28" y="1096" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="58.0" y="1106.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 202.7147 1102 L 246.7147 1102" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="218.7147" cy="1102" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="218.7147" y="1106.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="256.7" y="1106.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
</svg>
