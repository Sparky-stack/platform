<text class="s" x="840.0" y="603.9" font-size="13" fill="#cbd5e1" text-anchor="middle">unpinned images</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">SDLC · from git push to production</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">One signed image, promoted through environments by pull requests; production is gated twice, at promotion and at admission.</text>
