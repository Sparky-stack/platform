<line x1="28" y1="640" x2="932" y2="640" stroke="#64748b" stroke-width="1.5"/>
<circle cx="40.0" cy="657.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="662" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="662.0" font-size="13.5" fill="#cbd5e1">A push to main starts a build on the OpenChoreo workflow</text>
<text class="s" x="60.0" y="681.0" font-size="13.5" fill="#cbd5e1">plane (or GitHub Actions)</text>
<circle cx="40.0" cy="704.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="709" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="709.0" font-size="13.5" fill="#cbd5e1">The build scans, writes SBOM + SLSA provenance, signs with</text>
<text class="s" x="60.0" y="728.0" font-size="13.5" fill="#cbd5e1">cosign and pushes</text>
<circle cx="40.0" cy="751.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="756" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="756.0" font-size="13.5" fill="#cbd5e1">It commits the new image ref to deploy/ in the app repo</text>
<circle cx="40.0" cy="779.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="784" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="784.0" font-size="13.5" fill="#cbd5e1">Argo CD syncs the app&#x27;s Component and Workload into</text>
<text class="s" x="60.0" y="803.0" font-size="13.5" fill="#cbd5e1">OpenChoreo</text>
<circle cx="40.0" cy="826.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="831" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="60.0" y="831.0" font-size="13.5" fill="#cbd5e1">OpenChoreo snapshots them as an immutable</text>
<text class="s" x="60.0" y="850.0" font-size="13.5" fill="#cbd5e1">ComponentRelease</text>
<circle cx="506.0" cy="657.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="662" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="662.0" font-size="13.5" fill="#cbd5e1">autoDeploy binds the release to development</text>
<circle cx="506.0" cy="685.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="690" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="690.0" font-size="13.5" fill="#cbd5e1">The promotion gate checks the edge, then opens a PR for</text>
<text class="s" x="526.0" y="709.0" font-size="13.5" fill="#cbd5e1">staging</text>
<circle cx="506.0" cy="732.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="737" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="737.0" font-size="13.5" fill="#cbd5e1">Production needs the gate and CODEOWNERS; a</text>
<text class="s" x="526.0" y="756.0" font-size="13.5" fill="#cbd5e1">ValidatingAdmissionPolicy lets only Argo CD write it</text>
<circle cx="506.0" cy="779.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="784" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<text class="s" x="526.0" y="784.0" font-size="13.5" fill="#cbd5e1">On prod1 Kyverno denies unsigned or unpinned images</text>
