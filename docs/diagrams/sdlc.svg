<rect x="44" y="120" width="158" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="123.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App repo</text>
<text class="s" x="123.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">your code and</text>
<text class="s" x="123.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploy/ folder</text>
<rect x="282" y="120" width="396" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="155.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="480.0" y="175.4" font-size="13" fill="#dde5ef" text-anchor="middle">builds, scans and signs every image</text>
<rect x="758" y="120" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="837.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="837.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed</text>
<text class="s" x="837.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="44" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="123.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="123.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps</text>
<text class="s" x="123.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">engine</text>
<rect x="282" y="280" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="361.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Release</text>
<text class="s" x="361.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">immutable</text>
<text class="s" x="361.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">snapshot</text>
<rect x="520" y="280" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Development</text>
<text class="s" x="599.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">first</text>
<text class="s" x="599.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">environment</text>
<rect x="520" y="440" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Staging</text>
<text class="s" x="599.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">second</text>
<text class="s" x="599.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">environment</text>
<rect x="758" y="440" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="837.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Promotion gate</text>
<text class="s" x="837.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">checks staging,</text>
<text class="s" x="837.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">opens the PR</text>
<rect x="520" y="600" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="626.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Production</text>
<text class="s" x="599.0" y="646.4" font-size="13" fill="#dde5ef" text-anchor="middle">gated</text>
<text class="s" x="599.0" y="664.4" font-size="13" fill="#dde5ef" text-anchor="middle">twice</text>
<rect x="758" y="600" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="837.0" y="635.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Admission</text>
<text class="s" x="837.0" y="655.4" font-size="13" fill="#dde5ef" text-anchor="middle">Kyverno</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">SDLC · from git push to production</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">One signed image, promoted by pull requests in the app repo: development, then staging, then production. Production is gated twice, at</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">promotion and at admission.</text>
<circle cx="234.0" cy="144.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="234.0" y="148.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="710.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="123.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="234.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="234.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="472.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="472.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="480.0" cy="480.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="484.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="718.0" cy="480.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="718.0" y="484.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<rect x="556.0" y="218.0" width="147.4" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="560.0" y="232.0" font-size="13" fill="#aab6c8">production pull request</text>
<circle cx="744.0" cy="480.0" r="3.6" fill="#fbbf24"/>
<rect x="342.0" y="614.0" width="92.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="346.0" y="628.0" font-size="13" fill="#aab6c8">after approval</text>
<circle cx="480.0" cy="640.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="644.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<circle cx="718.0" cy="640.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="718.0" y="644.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<line x1="28" y1="702" x2="932" y2="702" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="725.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="730" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="730.0" font-size="13.5" fill="#dde5ef">A push to the app repo starts a build on OpenChoreo&#x27;s workflow plane on the management cluster</text>
<circle cx="40" cy="753.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="758" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="758.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans and signs the image and pushes it to the registry (it also commits the new version to deploy/)</text>
<circle cx="40" cy="781.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="786" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="786.0" font-size="13.5" fill="#dde5ef">Argo CD reads the deploy/ folder of the app repo</text>
<circle cx="40" cy="809.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="814" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="814.0" font-size="13.5" fill="#dde5ef">Argo CD applies it to OpenChoreo, which snapshots an immutable release</text>
<circle cx="40" cy="837.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="842" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="842.0" font-size="13.5" fill="#dde5ef">The release deploys to development automatically</text>
<circle cx="40" cy="865.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="870" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="870.0" font-size="13.5" fill="#dde5ef">The release deploys to staging once the team merges a staging pull request in the app repo</text>
<circle cx="40" cy="893.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="898" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="898.0" font-size="13.5" fill="#dde5ef">The promotion gate checks staging (readiness, smoke tests, alerts, error rate, change freezes), then opens the production pull request in</text>
<text class="s" x="62.0" y="917.0" font-size="13.5" fill="#dde5ef">the app repo</text>
<circle cx="40" cy="940.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="945" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="945.0" font-size="13.5" fill="#dde5ef">The release deploys to production only after a code owner approves and merges that pull request</text>
<circle cx="40" cy="968.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="973" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<text class="s" x="62.0" y="973.0" font-size="13.5" fill="#dde5ef">Kyverno admits into production only images signed in the registry and pinned by digest</text>
<rect x="28" y="1013" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1023.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1013" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1023.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="1013" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="1023.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 1045 L 70 1045" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="1045" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1049.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1049.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<path d="M 422.3199 1045 L 444.3199 1045" stroke="#8b9ab0" stroke-width="1.6" marker-end="url(#ah8b9ab0)"/>
<text class="s" x="454.3" y="1049.0" font-size="13" fill="#aab6c8">commits the new version to deploy/</text>
</svg>
