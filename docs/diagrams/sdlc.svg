<rect x="40" y="120" width="160" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="120.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App repo</text>
<text class="s" x="120.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">your code and its</text>
<text class="s" x="120.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploy/ folder</text>
<rect x="280" y="120" width="400" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Build &amp; sign</text>
<text class="s" x="480.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo workflow plane or GitHub Actions</text>
<text class="s" x="480.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">scans, records what is inside, signs</text>
<rect x="760" y="120" width="160" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="840.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="840.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">Harbor or GitHub,</text>
<text class="s" x="840.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed images</text>
<rect x="40" y="280" width="160" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="120.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="120.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">reads the</text>
<text class="s" x="120.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploy/ folder</text>
<rect x="280" y="280" width="160" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="360.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Release</text>
<text class="s" x="360.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">an immutable</text>
<text class="s" x="360.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">snapshot</text>
<rect x="520" y="280" width="160" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="600.0" y="306.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Promotion gate</text>
<text class="s" x="600.0" y="326.4" font-size="13" fill="#dde5ef" text-anchor="middle">checks health,</text>
<text class="s" x="600.0" y="344.4" font-size="13" fill="#dde5ef" text-anchor="middle">opens the PR</text>
<rect x="40" y="456" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="120.0" y="482.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Development</text>
<text class="s" x="120.0" y="502.4" font-size="13" fill="#dde5ef" text-anchor="middle">deploys</text>
<text class="s" x="120.0" y="520.4" font-size="13" fill="#dde5ef" text-anchor="middle">automatically</text>
<rect x="280" y="456" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="360.0" y="482.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Staging</text>
<text class="s" x="360.0" y="502.4" font-size="13" fill="#dde5ef" text-anchor="middle">after a</text>
<text class="s" x="360.0" y="520.4" font-size="13" fill="#dde5ef" text-anchor="middle">promotion PR</text>
<rect x="520" y="456" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="600.0" y="482.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Production</text>
<text class="s" x="600.0" y="502.4" font-size="13" fill="#dde5ef" text-anchor="middle">gated PR,</text>
<text class="s" x="600.0" y="520.4" font-size="13" fill="#dde5ef" text-anchor="middle">code owners</text>
<rect x="760" y="456" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="840.0" y="482.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="840.0" y="502.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed, pinned</text>
<text class="s" x="840.0" y="520.4" font-size="13" fill="#dde5ef" text-anchor="middle">images only</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">SDLC · from git push to production</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">One signed image, promoted through environments by pull requests; production is gated twice, at promotion and at admission.</text>
<circle cx="232.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="232.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="712.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="712.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="120.0" cy="240.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="120.0" y="244.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="232.0" cy="320.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="232.0" y="324.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="212.0" cy="408.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="212.0" y="412.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="468.0" cy="408.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="468.0" y="412.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="632.0" cy="408.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="632.0" y="412.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="728.0" cy="496.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="728.0" y="500.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<rect x="772.8" y="311.0" width="134.4" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="840.0" y="325.0" font-size="13" fill="#aab6c8" text-anchor="middle">checks the signature</text>
<line x1="28" y1="558" x2="932" y2="558" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="581.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="586" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="586.0" font-size="13.5" fill="#dde5ef">A push to the app repo starts a build on the OpenChoreo workflow plane (or GitHub Actions)</text>
<circle cx="40" cy="609.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="614" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="614.0" font-size="13.5" fill="#dde5ef">Build &amp; sign scans the image (Trivy), writes SBOM and SLSA provenance, signs with cosign, pushes it and commits the new image ref to</text>
<text class="s" x="62.0" y="633.0" font-size="13.5" fill="#dde5ef">deploy/</text>
<circle cx="40" cy="656.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="661" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="661.0" font-size="13.5" fill="#dde5ef">Argo CD reads the app repo&#x27;s deploy/ folder (Component and Workload)</text>
<circle cx="40" cy="684.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="689" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="689.0" font-size="13.5" fill="#dde5ef">Argo CD applies them to OpenChoreo, which snapshots an immutable release (ComponentRelease)</text>
<circle cx="40" cy="712.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="717" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="717.0" font-size="13.5" fill="#dde5ef">The release deploys to development automatically (autoDeploy)</text>
<circle cx="40" cy="740.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="745" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="745.0" font-size="13.5" fill="#dde5ef">The promotion gate checks development (readiness, smoke tests, alerts, freezes) and opens the PR to staging</text>
<circle cx="40" cy="768.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="773" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="773.0" font-size="13.5" fill="#dde5ef">The promotion gate opens production only with CODEOWNERS approval; an admission policy lets only Argo CD write production</text>
<circle cx="40" cy="796.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="801" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="801.0" font-size="13.5" fill="#dde5ef">Kyverno admits into production only signed images pinned by digest (Audit in development and staging)</text>
<rect x="28" y="841" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="851.0" font-size="13" fill="#aab6c8">mgmt cluster</text>
<rect x="162.86294" y="841" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="192.9" y="851.0" font-size="13" fill="#aab6c8">workload cluster</text>
<rect x="318.40966000000003" y="841" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="348.4" y="851.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 491.12436 847 L 527.12436 847" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="505.12436" cy="847" r="7" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="537.1" y="851.0" font-size="13" fill="#aab6c8">numbered step</text>
<path d="M 653.03696 847 L 675.03696 847" stroke="#8b9ab0" stroke-width="1.6" marker-end="url(#ah8b9ab0)"/>
<text class="s" x="685.0" y="851.0" font-size="13" fill="#aab6c8">promotion path, signature check</text>
</svg>
