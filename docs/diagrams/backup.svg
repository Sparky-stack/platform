<rect x="44" y="176" width="528" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="331.0" y="202.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster state (etcd)</text>
<text class="s" x="331.0" y="222.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters, access and CA keys:</text>
<text class="s" x="331.0" y="240.4" font-size="13" fill="#dde5ef" text-anchor="middle">a snapshot every 12 hours</text>
<rect x="700" y="176" width="216" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="808.0" y="202.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Secret backend</text>
<text class="s" x="808.0" y="222.4" font-size="13" fill="#dde5ef" text-anchor="middle">AWS or Vault</text>
<text class="s" x="808.0" y="240.4" font-size="13" fill="#dde5ef" text-anchor="middle">secret store</text>
<rect x="44" y="312" width="224" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="179.0" y="338.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Thunder</text>
<text class="s" x="179.0" y="358.4" font-size="13" fill="#dde5ef" text-anchor="middle">users and</text>
<text class="s" x="179.0" y="376.4" font-size="13" fill="#dde5ef" text-anchor="middle">sign-in clients</text>
<rect x="348" y="312" width="224" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="460.0" y="338.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="460.0" y="358.4" font-size="13" fill="#dde5ef" text-anchor="middle">secrets and</text>
<text class="s" x="460.0" y="376.4" font-size="13" fill="#dde5ef" text-anchor="middle">mesh CA keys</text>
<rect x="508.9" y="287" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="540.4" y="300.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="44" y="448" width="224" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="179.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Harbor</text>
<text class="s" x="179.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">pushed</text>
<text class="s" x="179.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="348" y="448" width="224" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="460.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="460.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps</text>
<text class="s" x="460.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">engine</text>
<rect x="700" y="448" width="216" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="808.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Git</text>
<text class="s" x="808.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">everything</text>
<text class="s" x="808.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">declarative</text>
<rect x="348" y="656" width="224" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="460.0" y="682.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Databases</text>
<text class="s" x="460.0" y="702.4" font-size="13" fill="#dde5ef" text-anchor="middle">app</text>
<text class="s" x="460.0" y="720.4" font-size="13" fill="#dde5ef" text-anchor="middle">data</text>
<rect x="508.9" y="631" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="540.4" y="644.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="700" y="656" width="216" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="808.0" y="682.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Object storage</text>
<text class="s" x="808.0" y="702.4" font-size="13" fill="#dde5ef" text-anchor="middle">database</text>
<text class="s" x="808.0" y="720.4" font-size="13" fill="#dde5ef" text-anchor="middle">backups</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Backup &amp; restore · the restore order</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">The restore order after losing the management cluster: first the state Git cannot recreate, then Argo CD rebuilds everything declarative</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">from Git.</text>
<circle cx="70.0" cy="216.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="70.0" y="220.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="70.0" cy="352.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="70.0" y="356.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="70.0" cy="488.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="70.0" y="492.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<rect x="599.1" y="370.0" width="73.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="636.0" y="384.0" font-size="13" fill="#aab6c8" text-anchor="middle">unseal key</text>
<circle cx="636.0" cy="352.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="636.0" y="356.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<rect x="609.4" y="506.0" width="53.2" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="636.0" y="520.0" font-size="13" fill="#aab6c8" text-anchor="middle">re-sync</text>
<circle cx="636.0" cy="488.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="636.0" y="492.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="610.6" y="714.0" width="50.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="636.0" y="728.0" font-size="13" fill="#aab6c8" text-anchor="middle">restore</text>
<circle cx="636.0" cy="696.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="636.0" y="700.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<line x1="28" y1="782" x2="932" y2="782" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="805.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="810" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="810.0" font-size="13.5" fill="#dde5ef">Restore the management cluster&#x27;s etcd from its latest snapshot: Cluster API keeps its clusters and the CA keys come back</text>
<circle cx="40" cy="833.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="838" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="838.0" font-size="13.5" fill="#dde5ef">Restore Thunder&#x27;s volumes: users, sign-in clients, signing keys</text>
<circle cx="40" cy="861.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="866" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="866.0" font-size="13.5" fill="#dde5ef">OpenBao (opt-in) restores a cold copy of its data and fetches its unseal key from the secret backend, which lives outside the clusters (on</text>
<text class="s" x="62.0" y="885.0" font-size="13.5" fill="#dde5ef">a laptop, re-seed it with task secrets)</text>
<circle cx="40" cy="908.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="913" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="913.0" font-size="13.5" fill="#dde5ef">Harbor&#x27;s images come back from its volumes or from new builds; telemetry starts empty</text>
<circle cx="40" cy="936.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="941" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="941.0" font-size="13.5" fill="#dde5ef">Argo CD re-syncs everything else from Git</text>
<circle cx="40" cy="964.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="969" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="969.0" font-size="13.5" fill="#dde5ef">The databases (opt-in) restore themselves from object storage if a workload cluster is lost too</text>
<rect x="28" y="1009" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1019.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1009" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1019.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="1009" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="1019.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 1041 L 70 1041" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="1041" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1045.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1045.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="422.3199" y="1031" width="26" height="20" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="432.3199" cy="1041" r="7" fill="#fbbf24"/><text class="s" x="432.3199" y="1045.2" font-size="11" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="454.3" y="1045.0" font-size="13" fill="#aab6c8">step at a component</text>
<g><rect x="607.18048" y="1032" width="28" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="4 2.5"/><rect x="643.18048" y="1033" width="54.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2"/><text class="s" x="670.3" y="1045" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">OPT-IN</text></g>
<text class="s" x="707.2" y="1045.0" font-size="13" fill="#aab6c8">opt-in, off by default</text>
</svg>
