<path class="fx" d="M 768.0 648.0 L 224.0 648.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<rect x="32" y="176" width="192" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="139.1" y="202.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Secret backend</text>
<text class="s" x="139.1" y="222.4" font-size="13" fill="#dde5ef" text-anchor="middle">AWS or Vault</text>
<text class="s" x="139.1" y="240.4" font-size="13" fill="#dde5ef" text-anchor="middle">secret stores</text>
<rect x="32" y="448" width="192" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="128.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Git</text>
<text class="s" x="128.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">everything</text>
<text class="s" x="128.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">declarative</text>
<rect x="32" y="608" width="192" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="128.0" y="634.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Object storage</text>
<text class="s" x="128.0" y="654.4" font-size="13" fill="#dde5ef" text-anchor="middle">database backups:</text>
<text class="s" x="128.0" y="672.4" font-size="13" fill="#dde5ef" text-anchor="middle">S3, GCS, Azure</text>
<rect x="336" y="176" width="320" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="496.0" y="202.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster state (etcd)</text>
<text class="s" x="496.0" y="222.4" font-size="13" fill="#dde5ef" text-anchor="middle">snapshot every 12 h, 5 kept:</text>
<text class="s" x="496.0" y="240.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters, access, CA keys</text>
<rect x="336" y="312" width="152" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="412.0" y="338.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="412.0" y="358.4" font-size="13" fill="#dde5ef" text-anchor="middle">a cold copy</text>
<text class="s" x="412.0" y="376.4" font-size="13" fill="#dde5ef" text-anchor="middle">of its data</text>
<rect x="416.7" y="289" width="59.3" height="17" rx="8.5" fill="#0b1120" stroke="#a78bfa" stroke-width="1"/>
<text class="s" x="446.4" y="301.5" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="504" y="312" width="152" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="593.7" y="338.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Thunder</text>
<text class="s" x="593.7" y="358.4" font-size="13" fill="#dde5ef" text-anchor="middle">users and</text>
<text class="s" x="593.7" y="376.4" font-size="13" fill="#dde5ef" text-anchor="middle">sign-in clients</text>
<rect x="336" y="448" width="152" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="412.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="412.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">re-applies</text>
<text class="s" x="412.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">everything else</text>
<rect x="504" y="448" width="152" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="580.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Harbor</text>
<text class="s" x="580.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">pushed</text>
<text class="s" x="580.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="768" y="176" width="160" height="80" rx="8" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="848.0" y="202.4" font-size="15" fill="#dde5ef" font-weight="600" text-anchor="middle">Workload clusters</text>
<text class="s" x="848.0" y="222.4" font-size="13" fill="#aab6c8" text-anchor="middle">rebuilt by Argo CD</text>
<text class="s" x="848.0" y="240.4" font-size="13" fill="#aab6c8" text-anchor="middle">and OpenChoreo</text>
<rect x="768" y="608" width="160" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="848.0" y="634.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Databases</text>
<text class="s" x="848.0" y="654.4" font-size="13" fill="#dde5ef" text-anchor="middle">continuous</text>
<text class="s" x="848.0" y="672.4" font-size="13" fill="#dde5ef" text-anchor="middle">backup</text>
<rect x="856.7" y="585" width="59.3" height="17" rx="8.5" fill="#0b1120" stroke="#a78bfa" stroke-width="1"/>
<text class="s" x="886.4" y="597.5" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Backup &amp; restore · what is stateful, where</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Git rebuilds everything declarative; the violet boxes hold state it cannot recreate. Numbers: the restore order after losing mgmt.</text>
<circle cx="56.0" cy="216.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.4"/>
<text class="s" x="56.0" y="220.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">1</text>
<circle cx="385.4" cy="216.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.4"/>
<text class="s" x="385.4" y="220.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">2</text>
<circle cx="528.0" cy="352.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.4"/>
<text class="s" x="528.0" y="356.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">4</text>
<circle cx="530.0" cy="488.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.4"/>
<text class="s" x="530.0" y="492.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">6</text>
<circle cx="280.0" cy="352.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="280.0" y="356.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="280.0" cy="488.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="280.0" y="492.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="712.0" cy="648.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="712.0" y="652.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="734" x2="932" y2="734" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="757.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40" y="762" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">1</text>
<text class="s" x="62.0" y="762.0" font-size="13.5" fill="#dde5ef">The secret backend lives outside the clusters (AWS Secrets Manager, Vault); locally re-seed it with task secrets</text>
<circle cx="40" cy="785.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40" y="790" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">2</text>
<text class="s" x="62.0" y="790.0" font-size="13.5" fill="#dde5ef">Restore mgmt etcd from a k3s snapshot: Cluster API keeps its clusters and the CA keys come back</text>
<circle cx="40" cy="813.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="818" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="818.0" font-size="13.5" fill="#dde5ef">OpenBao (opt-in) restores its data from a cold volume copy and unseals with the key from the secret backend</text>
<circle cx="40" cy="841.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40" y="846" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">4</text>
<text class="s" x="62.0" y="846.0" font-size="13.5" fill="#dde5ef">Restore Thunder&#x27;s volumes: users, OAuth clients, signing keys</text>
<circle cx="40" cy="869.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="874" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="874.0" font-size="13.5" fill="#dde5ef">Argo CD re-syncs everything else from git</text>
<circle cx="40" cy="897.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40" y="902" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">6</text>
<text class="s" x="62.0" y="902.0" font-size="13.5" fill="#dde5ef">Harbor&#x27;s images come back from its volumes or from new builds; telemetry starts empty</text>
<circle cx="40" cy="925.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="930" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="930.0" font-size="13.5" fill="#dde5ef">Databases (opt-in CNPG) restore from object storage when a workload cluster is lost</text>
<rect x="28" y="970" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="980.0" font-size="13" fill="#aab6c8">mgmt: rebuilt from git</text>
<rect x="213.40798" y="970" width="20" height="13" rx="3" fill="#292a49" stroke="#a78bfa" stroke-width="1.4"/>
<text class="s" x="243.4" y="980.0" font-size="13" fill="#aab6c8">holds state: restore it</text>
<rect x="397.31394" y="970" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="427.3" y="980.0" font-size="13" fill="#aab6c8">outside: where backups live</text>
<path d="M 620.57368 976 L 656.57368 976" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="634.57368" cy="976" r="7" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="666.6" y="980.0" font-size="13" fill="#aab6c8">numbered step</text>
<circle cx="38" cy="1002" r="8" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="58.0" y="1006.0" font-size="13" fill="#aab6c8">step inside a component</text>
<rect x="233.36142" y="996" width="20" height="13" rx="3" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="263.4" y="1006.0" font-size="13" fill="#aab6c8">context, not a step</text>
<rect x="401.97158" y="996" width="34" height="13" rx="3" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="5 3"/>
<text class="s" x="446.0" y="1006.0" font-size="13" fill="#aab6c8">opt-in (off by default)</text>
</svg>
