<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Backup &amp; restore · what is stateful, where</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Git rebuilds everything declarative. Only the violet boxes hold state git cannot recreate; the numbers are the restore order after losing</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#94a3b8">mgmt.</text>
