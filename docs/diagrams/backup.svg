<rect x="44" y="176" width="136" height="440" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="112.0" y="373.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Backup copies</text>
<text class="s" x="112.0" y="393.4" font-size="13" fill="#dde5ef" text-anchor="middle">etcd snapshots</text>
<text class="s" x="112.0" y="411.4" font-size="13" fill="#dde5ef" text-anchor="middle">and volume</text>
<text class="s" x="112.0" y="429.4" font-size="13" fill="#dde5ef" text-anchor="middle">copies</text>
<rect x="44" y="848" width="136" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="112.0" y="874.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Object storage</text>
<text class="s" x="112.0" y="894.4" font-size="13" fill="#dde5ef" text-anchor="middle">database</text>
<text class="s" x="112.0" y="912.4" font-size="13" fill="#dde5ef" text-anchor="middle">backups</text>
<rect x="284" y="176" width="320" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="444.0" y="202.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster state (etcd)</text>
<text class="s" x="444.0" y="222.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters, access and CA keys:</text>
<text class="s" x="444.0" y="240.4" font-size="13" fill="#dde5ef" text-anchor="middle">a snapshot every 12 hours</text>
<rect x="284" y="296" width="320" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="444.0" y="322.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Thunder</text>
<text class="s" x="444.0" y="342.4" font-size="13" fill="#dde5ef" text-anchor="middle">users, sign-in clients,</text>
<text class="s" x="444.0" y="360.4" font-size="13" fill="#dde5ef" text-anchor="middle">signing keys</text>
<rect x="284" y="416" width="320" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="444.0" y="442.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="444.0" y="462.4" font-size="13" fill="#dde5ef" text-anchor="middle">secrets and</text>
<text class="s" x="444.0" y="480.4" font-size="13" fill="#dde5ef" text-anchor="middle">mesh CA keys</text>
<rect x="540.9" y="391" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="572.4" y="404.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="284" y="536" width="320" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="444.0" y="562.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Harbor</text>
<text class="s" x="444.0" y="582.4" font-size="13" fill="#dde5ef" text-anchor="middle">pushed</text>
<text class="s" x="444.0" y="600.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="284" y="656" width="320" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="444.0" y="682.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="444.0" y="702.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps</text>
<text class="s" x="444.0" y="720.4" font-size="13" fill="#dde5ef" text-anchor="middle">engine</text>
<rect x="284" y="848" width="320" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="444.0" y="874.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Databases</text>
<text class="s" x="444.0" y="894.4" font-size="13" fill="#dde5ef" text-anchor="middle">app data, only if this</text>
<text class="s" x="444.0" y="912.4" font-size="13" fill="#dde5ef" text-anchor="middle">cluster is lost too</text>
<rect x="540.9" y="823" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="572.4" y="836.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="708" y="416" width="208" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="812.0" y="442.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Secret backend</text>
<text class="s" x="812.0" y="462.4" font-size="13" fill="#dde5ef" text-anchor="middle">AWS or Vault</text>
<text class="s" x="812.0" y="480.4" font-size="13" fill="#dde5ef" text-anchor="middle">secret store</text>
<rect x="708" y="656" width="208" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="812.0" y="682.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Git</text>
<text class="s" x="812.0" y="702.4" font-size="13" fill="#dde5ef" text-anchor="middle">everything</text>
<text class="s" x="812.0" y="720.4" font-size="13" fill="#dde5ef" text-anchor="middle">declarative</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Backup &amp; restore · the restore order</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">The restore order after losing the management cluster: first the state Git cannot recreate, from copies kept off the host, then Argo CD</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">rebuilds the rest from Git.</text>
<rect x="198.6" y="234.0" width="50.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="248.0" font-size="13" fill="#aab6c8" text-anchor="middle">restore</text>
<circle cx="224.0" cy="216.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="220.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<rect x="198.6" y="354.0" width="50.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="368.0" font-size="13" fill="#aab6c8" text-anchor="middle">restore</text>
<circle cx="224.0" cy="336.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="340.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<rect x="198.6" y="474.0" width="50.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="488.0" font-size="13" fill="#aab6c8" text-anchor="middle">restore</text>
<circle cx="224.0" cy="456.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="460.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<rect x="198.6" y="594.0" width="50.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="608.0" font-size="13" fill="#aab6c8" text-anchor="middle">restore</text>
<circle cx="224.0" cy="576.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="580.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="619.1" y="474.0" width="73.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="656.0" y="488.0" font-size="13" fill="#aab6c8" text-anchor="middle">unseal key</text>
<circle cx="656.0" cy="456.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="656.0" y="460.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<rect x="629.4" y="714.0" width="53.2" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="656.0" y="728.0" font-size="13" fill="#aab6c8" text-anchor="middle">re-sync</text>
<circle cx="656.0" cy="696.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="656.0" y="700.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<rect x="198.6" y="906.0" width="50.9" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="920.0" font-size="13" fill="#aab6c8" text-anchor="middle">restore</text>
<circle cx="224.0" cy="888.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="892.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="974" x2="932" y2="974" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="997.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1002" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="1002.0" font-size="13.5" fill="#dde5ef">Restore the management cluster&#x27;s etcd from its latest snapshot in the backup copies: the workload clusters&#x27; records and the CA keys</text>
<text class="s" x="62.0" y="1021.0" font-size="13.5" fill="#dde5ef">come back</text>
<circle cx="40" cy="1044.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1049" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="1049.0" font-size="13.5" fill="#dde5ef">Restore Thunder&#x27;s volumes from their copy: users, sign-in clients, signing keys</text>
<circle cx="40" cy="1072.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1077" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="1077.0" font-size="13.5" fill="#dde5ef">Restore OpenBao&#x27;s volume copy (opt-in): secrets and the mesh CA keys</text>
<circle cx="40" cy="1100.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1105" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="1105.0" font-size="13.5" fill="#dde5ef">OpenBao fetches its unseal key from the secret backend, which lives outside the clusters (on a local setup, re-create it with task secrets)</text>
<circle cx="40" cy="1128.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1133" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="1133.0" font-size="13.5" fill="#dde5ef">Harbor&#x27;s images come back from their volume copy or from new builds</text>
<circle cx="40" cy="1156.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1161" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="1161.0" font-size="13.5" fill="#dde5ef">Argo CD re-syncs everything else from Git</text>
<circle cx="40" cy="1184.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1189" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="1189.0" font-size="13.5" fill="#dde5ef">The databases (opt-in) restore themselves from object storage, only if a workload cluster is lost too</text>
<text class="s" x="28.0" y="1221.0" font-size="13.5" fill="#aab6c8">Telemetry is not backed up: it starts empty.</text>
<rect x="28" y="1257" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1267.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1257" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1267.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="1257" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="1267.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 1289 L 70 1289" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="1289" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1293.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1293.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<g><rect x="424.3199" y="1280" width="28" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="4 2.5"/><rect x="460.3199" y="1281" width="54.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2"/><text class="s" x="487.5" y="1293" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">OPT-IN</text></g>
<text class="s" x="524.3" y="1293.0" font-size="13" fill="#aab6c8">opt-in, off by default</text>
</svg>
