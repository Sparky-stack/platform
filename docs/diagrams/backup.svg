<text class="s" x="32.0" y="152.0" font-size="13" fill="#94a3b8" font-weight="700" letter-spacing="1.0">OUTSIDE</text>
<rect x="320" y="128" width="352" height="424" rx="14" fill="#0e212d" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="336.0" y="152.0" font-size="13" fill="#2dd4bf" font-weight="700" letter-spacing="1.0">MGMT CLUSTER</text>
<rect x="752" y="128" width="192" height="584" rx="14" fill="#0f1f31" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.3"/>
<text class="s" x="768.0" y="152.0" font-size="13" fill="#38bdf8" font-weight="700" letter-spacing="1.0">WORKLOAD</text>
