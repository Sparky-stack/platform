<rect x="44" y="120" width="136" height="60" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="112.0" y="145.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Backup copies</text>
<text class="s" x="112.0" y="165.4" font-size="13" fill="#dde5ef" text-anchor="middle">off the host</text>
<rect x="44" y="260" width="136" height="440" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="112.0" y="466.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Operator</text>
<text class="s" x="112.0" y="486.4" font-size="13" fill="#dde5ef" text-anchor="middle">runs the restore</text>
<text class="s" x="112.0" y="504.4" font-size="13" fill="#dde5ef" text-anchor="middle">runbook</text>
<rect x="284" y="260" width="300" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="434.0" y="286.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster state (etcd)</text>
<text class="s" x="434.0" y="306.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters, access and CA keys:</text>
<text class="s" x="434.0" y="324.4" font-size="13" fill="#dde5ef" text-anchor="middle">a snapshot every 12 hours</text>
<rect x="284" y="380" width="300" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="434.0" y="406.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Thunder</text>
<text class="s" x="434.0" y="426.4" font-size="13" fill="#dde5ef" text-anchor="middle">users, sign-in clients,</text>
<text class="s" x="434.0" y="444.4" font-size="13" fill="#dde5ef" text-anchor="middle">signing keys</text>
<rect x="284" y="500" width="300" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="434.0" y="526.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="434.0" y="546.4" font-size="13" fill="#dde5ef" text-anchor="middle">secrets and</text>
<text class="s" x="434.0" y="564.4" font-size="13" fill="#dde5ef" text-anchor="middle">mesh CA keys</text>
<rect x="520.9" y="475" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="552.4" y="488.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="284" y="620" width="300" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="434.0" y="646.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Harbor</text>
<text class="s" x="434.0" y="666.4" font-size="13" fill="#dde5ef" text-anchor="middle">pushed</text>
<text class="s" x="434.0" y="684.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="284" y="740" width="300" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="434.0" y="766.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="434.0" y="786.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps</text>
<text class="s" x="434.0" y="804.4" font-size="13" fill="#dde5ef" text-anchor="middle">engine</text>
<rect x="284" y="956" width="300" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="434.0" y="982.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Databases</text>
<text class="s" x="434.0" y="1002.4" font-size="13" fill="#dde5ef" text-anchor="middle">app data, only if this</text>
<text class="s" x="434.0" y="1020.4" font-size="13" fill="#dde5ef" text-anchor="middle">cluster is lost too</text>
<rect x="520.9" y="931" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="552.4" y="944.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="712" y="500" width="204" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="814.0" y="526.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Secret backend</text>
<text class="s" x="814.0" y="546.4" font-size="13" fill="#dde5ef" text-anchor="middle">AWS or Vault</text>
<text class="s" x="814.0" y="564.4" font-size="13" fill="#dde5ef" text-anchor="middle">secret store</text>
<rect x="712" y="740" width="204" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="814.0" y="766.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Git</text>
<text class="s" x="814.0" y="786.4" font-size="13" fill="#dde5ef" text-anchor="middle">everything</text>
<text class="s" x="814.0" y="804.4" font-size="13" fill="#dde5ef" text-anchor="middle">declarative</text>
<rect x="712" y="956" width="204" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="814.0" y="982.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Object storage</text>
<text class="s" x="814.0" y="1002.4" font-size="13" fill="#dde5ef" text-anchor="middle">database</text>
<text class="s" x="814.0" y="1020.4" font-size="13" fill="#dde5ef" text-anchor="middle">backups</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Backup &amp; restore · the restore order</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">After losing the management cluster, the operator first restores the state Git cannot recreate, from backup copies kept off the host; then</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">Argo CD rebuilds the rest from Git.</text>
<rect x="128.0" y="211.0" width="52.4" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="132.0" y="225.0" font-size="13" fill="#aab6c8">fetches</text>
<circle cx="112.0" cy="220.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="112.0" y="224.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<rect x="195.1" y="318.0" width="57.8" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="332.0" font-size="13" fill="#aab6c8" text-anchor="middle">restores</text>
<circle cx="224.0" cy="300.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="304.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<rect x="195.1" y="438.0" width="57.8" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="452.0" font-size="13" fill="#aab6c8" text-anchor="middle">restores</text>
<circle cx="224.0" cy="420.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="424.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<rect x="195.1" y="558.0" width="57.8" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="572.0" font-size="13" fill="#aab6c8" text-anchor="middle">restores</text>
<circle cx="224.0" cy="540.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="544.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<rect x="195.1" y="678.0" width="57.8" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="224.0" y="692.0" font-size="13" fill="#aab6c8" text-anchor="middle">restores</text>
<circle cx="224.0" cy="660.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="224.0" y="664.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<rect x="605.3" y="558.0" width="85.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="648.0" y="572.0" font-size="13" fill="#aab6c8" text-anchor="middle">reads its key</text>
<circle cx="648.0" cy="540.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="648.0" y="544.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="626.8" y="798.0" width="42.5" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="648.0" y="812.0" font-size="13" fill="#aab6c8" text-anchor="middle">reads</text>
<circle cx="648.0" cy="780.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="648.0" y="784.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<rect x="599.2" y="1014.0" width="97.6" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="648.0" y="1028.0" font-size="13" fill="#aab6c8" text-anchor="middle">reads backups</text>
<circle cx="648.0" cy="996.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="648.0" y="1000.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="1082" x2="932" y2="1082" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="1105.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1110" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="1110.0" font-size="13.5" fill="#dde5ef">The operator fetches the latest backup copies from off the host: etcd snapshots and volume copies</text>
<circle cx="40" cy="1133.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1138" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="1138.0" font-size="13.5" fill="#dde5ef">The operator restores the management cluster&#x27;s etcd from its latest snapshot: the workload clusters&#x27; records and the CA keys come back</text>
<circle cx="40" cy="1161.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1166" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="1166.0" font-size="13.5" fill="#dde5ef">The operator restores Thunder&#x27;s volumes from their copy: users, sign-in clients, signing keys</text>
<circle cx="40" cy="1189.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1194" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="1194.0" font-size="13.5" fill="#dde5ef">The operator restores OpenBao&#x27;s volume copy (opt-in): secrets and the mesh CA keys</text>
<circle cx="40" cy="1217.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1222" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="1222.0" font-size="13.5" fill="#dde5ef">OpenBao fetches its unseal key from the secret backend, which lives outside the clusters (on a local setup, re-create it with task secrets)</text>
<circle cx="40" cy="1245.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1250" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="1250.0" font-size="13.5" fill="#dde5ef">The operator restores Harbor&#x27;s volume copy, or new builds push the images again</text>
<circle cx="40" cy="1273.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1278" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="1278.0" font-size="13.5" fill="#dde5ef">Argo CD re-syncs everything else from Git</text>
<circle cx="40" cy="1301.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1306" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="1306.0" font-size="13.5" fill="#dde5ef">The databases (opt-in) restore themselves from object storage, only if a workload cluster is lost too</text>
<text class="s" x="28.0" y="1338.0" font-size="13.5" fill="#aab6c8">Telemetry is not backed up: it starts empty.</text>
<rect x="28" y="1374" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1384.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1374" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1384.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="1374" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="1384.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 1406 L 70 1406" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="1406" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1410.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1410.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<g><rect x="424.3199" y="1397" width="28" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="4 2.5"/><rect x="460.3199" y="1398" width="54.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2"/><text class="s" x="487.5" y="1410" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">OPT-IN</text></g>
<text class="s" x="524.3" y="1410.0" font-size="13" fill="#aab6c8">opt-in, off by default</text>
</svg>
