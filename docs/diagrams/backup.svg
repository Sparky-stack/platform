<text class="s" x="280.0" y="492.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="496.0" cy="648.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="496.0" y="652.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<line x1="28" y1="732" x2="932" y2="732" stroke="#8b9ab0" stroke-width="1.5"/>
<circle cx="40.0" cy="755.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40.0" y="760" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">1</text>
<text class="s" x="60.0" y="760.0" font-size="13.5" fill="#cbd5e1">The secret backend lives outside the clusters; locally re-seed it</text>
<text class="s" x="60.0" y="779.0" font-size="13.5" fill="#cbd5e1">with task secrets</text>
<circle cx="506.0" cy="755.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="506.0" y="760" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">4</text>
<text class="s" x="526.0" y="760.0" font-size="13.5" fill="#cbd5e1">Restore Thunder&#x27;s database (users, OAuth clients)</text>
<circle cx="40.0" cy="803.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40.0" y="808" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">2</text>
<text class="s" x="60.0" y="808.0" font-size="13.5" fill="#cbd5e1">Restore mgmt etcd from a k3s snapshot: CAPI keeps its</text>
<text class="s" x="60.0" y="827.0" font-size="13.5" fill="#cbd5e1">clusters and the CA keys come back</text>
<circle cx="506.0" cy="803.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="808" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="808.0" font-size="13.5" fill="#cbd5e1">Argo CD re-syncs everything else from git; Harbor and</text>
<text class="s" x="526.0" y="827.0" font-size="13.5" fill="#cbd5e1">telemetry refill</text>
<circle cx="40.0" cy="851.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="856" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="856.0" font-size="13.5" fill="#cbd5e1">Restore OpenBao&#x27;s raft snapshot; it unseals with the key from</text>
<text class="s" x="60.0" y="875.0" font-size="13.5" fill="#cbd5e1">the backend</text>
<circle cx="506.0" cy="851.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="856" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="856.0" font-size="13.5" fill="#cbd5e1">Databases restore from object storage (CNPG</text>
<text class="s" x="526.0" y="875.0" font-size="13.5" fill="#cbd5e1">bootstrap.recovery)</text>
