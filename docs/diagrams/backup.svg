<rect x="44" y="176" width="192" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="163.0" y="202.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Secret backend</text>
<text class="s" x="163.0" y="222.4" font-size="13" fill="#dde5ef" text-anchor="middle">AWS or Vault</text>
<text class="s" x="163.0" y="240.4" font-size="13" fill="#dde5ef" text-anchor="middle">secret store</text>
<rect x="44" y="448" width="192" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="140.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Git</text>
<text class="s" x="140.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">everything</text>
<text class="s" x="140.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">declarative</text>
<rect x="44" y="656" width="192" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="140.0" y="682.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Object storage</text>
<text class="s" x="140.0" y="702.4" font-size="13" fill="#dde5ef" text-anchor="middle">database</text>
<text class="s" x="140.0" y="720.4" font-size="13" fill="#dde5ef" text-anchor="middle">backups</text>
<rect x="364" y="176" width="552" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="663.0" y="202.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster state (etcd)</text>
<text class="s" x="663.0" y="222.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters, access and CA keys:</text>
<text class="s" x="663.0" y="240.4" font-size="13" fill="#dde5ef" text-anchor="middle">a snapshot every 12 h</text>
<rect x="364" y="312" width="236" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="482.0" y="338.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenBao</text>
<text class="s" x="482.0" y="358.4" font-size="13" fill="#dde5ef" text-anchor="middle">cold copy</text>
<text class="s" x="482.0" y="376.4" font-size="13" fill="#dde5ef" text-anchor="middle">of its data</text>
<rect x="536.9" y="287" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#a78bfa" stroke-width="1.2"/>
<text class="s" x="568.4" y="300.8" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="680" y="312" width="236" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="821.0" y="338.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Thunder</text>
<text class="s" x="821.0" y="358.4" font-size="13" fill="#dde5ef" text-anchor="middle">users and</text>
<text class="s" x="821.0" y="376.4" font-size="13" fill="#dde5ef" text-anchor="middle">sign-in clients</text>
<rect x="364" y="448" width="236" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="482.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="482.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">re-applies</text>
<text class="s" x="482.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">everything else</text>
<rect x="680" y="448" width="236" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5"/>
<text class="s" x="821.0" y="474.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Harbor</text>
<text class="s" x="821.0" y="494.4" font-size="13" fill="#dde5ef" text-anchor="middle">pushed</text>
<text class="s" x="821.0" y="512.4" font-size="13" fill="#dde5ef" text-anchor="middle">images</text>
<rect x="364" y="656" width="236" height="80" rx="8" fill="#292a49" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="482.0" y="682.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Databases</text>
<text class="s" x="482.0" y="702.4" font-size="13" fill="#dde5ef" text-anchor="middle">continuous</text>
<text class="s" x="482.0" y="720.4" font-size="13" fill="#dde5ef" text-anchor="middle">backups</text>
<rect x="536.9" y="631" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#a78bfa" stroke-width="1.2"/>
<text class="s" x="568.4" y="644.8" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Backup &amp; restore · the restore order</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Git rebuilds everything declarative; the violet boxes hold state it cannot recreate. The numbers are the restore order after losing the</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">management cluster.</text>
<circle cx="70.0" cy="216.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="70.0" y="220.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="390.0" cy="216.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="390.0" y="220.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="706.0" cy="352.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="706.0" y="356.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="706.0" cy="488.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="706.0" y="492.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="300.0" cy="352.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="300.0" y="356.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="300.0" cy="488.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="300.0" y="492.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="300.0" cy="696.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="300.0" y="700.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="782" x2="932" y2="782" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="805.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="810" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="810.0" font-size="13.5" fill="#dde5ef">The secret backend (AWS Secrets Manager, Vault) lives outside the clusters; locally, re-seed it with task secrets</text>
<circle cx="40" cy="833.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="838" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="838.0" font-size="13.5" fill="#dde5ef">Restore the management cluster&#x27;s etcd from a k3s snapshot (every 12 h, 5 kept): Cluster API keeps its clusters, the CA keys come back</text>
<circle cx="40" cy="861.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="866" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="866.0" font-size="13.5" fill="#dde5ef">The secret backend gives OpenBao (opt-in) its unseal key; OpenBao&#x27;s data comes back from a cold volume copy</text>
<circle cx="40" cy="889.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="894" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="894.0" font-size="13.5" fill="#dde5ef">Restore Thunder&#x27;s volumes: users, OAuth clients, signing keys</text>
<circle cx="40" cy="917.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="922" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="922.0" font-size="13.5" fill="#dde5ef">Git re-creates everything else through Argo CD</text>
<circle cx="40" cy="945.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="950" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="950.0" font-size="13.5" fill="#dde5ef">Harbor&#x27;s images come back from its volumes or from new builds; telemetry starts empty</text>
<circle cx="40" cy="973.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="978" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="978.0" font-size="13.5" fill="#dde5ef">Object storage restores the databases (opt-in CNPG) if a workload cluster is lost too</text>
<rect x="28" y="1018" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1028.0" font-size="13" fill="#aab6c8">management cluster: rebuilt from git</text>
<rect x="305.791" y="1018" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="335.8" y="1028.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="536.1099" y="1018" width="20" height="13" rx="3" fill="#292a49" stroke="#a78bfa" stroke-width="1.4"/>
<text class="s" x="566.1" y="1028.0" font-size="13" fill="#aab6c8">holds state: restore it</text>
<rect x="28" y="1044" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="58.0" y="1054.0" font-size="13" fill="#aab6c8">outside: where backups live</text>
<path d="M 253.25974 1050 L 297.25973999999997 1050" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="269.25973999999997" cy="1050" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="269.25973999999997" y="1054.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="307.3" y="1054.0" font-size="13" fill="#aab6c8">numbered step</text>
<g><rect x="427.17233999999996" y="1042" width="54.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2" stroke-dasharray="4 2.5"/><text class="s" x="454.3" y="1054" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">OPT-IN</text></g>
<text class="s" x="487.2" y="1054.0" font-size="13" fill="#aab6c8">opt-in: off by default</text>
