<text class="s" x="40" y="682" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="682.0" font-size="13.5" fill="#dde5ef">The Prometheus agent collects container and cluster metrics and sends them to Prometheus</text>
