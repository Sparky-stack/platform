<text class="s" x="300.0" y="548.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="740.0" cy="392.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="740.0" y="396.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="760.0" cy="392.0" r="3.6" fill="#fbbf24"/>
<line x1="28" y1="614" x2="932" y2="614" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="637.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="642" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="642.0" font-size="13.5" fill="#dde5ef">Fluent Bit ships container logs, security alerts included, to OpenSearch</text>
<circle cx="40" cy="665.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="670" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="670.0" font-size="13.5" fill="#dde5ef">The OpenTelemetry collector sends app traces and events to OpenSearch and app metrics to Prometheus</text>
<circle cx="40" cy="693.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="698" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="698.0" font-size="13.5" fill="#dde5ef">The Prometheus agent collects container and cluster metrics and sends them to Prometheus</text>
<circle cx="40" cy="721.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="726" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="726.0" font-size="13.5" fill="#dde5ef">Backstage, the promotion gate and the opt-in AI agents query the observer API, which reads both stores behind one login</text>
<rect x="28" y="766" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="776.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="766" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="776.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
