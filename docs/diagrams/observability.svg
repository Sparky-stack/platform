<text class="s" x="62.0" y="626.0" font-size="13.5" fill="#dde5ef">Fluent Bit ships container logs, security alerts included, to OpenSearch</text>
<circle cx="40" cy="649.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="654" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="654.0" font-size="13.5" fill="#dde5ef">The OpenTelemetry collector sends app traces and cluster events to OpenSearch and app metrics to Prometheus</text>
