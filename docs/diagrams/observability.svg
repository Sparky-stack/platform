<text class="s" x="40" y="738" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="738.0" font-size="13.5" fill="#dde5ef">Backstage, the promotion gate and the opt-in AI agents query the observer API</text>
