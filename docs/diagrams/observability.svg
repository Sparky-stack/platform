<line x1="28" y1="598" x2="932" y2="598" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="621.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="626" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="626.0" font-size="13.5" fill="#dde5ef">Fluent Bit ships container logs, Falco security alerts included, to OpenSearch</text>
<circle cx="40" cy="649.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="654" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="654.0" font-size="13.5" fill="#dde5ef">The OTel Collector sends app traces and Kubernetes events to OpenSearch and app metrics to Prometheus</text>
<circle cx="40" cy="677.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="682" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="682.0" font-size="13.5" fill="#dde5ef">The Prometheus agent scrapes container and cluster metrics (cAdvisor, kube-state-metrics) and remote-writes them to Prometheus</text>
<circle cx="40" cy="705.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="710" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="710.0" font-size="13.5" fill="#dde5ef">The observer API queries both stores behind one login (Thunder)</text>
<circle cx="40" cy="733.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="738" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="738.0" font-size="13.5" fill="#dde5ef">Backstage, the promotion gate and the opt-in AI agents query the observer API</text>
