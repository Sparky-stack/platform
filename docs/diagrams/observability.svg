<text class="s" x="140.0" y="378.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenTelemetry</text>
<text class="s" x="140.0" y="398.4" font-size="13" fill="#dde5ef" text-anchor="middle">traces, events,</text>
<text class="s" x="140.0" y="416.4" font-size="13" fill="#dde5ef" text-anchor="middle">app metrics</text>
<rect x="44" y="488" width="192" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="140.0" y="514.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Prometheus agent</text>
<text class="s" x="140.0" y="534.4" font-size="13" fill="#dde5ef" text-anchor="middle">container and</text>
<text class="s" x="140.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">cluster metrics</text>
<rect x="380" y="216" width="120" height="216" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="440.0" y="310.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenSearch</text>
<text class="s" x="440.0" y="330.4" font-size="13" fill="#dde5ef" text-anchor="middle">logs, traces</text>
<text class="s" x="440.0" y="348.4" font-size="13" fill="#dde5ef" text-anchor="middle">and events</text>
<rect x="380" y="488" width="120" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="440.0" y="523.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Prometheus</text>
<text class="s" x="440.0" y="543.4" font-size="13" fill="#dde5ef" text-anchor="middle">metrics</text>
<rect x="572" y="352" width="120" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="632.0" y="378.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Observer API</text>
