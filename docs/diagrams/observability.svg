<text class="s" x="60.0" y="696.0" font-size="13.5" fill="#cbd5e1">The Prometheus agent scrapes cAdvisor and</text>
<text class="s" x="60.0" y="715.0" font-size="13.5" fill="#cbd5e1">kube-state-metrics and remote-writes</text>
