<text class="s" x="850.0" y="280.4" font-size="13" fill="#dde5ef" text-anchor="middle">portal</text>
<rect x="784" y="352" width="132" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="850.0" y="378.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Promotion gate</text>
<text class="s" x="850.0" y="398.4" font-size="13" fill="#dde5ef" text-anchor="middle">release</text>
<text class="s" x="850.0" y="416.4" font-size="13" fill="#dde5ef" text-anchor="middle">checks</text>
