<text class="s" x="850.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">cost reports</text>
<rect x="852.9" y="463" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="884.4" y="476.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Observability · one place to query every signal</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Collectors on every workload cluster ship to OpenChoreo&#x27;s observability plane on the management cluster; Backstage, the promotion</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">gate and the AI agents query it through one API.</text>
<text class="s" x="784.0" y="196.0" font-size="13" fill="#cbd5e1" font-weight="700" letter-spacing="1.0">CONSUMERS</text>
