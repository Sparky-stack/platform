<text class="s" x="40.0" y="600" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="600.0" font-size="13.5" fill="#cbd5e1">Fluent Bit tails container logs, Falco alerts included, into</text>
<text class="s" x="60.0" y="619.0" font-size="13.5" fill="#cbd5e1">OpenSearch</text>
<circle cx="506.0" cy="595.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="600" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="526.0" y="600.0" font-size="13.5" fill="#cbd5e1">Both stores feed the observer API, one query API behind</text>
<text class="s" x="526.0" y="619.0" font-size="13.5" fill="#cbd5e1">Thunder auth</text>
<circle cx="40.0" cy="643.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="648" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="648.0" font-size="13.5" fill="#cbd5e1">Apps send OTLP to the OTel Collector on their node: traces</text>
<text class="s" x="60.0" y="667.0" font-size="13.5" fill="#cbd5e1">and k8s events to OpenSearch, metrics to Prometheus</text>
<circle cx="506.0" cy="643.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="648" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="648.0" font-size="13.5" fill="#cbd5e1">It serves Backstage, the promotion gate and the opt-in AI</text>
<text class="s" x="526.0" y="667.0" font-size="13.5" fill="#cbd5e1">agents</text>
<circle cx="40.0" cy="691.5" r="11" fill="#fbbf24"/>
