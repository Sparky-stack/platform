<rect x="32" y="100" width="200" height="56" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="132.0" y="123.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Git</text>
<text class="s" x="132.0" y="143.4" font-size="13" fill="#dde5ef" text-anchor="middle">platform + app repos</text>
<rect x="32" y="256" width="124" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="94.0" y="282.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="94.0" y="302.4" font-size="13" fill="#dde5ef" text-anchor="middle">reads git,</text>
<text class="s" x="94.0" y="320.4" font-size="13" fill="#dde5ef" text-anchor="middle">applies it</text>
<rect x="418" y="256" width="510" height="80" rx="8" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="673.0" y="282.4" font-size="15" fill="#dde5ef" font-weight="600" text-anchor="middle">Also on mgmt</text>
<text class="s" x="673.0" y="302.4" font-size="13" fill="#aab6c8" text-anchor="middle">image registry (Harbor) · secrets and certificates</text>
<text class="s" x="673.0" y="320.4" font-size="13" fill="#aab6c8" text-anchor="middle">admission policy (Kyverno) · sign-in (Thunder)</text>
<rect x="32" y="416" width="124" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="94.0" y="442.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="94.0" y="462.4" font-size="13" fill="#dde5ef" text-anchor="middle">creates the</text>
<text class="s" x="94.0" y="480.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters</text>
<rect x="418" y="416" width="510" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="673.0" y="451.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenChoreo</text>
<text class="s" x="673.0" y="471.4" font-size="13" fill="#dde5ef" text-anchor="middle">developer platform: builds, releases, telemetry</text>
<rect x="32" y="632" width="124" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="94.0" y="658.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">k3s nodes</text>
<text class="s" x="94.0" y="678.4" font-size="13" fill="#dde5ef" text-anchor="middle">servers +</text>
<text class="s" x="94.0" y="696.4" font-size="13" fill="#dde5ef" text-anchor="middle">workers</text>
<rect x="225" y="632" width="124" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="287.0" y="658.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Addons</text>
<text class="s" x="287.0" y="678.4" font-size="13" fill="#dde5ef" text-anchor="middle">network, mesh,</text>
<text class="s" x="287.0" y="696.4" font-size="13" fill="#dde5ef" text-anchor="middle">policy, telemetry</text>
<rect x="418" y="632" width="124" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="480.0" y="658.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="480.0" y="678.4" font-size="13" fill="#dde5ef" text-anchor="middle">runs app</text>
<text class="s" x="480.0" y="696.4" font-size="13" fill="#dde5ef" text-anchor="middle">releases</text>
<rect x="611" y="632" width="124" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="673.0" y="658.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="673.0" y="678.4" font-size="13" fill="#dde5ef" text-anchor="middle">checks every</text>
<text class="s" x="673.0" y="696.4" font-size="13" fill="#dde5ef" text-anchor="middle">pod</text>
<rect x="804" y="632" width="124" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="866.0" y="658.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Apps</text>
<text class="s" x="866.0" y="678.4" font-size="13" fill="#dde5ef" text-anchor="middle">your teams&#x27;</text>
<text class="s" x="866.0" y="696.4" font-size="13" fill="#dde5ef" text-anchor="middle">services</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">koorikla/platform · architecture</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Git is the only input. The mgmt cluster turns it into clusters, addons and app releases; the workload clusters run the apps.</text>
<circle cx="94.0" cy="226.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="94.0" y="230.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="94.0" cy="376.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="94.0" y="380.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="94.0" cy="552.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="94.0" y="556.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="287.0" cy="552.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="287.0" y="556.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="480.0" cy="552.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="556.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="572.0" cy="672.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="572.0" y="676.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="765.0" cy="672.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="765.0" y="676.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="758" x2="932" y2="758" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="781.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="786" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="786.0" font-size="13.5" fill="#dde5ef">Argo CD reads git: fleet files, the addon catalog, teams</text>
<circle cx="40" cy="809.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="814" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="814.0" font-size="13.5" fill="#dde5ef">Argo CD turns each fleet file into a Cluster API cluster</text>
<circle cx="40" cy="837.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="842" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="842.0" font-size="13.5" fill="#dde5ef">Cluster API creates the k3s nodes on docker, AWS or Hetzner</text>
<circle cx="40" cy="865.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="870" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="870.0" font-size="13.5" fill="#dde5ef">Argo CD installs the addons on every cluster whose labels match</text>
<circle cx="40" cy="893.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="898" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="898.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out to OpenChoreo (mTLS) and pulls app releases</text>
<circle cx="40" cy="921.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="926" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="926.0" font-size="13.5" fill="#dde5ef">The agent applies them; Kyverno checks every pod first</text>
<circle cx="40" cy="949.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="954" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="954.0" font-size="13.5" fill="#dde5ef">Kyverno admits only signed images with safe pod settings into the app namespaces</text>
<rect x="28" y="994" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1004.0" font-size="13" fill="#aab6c8">mgmt cluster</text>
<rect x="162.86294" y="994" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="192.9" y="1004.0" font-size="13" fill="#aab6c8">workload cluster</text>
<rect x="318.40966000000003" y="994" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="348.4" y="1004.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 491.12436 1000 L 527.12436 1000" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="505.12436" cy="1000" r="7" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="537.1" y="1004.0" font-size="13" fill="#aab6c8">numbered step</text>
<rect x="655.03696" y="994" width="20" height="13" rx="3" fill="#151d2c" stroke="#64748b" stroke-width="1.2"/>
<text class="s" x="685.0" y="1004.0" font-size="13" fill="#aab6c8">context, not a step</text>
