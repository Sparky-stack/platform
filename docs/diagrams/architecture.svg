<text class="s" x="725.0" y="648.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="475.0" cy="644.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="475.0" y="648.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="735" x2="932" y2="735" stroke="#64748b" stroke-width="1.5"/>
<circle cx="40.0" cy="752.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="757" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="757.0" font-size="13.5" fill="#cbd5e1">Argo CD syncs git: fleet files, the addon catalog, tenants</text>
<circle cx="40.0" cy="780.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="785" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="785.0" font-size="13.5" fill="#cbd5e1">Each fleet file becomes a Cluster API cluster on mgmt</text>
<circle cx="40.0" cy="808.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="813" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="813.0" font-size="13.5" fill="#cbd5e1">Cluster API creates the k3s cluster on docker, AWS or Hetzner</text>
<circle cx="40.0" cy="836.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="841" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="841.0" font-size="13.5" fill="#cbd5e1">Argo CD pushes the addons to every cluster whose labels</text>
<text class="s" x="60.0" y="860.0" font-size="13.5" fill="#cbd5e1">match</text>
<circle cx="506.0" cy="752.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="757" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="757.0" font-size="13.5" fill="#cbd5e1">OpenChoreo sends app releases to the cluster-agent, which</text>
<text class="s" x="526.0" y="776.0" font-size="13.5" fill="#cbd5e1">dials out to mgmt (mTLS)</text>
<circle cx="506.0" cy="799.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="804" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="804.0" font-size="13.5" fill="#cbd5e1">The agent applies them as app workloads in dp-* namespaces</text>
<circle cx="506.0" cy="827.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="832" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="832.0" font-size="13.5" fill="#cbd5e1">Kyverno admits only signed images and Pod Security baseline</text>
<text class="s" x="526.0" y="851.0" font-size="13.5" fill="#cbd5e1">pods</text>
