<text class="s" x="840.0" y="719.9" font-size="13" fill="#cbd5e1" text-anchor="middle">data plane</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">koorikla/platform · architecture</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Git is the only input. The mgmt cluster turns it into clusters, addons and app releases; the workload clusters (dev1, prod1) run the apps.</text>
<circle cx="360.0" cy="204.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="360.0" y="208.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="480.0" cy="304.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="308.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="640.0" cy="456.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="640.0" y="460.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="330.0" cy="456.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="330.0" y="460.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="840.0" cy="568.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="840.0" y="572.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="722.0" cy="696.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="722.0" y="700.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="478.0" cy="696.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="478.0" y="700.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="787" x2="932" y2="787" stroke="#8b9ab0" stroke-width="1.5"/>
<circle cx="40.0" cy="810.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="815" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="815.0" font-size="13.5" fill="#cbd5e1">Argo CD syncs git: fleet files, the addon catalog, tenants</text>
<circle cx="506.0" cy="810.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="815" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="815.0" font-size="13.5" fill="#cbd5e1">OpenChoreo sends app releases down the connection the</text>
<text class="s" x="526.0" y="834.0" font-size="13.5" fill="#cbd5e1">cluster-agent dials out (mTLS)</text>
<circle cx="40.0" cy="858.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="863" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="863.0" font-size="13.5" fill="#cbd5e1">Each fleet file becomes a Cluster API cluster on mgmt</text>
<circle cx="506.0" cy="858.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="863" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="863.0" font-size="13.5" fill="#cbd5e1">The agent applies them; every pod passes Kyverno admission</text>
<text class="s" x="526.0" y="882.0" font-size="13.5" fill="#cbd5e1">first</text>
<circle cx="40.0" cy="906.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="911" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="911.0" font-size="13.5" fill="#cbd5e1">Cluster API creates the k3s cluster on docker, AWS or Hetzner</text>
<circle cx="506.0" cy="906.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="911" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="911.0" font-size="13.5" fill="#cbd5e1">Kyverno admits only signed images and Pod Security baseline</text>
<text class="s" x="526.0" y="930.0" font-size="13.5" fill="#cbd5e1">pods into dp-* namespaces</text>
<circle cx="40.0" cy="954.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="959" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="959.0" font-size="13.5" fill="#cbd5e1">Argo CD pushes the addons to every cluster whose labels</text>
<text class="s" x="60.0" y="978.0" font-size="13.5" fill="#cbd5e1">match</text>
