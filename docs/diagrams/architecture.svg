<rect x="44" y="108" width="158" height="52" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="123.0" y="129.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Git</text>
<text class="s" x="123.0" y="149.4" font-size="13" fill="#dde5ef" text-anchor="middle">platform + app repos</text>
<rect x="44" y="264" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="123.0" y="299.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="123.0" y="319.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps engine</text>
<rect x="758" y="264" width="158" height="80" rx="8" fill="#1b2434" stroke="none" stroke-width="0"/>
<text class="s" x="837.0" y="290.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Shared services</text>
<text class="s" x="837.0" y="310.4" font-size="13" fill="#dde5ef" text-anchor="middle">image registry,</text>
<text class="s" x="837.0" y="328.4" font-size="13" fill="#dde5ef" text-anchor="middle">secrets, sign-in</text>
<rect x="44" y="424" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="123.0" y="450.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="123.0" y="470.4" font-size="13" fill="#dde5ef" text-anchor="middle">creates</text>
<text class="s" x="123.0" y="488.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters</text>
<rect x="520" y="424" width="396" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="718.0" y="459.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenChoreo</text>
<text class="s" x="718.0" y="479.4" font-size="13" fill="#dde5ef" text-anchor="middle">developer platform: builds, releases, telemetry</text>
<rect x="44" y="640" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="123.0" y="666.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">k3s nodes</text>
<text class="s" x="123.0" y="686.4" font-size="13" fill="#dde5ef" text-anchor="middle">servers and</text>
<text class="s" x="123.0" y="704.4" font-size="13" fill="#dde5ef" text-anchor="middle">workers</text>
<rect x="282" y="640" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="361.0" y="666.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Addons</text>
<text class="s" x="361.0" y="686.4" font-size="13" fill="#dde5ef" text-anchor="middle">network, mesh,</text>
<text class="s" x="361.0" y="704.4" font-size="13" fill="#dde5ef" text-anchor="middle">Kyverno policy</text>
<rect x="520" y="640" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="666.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="599.0" y="686.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s</text>
<text class="s" x="599.0" y="704.4" font-size="13" fill="#dde5ef" text-anchor="middle">agent</text>
<rect x="758" y="640" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="860.0" y="666.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Apps</text>
<text class="s" x="860.0" y="686.4" font-size="13" fill="#dde5ef" text-anchor="middle">your teams&#x27;</text>
<text class="s" x="860.0" y="704.4" font-size="13" fill="#dde5ef" text-anchor="middle">services</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">koorikla/platform · architecture</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Argo CD reads everything from Git; the management cluster turns it into clusters, addons and app releases, and the workload clusters run</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">the apps.</text>
<circle cx="784.0" cy="680.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="784.0" y="684.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<circle cx="123.0" cy="232.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="236.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="123.0" cy="384.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="388.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="560.0" cy="384.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="560.0" y="388.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="123.0" cy="550.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="554.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="361.0" cy="550.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="361.0" y="554.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<rect x="655.0" y="541.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="659.0" y="555.0" font-size="13" fill="#aab6c8">dials out</text>
<circle cx="639.0" cy="550.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="639.0" y="554.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="710.0" cy="680.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="684.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="766" x2="932" y2="766" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="789.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="794" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="794.0" font-size="13.5" fill="#dde5ef">Argo CD reads Git: fleet files, the addon catalog, teams and app repos</text>
<circle cx="40" cy="817.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="822" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="822.0" font-size="13.5" fill="#dde5ef">Argo CD turns each fleet file into a cluster for Cluster API to build</text>
<circle cx="40" cy="845.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="850" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="850.0" font-size="13.5" fill="#dde5ef">Argo CD hands each app&#x27;s release to OpenChoreo</text>
<circle cx="40" cy="873.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="878" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="878.0" font-size="13.5" fill="#dde5ef">Cluster API creates the cluster&#x27;s k3s nodes on docker, AWS or Hetzner</text>
<circle cx="40" cy="901.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="906" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="906.0" font-size="13.5" fill="#dde5ef">Argo CD installs the addons on every cluster whose labels match</text>
<circle cx="40" cy="929.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="934" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="934.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out to OpenChoreo and pulls the app releases</text>
<circle cx="40" cy="957.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="962" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="962.0" font-size="13.5" fill="#dde5ef">The agent deploys the apps</text>
<circle cx="40" cy="985.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="990" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="990.0" font-size="13.5" fill="#dde5ef">Apps start only after Kyverno, one of the addons, admits them: signed images, safe settings</text>
<rect x="28" y="1030" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1040.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1030" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1040.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="1030" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="1040.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 1062 L 70 1062" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="1062" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1066.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1066.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="422.3199" y="1053" width="24" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="429.3199" cy="1062" r="4" fill="#fbbf24"/>
<text class="s" x="454.3" y="1066.0" font-size="13" fill="#aab6c8">step at a component</text>
<rect x="607.18048" y="1056" width="20" height="13" rx="3" fill="#1b2434"/>
<text class="s" x="637.2" y="1066.0" font-size="13" fill="#aab6c8">context, not a step</text>
</svg>
