<rect x="44" y="108" width="158" height="52" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="123.0" y="129.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Git</text>
<text class="s" x="123.0" y="149.4" font-size="13" fill="#dde5ef" text-anchor="middle">platform + app repos</text>
<rect x="44" y="264" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="123.0" y="299.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="123.0" y="319.4" font-size="13" fill="#dde5ef" text-anchor="middle">GitOps engine</text>
<rect x="758" y="264" width="158" height="80" rx="8" fill="#263247" stroke="none" stroke-width="0"/>
<text class="s" x="837.0" y="290.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Shared services</text>
<text class="s" x="837.0" y="310.4" font-size="13" fill="#dde5ef" text-anchor="middle">image registry, sign-in,</text>
<text class="s" x="837.0" y="328.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenBao secrets</text>
<rect x="44" y="424" width="158" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="123.0" y="450.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="123.0" y="470.4" font-size="13" fill="#dde5ef" text-anchor="middle">creates</text>
<text class="s" x="123.0" y="488.4" font-size="13" fill="#dde5ef" text-anchor="middle">clusters</text>
<rect x="520" y="424" width="396" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="718.0" y="459.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenChoreo</text>
<text class="s" x="718.0" y="479.4" font-size="13" fill="#dde5ef" text-anchor="middle">developer platform: builds, releases, telemetry</text>
<rect x="282" y="640" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="361.0" y="666.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Addons</text>
<text class="s" x="361.0" y="686.4" font-size="13" fill="#dde5ef" text-anchor="middle">network, mesh,</text>
<text class="s" x="361.0" y="704.4" font-size="13" fill="#dde5ef" text-anchor="middle">Kyverno policy</text>
<rect x="520" y="640" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="599.0" y="666.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="599.0" y="686.4" font-size="13" fill="#dde5ef" text-anchor="middle">OpenChoreo&#x27;s</text>
<text class="s" x="599.0" y="704.4" font-size="13" fill="#dde5ef" text-anchor="middle">agent</text>
<rect x="758" y="640" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="837.0" y="666.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Apps</text>
<text class="s" x="837.0" y="686.4" font-size="13" fill="#dde5ef" text-anchor="middle">your teams&#x27;</text>
<text class="s" x="837.0" y="704.4" font-size="13" fill="#dde5ef" text-anchor="middle">services</text>
<rect x="282" y="800" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="361.0" y="826.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Operators</text>
<text class="s" x="361.0" y="846.4" font-size="13" fill="#dde5ef" text-anchor="middle">CloudNativePG</text>
<text class="s" x="361.0" y="864.4" font-size="13" fill="#dde5ef" text-anchor="middle">and MOCO</text>
<rect x="376.9" y="775" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="408.4" y="788.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="520" y="800" width="158" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="s" x="599.0" y="826.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Crossplane</text>
<text class="s" x="599.0" y="846.4" font-size="13" fill="#dde5ef" text-anchor="middle">turns app claims</text>
<text class="s" x="599.0" y="864.4" font-size="13" fill="#dde5ef" text-anchor="middle">into resources</text>
<rect x="614.9" y="775" width="63.1" height="19" rx="9.5" fill="#0b1120" stroke="#dde5ef" stroke-width="1.2"/>
<text class="s" x="646.4" y="788.8" font-size="12" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.6">OPT-IN</text>
<rect x="520" y="960" width="158" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="599.0" y="986.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cloud APIs</text>
<text class="s" x="599.0" y="1006.4" font-size="13" fill="#dde5ef" text-anchor="middle">RDS, Cloud SQL,</text>
<text class="s" x="599.0" y="1024.4" font-size="13" fill="#dde5ef" text-anchor="middle">Azure databases</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">koorikla/platform · architecture</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Argo CD reads everything from Git; the management cluster turns it into clusters, addons and app releases. The workload clusters run</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">the apps, and Crossplane on each one creates what the apps claim.</text>
<circle cx="123.0" cy="232.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="236.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="123.0" cy="384.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="388.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="560.0" cy="384.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="560.0" y="388.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="123.0" cy="550.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="123.0" y="554.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="361.0" cy="550.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="361.0" y="554.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="361.0" cy="616.0" r="3.6" fill="#fbbf24"/>
<rect x="655.0" y="541.0" width="59.3" height="20.0" rx="3" fill="#0b1120"/>
<text class="s" x="659.0" y="555.0" font-size="13" fill="#aab6c8">dials out</text>
<circle cx="639.0" cy="550.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="639.0" y="554.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="710.0" cy="680.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="684.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="782.0" cy="756.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="782.0" y="760.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<circle cx="876.0" cy="780.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="876.0" y="784.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<circle cx="486.0" cy="840.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="486.0" y="844.6" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">10</text>
<circle cx="599.0" cy="922.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="599.0" y="926.6" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">11</text>
<line x1="28" y1="1062" x2="932" y2="1062" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="1085.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1090" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="1090.0" font-size="13.5" fill="#dde5ef">Argo CD reads Git: fleet files, the addon catalog, teams and app repos</text>
<circle cx="40" cy="1113.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1118" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="1118.0" font-size="13.5" fill="#dde5ef">Argo CD turns each fleet file into a cluster for Cluster API to build</text>
<circle cx="40" cy="1141.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1146" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="1146.0" font-size="13.5" fill="#dde5ef">Argo CD hands each app&#x27;s release to OpenChoreo</text>
<circle cx="40" cy="1169.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1174" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="1174.0" font-size="13.5" fill="#dde5ef">Cluster API creates each workload cluster: k3s nodes on docker, AWS or Hetzner, or managed GKE</text>
<circle cx="40" cy="1197.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1202" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="1202.0" font-size="13.5" fill="#dde5ef">Argo CD installs the addons and the cluster-agent on every cluster whose labels match</text>
<circle cx="40" cy="1225.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1230" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="1230.0" font-size="13.5" fill="#dde5ef">The cluster-agent dials out to OpenChoreo and pulls the app releases</text>
<circle cx="40" cy="1253.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1258" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="1258.0" font-size="13.5" fill="#dde5ef">The agent submits the apps to the cluster</text>
<circle cx="40" cy="1281.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1286" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="1286.0" font-size="13.5" fill="#dde5ef">Kyverno, one of the addons, admits only apps with signed images and safe settings before they start</text>
<circle cx="40" cy="1309.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1314" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">9</text>
<text class="s" x="62.0" y="1314.0" font-size="13.5" fill="#dde5ef">Apps claim a database through an OpenChoreo resource binding; the claim goes to Crossplane on the same cluster</text>
<circle cx="40" cy="1337.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1342" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">10</text>
<text class="s" x="62.0" y="1342.0" font-size="13.5" fill="#dde5ef">Crossplane composes the claim into objects for an in-cluster operator where there is no managed database: CloudNativePG for</text>
<text class="s" x="62.0" y="1361.0" font-size="13.5" fill="#dde5ef">PostgreSQL, MOCO for MySQL</text>
<circle cx="40" cy="1384.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="1389" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">11</text>
<text class="s" x="62.0" y="1389.0" font-size="13.5" fill="#dde5ef">Crossplane&#x27;s cloud providers create it outside the cluster instead on cloud installations: RDS or Aurora, Cloud SQL or Azure Flexible</text>
<text class="s" x="62.0" y="1408.0" font-size="13.5" fill="#dde5ef">Server</text>
<text class="s" x="28.0" y="1440.0" font-size="13.5" fill="#aab6c8">Steps 10 and 11 are alternatives: each cluster&#x27;s facts pick one backend. The providers sign in with the cluster&#x27;s workload identity; per-app</text>
<text class="s" x="28.0" y="1459.0" font-size="13.5" fill="#aab6c8">cloud identities (IAM roles) are not composed yet.</text>
<rect x="28" y="1495" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="1505.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="1495" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="1505.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="1495" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="1505.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 1527 L 70 1527" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="1527" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="1531.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="1531.0" font-size="13" fill="#aab6c8">numbered step: arrow from the component that acts</text>
<rect x="424.3199" y="1521" width="20" height="13" rx="3" fill="#263247"/>
<text class="s" x="454.3" y="1531.0" font-size="13" fill="#aab6c8">context, not a step</text>
<g><rect x="594.93006" y="1518" width="28" height="18" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.3" stroke-dasharray="4 2.5"/><rect x="630.93006" y="1519" width="54.3" height="16" rx="8" fill="none" stroke="#dde5ef" stroke-width="1.2"/><text class="s" x="658.1" y="1531" font-size="11" font-weight="700" fill="#dde5ef" text-anchor="middle" letter-spacing="0.4">OPT-IN</text></g>
<text class="s" x="694.9" y="1531.0" font-size="13" fill="#aab6c8">opt-in, off by default</text>
</svg>
