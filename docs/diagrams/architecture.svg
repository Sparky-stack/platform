<text class="s" x="840.0" y="667.9" font-size="13" fill="#cbd5e1" text-anchor="middle">data plane</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">koorikla/platform · architecture</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Git is the only input. The mgmt cluster turns it into clusters, addons and app releases; workload clusters run the apps.</text>
<circle cx="360.0" cy="163.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="360.0" y="167.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="475.0" cy="268.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="475.0" y="272.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="572.0" cy="412.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="572.0" y="416.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="332.0" cy="412.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="332.0" y="416.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="840.0" cy="516.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="840.0" y="520.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
