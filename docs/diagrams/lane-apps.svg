<path class="fx" d="M 276.0 528.0 L 320.0 528.0 L 320.0 208.0 L 364.0 208.0" stroke="#fde5a7" style="animation-delay:0s,2.20s"/>
<path class="fx" d="M 480.0 248.0 L 480.0 328.0" stroke="#fde5a7" style="animation-delay:0s,3.30s"/>
<path class="fx" d="M 480.0 408.0 L 480.0 488.0" stroke="#fde5a7" style="animation-delay:0s,4.40s"/>
<path class="fx" d="M 596.0 528.0 L 640.0 528.0 L 640.0 368.0 L 684.0 368.0" stroke="#fde5a7" style="animation-delay:0s,5.50s"/>
<path class="fx" d="M 734.0 408.0 L 734.0 488.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<rect x="44" y="168" width="232" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="160.0" y="194.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">App repo</text>
<text class="s" x="160.0" y="214.4" font-size="13" fill="#dde5ef" text-anchor="middle">service code,</text>
<text class="s" x="160.0" y="232.4" font-size="13" fill="#dde5ef" text-anchor="middle">calls the platform CI</text>
<rect x="44" y="328" width="232" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="160.0" y="354.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Reusable CI</text>
<text class="s" x="160.0" y="374.4" font-size="13" fill="#dde5ef" text-anchor="middle">tests, scans, builds,</text>
<text class="s" x="160.0" y="392.4" font-size="13" fill="#dde5ef" text-anchor="middle">signs the image</text>
<rect x="44" y="488" width="232" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="160.0" y="514.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Registry</text>
<text class="s" x="160.0" y="534.4" font-size="13" fill="#dde5ef" text-anchor="middle">signed image,</text>
<text class="s" x="160.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">addressed by digest</text>
<rect x="364" y="168" width="232" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="480.0" y="194.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Deploy folder</text>
<text class="s" x="480.0" y="214.4" font-size="13" fill="#dde5ef" text-anchor="middle">the app repo&#x27;s</text>
<text class="s" x="480.0" y="232.4" font-size="13" fill="#dde5ef" text-anchor="middle">release files in git</text>
<rect x="364" y="328" width="232" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="354.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="480.0" y="374.4" font-size="13" fill="#dde5ef" text-anchor="middle">syncs the deploy</text>
<text class="s" x="480.0" y="392.4" font-size="13" fill="#dde5ef" text-anchor="middle">folder</text>
<rect x="364" y="488" width="232" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="480.0" y="514.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">OpenChoreo</text>
<text class="s" x="480.0" y="534.4" font-size="13" fill="#dde5ef" text-anchor="middle">cuts a release,</text>
<text class="s" x="480.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">promotes it</text>
<rect x="684" y="168" width="232" height="80" rx="8" fill="#263247" stroke="none" stroke-width="0"/>
<text class="s" x="800.0" y="194.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Promotion gate</text>
<text class="s" x="800.0" y="214.4" font-size="13" fill="#dde5ef" text-anchor="middle">staging to production:</text>
<text class="s" x="800.0" y="232.4" font-size="13" fill="#dde5ef" text-anchor="middle">see the SDLC view</text>
<rect x="684" y="328" width="232" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="800.0" y="354.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">cluster-agent</text>
<text class="s" x="800.0" y="374.4" font-size="13" fill="#dde5ef" text-anchor="middle">applies the release</text>
<text class="s" x="800.0" y="392.4" font-size="13" fill="#dde5ef" text-anchor="middle">in the cluster</text>
<rect x="684" y="488" width="232" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="823.0" y="514.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Kyverno</text>
<text class="s" x="823.0" y="534.4" font-size="13" fill="#dde5ef" text-anchor="middle">admits only signed</text>
<text class="s" x="823.0" y="552.4" font-size="13" fill="#dde5ef" text-anchor="middle">images by digest</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Apps lane · from a merge to a running, verified pod</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">The app repo&#x27;s reusable CI builds and signs one image; its digest goes back into the repo; Argo CD and OpenChoreo roll it out; Kyverno</text>
<text class="s" x="28.0" y="91.0" font-size="14" fill="#aab6c8">admits only that signed digest.</text>
<text class="s" x="44.0" y="134.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">BUILD AND SIGN</text>
<text class="s" x="364.0" y="134.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">DECLARE AND SYNC</text>
<text class="s" x="684.0" y="134.0" font-size="13" fill="#dde5ef" font-weight="700" letter-spacing="1.0">RUN AND ADMIT</text>
<circle cx="710.0" cy="528.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="710.0" y="532.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<circle cx="160.0" cy="288.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="160.0" y="292.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="160.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="160.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="320.0" cy="368.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="320.0" y="372.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="480.0" cy="288.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="292.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="480.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="640.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="640.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="734.0" cy="448.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="734.0" y="452.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<line x1="28" y1="590" x2="932" y2="590" stroke="#7c8aa0" stroke-width="1.2"/>
<circle cx="40" cy="613.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="618" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="618.0" font-size="13.5" fill="#dde5ef">App repo: a merge to main runs the reusable CI workflow it pins by commit (app-go.yaml and the other stacks, each calling</text>
<text class="s" x="62.0" y="637.0" font-size="13.5" fill="#dde5ef">app-container.yaml): lint, tests, vulnerability scan, multi-arch build</text>
<circle cx="40" cy="660.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="665" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="665.0" font-size="13.5" fill="#dde5ef">Reusable CI pushes the image to ghcr.io and signs it keyless with cosign, with SBOM, provenance and vulnerability attestations</text>
<circle cx="40" cy="688.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="693" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="693.0" font-size="13.5" fill="#dde5ef">Registry digest goes into the app repo: app-workload-bump.yaml commits the image digest to the Workload in deploy/ ([skip ci])</text>
<circle cx="40" cy="716.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="721" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="721.0" font-size="13.5" fill="#dde5ef">Deploy folder is synced by Argo CD (the team&#x27;s Application) into OpenChoreo: Component, Workload, ReleaseBinding</text>
<circle cx="40" cy="744.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="749" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="749.0" font-size="13.5" fill="#dde5ef">Argo CD hands them to the OpenChoreo control plane, which cuts one immutable release and binds it to development</text>
<circle cx="40" cy="772.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="777" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="62.0" y="777.0" font-size="13.5" fill="#dde5ef">OpenChoreo passes the release to the cluster-agent over the connection the agent opened from the workload cluster</text>
<circle cx="40" cy="800.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="805" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="805.0" font-size="13.5" fill="#dde5ef">cluster-agent applies the release in the environment&#x27;s namespace, where Kyverno sees every pod first</text>
<circle cx="40" cy="828.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="833" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="833.0" font-size="13.5" fill="#dde5ef">Kyverno verifies the image signature, attestations and digest before the pod starts: it blocks in production and only warns in development</text>
<text class="s" x="62.0" y="852.0" font-size="13.5" fill="#dde5ef">and staging</text>
<text class="s" x="28.0" y="884.0" font-size="13.5" fill="#aab6c8">Promotion: the same release moves to staging and production by pull requests, the promotion gate opens the production one (see the SDLC</text>
<text class="s" x="28.0" y="903.0" font-size="13.5" fill="#aab6c8">view, which also shows the in-cluster build path with Harbor and the platform key).</text>
<rect x="28" y="939" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="949.0" font-size="13" fill="#aab6c8">runs on the management cluster</text>
<rect x="283.60519999999997" y="939" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="313.6" y="949.0" font-size="13" fill="#aab6c8">runs on the workload cluster</text>
<rect x="513.9241" y="939" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="543.9" y="949.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 26 971 L 70 971" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="42" cy="971" r="9" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="42" y="975.5" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="80.0" y="975.0" font-size="13" fill="#aab6c8">numbered step: the change moves along the arrow</text>
<rect x="416.97326000000004" y="961" width="26" height="20" rx="4" fill="none" stroke="#dde5ef" stroke-width="1.2"/><circle cx="426.97326000000004" cy="971" r="7" fill="#fbbf24"/><text class="s" x="426.97326000000004" y="975.2" font-size="11" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="449.0" y="975.0" font-size="13" fill="#aab6c8">step at a component</text>
<rect x="601.83384" y="965" width="20" height="13" rx="3" fill="#263247"/>
<text class="s" x="631.8" y="975.0" font-size="13" fill="#aab6c8">context, not a step</text>
</svg>
