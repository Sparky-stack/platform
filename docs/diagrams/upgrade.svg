<path class="fx" d="M 200.0 336.0 L 280.0 336.0" stroke="#fde5a7" style="animation-delay:0s,4.40s"/>
<path class="fx" d="M 140.0 376.0 L 140.0 412.0 L 600.0 412.0 L 600.0 376.0" stroke="#fde5a7" style="animation-delay:0s,6.60s"/>
<path class="fx" d="M 80.0 376.0 L 80.0 456.0 L 840.0 456.0 L 840.0 376.0" stroke="#fde5a7" style="animation-delay:0s,7.70s"/>
<rect x="40" y="120" width="160" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="120.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Renovate</text>
<text class="s" x="120.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">proposes every</text>
<text class="s" x="120.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">version bump</text>
<rect x="280" y="120" width="160" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="360.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Pull request</text>
<text class="s" x="360.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">one bump</text>
<text class="s" x="360.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">per PR</text>
<rect x="520" y="120" width="160" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="600.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">CI</text>
<text class="s" x="600.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">renders and tests</text>
<text class="s" x="600.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">every install</text>
<rect x="760" y="120" width="160" height="80" rx="8" fill="#262e3e" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="840.0" y="146.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Main branch</text>
<text class="s" x="840.0" y="166.4" font-size="13" fill="#dde5ef" text-anchor="middle">reviewed and</text>
<text class="s" x="840.0" y="184.4" font-size="13" fill="#dde5ef" text-anchor="middle">merged</text>
<rect x="40" y="296" width="160" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="120.0" y="322.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="120.0" y="342.4" font-size="13" fill="#dde5ef" text-anchor="middle">syncs clusters</text>
<text class="s" x="120.0" y="360.4" font-size="13" fill="#dde5ef" text-anchor="middle">from main</text>
<rect x="280" y="296" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="374.8" y="322.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Dev clusters</text>
<text class="s" x="374.8" y="342.4" font-size="13" fill="#dde5ef" text-anchor="middle">follow main</text>
<text class="s" x="374.8" y="360.4" font-size="13" fill="#dde5ef" text-anchor="middle">first</text>
<rect x="520" y="296" width="160" height="80" rx="8" fill="#173248" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="600.0" y="322.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Prod clusters</text>
<text class="s" x="600.0" y="342.4" font-size="13" fill="#dde5ef" text-anchor="middle">follow a</text>
<text class="s" x="600.0" y="360.4" font-size="13" fill="#dde5ef" text-anchor="middle">verified commit</text>
<rect x="760" y="296" width="160" height="80" rx="8" fill="#15363f" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="840.0" y="322.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="840.0" y="342.4" font-size="13" fill="#dde5ef" text-anchor="middle">replaces servers</text>
<text class="s" x="840.0" y="360.4" font-size="13" fill="#dde5ef" text-anchor="middle">one at a time</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f8fafc" font-weight="700">Upgrade flow · every upgrade is a pull request</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#aab6c8">Renovate proposes, CI proves, Argo CD rolls out dev before prod; Kubernetes versions roll through Cluster API.</text>
<circle cx="304.0" cy="336.0" r="11" fill="#0b1120" stroke="#fbbf24" stroke-width="2.4"/>
<text class="s" x="304.0" y="340.6" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">6</text>
<circle cx="232.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="232.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="472.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="472.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="712.0" cy="160.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="712.0" y="164.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="472.0" cy="248.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="472.0" y="252.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="232.0" cy="336.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="232.0" y="340.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="370.0" cy="412.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="370.0" y="416.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="720.0" cy="456.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="720.0" y="460.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="490" x2="932" y2="490" stroke="#64748b" stroke-width="1.2"/>
<circle cx="40" cy="513.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="518" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="62.0" y="518.0" font-size="13.5" fill="#dde5ef">Renovate opens a pull request: a Helm chart, a k3s release, an image digest or a tool pin</text>
<circle cx="40" cy="541.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="546" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="62.0" y="546.0" font-size="13.5" fill="#dde5ef">The pull request runs CI: every chart rendered for every installation; lint, schema, unit and contract tests on Linux (x86, arm), macOS,</text>
<text class="s" x="62.0" y="565.0" font-size="13.5" fill="#dde5ef">Windows and the devcontainers</text>
<circle cx="40" cy="588.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="593" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="62.0" y="593.0" font-size="13.5" fill="#dde5ef">CI must pass and a maintainer reviews; then the pull request is squash-merged into main</text>
<circle cx="40" cy="616.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="621" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="62.0" y="621.0" font-size="13.5" fill="#dde5ef">Argo CD reads main for every cluster that follows it (addonsRevision: HEAD)</text>
<circle cx="40" cy="644.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="649" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="62.0" y="649.0" font-size="13.5" fill="#dde5ef">Argo CD syncs the dev clusters first; sync waves order each app (e.g. istiod before ztunnel)</text>
<circle cx="40" cy="672.5" r="10" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="40" y="677" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">6</text>
<text class="s" x="62.0" y="677.0" font-size="13.5" fill="#dde5ef">Dev clusters are verified: every Argo CD app Synced and Healthy, task status green</text>
<circle cx="40" cy="700.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="705" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="62.0" y="705.0" font-size="13.5" fill="#dde5ef">Argo CD syncs the prod clusters only after a pull request moves their addonsRevision to the verified commit</text>
<circle cx="40" cy="728.5" r="11" fill="#fbbf24"/>
<text class="s" x="40" y="733" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="62.0" y="733.0" font-size="13.5" fill="#dde5ef">Argo CD hands a kubernetesVersion bump to Cluster API, which replaces servers one at a time (3 keep quorum)</text>
<rect x="28" y="773" width="20" height="13" rx="3" fill="#15363f" stroke="#2dd4bf" stroke-width="1.4"/>
<text class="s" x="58.0" y="783.0" font-size="13" fill="#aab6c8">mgmt cluster</text>
<rect x="162.86294" y="773" width="20" height="13" rx="3" fill="#173248" stroke="#38bdf8" stroke-width="1.4"/>
<text class="s" x="192.9" y="783.0" font-size="13" fill="#aab6c8">workload cluster</text>
<rect x="318.40966000000003" y="773" width="20" height="13" rx="3" fill="#262e3e" stroke="#94a3b8" stroke-width="1.4"/>
<text class="s" x="348.4" y="783.0" font-size="13" fill="#aab6c8">outside the clusters</text>
<path d="M 491.12436 779 L 527.12436 779" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#ahfbbf24)"/>
<circle cx="505.12436" cy="779" r="7" fill="#fbbf24" stroke="#0b1120" stroke-width="1.5"/>
<text class="s" x="537.1" y="783.0" font-size="13" fill="#aab6c8">numbered step</text>
<circle cx="665.03696" cy="779" r="8" fill="#0b1120" stroke="#fbbf24" stroke-width="2.2"/>
<text class="s" x="685.0" y="783.0" font-size="13" fill="#aab6c8">step inside a component</text>
</svg>
