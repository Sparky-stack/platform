<rect x="40" y="112" width="160" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="120.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Renovate</text>
<text class="s" x="120.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">charts, k3s, digests,</text>
<text class="s" x="120.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">CI tools</text>
<rect x="280" y="112" width="160" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="360.0" y="147.7" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">pull request</text>
<text class="s" x="360.0" y="167.2" font-size="13" fill="#cbd5e1" text-anchor="middle">one bump per PR</text>
<rect x="520" y="112" width="160" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="600.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">CI</text>
<text class="s" x="600.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">render, lint, tests</text>
<text class="s" x="600.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">4 OSes, x86 + arm</text>
<rect x="760" y="112" width="160" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="840.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">main</text>
<text class="s" x="840.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">review +</text>
<text class="s" x="840.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">squash merge</text>
<rect x="760" y="272" width="160" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="840.0" y="298.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="840.0" y="318.4" font-size="13" fill="#cbd5e1" text-anchor="middle">clusters that follow</text>
<text class="s" x="840.0" y="335.9" font-size="13" fill="#cbd5e1" text-anchor="middle">HEAD sync first</text>
<rect x="520" y="272" width="160" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="600.0" y="298.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">dev clusters</text>
<text class="s" x="600.0" y="318.4" font-size="13" fill="#cbd5e1" text-anchor="middle">sync waves inside</text>
<text class="s" x="600.0" y="335.9" font-size="13" fill="#cbd5e1" text-anchor="middle">each app</text>
<rect x="280" y="272" width="160" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="360.0" y="298.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">verify</text>
<text class="s" x="360.0" y="318.4" font-size="13" fill="#cbd5e1" text-anchor="middle">apps Synced/Healthy</text>
<text class="s" x="360.0" y="335.9" font-size="13" fill="#cbd5e1" text-anchor="middle">task status</text>
<rect x="40" y="272" width="160" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="120.0" y="298.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">prod clusters</text>
<text class="s" x="120.0" y="318.4" font-size="13" fill="#cbd5e1" text-anchor="middle">pinned</text>
<text class="s" x="120.0" y="335.9" font-size="13" fill="#cbd5e1" text-anchor="middle">addonsRevision</text>
<rect x="760" y="432" width="160" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="840.0" y="458.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="840.0" y="478.4" font-size="13" fill="#cbd5e1" text-anchor="middle">replaces servers</text>
<text class="s" x="840.0" y="495.9" font-size="13" fill="#cbd5e1" text-anchor="middle">one at a time</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Upgrade flow · every upgrade is a pull request</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Renovate proposes, CI proves, Argo CD rolls out in sync-wave order, dev before prod; Kubernetes versions roll through Cluster API.</text>
<circle cx="240.0" cy="152.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="240.0" y="156.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="480.0" cy="152.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="156.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="720.0" cy="152.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="720.0" y="156.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="840.0" cy="232.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="840.0" y="236.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="720.0" cy="312.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="720.0" y="316.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="480.0" cy="312.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="480.0" y="316.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="240.0" cy="312.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="240.0" y="316.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="840.0" cy="392.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="840.0" y="396.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="532" x2="932" y2="532" stroke="#8b9ab0" stroke-width="1.5"/>
<circle cx="40.0" cy="555.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="560" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="560.0" font-size="13.5" fill="#cbd5e1">Renovate opens a PR: a Helm chart, a k3s release, an image</text>
<text class="s" x="60.0" y="579.0" font-size="13.5" fill="#cbd5e1">digest or a tool pin</text>
<circle cx="506.0" cy="555.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="560" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="560.0" font-size="13.5" fill="#cbd5e1">Dev clusters sync first; sync waves order each app (e.g. istiod</text>
<text class="s" x="526.0" y="579.0" font-size="13.5" fill="#cbd5e1">before ztunnel)</text>
<circle cx="40.0" cy="603.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="608" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="608.0" font-size="13.5" fill="#cbd5e1">CI renders every chart for every installation and runs lint,</text>
<text class="s" x="60.0" y="627.0" font-size="13.5" fill="#cbd5e1">kubeconform, unit and contract tests on Linux x86 and arm,</text>
<text class="s" x="60.0" y="646.0" font-size="13.5" fill="#cbd5e1">macOS, Windows and the devcontainers</text>
<circle cx="506.0" cy="603.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="608" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="608.0" font-size="13.5" fill="#cbd5e1">Verify: Argo CD apps Synced/Healthy and task status</text>
<circle cx="40.0" cy="670.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="675" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="675.0" font-size="13.5" fill="#cbd5e1">Review, then squash merge to main</text>
<circle cx="506.0" cy="670.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="675" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="675.0" font-size="13.5" fill="#cbd5e1">Prod follows when its addonsRevision moves to the verified ref</text>
<text class="s" x="526.0" y="694.0" font-size="13.5" fill="#cbd5e1">(a PR to its fleet file)</text>
<circle cx="40.0" cy="718.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="723" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="723.0" font-size="13.5" fill="#cbd5e1">Argo CD picks up main for every cluster that follows HEAD</text>
<text class="s" x="60.0" y="742.0" font-size="13.5" fill="#cbd5e1">(addonsRevision)</text>
<circle cx="506.0" cy="718.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="723" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="723.0" font-size="13.5" fill="#cbd5e1">A kubernetesVersion bump makes Cluster API replace servers</text>
<text class="s" x="526.0" y="742.0" font-size="13.5" fill="#cbd5e1">one at a time (3 keep quorum)</text>
<rect x="28" y="787" width="20" height="13" rx="3" fill="#173e45" stroke="#2dd4bf" stroke-width="1.3"/>
<text class="s" x="58.0" y="797.0" font-size="13" fill="#94a3b8">mgmt cluster</text>
<rect x="162.86294" y="787" width="20" height="13" rx="3" fill="#193951" stroke="#38bdf8" stroke-width="1.3"/>
<text class="s" x="192.9" y="797.0" font-size="13" fill="#94a3b8">workload cluster</text>
<rect x="318.40966000000003" y="787" width="20" height="13" rx="3" fill="#2b3444" stroke="#94a3b8" stroke-width="1.3"/>
<text class="s" x="348.4" y="797.0" font-size="13" fill="#94a3b8">git, GitHub, outside</text>
<path d="M 489.59478 793 L 511.59478 793" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 489.59478 793 L 511.59478 793" stroke="#fde5a7" style="animation-delay:0s,0.00s"/>
<text class="s" x="521.6" y="797.0" font-size="13" fill="#94a3b8">numbered flow (animated)</text>
</svg>
