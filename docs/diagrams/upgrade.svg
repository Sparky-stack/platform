<rect x="32" y="112" width="176" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="120.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Renovate</text>
<text class="s" x="120.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">charts, k3s, digests,</text>
<text class="s" x="120.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">CI tools</text>
<rect x="272" y="112" width="176" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="360.0" y="147.7" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">pull request</text>
<text class="s" x="360.0" y="167.2" font-size="13" fill="#cbd5e1" text-anchor="middle">one bump per PR</text>
<rect x="512" y="112" width="176" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="600.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">CI</text>
<text class="s" x="600.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">render · lint · tests</text>
<text class="s" x="600.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">Linux, arm, macOS, Win</text>
<rect x="752" y="112" width="176" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="840.0" y="138.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">main</text>
<text class="s" x="840.0" y="158.4" font-size="13" fill="#cbd5e1" text-anchor="middle">review +</text>
<text class="s" x="840.0" y="175.9" font-size="13" fill="#cbd5e1" text-anchor="middle">squash merge</text>
<rect x="752" y="256" width="176" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="840.0" y="282.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Argo CD</text>
<text class="s" x="840.0" y="302.4" font-size="13" fill="#cbd5e1" text-anchor="middle">clusters that follow</text>
<text class="s" x="840.0" y="319.9" font-size="13" fill="#cbd5e1" text-anchor="middle">HEAD sync first</text>
<rect x="512" y="256" width="176" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="600.0" y="282.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">dev clusters</text>
<text class="s" x="600.0" y="302.4" font-size="13" fill="#cbd5e1" text-anchor="middle">sync waves inside</text>
<text class="s" x="600.0" y="319.9" font-size="13" fill="#cbd5e1" text-anchor="middle">each app</text>
<rect x="272" y="256" width="176" height="80" rx="8" fill="#2b3444" stroke="#94a3b8" stroke-width="1.5"/>
<text class="s" x="360.0" y="282.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">verify</text>
<text class="s" x="360.0" y="302.4" font-size="13" fill="#cbd5e1" text-anchor="middle">apps Synced/Healthy</text>
<text class="s" x="360.0" y="319.9" font-size="13" fill="#cbd5e1" text-anchor="middle">task status</text>
<rect x="32" y="256" width="176" height="80" rx="8" fill="#193951" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s" x="120.0" y="282.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">prod clusters</text>
<text class="s" x="120.0" y="302.4" font-size="13" fill="#cbd5e1" text-anchor="middle">pinned</text>
<text class="s" x="120.0" y="319.9" font-size="13" fill="#cbd5e1" text-anchor="middle">addonsRevision</text>
<rect x="752" y="400" width="176" height="80" rx="8" fill="#173e45" stroke="#2dd4bf" stroke-width="1.5"/>
<text class="s" x="840.0" y="426.9" font-size="15" fill="#f1f5f9" font-weight="600" text-anchor="middle">Cluster API</text>
<text class="s" x="840.0" y="446.4" font-size="13" fill="#cbd5e1" text-anchor="middle">replaces servers</text>
<text class="s" x="840.0" y="463.9" font-size="13" fill="#cbd5e1" text-anchor="middle">one at a time</text>
<text class="s" x="28.0" y="46.0" font-size="24" fill="#f1f5f9" font-weight="700">Upgrade flow · every upgrade is a pull request</text>
<text class="s" x="28.0" y="72.0" font-size="14" fill="#94a3b8">Renovate proposes, CI proves, Argo CD rolls out in sync-wave order, dev before prod; Kubernetes versions roll through Cluster API.</text>
<circle cx="235.0" cy="152.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="235.0" y="156.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<circle cx="475.0" cy="152.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="475.0" y="156.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<circle cx="715.0" cy="152.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="715.0" y="156.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<circle cx="840.0" cy="219.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="840.0" y="223.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<circle cx="725.0" cy="296.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="725.0" y="300.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<circle cx="485.0" cy="296.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="485.0" y="300.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<circle cx="245.0" cy="296.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="245.0" y="300.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<circle cx="840.0" cy="363.0" r="12" fill="#fbbf24" stroke="#0b1120" stroke-width="2"/>
<text class="s" x="840.0" y="367.6" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<line x1="28" y1="500" x2="932" y2="500" stroke="#64748b" stroke-width="1.5"/>
<circle cx="40.0" cy="517.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="522" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">1</text>
<text class="s" x="60.0" y="522.0" font-size="13.5" fill="#cbd5e1">Renovate opens a PR: a Helm chart, a k3s release, an image</text>
<text class="s" x="60.0" y="541.0" font-size="13.5" fill="#cbd5e1">digest or a tool pin</text>
<circle cx="40.0" cy="564.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="569" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">2</text>
<text class="s" x="60.0" y="569.0" font-size="13.5" fill="#cbd5e1">CI renders every chart for every installation and runs lint,</text>
<text class="s" x="60.0" y="588.0" font-size="13.5" fill="#cbd5e1">kubeconform, unit and contract tests on Linux x86 and arm,</text>
<text class="s" x="60.0" y="607.0" font-size="13.5" fill="#cbd5e1">macOS, Windows and the devcontainers</text>
<circle cx="40.0" cy="630.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="635" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">3</text>
<text class="s" x="60.0" y="635.0" font-size="13.5" fill="#cbd5e1">Review, then squash merge to main</text>
<circle cx="40.0" cy="658.5" r="11" fill="#fbbf24"/>
<text class="s" x="40.0" y="663" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">4</text>
<text class="s" x="60.0" y="663.0" font-size="13.5" fill="#cbd5e1">Argo CD picks up main for every cluster that follows HEAD</text>
<text class="s" x="60.0" y="682.0" font-size="13.5" fill="#cbd5e1">(addonsRevision)</text>
<circle cx="506.0" cy="517.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="522" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">5</text>
<text class="s" x="526.0" y="522.0" font-size="13.5" fill="#cbd5e1">Dev clusters sync first; sync waves order each app (e.g. istiod</text>
<text class="s" x="526.0" y="541.0" font-size="13.5" fill="#cbd5e1">before ztunnel)</text>
<circle cx="506.0" cy="564.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="569" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">6</text>
<text class="s" x="526.0" y="569.0" font-size="13.5" fill="#cbd5e1">Verify: Argo CD apps Synced/Healthy and task status</text>
<circle cx="506.0" cy="592.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="597" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">7</text>
<text class="s" x="526.0" y="597.0" font-size="13.5" fill="#cbd5e1">Prod follows when its addonsRevision moves to the verified ref</text>
<text class="s" x="526.0" y="616.0" font-size="13.5" fill="#cbd5e1">(a PR to its fleet file)</text>
<circle cx="506.0" cy="639.5" r="11" fill="#fbbf24"/>
<text class="s" x="506.0" y="644" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">8</text>
<text class="s" x="526.0" y="644.0" font-size="13.5" fill="#cbd5e1">A kubernetesVersion bump makes Cluster API replace servers</text>
<text class="s" x="526.0" y="663.0" font-size="13.5" fill="#cbd5e1">one at a time (3 keep quorum)</text>
<rect x="28" y="726" width="20" height="13" rx="3" fill="#173e45" stroke="#2dd4bf" stroke-width="1.3"/>
<text class="s" x="58.0" y="736.0" font-size="13" fill="#94a3b8">mgmt cluster</text>
<rect x="162.86294" y="726" width="20" height="13" rx="3" fill="#193951" stroke="#38bdf8" stroke-width="1.3"/>
<text class="s" x="192.9" y="736.0" font-size="13" fill="#94a3b8">workload cluster</text>
<rect x="318.40966000000003" y="726" width="20" height="13" rx="3" fill="#2b3444" stroke="#94a3b8" stroke-width="1.3"/>
<text class="s" x="348.4" y="736.0" font-size="13" fill="#94a3b8">git, GitHub, outside</text>
<path d="M 489.59478 732 L 511.59478 732" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#ahfbbf24)"/>
<path class="fx" d="M 489.59478 732 L 511.59478 732" stroke="#fde5a7" style="animation-delay:0s,0.00s"/>
<text class="s" x="521.6" y="736.0" font-size="13" fill="#94a3b8">numbered flow (animated)</text>
</svg>
