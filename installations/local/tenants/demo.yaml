# Tenant = one OpenChoreo Project + its app repos (schema: charts/tenant/values.yaml). Adding a file here onboards the
# project; each app repo then owns its OpenChoreo manifests under <path> (docs/openchoreo.md "App repo contract").
project: demo
description: Demo project - hello-world
apps:
  - name: hello-world
    repoURL: https://github.com/koorikla/hello-world.git
    path: deploy/openchoreo      # default
    revision: main               # default
# DEMO ONLY: values hello-world's SecretReference (deploy/openchoreo/greeting-secret.yaml) points to, seeded into
# kv-tenant-demo on every clean bootstrap by PushSecret openbao-tenants/demo-seed-hello-world as demo-writer (generated
# "demo-only-<hex>", never in git, never overwritten). Real tenants write their own values (docs/multicluster.md).
demoSecrets:
  - key: hello-world
    property: greeting
