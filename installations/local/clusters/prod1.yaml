name: prod1
provider: docker
region: local
environment: production
cni: flannel                # exercise the flannel path locally; dev1 runs the default (cilium)
kubernetesVersion: v1.35.10+k3s1
controlPlane:
  replicas: 1
workers:
  - name: md-0
    replicas: 0
openchoreo:
  dataPlane:
    enabled: true
    gatewayHost: prod1.apps.localhost
    environments: []        # production moved to dev1 (#115); dataPlaneRef is immutable, so prod1 stays up until
                            # OpenChoreo has cleaned its production namespaces, then the file is disabled
mesh:
  group: local              # east-west connectivity with the other members (docs/multicluster.md)
addonsRevision: HEAD
addons: {}
