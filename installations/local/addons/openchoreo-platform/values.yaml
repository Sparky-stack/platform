# Local installation: the workflow plane runs on mgmt, whose pods cannot resolve data-plane app hosts
# (<env>-<org ns>.<cluster>.apps.localhost:19080 - CAPD node containers have no stable DNS name or load balancer for
# the app Gateway). The gate's HTTP probe is off here; readiness, observer and freeze checks still run. In a cloud
# installation the app hosts resolve publicly and the probe stays on (docs/promotion.md). VERIFY
promotionGate:
  smoke:
    http: false

# TEMPORARY (#115): production leaves the pipeline while its Environment moves from prod1 to dev1. OpenChoreo blocks
# deleting an Environment a DeploymentPipeline references, and dataPlaneRef is immutable. Reverted once production is
# Ready on dev1.
deploymentPipeline:
  environments: [development, staging]
