# Addon crossplane on this installation's mgmt (cluster mgmt). GitHub repository governance (docs/github-repos.md):
# the GitHub App koorikla-repo-admin (bootstrap seeds it from GITHUB_REPO_ADMIN_APP_*, docs/forking.md) and the
# repositories it governs. A fork without that App: githubRepos.enabled false, or your own owner and repositories.
githubRepos:
  enabled: true
  owner: Sparky-stack
  repositories:
    # The two repositories existed before governance: Observe reads them, nothing on GitHub changes. Switching one to
    # `management: Full` (one line) makes Crossplane enforce the spec below; review the observed-vs-desired diff
    # first (docs/github-repos.md "Switch to full management").
    platform:
      management: Observe
      description: "Cloud-agnostic platform: Cluster API + OpenChoreo + ESO + Argo CD"
      requiredChecks: [validate]              # .github/workflows/ci.yaml: the one always-running merge gate
      bypassApps: [5788333]                   # koorikla-promotion-gate: release-please (release.yaml) runs as this App
      rulesetId: "27395845"                   # the hand-made ruleset "main": Full rewrites it instead of adding one
    hello-world:
      management: Observe
      description: Hello-world app for Sparky-stack/platform (OpenChoreo component)
      requiredChecks:                         # hello-world .github/workflows/ci.yaml (platform app-go.yaml)
        - "checks / vet, lint, test, govulncheck"
        - "checks / manifests / OpenChoreo manifests"
      bypassApps: [5788333]                   # koorikla-promotion-gate: GitOps hand-off commits, promotion PRs
  # id: the team's numeric GitHub id, so a rebuilt Crossplane adopts the existing team instead of failing to create it
  # (gh api orgs/<org>/teams -q '.[]|"\(.slug) \(.id)"'). Omit it only for a team that does not exist yet.
  teams:
    platform-engineers:
      id: 20876274
      description: "Platform engineers: cluster admins, platform repo admins, and break-glass maintainers"
      repositories:
        platform: admin
        hello-world: maintain
    developers:
      id: 20876272
      description: "Application developers: push to app repos, deploy to non-prod, read-only elsewhere"
      repositories:
        hello-world: push
        platform: pull
    qa:
      id: 20876273
      description: "QA engineers: triage app repos and read-only platform visibility"
      repositories:
        hello-world: triage
        platform: pull
    release-managers:
      id: 20876276
      description: "Release managers: approve production promotions and maintain app repos"
      repositories:
        hello-world: maintain
        platform: pull
