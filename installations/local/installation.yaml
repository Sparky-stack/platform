# Installation "local": k3d mgmt + CAPD workload clusters on this machine.
# Consumed by charts/platform (root app values) and passed to every generated Application as `installation.*`.
installation:
  name: local
  repoURL: https://github.com/koorikla/platform.git
  revision: main
  githubOrg: https://github.com/koorikla      # repo-creds prefix (covers app repos too)
  domain: localhost                           # base domain for platform endpoints

# The management cluster itself (not CAPI-managed in this installation: k3d).
mgmt:
  name: mgmt
  provider: docker
  region: local
  environment: mgmt
  addons:                                     # addons.platform.koorikla.io/<addon> overrides for mgmt
    mesh-root-ca: true                        # shared Istio mesh root for the fleet files' mesh.group (docs/multicluster.md)

secrets:
  backend: kubernetes                         # kubernetes | aws | vault
  kubernetes:
    namespace: platform-secrets               # seeded by `make secrets` (stand-in for a real vault)
  # No k3s registries.yaml / platform-ghcr: every image this installation pulls from ghcr.io is public (koorikla/
  # hello-world, koorikla/ci-toolbox: anonymous pull checked 2026-11). Private images: true + GHCR_* (docs/forking.md).
  nodeRegistryAuth:
    enabled: false

capi:
  providers:
    docker: true
    aws: false
    hetzner: false

openchoreo:
  orgNamespace: default
  controlPlane:
    host: openchoreo.localhost                 # console; api.<host>, thunder.<host> derive from it
    # URL workload-cluster agents dial. Locally resolved to mgmt by the coredns-local addon. VERIFY
    clusterGatewayURL: wss://cluster-gateway.openchoreo.localhost:8443/ws
  # Observability plane on mgmt (addon openchoreo-observability-plane) + data-plane telemetry (addon telemetry).
  # Endpoints: observer.<host>:<httpPort>, {opentelemetry,prometheus}.observability.<host>:<httpPort> (HTTP),
  # opensearch.observability.<host>:<tlsPort> (TLS passthrough). docs/observability.md.
  observability:
    enabled: true                              # false: no observabilityPlaneRef; disable the two addons too
    httpPort: 11080                            # k3d publishes 11080/11085 on the mgmt load balancer
    tlsPort: 11085

# Examples (examples/<name>, applied by Argo CD to matching clusters; docs/multicluster.md "Example").
examples:
  eastwest:
    enabled: true                              # echo on prod1, callers on dev1 (installations/local/examples/eastwest/)
