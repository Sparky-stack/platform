# Crossplane Project of the mysql API: `crossplane project build` makes ghcr.io/koorikla/platform/mysql (docs/crossplane.md).
# Keep the dependency floors in step with the digests addons/crossplane pins.
apiVersion: dev.crossplane.io/v1alpha1
kind: Project
metadata:
  name: mysql
spec:
  dependencies:
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs
        version: '>=v0.9.2'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-go-templating
        version: '>=v0.13.2'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
        version: '>=v0.7.3'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-aws-rds
        version: '>=v2.9.0'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-sql
        version: '>=v3.1.0'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-azure-dbformysql
        version: '>=v2.8.0'
  repository: ghcr.io/koorikla/platform/mysql
  description: MySQL as a service
  maintainer: koorikla platform
  source: github.com/koorikla/platform/tree/main/packages/mysql
  crossplane:
    version: '>=v2.4.0'
