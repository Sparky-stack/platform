# The one Composition of the MySQL API (pipeline mode), same shape as packages/postgresql:
#   1. function-environment-configs loads the cluster's facts, EnvironmentConfig platform-mysql (required).
#   2. function-go-templating dispatches on $facts.backend to one {{ define }} per backend (moco | aws-rds |
#      gcp-cloudsql | azure-flexible); an unknown backend fails the render. "connection-secret" is the one partial
#      shared by moco / gcp / azure: an ESO Password generator + the <name>-mysql Secret with the fixed keys.
#   3. function-auto-ready derives the XR's readiness.
# Status: layout. moco is render-tested offline; the cloud blocks are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: mysql
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: MySQL
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-mysql
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- /* connection-secret (dict name host db query): the password is generated in-cluster by ESO once
            (CreatedOnce: deleting the Secret rotates it); Crossplane's pipeline never sees it. */}}
            {{- define "connection-secret" }}
            {{- $o := "{{" }}
            {{- $c := "}}" }}
            ---
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            metadata:
              name: {{ .name }}-mysql-password
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: password-generator
                gotemplating.fn.crossplane.io/ready: "True"
            spec: { length: 32, digits: 8, symbols: 0, noUpper: false, allowRepeat: true }
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ .name }}-mysql
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
            spec:
              refreshPolicy: CreatedOnce
              target:
                name: {{ .name }}-mysql
                creationPolicy: Owner
                template:
                  engineVersion: v2
                  type: Opaque
                  data:
                    host: {{ .host }}
                    port: "3306"
                    database: {{ .db }}
                    username: {{ .db }}
                    password: '{{ $o }} .password {{ $c }}'
                    uri: 'mysql://{{ .db }}:{{ $o }} .password {{ $c }}@{{ .host }}:3306/{{ .db }}{{ .query }}'
              dataFrom:
                - sourceRef:
                    generatorRef:
                      apiVersion: generators.external-secrets.io/v1alpha1
                      kind: Password
                      name: {{ .name }}-mysql-password
            {{- end }}
            {{- define "moco" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $db := dig "database" "app" $spec }}
            {{- $observed := .observed.resources | default dict }}
            {{- /* moco: a MOCO MySQLCluster in the XR's namespace (operator addon: follow-up), 3 instances with semi-sync GTID
            replication when highAvailability. MOCO has no database/user CRD, so a Job (idempotent SQL, as moco-admin from the
            operator's Secret moco-<name>) creates the database and the app user with the generated password. VERIFY: Secret
            key ADMIN_PASSWORD, primary Service name, Healthy condition. */}}
            {{- $sizes := dict
              "S" (dict "cpu" "250m" "memory" "512Mi" "limit" "1Gi")
              "M" (dict "cpu" "1" "memory" "2Gi" "limit" "4Gi")
              "L" (dict "cpu" "2" "memory" "8Gi" "limit" "8Gi") }}
            {{- $res := get $sizes (dig "size" "S" $spec) }}
            {{- $host := printf "moco-%s-primary.%s.svc" $name $ns }}
            {{- $healthy := false }}
            {{- range (dig "cluster" "resource" "status" "conditions" list $observed) }}
            {{- if and (eq .type "Healthy") (eq .status "True") }}{{ $healthy = true }}{{ end }}
            {{- end }}
            ---
            apiVersion: moco.cybozu.com/v1beta2
            kind: MySQLCluster
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
                gotemplating.fn.crossplane.io/ready: {{ ternary "True" "False" $healthy | quote }}
            spec:
              replicas: {{ ternary 3 1 (eq (toString (dig "highAvailability" false $spec)) "true") }}
              podTemplate:
                metadata:
                  labels:
                    platform.koorikla.io/mysql: {{ $name }}
                spec:
                  containers:
                    - name: mysqld
                      image: {{ $facts.mysqlImage }}
                      resources:
                        requests: { cpu: {{ $res.cpu | quote }}, memory: {{ $res.memory }} }
                        limits: { memory: {{ $res.limit }} }
              volumeClaimTemplates:
                - metadata:
                    name: mysql-data
                  spec:
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: {{ dig "storageGiB" 10 $spec | int }}Gi
            {{- template "connection-secret" (dict "name" $name "host" $host "db" $db "query" "") }}
            ---
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: {{ $name }}-mysql-init
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: init-user
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              backoffLimit: 30                        # retries until the cluster is Healthy
              template:
                spec:
                  restartPolicy: OnFailure
                  securityContext: { runAsNonRoot: true, runAsUser: 10000, seccompProfile: { type: RuntimeDefault } }
                  containers:
                    - name: init
                      image: {{ $facts.mysqlImage }}
                      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
                      env:
                        - { name: MYSQL_PWD, valueFrom: { secretKeyRef: { name: moco-{{ $name }}, key: ADMIN_PASSWORD } } }
                        - { name: APP_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $name }}-mysql, key: password } } }
                      command:
                        - sh
                        - -ec
                        - >-
                          mysql -h {{ $host }} -u moco-admin -e "CREATE DATABASE IF NOT EXISTS \`{{ $db }}\`;
                          CREATE USER IF NOT EXISTS '{{ $db }}'@'%' IDENTIFIED BY '${APP_PASSWORD}';
                          ALTER USER '{{ $db }}'@'%' IDENTIFIED BY '${APP_PASSWORD}';
                          GRANT ALL ON \`{{ $db }}\`.* TO '{{ $db }}'@'%';"
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: MySQL
            status:
              backend: moco
              endpoint: {{ $host }}
              port: 3306
              secretName: {{ $name }}-mysql
            {{- end }}
            {{- define "aws-rds" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $db := dig "database" "app" $spec }}
            {{- $size := dig "size" "S" $spec }}
            {{- $ha := eq (toString (dig "highAvailability" false $spec)) "true" }}
            {{- $storage := dig "storageGiB" 10 $spec | int }}
            {{- $observed := .observed.resources | default dict }}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 40 | trimSuffix "-" }}
            {{- $id := printf "my-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- $mp := list "*" }}
            {{- if eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- /* aws-rds skeleton: RDS for MySQL in the cluster's subnet group / security group (facts), Multi-AZ when
            highAvailability. Master password managed by RDS in Secrets Manager; the connection Secret (ESO, like
            packages/postgresql aws-rds) follows once RDS reports the endpoint. VERIFY: never applied. */}}
            ---
            apiVersion: rds.aws.m.upbound.io/v1beta1
            kind: Instance
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                engine: mysql
                engineVersion: "8.4"
                instanceClass: {{ get (dict "S" "db.t4g.medium" "M" "db.m7g.large" "L" "db.r7g.xlarge") $size }}
                allocatedStorage: {{ $storage }}
                storageEncrypted: true
                multiAz: {{ $ha }}
                dbName: {{ $db }}
                username: {{ $db }}
                manageMasterUserPassword: true
                dbSubnetGroupName: {{ $facts.dbSubnetGroupName }}
                vpcSecurityGroupIds: {{ toJson $facts.securityGroupIds }}
                publiclyAccessible: false
                port: 3306
            {{- $at := dig "instance" "resource" "status" "atProvider" dict $observed }}
            {{- $host := dig "address" "" $at }}
            {{- $arn := "" }}
            {{- with (dig "masterUserSecret" list $at) }}{{ $arn = dig "secretArn" "" (first .) }}{{ end }}
            {{- if and $host $arn }}
            {{- $o := "{{" }}
            {{- $c := "}}" }}
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ $name }}-mysql
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
            spec:
              refreshInterval: 1h                   # RDS rotates the master secret
              secretStoreRef: { kind: ClusterSecretStore, name: default }
              target:
                name: {{ $name }}-mysql
                creationPolicy: Owner
                template:
                  engineVersion: v2
                  type: Opaque
                  data:
                    host: {{ $host }}
                    port: "3306"
                    database: {{ $db }}
                    username: '{{ $o }} .username {{ $c }}'
                    password: '{{ $o }} .password {{ $c }}'
                    uri: 'mysql://{{ $o }} .username | urlquery {{ $c }}:{{ $o }} .password | urlquery {{ $c }}@{{ $host }}:3306/{{ $db }}?tls=true'
              data:
                - { secretKey: username, remoteRef: { key: {{ $arn }}, property: username } }
                - { secretKey: password, remoteRef: { key: {{ $arn }}, property: password } }
            {{- end }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: MySQL
            status:
              backend: aws-rds
              endpoint: {{ $host }}
              port: 3306
              secretName: {{ $name }}-mysql
            {{- end }}

            {{- define "gcp-cloudsql" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $db := dig "database" "app" $spec }}
            {{- $size := dig "size" "S" $spec }}
            {{- $ha := eq (toString (dig "highAvailability" false $spec)) "true" }}
            {{- $storage := dig "storageGiB" 10 $spec | int }}
            {{- $observed := .observed.resources | default dict }}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 40 | trimSuffix "-" }}
            {{- $id := printf "my-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- $mp := list "*" }}
            {{- if eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- /* gcp-cloudsql skeleton: Cloud SQL for MySQL, private IP in the cluster's VPC, REGIONAL when highAvailability;
            the app user's password comes from the connection Secret. VERIFY: never applied. */}}
            ---
            apiVersion: sql.gcp.m.upbound.io/v1beta1
            kind: DatabaseInstance
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                project: {{ $facts.project }}
                region: {{ $facts.region }}
                databaseVersion: MYSQL_8_4
                deletionProtection: {{ eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}
                settings:
                  - tier: {{ get (dict "S" "db-custom-1-3840" "M" "db-custom-2-7680" "L" "db-custom-4-15360") $size }}
                    availabilityType: {{ ternary "REGIONAL" "ZONAL" $ha }}
                    diskSize: {{ $storage }}
                    ipConfiguration:
                      - ipv4Enabled: false
                        privateNetwork: {{ $facts.network }}
            ---
            apiVersion: sql.gcp.m.upbound.io/v1beta1
            kind: Database
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database
                crossplane.io/external-name: {{ $db }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider: { project: {{ $facts.project }}, instanceRef: { name: {{ $name }} } }
            {{- $host := dig "instance" "resource" "status" "atProvider" "privateIpAddress" "" $observed }}
            {{- if $host }}
            {{- template "connection-secret" (dict "name" $name "host" $host "db" $db "query" "?tls=true") }}
            ---
            apiVersion: sql.gcp.m.upbound.io/v1beta1
            kind: User
            metadata:
              name: {{ $name }}-user
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: user
                crossplane.io/external-name: {{ $db }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                project: {{ $facts.project }}
                instanceRef: { name: {{ $name }} }
                passwordSecretRef: { name: {{ $name }}-mysql, key: password }
            {{- end }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: MySQL
            status:
              backend: gcp-cloudsql
              endpoint: {{ $host }}
              port: 3306
              secretName: {{ $name }}-mysql
            {{- end }}

            {{- define "azure-flexible" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $db := dig "database" "app" $spec }}
            {{- $size := dig "size" "S" $spec }}
            {{- $ha := eq (toString (dig "highAvailability" false $spec)) "true" }}
            {{- $storage := dig "storageGiB" 10 $spec | int }}
            {{- $observed := .observed.resources | default dict }}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 40 | trimSuffix "-" }}
            {{- $id := printf "my-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- $mp := list "*" }}
            {{- if eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- /* azure-flexible skeleton: Azure Database for MySQL Flexible Server in the cluster's delegated subnet,
            zone-redundant HA when highAvailability; the admin login is the app user (FQDN is deterministic, so the Secret comes
            first). VERIFY: never applied. */}}
            {{- $host := printf "%s.mysql.database.azure.com" $id }}
            {{- template "connection-secret" (dict "name" $name "host" $host "db" $db "query" "?tls=true") }}
            ---
            apiVersion: dbformysql.azure.m.upbound.io/v1beta1
            kind: FlexibleServer
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: server
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                resourceGroupName: {{ $facts.resourceGroupName }}
                location: {{ $facts.location }}
                version: "8.4"
                skuName: {{ get (dict "S" "B_Standard_B2s" "M" "GP_Standard_D2ds_v4" "L" "GP_Standard_D4ds_v4") $size }}
                storage: { sizeGb: {{ $storage }} }
                delegatedSubnetId: {{ $facts.delegatedSubnetId }}
                privateDnsZoneId: {{ $facts.privateDnsZoneId }}
                administratorLogin: {{ $db }}
                administratorPasswordSecretRef: { name: {{ $name }}-mysql, key: password }
                {{- if $ha }}
                highAvailability: { mode: ZoneRedundant }
                {{- end }}
            ---
            apiVersion: dbformysql.azure.m.upbound.io/v1beta1
            kind: FlexibleDatabase
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database
                crossplane.io/external-name: {{ $db }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider: { resourceGroupName: {{ $facts.resourceGroupName }}, serverNameRef: { name: {{ $name }} }, charset: utf8mb4, collation: utf8mb4_0900_ai_ci }
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: MySQL
            status:
              backend: azure-flexible
              endpoint: {{ $host }}
              port: 3306
              secretName: {{ $name }}-mysql
            {{- end }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $backend := dig "backend" "" $facts }}
            {{- if eq $backend "moco" }}{{ template "moco" . }}
            {{- else if eq $backend "aws-rds" }}{{ template "aws-rds" . }}
            {{- else if eq $backend "gcp-cloudsql" }}{{ template "gcp-cloudsql" . }}
            {{- else if eq $backend "azure-flexible" }}{{ template "azure-flexible" . }}
            {{- else }}{{ fail (printf "mysql: unknown backend %q in EnvironmentConfig platform-mysql (moco | aws-rds | gcp-cloudsql | azure-flexible)" $backend) }}
            {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
