# The one Composition of the mysql API: a three-step pipeline, the same on every cluster.
#   1. environment: function-environment-configs loads the cluster's facts, EnvironmentConfig platform-mysql.
#   2. compose-mysql: the project's embedded go-templating function, functions/compose-mysql/ - one template file per
#      composed object, Helm-style (00-prelude.yaml.gotmpl: facts, backend check, derived values; then
#      <backend>-<object>.yaml.gotmpl, each rendering only when $backend matches). Backends: moco | aws-rds | gcp-cloudsql | azure-flexible.
#   3. ready: function-auto-ready derives the XR's readiness.
# Function names are the ones Crossplane derives from the package paths (crossplane project render / run).
# Status: layout. moco is render-tested offline; cloud templates are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: mysql
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: MySQL
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-mysql
    - step: compose-mysql
      functionRef:
        name: koorikla-platform-mysqlcompose-mysql
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
