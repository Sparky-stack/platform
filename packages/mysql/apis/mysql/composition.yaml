# The one Composition of the mysql API (docs/crossplane.md): environment (EnvironmentConfig platform-mysql facts) ->
# compose-mysql (embedded go-templating, functions/compose-mysql/, one file per object) -> ready.
# Backends: moco | aws-rds | gcp-cloudsql | azure-flexible.
# Status: layout. moco is render-tested offline; cloud templates are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: mysql
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: MySQL
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-mysql
    - step: compose-mysql
      functionRef:
        name: koorikla-platform-mysqlcompose-mysql
    - step: ready
      functionRef:
        name: function-auto-ready
