# The one Composition of the valkey API: a three-step pipeline, the same on every cluster.
#   1. environment: function-environment-configs loads the cluster's facts, EnvironmentConfig platform-valkey.
#   2. compose-valkey: the project's embedded go-templating function, functions/compose-valkey/ - one template file per
#      composed object, Helm-style (00-prelude.yaml.gotmpl: facts, backend check, derived values; then
#      <backend>-<object>.yaml.gotmpl, each rendering only when $backend matches). Backends: valkey-operator | aws-elasticache | gcp-memorystore | azure-cache.
#   3. ready: function-auto-ready derives the XR's readiness.
# Function names: the upstream Functions as addons/crossplane installs them (tests/render/functions.yaml); the
# embedded one under its package-derived name (validate-render.sh builds and adds it for render tests).
# Status: layout. valkey-operator is render-tested offline; cloud templates are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: valkey
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: Valkey
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-valkey
    - step: compose-valkey
      functionRef:
        name: koorikla-platform-valkeycompose-valkey
    - step: ready
      functionRef:
        name: function-auto-ready
