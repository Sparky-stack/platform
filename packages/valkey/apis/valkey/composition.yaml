# The one Composition of the valkey API (docs/crossplane.md): environment (EnvironmentConfig platform-valkey facts) ->
# compose-valkey (embedded go-templating, functions/compose-valkey/, one file per object) -> ready.
# Backends: valkey-operator | aws-elasticache | gcp-memorystore | azure-cache.
# Status: layout. valkey-operator is render-tested offline; cloud templates are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: valkey
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: Valkey
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-valkey
    - step: compose-valkey
      functionRef:
        name: koorikla-platform-valkeycompose-valkey
    - step: ready
      functionRef:
        name: function-auto-ready
