# Sample facts of a aws-elasticache cluster (fake ids): the keys the aws-elasticache block of the Composition reads.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: platform-valkey
data:
  backend: aws-elasticache
  cluster: sample
  environment: development
  region: eu-north-1
  subnetGroupName: sample-cache
  securityGroupIds: [sg-0123456789abcdef0]
