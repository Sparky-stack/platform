# Crossplane Configuration package of the platform's PostgreSQL API (README.md). Built, signed and pushed by
# .github/workflows/package-postgresql.yaml; installed on each cluster by addons/crossplane (pinned tag@digest).
# The cluster skips dependency resolution: addons/crossplane installs the same Functions and Providers pinned by
# digest with PSS-restricted runtime configs. dependsOn still lists them so `crossplane resource validate` gets the
# schemas and the version floor is documented. Keep the floors in step with addons/crossplane/values.yaml.
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: postgresql
  annotations:
    meta.crossplane.io/maintainer: koorikla platform
    meta.crossplane.io/source: github.com/koorikla/platform/tree/main/packages/postgresql
    meta.crossplane.io/description: PostgreSQL as a service (platform.koorikla.io/v1alpha1 PostgreSQL), one API on CNPG, RDS/Aurora, Cloud SQL and Azure Flexible Server.
spec:
  crossplane:
    version: ">=v2.4.0"
  dependsOn:
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs
      version: ">=v0.9.2"
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      package: xpkg.crossplane.io/crossplane-contrib/function-go-templating
      version: ">=v0.13.2"
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.7.3"
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-aws-rds
      version: ">=v2.9.0"
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-aws-ec2
      version: ">=v2.9.0"
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-aws-kms
      version: ">=v2.9.0"
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-sql
      version: ">=v3.1.0"
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      package: xpkg.crossplane.io/crossplane-contrib/provider-azure-dbforpostgresql
      version: ">=v2.8.0"
