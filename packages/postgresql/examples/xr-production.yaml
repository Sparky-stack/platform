# Production shape: HA, backups, larger, explicit database, deleted with the XR.
apiVersion: platform.koorikla.io/v1alpha1
kind: PostgreSQL
metadata:
  name: orders-db
  namespace: dp-default-shop-production-5e6f7a8b
spec:
  version: "18"
  size: M
  storageGiB: 50
  highAvailability: true
  backup:
    enabled: true
    retentionDays: 14
  database: orders
  deletionPolicy: Delete
