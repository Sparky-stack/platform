# The developer-facing PostgreSQL API: one namespaced XR (Crossplane v2, no claims). The cluster decides the backend
# through the EnvironmentConfig platform-postgresql, read by the one Composition "postgresql" (composition.yaml).
# Contract of the result, identical on every backend: Secret status.secretName (= <name>-app) in the XR's namespace
# with keys host, port, dbname, username, password, uri. docs/data-services.md "PostgreSQL as a service".
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresqls.platform.koorikla.io
spec:
  scope: Namespaced
  group: platform.koorikla.io
  names:
    kind: PostgreSQL
    plural: postgresqls
    singular: postgresql
    categories: [platform]
  defaultCompositionRef:
    name: postgresql
  defaultCompositionUpdatePolicy: Automatic
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - { name: Backend, type: string, jsonPath: .status.backend }
        - { name: Endpoint, type: string, jsonPath: .status.endpoint }
        - { name: Secret, type: string, jsonPath: .status.secretName }
        - { name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status' }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                version:
                  description: PostgreSQL major version. Upgrades only (no downgrade).
                  type: string
                  enum: ["16", "17", "18"]
                  default: "17"
                  x-kubernetes-validations:
                    - { rule: self >= oldSelf, message: version can only be raised }
                size:
                  description: "S | M | L: compute of each instance (CNPG resources, RDS / Cloud SQL / Flexible Server class)."
                  type: string
                  enum: [S, M, L]
                  default: S
                storageGiB:
                  description: Storage per instance in GiB. Can grow, never shrink (no backend shrinks volumes).
                  type: integer
                  minimum: 10
                  maximum: 16384
                  default: 10
                  x-kubernetes-validations:
                    - { rule: self >= oldSelf, message: storageGiB can only grow }
                highAvailability:
                  description: >-
                    Standby in another zone with automatic failover: 3 CNPG instances, RDS Multi-AZ (Aurora: a reader in
                    another AZ), Cloud SQL REGIONAL, Flexible Server zone-redundant HA.
                  type: boolean
                  default: false
                backup:
                  type: object
                  default: {}
                  properties:
                    enabled:
                      description: Automated backups with point-in-time recovery (CNPG needs an object store on the cluster).
                      type: boolean
                      default: false
                    retentionDays:
                      type: integer
                      minimum: 7
                      maximum: 35
                      default: 7
                database:
                  description: >-
                    Database to create; its owner role has the same name and is the username in the connection Secret.
                    Immutable.
                  type: string
                  default: app
                  maxLength: 63
                  pattern: '^[a-z][a-z0-9_]*$'
                  x-kubernetes-validations:
                    - { rule: self == oldSelf, message: database is immutable }
                    - rule: "!(self in ['postgres', 'admin', 'administrator', 'root', 'guest', 'public', 'rdsadmin', 'azure_superuser', 'azure_pg_admin', 'cloudsqlsuperuser', 'template0', 'template1']) && !self.startsWith('pg_')"
                      message: database (also the owner role) must not be a reserved PostgreSQL or cloud role name
                engine:
                  description: "aws-rds backend only: postgres (RDS instance, Multi-AZ for HA) or aurora (Aurora PostgreSQL). Immutable."
                  type: string
                  enum: [postgres, aurora]
                  default: postgres
                  x-kubernetes-validations:
                    - { rule: self == oldSelf, message: engine is immutable }
                deletionPolicy:
                  description: >-
                    Retain keeps the cloud database (and enables deletion protection) when the XR is deleted; Delete
                    removes it. CNPG data lives in PVCs owned by the Cluster and goes with the XR either way.
                  type: string
                  enum: [Retain, Delete]
                  default: Retain
            status:
              type: object
              properties:
                backend:
                  description: cnpg | aws-rds | gcp-cloudsql | azure-flexible
                  type: string
                endpoint:
                  description: Hostname the database answers on.
                  type: string
                port:
                  type: integer
                secretName:
                  description: Connection Secret in this namespace (host, port, dbname, username, password, uri).
                  type: string
                backup:
                  description: enabled | disabled | unavailable (asked for, but this cluster has no backup target)
                  type: string
