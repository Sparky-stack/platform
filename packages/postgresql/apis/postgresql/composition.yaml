# The one Composition of the PostgreSQL API, the same on every cluster (pipeline mode):
#   1. function-environment-configs loads the cluster's facts, EnvironmentConfig platform-postgresql (written by the
#      addons/crossplane chart; required), into the pipeline context.
#   2. function-go-templating dispatches on $facts.backend to one {{ define }} per backend (cnpg | aws-rds |
#      gcp-cloudsql | azure-flexible). Only that backend's resources get rendered. An unknown or missing backend fails
#      the render with a fatal result.
#   3. function-auto-ready derives the XR's readiness.
# Each backend block reads only $xr (developer input) and $facts (cluster facts, no developer input).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresql
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: PostgreSQL
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-postgresql
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- define "cnpg" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- /* Shared preamble (the same in every compositions/*.gotmpl): the XR's spec with the XRD defaults as fallbacks,
            the cloud-side identifier and the deletion behaviour. $facts is the EnvironmentConfig data. */}}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $version := dig "version" "17" $spec | toString }}
            {{- $size := dig "size" "S" $spec }}
            {{- $storage := dig "storageGiB" 10 $spec | int }}
            {{- $ha := dig "highAvailability" false $spec }}
            {{- $backup := dig "backup" "enabled" false $spec }}
            {{- $retention := dig "backup" "retentionDays" 7 $spec | int }}
            {{- $db := dig "database" "app" $spec }}
            {{- $retain := eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}
            {{- $observed := .observed.resources | default dict }}
            {{- /* Cloud identifier: unique per cluster/namespace/name, starts with a letter, <= 52 chars, no double hyphens. */}}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 40 | trimSuffix "-" }}
            {{- $id := printf "pg-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- /* Retain: Crossplane never deletes the cloud resource (v2 managed resources have no deletionPolicy). */}}
            {{- $mp := list "*" }}
            {{- if $retain }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- /* ESO template delimiters, emitted literally into ExternalSecret templates. */}}
            {{- $o := "{{" }}
            {{- $c := "}}" }}

            {{- /* cnpg: a CloudNativePG Cluster in the XR's namespace (addon cloudnative-pg), image from the ClusterImageCatalog by
            major version, 3 instances (primary + 2 streaming replicas, automated failover) when highAvailability. The operator
            generates the password and writes the connection Secret <name>-app itself; it never leaves the namespace. Backups:
            Barman Cloud plugin (ObjectStore + ScheduledBackup) when asked for and the cluster has an object store. */}}
            {{- $sizes := dict
              "S" (dict "cpu" "100m" "memory" "256Mi" "limit" "512Mi")
              "M" (dict "cpu" "500m" "memory" "1Gi" "limit" "2Gi")
              "L" (dict "cpu" "2" "memory" "4Gi" "limit" "8Gi") }}
            {{- $res := get $sizes $size }}
            {{- $dest := dig "backup" "destinationPath" "" $facts }}
            {{- $backupOn := and $backup $dest }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
            spec:
              instances: {{ ternary 3 1 (eq (toString $ha) "true") }}
              imageCatalogRef:
                apiGroup: postgresql.cnpg.io
                kind: ClusterImageCatalog
                name: {{ $facts.imageCatalog }}
                major: {{ $version | int }}
              storage:
                size: {{ $storage }}Gi
              resources:
                requests: { cpu: {{ $res.cpu | quote }}, memory: {{ $res.memory }} }
                limits: { memory: {{ $res.limit }} }
              bootstrap:
                initdb:
                  database: {{ $db }}
                  owner: {{ $db }}
              inheritedMetadata:
                labels:
                  platform.koorikla.io/postgresql: {{ $name }}
              {{- if $backupOn }}
              plugins:
                - name: barman-cloud.cloudnative-pg.io
                  isWALArchiver: true
                  parameters:
                    barmanObjectName: {{ $name }}-backups
              {{- with (dig "backup" "serviceAccountAnnotations" dict $facts) }}
              serviceAccountTemplate:
                metadata:
                  annotations: {{ toJson . }}
              {{- end }}
              {{- end }}
            {{- if $backupOn }}
            ---
            apiVersion: barmancloud.cnpg.io/v1
            kind: ObjectStore
            metadata:
              name: {{ $name }}-backups
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: object-store
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              retentionPolicy: {{ printf "%dd" $retention | quote }}
              configuration:
                destinationPath: {{ printf "%s/%s/%s/%s" (trimSuffix "/" $dest) $facts.cluster $ns $name }}
                {{- toYaml (dig "backup" "credentials" dict $facts) | nindent 4 }}
                wal:
                  compression: gzip
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: ScheduledBackup
            metadata:
              name: {{ $name }}-daily
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: scheduled-backup
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              schedule: "0 0 3 * * *"
              backupOwnerReference: self
              cluster:
                name: {{ $name }}
              method: plugin
              pluginConfiguration:
                name: barman-cloud.cloudnative-pg.io
            {{- end }}
            {{- if $facts.podMonitor }}
            ---
            apiVersion: monitoring.coreos.com/v1
            kind: PodMonitor
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-monitor
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                matchLabels:
                  cnpg.io/cluster: {{ $name }}
              podMetricsEndpoints:
                - port: metrics
            {{- end }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: PostgreSQL
            status:
              backend: cnpg
              endpoint: {{ $name }}-rw.{{ $ns }}.svc
              port: 5432
              secretName: {{ $name }}-app
              backup: {{ if $backupOn }}enabled{{ else if $backup }}unavailable{{ else }}disabled{{ end }}
            {{- end }}
            {{- define "aws-rds" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- /* Shared preamble (the same in every compositions/*.gotmpl): the XR's spec with the XRD defaults as fallbacks,
            the cloud-side identifier and the deletion behaviour. $facts is the EnvironmentConfig data. */}}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $version := dig "version" "17" $spec | toString }}
            {{- $size := dig "size" "S" $spec }}
            {{- $storage := dig "storageGiB" 10 $spec | int }}
            {{- $ha := dig "highAvailability" false $spec }}
            {{- $backup := dig "backup" "enabled" false $spec }}
            {{- $retention := dig "backup" "retentionDays" 7 $spec | int }}
            {{- $db := dig "database" "app" $spec }}
            {{- $retain := eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}
            {{- $observed := .observed.resources | default dict }}
            {{- /* Cloud identifier: unique per cluster/namespace/name, starts with a letter, <= 52 chars, no double hyphens. */}}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 40 | trimSuffix "-" }}
            {{- $id := printf "pg-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- /* Retain: Crossplane never deletes the cloud resource (v2 managed resources have no deletionPolicy). */}}
            {{- $mp := list "*" }}
            {{- if $retain }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- /* ESO template delimiters, emitted literally into ExternalSecret templates. */}}
            {{- $o := "{{" }}
            {{- $c := "}}" }}

            {{- /* aws-rds: RDS for PostgreSQL instance (Multi-AZ when highAvailability) or Aurora PostgreSQL (spec.engine aurora),
            in the cluster's VPC, reachable only from the cluster's node security group, storage encrypted with a per-database KMS
            key, IAM database authentication on. The master password is generated and rotated by RDS in Secrets Manager
            (manageMasterUserPassword) - it never passes through Crossplane; ESO copies it into the connection Secret. */}}
            {{- $aurora := eq (dig "engine" "postgres" $spec) "aurora" }}
            {{- $classes := dict "S" "db.t4g.medium" "M" "db.m7g.large" "L" "db.r7g.xlarge" }}
            {{- if $aurora }}{{ $classes = dict "S" "db.t4g.medium" "M" "db.r7g.large" "L" "db.r7g.xlarge" }}{{ end }}
            {{- $class := get $classes $size }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- $tags := dict "platform.koorikla.io/cluster" $facts.cluster "platform.koorikla.io/namespace" $ns "platform.koorikla.io/postgresql" $name }}
            {{- $retentionPeriod := 0 }}
            {{- if $backup }}{{ $retentionPeriod = $retention }}{{ else if $aurora }}{{ $retentionPeriod = 1 }}{{ end }}
            ---
            apiVersion: kms.aws.m.upbound.io/v1beta1
            kind: Key
            metadata:
              name: {{ $name }}-storage
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kms-key
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                description: "PostgreSQL {{ $ns }}/{{ $name }} storage encryption ({{ $facts.cluster }})"
                enableKeyRotation: true
                deletionWindowInDays: 30
                tags: {{ toJson $tags }}
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroup
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: security-group
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                vpcId: {{ $facts.vpcId }}
                name: {{ $id }}
                description: "PostgreSQL {{ $ns }}/{{ $name }} - 5432 from the nodes of {{ $facts.cluster }} only"
                tags: {{ toJson $tags }}
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupIngressRule
            metadata:
              name: {{ $name }}-db-from-nodes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ingress-from-nodes
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                securityGroupIdRef:
                  name: {{ $name }}-db
                referencedSecurityGroupId: {{ $facts.nodeSecurityGroupId }}
                ipProtocol: tcp
                fromPort: 5432
                toPort: 5432
                tags: {{ toJson $tags }}
            ---
            apiVersion: rds.aws.m.upbound.io/v1beta1
            kind: SubnetGroup
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: subnet-group
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                description: "PostgreSQL {{ $ns }}/{{ $name }} ({{ $facts.cluster }})"
                subnetIds: {{ toJson $facts.subnetIds }}
                tags: {{ toJson $tags }}
            {{- $endpointKey := "instance" }}
            {{- if $aurora }}
            {{- $endpointKey = "cluster" }}
            ---
            apiVersion: rds.aws.m.upbound.io/v1beta1
            kind: Cluster
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                engine: aurora-postgresql
                engineVersion: {{ $version | quote }}     # major only: RDS picks the default minor (VERIFY on a live account)
                databaseName: {{ $db }}
                masterUsername: {{ $db }}
                manageMasterUserPassword: true
                iamDatabaseAuthenticationEnabled: true
                storageEncrypted: true
                kmsKeyIdRef:
                  name: {{ $name }}-storage
                dbSubnetGroupNameRef:
                  name: {{ $name }}
                vpcSecurityGroupIdRefs:
                  - name: {{ $name }}-db
                port: 5432
                backupRetentionPeriod: {{ $retentionPeriod }}
                copyTagsToSnapshot: true
                deletionProtection: {{ $retain }}
                skipFinalSnapshot: {{ not $backup }}
                {{- if $backup }}
                finalSnapshotIdentifier: {{ $id }}-final
                {{- end }}
                tags: {{ toJson $tags }}
            {{- /* Writer, plus a reader in another AZ (Aurora fails over to it) when highAvailability. */}}
            {{- range $i := until (ternary 2 1 (eq (toString $ha) "true")) }}
            ---
            apiVersion: rds.aws.m.upbound.io/v1beta1
            kind: ClusterInstance
            metadata:
              name: {{ $name }}-{{ $i }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster-instance-{{ $i }}
                crossplane.io/external-name: {{ $id }}-{{ $i }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                engine: aurora-postgresql
                instanceClass: {{ $class }}
                clusterIdentifierRef:
                  name: {{ $name }}
                dbSubnetGroupNameRef:
                  name: {{ $name }}
                publiclyAccessible: false
                autoMinorVersionUpgrade: true
                promotionTier: {{ $i }}
                tags: {{ toJson $tags }}
            {{- end }}
            {{- else }}
            ---
            apiVersion: rds.aws.m.upbound.io/v1beta1
            kind: Instance
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                engine: postgres
                engineVersion: {{ $version | quote }}     # major only: RDS picks the default minor, autoMinorVersionUpgrade keeps it current
                autoMinorVersionUpgrade: true
                instanceClass: {{ $class }}
                multiAz: {{ $ha }}
                allocatedStorage: {{ $storage }}
                maxAllocatedStorage: {{ mul $storage 2 }}
                storageType: gp3
                storageEncrypted: true
                kmsKeyIdRef:
                  name: {{ $name }}-storage
                dbName: {{ $db }}
                username: {{ $db }}
                manageMasterUserPassword: true
                iamDatabaseAuthenticationEnabled: true
                dbSubnetGroupNameRef:
                  name: {{ $name }}
                vpcSecurityGroupIdRefs:
                  - name: {{ $name }}-db
                publiclyAccessible: false
                port: 5432
                backupRetentionPeriod: {{ $retentionPeriod }}
                copyTagsToSnapshot: true
                deletionProtection: {{ $retain }}
                skipFinalSnapshot: {{ not $backup }}
                {{- if $backup }}
                finalSnapshotIdentifier: {{ $id }}-final
                {{- end }}
                tags: {{ toJson $tags }}
            {{- end }}
            {{- /* Connection Secret, once RDS reports the endpoint and the Secrets Manager ARN of the managed master secret. */}}
            {{- $at := dig $endpointKey "resource" "status" "atProvider" dict $observed }}
            {{- $host := ternary (dig "endpoint" "" $at) (dig "address" "" $at) $aurora }}
            {{- $secretArn := "" }}
            {{- with (dig "masterUserSecret" list $at) }}{{ $secretArn = dig "secretArn" "" (first .) }}{{ end }}
            {{- if and $host $secretArn }}
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ $name }}-app
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
            spec:
              refreshInterval: 1h                   # RDS rotates the master secret (default every 7 days)
              secretStoreRef:
                kind: ClusterSecretStore
                name: default
              target:
                name: {{ $name }}-app
                creationPolicy: Owner
                template:
                  engineVersion: v2
                  type: Opaque
                  data:
                    host: {{ $host }}
                    port: "5432"
                    dbname: {{ $db }}
                    username: '{{ $o }} .username {{ $c }}'
                    password: '{{ $o }} .password {{ $c }}'
                    uri: 'postgresql://{{ $o }} .username | urlquery {{ $c }}:{{ $o }} .password | urlquery {{ $c }}@{{ $host }}:5432/{{ $db }}?sslmode=require'
              data:
                - secretKey: username
                  remoteRef: { key: {{ $secretArn }}, property: username }
                - secretKey: password
                  remoteRef: { key: {{ $secretArn }}, property: password }
            {{- end }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: PostgreSQL
            status:
              backend: aws-rds
              backup: {{ ternary "enabled" "disabled" (eq (toString $backup) "true") }}
              {{- if $host }}
              endpoint: {{ $host }}
              port: 5432
              {{- end }}
              {{- if and $host $secretArn }}
              secretName: {{ $name }}-app
              {{- end }}
            {{- end }}
            {{- define "gcp-cloudsql" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- /* Shared preamble (the same in every compositions/*.gotmpl): the XR's spec with the XRD defaults as fallbacks,
            the cloud-side identifier and the deletion behaviour. $facts is the EnvironmentConfig data. */}}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $version := dig "version" "17" $spec | toString }}
            {{- $size := dig "size" "S" $spec }}
            {{- $storage := dig "storageGiB" 10 $spec | int }}
            {{- $ha := dig "highAvailability" false $spec }}
            {{- $backup := dig "backup" "enabled" false $spec }}
            {{- $retention := dig "backup" "retentionDays" 7 $spec | int }}
            {{- $db := dig "database" "app" $spec }}
            {{- $retain := eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}
            {{- $observed := .observed.resources | default dict }}
            {{- /* Cloud identifier: unique per cluster/namespace/name, starts with a letter, <= 52 chars, no double hyphens. */}}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 40 | trimSuffix "-" }}
            {{- $id := printf "pg-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- /* Retain: Crossplane never deletes the cloud resource (v2 managed resources have no deletionPolicy). */}}
            {{- $mp := list "*" }}
            {{- if $retain }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- /* ESO template delimiters, emitted literally into ExternalSecret templates. */}}
            {{- $o := "{{" }}
            {{- $c := "}}" }}

            {{- /* gcp-cloudsql: Cloud SQL for PostgreSQL, private IP only in the cluster's VPC, TLS required, IAM database
            authentication on, REGIONAL (synchronous standby in another zone) when highAvailability. The owner role's password is
            generated in-cluster by an ESO Password generator into the connection Secret; Crossplane's pipeline never sees it (the
            provider reads it from the Secret to set it on the user). */}}
            {{- $tiers := dict "S" "db-custom-1-3840" "M" "db-custom-2-7680" "L" "db-custom-4-15360" }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- $labels := dict "platform-koorikla-io-cluster" $facts.cluster "platform-koorikla-io-namespace" $ns "platform-koorikla-io-postgresql" ($name | replace "." "-") }}
            ---
            apiVersion: sql.gcp.m.upbound.io/v1beta1
            kind: DatabaseInstance
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                project: {{ $facts.project }}
                region: {{ $facts.region }}
                databaseVersion: POSTGRES_{{ $version }}
                deletionProtection: {{ $retain }}
                settings:
                  edition: ENTERPRISE
                  tier: {{ get $tiers $size }}
                  availabilityType: {{ ternary "REGIONAL" "ZONAL" (eq (toString $ha) "true") }}
                  diskType: PD_SSD
                  diskSize: {{ $storage }}
                  diskAutoresize: true
                  deletionProtectionEnabled: {{ $retain }}
                  ipConfiguration:
                    ipv4Enabled: false
                    privateNetwork: {{ $facts.privateNetwork }}
                    {{- with $facts.allocatedIpRange }}
                    allocatedIpRange: {{ . }}
                    {{- end }}
                    sslMode: ENCRYPTED_ONLY
                  backupConfiguration:
                    enabled: {{ $backup }}
                    pointInTimeRecoveryEnabled: {{ $backup }}
                    {{- if $backup }}
                    transactionLogRetentionDays: {{ min $retention 7 }}
                    backupRetentionSettings:
                      retainedBackups: {{ $retention }}
                      retentionUnit: COUNT
                    {{- end }}
                  databaseFlags:
                    - name: cloudsql.iam_authentication
                      value: "on"
                  userLabels: {{ toJson $labels }}
            ---
            apiVersion: sql.gcp.m.upbound.io/v1beta1
            kind: Database
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database
                crossplane.io/external-name: {{ $db }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                project: {{ $facts.project }}
                instanceRef:
                  name: {{ $name }}
            ---
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            metadata:
              name: {{ $name }}-password
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: password-generator
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              length: 32
              digits: 8
              symbols: 0                          # URI-safe without escaping
              noUpper: false
              allowRepeat: true
            {{- /* Connection Secret once the private IP is known; generated once (CreatedOnce): deleting the Secret rotates the
            password (a new one is generated and the provider applies it to the user). */}}
            {{- $host := dig "instance" "resource" "status" "atProvider" "privateIpAddress" "" $observed }}
            {{- if $host }}
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ $name }}-app
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
            spec:
              refreshPolicy: CreatedOnce
              target:
                name: {{ $name }}-app
                creationPolicy: Owner
                template:
                  engineVersion: v2
                  type: Opaque
                  data:
                    host: {{ $host }}
                    port: "5432"
                    dbname: {{ $db }}
                    username: {{ $db }}
                    password: '{{ $o }} .password {{ $c }}'
                    uri: 'postgresql://{{ $db }}:{{ $o }} .password {{ $c }}@{{ $host }}:5432/{{ $db }}?sslmode=require'
              dataFrom:
                - sourceRef:
                    generatorRef:
                      apiVersion: generators.external-secrets.io/v1alpha1
                      kind: Password
                      name: {{ $name }}-password
            ---
            apiVersion: sql.gcp.m.upbound.io/v1beta1
            kind: User
            metadata:
              name: {{ $name }}-owner
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: user
                crossplane.io/external-name: {{ $db }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                project: {{ $facts.project }}
                instanceRef:
                  name: {{ $name }}
                passwordSecretRef:
                  name: {{ $name }}-app
                  key: password
            {{- end }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: PostgreSQL
            status:
              backend: gcp-cloudsql
              backup: {{ ternary "enabled" "disabled" (eq (toString $backup) "true") }}
              {{- if $host }}
              endpoint: {{ $host }}
              port: 5432
              secretName: {{ $name }}-app
              {{- end }}
            {{- end }}
            {{- define "azure-flexible" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- /* Shared preamble (the same in every compositions/*.gotmpl): the XR's spec with the XRD defaults as fallbacks,
            the cloud-side identifier and the deletion behaviour. $facts is the EnvironmentConfig data. */}}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $version := dig "version" "17" $spec | toString }}
            {{- $size := dig "size" "S" $spec }}
            {{- $storage := dig "storageGiB" 10 $spec | int }}
            {{- $ha := dig "highAvailability" false $spec }}
            {{- $backup := dig "backup" "enabled" false $spec }}
            {{- $retention := dig "backup" "retentionDays" 7 $spec | int }}
            {{- $db := dig "database" "app" $spec }}
            {{- $retain := eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}
            {{- $observed := .observed.resources | default dict }}
            {{- /* Cloud identifier: unique per cluster/namespace/name, starts with a letter, <= 52 chars, no double hyphens. */}}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 40 | trimSuffix "-" }}
            {{- $id := printf "pg-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- /* Retain: Crossplane never deletes the cloud resource (v2 managed resources have no deletionPolicy). */}}
            {{- $mp := list "*" }}
            {{- if $retain }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- /* ESO template delimiters, emitted literally into ExternalSecret templates. */}}
            {{- $o := "{{" }}
            {{- $c := "}}" }}

            {{- /* azure-flexible: Azure Database for PostgreSQL Flexible Server with VNet integration (delegated subnet, private DNS
            zone, no public access), Entra authentication enabled next to password authentication, zone-redundant HA when
            highAvailability. The administrator password is generated in-cluster by an ESO Password generator into the connection
            Secret before the server exists (the server needs it at creation; the FQDN is deterministic); Crossplane's pipeline never
            sees it. Storage: the smallest Flexible Server size >= storageGiB. */}}
            {{- $skus := dict "S" "GP_Standard_D2ds_v5" "M" "GP_Standard_D4ds_v5" "L" "GP_Standard_D8ds_v5" }}
            {{- $storageMb := 0 }}
            {{- range $mb := list 32768 65536 131072 262144 524288 1048576 2097152 4194304 8388608 16777216 }}
            {{- if and (eq $storageMb 0) (ge $mb (mul $storage 1024)) }}{{ $storageMb = $mb }}{{ end }}
            {{- end }}
            {{- if eq $storageMb 0 }}{{ $storageMb = 16777216 }}{{ end }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- $tags := dict "platform.koorikla.io/cluster" $facts.cluster "platform.koorikla.io/namespace" $ns "platform.koorikla.io/postgresql" $name }}
            {{- $fqdn := printf "%s.postgres.database.azure.com" $id }}
            {{- $host := dig "server" "resource" "status" "atProvider" "fqdn" $fqdn $observed }}
            ---
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            metadata:
              name: {{ $name }}-password
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: password-generator
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              length: 32
              digits: 8
              symbols: 0                          # URI-safe without escaping
              noUpper: false
              allowRepeat: true
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ $name }}-app
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
            spec:
              refreshPolicy: CreatedOnce          # deleting the Secret rotates the password (the provider applies the new one)
              target:
                name: {{ $name }}-app
                creationPolicy: Owner
                template:
                  engineVersion: v2
                  type: Opaque
                  data:
                    host: {{ $fqdn }}
                    port: "5432"
                    dbname: {{ $db }}
                    username: {{ $db }}
                    password: '{{ $o }} .password {{ $c }}'
                    uri: 'postgresql://{{ $db }}:{{ $o }} .password {{ $c }}@{{ $fqdn }}:5432/{{ $db }}?sslmode=require'
              dataFrom:
                - sourceRef:
                    generatorRef:
                      apiVersion: generators.external-secrets.io/v1alpha1
                      kind: Password
                      name: {{ $name }}-password
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServer
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: server
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                resourceGroupName: {{ $facts.resourceGroupName }}
                location: {{ $facts.location }}
                version: {{ $version | quote }}
                skuName: {{ get $skus $size }}
                storageMb: {{ $storageMb }}
                autoGrowEnabled: true
                backupRetentionDays: {{ ternary $retention 7 (eq (toString $backup) "true") }}   # Azure always keeps >= 7 days
                geoRedundantBackupEnabled: false
                delegatedSubnetId: {{ $facts.delegatedSubnetId }}
                privateDnsZoneId: {{ $facts.privateDnsZoneId }}
                publicNetworkAccessEnabled: false
                administratorLogin: {{ $db }}
                administratorPasswordSecretRef:
                  name: {{ $name }}-app
                  key: password
                authentication:
                  activeDirectoryAuthEnabled: true
                  passwordAuthEnabled: true
                  tenantId: {{ $facts.tenantID }}
                {{- if $ha }}
                highAvailability:
                  mode: ZoneRedundant
                {{- end }}
                tags: {{ toJson $tags }}
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServerDatabase
            metadata:
              name: {{ $name }}-db
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database
                crossplane.io/external-name: {{ $db }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                serverIdRef:
                  name: {{ $name }}
                charset: UTF8
                collation: en_US.utf8
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: PostgreSQL
            status:
              backend: azure-flexible
              backup: {{ ternary "enabled" "disabled" (eq (toString $backup) "true") }}
              endpoint: {{ $host }}
              port: 5432
              secretName: {{ $name }}-app
            {{- end }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $backend := dig "backend" "" $facts }}
            {{- if eq $backend "cnpg" }}{{ template "cnpg" . }}
            {{- else if eq $backend "aws-rds" }}{{ template "aws-rds" . }}
            {{- else if eq $backend "gcp-cloudsql" }}{{ template "gcp-cloudsql" . }}
            {{- else if eq $backend "azure-flexible" }}{{ template "azure-flexible" . }}
            {{- else }}{{ fail (printf "postgresql: unknown backend %q in EnvironmentConfig platform-postgresql (cnpg | aws-rds | gcp-cloudsql | azure-flexible)" $backend) }}
            {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
