# The one Composition of the postgresql API (docs/crossplane.md): environment (EnvironmentConfig platform-postgresql facts) ->
# compose-postgresql (embedded go-templating, functions/compose-postgresql/, one file per object) -> ready.
# Backends: cnpg | aws-rds | gcp-cloudsql | azure-flexible.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresql
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: PostgreSQL
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-postgresql
    - step: compose-postgresql
      functionRef:
        name: koorikla-platform-postgresqlcompose-postgresql
    - step: ready
      functionRef:
        name: function-auto-ready
