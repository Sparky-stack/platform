# The one Composition of the PostgreSQL API, the same on every cluster (pipeline mode):
#   1. function-environment-configs loads the cluster's facts, EnvironmentConfig platform-postgresql (written by the
#      addons/crossplane chart; required), into the pipeline context.
#   2. compose-postgresql, the Project's embedded function (functions/compose-postgresql/: function-go-templating with
#      the templates baked in, one file per composed object and per backend, like a Helm chart's templates/). Only the
#      files of $facts.backend (cnpg | aws-rds | gcp-cloudsql | azure-flexible) render; an unknown or missing backend
#      fails the render with a fatal result (00-facts.yaml.gotmpl).
#   3. function-auto-ready derives the XR's readiness.
# The templates read only $xr (developer input) and $facts (cluster facts, no developer input).
# functionRef koorikla-platform-postgresqlcompose-postgresql: the Function name Crossplane derives from the embedded
# function's package ghcr.io/koorikla/platform/postgresql_compose-postgresql (`crossplane function generate` wrote it;
# addons/crossplane installs the Function under the same name).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresql
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: PostgreSQL
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-postgresql
    - step: compose-postgresql
      functionRef:
        name: koorikla-platform-postgresqlcompose-postgresql
    - step: ready
      functionRef:
        name: function-auto-ready
