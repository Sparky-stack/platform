# Crossplane Project of the bucket API: `crossplane project build` makes ghcr.io/koorikla/platform/bucket (docs/crossplane.md).
# Keep the dependency floors in step with the digests addons/crossplane pins.
apiVersion: dev.crossplane.io/v1alpha1
kind: Project
metadata:
  name: bucket
spec:
  dependencies:
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs
        version: '>=v0.9.2'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-go-templating
        version: '>=v0.13.2'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
        version: '>=v0.7.3'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-aws-s3
        version: '>=v2.9.0'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-storage
        version: '>=v3.1.0'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-azure-storage
        version: '>=v2.8.0'
  repository: ghcr.io/koorikla/platform/bucket
  description: S3-compatible object storage buckets
  maintainer: koorikla platform
  source: github.com/koorikla/platform/tree/main/packages/bucket
  crossplane:
    version: '>=v2.4.0'
