# The one Composition of the Bucket API (pipeline mode), same shape as packages/postgresql:
#   1. function-environment-configs loads the cluster's facts, EnvironmentConfig platform-bucket (required).
#   2. function-go-templating dispatches on $facts.backend to one {{ define }} per backend (rustfs | aws-s3 |
#      gcp-storage | azure-blob); an unknown backend fails the render. "plain-secret" is the cloud backends' shared
#      <name>-bucket Secret (no keys: workload identity).
#   3. function-auto-ready derives the XR's readiness.
# Status: layout. rustfs is render-tested offline; the cloud blocks are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: bucket
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: Bucket
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-bucket
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- /* plain-secret (dict name endpoint bucket region): cloud backends - no static keys, apps use workload identity. */}}
            {{- define "plain-secret" }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ .name }}-bucket
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
                gotemplating.fn.crossplane.io/ready: "True"
            type: Opaque
            stringData:
              endpoint: {{ .endpoint }}
              bucket: {{ .bucket }}
              region: {{ .region }}
              accessKeyId: ""
              secretAccessKey: ""
            {{- end }}
            {{- define "rustfs" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $size := dig "size" "S" $spec }}
            {{- $ha := eq (toString (dig "highAvailability" false $spec)) "true" }}
            {{- $observed := .observed.resources | default dict }}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 30 | trimSuffix "-" }}
            {{- $id := printf "bk-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- $mp := list "*" }}
            {{- if eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- /* rustfs: a single-server RustFS Tenant (rustfs/operator, rustfs.com/v1alpha1; addon: follow-up) in the XR's
            namespace that provisions the bucket, a policy scoped to it and one user holding only that policy. ESO generates the
            admin credentials (<name>-rustfs-admin, never handed to the app) and the app user's secret key (<name>-bucket).
            VERIFY: Tenant field names (credsSecret keys, users[].secret, pools.persistence), S3 Service name, Ready condition. */}}
            {{- $o := "{{" }}
            {{- $c := "}}" }}
            {{- $endpoint := printf "http://%s-io.%s.svc:9000" $name $ns }}
            {{- range $who := list "admin" "app" }}
            ---
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            metadata:
              name: {{ $name }}-rustfs-{{ $who }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: password-{{ $who }}
                gotemplating.fn.crossplane.io/ready: "True"
            spec: { length: 40, digits: 10, symbols: 0, noUpper: false, allowRepeat: true }
            {{- end }}
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ $name }}-rustfs-admin
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: admin-secret
            spec:
              refreshPolicy: CreatedOnce
              target:
                name: {{ $name }}-rustfs-admin
                template:
                  data: { accesskey: admin, secretkey: '{{ $o }} .password {{ $c }}' }
              dataFrom:
                - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: {{ $name }}-rustfs-admin } }
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ $name }}-bucket
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
            spec:
              refreshPolicy: CreatedOnce
              target:
                name: {{ $name }}-bucket
                creationPolicy: Owner
                template:
                  engineVersion: v2
                  type: Opaque
                  metadata:
                    labels: { rustfs.tenant: {{ $name }} }  # the operator re-reconciles the Tenant when it changes
                  data:
                    endpoint: {{ $endpoint }}
                    bucket: {{ $id }}
                    region: us-east-1                   # RustFS default region
                    accessKeyId: app
                    secretAccessKey: '{{ $o }} .password {{ $c }}'
              dataFrom:
                - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: {{ $name }}-rustfs-app } }
            ---
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ $name }}-bucket-policy
              labels: { rustfs.tenant: {{ $name }} }
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: policy
            data:
              policy.json: |
                {"Version": "2012-10-17", "Statement": [
                  {"Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketVersions"], "Resource": ["arn:aws:s3:::{{ $id }}"]},
                  {"Effect": "Allow", "Action": ["s3:GetObject*", "s3:PutObject*", "s3:DeleteObject*", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"], "Resource": ["arn:aws:s3:::{{ $id }}/*"]}]}
            ---
            apiVersion: rustfs.com/v1alpha1
            kind: Tenant
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: tenant
            spec:
              image: {{ $facts.rustfsImage }}
              credsSecret: { name: {{ $name }}-rustfs-admin }
              pools:
                - name: pool-0
                  servers: 1
                  persistence:
                    volumesPerServer: 1
                    volumeClaimTemplate:
                      spec:
                        accessModes: [ReadWriteOnce]
                        resources: { requests: { storage: {{ dig "storageGiB" 10 $spec | int }}Gi } }
              policies:
                - name: {{ $name }}-readwrite
                  document: { configMapKeyRef: { name: {{ $name }}-bucket-policy, key: policy.json } }
              users:
                - name: app
                  secret: { name: {{ $name }}-bucket, accessKeyKey: accessKeyId, secretKeyKey: secretAccessKey }
                  policies: [{{ $name }}-readwrite]
              buckets:
                - name: {{ $id }}
                  versioning: {{ eq (toString (dig "versioning" false $spec)) "true" }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: Bucket
            status:
              backend: rustfs
              bucket: {{ $id }}
              endpoint: {{ $endpoint }}
              secretName: {{ $name }}-bucket
            {{- end }}
            {{- define "aws-s3" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $size := dig "size" "S" $spec }}
            {{- $ha := eq (toString (dig "highAvailability" false $spec)) "true" }}
            {{- $observed := .observed.resources | default dict }}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 30 | trimSuffix "-" }}
            {{- $id := printf "bk-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- $mp := list "*" }}
            {{- if eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- /* aws-s3 skeleton: S3 bucket in the cluster's region, public access blocked, versioning on request. Apps reach it
            with workload identity (EKS Pod Identity association of the app's ServiceAccount to a bucket-scoped role: follow-up).
            VERIFY: never applied; the Pod Identity / IRSA role per app. */}}
            ---
            apiVersion: s3.aws.m.upbound.io/v1beta1
            kind: Bucket
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                tags: { platform.koorikla.io/cluster: {{ $facts.cluster }}, platform.koorikla.io/namespace: {{ $ns }} }
            ---
            apiVersion: s3.aws.m.upbound.io/v1beta1
            kind: BucketPublicAccessBlock
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: public-access-block
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                bucketRef: { name: {{ $name }} }
                blockPublicAcls: true
                blockPublicPolicy: true
                ignorePublicAcls: true
                restrictPublicBuckets: true
            ---
            apiVersion: s3.aws.m.upbound.io/v1beta1
            kind: BucketVersioning
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: versioning
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                region: {{ $facts.region }}
                bucketRef: { name: {{ $name }} }
                versioningConfiguration: { status: {{ ternary "Enabled" "Suspended" (eq (toString (dig "versioning" false $spec)) "true") }} }
            {{- $endpoint := printf "https://s3.%s.amazonaws.com" $facts.region }}
            {{- template "plain-secret" (dict "name" $name "endpoint" $endpoint "bucket" $id "region" $facts.region) }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: Bucket
            status: { backend: aws-s3, bucket: {{ $id }}, endpoint: {{ $endpoint }}, secretName: {{ $name }}-bucket }
            {{- end }}
            {{- define "gcp-storage" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $size := dig "size" "S" $spec }}
            {{- $ha := eq (toString (dig "highAvailability" false $spec)) "true" }}
            {{- $observed := .observed.resources | default dict }}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 30 | trimSuffix "-" }}
            {{- $id := printf "bk-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- $mp := list "*" }}
            {{- if eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- /* gcp-storage skeleton: GCS bucket, uniform bucket-level access, public access prevention enforced. Apps use
            Workload Identity Federation (IAM binding of the app's identity on the bucket: follow-up). S3 clients need the GCS XML
            API interop - VERIFY. Never applied. */}}
            ---
            apiVersion: storage.gcp.m.upbound.io/v1beta1
            kind: Bucket
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                project: {{ $facts.project }}
                location: {{ $facts.region }}
                uniformBucketLevelAccess: true
                publicAccessPrevention: enforced
                versioning: { enabled: {{ eq (toString (dig "versioning" false $spec)) "true" }} }
                labels: { platform-koorikla-io-cluster: {{ $facts.cluster }} }
            {{- template "plain-secret" (dict "name" $name "endpoint" "https://storage.googleapis.com" "bucket" $id "region" $facts.region) }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: Bucket
            status: { backend: gcp-storage, bucket: {{ $id }}, endpoint: "https://storage.googleapis.com", secretName: {{ $name }}-bucket }
            {{- end }}
            {{- define "azure-blob" }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec | default dict }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $size := dig "size" "S" $spec }}
            {{- $ha := eq (toString (dig "highAvailability" false $spec)) "true" }}
            {{- $observed := .observed.resources | default dict }}
            {{- $base := regexReplaceAll "-+" (printf "%s-%s" $ns $name | replace "." "-") "-" | trunc 30 | trimSuffix "-" }}
            {{- $id := printf "bk-%s-%s" $base (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 8) }}
            {{- $mp := list "*" }}
            {{- if eq (dig "deletionPolicy" "Retain" $spec) "Retain" }}{{ $mp = list "Observe" "Create" "Update" "LateInitialize" }}{{ end }}
            {{- $pc := dict "kind" "ClusterProviderConfig" "name" "default" }}
            {{- /* azure-blob skeleton: a StorageAccount per bucket (shared keys off, no public access, private network only) and a
            blob container. Apps use Azure Workload Identity (role assignment on the account: follow-up). Blob is not S3: SDKs
            use the endpoint natively - VERIFY. Never applied. */}}
            {{- $account := printf "bk%s" (sha1sum (printf "%s/%s/%s" $facts.cluster $ns $name) | trunc 22) }}
            ---
            apiVersion: storage.azure.m.upbound.io/v1beta1
            kind: Account
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: account
                crossplane.io/external-name: {{ $account }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                resourceGroupName: {{ $facts.resourceGroupName }}
                location: {{ $facts.location }}
                accountTier: Standard
                accountReplicationType: ZRS
                sharedAccessKeyEnabled: false
                allowNestedItemsToBePublic: false
                publicNetworkAccessEnabled: false
                blobProperties: { versioningEnabled: {{ eq (toString (dig "versioning" false $spec)) "true" }} }
            ---
            apiVersion: storage.azure.m.upbound.io/v1beta1
            kind: Container
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: container
                crossplane.io/external-name: {{ $id }}
            spec:
              managementPolicies: {{ toJson $mp }}
              providerConfigRef: {{ toJson $pc }}
              forProvider:
                storageAccountIdRef: { name: {{ $name }} }
                containerAccessType: private
            {{- $endpoint := printf "https://%s.blob.core.windows.net" $account }}
            {{- template "plain-secret" (dict "name" $name "endpoint" $endpoint "bucket" $id "region" $facts.location) }}
            ---
            apiVersion: platform.koorikla.io/v1alpha1
            kind: Bucket
            status: { backend: azure-blob, bucket: {{ $id }}, endpoint: {{ $endpoint }}, secretName: {{ $name }}-bucket }
            {{- end }}
            {{- $facts := index (.context | default dict) "apiextensions.crossplane.io/environment" | default dict }}
            {{- $backend := dig "backend" "" $facts }}
            {{- if eq $backend "rustfs" }}{{ template "rustfs" . }}
            {{- else if eq $backend "aws-s3" }}{{ template "aws-s3" . }}
            {{- else if eq $backend "gcp-storage" }}{{ template "gcp-storage" . }}
            {{- else if eq $backend "azure-blob" }}{{ template "azure-blob" . }}
            {{- else }}{{ fail (printf "bucket: unknown backend %q in EnvironmentConfig platform-bucket (rustfs | aws-s3 | gcp-storage | azure-blob)" $backend) }}
            {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
