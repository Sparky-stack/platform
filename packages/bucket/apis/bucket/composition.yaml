# The one Composition of the bucket API (docs/crossplane.md): environment (EnvironmentConfig platform-bucket facts) ->
# compose-bucket (embedded go-templating, functions/compose-bucket/, one file per object) -> ready.
# Backends: rustfs | aws-s3 | gcp-storage | azure-blob.
# Status: layout. rustfs is render-tested offline; cloud templates are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: bucket
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: Bucket
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-bucket
    - step: compose-bucket
      functionRef:
        name: koorikla-platform-bucketcompose-bucket
    - step: ready
      functionRef:
        name: function-auto-ready
