# OpenChoreo ClusterResourceType bucket - NOT DEPLOYED (status: layout). It lives here, not in
# addons/openchoreo-platform/files/platform/cluster-resource-types/, because every file there renders into the chart
# when dataServices.enabled and would offer an API no cluster runs yet. Enabling the API (follow-up issue) moves this
# file there. Same shape as cluster-resource-types/postgresql.yaml: renders the platform's Bucket XR into the cell
# namespace; plain values come from the XR's status, credentials stay on the data plane as secretKeyRefs.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: bucket
  annotations:
    openchoreo.dev/display-name: Object storage bucket
    openchoreo.dev/description: >-
      S3-compatible bucket through the platform API (Crossplane Bucket XR): RustFS in-cluster, S3 / GCS / Azure Blob in
      the cloud, chosen by the cluster. Cloud apps authenticate with workload identity. Needs addon crossplane.
    platform.koorikla.io/requires-addons: crossplane
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        versioning: { type: boolean, default: false }
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        storageGiB: { type: integer, minimum: 1, maximum: 4096, default: 10 }
        deletionPolicy: { type: string, enum: [Retain, Delete], default: Retain }
  retainPolicy: Retain
  outputs:
    - name: endpoint
      value: ${applied.bucket.status.endpoint}
    - name: bucket
      value: ${applied.bucket.status.bucket}
    - name: region
      secretKeyRef: { name: "${metadata.name}-bucket", key: region }
    - name: accessKeyId
      secretKeyRef: { name: "${metadata.name}-bucket", key: accessKeyId }
    - name: secretAccessKey
      secretKeyRef: { name: "${metadata.name}-bucket", key: secretAccessKey }
  resources:
    - id: bucket
      readyWhen: >-
        ${has(applied.bucket.status.conditions)
        && applied.bucket.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: platform.koorikla.io/v1alpha1
        kind: Bucket
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          versioning: ${parameters.versioning}
          storageGiB: ${environmentConfigs.storageGiB}
          deletionPolicy: ${environmentConfigs.deletionPolicy}
