# Crossplane Project of the kafka-topic API: `crossplane project build` makes ghcr.io/koorikla/platform/kafka-topic (docs/crossplane.md).
# Keep the dependency floors in step with the digests addons/crossplane pins.
# MSK and GCP Managed Kafka have no upjet topic kind (README.md).
apiVersion: dev.crossplane.io/v1alpha1
kind: Project
metadata:
  name: kafka-topic
spec:
  dependencies:
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs
        version: '>=v0.9.2'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-go-templating
        version: '>=v0.13.2'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
        version: '>=v0.7.3'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-azure-eventhub
        version: '>=v2.8.0'
  repository: ghcr.io/koorikla/platform/kafka-topic
  description: Kafka topics with credentials
  maintainer: koorikla platform
  source: github.com/koorikla/platform/tree/main/packages/kafka-topic
  crossplane:
    version: '>=v2.4.0'
