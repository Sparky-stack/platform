# Crossplane Project of the kafka-topic API (README.md, docs/crossplane.md). `crossplane project build` turns it into the
# Configuration package ghcr.io/koorikla/platform/kafka-topic. Dependencies: the three Functions of the Composition and the
# Providers whose managed resources the cloud backends compose (schemas; MSK and GCP Managed Kafka have no
# upjet topic kind, see README). Status: layout (not installed on any cluster);
# when enabled, addons/crossplane pins the same packages by digest (keep the floors in step with its values.yaml).
apiVersion: dev.crossplane.io/v1alpha1
kind: Project
metadata:
  name: kafka-topic
spec:
  dependencies:
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs
        version: '>=v0.9.2'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-go-templating
        version: '>=v0.13.2'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
        version: '>=v0.7.3'
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.crossplane.io/crossplane-contrib/provider-azure-eventhub
        version: '>=v2.8.0'
  repository: ghcr.io/koorikla/platform/kafka-topic
  description: Kafka topics with credentials
  maintainer: koorikla platform
  source: github.com/koorikla/platform/tree/main/packages/kafka-topic
  crossplane:
    version: '>=v2.4.0'
