# The one Composition of the kafka-topic API: a three-step pipeline, the same on every cluster.
#   1. environment: function-environment-configs loads the cluster's facts, EnvironmentConfig platform-kafka-topic.
#   2. compose-kafka-topic: the project's embedded go-templating function, functions/compose-kafka-topic/ - one template file per
#      composed object, Helm-style (00-prelude.yaml.gotmpl: facts, backend check, derived values; then
#      <backend>-<object>.yaml.gotmpl, each rendering only when $backend matches). Backends: strimzi | aws-msk | gcp-managedkafka | azure-eventhubs.
#   3. ready: function-auto-ready derives the XR's readiness.
# Function names are the ones Crossplane derives from the package paths (crossplane project render / run).
# Status: layout. strimzi is render-tested offline; cloud templates are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: kafka-topic
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: KafkaTopic
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-kafka-topic
    - step: compose-kafka-topic
      functionRef:
        name: koorikla-platform-kafka-topiccompose-kafka-topic
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
