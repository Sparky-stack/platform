# The one Composition of the kafka-topic API (docs/crossplane.md): environment (EnvironmentConfig platform-kafka-topic facts) ->
# compose-kafka-topic (embedded go-templating, functions/compose-kafka-topic/, one file per object) -> ready.
# Backends: strimzi | aws-msk | gcp-managedkafka | azure-eventhubs.
# Status: layout. strimzi is render-tested offline; cloud templates are skeletons (VERIFY: never applied).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: kafka-topic
spec:
  compositeTypeRef:
    apiVersion: platform.koorikla.io/v1alpha1
    kind: KafkaTopic
  mode: Pipeline
  pipeline:
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-kafka-topic
    - step: compose-kafka-topic
      functionRef:
        name: koorikla-platform-kafka-topiccompose-kafka-topic
    - step: ready
      functionRef:
        name: function-auto-ready
