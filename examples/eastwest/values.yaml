# Cross-cluster example (docs/multicluster.md "Example"). Applied by ApplicationSet example-eastwest (charts/platform,
# installation.yaml examples.eastwest.enabled) to every mesh member (cluster label mesh.platform.koorikla.io/group set).
# Values layering: this file < installations/<inst>/examples/eastwest/{values,cluster-<name>}.yaml < cluster.*.
#
# Every member gets namespace eastwest-demo (ambient) with Service echo labelled istio.io/global=true: the Service
# must exist in the caller's cluster so DNS resolves; istiod merges the endpoints of all members behind it.
# echo.enabled / client.enabled pick where pods run (locally: echo only on prod1, clients only on dev1, so every
# successful call crossed the east-west gateways).

# Generated by the ApplicationSet (defaults so `helm template` works standalone).
cluster: { name: sample }

namespace: eastwest-demo
trustDomain: cluster.local      # Istio default; principals are <trustDomain>/ns/<ns>/sa/<sa> on every member

echo:
  enabled: true
  replicas: 1
  image: docker.io/hashicorp/http-echo:1.0.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
  port: 8080
  resources:
    requests: { cpu: 5m, memory: 8Mi }
    limits: { memory: 32Mi }

# Two callers with different identities: `client` is allowed by the AuthorizationPolicy, `stranger` is not.
# Both log one line per call every intervalSeconds (kubectl logs is the live evidence).
client:
  enabled: true
  image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  intervalSeconds: 10
  resources:
    requests: { cpu: 5m, memory: 8Mi }
    limits: { memory: 32Mi }
