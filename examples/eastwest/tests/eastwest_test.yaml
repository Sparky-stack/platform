suite: eastwest example
templates:
  - templates/namespace.yaml
  - templates/echo.yaml
  - templates/clients.yaml
  - templates/authorizationpolicy.yaml
set:
  cluster.name: prod1
tests:
  - it: enrolls the namespace in ambient under Pod Security restricted
    template: templates/namespace.yaml
    asserts:
      - equal: { path: 'metadata.labels["istio.io/dataplane-mode"]', value: ambient }
      - equal: { path: 'metadata.labels["pod-security.kubernetes.io/enforce"]', value: restricted }

  - it: renders a global echo Service everywhere and the Deployment only where enabled
    template: templates/echo.yaml
    set:
      echo.enabled: false
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Service }
      - equal: { path: 'metadata.labels["istio.io/global"]', value: "true" }

  - it: answers with the cluster name, digest-pinned image, restricted security context
    template: templates/echo.yaml
    documentIndex: 2
    asserts:
      - isKind: { of: Deployment }
      - contains: { path: 'spec.template.spec.containers[0].args', content: "-text=hello from prod1" }
      - matchRegex: { path: 'spec.template.spec.containers[0].image', pattern: '@sha256:[0-9a-f]{64}$' }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: 'spec.template.spec.containers[0].securityContext.capabilities.drop', value: [ALL] }

  - it: runs an allowed and a denied caller with their own identities
    template: templates/clients.yaml
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: spec.template.spec.serviceAccountName, value: client }
        documentIndex: 1
      - equal: { path: spec.template.spec.serviceAccountName, value: stranger }
        documentIndex: 3

  - it: allows only the client identity (cluster-independent principal)
    template: templates/authorizationpolicy.yaml
    asserts:
      - isAPIVersion: { of: security.istio.io/v1 }
      - equal: { path: spec.action, value: ALLOW }
      - equal: { path: 'spec.rules[0].from[0].source.principals', value: [cluster.local/ns/eastwest-demo/sa/client] }
