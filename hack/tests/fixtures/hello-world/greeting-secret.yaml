# Vendored from Sparky-stack/hello-world deploy/openchoreo/greeting-secret.yaml (main) for hack/tests/test_tenant_demo_secrets.sh:
# every remoteRef of the demo app's SecretReferences must be seeded by installations/local/tenants/demo.yaml demoSecrets.
# Keep in sync when the app adds or renames a SecretReference.
# OpenChoreo SecretReference: a pointer to a value in OpenBao, never the value (Sparky-stack/platform docs/openchoreo.md
# "Application secrets"). The value lives in this project's own mount kv-tenant-demo, key `hello-world`, property
# `greeting`, written with the project's writer identity (Sparky-stack/platform docs/multicluster.md "Writing a secret").
# The platform renders it as an ExternalSecret on each cell namespace's SecretStore openbao-tenant (refresh 15s); this
# file names no store and cannot. Rotate: write a new version, then restart the pods (runbook
# docs/runbooks/certificates-and-secrets.md section 7 in Sparky-stack/platform).
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: hello-world-greeting
spec:
  template:
    type: Opaque
  data:
    - secretKey: greeting        # key in the Kubernetes Secret; workload.yaml secretKeyRef.key
      remoteRef:
        key: hello-world         # path inside kv-tenant-demo (never a mount name)
        property: greeting
