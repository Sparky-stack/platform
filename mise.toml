# Developer toolchain for koorikla/platform, pinned for macOS / Linux / Windows on amd64 and arm64.
#   mise install          # installs everything below (+ the helm-unittest plugin via the postinstall hook)
#   task --list           # entrypoints (Makefile targets are shims for these)
# Every tool uses the aqua backend (prebuilt release binaries, checksum-verified) except python (mise core,
# python-build-standalone). Assets for each platform are pinned in mise.lock (`task tools:lock` refreshes it).
# Why mise + Task, platform caveats: docs/dev-environment.md. Renovate understands this file (mise manager).
min_version = "2026.1.0"

[tools]
# Kubernetes / cluster lifecycle
kubectl = "1.35.10"        # aqua:kubernetes/kubernetes/kubectl; = k3s v1.35 of mgmt and workload clusters (skew +-1)
helm = "4.3.2"             # aqua:helm/helm
k3d = "5.8.3"              # aqua:k3d-io/k3d; local mgmt cluster (bootstrap/k3d-mgmt.yaml, k3d.io/v1alpha5)
clusterctl = "1.13.8"      # aqua:kubernetes-sigs/cluster-api; = CAPI core in addons/capi-providers
argocd = "3.6.1"           # aqua:argoproj/argo-cd; = Argo CD server (addons/argo-cd)
# YAML / validation
yq = "4.54.3"              # aqua:mikefarah/yq
jq = "1.8.2"               # aqua:jqlang/jq
kubeconform = "0.8.0"      # aqua:yannh/kubeconform
crane = "0.22.1"           # aqua:google/go-containerregistry; multi-arch image audit (task images:audit)
cosign = "3.1.4"           # aqua:sigstore/cosign; verifies image signatures with the pinned identity (task demo:check)
crossplane = "2.4.1"       # aqua:crossplane/cli; offline `crossplane render` of the PostgreSQL Compositions (addons/crossplane)
shellcheck = "0.11.0"      # aqua:koalaman/shellcheck
actionlint = "1.7.12"      # aqua:rhysd/actionlint
gitleaks = "8.30.1"        # aqua:gitleaks/gitleaks; secret scan of staged changes (prek.toml) and CI
# kyverno CLI: = addons/kyverno appVersion; policy tests (hack/tests/test_kyverno_policies.sh). github backend: the aqua
# registry entry pins an outdated cosign signer identity (release.yaml vs release-publish.yaml) and fails verification.
"github:kyverno/kyverno" = { version = "1.20.0", bin = "kyverno" }
python = "3.14.10"         # core:python (precompiled); hack/crd2schema.py and test.sh helpers, stdlib only
helm-docs = "1.14.2"      # aqua:norwoodj/helm-docs; chart and addon README.md generation from README.md.gotmpl + values.yaml
# Workflow
task = "3.54.0"            # aqua:go-task/task; cross-platform entrypoint (Taskfile.yml)
prek = "0.5.10"            # aqua:j178/prek; git hooks from prek.toml (task hooks:install), same hooks in CI
gh = "2.104.0"             # aqua:cli/cli; `task secrets` seeds GitHub credentials from `gh auth token`

[env]
# helm-unittest plugin version installed by the postinstall hook / `task tools:plugins`.
# renovate: datasource=github-releases depName=helm-unittest/helm-unittest extractVersion=^v(?<version>.+)$
HELM_UNITTEST_VERSION = "1.2.1"

[hooks]
# Runs after `mise install`: helm plugins are not mise tools.
postinstall = "bash hack/tools.sh plugins"

[settings]
# Lock download URLs + checksums for every supported developer platform, not just the one that ran `mise lock`.
lockfile = true
