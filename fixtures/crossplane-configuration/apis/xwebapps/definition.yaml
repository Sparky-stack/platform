apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webapps.ci.koorikla.dev
spec:
  group: ci.koorikla.dev
  names:
    kind: WebApp
    plural: webapps
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Container image to run.
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Number of replicas.
                greeting:
                  type: string
                  description: Optional GREETING env value.
            status:
              type: object
              properties:
                configMapName:
                  type: string
